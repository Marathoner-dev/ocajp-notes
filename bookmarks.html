edA`의 하위 클래스이므로 런타임 검사를 통과합니다. 그 결과를 다시 `Base` 타입 변수에 넣습니다.\n4. `b1.test()`: 인스턴스 메서드는 실제 객체 타입 기준으로 동적 바인딩되므로 `DerivedB.test()`가 실행되어 `DerivedB `를 출력합니다.\n5. `b4.test()`: 같은 `DerivedB` 객체이므로 다시 `DerivedB `를 출력합니다.\n`println`이므로 두 줄로 출력되며 보기 C에 해당합니다. 세 파일을 함께 컴파일해서 실행한 결과도 같습니다.", "optionNotes": {"A": "참조 변수 타입(`Base`)의 메서드가 호출된다고 착각한 보기입니다. 오버라이딩된 메서드는 실제 객체 타입으로 결정됩니다.", "B": "`b1`이 `Base` 메서드를 쓴다고 본 보기입니다. `b1`이 가리키는 객체는 `DerivedB`이므로 `DerivedB`가 출력됩니다.", "C": "정답입니다. 두 참조 모두 같은 `DerivedB` 객체를 가리키므로 `DerivedB.test()`가 두 번 실행됩니다.", "D": "`(DerivedA)` 캐스팅이 `DerivedA` 메서드를 호출하게 만든다고 착각한 보기입니다. 캐스팅은 객체를 바꾸지 않습니다.", "E": "`b3`의 실제 객체 `DerivedB`는 `DerivedA`이기도 하므로(is-a) `(DerivedA)` 캐스팅이 성공합니다. `ClassCastException`은 발생하지 않습니다."}, "concepts": [{"title": "동적 바인딩(가상 메서드 호출)", "body": "인스턴스 메서드 호출은 컴파일 시에 **참조 타입**에 그 메서드가 있는지 확인하고, 실행 시에 **실제 객체 타입**의 오버라이딩된 버전을 호출합니다. 캐스팅은 컴파일러가 보는 참조 타입만 바꿀 뿐 객체 자체를 바꾸지 않습니다. 반면 필드 접근과 static 메서드 호출은 참조 타입으로 결정됩니다(숨기기/hiding). 그래서 `((Base) obj).field`는 Base의 필드를 읽지만 `((Base) obj).test()`는 실제 객체의 메서드를 호출합니다."}, {"title": "참조 캐스팅의 컴파일/런타임 규칙", "body": "업캐스팅(하위 → 상위)은 항상 안전하고 캐스팅 연산자를 생략할 수 있습니다. 다운캐스팅(상위 → 하위)은 명시적 캐스팅이 필요하고, 실행 시 실제 객체가 그 타입의 인스턴스가 아니면 `ClassCastException`이 발생합니다. 서로 상속 관계가 전혀 없는 클래스 사이의 캐스팅은 컴파일 에러입니다(인터페이스로의 캐스팅은 final이 아닌 클래스라면 허용).\n```java\nBase b = new DerivedA();\nDerivedB d = (DerivedB) b; // 컴파일 OK, 런타임 ClassCastException\n```"}], "trap": "여러 번 캐스팅해서 참조 타입이 바뀌는 것처럼 보이게 하지만, 결국 모두 같은 `DerivedB` 객체를 가리키므로 오버라이딩된 메서드가 호출됩니다.", "no": 105, "topicName": "상속과 다형성", "lesson": "실제 객체가 DerivedB이면 `(DerivedA)` 캐스트는 is-a 관계라 **성공**하고, 메서드는 DerivedB의 것이 실행됩니다. `ClassCastException`(E)은 실제 객체가 그 타입이 아닐 때만 나는데, 세 번 E를 골랐습니다.", "mine": {"tries": 4, "wrong": ["E", "E", "E"]}}, {"id": "153", "topic": "inheritance", "parts": [{"type": "text", "content": "Given this segment of code:"}, {"type": "code", "content": "ArrayList<Cycle> myList = new ArrayList<>();\nmyList.add(new MotorCycle());"}, {"type": "text", "content": "Which two statements, if either were true, would make the code compile? (Choose two.)"}], "options": [{"key": "A", "text": "MotorCycle is an interface that implements the Cycle class.", "code": null}, {"key": "B", "text": "Cycle is an interface that is implemented by the MotorCycle class.", "code": null}, {"key": "C", "text": "Cycle is an abstract superclass of MotorCycle.", "code": null}, {"key": "D", "text": "Cycle and MotorCycle both extend the Transportation superclass.", "code": null}, {"key": "E", "text": "Cycle and MotorCycle both implement the Transportation interface.", "code": null}, {"key": "F", "text": "MotorCycle is a superclass of Cycle.", "code": null}], "correct": "BC", "dumpAnswer": "BC", "answerNote": "", "summary": "`ArrayList<Cycle>`에 `MotorCycle`을 넣으려면 `MotorCycle`이 `Cycle`의 하위 타입(IS-A Cycle)이어야 하므로, Cycle이 인터페이스이거나(B) 상위 클래스(C)인 경우만 컴파일됩니다.", "walkthrough": "1. `myList.add(...)`의 매개변수 타입은 `Cycle`입니다. 따라서 `new MotorCycle()`이 `Cycle` 타입으로 대입될 수 있어야 합니다. 즉 `MotorCycle IS-A Cycle`이 성립해야 합니다.\n2. B: `class MotorCycle implements Cycle` → `MotorCycle`은 `Cycle` 타입이므로 컴파일됩니다.\n3. C: `abstract class Cycle`, `class MotorCycle extends Cycle` → 하위 클래스이므로 컴파일됩니다. 추상 클래스는 인스턴스를 만들 수 없을 뿐 타입 인자, 참조 타입으로는 쓸 수 있습니다.\n4. D, E: 둘이 같은 부모를 공유할 뿐 서로는 형제 관계이므로 `MotorCycle`을 `Cycle`로 변환할 수 없습니다. 실제로 형제 클래스로 테스트하면 `MotorCycle3 cannot be converted to Cycle3` 에러가 납니다.\n5. F: 방향이 반대라서 `Cycle IS-A MotorCycle`이 되므로 `MotorCycle`을 `Cycle` 자리에 넣을 수 없습니다.", "optionNotes": {"A": "인터페이스는 클래스를 implements할 수 없습니다(인터페이스는 인터페이스만 `extends`). 전제가 Java 문법상 불가능합니다.", "B": "정답입니다. 인터페이스를 구현한 클래스는 그 인터페이스 타입이므로 `Cycle` 리스트에 넣을 수 있습니다.", "C": "정답입니다. `MotorCycle extends Cycle`이면 업캐스팅이 자동으로 일어나므로 컴파일됩니다.", "D": "`Cycle`과 `MotorCycle`이 형제 클래스일 뿐이므로 `MotorCycle`은 `Cycle`이 아닙니다. `incompatible types` 컴파일 에러가 납니다.", "E": "같은 인터페이스를 구현해도 서로 타입 관계가 생기지 않습니다. `List<Transportation>`이었다면 가능했겠지만 `List<Cycle>`에는 넣을 수 없습니다.", "F": "`MotorCycle`이 부모이면 `Cycle`이 `MotorCycle`의 하위 타입이 됩니다. 부모 객체를 자식 타입 자리에 넣을 수는 없습니다."}, "concepts": [{"title": "IS-A 관계와 대입 호환성", "body": "참조형 대입 `Parent p = new Child();`는 `Child`가 `Parent`를 `extends`(클래스)하거나 `implements`(인터페이스)할 때, 즉 상속 계층에서 위쪽 타입으로 갈 때만 자동으로 됩니다. 공통 부모를 공유하는 형제 타입끼리는 대입할 수도, 캐스팅할 수도 없습니다. 형제 클래스 간 캐스트는 컴파일 에러입니다. 메서드 인자도 같은 규칙을 따르므로 `List<Cycle>.add()`에는 `Cycle`의 하위 타입이면 무엇이든 넣을 수 있습니다."}, {"title": "클래스/인터페이스 상속 키워드 규칙", "body": "- 클래스 `extends` 클래스(하나만)\n- 클래스 `implements` 인터페이스(여러 개 가능)\n- 인터페이스 `extends` 인터페이스(여러 개 가능)\n- 인터페이스는 클래스를 상속하거나 구현할 수 없습니다.\n추상 클래스와 인터페이스는 `new`로 인스턴스를 만들 수 없지만, 변수 타입이나 제네릭 타입 인자로는 얼마든지 쓸 수 있습니다."}], "trap": "D, E처럼 \"같은 부모를 공유한다\"는 보기로 형제 관계도 호환된다고 착각하게 만들고, A처럼 문법상 불가능한 관계를 그럴듯하게 섞어 둡니다.", "no": 115, "topicName": "상속과 다형성", "lesson": "`List<Cycle>`에 넣으려면 MotorCycle이 Cycle이어야(IS-A) 하므로 Cycle은 부모 클래스(C)나 인터페이스(B)여야 합니다. 인터페이스는 클래스를 implements할 수 없고(A), 부모 타입을 자식 자리에 넣을 수 없습니다(F).", "mine": {"tries": 2, "wrong": ["AF"]}}, {"id": "27", "topic": "exceptions", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int ans;\n    try {\n        int num = 10;\n        int div = 0;\n        ans = num / div;\n    } catch (ArithmeticException ae) {\n        ans = 0;                                // line n1\n    } catch (Exception e) {\n        System.out.println(\"Invalid calculation\");\n    }\n    System.out.println(\"Answer = \" + ans);   // line n2\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Answer = 0", "code": null}, {"key": "B", "text": "Invalid calculation", "code": null}, {"key": "C", "text": "Compilation fails only at line n1.", "code": null}, {"key": "D", "text": "Compilation fails only at line n2.", "code": null}, {"key": "E", "text": "Compilation fails at line n1 and line n2.", "code": null}], "correct": "D", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. line n1의 `ans = 0;`은 문제없는 대입문입니다. 에러는 `catch (Exception e)` 경로에서 ans에 값이 대입되지 않아 line n2에서 `variable ans might not have been initialized`가 나는 것입니다. 덤프 해설의 IDE 화면도 에러 표시가 println 줄(line n2)에 있으므로 정답은 D입니다. 실제 컴파일로 확인했습니다.", "summary": "두 번째 catch 블록에서는 ans에 값이 대입되지 않으므로, 컴파일러는 line n2의 ans가 확정 할당되지 않았다고 보고 컴파일 에러를 냅니다.", "walkthrough": "1. `int ans;`는 지역 변수라서 기본값이 없습니다.\n2. 컴파일러는 실제 실행값(div = 0)이 아니라 **가능한 모든 경로**를 보고 ans가 반드시 대입되는지 판단합니다.\n3. try 블록이 정상 종료하면 `ans = num / div;`가 실행되어 대입됩니다.\n4. ArithmeticException 경로에서는 line n1의 `ans = 0;`으로 대입됩니다.\n5. 하지만 `catch (Exception e)` 경로에서는 메시지만 출력하고 ans에 대입하지 않습니다. 컴파일러는 try 블록 안에서 다른 예외가 날 수 있다고 보기 때문에 이 경로를 무시하지 않습니다.\n6. 따라서 line n2에서 ans는 확정 할당되지 않은 상태이고, `variable ans might not have been initialized` 에러가 납니다.\n7. line n1 자체에는 아무 문제가 없으므로 에러는 line n2 하나뿐입니다.", "optionNotes": {"A": "실행된다면 ArithmeticException 경로를 거쳐 `Answer = 0`이 나오겠지만, ans의 확정 할당 문제로 컴파일되지 않습니다.", "B": "실제로 발생하는 예외는 ArithmeticException이므로 실행되더라도 이 메시지는 나오지 않습니다. 애초에 컴파일되지도 않습니다.", "C": "line n1의 `ans = 0;`은 이미 선언된 int 변수에 값을 대입하는 정상 문장이라 에러가 없습니다.", "D": "정답입니다. `catch (Exception e)` 경로에서 ans가 대입되지 않으므로 line n2에서만 컴파일 에러가 납니다.", "E": "line n1에는 에러가 없으므로 두 곳 모두라는 설명은 틀렸습니다."}, "concepts": [{"title": "확정 할당(definite assignment)", "body": "지역 변수는 읽기 전에 모든 실행 경로에서 값이 대입되었다는 것을 컴파일러가 증명할 수 있어야 합니다. 컴파일러는 상수 조건(`if (true)`, `while (true)`)을 빼고는 변수의 실제 값을 추적하지 않습니다. 그래서 `int x; if (flag) x = 1; System.out.println(x);`는 flag가 늘 true여도 에러입니다. 해결하려면 선언할 때 초기화하거나 모든 분기(else, 모든 catch)에서 대입해야 합니다."}, {"title": "try-catch에서의 확정 할당", "body": "try 블록 안의 대입은 예외 때문에 실행되지 않았을 수도 있다고 간주됩니다. 그래서 try 다음 코드에서 변수를 쓰려면 모든 catch 블록에서도 대입하거나, catch에서 return이나 throw로 빠져나가야 합니다. 예를 들어 두 번째 catch 끝에 `return;`을 넣거나 `ans = -1;`을 넣으면 이 코드는 컴파일됩니다. finally에서 대입하는 방법도 있습니다."}], "trap": "0으로 나누기 때문에 'ArithmeticException 경로 → Answer = 0'이라고 실행 흐름만 따라가게 만듭니다. 컴파일러는 실행값이 아니라 모든 가능한 경로를 검사한다는 점이 핵심입니다.", "no": 118, "topicName": "예외 처리", "lesson": "컴파일러는 실행값이 아니라 **가능한 모든 경로**를 봅니다. catch 하나라도 `ans`에 값을 넣지 않으면 그 뒤에서 읽는 순간 컴파일 에러입니다. 출력(A)을 세 번 골랐습니다.", "mine": {"tries": 5, "wrong": ["B", "A", "A", "A"]}}, {"id": "S4", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "import java.io.*;\npublic class Test {\n    static void open() throws IOException {\n        throw new FileNotFoundException(\"no file\");\n    }\n    public static void main(String[] args) {\n        try {\n            open();\n        } catch (FileNotFoundException e) {\n            System.out.println(\"FNF\");\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "FNF", "code": null}, {"key": "B", "text": "no file", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "A FileNotFoundException is thrown at runtime.", "code": null}], "correct": "C", "summary": "컴파일러는 선언된 타입(`IOException`)만 보므로, 하위 예외만 catch하면 IOException이 처리되지 않았다는 컴파일 에러가 납니다.", "walkthrough": "`open()`은 실제로 `FileNotFoundException`을 던지지만, 시그니처에는 `throws IOException`이라고 선언되어 있습니다. 호출하는 쪽에서 컴파일러가 보는 것은 메서드 본문이 아니라 이 선언입니다. `main`은 `FileNotFoundException`만 잡고 있어 나머지 `IOException` 가능성이 처리되지 않았고, `main`에 throws 선언도 없습니다. 그래서 `unreported exception IOException; must be caught or declared to be thrown` 컴파일 에러가 납니다. `catch (IOException e)`를 추가하거나 `main`에 `throws IOException`을 붙이면 컴파일되고, 실행하면 `FNF`가 출력됩니다.", "optionNotes": {"A": "런타임에 실제로 던져지는 예외는 FileNotFoundException이 맞지만, 컴파일 단계를 통과하지 못합니다.", "B": "예외 메시지를 출력하는 코드는 어디에도 없습니다.", "C": "정답입니다. checked 예외 검사는 선언된 타입 기준으로 컴파일 시점에 이루어집니다.", "D": "컴파일되지 않으므로 런타임 예외도 발생하지 않습니다."}, "concepts": [{"title": "Handle or Declare 규칙", "body": "checked 예외(`RuntimeException` 계열이 아닌 `Exception` 하위 타입)를 던질 수 있는 코드는 반드시 둘 중 하나를 해야 합니다.\n- try/catch로 처리합니다(같은 타입이나 상위 타입으로 catch).\n- 메서드 선언에 `throws`로 떠넘깁니다.\n\n컴파일러는 호출하는 메서드의 **선언된** throws 절을 기준으로 검사합니다. 반대로 try 블록에서 절대 던질 수 없는 checked 예외를 catch하면(예: 아무 IO도 없는데 `catch (IOException e)`) 그것도 컴파일 에러입니다. 단, `Exception`과 `Throwable`은 예외적으로 언제든 catch할 수 있습니다."}], "trap": "본문이 FileNotFoundException을 던지니 FNF가 출력될 것처럼 보이게 만든 문제입니다. 컴파일러가 무엇을 근거로 판단하는지가 핵심입니다.", "answerNote": "", "supplement": true, "dumpAnswer": "", "no": 128, "topicName": "예외 처리", "lesson": "checked 예외는 **선언된 타입**을 기준으로 따집니다. `throws IOException` 메서드를 부르면서 `FileNotFoundException`만 잡으면 컴파일 에러입니다. 실제로 던져지는 FNF를 출력할 거라고 봤습니다(A).", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "S6", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    static void m1() {\n        try {\n            m2();\n            System.out.print(\"1 \");\n        } catch (ArithmeticException e) {\n            System.out.print(\"2 \");\n            throw new IllegalStateException();\n        } finally {\n            System.out.print(\"3 \");\n        }\n        System.out.print(\"4 \");\n    }\n    static void m2() {\n        int x = 10 / 0;\n    }\n    public static void main(String[] args) {\n        try {\n            m1();\n        } catch (RuntimeException e) {\n            System.out.print(\"5 \");\n        }\n        System.out.println(\"6\");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2 3 4 5 6", "code": null}, {"key": "B", "text": "2 3 5 6", "code": null}, {"key": "C", "text": "1 3 4 6", "code": null}, {"key": "D", "text": "2 5 6", "code": null}, {"key": "E", "text": "Compilation fails.", "code": null}], "correct": "B", "summary": "catch에서 새 예외를 던져도 finally는 먼저 실행되고, finally 뒤의 코드는 건너뛴 채 예외가 호출자로 전파됩니다.", "walkthrough": "1. `m2()`의 `10 / 0`에서 `ArithmeticException`이 발생합니다. `m2`에는 처리 코드가 없으므로 예외가 `m1`로 전파되고, `1 `은 출력되지 않습니다.\n2. `m1`의 catch가 잡아 `2 `를 출력한 뒤 `IllegalStateException`을 새로 던집니다.\n3. 메서드를 빠져나가기 전에 finally가 실행되어 `3 `이 출력됩니다.\n4. 예외가 아직 진행 중이므로 try 문 뒤의 `4 `는 실행되지 않습니다.\n5. `main`의 `catch (RuntimeException e)`가 `IllegalStateException`(RuntimeException의 하위)을 잡아 `5 `를 출력합니다.\n6. 이제 정상 흐름으로 돌아와 `6`이 출력됩니다.\n\n최종 출력은 `2 3 5 6`이며, 컴파일 후 실행해 확인했습니다.", "optionNotes": {"A": "catch에서 던진 예외가 메서드를 빠져나가므로 try 문 뒤의 `4 `는 실행되지 않습니다.", "B": "정답입니다. 2(catch), 3(finally), 5(main catch), 6 순서로 출력됩니다.", "C": "`m2()`에서 예외가 나므로 `1 `은 출력되지 않습니다.", "D": "예외가 던져지는 중에도 finally는 실행되므로 `3 `이 빠질 수 없습니다.", "E": "unchecked 예외만 사용하므로 throws 선언 없이도 컴파일됩니다."}, "concepts": [{"title": "예외 전파와 콜 스택", "body": "예외가 발생하면 JVM은 현재 메서드에서 맞는 catch를 찾고, 없으면 메서드를 종료하고 호출한 메서드로 예외를 넘깁니다. 이 과정은 main을 넘어가면 스레드가 종료되며 스택 트레이스가 출력될 때까지 반복됩니다. 각 단계에서 빠져나가는 try 블록의 finally는 모두 실행됩니다."}, {"title": "catch 안에서 예외 던지기", "body": "catch 블록에서 던진 예외는 **같은 try 문의 다른 catch로는 잡히지 않고** 바깥으로 나갑니다. finally는 그 전에 실행됩니다. 만약 finally에서도 예외를 던지면 catch에서 던진 예외는 사라지고 finally의 예외가 전파됩니다."}], "trap": "finally 뒤의 문장(4)까지 실행된다고 생각하기 쉽습니다. finally 이후 정상 흐름이 이어지는 것은 예외가 완전히 처리됐을 때뿐입니다.", "answerNote": "", "supplement": true, "dumpAnswer": "", "no": 130, "topicName": "예외 처리", "lesson": "catch에서 다시 던지면 finally를 실행한 뒤 finally 뒤 코드는 건너뛰고 호출자로 전파됩니다. RuntimeException 계열은 throws가 없어도 컴파일되므로 E는 틀렸습니다(두 번 골랐습니다).", "mine": {"tries": 2, "wrong": ["E", "E"]}}, {"id": "103", "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Vowel {\n    private char var;\n    public static void main(String[] args) {\n        char var1 = 'a';\n        char var2 = var1;\n        var2 = 'e';\n\n        Vowel obj1 = new Vowel ();\n        Vowel obj2 = obj1;\n        obj1.var = 'i';\n        obj2.var = 'o';\n\n        System.out.println(var1 + \", \" +var2);\n        System.out.print(obj1.var + \", \" +obj2.var);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "a, e\ni, o"}, {"key": "B", "text": "", "code": "a, e\no, o"}, {"key": "C", "text": "", "code": "e, e\ni, o"}, {"key": "D", "text": "", "code": "e, e\no, o"}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "char는 값이 복사되므로 var1은 'a'로 남고, obj1과 obj2는 같은 객체를 가리키므로 마지막에 대입한 'o'가 둘 다에서 보입니다.", "walkthrough": "1. `char var1 = 'a'; char var2 = var1;` 에서 `var2`에는 값 `'a'`가 복사됩니다.\n2. `var2 = 'e';`는 `var2`만 바꾸므로 `var1`은 여전히 `'a'`입니다.\n3. `Vowel obj2 = obj1;`은 참조를 복사하므로 두 변수는 같은 객체를 가리킵니다.\n4. `obj1.var = 'i';` 다음 `obj2.var = 'o';`로 같은 객체의 필드가 최종적으로 `'o'`가 됩니다.\n5. 첫 `println`이 `a, e`를 출력하고 줄을 바꿉니다.\n6. `print`가 `o, o`를 출력합니다.\n`main`은 같은 클래스 안이므로 private 필드 `var`에 접근할 수 있습니다. 또한 `var1 + \", \"`는 앞이 char여도 뒤가 String이므로 문자열 연결이 됩니다.", "optionNotes": {"A": "둘째 줄을 `i, o`로 본 답입니다. `obj1`과 `obj2`는 같은 객체이므로 마지막 대입 `'o'`가 양쪽 모두에서 보여 `o, o`가 됩니다.", "B": "정답입니다. 실제 출력은 `a, e` 다음 줄에 `o, o`입니다.", "C": "첫 줄을 `e, e`로 본 답입니다. `var1`은 기본형이라 `var2`의 변경에 영향받지 않고 `'a'`로 남습니다. 둘째 줄도 같은 객체이므로 `o, o`여야 합니다.", "D": "둘째 줄 `o, o`는 맞지만 첫 줄이 `e, e`라서 틀렸습니다. 기본형 변수끼리는 값만 복사되므로 `var1`은 `'a'`로 남습니다."}, "concepts": [{"title": "기본형 대입과 참조형 대입", "body": "기본형 변수끼리 대입하면 값 자체가 복사되므로 이후 한쪽을 바꿔도 다른 쪽은 그대로입니다. 참조형 변수끼리 대입하면 같은 객체를 가리키게 되므로, 어느 참조로 필드를 바꾸든 같은 객체가 바뀝니다. 래퍼 객체나 String은 불변이라 '바꾸는' 것처럼 보이는 연산이 실제로는 새 객체를 만든다는 점도 함께 알아 두십시오."}, {"title": "char와 + 연산", "body": "`+`는 피연산자 중 하나라도 String이면 문자열 연결이고, 둘 다 숫자형(char 포함)이면 산술 덧셈입니다. 왼쪽부터 계산하므로 `'a' + 'b' + \"\"`는 `\"195\"`, `\"\" + 'a' + 'b'`는 `\"ab\"`입니다. 이 문제의 `var1 + \", \"`는 String이 끼어 있으므로 `a, `가 됩니다."}], "trap": "참조형 두 변수에 서로 다른 값을 대입하면 각자 다른 값을 가질 것처럼 보이게 합니다. 같은 객체를 가리키면 마지막 대입만 남습니다.", "no": 21, "topicName": "자료형", "lesson": "기본형은 값이 복사되고, 참조형은 같은 객체를 공유합니다. `obj1 = obj2` 이후에는 어느 쪽으로 바꿔도 같은 객체가 바뀌므로 마지막 대입만 남습니다.", "mine": {"tries": 1, "wrong": []}}, {"id": "157", "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragments:"}, {"type": "code", "content": "class Student {\n    String name;\n    int age;\n}"}, {"type": "text", "content": "And:"}, {"type": "code", "content": "4. public class Test {\n5.     public static void main(String[] args) {\n6.         Student s1 = new Student();\n7.         Student s2 = new Student();\n8.         Student s3 = new Student();\n9.         s1 = s3;\n10.        s3 = s2;\n11.        s2 = null;\n12.    }\n13. }"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "After line 11, three objects are eligible for garbage collection.", "code": null}, {"key": "B", "text": "After line 11, two objects are eligible for garbage collection.", "code": null}, {"key": "C", "text": "After line 11, one object is eligible for garbage collection.", "code": null}, {"key": "D", "text": "After line 11, none of the objects are eligible for garbage collection.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "line 11 이후 아무도 참조하지 않는 객체는 처음 `s1`이 가리키던 객체 하나뿐이므로, GC 대상은 1개입니다.", "walkthrough": "생성된 객체를 순서대로 O1, O2, O3라고 하고 참조를 추적합니다.\n1. line 6~8: `s1→O1`, `s2→O2`, `s3→O3`.\n2. line 9 `s1 = s3;` → `s1→O3`. 이제 O1을 가리키는 변수가 없으므로 **O1은 GC 대상**입니다.\n3. line 10 `s3 = s2;` → `s3→O2`. 현재 `s1→O3`, `s2→O2`, `s3→O2`.\n4. line 11 `s2 = null;` → `s2`는 아무것도 가리키지 않지만 O2는 여전히 `s3`가 참조합니다. O3는 `s1`이 참조합니다.\n결과적으로 line 11 이후 도달할 수 없는 객체는 O1 하나입니다. 실제로 실행해 보면 `s1`, `s3` 모두 null이 아니라는 것도 확인됩니다.", "optionNotes": {"A": "O2는 `s3`, O3는 `s1`이 여전히 참조하므로 세 객체 모두 GC 대상일 수 없습니다.", "B": "`s2 = null`로 O2가 버려진 것처럼 보이지만, line 10에서 `s3`가 이미 O2를 가리키게 되었으므로 O2는 대상이 아닙니다.", "C": "정답입니다. line 9에서 `s1`이 O3로 옮겨 가면서 O1만 참조를 잃습니다.", "D": "O1은 line 9 이후 어떤 변수도 참조하지 않으므로 GC 대상이 하나 있습니다."}, "concepts": [{"title": "GC 대상(eligible) 판단법", "body": "객체는 살아 있는 스레드에서 어떤 참조 경로로도 도달할 수 없을 때 GC 대상이 됩니다. 시험에서는 표를 그려 각 줄마다 \"변수→객체\" 화살표를 갱신하고, 화살표가 하나도 없는 객체를 세면 됩니다. `null` 대입은 변수의 화살표를 지울 뿐이고, 다른 변수가 같은 객체를 가리키면 그 객체는 살아 있습니다. 객체끼리 서로만 참조하는 고립된 섬(island of isolation)도 외부에서 도달할 수 없으면 GC 대상입니다."}, {"title": "GC에 관한 시험 포인트", "body": "\"eligible\"은 수거될 자격이 있다는 뜻일 뿐 언제 수거되는지는 보장되지 않습니다. `System.gc()`는 요청일 뿐 실행을 보장하지 않습니다. 메서드가 끝나면 그 지역 변수가 사라지므로, 지역 변수만 참조하던 객체도 대상이 됩니다. String 리터럴은 상수 풀에 있어 GC 문제에서 보통 제외합니다."}], "trap": "`s2 = null`이 보이면 O2가 버려졌다고 반사적으로 세게 만들지만, 그 전에 `s3 = s2`로 참조가 복사되었다는 점을 놓치게 합니다.", "no": 24, "topicName": "자료형", "lesson": "줄마다 '변수 → 객체' 표를 그리세요. `s2 = null` 전에 `s3 = s2`로 복사됐다면 그 객체는 살아 있습니다. 세 개 모두(A)로 셌는데, GC 대상은 1개입니다.", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "123", "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "3. public static void main(String[] args) {\n4.     int x = 5;\n5.     while (isAvailable(x)) {\n6.         System.out.print(x);\n7.\n8.     }\n9. }\n10.\n11. public static boolean isAvailable(int x) {\n12.     return x-- > 0 ? true : false;\n13. }"}, {"type": "text", "content": "Which modification enables the code to print 54321?"}], "options": [{"key": "A", "text": "Replace line 6 with System.out.print(--x);", "code": null}, {"key": "B", "text": "At line 7, insert x--;", "code": null}, {"key": "C", "text": "Replace line 6 with --x; and, at line 7, insert System.out.print(x);", "code": null}, {"key": "D", "text": "Replace line 12 with return (x > 0) ? false: true;", "code": null}], "correct": "B", "dumpAnswer": "A", "answerNote": "덤프 정답 A(line 6을 `System.out.print(--x);`로 교체)는 출력 전에 감소하므로 `43210`을 출력해 틀렸습니다(실행으로 확인). 정답은 B(line 7에 `x--;` 삽입)입니다.", "summary": "isAvailable 안의 `x--`는 복사본만 줄이므로 원래 코드는 무한 루프이고, main의 x를 출력 후 1씩 줄여야(line 7에 `x--;`) 54321이 나옵니다.", "walkthrough": "1. 원래 코드: main의 x=5. `isAvailable(x)`에는 값 5의 복사본이 전달되고, `x-- > 0`은 감소 전 값 5로 비교해 true를 반환합니다. 메서드 안의 x 감소는 main의 x와 무관합니다.\n2. 따라서 main의 x는 계속 5이고 `5`가 끝없이 출력되는 무한 루프입니다.\n3. line 7에 `x--;`를 넣으면: 5 출력→x=4, 4 출력→x=3, …, 1 출력→x=0, `isAvailable(0)`에서 `0 > 0`이 false라 종료합니다. 출력 `54321`.\n4. line 6을 `print(--x)`로 바꾸면 먼저 감소 후 출력하므로 4,3,2,1,0이 출력되고(x=0 이후 종료) `43210`입니다.\n5. `--x;` 후 `print(x)`도 같은 이유로 `43210`입니다.\n6. line 12를 `(x > 0) ? false : true`로 바꾸면 x=5에서 바로 false가 되어 아무것도 출력되지 않습니다.\n각 수정안을 실제로 실행해 위 결과를 확인했습니다.", "optionNotes": {"A": "출력 전에 감소(`--x`)하므로 4,3,2,1,0이 찍혀 `43210`이 출력됩니다. 덤프 정답이지만 틀립니다.", "B": "정답입니다. 출력 후 감소하므로 5,4,3,2,1이 찍히고 x가 0이 되면 `isAvailable(0)`이 false라 루프가 끝나 `54321`입니다.", "C": "먼저 `--x`로 감소한 뒤 출력하므로 `43210`입니다.", "D": "x=5일 때 `(5 > 0) ? false : true`가 false이므로 루프 본문이 한 번도 실행되지 않아 아무것도 출력되지 않습니다.", "E": "보기 D의 잘린 나머지(`print(x);`)로, 독립된 수정안이 아닙니다.", "F": "x=5일 때 `(5 > 0) ? false : true`가 false이므로 루프 본문이 한 번도 실행되지 않아 아무것도 출력되지 않습니다."}, "concepts": [{"title": "후위 vs 전위 증감 연산자", "body": "`x--`는 현재 값을 식의 결과로 쓴 뒤 감소시키고, `--x`는 먼저 감소시킨 뒤 새 값을 결과로 씁니다. 단독 문장(`x--;`)에서는 차이가 없지만 비교·출력·대입 식 안에서는 결과가 달라집니다.\n```java\nint x = 5;\nSystem.out.print(x--); // 5 출력, x=4\nSystem.out.print(--x); // 3 출력, x=3\n```"}, {"title": "기본형 인자의 증감은 호출자에게 반영되지 않음", "body": "메서드 매개변수는 인자 값의 복사본이므로 메서드 안에서 `x--`를 해도 호출한 쪽 변수는 그대로입니다. 루프 조건을 메서드로 분리했다면 루프 변수 변경은 루프 본문(호출자 쪽)에서 해야 루프가 끝납니다."}], "trap": "isAvailable 안의 `x--`가 main의 x를 줄인다고 착각하게 만들고, 전위 감소 `--x`로 출력이 한 칸씩 밀리는 점(43210)을 노립니다.", "no": 68, "topicName": "반복문", "lesson": "메서드 안의 `x--`는 복사본만 줄이므로 main의 `x`는 그대로입니다. `--x`는 줄인 뒤 출력하고(43210), `x--`는 출력한 뒤 줄입니다.", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "51", "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Test {\n    int a1;\n\n    public static void doProduct(int a) {\n        a = a * a;\n    }\n\n    public static void doString(String s) {\n        s.concat(\" \" + s);\n    }\n\n    public static void main(String[] args) {\n        Test item = new Test();\n        item.a1 = 11;\n        String sb = \"Hello\";\n        Integer i = 10;\n        doProduct(i);\n        doString(sb);\n        doProduct(item.a1);\n        System.out.println(i + \" \" + sb + \" \" + item.a1);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 Hello Hello 11", "code": null}, {"key": "B", "text": "10 Hello Hello 121", "code": null}, {"key": "C", "text": "100 Hello 121", "code": null}, {"key": "D", "text": "100 Hello Hello 121", "code": null}, {"key": "E", "text": "10 Hello 11", "code": null}], "correct": "E", "dumpAnswer": "E", "answerNote": "", "summary": "Java는 값을 복사해서 전달하고 String은 불변이므로 `i`, `sb`, `item.a1` 모두 바뀌지 않아 `10 Hello 11`이 출력됩니다.", "walkthrough": "1. `item.a1 = 11`, `sb = \"Hello\"`, `Integer i = 10`(오토박싱)으로 시작합니다.\n2. `doProduct(i)`: `Integer`가 `int`로 언박싱되어 값 10이 매개변수 `a`에 **복사**됩니다. 메서드 안에서 `a = 100`이 되지만 지역 변수 `a`만 바뀌고 `i`는 그대로 10입니다.\n3. `doString(sb)`: 참조값이 `s`에 복사됩니다. `s.concat(\" \" + s)`는 `\"Hello Hello\"`라는 새 String을 만들지만 반환값을 버리고, String은 불변이므로 `sb`는 여전히 `\"Hello\"`입니다.\n4. `doProduct(item.a1)`: 필드 값 11이 복사되어 전달됩니다. 메서드 안에서 121로 바꾸는 것은 복사본이므로 `item.a1`은 11 그대로입니다.\n5. 따라서 `10 Hello 11`이 출력됩니다. 실행 결과도 같습니다.", "optionNotes": {"A": "`concat` 결과를 버렸고 String은 불변이므로 `sb`가 `Hello Hello`가 되지 않습니다.", "B": "`sb`도 `item.a1`도 바뀌지 않습니다. 기본형 필드 값을 넘기면 복사본만 바뀝니다.", "C": "`doProduct`는 복사된 지역 변수만 제곱하므로 `i`와 `item.a1`은 바뀌지 않습니다.", "D": "세 값 모두 바뀌지 않습니다. 메서드 호출이 원본에 영향을 준다고 착각한 보기입니다.", "E": "정답입니다. 값 복사 전달과 String 불변성 때문에 원래 값 `10 Hello 11`이 출력됩니다."}, "concepts": [{"title": "Java는 항상 값에 의한 전달(pass-by-value)", "body": "메서드에 인자를 넘기면 그 값이 매개변수에 복사됩니다. 기본형은 값 자체가, 참조형은 참조값(주소)이 복사됩니다. 그래서 매개변수에 새 값을 대입해도 호출한 쪽 변수는 바뀌지 않습니다. 다만 참조형이라면 복사된 참조로 객체의 **내부 상태**를 바꿀 수 있습니다(`item.a1 = 5`처럼). 이 문제에서 `doProduct(item.a1)`는 객체가 아니라 `int` 값을 넘기므로 원본 필드에 영향이 없습니다.\n```java\nstatic void change(Test t) { t.a1 = 99; }  // 원본 객체 변경\nstatic void reassign(Test t) { t = new Test(); } // 호출 쪽에 영향 없음\n```"}, {"title": "String 불변성과 반환값 무시", "body": "`concat`, `replace`, `toUpperCase`, `trim`, `substring` 같은 String 메서드는 원본을 바꾸지 않고 새 String을 반환합니다. 반환값을 대입하지 않으면 아무 효과도 없습니다. `StringBuilder`의 `append`, `insert`, `reverse`는 객체 자체를 바꾸므로 반환값을 버려도 효과가 남습니다. 둘을 섞어 내는 문제가 자주 나옵니다."}, {"title": "Integer 인자와 int 매개변수", "body": "`Integer`를 `int` 매개변수에 넘기면 언박싱(`i.intValue()`)된 값이 복사됩니다. 매개변수가 `Integer`였더라도 `a = a * a`는 새 Integer 객체를 지역 변수에 대입할 뿐이므로 원본은 바뀌지 않습니다. 래퍼 클래스는 String처럼 불변입니다."}], "trap": "변수 이름이 `sb`라서 StringBuilder처럼 보이지만 실제로는 String입니다. 메서드가 값을 바꾸는 것처럼 보여도 복사본만 바뀝니다.", "no": 81, "topicName": "메서드와 캡슐화", "lesson": "String과 int는 복사본으로 넘어가고 String은 불변이라, `concat` 결과를 대입하지 않으면 아무것도 바뀌지 않습니다. 변수 이름이 `sb`라도 타입을 확인하세요.", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "96", "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    int x, y;\n\n    public Test(int x, int y) {\n        initialize(x, y);\n    }\n\n    public void initialize(int x, int y) {\n        this.x = x * x;\n        this.y = y * y;\n    }\n\n    public static void main(String[] args) {\n        int x = 3, y = 5;\n        Test obj = new Test(x, y);\n        System.out.println(x + \" \" + y);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "3 5", "code": null}, {"key": "C", "text": "0 0", "code": null}, {"key": "D", "text": "9 25", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "출력하는 x, y는 main의 지역 변수이므로 객체 필드가 9, 25로 바뀌어도 3 5가 출력됩니다.", "walkthrough": "1. `main`에서 지역 변수 `x = 3`, `y = 5`를 선언합니다.\n2. `new Test(x, y)`로 생성자에 3, 5가 복사되어 전달되고, 생성자는 `initialize(3, 5)`를 호출합니다.\n3. `initialize`에서 `this.x = 9`, `this.y = 25`로 **객체의 필드**가 바뀝니다.\n4. `System.out.println(x + \" \" + y);`의 `x`, `y`는 `main`의 지역 변수입니다. static 메서드인 `main`에는 `this`가 없고, 지역 변수는 전혀 바뀌지 않았으므로 `3 5`가 출력됩니다.\n`obj.x`, `obj.y`를 출력했다면 `9 25`가 나왔을 것입니다.", "optionNotes": {"A": "생성자에서 인스턴스 메서드를 호출하는 것도, 같은 이름의 지역 변수와 필드를 쓰는 것도 합법이므로 컴파일 에러가 없습니다.", "B": "정답입니다. 출력 대상은 `main`의 지역 변수 3과 5입니다.", "C": "필드 기본값 0을 출력하는 것으로 오해한 답입니다. 출력하는 것은 지역 변수이며, 필드도 이미 9와 25로 바뀌어 있습니다.", "D": "9와 25는 `obj`의 필드 값입니다. `println`은 `obj.x`가 아니라 지역 변수 `x`를 출력합니다."}, "concepts": [{"title": "변수 스코프: 지역 변수 vs 인스턴스 필드", "body": "메서드 안에서 이름이 같은 지역 변수가 있으면 그 이름은 항상 지역 변수를 뜻합니다. static 메서드에서는 인스턴스 필드를 이름만으로 쓸 수 없고 `obj.x`처럼 참조를 거쳐야 합니다. 출력문에 어떤 변수가 쓰였는지, 그 변수의 스코프가 어디인지를 먼저 확인하는 습관을 들이십시오."}, {"title": "기본형 인자 전달", "body": "기본형은 값이 복사되어 전달되므로 호출된 메서드에서 무슨 일을 해도 호출한 쪽의 변수는 그대로입니다. 이 문제에서는 메서드가 매개변수를 바꾸지도 않았지만, 바꿨더라도 `main`의 `x`, `y`는 3, 5입니다."}], "trap": "생성자에서 제곱 계산을 보여 주어 `9 25`를 고르게 유도합니다. 출력문이 객체 필드가 아니라 지역 변수를 출력한다는 점이 핵심입니다.", "no": 89, "topicName": "메서드와 캡슐화", "lesson": "`println`이 필드(`this.x`)를 출력하는지 지역 변수(`x`)를 출력하는지 먼저 봅니다. main의 지역 변수는 객체를 만들어도 바뀌지 않습니다.", "mine": {"tries": 1, "wrong": ["C"]}}, {"id": "47", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2012, 1, 30);\n    date.plusDays(10);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2012-02-10 00:00", "code": null}, {"key": "B", "text": "2012-01-30", "code": null}, {"key": "C", "text": "2012-02-10", "code": null}, {"key": "D", "text": "A DateTimeException is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "B/C", "answerNote": "덤프마다 B/C로 표기가 다릅니다. 실제 정답은 B입니다. `LocalDate`는 불변 객체이므로 `date.plusDays(10)`은 새 객체를 반환할 뿐 `date`를 바꾸지 않고, 반환값을 버렸으므로 `2012-01-30`이 출력됩니다(직접 실행해서 확인). C는 `date = date.plusDays(10);`처럼 다시 대입했을 때의 결과입니다.\n\n**덤프 사본 비교:** LocalDate는 불변이므로 plusDays(10)의 반환값을 버리면 date는 그대로이고, 실행 결과도 2012-01-30입니다. exambible Q25와 certleader-B Q55 사본은 보기 A와 C의 순서가 바뀌어 있고(C = 2012-02-10 00:00) 정답을 C로 적었는데, 그 사본에서도 C는 틀린 답입니다.", "summary": "`LocalDate`는 불변이고 `plusDays`의 반환값을 받지 않았으므로 원래 날짜 `2012-01-30`이 출력됩니다.", "walkthrough": "1. `LocalDate.of(2012, 1, 30)`은 2012년 1월 30일을 나타내는 `LocalDate`를 만듭니다.\n2. `date.plusDays(10)`은 10일 뒤인 2012-02-09를 담은 **새** `LocalDate`를 반환합니다. 1월 30일에 10일을 더하면 2월 9일이므로 C의 02-10도 애초에 틀린 날짜입니다.\n3. 그 반환값을 어떤 변수에도 대입하지 않았으므로 새 객체는 그대로 버려집니다. `date`는 여전히 2012-01-30을 가리킵니다.\n4. `System.out.println(date)`는 `LocalDate.toString()`의 ISO 형식(`yyyy-MM-dd`)으로 `2012-01-30`을 출력합니다.\n`LocalDate`에는 시간 정보가 없으므로 `00:00`이 붙는 A는 나올 수 없고, 날짜 값이 모두 유효하므로 예외도 발생하지 않습니다.", "optionNotes": {"A": "`LocalDate`는 날짜만 가지므로 `toString()`에 시간(`00:00`)이 붙지 않습니다. 게다가 `date`는 바뀌지도 않았습니다.", "B": "정답입니다. `plusDays`의 결과를 다시 대입하지 않았으므로 `date`는 원래 값 그대로입니다.", "C": "`date = date.plusDays(10);`처럼 대입했다면 날짜가 바뀌지만, 그 경우에도 결과는 2012-02-09입니다. 이 코드에서는 원래 값이 출력됩니다.", "D": "2012년 1월 30일은 유효한 날짜이고 날짜 더하기도 정상 연산이므로 `DateTimeException`이 발생하지 않습니다."}, "concepts": [{"title": "java.time 클래스의 불변성", "body": "`LocalDate`, `LocalTime`, `LocalDateTime`, `Period`는 모두 불변(immutable)입니다. `plusDays`, `minusMonths`, `withYear` 같은 메서드는 원본을 고치지 않고 새 객체를 반환합니다. 따라서 결과를 쓰려면 반드시 다시 대입해야 합니다.\n```java\nLocalDate d = LocalDate.of(2012, 1, 30);\nd.plusDays(10);        // 효과 없음\nd = d.plusDays(10);    // 2012-02-09\n```\nString의 `concat`, `toUpperCase`도 같은 원리이므로 함께 기억해 두면 좋습니다."}, {"title": "LocalDate/LocalDateTime의 toString 형식", "body": "`LocalDate.toString()`은 `2012-01-30`처럼 ISO-8601 `yyyy-MM-dd` 형식입니다. `LocalDateTime.toString()`은 `2012-01-30T10:15`처럼 날짜와 시간 사이에 `T`가 들어가고, 초가 0이면 초 부분은 생략됩니다. `LocalDate`에는 시간 필드가 없으므로 시간이 출력되는 보기는 바로 지울 수 있습니다."}], "trap": "날짜를 더하는 메서드를 호출하고 결과를 버리는 패턴입니다. 불변 객체이므로 원본 값이 그대로 출력됩니다.", "no": 137, "topicName": "Java API", "lesson": "`date.plusDays(10);`만 하고 대입하지 않았으므로 원래 날짜 `2012-01-30`이 그대로 출력됩니다. 대입했더라도 1월은 31일까지라 `2012-02-09`가 되므로, C(`2012-02-10`)는 어느 쪽이든 틀립니다.", "mine": {"tries": 1, "wrong": ["C"]}}, {"id": "124", "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "String[] strs = new String[2];\nint idx = 0;\nfor (String s : strs) {\n    strs[idx].concat(\" element \" + idx);\n    idx++;\n}\nfor (idx = 0; idx < strs.length; idx++) {\n    System.out.println(strs[idx]);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "element 0\nelement 1"}, {"key": "B", "text": "", "code": "null element 0\nnull element 1"}, {"key": "C", "text": "", "code": "null\nnull"}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "C", "answerNote": "덤프 정답 C(null null)는 틀렸습니다. `new String[2]`의 요소는 null이므로 첫 반복의 `strs[0].concat(...)`에서 NullPointerException이 발생합니다. 실제 실행에서도 NPE가 발생했습니다. (설령 요소가 null이 아니더라도 concat 결과를 버리므로 값은 바뀌지 않는다는 점이 이 문제의 두 번째 포인트입니다.)", "summary": "`new String[2]`의 요소는 null이라 `strs[idx].concat(...)` 호출 시 NullPointerException이 발생합니다.", "walkthrough": "1. `String[] strs = new String[2];`는 길이 2 배열을 만들고 두 요소를 모두 null로 초기화합니다.\n2. 향상된 for문 첫 반복에서 `s`는 null이고, 본문은 `strs[0].concat(\" element \" + 0)`을 실행합니다.\n3. `strs[0]`이 null인데 인스턴스 메서드 `concat`을 호출하므로 즉시 NullPointerException이 발생하고 프로그램이 종료됩니다.\n4. 따라서 두 번째 for문의 출력은 실행되지 않습니다.\n참고로 요소가 \"a\"처럼 초기화되어 있었다면 concat은 새 String을 반환할 뿐 원본을 바꾸지 않으므로(반환값을 버림) 원래 값이 그대로 출력됩니다.", "optionNotes": {"A": "요소가 null이라 concat 호출 단계에서 NPE가 납니다. 또 String은 불변이라 concat 결과를 대입하지 않으면 배열 값이 바뀌지 않습니다.", "B": "null에 대해 메서드를 호출할 수 없으므로 \"null element 0\" 같은 문자열이 만들어지지 않습니다. `null + \" element\"`처럼 연결 연산자를 썼을 때만 \"null\"이 문자열로 바뀝니다.", "C": "출력 루프까지 도달하지 못합니다. 첫 번째 루프에서 null 참조로 concat을 호출하는 순간 NPE가 발생합니다.", "D": "정답입니다. `strs[0]`이 null인 상태에서 `concat()`을 호출해 NullPointerException이 던져집니다."}, "concepts": [{"title": "null 참조에 메서드 호출 vs 문자열 연결", "body": "참조형 배열 요소의 기본값은 null입니다. null에 대해 `.concat()`, `.length()` 같은 인스턴스 메서드를 호출하면 NullPointerException이 납니다. 반면 `+` 문자열 연결이나 `println(null참조)`는 null을 \"null\"로 바꿔 처리하므로 예외가 나지 않습니다.\n```java\nString s = null;\nSystem.out.println(s + \"!\");   // null!\nSystem.out.println(s.concat(\"!\")); // NullPointerException\n```"}, {"title": "String 불변성과 반환값 무시", "body": "String의 `concat`, `toUpperCase`, `replace`, `trim`, `substring` 등은 원본을 바꾸지 않고 새 String을 반환합니다. 반환값을 변수에 다시 대입하지 않으면 아무 효과가 없습니다. 원본을 직접 바꾸려면 StringBuilder의 `append`, `insert`, `reverse` 등을 사용합니다."}], "trap": "String 불변성(값이 안 바뀜)에만 집중해 null 출력을 고르게 만들지만, 그 전에 null 요소에 메서드를 호출해 NPE가 난다는 점이 핵심입니다.", "no": 52, "topicName": "배열", "lesson": "`new String[2]`는 String 2개가 아니라 **null 2개**입니다. null에 `concat`을 호출하면 NPE입니다. 불변성을 따지기 전에 NPE부터 봅니다.", "mine": {"tries": 1, "wrong": []}}, {"id": "12", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2012, 01, 32);\n    date.plusDays(10);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2012-02-10", "code": null}, {"key": "B", "text": "2012-02-11", "code": null}, {"key": "C", "text": "Compilation fails", "code": null}, {"key": "D", "text": "A DateTimeException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "`LocalDate.of(2012, 01, 32)`는 존재하지 않는 날짜라 런타임에 DateTimeException이 납니다.", "walkthrough": "1. `01`은 앞에 0이 붙은 8진수 리터럴이지만 값은 1이므로 컴파일에는 문제가 없습니다. 반면 `08`이나 `09`라면 \"illegal digit in an octal literal\" 컴파일 에러가 납니다(실제로 확인했습니다).\n2. `LocalDate.of(2012, 1, 32)`가 실행되면 일(day-of-month) 값을 검사합니다. 32는 범위(1~28/31)를 벗어나므로 `java.time.DateTimeException: Invalid value for DayOfMonth (valid values 1 - 28/31): 32`가 발생합니다.\n3. 예외가 첫 줄에서 발생하므로 이후 코드는 실행되지 않습니다.\n4. 참고로 날짜가 정상이었더라도 `date.plusDays(10);`의 반환값을 버렸기 때문에 `date`는 바뀌지 않습니다. LocalDate는 불변 객체입니다.\n정답은 D입니다.", "optionNotes": {"A": "1월 32일을 2월 1일로 넘겨 계산해 주지 않습니다. LocalDate.of는 잘못된 값을 보정하지 않고 예외를 던집니다. 게다가 plusDays 결과를 대입하지 않았으므로 날짜가 바뀌어 출력되지도 않습니다.", "B": "A와 같은 이유로 틀립니다. 생성 단계에서 예외가 발생합니다.", "C": "`01`은 유효한 8진수 리터럴(값 1)이고, 일 값 32는 int로 문법상 유효하므로 컴파일됩니다. 값 검사는 런타임에 일어납니다.", "D": "정답입니다. 32일은 유효하지 않으므로 `LocalDate.of`가 런타임에 DateTimeException을 던집니다."}, "concepts": [{"title": "LocalDate 생성과 유효성 검사", "body": "`LocalDate.of(year, month, day)`는 월(1~12)과 일(해당 월의 일수)을 검사하고, 잘못되면 `DateTimeException`(RuntimeException)을 던집니다. 예: `LocalDate.of(2015, 2, 29)`도 평년이라 예외이고, `LocalDate.of(2016, 2, 29)`는 윤년이라 정상입니다. 월은 0부터가 아니라 1부터 시작하며, `Month.JANUARY` 같은 enum도 받습니다. LocalDate에는 public 생성자가 없으므로 `new LocalDate()`는 컴파일 에러입니다."}, {"title": "java.time 클래스는 불변", "body": "`LocalDate`, `LocalTime`, `LocalDateTime`, `Period`의 `plusXxx`/`minusXxx`/`withXxx` 메서드는 원본을 바꾸지 않고 새 객체를 반환합니다. 그래서 `date.plusDays(10);`처럼 결과를 버리면 아무 효과가 없고, `date = date.plusDays(10);`처럼 다시 대입해야 합니다. 시험에서는 반환값을 버리는 코드로 \"원래 날짜 그대로 출력\" 보기를 정답으로 만드는 경우가 많습니다."}, {"title": "정수 리터럴 진법", "body": "`0`으로 시작하면 8진수(`017` = 15), `0x`는 16진수, `0b`는 2진수(Java 7+)입니다. 8진수에는 0~7만 쓸 수 있으므로 `08`, `09`는 컴파일 에러입니다. 날짜 문제에서 `LocalDate.of(2015, 08, 1)` 같은 코드는 런타임 예외가 아니라 컴파일 에러라는 점을 구분하세요."}], "trap": "plusDays를 계산해 2월 날짜를 고르게 유도하지만, 생성 시점에 이미 예외가 납니다. 반환값을 버리는 plusDays도 이중 함정입니다.", "no": 132, "topicName": "Java API", "lesson": "`LocalDate.of(2012, 01, 32)`는 존재하지 않는 날짜라 실행 시 `DateTimeException`입니다. 날짜 더하기(B)를 계산하기 전에 인자 범위부터 확인하세요. 두 번 B를 골랐습니다.", "mine": {"tries": 2, "wrong": ["B", "B"]}}, {"id": "56", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "LocalDate date1 = LocalDate.now();\nLocalDate date2 = LocalDate.of(6, 20, 2014 );\nLocalDate date3 = LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE);\nSystem.out.println(\"date1 = \" + date1);\nSystem.out.println(\"date2 = \" + date2);\nSystem.out.println(\"date3 = \" + date3);"}, {"type": "text", "content": "Assume that the system date is June 20, 2014. What is the result?"}], "options": [{"key": "A", "text": "", "code": "date1 = 2014-06-20\ndate2 = 2014-06-20\ndate3 = 2014-06-20"}, {"key": "B", "text": "", "code": "date1 = 06/20/2014\ndate2 = 2014-06-20\ndate3 = Jun 20, 2014"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. `LocalDate.of`의 인자 순서는 `(year, month, dayOfMonth)`이므로 `LocalDate.of(6, 20, 2014)`는 6년 20월 2014일을 뜻합니다. 월 20은 범위(1~12)를 벗어나므로 런타임에 `DateTimeException: Invalid value for MonthOfYear (valid values 1 - 12): 20`이 발생합니다(직접 실행해서 확인). 어떤 출력도 나오기 전에 예외로 종료되므로 D가 정답입니다.", "summary": "`LocalDate.of(6, 20, 2014)`는 (연, 월, 일) 순서이므로 월이 20이 되어 런타임에 `DateTimeException`이 발생합니다.", "walkthrough": "1. `LocalDate.now()`는 정상적으로 시스템 날짜(가정상 2014-06-20)를 반환합니다.\n2. `LocalDate.of(6, 20, 2014)`: 시그니처가 `of(int year, int month, int dayOfMonth)`이므로 year=6, month=20, day=2014로 해석됩니다. 인자가 모두 `int`이므로 **컴파일은 됩니다**.\n3. 실행하면 월 값 20이 1~12 범위를 벗어나므로 `java.time.DateTimeException`(unchecked)이 발생합니다. 잡는 코드가 없으므로 `main`이 비정상 종료됩니다.\n4. 예외가 출력문보다 먼저 발생하므로 `date1 = ...`조차 출력되지 않습니다.\n참고로 3행의 `LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE)`는 정상입니다. 2행을 `LocalDate.of(2014, 6, 20)`으로 고치면 A처럼 세 줄 모두 `2014-06-20`이 출력됩니다.", "optionNotes": {"A": "인자 순서가 (월, 일, 연)이라고 착각했을 때의 출력입니다. 실제로는 2행에서 예외가 발생해 아무것도 출력되지 않습니다(덤프 정답이지만 오답).", "B": "`LocalDate.toString()`은 항상 ISO `yyyy-MM-dd` 형식이므로 `06/20/2014`나 `Jun 20, 2014` 같은 형식으로 출력되지 않습니다.", "C": "`LocalDate.of(int, int, int)`에 int 세 개를 넘겼으므로 컴파일은 정상입니다. 값의 유효성은 실행 시에만 검사합니다.", "D": "정답입니다. month=20이 유효 범위 밖이므로 실행 시 `DateTimeException`이 발생합니다."}, "concepts": [{"title": "LocalDate.of의 오버로딩과 인자 순서", "body": "`LocalDate.of(int year, int month, int dayOfMonth)`와 `LocalDate.of(int year, Month month, int dayOfMonth)`가 있습니다. 순서는 항상 **연-월-일**입니다. 월은 1부터 시작하며(0이 아님), 범위를 벗어나거나 `of(2015, 2, 29)`처럼 존재하지 않는 날짜를 넘기면 컴파일은 되지만 실행 시 `DateTimeException`이 발생합니다. `LocalTime.of(hour, minute)`, `LocalDateTime.of(year, month, day, hour, minute)`도 큰 단위에서 작은 단위 순서입니다."}, {"title": "parse와 DateTimeFormatter", "body": "`LocalDate.parse(CharSequence)`는 ISO 형식 `yyyy-MM-dd`를 기본으로 해석하고, `parse(text, formatter)`는 지정한 포맷터로 해석합니다. 형식이 맞지 않으면 `DateTimeParseException`(DateTimeException의 하위 클래스)이 발생합니다. `DateTimeFormatter.ISO_DATE`는 `2014-06-20` 또는 오프셋이 붙은 `2014-06-20+01:00`을 처리합니다. 출력 형식을 바꾸려면 `date.format(DateTimeFormatter.ofPattern(\"MM/dd/yyyy\"))`처럼 명시해야 합니다."}], "trap": "미국식 날짜 표기(월/일/연)처럼 인자를 넣어 두고, 컴파일 에러인지 런타임 예외인지 헷갈리게 만듭니다. 컴파일은 되고 실행 시 예외가 발생합니다.", "no": 138, "topicName": "Java API", "lesson": "`LocalDate.of(연, 월, 일)`이므로 `of(6, 20, 2014)`는 '6년 20월'이 되어 `DateTimeException`입니다. 미국식 월/일/연으로 읽어서 날짜를 출력(A)한다고 봤습니다.", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "78", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [] args) {\n    String names [] = {\"Thomas\", \"Peter\", \"Joseph\"};\n    String pwd [] = new String [3];\n    int idx = 0;\n    try {\n        for (String n: names) {\n            pwd [idx] = n.substring (2, 6);\n            idx++;\n        }\n    }\n    catch (Exception e) {\n        System.out.println (\"Invalid Name\");\n    }\n    for (String p: pwd) {\n        System.out.println (p);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Invalid Name", "code": null}, {"key": "B", "text": "", "code": "Invalid Name\nomas"}, {"key": "C", "text": "", "code": "Invalid Name\nomas\nnull\nnull"}, {"key": "D", "text": "", "code": "omas\nter\nseph"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`\"Peter\".substring(2, 6)`에서 예외가 나 루프가 중단되므로 `pwd`에는 `\"omas\"`만 들어가고 나머지는 `null`입니다.", "walkthrough": "1. `pwd`는 길이 3의 String 배열이며 모든 요소가 `null`로 초기화됩니다.\n2. 첫 반복 `n = \"Thomas\"`(길이 6): `substring(2, 6)`은 인덱스 2~5인 `\"omas\"`입니다. `pwd[0] = \"omas\"`, `idx = 1`.\n3. 둘째 반복 `n = \"Peter\"`(길이 5): `substring(2, 6)`의 끝 인덱스 6이 길이 5를 넘으므로 `StringIndexOutOfBoundsException`이 발생합니다. 대입 전에 예외가 났으므로 `pwd[1]`은 그대로 `null`입니다.\n4. 예외는 `catch (Exception e)`에서 잡혀 `Invalid Name`이 출력됩니다. try 블록은 중단되므로 `\"Joseph\"`은 처리되지 않습니다.\n5. 이후 for문이 `pwd`를 출력하여 `omas`, `null`, `null`이 각각 한 줄씩 출력됩니다.\n최종 출력: `Invalid Name` / `omas` / `null` / `null`.", "optionNotes": {"A": "catch 이후에도 프로그램은 계속 진행되어 `pwd` 배열을 출력하는 for문이 실행되므로 `Invalid Name`만 출력되지 않습니다.", "B": "`omas` 다음에 `pwd[1]`, `pwd[2]`의 `null`도 출력됩니다. 향상된 for문은 배열 길이 3만큼 모두 순회합니다.", "C": "정답입니다. 첫 이름만 처리된 뒤 예외로 루프가 끝나고, 나머지 요소는 기본값 `null`로 출력됩니다.", "D": "`\"Peter\"`는 길이가 5라 `substring(2, 6)`에서 예외가 발생하므로 `ter`, `seph`가 출력될 수 없습니다. D는 끝 인덱스를 무시하고 `substring(2)`처럼 계산한 결과입니다."}, "concepts": [{"title": "substring(begin, end)의 범위 규칙", "body": "`substring(begin, end)`는 인덱스 `begin`부터 `end - 1`까지를 반환합니다(끝 인덱스는 제외). 결과 길이는 `end - begin`입니다. `begin < 0`, `end > length()`, `begin > end` 중 하나라도 해당하면 `StringIndexOutOfBoundsException`이 발생합니다. `end == length()`는 허용되며, `begin == end`이면 빈 문자열을 반환합니다.\n```java\n\"Thomas\".substring(2, 6); // \"omas\"\n\"Peter\".substring(2, 5);  // \"ter\"\n\"Peter\".substring(2, 6);  // 예외\n\"abc\".substring(3);       // \"\"\n```"}, {"title": "try 블록에서 예외 발생 시 흐름", "body": "try 블록 안에서 예외가 발생하면 그 지점 이후의 문장은 실행되지 않고 바로 일치하는 catch 블록으로 이동합니다. 이 문제처럼 루프 전체가 try 안에 있으면 루프 자체가 중단됩니다. 반대로 try-catch를 루프 안에 두면 한 요소에서 예외가 나도 다음 반복을 계속합니다. catch로 예외를 처리한 뒤에는 try-catch 다음 문장부터 정상 실행이 이어집니다. 배열 요소는 기본값으로 초기화되므로 대입되지 않은 String 요소는 `null`이며, `println(null 참조)`는 `null`을 출력합니다."}], "trap": "모든 이름 길이가 6 이상이라고 생각하면 D를 고르게 됩니다. 길이 5인 `\"Peter\"`에서 예외가 나는 점과, 예외 후에도 출력 루프가 실행되는 점을 확인해야 합니다.", "no": 144, "topicName": "Java API", "lesson": "`\"Peter\"`는 길이가 5인데 `substring(2, 6)`을 하므로 예외가 납니다. 거기서 루프가 끊기므로 앞에서 채운 값만 남고 나머지는 null입니다. 문자열 길이를 하나씩 세지 않고 D를 세 번 골랐습니다.", "mine": {"tries": 4, "wrong": ["D", "D", "D"]}}, {"id": "X17", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String date = LocalDate\n                    .parse(\"2014-05-04\")\n                    .format(DateTimeFormatter.ISO_DATE_TIME);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "May 04, 2014T00:00:00.000", "code": null}, {"key": "B", "text": "2014-05-04T00:00:00.000", "code": null}, {"key": "C", "text": "5/4/14T00:00:00.000", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "choose": 1, "correct": "D", "dumpAnswersAll": ["D"], "answerNote": "", "summary": "`LocalDate`에는 시간 필드가 없는데 `ISO_DATE_TIME`은 시·분·초를 요구하므로, 실행 시 `UnsupportedTemporalTypeException`이 발생합니다.", "walkthrough": "1. `LocalDate.parse(\"2014-05-04\")`는 ISO 형식(yyyy-MM-dd) 문자열을 정상적으로 파싱해 2014년 5월 4일 `LocalDate`를 만듭니다.\n2. `.format(DateTimeFormatter.ISO_DATE_TIME)`은 날짜 + `T` + 시간(시:분:초)을 출력하는 포매터입니다.\n3. 포매터가 시간 부분을 출력하려고 `HourOfDay` 필드를 요청하지만, `LocalDate`는 날짜만 가진 객체라 그 필드를 지원하지 않습니다.\n4. 그래서 `java.time.temporal.UnsupportedTemporalTypeException: Unsupported field: HourOfDay`가 실행 시점에 던져집니다(`DateTimeException`의 하위 클래스, unchecked).\n5. 컴파일은 정상이고 `println`까지 도달하지 못하므로 정답은 D입니다.", "optionNotes": {"A": "`ISO_DATE_TIME`은 월 이름(May) 형식을 쓰지 않으며, 애초에 `LocalDate`에는 시간이 없어 예외가 발생합니다.", "B": "`LocalDateTime`이었다면 비슷한 ISO 형식이 나왔겠지만(`2014-05-04T00:00:00`), `LocalDate`에는 시간 필드가 없어 예외가 발생합니다. 시간이 0으로 자동 채워지지 않습니다.", "C": "`5/4/14` 같은 짧은 형식은 `ISO_DATE_TIME`과 무관하며, 결국 예외가 발생합니다.", "D": "정답입니다. 시간 필드가 없는 `LocalDate`를 시간까지 출력하는 포매터로 포맷하면 `UnsupportedTemporalTypeException`이 발생합니다."}, "concepts": [{"title": "java.time 타입과 포매터의 궁합", "body": "`LocalDate`는 날짜만, `LocalTime`은 시간만, `LocalDateTime`은 둘 다 가집니다. 포매터가 요구하는 필드를 객체가 가지고 있지 않으면 실행 시 `UnsupportedTemporalTypeException`이 발생합니다(컴파일 오류가 아님).\n\n- `LocalDate` + `ISO_DATE` / `ISO_LOCAL_DATE` → `2014-05-04` 정상.\n- `LocalDate` + `ISO_DATE_TIME`, `ofPattern(\"HH:mm\")` → 예외.\n- `LocalTime` + `ofPattern(\"yyyy\")` → 예외.\n- `LocalDateTime` + `ISO_DATE` → 날짜 부분만 출력되며 정상입니다(필드가 남는 것은 괜찮고, 모자라는 것이 문제)."}, {"title": "LocalDate.parse()", "body": "`LocalDate.parse(CharSequence)`는 기본으로 `ISO_LOCAL_DATE`(yyyy-MM-dd) 형식만 받습니다. \"2014-5-4\"처럼 두 자리를 지키지 않거나 다른 형식이면 `DateTimeParseException`이 발생합니다. 다른 형식은 `LocalDate.parse(text, DateTimeFormatter.ofPattern(...))`로 파싱합니다."}], "trap": "parse가 성공하니 format도 시간을 00:00으로 채워 출력할 것 같지만, `LocalDate`에는 시간 필드가 없어 예외가 발생합니다. 보기 B가 그럴듯해 보이도록 만든 함정입니다.", "added": true, "dumpAnswer": "D", "no": 158, "topicName": "Java API", "lesson": "`LocalDate`에는 시간이 없으므로 `ISO_DATE_TIME`으로 format하면 `UnsupportedTemporalTypeException`입니다. 시간이 00:00으로 채워지지 않습니다(B).", "mine": {"tries": 1, "wrong": ["B"]}}, {"id": "5", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    ArrayList<Integer> points = new ArrayList<>();\n    points.add(1);\n    points.add(2);\n    points.add(3);\n    points.add(4);\n    points.add(null);\n    points.remove(1);\n    points.remove(null);\n    System.out.println(points);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "B", "text": "[1, 2, 4]", "code": null}, {"key": "C", "text": "[1, 2, 4, null]", "code": null}, {"key": "D", "text": "[1, 3, 4, null]", "code": null}, {"key": "E", "text": "[1, 3, 4]", "code": null}, {"key": "F", "text": "Compilation fails.", "code": null}], "correct": "E", "dumpAnswer": "B", "answerNote": "덤프 정답 B는 틀렸습니다. `points.remove(1)`은 `remove(Object)`가 아니라 `remove(int index)`가 선택되어 인덱스 1의 요소(값 2)를 지웁니다. 이어서 `remove(null)`이 null을 지우므로 결과는 `[1, 3, 4]`입니다(실행으로 확인). B `[1, 2, 4]`가 나오려면 값 3을 지워야 하는데, 코드 어디에도 그런 호출은 없습니다.", "summary": "`remove(1)`은 인덱스 1을 지우고 `remove(null)`은 첫 null을 지워 `[1, 3, 4]`가 됩니다.", "walkthrough": "1. `add` 다섯 번 → `[1, 2, 3, 4, null]`. ArrayList는 null 요소를 허용합니다.\n2. `points.remove(1)`: 인자 `1`은 `int` 리터럴입니다. 오버로딩 해석의 1단계는 박싱 없이 맞는 메서드를 찾는 것이라 `remove(int index)`가 선택됩니다. 인덱스 1의 값 `2`가 삭제되어 `[1, 3, 4, null]`이 됩니다.\n3. `points.remove(null)`: `null`은 `int`가 될 수 없으므로 `remove(Object o)`가 선택됩니다. 리스트에서 처음 나오는 null(`o == null` 비교)이 삭제되어 `[1, 3, 4]`가 됩니다. NullPointerException은 나지 않습니다.\n4. `println(points)` → `[1, 3, 4]`.\n실제로 실행하면 중간 상태는 `[1, 3, 4, null]`, 최종 결과는 `[1, 3, 4]`입니다.", "optionNotes": {"A": "ArrayList는 null을 저장할 수 있고 `remove(null)`도 null을 찾아 지우는 정상 동작이라 NullPointerException은 발생하지 않습니다.", "B": "값 3을 지운 결과처럼 보이지만, `remove(1)`은 인덱스 1의 값 2를 지우므로 2가 남을 수 없습니다.", "C": "`remove(1)`을 값 1 삭제가 아니라 다른 것으로 잘못 보고, `remove(null)`도 무시한 결과입니다. null은 두 번째 remove에서 삭제됩니다.", "D": "`remove(1)`까지만 반영한 중간 상태입니다. 이어지는 `remove(null)`이 null을 지웁니다.", "E": "정답입니다. 인덱스 1의 2가 지워지고 null이 지워져 `[1, 3, 4]`가 출력됩니다.", "F": "`remove(int)`와 `remove(Object)` 모두 유효한 호출이고 `null`을 인자로 넘기는 것도 문법상 문제없으니 컴파일됩니다."}, "concepts": [{"title": "List.remove 오버로딩: remove(int) vs remove(Object)", "body": "`List<Integer>`에는 `remove(int index)`(삭제한 요소 반환)와 `remove(Object o)`(boolean 반환) 두 가지가 있습니다. 오버로딩 해석은 1) 정확히 일치하거나 기본형 확장(widening) 2) 박싱/언박싱 3) 가변인자 순서로 진행되므로, `int` 인자는 항상 `remove(int)`에 먼저 매칭됩니다. 값으로 지우고 싶다면 `list.remove(Integer.valueOf(1))`이나 `list.remove((Integer) 1)`처럼 객체로 넘겨야 합니다. 인덱스 범위를 벗어나면 `IndexOutOfBoundsException`이 납니다."}, {"title": "ArrayList와 null", "body": "ArrayList는 null을 여러 개 담을 수 있습니다. `remove(Object)`, `contains`, `indexOf`는 내부적으로 `o == null ? e == null : o.equals(e)`로 비교하므로 null을 넘겨도 NPE가 나지 않습니다. `toString()`은 null 요소를 `null`로 출력합니다. 다만 `List<Integer>`에서 null을 꺼내 `int`로 언박싱하면 NPE가 납니다."}], "trap": "`remove(1)`을 \"값 1을 지운다\"로 읽게 만드는 함정입니다. `List<Integer>`에 int 리터럴을 넘기면 인덱스로 해석됩니다.", "no": 131, "topicName": "Java API", "lesson": "`List<Integer>.remove(1)`은 **인덱스 1**을 지웁니다. 값 1을 지우려면 `remove(Integer.valueOf(1))`을 써야 합니다. `remove(null)`은 합법이므로 컴파일 에러(F)가 아닙니다.", "mine": {"tries": 2, "wrong": ["F"]}}, {"id": "20", "topic": "api", "parts": [{"type": "text", "content": "Which statement will empty the contents of a StringBuilder variable named sb?"}], "options": [{"key": "A", "text": "", "code": "sb.deleteAll ();"}, {"key": "B", "text": "", "code": "sb.delete (0, sb.size ());"}, {"key": "C", "text": "", "code": "sb.delete (0, sb.length ());"}, {"key": "D", "text": "", "code": "sb.removeAll ();"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "StringBuilder를 비우려면 `sb.delete(0, sb.length())`(또는 `sb.setLength(0)`)를 씁니다.", "walkthrough": "1. StringBuilder의 `delete(int start, int end)`는 `start` 이상 `end` 미만 구간의 문자를 지우고 자기 자신을 반환합니다.\n2. 길이는 `length()` 메서드로 구합니다. `size()`는 컬렉션(List 등)의 메서드라 StringBuilder에는 없습니다.\n3. `sb.delete(0, sb.length())` → 0부터 끝까지 지우므로 빈 상태가 됩니다. 실제로 `\"abc\"`에 적용하면 `[]`, 길이 0이 됩니다.\n4. `deleteAll()`, `removeAll()`, `size()`는 StringBuilder에 없는 메서드라 cannot find symbol 컴파일 에러입니다(확인 완료).", "optionNotes": {"A": "StringBuilder에는 `deleteAll()` 메서드가 없어 컴파일 에러입니다.", "B": "StringBuilder의 길이는 `length()`이고 `size()`는 없으므로 컴파일 에러입니다.", "C": "정답입니다. 인덱스 0부터 `length()`까지(끝 미포함) 전부 지워 빈 StringBuilder가 됩니다.", "D": "`removeAll()`은 Collection의 메서드(`removeAll(Collection)`)이고 StringBuilder에는 없어 컴파일 에러입니다."}, "concepts": [{"title": "StringBuilder 주요 메서드", "body": "`append(x)`, `insert(offset, x)`, `delete(start, end)`, `deleteCharAt(index)`, `replace(start, end, str)`, `reverse()`, `setLength(n)`, `charAt`, `indexOf`, `length`, `substring`, `toString` 등이 있습니다. append/insert/delete/deleteCharAt/replace/reverse는 원본을 직접 바꾸고 `this`를 반환하므로 메서드 체이닝을 할 수 있습니다. 반면 `substring`은 새 String을 반환할 뿐 StringBuilder를 바꾸지 않습니다. `delete`의 end가 길이보다 크면 길이까지로 보정되지만, start가 음수이거나 length보다 크거나 end보다 크면 `StringIndexOutOfBoundsException`이 납니다. 내용을 비우는 다른 방법은 `sb.setLength(0)`입니다."}, {"title": "길이를 구하는 방법 비교", "body": "배열은 필드 `arr.length`(괄호 없음), String/StringBuilder는 메서드 `length()`, 컬렉션(ArrayList 등)은 메서드 `size()`입니다. 시험에서 이 셋을 섞어 쓴 코드는 컴파일 에러를 노리는 경우가 많습니다. StringBuilder의 `capacity()`는 내부 버퍼 크기로 `length()`와 다릅니다(기본 16 + 초기 문자열 길이)."}], "trap": "`size()`, `removeAll()`처럼 컬렉션 API 이름을 섞어 그럴듯하게 만든 보기입니다. StringBuilder는 `length()`를 씁니다.", "no": 133, "topicName": "Java API", "lesson": "StringBuilder를 비우려면 `delete(0, sb.length())`나 `setLength(0)`을 씁니다. StringBuilder에는 `size()`가 없습니다(B를 두 번 골랐습니다).", "mine": {"tries": 3, "wrong": ["B", "B"]}}, {"id": "28", "topic": "api", "parts": [{"type": "text", "content": "Given the code fragments:"}, {"type": "text", "content": "Person.java:"}, {"type": "code", "content": "public class Person {\n    String name;\n    int age;\n\n    public Person(String n, int a) {\n        name = n;\n        age = a;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public int getAge() {\n        return age;\n    }\n}"}, {"type": "text", "content": "Test.java:"}, {"type": "code", "content": "public static void checkAge(List<Person> list, Predicate<Person> predicate) {\n    for (Person p : list) {\n        if (predicate.test(p)) {\n            System.out.println(p.name + \" \");\n        }\n    }\n}\n\npublic static void main(String[] args) {\n    List<Person> iList = Arrays.asList(new Person(\"Hank\", 45),\n                                       new Person(\"Charlie\", 40),\n                                       new Person(\"Smith\", 38));\n    //line n1\n}"}, {"type": "text", "content": "Which code fragment, when inserted at line n1, enables the code to print Hank?"}], "options": [{"key": "A", "text": "", "code": "checkAge (iList, ( ) -> p.getAge ( ) > 40);"}, {"key": "B", "text": "", "code": "checkAge(iList, Person p -> p.getAge( ) > 40);"}, {"key": "C", "text": "", "code": "checkAge (iList, p -> p.getAge ( ) > 40);"}, {"key": "D", "text": "", "code": "checkAge(iList, (Person p) -> { p.getAge() > 40; });"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`Predicate<Person>`에 맞는 람다는 매개변수 하나를 받아 boolean을 돌려주는 `p -> p.getAge() > 40`이며, 45세인 Hank만 출력됩니다.", "walkthrough": "1. `checkAge`의 두 번째 매개변수는 `Predicate<Person>`이고, 추상 메서드는 `boolean test(Person p)`입니다. 따라서 람다는 매개변수 하나를 받아 boolean을 반환해야 합니다.\n2. C의 `p -> p.getAge() > 40`에서 p의 타입은 `Person`으로 추론됩니다.\n3. Hank(45)는 true, Charlie(40)는 `40 > 40`이 false, Smith(38)는 false입니다.\n4. 그래서 `println(p.name + \" \")`이 Hank에 대해서만 실행되어 `Hank `가 출력됩니다.\n5. 나머지 보기는 모두 람다 문법 오류로 컴파일되지 않습니다(옵션별 설명 참고). 각 보기를 실제로 넣어 컴파일해 확인했습니다.", "optionNotes": {"A": "`( ) ->`는 매개변수가 없는 람다인데 `test`는 매개변수를 하나 받으므로 타입이 맞지 않고, 본문의 p도 정의되지 않은 변수라 컴파일 에러입니다.", "B": "매개변수 타입을 적을 때는 반드시 괄호가 필요합니다. `Person p -> ...`가 아니라 `(Person p) -> ...`라고 써야 하므로 컴파일 에러입니다.", "C": "정답입니다. 매개변수 하나는 괄호를 생략할 수 있고, 식 본문의 결과(boolean)가 그대로 반환되어 Hank만 출력됩니다.", "D": "중괄호 블록 본문에서는 `return`이 필요합니다. `p.getAge() > 40;`은 단독 문장이 될 수 없는 식이라 `not a statement` 컴파일 에러가 납니다."}, "concepts": [{"title": "람다 식 문법 규칙", "body": "- 매개변수가 하나이고 타입을 생략하면 괄호도 생략할 수 있습니다: `p -> ...`\n- 타입을 적거나 매개변수가 0개 또는 2개 이상이면 괄호가 필요합니다: `(Person p) -> ...`, `() -> ...`, `(a, b) -> ...`\n- 식 본문(`-> 식`)은 return과 세미콜론 없이 식의 값이 반환됩니다.\n- 블록 본문(`-> { ... }`)에서 값을 돌려주려면 `return 식;`이 필요하고 각 문장 끝에 세미콜론을 붙입니다.\n- 매개변수 목록 안에서 타입을 쓰는 것과 생략하는 것을 섞을 수 없습니다: `(Person a, b)`는 에러입니다."}, {"title": "java.util.function.Predicate", "body": "`Predicate<T>`는 `boolean test(T t)` 하나만 가진 함수형 인터페이스입니다. 조건 검사를 매개변수로 넘길 때 쓰며, `and`, `or`, `negate` 같은 default 메서드도 있습니다. OCA 시험에서는 주로 람다를 Predicate에 대입하거나 `ArrayList.removeIf(Predicate)`에 넘기는 형태로 나옵니다."}], "trap": "D처럼 중괄호를 쓰고 return을 빼거나, B처럼 타입을 쓰고 괄호를 빼는 문법 실수를 고르게 유도합니다. 40세인 Charlie는 `> 40` 조건에서 빠진다는 점도 확인하세요.", "no": 134, "topicName": "Java API", "lesson": "중괄호를 쓰면 `return`과 `;`가 둘 다 필요합니다(D는 return이 없습니다). `p -> p.getAge() > 40`이 가장 안전한 형태입니다. 40세는 `> 40`에서 빠집니다.", "mine": {"tries": 2, "wrong": ["D"]}}, {"id": "59", "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "3. public static void main(String[] args) {\n4.     int iVar = 100;\n5.     float fVar = 100.100f;\n6.     double dVar = 123;\n7.     iVar = fVar;\n8.     fVar = iVar;\n9.     dVar = fVar;\n10.    fVar = dVar;\n11.    dVar = iVar;\n12.    iVar = dVar;\n13. }"}, {"type": "text", "content": "Which three lines fail to compile? (Choose three.)"}], "options": [{"key": "A", "text": "Line 7", "code": null}, {"key": "B", "text": "Line 8", "code": null}, {"key": "C", "text": "Line 9", "code": null}, {"key": "D", "text": "Line 10", "code": null}, {"key": "E", "text": "Line 11", "code": null}, {"key": "F", "text": "Line 12", "code": null}], "correct": "ADF", "dumpAnswer": "ADF", "answerNote": "", "summary": "큰 타입을 작은 타입에 캐스팅 없이 대입하는 7행(float→int), 10행(double→float), 12행(double→int)이 컴파일 에러입니다.", "walkthrough": "기본형 대입은 값 손실이 없는 **확장 변환**(byte → short → int → long → float → double)만 자동으로 허용됩니다.\n- 7행 `iVar = fVar;`: float → int는 축소 변환이므로 에러입니다(`possible lossy conversion from float to int`).\n- 8행 `fVar = iVar;`: int → float는 확장 변환이므로 허용됩니다(정밀도 손실이 있을 수 있어도 허용).\n- 9행 `dVar = fVar;`: float → double은 확장 변환이므로 허용됩니다.\n- 10행 `fVar = dVar;`: double → float는 축소 변환이므로 에러입니다.\n- 11행 `dVar = iVar;`: int → double은 확장 변환이므로 허용됩니다.\n- 12행 `iVar = dVar;`: double → int는 축소 변환이므로 에러입니다.\n실제로 컴파일해도 이 세 줄에서만 lossy conversion 에러가 납니다. 참고로 6행 `double dVar = 123;`은 int 리터럴이 double로 확장되는 것이라 합법입니다.", "optionNotes": {"A": "정답입니다. float를 int에 대입하는 축소 변환이라 `(int)` 캐스팅이 없으면 컴파일 에러입니다.", "B": "int → float는 확장 변환이라 자동으로 허용됩니다.", "C": "float → double은 확장 변환이라 자동으로 허용됩니다.", "D": "정답입니다. double을 float에 대입하는 축소 변환이라 컴파일 에러입니다.", "E": "int → double은 확장 변환이라 자동으로 허용됩니다.", "F": "정답입니다. double을 int에 대입하는 축소 변환이라 컴파일 에러입니다."}, "concepts": [{"title": "기본형 확장 변환과 축소 변환", "body": "자동(묵시적) 변환 순서는 `byte → short → int → long → float → double`이고 `char → int`도 확장입니다. 이 방향은 캐스팅 없이 대입할 수 있습니다. long → float처럼 크기는 작아도 표현 범위가 넓으면 확장으로 칩니다. 반대 방향은 축소 변환이라 `(int) 3.9`처럼 명시적으로 캐스팅해야 하며, 소수점 이하는 버려집니다(3)."}, {"title": "리터럴과 상수 대입의 예외", "body": "정수 리터럴은 기본이 `int`, 실수 리터럴은 기본이 `double`입니다. 그래서 `float f = 1.5;`는 에러이고 `1.5f`라고 써야 합니다. 다만 `byte b = 10;`처럼 **int 컴파일 타임 상수**가 대상 타입(byte/short/char) 범위 안이면 캐스팅 없이 대입할 수 있습니다. 이 예외는 변수(`byte b = i;`)나 long/float/double 상수에는 적용되지 않습니다. 복합 대입 연산자(`b += 5`)는 묵시적 캐스팅을 포함하므로 컴파일됩니다."}], "trap": "float와 double 사이에도 축소 변환이 있다는 점을 놓치게 만듭니다. double → float(10행)도 캐스팅이 필요합니다.", "no": 17, "topicName": "자료형", "lesson": "float → double은 확대라 OK이고, **double → float은 축소**라 캐스트가 필요합니다. C(float→double)를 에러로, D(double→float)를 OK로 거꾸로 봤습니다.", "mine": {"tries": 2, "wrong": ["ACF"]}}, {"id": "29", "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "String stuff = \"TV\";\nString res = null;\n\nif (stuff.equals(\"TV\")) {\n    res = \"Walter\";\n} else if (stuff.equals(\"Movie\")) {\n    res = \"White\";\n} else {\n    res = \"No Result\";\n}"}, {"type": "text", "content": "Which code fragment can replace the if block?"}], "options": [{"key": "A", "text": "", "code": "stuff.equals (\"TV\") ? res= \"Walter\" : stuff.equals (\"Movie\") ?\nres = \"White\" : res = \"No Result\";"}, {"key": "B", "text": "", "code": "res = stuff.equals (\"TV\") ? \"Walter\" else stuff.equals\n(\"Movie\")? \"White\" : \"No Result\";"}, {"key": "C", "text": "", "code": "res = stuff.equals (\"TV\") ? stuff.equals (\"Movie\")? \"Walter\" :\n\"White\" : \"No Result\";"}, {"key": "D", "text": "", "code": "res = stuff.equals (\"TV\")? \"Walter\" : stuff.equals (\"Movie\")?\n\"White\" : \"No Result\";"}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "삼항 연산자를 중첩한 `res = cond1 ? \"Walter\" : cond2 ? \"White\" : \"No Result\";`가 if-else if-else와 같은 의미입니다.", "walkthrough": "1. 원래 if 블록은 \"TV\"이면 Walter, \"Movie\"이면 White, 그 밖에는 No Result를 res에 대입합니다.\n2. 삼항 연산자는 오른쪽 결합이므로 D의 `a ? x : b ? y : z`는 `a ? x : (b ? y : z)`로 묶입니다. if / else if / else와 정확히 같은 구조입니다.\n3. stuff가 \"TV\"이므로 D를 실행하면 res는 \"Walter\"입니다(실행 결과 확인).\n4. C는 컴파일되지만 \"TV\"일 때 안쪽 조건 `stuff.equals(\"Movie\")`가 false라서 \"White\"가 나와 의미가 다릅니다.\n5. A와 B는 컴파일 에러입니다.", "optionNotes": {"A": "조건 연산식만으로는 문장이 될 수 없어 단독으로 쓸 수 없습니다. 게다가 마지막 피연산자 자리에 대입식 `res = \"No Result\"`를 괄호 없이 넣으면 `(… ? … : res) = \"No Result\"`로 해석되어 `unexpected type` 컴파일 에러가 납니다.", "B": "삼항 연산자에는 `else`가 없고 `:`를 써야 합니다. `else`가 들어가서 컴파일 에러입니다.", "C": "컴파일은 되지만 논리가 다릅니다. \"TV\"일 때 안쪽 `stuff.equals(\"Movie\") ? \"Walter\" : \"White\"`가 실행되어 \"White\"가 대입됩니다.", "D": "정답입니다. 첫 조건이 참이면 \"Walter\", 아니면 두 번째 조건으로 \"White\" 또는 \"No Result\"를 고르는 구조로, 원래 if 블록과 같습니다."}, "concepts": [{"title": "조건(삼항) 연산자", "body": "`조건 ? 값1 : 값2`는 값을 만드는 **식**이므로 보통 대입이나 반환, 메서드 인자에 씁니다. `x > 0 ? a() : b();`처럼 단독 문장으로 쓰면 `not a statement` 컴파일 에러가 납니다. 오른쪽 결합이라 `a ? b : c ? d : e`는 `a ? b : (c ? d : e)`입니다. 두 번째와 세 번째 피연산자의 타입은 호환되어야 하며, 숫자형이면 더 넓은 타입으로 승격됩니다(예: `true ? 1 : 2.0`은 1.0)."}, {"title": "삼항 연산자와 대입의 우선순위", "body": "대입 연산자는 조건 연산자보다 우선순위가 낮습니다. 그래서 `c ? x = 1 : y = 2`의 마지막 부분은 `(c ? x = 1 : y) = 2`로 해석되고, 조건식의 결과는 변수가 아니므로 대입할 수 없어 에러가 납니다. 가운데 피연산자 자리(`?`와 `:` 사이)에는 대입식을 넣을 수 있지만, 마지막 피연산자에는 괄호로 감싸야 합니다."}], "trap": "C는 컴파일되기 때문에 정답처럼 보이지만 조건의 중첩 위치가 달라 결과가 다릅니다. A는 if 문을 그대로 옮긴 것처럼 보이지만 삼항 식을 문장으로 쓸 수 없다는 규칙에 걸립니다.", "no": 30, "topicName": "연산자와 조건문", "lesson": "삼항 연산자는 **값**이므로 단독 문장으로 쓸 수 없습니다. `res = c1 ? \"Walter\" : c2 ? \"White\" : \"No Result\";`처럼 대입식의 오른쪽에 둬야 합니다(A는 에러).", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "69", "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [] args) {\n    System.out.println (\"Result A \" + 0 + 1);\n    System.out.println (\"Result B \" + (1) + (2) );\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Result A 1\nResult B 3"}, {"key": "B", "text": "", "code": "Result A 01\nResult B 3"}, {"key": "C", "text": "", "code": "Result A 01\nResult B 12"}, {"key": "D", "text": "", "code": "Result A 1\nResult B 12"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "문자열 뒤의 `+`는 모두 문자열 연결이며, 값 하나만 감싼 괄호 `(1)`은 덧셈을 먼저 하게 만들지 않습니다.", "walkthrough": "1. `\"Result A \" + 0 + 1`은 왼쪽부터 평가합니다. `\"Result A \" + 0` → `\"Result A 0\"`(String), 이어서 `+ 1` → `\"Result A 01\"`입니다.\n2. `\"Result B \" + (1) + (2)`에서 괄호는 각각 리터럴 하나만 감싸므로 `1`, `2` 그 자체입니다. 덧셈 `1 + 2`를 묶는 괄호가 아닙니다.\n3. 따라서 `\"Result B \" + 1` → `\"Result B 1\"`, 다시 `+ 2` → `\"Result B 12\"`입니다.\n4. 출력은 `Result A 01` / `Result B 12`이며 실제로 컴파일·실행해서 확인했습니다.\n\n참고로 `\"Result B \" + (1 + 2)`였다면 `Result B 3`이 됩니다.", "optionNotes": {"A": "`Result A 1`은 `0 + 1`이 먼저 정수 덧셈된다고 착각한 결과입니다. 문자열 뒤에서는 연결이 일어나므로 `01`이 됩니다.", "B": "첫 줄은 맞지만, `(1) + (2)`는 덧셈을 묶은 괄호가 아니므로 `3`이 아니라 `12`가 출력됩니다.", "C": "정답입니다. 두 줄 모두 왼쪽부터 문자열 연결이 일어나 `Result A 01`, `Result B 12`가 출력됩니다.", "D": "두 줄 모두 반대로 계산했습니다. 첫 줄은 `01`, 둘째 줄은 `12`입니다."}, "concepts": [{"title": "문자열 연결(+)의 평가 순서", "body": "`+` 연산자는 왼쪽에서 오른쪽으로 결합합니다. 피연산자 중 하나라도 `String`이면 그 `+`는 문자열 연결이 되고, 그 결과(String)가 다음 `+`의 왼쪽 피연산자가 됩니다. 따라서 `\"A\" + 1 + 2`는 `(\"A\" + 1) + 2` → `\"A1\" + 2` → `\"A12\"`입니다. 반대로 `1 + 2 + \"A\"`는 앞의 `1 + 2`가 먼저 정수 덧셈이 되어 `\"3A\"`입니다. 괄호는 평가 순서를 바꾸므로 `\"A\" + (1 + 2)`는 `\"A3\"`입니다. 단, `(1)`처럼 값 하나만 감싼 괄호는 아무것도 바꾸지 않습니다.\n```java\nSystem.out.println(1 + 2 + \"A\" + 1 + 2); // 3A12\nSystem.out.println('a' + 1 + \"B\");     // 98B (char + int = int)\n```"}, {"title": "main 메서드 선언 규칙", "body": "JVM이 실행 시작점으로 인식하는 메서드는 `public static void main(String[] args)`입니다. Java 키워드는 모두 소문자이므로 `Public`은 키워드가 아니라 식별자로 해석되어 컴파일 에러가 납니다. 매개변수는 `String[] args`, `String args[]`, `String... args` 모두 가능하고 이름 `args`는 바꿔도 됩니다. `public`과 `static`의 순서는 바꿀 수 있지만(`static public void main`), 반환형 `void`는 메서드 이름 바로 앞에 와야 합니다. `final`을 붙여도 유효한 main입니다."}], "trap": "`(1) + (2)`처럼 괄호가 있으면 덧셈이 먼저 된다고 착각하게 만드는 문제입니다. 괄호가 무엇을 묶는지 확인하세요.", "no": 31, "topicName": "연산자와 조건문", "lesson": "문자열 뒤의 `+`는 모두 연결이고, `(1)`처럼 값 하나만 감싼 괄호는 효과가 없습니다. 덧셈을 먼저 하려면 `(0 + 1)`처럼 연산 전체를 묶어야 합니다.", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "90", "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "if (aVar++ < 10) {\n    System.out.println(aVar + \" Hello World!\");\n} else {\n    System.out.println(aVar + \" Hello Universe!\");\n}"}, {"type": "text", "content": "What is the result if the integer aVar is 9?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "10 Hello Universe!", "code": null}, {"key": "C", "text": "10 Hello World!", "code": null}, {"key": "D", "text": "9 Hello World!", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`aVar++ < 10`은 증가 전 값 9로 비교해 참이 되고, 비교 직후 `aVar`는 10이 되므로 `10 Hello World!`가 출력됩니다.", "walkthrough": "코드 조각이라 `int aVar = 9;`를 앞에 두고 main 안에서 실행했습니다.\n1. `aVar++`는 후위 증가이므로 식의 값은 증가 **전** 값 `9`입니다.\n2. 비교 `9 < 10`은 `true`입니다. 동시에 `aVar`는 부수 효과로 10이 됩니다.\n3. if 블록이 실행되며, 이 시점의 `aVar`는 10이므로 `10 Hello World!`가 출력됩니다.\n4. else 블록은 실행되지 않습니다.", "optionNotes": {"A": "`aVar`가 `int`로 선언되어 있다는 전제이므로 후위 증가와 비교는 모두 합법이며 컴파일됩니다.", "B": "비교는 증가 전 값 9로 하므로 `9 < 10`이 참입니다. 증가 후 값 10으로 비교했다고 착각하면 else라고 생각하게 됩니다.", "C": "정답입니다. 조건은 9로 비교해 참이고, 출력 시점의 `aVar`는 이미 10입니다.", "D": "증가는 조건 평가 중에 이미 일어났으므로 블록 안에서 `aVar`는 10입니다. 9가 출력되지 않습니다."}, "concepts": [{"title": "전위/후위 증감 연산자", "body": "`x++`(후위)는 현재 값을 식의 결과로 쓰고 나서 `x`를 1 증가시키며, `++x`(전위)는 먼저 증가시킨 뒤 그 값을 결과로 씁니다. 어느 쪽이든 식이 평가된 직후 변수 자체는 이미 바뀌어 있습니다. 조건식, 배열 인덱스, 메서드 인수 안에서 사용될 때 특히 주의해야 합니다.\n```java\nint a = 9;\nboolean b = a++ < 10;  // b = true, a = 10\nint c = 9;\nboolean d = ++c < 10;  // d = false, c = 10\nint x = 5;\nx = x++;               // x는 5 그대로\n```"}], "trap": "조건을 증가 후 값으로 비교한다고 착각(B)하거나, 출력 시점에 증가가 아직 안 됐다고 착각(D)하게 만드는 문제입니다.", "no": 34, "topicName": "연산자와 조건문", "lesson": "`aVar++ < 10`은 증가 전 값 9로 비교하고, 비교 직후 10이 됩니다. 블록 안에서 출력할 때는 이미 10입니다(D의 9가 아닙니다).", "mine": {"tries": 1, "wrong": ["D"]}}, {"id": "98", "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        //line n1\n        switch (x) {\n            case 1:\n                System.out.println(\"One\");\n                break;\n            case 2:\n                System.out.println(\"Two\");\n                break;\n        }\n    }\n}"}, {"type": "text", "content": "Which three code fragments can be independently inserted at line n1 to enable the code to print One?"}], "options": [{"key": "A", "text": "", "code": "Byte x = 1;"}, {"key": "B", "text": "", "code": "short x = 1;"}, {"key": "C", "text": "", "code": "String x = \"1\";"}, {"key": "D", "text": "", "code": "Long x = 1;"}, {"key": "E", "text": "", "code": "Double x = 1;"}, {"key": "F", "text": "", "code": "Integer x = new Integer (\"1\");"}], "correct": "ABF", "dumpAnswer": "ABF", "answerNote": "", "summary": "switch는 byte/short/char/int와 그 래퍼, String, enum만 허용하므로 Byte, short, Integer는 되고 Long, Double은 안 되며, String은 case 1과 타입이 맞지 않습니다.", "walkthrough": "각 선언을 line n1에 넣고 컴파일·실행해 보았습니다.\n- A `Byte x = 1;`: int 상수 1이 byte 범위 안이므로 축소 변환 후 박싱되어 `Byte`에 대입됩니다. switch는 `Byte`를 언박싱해 처리하고 `One`을 출력합니다.\n- B `short x = 1;`: 상수 대입이므로 합법이고, `short`는 switch 허용 타입입니다. `One` 출력.\n- C `String x = \"1\";`: switch 자체는 String을 허용하지만 `case 1`이 int 상수라 `incompatible types: int cannot be converted to String` 컴파일 에러입니다.\n- D `Long x = 1;`: int 리터럴은 `Long`으로 박싱되지 않아 대입부터 컴파일 에러이며, `Long`은 switch 타입으로도 허용되지 않습니다.\n- E `Double x = 1;`: 마찬가지로 `int cannot be converted to Double` 컴파일 에러입니다.\n- F `Integer x = new Integer(\"1\");`: 값 1인 `Integer`가 만들어지고 언박싱되어 `One`을 출력합니다.", "optionNotes": {"A": "정답입니다. `Byte x = 1;`은 상수 축소 변환+박싱으로 합법이고, `Byte`는 switch 허용 타입입니다.", "B": "정답입니다. `short`는 switch에 쓸 수 있고 case 상수 1, 2가 short 범위에 들어갑니다.", "C": "switch 표현식이 String이면 case 라벨도 String 상수여야 합니다. `case 1`은 int라 컴파일 에러입니다.", "D": "int 리터럴 1은 `Long`으로 박싱될 수 없어 선언에서 컴파일 에러이고, `long`/`Long`은 switch 타입으로도 금지입니다.", "E": "int 리터럴을 `Double`에 대입할 수 없어 컴파일 에러이며, 실수형도 switch에 쓸 수 없습니다.", "F": "정답입니다. `new Integer(\"1\")`은 값 1을 가진 `Integer`이고, switch에서 언박싱됩니다."}, "concepts": [{"title": "switch 표현식에 허용되는 타입 (Java 8)", "body": "`char`, `byte`, `short`, `int`, 그 래퍼 클래스 `Character`, `Byte`, `Short`, `Integer`, 그리고 `String`, `enum`만 허용됩니다. `long`, `float`, `double`, `boolean`과 그 래퍼는 사용할 수 없습니다. case 라벨은 컴파일 타임 상수여야 하고, switch 타입에 대입 가능한 값이어야 합니다(예: `byte` switch에 `case 200:`은 에러). 래퍼 타입 switch에서 값이 `null`이면 실행 중 NullPointerException이 발생합니다."}, {"title": "상수 대입 시 축소 변환과 박싱", "body": "int 컴파일 타임 상수는 범위 안이면 `byte`, `short`, `char`에 캐스트 없이 대입할 수 있고, 이어서 `Byte`, `Short`, `Character`로 박싱하는 것까지 허용됩니다. 그러나 확대 후 박싱(int -> long -> Long)은 허용되지 않습니다.\n```java\nByte b = 1;     // OK\nShort s = 1;    // OK\nLong l = 1;     // 에러\nLong l2 = 1L;   // OK\nDouble d = 1;   // 에러\nDouble d2 = 1.0;// OK\n```"}], "trap": "`Long x = 1;`이나 `Double x = 1;`이 기본형처럼 자동으로 넓혀질 것이라 생각하게 만들고, String switch를 허용된다는 사실만으로 C를 고르게 유도합니다.", "no": 35, "topicName": "연산자와 조건문", "lesson": "switch는 byte·short·char·int와 그 래퍼, String, enum만 됩니다. `Long x = 1;`은 int 1을 Long으로 박싱할 수 없어 선언부터 에러입니다(D). `Byte x = 1;`(A)은 상수라 OK입니다.", "mine": {"tries": 1, "wrong": ["BDF"]}}, {"id": "137", "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int x = 100;\nint a = x++;\nint b = ++x;\nint c = x++;\nint d = (a < b) ? (a < c) ? a: (b <c )? b: c: x;\nSystem.out.println(d);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "100", "code": null}, {"key": "B", "text": "101", "code": null}, {"key": "C", "text": "102", "code": null}, {"key": "D", "text": "103", "code": null}, {"key": "E", "text": "Compilation fails", "code": null}], "correct": "A", "dumpAnswer": "E", "answerNote": "덤프 정답 E(컴파일 실패)는 틀렸습니다. 조건 연산자는 오른쪽 결합이며 두 번째 피연산자 자리에 또 다른 조건식이 올 수 있으므로 `(a < b) ? (a < c) ? a : (b < c) ? b : c : x`는 합법입니다. 실제로 컴파일·실행하면 100이 출력됩니다.", "summary": "a=100, b=102, c=102이고 중첩 조건식은 `a<b ? (a<c ? a : (b<c ? b : c)) : x`로 해석되어 a인 100이 선택됩니다.", "walkthrough": "1. x = 100.\n2. `a = x++` → a = 100, x = 101.\n3. `b = ++x` → x = 102, b = 102.\n4. `c = x++` → c = 102, x = 103.\n5. 조건식은 오른쪽 결합이므로 다음과 같이 묶입니다.\n```java\nd = (a < b) ? ((a < c) ? a : ((b < c) ? b : c)) : x;\n```\n6. `a < b`(100 < 102) true → 안쪽 식 평가. `a < c`(100 < 102) true → `a` 선택.\n7. d = 100이 출력됩니다.", "optionNotes": {"A": "정답입니다. a<b, a<c가 모두 참이라 a(100)가 선택됩니다.", "B": "101은 어떤 변수에도 저장되지 않는 중간값(첫 증가 후 x)입니다. a는 후위 증가라 100입니다.", "C": "102는 b와 c의 값입니다. `a < c`가 true이므로 b나 c까지 가지 않습니다.", "D": "103은 최종 x 값으로, `a < b`가 false일 때만 선택됩니다.", "E": "중첩 조건 연산자는 괄호 없이도 오른쪽 결합으로 해석되어 합법입니다. 각 피연산자가 int라 `int d`에 대입하는 것도 문제없습니다."}, "concepts": [{"title": "중첩 조건 연산자 읽는 법", "body": "`?:`는 오른쪽 결합입니다. `a ? b : c ? d : e`는 `a ? b : (c ? d : e)`입니다. 두 번째 피연산자(`?`와 `:` 사이)에도 조건식이 올 수 있어, `?`를 만날 때마다 짝이 되는 `:`를 가장 가까운 것부터 맞춰 괄호를 쳐 보면 됩니다. 조건 연산자의 결과는 반드시 값이어야 하므로 void 메서드 호출은 피연산자로 쓸 수 없습니다.\n```java\nint n = 5;\nString s = n > 10 ? \"big\" : n > 3 ? \"mid\" : \"small\"; // mid\n```"}, {"title": "증감 연산 추적", "body": "한 줄씩 '식에 쓰인 값'과 '문장 실행 후 변수 값'을 구분해 표로 적으면 실수가 줄어듭니다. `y = x++`는 y에 이전 값, `y = ++x`는 y에 새 값이 들어가며 두 경우 모두 x는 1 증가합니다."}], "trap": "괄호가 부족해 보이는 중첩 조건식으로 컴파일 에러를 고르게 만드는 함정입니다.", "no": 39, "topicName": "연산자와 조건문", "lesson": "괄호 없는 중첩 삼항도 오른쪽부터 묶이는 **합법** 코드입니다. 컴파일 에러(E)라고 보지 말고 `a<b ? (a<c ? a : …) : …`로 다시 묶어 계산하세요.", "mine": {"tries": 1, "wrong": ["E"]}}, {"id": "85", "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "String shirts[][] = new String[2][2];\nshirts[0][0] = \"red\";\nshirts[0][1] = \"blue\";\nshirts[1][0] = \"small\";\nshirts[1][1] = \"medium\";"}, {"type": "text", "content": "Which code fragment prints red:blue:small:medium:?"}], "options": [{"key": "A", "text": "", "code": "for (int index = 1; index < 2; index++) {\n    for (int idx = 1; idx < 2; idx++) {\n        System.out.print(shirts[index][idx] + \":\");\n    }\n}"}, {"key": "B", "text": "", "code": "for (int index = 0; index < 2; ++index) {\n    for (int idx = 0; idx < index; ++idx) {\n        System.out.print(shirts[index][idx] + \":\");\n    }\n}"}, {"key": "C", "text": "", "code": "for (String c : colors) {\n    for (String s : sizes) {\n        System.out.println(s + \":\");\n    }\n}"}, {"key": "D", "text": "", "code": "for (int index = 0; index < 2;) {\n    for (int idx = 0; idx < 2;) {\n        System.out.print(shirts[index][idx] + \":\");\n        idx++;\n    }\n    index++;\n}"}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "갱신식을 생략하고 루프 본문 끝에서 `idx++`, `index++`를 하는 D만 2×2 배열의 네 요소를 모두 순서대로 출력합니다.", "walkthrough": "배열 상태: `shirts[0] = {\"red\", \"blue\"}`, `shirts[1] = {\"small\", \"medium\"}`. 각 선택지를 실행했습니다.\n- A: `index`와 `idx`가 모두 1에서 시작해 1까지만 돌므로 `shirts[1][1]`만 출력됩니다 → `medium:`.\n- B: 안쪽 조건이 `idx < index`라서 `index = 0`일 때는 한 번도 돌지 않고, `index = 1`일 때 `idx = 0`만 돕니다 → `small:`.\n- C: `colors`, `sizes`라는 변수가 선언되어 있지 않아 컴파일 에러입니다.\n- D: 바깥 루프 `index = 0`에서 안쪽 루프가 `idx = 0, 1`을 돌며 `red:blue:`를 출력하고 본문 끝에서 `index++`; `index = 1`에서 `small:medium:`을 출력합니다 → `red:blue:small:medium:`.\nfor문의 갱신식을 비워 두고 본문에서 증가시키는 것은 합법입니다.", "optionNotes": {"A": "두 루프 모두 1부터 시작하므로 인덱스 `[1][1]` 하나만 방문해 `medium:`만 출력됩니다.", "B": "안쪽 조건 `idx < index` 때문에 첫 행은 건너뛰고 둘째 행은 첫 요소만 방문해 `small:`만 출력됩니다.", "C": "`colors`와 `sizes`는 선언되지 않은 변수이므로 \"cannot find symbol\" 컴파일 에러입니다.", "D": "정답입니다. 갱신식을 생략했지만 본문 끝에서 `idx++`, `index++`를 하므로 모든 요소를 행 순서대로 출력합니다."}, "concepts": [{"title": "2차원 배열 순회", "body": "Java의 2차원 배열은 \"배열의 배열\"입니다. `shirts.length`는 행 개수, `shirts[i].length`는 i번째 행의 길이이며 행마다 길이가 다를 수도 있습니다(가변 배열). 모든 요소를 순회하려면 바깥 루프는 행 인덱스 0부터 `length - 1`까지, 안쪽 루프는 열 인덱스 0부터 해당 행의 `length - 1`까지 돌아야 합니다.\n```java\nfor (int r = 0; r < a.length; r++)\n    for (int c = 0; c < a[r].length; c++)\n        System.out.print(a[r][c] + \" \");\n// 향상된 for문 버전\nfor (String[] row : a) for (String s : row) System.out.print(s);\n```"}, {"title": "for문 구성 요소의 생략", "body": "`for (초기화; 조건; 갱신)`의 세 부분은 모두 생략할 수 있지만 세미콜론 두 개는 반드시 있어야 합니다. 조건을 생략하면 `true`로 간주되어 무한 루프가 됩니다(`for (;;)`). 갱신식을 생략하면 본문 안에서 직접 변수를 바꿔야 하며, 그렇지 않으면 무한 루프가 됩니다. 초기화와 갱신 부분에는 쉼표로 여러 식을 쓸 수 있지만, 초기화에서 선언할 때는 한 가지 타입만 가능합니다(`for (int i = 0, j = 5; ...)`)."}], "trap": "A와 B는 시작값이나 조건을 살짝 바꿔 일부 요소만 출력하게 만든 함정입니다. 루프 변수의 시작값과 조건을 정확히 추적하세요.", "no": 48, "topicName": "배열", "lesson": "보기마다 두 루프 변수의 시작값과 조건을 표로 적으세요. 안쪽 조건이 `idx < index`처럼 바깥 변수에 의존하면 첫 행이 통째로 건너뛰어집니다. 같은 B를 두 번 골랐습니다.", "mine": {"tries": 3, "wrong": ["B", "B"]}}, {"id": "121", "topic": "arrays", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n\n    public static void main(String[] args) {\n\n        String[][] chs = new String[2][];\n        chs[0] = new String[2];\n        chs[1] = new String[5];\n        int i = 97;\n\n        for (int a = 0; a < chs.length; a++) {\n            for (int b = 0; b < chs.length; b++) {\n                chs[a][b] = \"\" + i;\n                i++;\n            }\n        }\n\n        for (String[] ca : chs) {\n            for (String c : ca) {\n                System.out.print(c + \" \");\n            }\n            System.out.println();\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "97 98\n99 100 null null null"}, {"key": "B", "text": "", "code": "97 98\n99 100 101 102 103"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "E", "text": "An ArrayIndexOutOfBoundsException is thrown at runtime.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "안쪽 for문이 `chs.length`(2)까지만 돌기 때문에 각 행의 앞 두 칸만 채워지고, chs[1]의 나머지 세 칸은 기본값 null로 출력됩니다.", "walkthrough": "1. `chs`는 행 2개짜리 가변 배열입니다. `chs[0]`은 길이 2, `chs[1]`은 길이 5이며 모든 요소는 기본값 null입니다.\n2. 바깥 for: a = 0, 1. 안쪽 for의 조건이 `b < chs.length`, 즉 `b < 2`입니다(행의 길이 `chs[a].length`가 아님).\n3. a=0: chs[0][0]=\"97\", chs[0][1]=\"98\". a=1: chs[1][0]=\"99\", chs[1][1]=\"100\". i는 101까지 증가합니다.\n4. 두 행 모두 인덱스 0, 1만 접근하므로 범위를 벗어나지 않아 예외가 없습니다.\n5. 출력 루프는 각 행의 실제 길이만큼 돌므로 1행 `97 98 `, 2행 `99 100 null null null `이 출력됩니다. null 참조를 문자열 연결하면 \"null\"이 됩니다.", "optionNotes": {"A": "정답입니다. 첫 행은 `97 98`, 둘째 행은 `99 100` 다음에 채워지지 않은 chs[1][2]~[4]가 null로 출력됩니다.", "B": "안쪽 루프가 `b < chs.length`(=2)이므로 각 행에 2개씩, 총 4개(97~100)만 채워집니다. 101~103은 저장되지 않습니다.", "C": "가변 길이 2차원 배열 선언과 \"\" + int 연결은 모두 합법이므로 컴파일됩니다.", "D": "null 요소를 `c + \" \"`로 연결하면 \"null\" 문자열이 될 뿐 메서드를 호출하지 않으므로 NullPointerException이 아닙니다. 두 행 모두 생성되어 있어 행 자체도 null이 아닙니다.", "E": "가장 짧은 행 chs[0]의 길이도 2이고, 인덱스는 0과 1만 쓰이므로 범위를 벗어나지 않습니다."}, "concepts": [{"title": "가변 길이(jagged) 2차원 배열", "body": "Java의 2차원 배열은 '배열의 배열'입니다. `new String[2][]`는 행 참조 2개만 만들고 각 행은 null입니다. 각 행에 서로 다른 길이의 배열을 넣을 수 있으므로, 순회할 때는 바깥 길이 `arr.length`와 행 길이 `arr[i].length`를 구분해야 합니다.\n```java\nint[][] m = new int[2][];\nm[0] = new int[1];\nm[1] = new int[3];\nfor (int i = 0; i < m.length; i++)\n    for (int j = 0; j < m[i].length; j++) m[i][j] = i + j;\n```"}, {"title": "배열 요소의 기본값과 null 출력", "body": "배열을 생성하면 요소가 기본값으로 초기화됩니다. 숫자형 0, boolean false, char '\\u0000', 참조형 null입니다. null 참조를 `+`로 문자열과 연결하거나 `println`에 넘기면 \"null\"이 출력되고 예외는 나지 않습니다. 하지만 null에 대해 메서드를 호출하면(`s.length()`) NullPointerException이 납니다."}], "trap": "안쪽 루프 조건이 `chs[a].length`가 아니라 `chs.length`라는 점을 놓치면 B나 E를 고르게 됩니다.", "no": 51, "topicName": "배열", "lesson": "안쪽 루프 조건이 `chs[a].length`가 아니라 `chs.length`(=2)이므로 각 행의 2칸만 채워집니다. 나머지는 기본값입니다.", "mine": {"tries": 1, "wrong": ["B"]}}, {"id": "148", "topic": "arrays", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Test {\n    public static void main (String [] args) {\n        int numbers [ ];\n        numbers = new int [2];\n        numbers [0] = 10;\n        numbers [1] = 20;\n\n        numbers = new int [4];\n        numbers [2] = 30;\n        numbers [3] = 40;\n        for (int x : numbers) {\n            System.out.print (\" \" + x) ;\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 20 30 40", "code": null}, {"key": "B", "text": "0 0 30 40", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "C", "answerNote": "덤프 정답 C(컴파일 실패)는 틀렸습니다. `int numbers [ ];`처럼 대괄호를 변수 이름 뒤에 두고 사이에 공백을 넣는 것도 합법적인 선언입니다. 실제로 컴파일과 실행이 되며 ` 0 0 30 40`이 출력됩니다(javac/java로 확인). 정답은 B입니다.", "summary": "`numbers = new int[4]`로 새 배열을 대입하면 이전 값 10, 20은 사라지고, 기본값 0이 든 새 배열에 30, 40만 채워져 `0 0 30 40`이 출력됩니다.", "walkthrough": "1. `int numbers [ ];`는 `int[] numbers;`와 같은 선언입니다. 대괄호는 타입 뒤에도 변수명 뒤에도 둘 수 있고, 사이의 공백은 무시됩니다.\n2. `numbers = new int[2];` 다음 `[0]=10`, `[1]=20` → 첫 번째 배열은 `{10, 20}`입니다.\n3. `numbers = new int[4];`는 기존 배열을 늘리는 것이 아니라 길이 4인 **새 배열**을 만들어 참조를 바꿉니다. 새 int 배열의 요소는 모두 기본값 `0`으로 초기화됩니다 → `{0, 0, 0, 0}`.\n4. `[2]=30`, `[3]=40` → `{0, 0, 30, 40}`. 이전 배열 `{10, 20}`은 더 이상 참조되지 않아 GC 대상이 됩니다.\n5. 향상된 for문이 각 요소 앞에 공백을 붙여 출력하므로 ` 0 0 30 40`이 출력됩니다. 인덱스는 모두 0~3 범위라 예외도 없습니다.", "optionNotes": {"A": "배열은 크기를 늘릴 수 없습니다. `new int[4]`는 새 배열이므로 이전 배열의 10, 20이 복사되지 않습니다.", "B": "정답입니다. 새 배열의 0, 1번 요소는 기본값 0이고 2, 3번 요소만 30, 40으로 채워졌습니다.", "C": "`int numbers [ ];`는 C 스타일 배열 선언으로 Java에서도 합법이고, 선언과 생성을 분리한 것도 문제없습니다. 컴파일 에러가 날 곳이 없습니다.", "D": "접근한 인덱스는 모두 길이 4인 배열의 0~3 범위 안이므로 `ArrayIndexOutOfBoundsException`이 나지 않습니다."}, "concepts": [{"title": "배열 선언의 여러 형태", "body": "다음은 모두 합법입니다: `int[] a;`, `int a[];`, `int [] a;`, `int a [ ];`. 다차원은 `int[][] b;`, `int b[][];`, `int[] b[];`를 섞어 써도 됩니다. 주의할 점은 `int[] x, y;`는 둘 다 배열이지만 `int x[], y;`는 `x`만 배열이고 `y`는 int라는 것입니다. 선언부에 크기를 쓰는 `int[3] a;`는 컴파일 에러입니다. 크기는 `new int[3]`처럼 생성할 때만 지정합니다."}, {"title": "배열 요소의 기본값과 재할당", "body": "`new`로 만든 배열의 요소는 지역 변수 안에 있어도 자동으로 기본값으로 초기화됩니다: 정수형 `0`, `double` `0.0`, `boolean` `false`, `char` `'\\u0000'`, 참조형 `null`. 배열 길이는 생성 후 바뀌지 않으므로, 같은 변수에 `new`를 다시 대입하면 완전히 새로운 객체를 가리키게 됩니다. 기존 값을 유지하며 키우려면 `Arrays.copyOf`나 `System.arraycopy`를 써야 합니다."}], "trap": "`int numbers [ ];`라는 낯선 선언 형태로 컴파일 에러를 떠올리게 하고, 배열이 \"확장\"되어 10, 20이 남아 있을 것이라는 착각(A)을 노립니다.", "no": 56, "topicName": "배열", "lesson": "`int numbers [ ];`는 합법 선언이므로 컴파일 에러(C)가 아닙니다. `new int[4]`를 다시 대입하면 이전 값은 사라지고 `0 0 30 40`이 됩니다.", "mine": {"tries": 1, "wrong": ["C"]}}, {"id": "89", "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [ ] args) {\n    int [] stack = {10,20,30};\n    int size = 3;\n    int idx = 0;\n    /*line n1 */\n    System.out.print (\"The Top element: \" + stack [idx] );\n}"}, {"type": "text", "content": "Which code fragment, inserted at line n1, prints The Top element: 30?"}], "options": [{"key": "A", "text": "", "code": "do {\n    idx++;\n} while (idx >=size);"}, {"key": "B", "text": "", "code": "while (idx < size) {\n    idx++;\n}"}, {"key": "C", "text": "", "code": "do {\n    idx++;\n} while (idx <size -1);"}, {"key": "D", "text": "", "code": "do {\n    idx++;\n} while (idx<= size);"}, {"key": "E", "text": "", "code": "while (idx <= size -1) {\n    idx++;\n}"}], "correct": "C", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. A는 `do { idx++; } while (idx >= size);`에서 `idx`가 1이 된 뒤 조건 `1 >= 3`이 거짓이라 루프를 바로 빠져나와 `stack[1]`인 `The Top element: 20`을 출력합니다. `idx`를 2에서 멈추는 것은 C(`while (idx < size - 1)`)뿐입니다.", "summary": "`stack[2]`(30)를 출력하려면 `idx`가 정확히 2에서 멈춰야 하며, 이를 만족하는 것은 `do { idx++; } while (idx < size - 1);`인 C뿐입니다.", "walkthrough": "`idx = 0`, `size = 3`에서 시작하며, 30은 인덱스 2에 있으므로 루프 후 `idx == 2`여야 합니다. 각 선택지를 실행했습니다.\n- A: `idx++` → 1, 조건 `1 >= 3` 거짓 → 종료. `stack[1]` = **20** 출력.\n- B: `0<3`, `1<3`, `2<3`일 때 증가하여 `idx = 3`에서 종료. `stack[3]` → `ArrayIndexOutOfBoundsException`.\n- C: `idx++` → 1, `1 < 2` 참 → `idx++` → 2, `2 < 2` 거짓 → 종료. `stack[2]` = **30** 출력.\n- D: `idx`가 4가 될 때까지 증가(`3 <= 3`까지 참). `stack[4]` → 예외.\n- E: `idx <= 2`인 동안 증가해 `idx = 3`이 되므로 `stack[3]` → 예외.\n따라서 `The Top element: 30`을 출력하는 것은 C입니다.", "optionNotes": {"A": "do-while 본문이 한 번 실행되어 `idx = 1`이 된 뒤 `1 >= 3`이 거짓이라 종료하므로 `The Top element: 20`이 출력됩니다. 덤프 정답과 달리 30이 아닙니다.", "B": "`idx < size`인 동안 증가하므로 `idx = 3`에서 끝나고, `stack[3]` 접근 시 `ArrayIndexOutOfBoundsException`이 발생합니다.", "C": "정답입니다. `idx`가 1, 2로 증가한 뒤 `2 < 2`가 거짓이 되어 멈추므로 `stack[2]`인 30이 출력됩니다.", "D": "`idx <= size`인 동안 계속 증가해 `idx = 4`가 되므로 `stack[4]` 접근 시 예외가 발생합니다.", "E": "`idx <= size - 1`, 즉 `idx <= 2`인 동안 증가하므로 `idx = 3`에서 끝나고, `stack[3]` 접근 시 `ArrayIndexOutOfBoundsException`이 발생합니다."}, "concepts": [{"title": "do-while문의 실행 순서", "body": "do-while은 본문을 **먼저 한 번 실행한 뒤** 조건을 검사합니다. 따라서 조건이 처음부터 거짓이어도 본문은 최소 1회 실행됩니다. 반면 while은 조건을 먼저 검사하므로 0회 실행될 수 있습니다. do-while은 `while (조건);`처럼 끝에 세미콜론이 반드시 필요합니다. 루프 종료 후 변수 값을 구할 때는 \"마지막으로 조건이 거짓이 된 시점의 값\"을 추적하세요.\n```java\nint i = 5;\ndo { i++; } while (i < 3);  // 본문 1회 실행, i = 6\nwhile (i < 3) { i++; }       // 0회 실행\n```"}, {"title": "루프 종료 값 계산 요령", "body": "`while (i < n) i++;`처럼 1씩 증가하는 루프는 `i == n`에서 끝나고, `while (i <= n) i++;`은 `i == n + 1`에서 끝납니다. 이렇게 끝난 값을 배열 인덱스로 쓰면 범위를 벗어나기 쉽습
