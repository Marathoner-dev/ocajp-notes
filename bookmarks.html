니다(off-by-one 오류). 길이 `n`인 배열의 마지막 인덱스는 `n - 1`이므로, 마지막 요소에서 멈추려면 조건이 `i < n - 1`이어야 합니다(1씩 증가하고 0에서 시작할 때)."}], "trap": "do-while의 조건이 처음 검사에서 바로 거짓이 되어도 본문이 한 번 실행된다는 점, 그리고 종료 시 `idx` 값이 정확히 몇인지(off-by-one)를 따져야 합니다.", "no": 64, "topicName": "반복문", "lesson": "do-while이 끝났을 때 `idx`가 정확히 몇인지 마지막 두 회차만 손으로 돌려 보세요. `idx < size`면 3에서 멈춰 `stack[3]`에서 예외가 나므로 B는 틀렸습니다.", "mine": {"tries": 1, "wrong": ["B"]}}, {"id": "101", "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int[] array = {1, 2, 3, 4, 5};"}, {"type": "text", "content": "And given the requirements:\n1. Process all the elements of the array in the order of entry.\n2. Process all the elements of the array in the reverse order of entry.\n3. Process alternating elements of the array in the order of entry.\nWhich two statements are true?"}], "options": [{"key": "A", "text": "Requirements 1, 2, and 3 can be implemented by using the enhanced for loop.", "code": null}, {"key": "B", "text": "Requirements 1, 2, and 3 can be implemented by using the standard for loop.", "code": null}, {"key": "C", "text": "Requirements 2 and 3 CANNOT be implemented by using the standard for loop.", "code": null}, {"key": "D", "text": "Requirement 1 can be implemented by using the enhanced for loop.", "code": null}, {"key": "E", "text": "Requirement 3 CANNOT be implemented by using either the enhanced for loop or the standard for loop.", "code": null}], "correct": "BD", "dumpAnswer": "BD", "answerNote": "", "summary": "표준 for문은 인덱스를 자유롭게 제어하므로 세 요구사항 모두 가능하고, 향상된 for문은 앞에서부터 모든 요소를 차례대로 처리하는 1번에 적합합니다.", "walkthrough": "- 요구사항 1(입력 순서대로 전체 처리): `for (int n : array)`로도, `for (int i = 0; i < array.length; i++)`로도 가능합니다.\n- 요구사항 2(역순 처리): 향상된 for문은 항상 처음부터 끝까지 한 방향으로만 돌기 때문에 역순으로 처리할 수 없습니다. 표준 for문은 `for (int i = array.length - 1; i >= 0; i--)`로 가능합니다.\n- 요구사항 3(하나 건너 하나 처리): 표준 for문은 `for (int i = 0; i < array.length; i += 2)`로 자연스럽게 구현합니다. 향상된 for문은 인덱스와 증감식을 지정할 수 없으므로 이런 용도에 맞지 않습니다(시험에서는 '구현할 수 없다'로 봅니다).\n따라서 B(표준 for문으로 1, 2, 3 모두 가능)와 D(향상된 for문으로 1 가능)가 참입니다.", "optionNotes": {"A": "향상된 for문은 인덱스 없이 앞에서부터 순서대로만 순회하므로 역순 처리(2)를 구현할 수 없습니다.", "B": "정답입니다. 표준 for문은 시작값, 조건, 증감식을 자유롭게 정할 수 있어 세 가지 모두 구현됩니다.", "C": "표준 for문으로 `i--`나 `i += 2`를 쓰면 2와 3을 구현할 수 있으므로 거짓입니다.", "D": "정답입니다. 모든 요소를 입력 순서대로 처리하는 것은 향상된 for문의 기본 동작입니다.", "E": "표준 for문에서 `i += 2`로 3번을 구현할 수 있으므로 거짓입니다."}, "concepts": [{"title": "향상된 for문(for-each)의 특징과 한계", "body": "`for (타입 변수 : 배열 또는 Iterable)` 형태로, 처음부터 끝까지 모든 요소를 차례대로 꺼냅니다. 인덱스에 접근할 수 없고, 역방향이나 건너뛰기 순회를 지정할 수 없습니다. 반복 변수에 값을 대입해도 배열 요소는 바뀌지 않습니다(복사본이기 때문입니다).\n```java\nint[] a = {1, 2, 3};\nfor (int n : a) { n = 0; } // a는 여전히 {1, 2, 3}\n```"}, {"title": "표준 for문의 구성", "body": "`for (초기화; 조건; 증감)`의 세 부분은 모두 생략 가능하며, 쉼표로 여러 변수를 다룰 수도 있습니다. 증감식에 `i--`, `i += 2` 등을 써서 역순·건너뛰기 순회가 가능하고, 인덱스로 요소를 수정할 수도 있습니다."}], "trap": "'모두 가능하다'는 A와 B 중 어느 반복문이 인덱스를 제어할 수 있는지 구분하게 하는 문제입니다. 향상된 for문은 방향과 간격을 바꿀 수 없습니다.", "no": 65, "topicName": "반복문", "lesson": "표준 for는 시작·조건·증감을 자유롭게 정하므로 역순, 2칸씩 건너뛰기, 전체 순회가 **모두** 가능합니다(B). 향상된 for는 앞에서부터 차례로만 돕니다(D).", "mine": {"tries": 1, "wrong": ["CD"]}}, {"id": "104", "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String[] arr = {\"A\", \"B\", \"C\", \"D\"};\n    for (int i = 0; i < arr.length; i++) {\n        System.out.print(arr[i] + \" \");\n        if (arr[i].equals(\"C\")) {\n            continue;\n        }\n        System.out.println(\"Work done\");\n        break;\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A B C Work done", "code": null}, {"key": "B", "text": "A B C D Work done", "code": null}, {"key": "C", "text": "A Work done", "code": null}, {"key": "D", "text": "Compilation fails", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "첫 요소 \"A\"는 \"C\"가 아니므로 continue를 건너뛰고 Work done 출력 후 break로 바로 반복이 끝납니다.", "walkthrough": "1. `i = 0`: `A `를 출력합니다. `\"A\".equals(\"C\")`가 false라서 `continue`는 실행되지 않습니다.\n2. 이어서 `Work done`을 `println`으로 출력합니다.\n3. 다음 문장 `break;`가 무조건 실행되어 for문 전체가 끝납니다.\n`B`, `C`, `D`는 처리되지 않습니다. 최종 출력은 `A Work done`입니다. `continue`가 실행되는 것은 요소가 `\"C\"`일 때뿐인데, 거기까지 도달하지 못합니다.", "optionNotes": {"A": "`break`가 조건 없이 첫 반복에서 실행되므로 `B`와 `C`까지 출력될 수 없습니다.", "B": "모든 요소를 출력하려면 `break`가 없어야 합니다. 첫 반복에서 루프가 끝나므로 틀렸습니다.", "C": "정답입니다. `A ` 출력 후 `Work done`을 찍고 `break`로 종료합니다.", "D": "`continue` 뒤에 `break`가 있어도 if 블록 안의 `continue`이므로 이후 문장은 도달 가능하며 문법 문제가 없습니다."}, "concepts": [{"title": "break와 continue", "body": "`break`는 가장 가까운 반복문(또는 switch)을 즉시 빠져나갑니다. `continue`는 현재 반복의 나머지를 건너뛰고 다음 반복(for문이라면 증감식 실행 후 조건 검사)으로 넘어갑니다. 라벨을 붙이면 바깥 반복문을 대상으로 할 수 있습니다(`break outer;`)."}, {"title": "도달할 수 없는 코드(unreachable statement)", "body": "블록 안에서 무조건적인 `break`, `continue`, `return`, `throw` 바로 뒤에 문장을 두면 컴파일 에러입니다.\n```java\nfor (;;) {\n    continue;\n    // System.out.println(); // 에러: unreachable\n}\n```\n그러나 이 문제처럼 `if` 안에 있는 `continue`는 조건부이므로 그 뒤 문장은 도달 가능하다고 판단됩니다."}], "trap": "`continue`에 시선을 끌어 \"C\"까지 진행될 것처럼 보이게 하지만, 실제로는 첫 반복의 무조건 `break`가 결과를 결정합니다.", "no": 66, "topicName": "반복문", "lesson": "본문 끝에 조건 없는 `break`가 있으면 첫 반복에서 끝납니다. `continue`에 시선을 뺏기지 말고 첫 반복을 끝까지 따라가세요. 같은 B를 두 번 골랐습니다.", "mine": {"tries": 3, "wrong": ["B", "B"]}}, {"id": "37", "topic": "basics", "parts": [{"type": "text", "content": "Which three statements describe the object-oriented features of the Java language? (Choose three.)"}], "options": [{"key": "A", "text": "Objects cannot be reused.", "code": null}, {"key": "B", "text": "A subclass can inherit from a superclass.", "code": null}, {"key": "C", "text": "Objects can share behaviors with other objects.", "code": null}, {"key": "D", "text": "A package must contain a main class.", "code": null}, {"key": "E", "text": "Object is the root class of all other objects.", "code": null}, {"key": "F", "text": "A main method must be declared in every class.", "code": null}], "correct": "BCE", "dumpAnswer": "BCF", "answerNote": "덤프 정답 BCF는 틀렸습니다. F(모든 클래스에 main이 있어야 한다)는 명백히 거짓이고, E(Object는 모든 클래스의 루트)는 명백히 참입니다. 따라서 정답은 BCE입니다.", "summary": "Java 객체 지향의 특징은 상속(자식 클래스가 부모를 상속), 객체 간 동작 공유, 그리고 Object가 모든 클래스의 루트라는 점입니다.", "walkthrough": "각 문장을 Java의 OOP 규칙에 맞춰 보면 다음과 같습니다.\n- A: 객체와 클래스는 상속과 조합으로 재사용할 수 있으므로 거짓입니다.\n- B: `class Sub extends Super`처럼 자식 클래스가 부모 클래스를 상속할 수 있으므로 참입니다. 이때 부모 메서드를 반드시 오버라이드할 필요는 없고 그대로 물려받아도 됩니다.\n- C: 같은 클래스의 객체나 상속 관계의 객체는 동작(메서드)을 공유하므로 참입니다.\n- D: 패키지에 main 클래스가 있어야 한다는 규칙은 없으므로 거짓입니다.\n- E: `extends`를 쓰지 않은 클래스도 자동으로 `java.lang.Object`를 상속하므로 참입니다.\n- F: main은 실행 시작점이 될 클래스에만 필요하므로 거짓입니다.", "optionNotes": {"A": "거짓입니다. 상속과 조합으로 기존 클래스와 객체를 재사용하는 것이 OOP의 핵심 장점입니다.", "B": "참입니다. `extends`로 부모 클래스의 멤버를 물려받는 상속은 대표적인 객체 지향 특징입니다.", "C": "참입니다. 상속이나 같은 클래스의 인스턴스라는 관계를 통해 객체들은 같은 메서드(동작)를 공유합니다.", "D": "거짓입니다. 패키지에는 main이 있는 클래스가 하나도 없어도 됩니다.", "E": "참입니다. 모든 클래스는 직접 또는 간접적으로 `java.lang.Object`를 상속합니다.", "F": "거짓입니다. main은 `java` 명령으로 실행할 클래스에만 필요합니다."}, "concepts": [{"title": "java.lang.Object", "body": "`extends`를 쓰지 않은 클래스는 컴파일러가 자동으로 `extends Object`를 붙입니다. 그래서 모든 객체는 `toString()`, `equals()`, `hashCode()` 같은 Object의 메서드를 가지며, 모든 참조(배열 포함)를 Object 타입 변수에 대입할 수 있습니다. 인터페이스는 Object를 상속하지 않지만 인터페이스 타입 참조로도 Object의 public 메서드를 호출할 수 있습니다."}, {"title": "오버라이딩은 선택, abstract는 의무", "body": "자식 클래스는 부모의 메서드를 오버라이드하지 않고 그대로 물려받아 쓸 수 있습니다. 다만 abstract 클래스나 인터페이스의 abstract 메서드를 물려받은 구체(non-abstract) 클래스는 반드시 구현해야 하며, 그렇지 않으면 컴파일 에러가 납니다. 자식 클래스도 abstract로 선언하면 구현 의무를 다음 자식에게 넘길 수 있습니다."}], "trap": "'must'(반드시)가 들어간 문장은 대부분 거짓입니다. main이 모든 클래스나 패키지에 필요하다는 보기도 단골 오답입니다.", "no": 5, "topicName": "Java 기초", "lesson": "Choose three인데 두 개만 골랐습니다. '상속은 OOP 특징'(B)처럼 너무 당연해 보이는 보기도 정답입니다. 고를 개수부터 확인하세요.", "mine": {"tries": 1, "wrong": ["CE"]}}, {"id": "30", "topic": "inheritance", "parts": [{"type": "text", "content": "Which two are benefits of polymorphism? (Choose two.)"}], "options": [{"key": "A", "text": "Faster code at runtime", "code": null}, {"key": "B", "text": "More efficient code at runtime", "code": null}, {"key": "C", "text": "More dynamic code at runtime", "code": null}, {"key": "D", "text": "More flexible and reusable code", "code": null}, {"key": "E", "text": "Code that is protected from extension by other classes", "code": null}], "correct": "CD", "dumpAnswer": "BD", "answerNote": "이 사본은 BD로 표기했고 다른 사본(배치 메타데이터)은 BC로 표기해 덤프마다 다릅니다. 실제 정답은 CD입니다. 다형성은 실행 시점에 실제 객체 타입에 따라 메서드가 결정되는 동적인 코드(C)와 유연하고 재사용 가능한 코드(D)를 가능하게 합니다. 오히려 가상 메서드 호출 때문에 실행 효율이 좋아지는 것은 아니므로 B는 다형성의 이점이 아닙니다.", "summary": "다형성의 이점은 실행 시점에 동작이 결정되는 동적인 코드와 유연하고 재사용 가능한 코드입니다.", "walkthrough": "다형성은 부모 타입 참조(`Animal a`)로 여러 자식 객체(`Dog`, `Cat`)를 다루고, `a.sound()`를 호출하면 실행 시점에 실제 객체의 메서드가 선택되는 성질입니다.\n- 어떤 메서드가 실행될지가 런타임에 결정되므로 코드가 **동적**입니다(C).\n- 부모 타입에 맞춰 짠 코드가 새 자식 클래스가 추가되어도 수정 없이 동작하므로 **유연하고 재사용**하기 좋습니다(D).\n- 속도나 실행 효율은 다형성의 목적이 아닙니다. 가상 메서드 호출은 오히려 약간의 비용이 있습니다(A, B 거짓).\n- 확장을 막는 것은 `final`의 역할이며 다형성과 반대 방향입니다(E 거짓).", "optionNotes": {"A": "다형성은 실행 속도를 높이는 기법이 아닙니다. 동적 디스패치는 오히려 정적 호출보다 약간 비용이 듭니다.", "B": "'실행 효율'도 다형성의 이점이 아닙니다. 다형성은 설계의 유연성을 위한 것이지 런타임 성능을 위한 것이 아닙니다.", "C": "정답입니다. 오버라이드된 메서드는 런타임의 실제 객체 타입으로 결정되므로(동적 바인딩) 코드가 실행 시점에 동적으로 동작합니다.", "D": "정답입니다. 부모 타입이나 인터페이스 기준으로 코드를 작성하면 새 구현을 추가해도 기존 코드를 재사용할 수 있습니다.", "E": "확장을 막는 것은 `final` 클래스와 메서드입니다. 다형성은 오히려 확장(상속과 오버라이딩)을 전제로 합니다."}, "concepts": [{"title": "다형성과 동적 바인딩", "body": "참조 변수의 타입(컴파일 타임 타입)은 어떤 메서드를 **호출할 수 있는지**를 결정하고, 실제 객체의 타입(런타임 타입)은 오버라이드된 메서드 중 **어느 것이 실행될지**를 결정합니다. 예를 들어 `Animal a = new Dog(); a.sound();`는 Dog의 sound()를 실행합니다. 단, 필드와 static 메서드는 다형적으로 동작하지 않고 참조 타입을 따릅니다."}, {"title": "OOP 이점 문제 푸는 요령", "body": "OCA의 개념 문제에서 다형성의 이점은 '유연성', '재사용성', '확장성', '런타임에 동작 결정'이 정답 키워드입니다. 캡슐화는 '데이터 보호와 접근 제어', 상속은 '코드 재사용'이 키워드입니다. 'faster', 'more efficient' 같은 성능 관련 문장은 대부분 오답입니다."}], "trap": "'More efficient code at runtime'은 그럴듯하게 들리지만 성능 이점은 다형성의 특징이 아닙니다. 덤프마다 답이 달라 외워서 풀면 틀리기 쉬운 문제입니다.", "no": 103, "topicName": "상속과 다형성", "lesson": "다형성의 이점은 동적인 코드(C)와 유연·재사용(D)입니다. '확장을 막는다'(E)는 `final`이 하는 일인데, 네 번 시도하면서 E를 계속 골랐습니다.", "mine": {"tries": 4, "wrong": ["DE", "DE"]}}, {"id": "35", "topic": "exceptions", "parts": [{"type": "text", "content": "Which three are advantages of the Java exception mechanism? (Choose three.)"}], "options": [{"key": "A", "text": "Improves the program structure because the error handling code is separated from the normal program function", "code": null}, {"key": "B", "text": "Provides a set of standard exceptions that covers all possible errors", "code": null}, {"key": "C", "text": "Improves the program structure because the programmer can choose where to handle exceptions", "code": null}, {"key": "D", "text": "Improves the program structure because exceptions must be handled in the method in which they occurred", "code": null}, {"key": "E", "text": "Allows the creation of new exceptions that are customized to the particular program being created", "code": null}], "correct": "ACE", "dumpAnswer": "ACE", "answerNote": "", "summary": "예외 메커니즘은 정상 로직과 오류 처리 코드를 분리하고, 처리 위치를 선택할 수 있게 하며, 사용자 정의 예외를 만들 수 있게 합니다.", "walkthrough": "Java 예외 메커니즘의 장점을 하나씩 보면 다음과 같습니다.\n- try 블록에는 정상 흐름을, catch 블록에는 오류 처리를 두어 코드가 분리됩니다(A).\n- 예외는 호출 스택을 따라 전파되므로, 직접 처리하거나 `throws`로 호출자에게 넘겨 원하는 곳에서 처리할 수 있습니다(C).\n- `Exception`이나 `RuntimeException`을 상속해 프로그램에 맞는 예외 클래스를 만들 수 있습니다(E).\n- 표준 예외가 모든 오류를 다룰 수는 없기 때문에 E가 존재합니다(B 거짓).\n- 예외가 발생한 메서드에서 반드시 처리해야 한다는 규칙은 없습니다(D 거짓).", "optionNotes": {"A": "정답입니다. try/catch로 정상 처리 코드와 오류 처리 코드가 분리되어 구조가 명확해집니다.", "B": "표준 예외 클래스가 많긴 하지만 모든 오류를 다루지는 못합니다. 그래서 사용자 정의 예외를 만들 수 있게 되어 있습니다.", "C": "정답입니다. 예외는 호출 스택을 따라 전파되므로 프로그래머가 처리할 위치를 고를 수 있습니다.", "D": "거짓입니다. 메서드는 `throws`로 예외를 호출자에게 넘길 수 있으므로 발생한 곳에서 꼭 처리할 필요가 없습니다.", "E": "정답입니다. Exception 계열 클래스를 상속해 도메인에 맞는 예외를 정의할 수 있습니다."}, "concepts": [{"title": "예외 전파와 handle-or-declare 규칙", "body": "checked 예외(Exception 중 RuntimeException 계열이 아닌 것)는 메서드 안에서 try/catch로 처리하거나 `throws`로 선언해야 합니다. unchecked 예외(RuntimeException, Error 계열)는 둘 다 하지 않아도 됩니다. 처리되지 않은 예외는 호출 스택을 거슬러 올라가며, main까지 처리되지 않으면 스택 트레이스를 출력하고 스레드가 종료됩니다."}, {"title": "사용자 정의 예외", "body": "`class InsufficientFundsException extends Exception { ... }`처럼 Exception을 상속하면 checked 예외, RuntimeException을 상속하면 unchecked 예외가 됩니다. 보통 메시지를 받는 생성자를 두고 `super(message)`를 호출합니다."}], "trap": "D는 '구조를 개선한다'는 그럴듯한 앞부분에 '발생한 메서드에서 꼭 처리해야 한다'는 틀린 규칙을 붙인 문장입니다.", "no": 119, "topicName": "예외 처리", "lesson": "예외 처리의 이점은 정상 로직과의 분리(A), 처리 위치 선택(C), 사용자 정의 예외(E)입니다. '표준 예외로 모든 오류 처리'(B)는 거짓입니다.", "mine": {"tries": 1, "wrong": ["ABC"]}}], "patterns": [{"key": "compile", "title": "컴파일 에러부터 찾기", "belief": "코드를 보자마자 출력을 계산했고, 반대로 낯선 문법은 무조건 에러라고 봤습니다.", "rules": "출력을 계산하기 전에 이 순서로 훑습니다.\n1. **파일 구조**: `package` → `import` → `class` 순서인지 봅니다. 지역 변수에는 `final` 말고 다른 수식어(`private`, `static`)를 붙일 수 없습니다.\n2. **지역 변수 초기화**: 모든 경로에서 값이 들어가는지 확인합니다. `if`나 `catch` 한쪽에서만 대입했다면 그 뒤에서 읽는 순간 에러입니다. 필드는 기본값이 있지만 지역 변수는 없습니다.\n3. **도달 불가 문장**: 같은 블록에서 `break` / `continue` / `return` / `throw` 바로 다음에 오는 문장은 에러입니다.\n4. **static 문맥**: static 메서드 안에서 `this`나 인스턴스 멤버를 직접 쓰면 에러입니다. `obj.field`처럼 참조를 거쳐야 합니다.\n5. **타입**: 좁히는 대입에 캐스트가 없으면 에러입니다. 기본형↔`String` 캐스트도 에러이고, `TRUE`나 `sb.size()`처럼 없는 이름을 써도 에러입니다.\n6. **생성자 체인**과 **checked 예외**는 따로 묶은 패턴에서 확인합니다.\n\n**반대로 아래는 모두 합법입니다.** 에러라고 고르지 마세요.\n- `int numbers[];` (C 스타일 배열 선언)\n- 괄호 없이 중첩한 삼항 `a ? b : c ? d : e`\n- 필드와 메서드 이름이 같은 클래스\n- abstract 메서드가 하나도 없는 abstract 클래스\n- unchecked 예외를 throws 선언 없이 던지기\n- `list.remove(null)`", "code": "", "qs": ["131", "53", "161", "41", "32"]}, {"key": "ctor", "title": "생성자 체인 (super / this)", "belief": "생성자 코드가 평범해 보여서 바로 출력을 계산했습니다. 그런데 정답은 대부분 컴파일 에러였습니다.", "rules": "- 생성자를 **하나라도 직접 만들면** 컴파일러는 기본 생성자 `Name()`을 만들어 주지 않습니다.\n- 첫 줄에 `super(...)`나 `this(...)`가 없으면 컴파일러가 **`super();`를 몰래 넣습니다**. 부모에 인자 없는 생성자가 없으면 여기서 에러가 납니다.\n- `super(...)`와 `this(...)`는 **첫 줄에만, 둘 중 하나만** 쓸 수 있습니다. 둘이 함께 보이면 계산하지 말고 바로 컴파일 에러입니다.\n- `this(...)`는 **같은 클래스**의 다른 생성자를, `super(...)`는 **부모** 생성자를 부릅니다. 인자 시그니처가 실제로 있는지 확인하세요.\n- `Person(name);`처럼 생성자를 메서드처럼 부를 수 없습니다. `super.r = r;`은 필드에 대입할 뿐 생성자 호출이 아닙니다.\n- 'line n1만', 'line n2만' 같은 보기가 있으면 **두 줄을 따로** 검사하세요. 둘 다 에러인 경우가 많습니다.", "code": "class Vehicle { Vehicle(String t) { } }      // 인자 없는 생성자 없음\nclass Car extends Vehicle {\n    Car() { }                          // ✗ 숨은 super() → Vehicle() 없음\n    Car(String t) { super(t); }        // ✓\n    Car(int n) { this(\"x\"); super(\"y\"); } // ✗ 둘 다 첫 줄일 수 없음\n}", "qs": ["60", "22", "111", "112", "X5"]}, {"key": "abstract", "title": "추상 클래스 · 인터페이스 · 오버라이딩 규칙", "belief": "추상 클래스 규칙과 인터페이스 규칙을 섞어서 기억했습니다.", "rules": "- **추상 클래스**는 `new`로 만들 수 없습니다. abstract 메서드가 0개여도 되고, static 메서드·일반 메서드·필드·생성자를 모두 가질 수 있습니다.\n- 본문 없는 메서드 `void m();`는 추상 클래스에서도 **`abstract`를 직접 써야** 합니다(인터페이스만 자동으로 abstract가 붙습니다). 반대로 `abstract void m() { }`처럼 본문을 붙여도 에러입니다.\n- 남은 추상 메서드는 **처음 나오는 구체 클래스**가 전부 구현해야 합니다. 해결책은 둘 중 하나입니다: 그 클래스에서 구현하거나, 그 클래스를 abstract로 만듭니다. 중간 부모를 구체 클래스로 바꾸면 에러가 부모로 옮겨갈 뿐입니다.\n- **오버라이딩은 접근 범위를 좁힐 수 없습니다**: `public` > `protected` > (default) > `private`. 인터페이스 메서드는 public이므로 구현할 때 `public`이 필수입니다.\n- **최상위 클래스**에는 `public` 또는 (없음)만 붙일 수 있습니다. `final`과 `abstract`는 함께 쓸 수 없습니다.", "code": "abstract class Toy {\n    static void info() { }      // ✓ static 메서드 가능\n    void show() { }             // ✓ 구현된 메서드 가능\n    abstract void play();       // ✓\n    void stop();                // ✗ 본문 없으면 abstract 필수\n}\nnew Toy();                      // ✗ 추상 클래스는 생성 불가", "qs": ["10", "42", "82", "86", "91", "107"]}, {"key": "poly", "title": "참조 타입 vs 실제 객체", "belief": "캐스트나 변수 선언 타입이 실행될 메서드를 바꾼다고 생각했습니다. 다운캐스트는 무조건 예외가 난다고 봤습니다.", "rules": "- **컴파일 시점에는 변수의 선언 타입만** 봅니다. 어떤 메서드·필드에 접근할 수 있는지, protected에 접근할 수 있는지가 여기서 정해집니다.\n- **실행 시점에는 `new`로 만든 실제 객체의 클래스**에서 오버라이딩된 메서드가 실행됩니다. 캐스트해도 바뀌지 않습니다.\n- 캐스트는 '리모컨 종류'만 바꿀 뿐 객체는 그대로입니다. 다운캐스트는 실제 객체가 그 타입(또는 그 하위 타입)이면 **성공**하고, 아닐 때만 `ClassCastException`이 납니다.\n- 상속 관계가 전혀 없는 클래스끼리 캐스트하면 컴파일 에러입니다.\n- 다른 패키지의 protected 멤버는 자식 클래스 안에서 **자식 타입 참조로만** 접근할 수 있습니다. 부모 타입 변수 `Acc obj`로는 안 됩니다.", "code": "Base b = new DerivedB();        // 객체는 DerivedB (DerivedB extends DerivedA)\n((DerivedA) b).test();          // ✓ DerivedB는 DerivedA이므로 캐스트 성공 → DerivedB.test()\n((Base) b).test();              // 여전히 DerivedB.test()", "qs": ["92", "15", "58", "153"]}, {"key": "exc", "title": "예외 흐름", "belief": "실제로 일어나는 예외 경로만 따라갔고, 컴파일러가 모든 경로를 검사한다는 점을 놓쳤습니다.", "rules": "- **checked 예외**(`Exception`의 하위 중 `RuntimeException` 계열이 아닌 것)는 **선언된 타입을 기준으로** catch하거나 throws해야 합니다. 하위 타입(`FileNotFoundException`)만 잡으면 `IOException`이 처리되지 않았다는 에러가 납니다.\n- catch는 **하위 타입부터** 씁니다. 상위 타입이 먼저 오면 아래 catch는 도달할 수 없어서 에러입니다.\n- `finally`는 return이나 throw가 있어도 실행됩니다.\n- catch에서 예외를 처리하고 끝나면 finally 다음 줄부터 이어집니다. 처리하지 못했거나 catch에서 다시 던지면 **finally만 실행하고** 메서드를 빠져나갑니다. finally 뒤의 코드는 실행되지 않습니다.\n- try 안의 대입은 '안 됐을 수도 있다'고 봅니다. try/catch 뒤에서 지역 변수를 읽는다면, 모든 catch에서 값을 넣었는지 확인하세요.", "code": "int ans;\ntry { ans = 10 / 0; }\ncatch (ArithmeticException e) { ans = 0; }\ncatch (Exception e) { System.out.println(\"err\"); }   // 여기선 ans 대입 없음\nSystem.out.println(ans);        // ✗ 컴파일 에러: 확정 할당되지 않음", "qs": ["27", "S4", "S6"]}, {"key": "immut", "title": "불변 객체와 값 전달", "belief": "메서드를 호출하거나 메서드에 넘기기만 하면 원본이 바뀐다고 생각했습니다.", "rules": "- **불변 객체**: `String`, `LocalDate`/`LocalDateTime`, 래퍼(`Integer` 등). 메서드는 새 객체를 돌려줄 뿐이므로 **대입하지 않으면 원본 그대로**입니다.\n- **가변 객체**: `StringBuilder`, 배열, `ArrayList`, 일반 객체의 필드.\n- 메서드 인자는 **항상 값으로 복사**됩니다. 기본형은 값이, 참조형은 '주소'가 복사됩니다.\n  - 메서드 안에서 다시 대입하는 것(`s = ...`, `x--`)은 호출한 쪽에 보이지 않습니다.\n  - 객체 내부를 고치는 것(`sb.append`, `arr[0] = ...`, `obj.f = ...`)만 보입니다.\n- 출력문이 **지역 변수**를 찍는지 **필드**를 찍는지 확인하세요.\n- **GC 문제**는 줄마다 '변수 → 객체' 화살표 표를 그립니다. 마지막에 아무 변수도 가리키지 않는 객체만 셉니다. `null`을 넣기 전에 다른 변수로 복사된 참조가 있으면 그 객체는 살아 있습니다.", "code": "String s = \"Hello\";\ns.concat(\" World\");             // 결과를 버림 → s는 그대로 \"Hello\"\nLocalDate d = LocalDate.of(2012, 1, 30);\nd.plusDays(10);                 // 결과를 버림 → d는 그대로 2012-01-30\nd = d.plusDays(10);             // 이렇게 대입해야 바뀜", "qs": ["103", "157", "123", "51", "96", "47"]}, {"key": "rtex", "title": "API 런타임 예외", "belief": "컴파일만 되면 정상 출력이 나온다고 생각했습니다.", "rules": "- `LocalDate.of(연, 월, 일)`은 **순서가 고정**입니다. 범위를 벗어나면(13월, 1월 32일, 2월 30일) 실행 시 `DateTimeException`이 납니다. 컴파일은 됩니다.\n- `LocalDate`에는 시간이 없습니다. 시간을 요구하는 포맷(`ISO_DATE_TIME`, `\"HH:mm\"`)으로 format하면 `UnsupportedTemporalTypeException`이 납니다.\n- `substring(b, e)`는 `0 ≤ b ≤ e ≤ length()`여야 하고, e 위치의 문자는 포함하지 않습니다. 벗어나면 `StringIndexOutOfBoundsException`입니다.\n- `new String[n]`의 요소는 전부 **null**이고, null에 메서드를 호출하면 `NullPointerException`입니다. 기본값은 int 0, boolean false, char `'\\u0000'`입니다.\n- 예외로 루프가 중간에 끊기면 그 뒤 요소는 처리되지 않습니다. 이미 채운 값과 null(또는 0)을 구분하세요.", "code": "LocalDate.of(2014, 6, 20);      // ✓ 2014-06-20\nLocalDate.of(6, 20, 2014);      // 컴파일 ✓, 실행 시 DateTimeException (20월)\n\"Peter\".substring(2, 6);        // 길이 5 → StringIndexOutOfBoundsException", "qs": ["124", "12", "56", "78", "X17"]}, {"key": "apiname", "title": "API 이름과 람다 문법", "belief": "컬렉션 메서드 이름과 StringBuilder 메서드 이름을 섞어 썼습니다.", "rules": "- **길이**: String `length()` · StringBuilder `length()` · 배열 `.length` · ArrayList `size()`\n- **StringBuilder 비우기**: `sb.delete(0, sb.length())` 또는 `sb.setLength(0)`. `clear()`, `removeAll()`, `size()`는 없습니다.\n- **`List<Integer>`의 remove**\n  - `remove(1)` → 인덱스 1을 지웁니다.\n  - `remove(Integer.valueOf(1))` → 값 1을 지웁니다.\n  - `remove(null)` → 첫 null을 지웁니다.\n- **람다**\n  - 매개변수가 하나면 괄호를 생략할 수 있습니다. 단, 타입을 쓰면 괄호가 필수입니다.\n  - 중괄호를 쓰면 `return ...;`이 필수이고, 중괄호가 없으면 `return`을 쓰면 안 됩니다.", "code": "Predicate<Person> a = p -> p.getAge() > 40;                 // ✓\nPredicate<Person> b = (Person p) -> p.getAge() > 40;        // ✓\nPredicate<Person> c = p -> { return p.getAge() > 40; };     // ✓\nPredicate<Person> d = p -> { p.getAge() > 40; };            // ✗ return 없음\nPredicate<Person> e = Person p -> p.getAge() > 40;          // ✗ 타입 있으면 괄호 필수", "qs": ["5", "20", "28"]}, {"key": "ops", "title": "연산자 · 형변환 · switch", "belief": "확대·축소 방향을 거꾸로 기억했고, 연산 순서를 눈대중으로 판단했습니다.", "rules": "- **자동 확대**: `byte → short → int → long → float → double`, `char → int`. 반대 방향은 캐스트가 필수이고, **double → float도 마찬가지**입니다. 예외로 int 상수는 범위 안이면 byte/short/char에 바로 대입할 수 있습니다.\n- **박싱은 확대를 하지 않습니다**: `Long x = 1;` ✗, `Double d = 1;` ✗, `Byte b = 1;` ✓ (상수 축소 + 박싱)\n- **switch에 쓸 수 있는 타입**: byte·short·char·int와 그 래퍼, String, enum. long·float·double·boolean은 안 됩니다. case 값의 타입도 맞아야 합니다.\n- **문자열 연결**은 왼쪽부터 진행하고, 문자열이 나온 뒤의 `+`는 모두 연결입니다: `1 + 2 + \"a\"` = `\"3a\"`, `\"a\" + 1 + 2` = `\"a12\"`. 값 하나만 감싼 `(1)`은 아무 효과가 없습니다.\n- **`x++`**: 식의 값은 증가 전 값이고, 변수는 그 즉시 증가합니다. `++x`는 먼저 증가합니다.\n- **삼항 연산자**는 값입니다. 단독 문장으로 쓸 수 없고, 중첩하면 오른쪽부터 묶입니다: `a ? b : c ? d : e` = `a ? b : (c ? d : e)`.", "code": "float f = 1.5f; double d = f;   // ✓ 확대\ndouble d2 = 1.5; float f2 = d2; // ✗ 축소는 캐스트 필요\nSystem.out.println(\"R \" + 0 + 1);   // R 01\nint a = 9; if (a++ < 10) System.out.println(a); // 10", "qs": ["59", "29", "69", "90", "98", "137"]}, {"key": "loop", "title": "반복문 · 배열 추적", "belief": "루프를 머릿속으로 돌리다가 시작값·조건·마지막 회차를 한 칸씩 틀렸습니다.", "rules": "- 표를 적습니다: **회차 | 변수들 | 조건 | 출력**. 처음 두 회차와 마지막 회차만 정확하면 됩니다.\n- **2차원 배열**: 바깥 조건은 `arr.length`(행 수), 안쪽 조건은 `arr[i].length`(열 수)입니다. 둘이 바뀌어 있거나 안쪽이 바깥 변수에 의존하면 일부만 방문합니다.\n- `do-while`은 **최소 1회** 실행됩니다. 루프가 끝났을 때 변수 값을 확인하세요(off-by-one).\n- 본문에 조건 없는 `break`가 있으면 **첫 반복에서 끝납니다**.\n- **향상된 for**: 앞에서부터 전부 돌고, 인덱스가 없습니다. 역순이나 건너뛰기는 할 수 없습니다. **표준 for**는 셋 다 할 수 있습니다.\n- `int a[];`도 합법입니다. `a = new int[4]`처럼 다시 만들면 이전 값 없이 기본값으로 채워진 새 배열이 됩니다. 배열은 늘어나지 않습니다.", "code": "String[][] chs = new String[2][];\nchs[0] = new String[2];\nchs[1] = new String[5];\nfor (int a = 0; a < chs.length; a++)\n    for (int b = 0; b < chs.length; b++)   // ← chs[a].length가 아님! 각 행 2칸만\n        chs[a][b] = \"x\";                    // chs[1]의 나머지 3칸은 null로 남음", "qs": ["85", "121", "148", "89", "101", "104"]}, {"key": "theory", "title": "개념 서술형", "belief": "고를 개수보다 적게 골랐거나, 그럴듯한 문장에 넘어갔습니다.", "rules": "- **고를 개수부터** 확인합니다. 확실히 참인 보기를 먼저 고르고, 나머지 중 거짓을 지웁니다.\n- `must`, `always`, `only`, `all`, `반드시`가 들어간 문장은 대부분 거짓입니다.\n- **외워 둘 참 문장**\n  - OOP 특징: 상속(`extends`), 객체 간 동작 공유, `Object`가 모든 클래스의 루트\n  - 다형성의 이점: 실행 시점에 결정되는 동적 코드, 유연하고 재사용 가능한 코드\n  - 예외 처리의 이점: 정상 로직과 오류 처리 분리, 처리 위치를 호출 스택 위로 선택, 사용자 정의 예외\n- **함정 문장**\n  - '확장을 막는다'는 `final`이 하는 일입니다. 다형성의 이점이 아닙니다.\n  - '더 효율적인 코드'는 다형성의 이점이 아닙니다.\n  - '표준 예외로 모든 오류를 처리'는 거짓입니다.\n  - '발생한 메서드에서 반드시 처리'도 거짓입니다.", "code": "", "qs": ["37", "30", "35"]}], "steps": "1. **고를 개수와 보기 종류부터 봅니다.** Choose two/three인지, 보기에 `Compilation fails`나 `An exception is thrown`이 있는지 확인합니다. 있으면 그 보기가 정답일 가능성을 먼저 검사해야 합니다.\n2. **출력을 계산하기 전에 컴파일 에러를 찾습니다.** 아래 '컴파일 에러부터 찾기' 체크리스트를 5초 동안 훑습니다. 틀린 47문제 중 약 3분의 1이 '컴파일 에러인지, 예외가 나는지'를 잘못 판단한 경우였습니다.\n3. **그다음 런타임 예외를 찾습니다.** null 요소, 범위를 벗어난 인덱스·날짜, 잘못된 다운캐스트가 있는지 봅니다.\n4. **마지막에 값을 추적합니다.** 머릿속으로 돌리지 말고 회차·변수·출력을 표로 적습니다.", "cram": "- **생성자**: 직접 만들면 기본 생성자는 사라집니다. 첫 줄에 아무것도 없으면 `super()`가 숨어 있습니다. `super`/`this`는 첫 줄에 하나만 씁니다.\n- **추상 클래스**: `new` ✗ · 본문 없는 메서드엔 `abstract` 필수 · static·구현 메서드 ✓ · abstract 메서드 0개 ✓\n- **오버라이딩**: 접근 범위를 좁히면 ✗. 인터페이스 구현 메서드는 `public`\n- **최상위 클래스**: `public` 또는 (없음)만. `final abstract` ✗\n- **캐스트**: 객체는 그대로이고 실행 메서드도 실제 객체 것. CCE는 실제 객체가 그 타입이 아닐 때만\n- **protected**: 다른 패키지에선 자식 타입 참조로만\n- **지역 변수**: 기본값이 없으므로 모든 경로(if, catch)에서 대입했는지 확인\n- **도달 불가**: `break` / `continue` / `return` / `throw` 바로 뒤 문장 → 컴파일 에러\n- **checked 예외**: 선언된 타입으로 판단합니다. 하위 타입만 catch하면 ✗\n- **finally**: 항상 실행. 예외가 처리되지 않으면 finally 뒤 코드는 실행 ✗\n- **불변**: String, LocalDate, 래퍼는 결과를 대입하지 않으면 그대로\n- **값 전달**: 메서드 안의 재대입은 호출한 쪽에 안 보이고, 객체 내부 수정만 보임\n- **LocalDate.of(연, 월, 일)**: 범위를 벗어나면 런타임 `DateTimeException`. LocalDate + 시간 포맷 → 예외\n- **substring(b, e)**: e ≤ length, e는 미포함\n- **`new String[n]`**: 요소가 null → NPE\n- **길이**: String·StringBuilder `length()`, 배열 `length`, List `size()`. StringBuilder 비우기는 `setLength(0)`\n- **`List<Integer>.remove(1)`**: 인덱스 1을 지움\n- **람다**: `{ }`를 쓰면 `return ...;` 필수\n- **확대**: byte→short→int→long→float→double. **double→float은 캐스트 필수**. `Long x = 1;` ✗\n- **switch**: long·float·double·boolean ✗\n- **`\"a\" + 1 + 2`** = `\"a12\"`, **`1 + 2 + \"a\"`** = `\"3a\"`\n- **`x++ < 10`**: 비교는 이전 값, 블록 안에선 이미 증가\n- **삼항**: 단독 문장 ✗, 중첩은 오른쪽부터\n- **2차원 루프**: 안쪽 조건이 `arr[i].length`인지 확인. do-while은 최소 1회\n- **서술형**: 고를 개수 확인. must/only/always는 거짓 경향", "asOf": "2026-10-26"}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const QS = DATA.questions, PATS = DATA.patterns;
  const byId = Object.fromEntries(QS.map(q => [q.id, q]));

  // ---- tiny markdown (same as the main notes page) ----
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function codeBlock(src, lang) {
    let html;
    try { html = (window.hljs && lang !== 'text') ? hljs.highlight(src, { language: 'java', ignoreIllegals: true }).value : esc(src); }
    catch (e) { html = esc(src); }
    return '<pre class="code"><code>' + html + '</code></pre>';
  }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  function md(text) {
    if (!text) return '';
    const out = []; const lines = String(text).replace(/\r/g, '').split('\n');
    let i = 0, para = [], list = null;
    const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
    while (i < lines.length) {
      const l = lines[i];
      const fence = l.match(/^\s*```(\w*)/);
      if (fence) {
        flushP(); flushL(); const buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        out.push(codeBlock(buf.join('\n'), fence[1] || 'java')); i++; continue;
      }
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        flushP(); const t = ul ? 'ul' : 'ol';
        if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
        list.items.push((ul || ol)[1]); i++; continue;
      }
      if (!l.trim()) { flushP(); flushL(); i++; continue; }
      if (list) { list.items[list.items.length - 1] += ' ' + l.trim(); i++; continue; }
      para.push(l.trim()); i++;
    }
    flushP(); flushL();
    return out.join('');
  }
  const looksLikeCode = s => /[;{}()=]|^\s*(java|javac)\s/.test(s) && !/[가-힣]/.test(s);

  // ---- redo results: this page's own record, plus appended to the main page's attempt log (same origin) so it syncs from there ----
  const RKEY = 'ocajp-bm-v1', MAIN_KEY = 'ocajp-notes-v2';
  let redo = {};
  try { redo = JSON.parse(localStorage.getItem(RKEY) || '{}') || {}; } catch (e) {}
  function record(id, picked, ok) {
    redo[id] = { ok: ok ? 1 : 0, p: picked, t: Date.now() };
    try { localStorage.setItem(RKEY, JSON.stringify(redo)); } catch (e) {}
    try {
      const db = JSON.parse(localStorage.getItem(MAIN_KEY) || 'null') || { log: [], flag: {}, reset: 0 };
      db.log = (db.log || []).concat({ q: id, p: picked, ok: ok ? 1 : 0, t: Date.now() }).slice(-5000);
      localStorage.setItem(MAIN_KEY, JSON.stringify(db));
    } catch (e) {}
  }

  // ---- render ----
  const ord = n => String(n).padStart(2, '0');
  const pats = PATS.map(p => Object.assign({}, p, { wrong: p.qs.reduce((s, id) => s + byId[id].mine.wrong.length, 0) }))
    .sort((a, b) => (b.key === 'compile') - (a.key === 'compile') || b.wrong - a.wrong || b.qs.length - a.qs.length);
  const totalTries = QS.reduce((s, q) => s + q.mine.tries, 0), totalWrong = QS.reduce((s, q) => s + q.mine.wrong.length, 0);

  document.getElementById('lede').textContent = '북마크한 ' + QS.length + '문제를 내가 틀린 방식별로 ' + pats.length + '개 패턴으로 묶었습니다. 패턴마다 규칙을 먼저 읽고, 문제를 다시 풀면서 "다시 안 틀리는 한 줄"을 확인하세요.';
  document.getElementById('stats').innerHTML =
    '<span><b>' + QS.length + '</b>문제</span><span>지금까지 <b>' + totalTries + '</b>번 풀어 <b>' + totalWrong + '</b>번 틀림</span><span>북마크 기준 ' + esc(DATA.asOf) + '</span>';
  document.getElementById('steps').innerHTML = md(DATA.steps);
  document.getElementById('cram-body').innerHTML = md(DATA.cram);

  function mineLine(q) {
    const m = q.mine;
    if (!m.tries) return '아직 풀이 기록이 없습니다.';
    const ok = m.tries - m.wrong.length;
    return '지난 기록: ' + m.tries + '번 풀어 ' + ok + '번 맞힘' + (m.wrong.length ? ' · 내가 고른 오답 <span class="bad">' + m.wrong.map(p => esc(p || '?')).join(', ') + '</span>' : '');
  }
  function stemHTML(q) {
    return q.parts.map(p => p.type === 'code' ? codeBlock(p.content) : '<p>' + inline(p.content).replace(/\n/g, '<br>') + '</p>').join('');
  }
  function optHTML(o) {
    let body = '';
    if (o.text) body += looksLikeCode(o.text) && !o.code ? codeBlock(o.text) : '<div>' + inline(o.text) + '</div>';
    if (o.code) body += codeBlock(o.code);
    return '<li><button type="button" class="opt" data-k="' + o.key + '"><span class="key">' + o.key + '</span><span class="body">' + body + '</span></button></li>';
  }
  function myPickHTML(q) {
    // explain each wrong option I picked, and each correct option I missed (multi-answer)
    const right = new Set(q.correct.split('')), picked = new Set(), missed = new Set();
    q.mine.wrong.forEach(p => { p.split('').forEach(k => right.has(k) ? 0 : picked.add(k)); q.correct.split('').forEach(k => p.includes(k) ? 0 : missed.add(k)); });
    if (!picked.size && !missed.size) return '';
    let h = '<section><h3>내가 틀린 이유</h3><div class="mypick">';
    [...picked].sort().forEach(k => h += '<div class="row"><span class="key">' + k + ' 고름</span><div class="md">' + md(q.optionNotes[k] || '') + '</div></div>');
    if (q.correct.length > 1) [...missed].sort().forEach(k => h += '<div class="row miss"><span class="key">' + k + ' 놓침</span><div class="md">' + md(q.optionNotes[k] || '') + '</div></div>');
    return h + '</div></section>';
  }
  function exHTML(q) {
    const right = new Set(q.correct.split(''));
    let h = '<div class="ex" hidden>';
    h += '<div class="answer-line"><span class="ans">정답 ' + q.correct.split('').join(', ') + '</span><span class="sum">' + inline(q.summary || '') + '</span></div>';
    h += '<div class="lesson md"><b class="lbl">다시 안 틀리는 한 줄</b>' + md(q.lesson) + '</div>';
    h += myPickHTML(q);
    if (q.answerNote) h += '<div class="note md"><b class="lbl">' + (q.dumpAnswer && q.dumpAnswer !== q.correct ? '덤프 표기 ' + esc(q.dumpAnswer) + ' · 검증 정답 ' + esc(q.correct) : '참고') + '</b> ' + md(q.answerNote).replace(/^<p>|<\/p>$/g, '') + '</div>';
    h += '<section><h3>풀이</h3><div class="md">' + md(q.walkthrough) + '</div></section>';
    if (q.trap) h += '<section><h3>시험 함정</h3><div class="trap md">' + md(q.trap) + '</div></section>';
    h += '<details class="concept"><summary>보기별 분석 전체</summary><div class="optex" style="padding:0 14px 12px">' + q.options.map(o =>
      '<div class="row' + (right.has(o.key) ? ' right' : '') + '"><span class="key">' + o.key + (right.has(o.key) ? ' ✓' : '') + '</span><div class="md">' + md(q.optionNotes[o.key] || '') + '</div></div>').join('') + '</div></details>';
    (q.concepts || []).forEach(c => h += '<details class="concept"><summary>' + inline(c.title) + '</summary><div class="md">' + md(c.body) + '</div></details>');
    return h + '</div>';
  }
  function cardHTML(q) {
    return '<article class="q" id="q' + q.no + '" data-id="' + esc(q.id) + '">' +
      '<div class="qhead"><span class="qno">Q' + String(q.no).padStart(3, '0') + '</span>' +
      '<span class="chip">' + esc(q.topicName) + '</span>' +
      (q.correct.length > 1 ? '<span class="chip multi">' + q.correct.length + '개 선택</span>' : '') +
      '<span class="chip redo-ok" hidden>다시 맞힘</span><span class="spacer"></span>' +
      '<a class="src" href="./#q' + q.no + '">전체 노트에서 보기</a></div>' +
      '<div class="mine-line">' + mineLine(q) + '</div>' +
      '<div class="stem">' + stemHTML(q) + '</div>' +
      '<ul class="opts">' + q.options.map(optHTML).join('') + '</ul>' +
      '<div class="actions"><button type="button" class="btn act-check">채점하기</button><button type="button" class="btn ghost act-show">정답 보기</button><button type="button" class="btn ghost act-retry" hidden>다시 풀기</button><span class="verdict"></span></div>' +
      exHTML(q) + '</article>';
  }

  document.getElementById('overview').innerHTML = pats.map((p, i) =>
    '<a class="ov" href="#p-' + p.key + '"><span class="t">' + ord(i + 1) + ' · ' + esc(p.title) + '</span>' +
    '<span class="m">' + p.qs.length + '문제 · 오답 <span class="bad">' + p.wrong + '</span>회 · 다시 맞힘 <span class="cnt" data-p="' + p.key + '">0</span>/' + p.qs.length + '</span>' +
    '<span class="meter"><i data-p="' + p.key + '"></i></span></a>').join('');

  document.getElementById('main').innerHTML = pats.map((p, i) =>
    '<div class="pat-head" id="p-' + p.key + '"><span class="idx">PATTERN ' + ord(i + 1) + ' · ' + p.qs.length + '문제 · 오답 ' + p.wrong + '회</span><h2>' + esc(p.title) + '</h2></div>' +
    '<div class="belief md"><p><b>내가 빠진 생각</b> ' + inline(p.belief) + '</p></div>' +
    '<section class="panel rules"><h3>규칙</h3><div class="md">' + md(p.rules) + '</div>' + (p.code ? codeBlock(p.code) : '') + '</section>' +
    p.qs.map(id => cardHTML(byId[id])).join('')).join('');

  // ---- interaction ----
  let mode = 'quiz', onlyLeft = false;
  function reveal(card, on) {
    card.querySelector('.ex').hidden = !on;
    card.classList.toggle('revealed', on);
    if (on) card.querySelectorAll('.opt').forEach(b => { if (byId[card.dataset.id].correct.includes(b.dataset.k)) b.classList.add('right'); });
  }
  function clearCard(card) {
    card.classList.remove('revealed', 'graded');
    card.querySelectorAll('.opt').forEach(b => b.classList.remove('sel', 'right', 'wrong'));
    card.querySelector('.verdict').textContent = ''; card.querySelector('.verdict').className = 'verdict';
    card.querySelector('.act-retry').hidden = true;
    card.querySelector('.act-check').hidden = false; card.querySelector('.act-show').hidden = false;
    card.querySelector('.ex').hidden = true;
  }
  function grade(card) {
    const q = byId[card.dataset.id];
    const picked = [...card.querySelectorAll('.opt.sel')].map(b => b.dataset.k).sort().join('');
    const v = card.querySelector('.verdict');
    if (!picked) { v.className = 'verdict'; v.textContent = '보기를 먼저 고르세요.'; return; }
    if (q.correct.length > 1 && picked.length !== q.correct.length) { v.className = 'verdict'; v.textContent = q.correct.length + '개를 골라야 합니다.'; return; }
    const ok = picked === q.correct;
    card.classList.add('graded');
    card.querySelectorAll('.opt').forEach(b => { if (b.classList.contains('sel') && !q.correct.includes(b.dataset.k)) b.classList.add('wrong'); });
    v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    v.textContent = ok ? '정답입니다' : '틀렸습니다 · 정답 ' + q.correct.split('').join(', ');
    card.querySelector('.act-check').hidden = true; card.querySelector('.act-show').hidden = true; card.querySelector('.act-retry').hidden = false;
    reveal(card, true);
    record(q.id, picked, ok);
    refresh();
  }
  document.getElementById('main').addEventListener('click', e => {
    const card = e.target.closest('article.q'); if (!card) return;
    const q = byId[card.dataset.id];
    const opt = e.target.closest('.opt');
    if (opt && !card.classList.contains('graded') && !card.classList.contains('revealed')) {
      if (q.correct.length === 1) card.querySelectorAll('.opt.sel').forEach(b => b !== opt && b.classList.remove('sel'));
      opt.classList.toggle('sel'); card.querySelector('.verdict').textContent = ''; return;
    }
    if (e.target.closest('.act-check')) grade(card);
    else if (e.target.closest('.act-show')) reveal(card, true);
    else if (e.target.closest('.act-retry')) clearCard(card);
  });

  function refresh() {
    let done = 0;
    QS.forEach(q => {
      const card = document.querySelector('article.q[data-id="' + CSS.escape(q.id) + '"]');
      const ok = redo[q.id] && redo[q.id].ok;
      if (ok) done++;
      card.classList.toggle('cleared', !!ok);
      card.querySelector('.redo-ok').hidden = !ok;
      card.hidden = onlyLeft && !!ok;
    });
    pats.forEach(p => {
      const n = p.qs.filter(id => redo[id] && redo[id].ok).length;
      document.querySelector('.cnt[data-p="' + p.key + '"]').textContent = n;
      document.querySelector('.meter i[data-p="' + p.key + '"]').style.width = (100 * n / p.qs.length) + '%';
    });
    document.getElementById('prog').innerHTML = '다시 맞힌 문제 <b>' + done + '</b> / ' + QS.length;
  }
  function setMode(m) {
    mode = m;
    document.getElementById('mode-quiz').setAttribute('aria-pressed', m === 'quiz');
    document.getElementById('mode-review').setAttribute('aria-pressed', m === 'review');
    document.querySelectorAll('article.q').forEach(c => { if (m === 'review') reveal(c, true); else if (!c.classList.contains('graded')) clearCard(c); });
  }
  document.getElementById('mode-quiz').addEventListener('click', () => setMode('quiz'));
  document.getElementById('mode-review').addEventListener('click', () => setMode('review'));
  document.getElementById('only-left').addEventListener('change', e => { onlyLeft = e.target.checked; refresh(); });
  refresh();
})();
</script>
</body>
</html>
