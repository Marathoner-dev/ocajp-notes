<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>북마크 오답 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky left rail (exam-objective filter + question number grid) beside a single reading column of question cards; rail collapses into a top toolbar on phones. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --ink: #17202C; --muted: #5A6577; --line: #DCE1E8;
  --accent: #1F4FD1; --accent-weak: #E5EBFB;
  --ok: #1B7A48; --ok-weak: #E2F2E9; --bad: #B3322A; --bad-weak: #F8E4E2; --warn: #8F5B00; --warn-weak: #FAEFD7;
  --code-bg: #F6F8FB; --code-ink: #1D2633; --k: #7A2FB8; --s: #1B7A48; --n: #B0510F; --c: #7B8494; --t: #1F4FD1;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--font-mono); }

.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; }
header.top { min-width: 0; grid-column: 1 / -1; padding-block: 36px 8px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h1 .code { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

/* rail */
aside.rail { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 18px; padding-bottom: 8px; }
.rail h2 { margin: 0 0 8px; font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.topics { display: grid; gap: 2px; }
.topic-btn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 14px; }
.topic-btn:hover { background: var(--accent-weak); }
.topic-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.topic-btn .n { font-family: var(--font-mono); font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
.toggles { display: grid; gap: 6px; font-size: 14px; }
.toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.grid a { display: block; text-align: center; padding: 4px 0; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; text-decoration: none; color: var(--muted); border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.grid a.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.grid a.bad { background: var(--bad-weak); color: var(--bad); border-color: transparent; }
.grid a.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.grid a.supp { border-style: dashed; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }

/* main */
main { min-width: 0; display: grid; gap: 22px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.section-head h2 { margin: 0; font-size: 19px; }
.section-head span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
article.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 16px; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.qno { font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); white-space: nowrap; }
.chip.supp { background: var(--warn-weak); color: var(--warn); }
.chip.multi { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.qhead .spacer { flex: 1; }
.flag-btn { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.flag-btn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); background: var(--warn-weak); }
.src { font-size: 12.5px; color: var(--muted); }
.stem { display: grid; gap: 10px; min-width: 0; }
.stem p { margin: 0; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; tab-size: 4; }
pre.code code { font-family: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--k); }
.hljs-string { color: var(--s); }
.hljs-number { color: var(--n); }
.hljs-comment { color: var(--c); font-style: italic; }
.hljs-title, .hljs-type, .hljs-class .hljs-title { color: var(--t); }
.hljs-meta { color: var(--c); }

.opts { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-weight: 600; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--bg); font-size: 13px; }
.opt .body { min-width: 0; display: grid; gap: 6px; }
.opt .body pre.code { font-size: 12.5px; padding: 8px 12px; }
.opt.sel { border-color: var(--accent); background: var(--accent-weak); }
.opt.sel .key { background: var(--accent); color: var(--surface); }
.revealed .opt, .graded .opt { cursor: default; }
.revealed .opt.right, .graded .opt.right { border-color: var(--ok); background: var(--ok-weak); }
.revealed .opt.right .key, .graded .opt.right .key { background: var(--ok); color: var(--surface); }
.revealed .opt.wrong, .graded .opt.wrong { border-color: var(--bad); background: var(--bad-weak); }
.revealed .opt.wrong .key, .graded .opt.wrong .key { background: var(--bad); color: var(--surface); }
.graded .opt.sel:not(.wrong):not(.right) { border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn.ghost { background: none; color: var(--accent); }
.verdict { font-size: 14px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

.ex { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 16px; min-width: 0; }
.ex h3 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.answer-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.answer-line .ans { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--ok); }
.answer-line .sum { font-weight: 500; }
.note { border-radius: 8px; padding: 10px 14px; background: var(--warn-weak); color: var(--ink); font-size: 14.5px; }
.note b.lbl { color: var(--warn); }
.md { min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .5em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md code:not(pre code) { font-size: .9em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre.code { margin: .6em 0; }
.optex { display: grid; gap: 8px; }
.optex .row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.optex .row .key { font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding-top: 2px; color: var(--bad); }
.optex .row.right .key { color: var(--ok); }
details.concept { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.concept summary { cursor: pointer; padding: 9px 14px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.concept summary::before { content: "+"; font-family: var(--font-mono); color: var(--accent); width: 12px; }
details.concept[open] summary::before { content: "−"; }
details.concept .md { padding: 0 14px 12px 34px; }
.trap { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: none; cursor: pointer; color: var(--muted); }
.tag:hover { color: var(--accent); border-color: var(--accent); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

#index .cols { columns: 2 260px; column-gap: 28px; font-size: 14px; }
#index .entry { break-inside: avoid; padding: 3px 0; display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px dotted var(--line); }
#index .entry a { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; }

.syncbox { display: grid; gap: 8px; font-size: 13.5px; }
.syncbox h2 { margin: 0; }
.sync-status { margin: 0; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.sync-status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transform: translateY(-1px); }
.sync-status[data-s="ok"]::before { background: var(--ok); }
.sync-status[data-s="syncing"]::before { background: var(--accent); }
.sync-status[data-s="auth"]::before, .sync-status[data-s="error"]::before { background: var(--bad); }
.sync-status[data-s="offline"]::before { background: var(--warn); }
#sync-panel { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
#sync-panel .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sync-actions .btn { padding: 5px 12px; font-size: 13px; }
.rail-links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.src .mine { color: var(--ink); }
#history .hist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; }
#history .hist > div { min-width: 0; }
#history h3 { margin: 0 0 6px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.hist-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist-table th, .hist-table td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.hist-table th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.hist-table td.num { text-align: right; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ok); vertical-align: middle; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 92px; }
.days .d { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.days .col { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
.days .col.zero { background: var(--line); }
.recent { list-style: none; margin: 0; padding: 0; font-size: 14px; display: grid; gap: 2px; }
.recent li { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
.recent .when { color: var(--muted); font-size: 12.5px; min-width: 88px; }
.recent .ok { color: var(--ok); } .recent .bad { color: var(--bad); }
.hist-empty { color: var(--muted); margin: 0; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  aside.rail { position: static; max-height: none; overflow: visible; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-btn { width: auto; border: 1px solid var(--line); background: var(--surface); }
  .rail .grid-wrap { display: none; }
  article.q { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* Layout: one reading column — header, 4-step method, pattern overview, then each mistake pattern (rules box + its question cards), cram sheet last. */
.wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.wrap > *, .panel > *, .q > * { min-width: 0; }
.wrap > header { padding-block: 36px 4px; display: grid; gap: 10px; }
.back { font-size: 13.5px; }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toolbar .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toolbar .seg button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
.toolbar .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.toolbar label { font-size: 13.5px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.toolbar .prog { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar .prog b { color: var(--ok); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 24px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font-size: 18px; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ov { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--ink); }
.ov:hover { border-color: var(--accent); }
.ov .t { font-weight: 600; font-size: 15px; }
.ov .m { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ov .m .bad { color: var(--bad); }
.meter { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.pat-head { margin-top: 26px; display: grid; gap: 4px; scroll-margin-top: 64px; }
.pat-head .idx { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.pat-head h2 { margin: 0; font-size: 22px; }
.belief { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; color: var(--ink); }
.belief b { color: var(--bad); }
.rules { border: 1px solid var(--accent); background: var(--accent-weak); }
.rules h3, .panel h3 { margin: 0; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lesson { border-radius: 8px; padding: 12px 14px; background: var(--ok-weak); border: 1px solid var(--ok); }
.lesson b.lbl { color: var(--ok); display: block; font-size: 12.5px; margin-bottom: 2px; }
.mine-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mine-line .bad { color: var(--bad); font-weight: 600; }
.mypick { display: grid; gap: 8px; }
.mypick .row { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--bad-weak); }
.mypick .row .key { font-family: var(--font-mono); font-weight: 600; color: var(--bad); font-size: 13px; padding-top: 2px; }
.mypick .row.miss { background: var(--warn-weak); }
.mypick .row.miss .key { color: var(--warn); }
.chip.redo-ok { background: var(--ok-weak); color: var(--ok); }
article.q.cleared { border-color: var(--ok); }
.cram { columns: 2 320px; column-gap: 28px; }
.cram li { break-inside: avoid; }
details.more > summary { cursor: pointer; color: var(--accent); font-size: 14px; }
@media (max-width: 860px) { .panel { padding: 16px; } article.q { padding: 18px 16px; } .toolbar .prog { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./">← 전체 해설 노트로 돌아가기</a> <a class="back" href="summary.html" style="margin-left:14px">개념 정리노트 →</a>
    <div class="eyebrow">OCAJP 1Z0-808 · 북마크 오답 노트</div>
    <h1>다시 틀리지 않기 위한 <span class="code">52</span>문제 정리</h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="보기 방식">
      <button type="button" id="mode-quiz" aria-pressed="true">다시 풀기</button>
      <button type="button" id="mode-review" aria-pressed="false">정답 펼쳐 보기</button>
    </div>
    <label><input type="checkbox" id="only-left"> 아직 다시 못 맞힌 문제만</label>
    <span class="prog" id="prog"></span>
  </div>

  <section class="panel">
    <h3>풀이 순서 4단계</h3>
    <div class="md" id="steps"></div>
  </section>

  <section class="panel">
    <h3>내 실수 패턴</h3>
    <p class="mine-line" style="margin:0">모든 문제에 먼저 적용할 '컴파일 에러부터 찾기'를 맨 앞에 두고, 나머지는 많이 틀린 순서로 정렬했습니다. 누르면 해당 패턴으로 이동합니다.</p>
    <div class="overview" id="overview"></div>
  </section>

  <main id="main" style="display:grid;gap:18px;min-width:0"></main>

  <section class="panel" id="cram">
    <h3>시험 직전 1분 체크리스트</h3>
    <div class="md cram" id="cram-body"></div>
  </section>
</div>

<script id="data" type="application/json">{"questions": [{"id": "131", "topic": "basics", "parts": [{"type": "text", "content": "Given the content of three files:"}, {"type": "code", "content": "A.java:\n\npublic class A {\n    public void a() {}\n    int a;\n}\n\nB.java:\n\npublic class B {\n    private int doStuff() {\n        private int x = 100;\n        return x++;\n    }\n}\n\nC.java:\n\nimport java.io.*;\npackage p1;\nclass A {\n    public void main(String fileName) throws IOException { }\n}"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "Only the A.java file compiles successfully.", "code": null}, {"key": "B", "text": "Only the B.java file compiles successfully.", "code": null}, {"key": "C", "text": "Only the C.java file compiles successfully.", "code": null}, {"key": "D", "text": "The A.java and B.java files compile successfully.", "code": null}, {"key": "E", "text": "The B.java and C.java files compile successfully.", "code": null}, {"key": "F", "text": "The A.java and C.java files compile successfully.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "A.java만 컴파일되며, B.java는 지역변수에 `private`를 붙여서, C.java는 `import`가 `package`보다 앞에 있어서 실패합니다.", "walkthrough": "1. A.java: 메서드 `a()`와 필드 `a`는 이름이 같아도 네임스페이스가 달라 공존할 수 있습니다. public 클래스 A가 A.java에 있으므로 컴파일됩니다.\n2. B.java: 메서드 안의 지역변수에는 접근 제어자(`private`, `public`, `protected`)나 `static`을 붙일 수 없습니다(허용되는 수식어는 `final`뿐). 따라서 `private int x = 100;`에서 컴파일 에러가 납니다.\n3. C.java: package 선언은 파일에서 주석을 제외한 첫 문장이어야 합니다. `import java.io.*;` 뒤에 `package p1;`이 오므로 컴파일 에러입니다. (non-public 클래스 A를 C.java에 두는 것과 `main(String)` 메서드 자체는 문제가 아닙니다.)\n실제로 각 파일을 컴파일해 A만 성공함을 확인했습니다.", "optionNotes": {"A": "정답입니다. 같은 이름의 메서드와 필드는 합법이고 다른 오류가 없습니다.", "B": "B.java는 지역변수에 `private`를 붙여 'illegal start of expression' 에러가 납니다.", "C": "C.java는 `package` 문이 `import` 뒤에 있어 컴파일 에러입니다. package는 반드시 맨 처음이어야 합니다.", "D": "A.java는 컴파일되지만 B.java는 지역변수의 `private` 때문에 실패합니다.", "E": "B.java(지역변수 private)와 C.java(package 위치) 둘 다 실패합니다.", "F": "A.java는 성공하지만 C.java는 import가 package보다 앞에 있어 실패합니다."}, "concepts": [{"title": "소스 파일의 구성 순서", "body": "한 .java 파일은 `package` 선언(0~1개) → `import` 문(0개 이상) → 타입 선언 순서여야 합니다. 주석은 어디에나 올 수 있습니다. public 최상위 클래스는 파일당 최대 1개이고 파일 이름과 같아야 하며, public이 아닌 클래스는 파일 이름과 달라도 됩니다(C.java의 class A처럼).\n```java\npackage p1;           // 1. 반드시 처음\nimport java.io.*;     // 2.\npublic class C { }    // 3.\n```"}, {"title": "지역변수에 쓸 수 있는 수식어", "body": "지역변수와 매개변수에는 `final`만 붙일 수 있습니다. `private`, `public`, `protected`, `static`, `transient`, `volatile`은 필드에만 쓸 수 있어 지역변수에 붙이면 컴파일 에러입니다. 지역변수는 기본값이 없으므로 사용 전에 반드시 초기화해야 합니다."}, {"title": "필드·메서드 이름 공존", "body": "Java는 필드, 메서드, 타입 이름을 문맥으로 구분하므로 `int a;`와 `void a()`를 한 클래스에 동시에 둘 수 있습니다. 심지어 클래스 이름과 같은 메서드(반환형이 있으면 생성자가 아닌 일반 메서드)도 합법입니다."}], "trap": "A.java에서 필드와 메서드 이름이 같은 것을 에러로 보게 만들고, C.java의 import/package 순서처럼 눈에 덜 띄는 오류를 놓치게 만듭니다.", "no": 12, "topicName": "Java 기초", "lesson": "파일마다 `package → import → class` 순서와 지역 변수의 수식어를 확인하세요. 지역 변수에는 `final`만 붙일 수 있습니다. 필드와 메서드의 이름이 같아도 합법입니다.", "mine": {"tries": 1, "wrong": []}}, {"id": "53", "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Triangle {\n    static double area;\n    int b = 2, h = 3;\n    public static void main(String[] args) {\n        double p, b, h;        //line n1\n        if (area == 0) {\n            b = 3;\n            h = 4;\n            p = 0.5;\n        }\n        area = p * b * h;      //line n2\n        System.out.println(\"Area is \" + area);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Area is 6.0", "code": null}, {"key": "B", "text": "Area is 3.0", "code": null}, {"key": "C", "text": "Compilation fails at line n1", "code": null}, {"key": "D", "text": "Compilation fails at line n2.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "모든 덤프 사본의 정답이 D입니다. 실제로 컴파일하면 line n2에서 `variable p/b/h might not have been initialized` 에러가 납니다. 참고로 line n2를 if 블록 안에 두면 에러 없이 `Area is 6.0`(A)이 출력됩니다.", "summary": "지역 변수 `p`, `b`, `h`는 if 문 안에서만 값을 받으므로 if 블록 밖의 line n2에서 '초기화되지 않았을 수 있음' 컴파일 에러가 납니다.", "walkthrough": "1. line n1에서 지역 변수 `p`, `b`, `h`를 선언하지만 초기화하지 않습니다. 같은 이름의 인스턴스 필드 `b`, `h`를 가리는 것(섀도잉)은 합법이므로 line n1은 문제가 없습니다.\n2. 지역 변수에는 기본값이 없으므로, 읽기 전에 반드시 값이 대입되었다는 것을 컴파일러가 증명할 수 있어야 합니다(definite assignment).\n3. `area == 0`은 상수 표현식이 아니므로 컴파일러는 if 블록이 실행되지 않는 경로도 있다고 봅니다. 실행 시점에 `area`가 실제로 0이라는 사실은 고려하지 않습니다.\n4. 따라서 line n2에서 `p`, `b`, `h`를 읽는 것은 컴파일 에러입니다. javac는 세 변수 모두에 대해 `might not have been initialized`를 보고합니다.\n참고로 line n2가 if 블록 안에 있었다면 블록 안에서는 세 변수가 모두 대입된 상태이므로 컴파일되고, 0.5 × 3 × 4 = 6.0이 출력됩니다.", "optionNotes": {"A": "line n2가 if 블록 안에 있었다면 나오는 출력입니다. 이 코드에서는 컴파일 에러가 나므로 출력되지 않습니다.", "B": "인스턴스 필드 `b = 2`, `h = 3`을 쓴다고 착각한 값(0.5×2×3)입니다. 지역 변수가 필드를 가리고, 애초에 static `main`에서는 인스턴스 필드를 이름만으로 쓸 수 없습니다.", "C": "지역 변수가 인스턴스 필드와 이름이 같아도 섀도잉으로 허용되고, 초기화하지 않은 선언도 합법이므로 line n1은 컴파일됩니다.", "D": "정답입니다. if 블록 밖에서 초기화가 보장되지 않은 지역 변수를 읽으므로 line n2에서 컴파일 에러가 납니다."}, "concepts": [{"title": "지역 변수의 명시적 초기화(definite assignment)", "body": "인스턴스 변수와 static 변수는 기본값(0, false, null)을 갖지만 **지역 변수에는 기본값이 없습니다**. 지역 변수를 읽기 전에 모든 실행 경로에서 값이 대입되어야 하며, 이를 컴파일러가 흐름 분석으로 확인합니다. if에 else가 없으면 값이 대입되지 않는 경로가 생깁니다. 조건이 `true` 같은 컴파일 타임 상수일 때만 컴파일러가 그 분기를 확정적으로 봅니다.\n```java\nint x;\nif (flag) x = 1;\nSystem.out.println(x);   // 에러\nint y;\nif (flag) y = 1; else y = 2;\nSystem.out.println(y);   // OK\n```\n선언만 하고 읽지 않으면 에러가 아닙니다."}, {"title": "섀도잉(shadowing)", "body": "메서드 안에서 필드와 같은 이름의 지역 변수를 선언하면 그 범위 안에서는 지역 변수가 우선합니다. 필드에 접근하려면 `this.b`(인스턴스 필드)나 `Triangle.area`(static 필드)처럼 한정해야 합니다. 단, 같은 메서드 안에서 이미 있는 지역 변수나 매개변수와 같은 이름을 중첩 블록에서 다시 선언하는 것은 컴파일 에러입니다."}], "trap": "필드 `b`, `h`가 초기화되어 있어 지역 변수도 값이 있는 것처럼 보이게 하고, 실행 시 `area == 0`이 참이라는 사실로 컴파일 에러를 놓치게 만듭니다.", "no": 16, "topicName": "자료형", "lesson": "지역 변수에는 기본값이 없습니다. `if` 안에서만 값을 넣었다면 `if` 밖에서 읽는 순간 컴파일 에러입니다. 이 문제에서는 필드에 기본값이 있어 헷갈리게 만들었습니다.", "mine": {"tries": 1, "wrong": []}}, {"id": "161", "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    Short s1 = 200;\n    Integer s2 = 400;\n    Long s3 = (long) s1 + s2;           //line n1\n    String s4 = (String) (s3 * s2);     //line n2\n    System.out.println(\"Sum is \" + s4);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Sum is 600", "code": null}, {"key": "B", "text": "Compilation fails at line n1.", "code": null}, {"key": "C", "text": "Compilation fails at line n2.", "code": null}, {"key": "D", "text": "A ClassCastException is thrown at line n1.", "code": null}, {"key": "E", "text": "A ClassCastException is thrown at line n2.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "숫자 연산 결과인 `long`은 `(String)`으로 캐스팅할 수 없으므로 line n2에서 컴파일 에러가 납니다. line n1은 문제없습니다.", "walkthrough": "1. `Short s1 = 200;`은 상수 200이 short 범위 안이므로 박싱 대입이 허용됩니다. `Integer s2 = 400;`도 정상입니다.\n2. line n1 `(long) s1 + s2`: 캐스트가 덧셈보다 우선순위가 높아 `((long) s1) + s2`입니다. 캐스트 문맥에서는 언박싱 후 확장 변환(Short → short → long)이 허용됩니다. `long + Integer`는 `s2`가 언박싱되어 `long` 600이 되고, `Long`으로 박싱되어 `s3`에 대입됩니다. 따라서 컴파일 에러도, `ClassCastException`도 없습니다. line n1만 남겨 실행하면 `s3 = 600`으로 확인됩니다.\n3. line n2 `(s3 * s2)`는 두 값이 언박싱되어 `long` 240000이 됩니다. 기본형 `long`을 참조형 `String`으로 바꾸는 캐스트 변환은 존재하지 않으므로 `incompatible types: long cannot be converted to String` 컴파일 에러가 납니다.\n4. 문자열로 바꾸려면 `String.valueOf(s3 * s2)`, `\"\" + (s3 * s2)`, `Long.toString(...)`을 써야 합니다.", "optionNotes": {"A": "line n2가 컴파일되지 않아 실행되지 않습니다. 실행된다 해도 `s4`는 곱셈 결과(240000)라 600이 출력되지 않습니다.", "B": "`(long) s1`은 Short를 언박싱한 뒤 long으로 확장하는 합법적인 캐스트이고, `long + Integer`의 결과 long은 `Long`으로 박싱됩니다. line n1은 컴파일됩니다.", "C": "정답입니다. 기본형 `long`을 `String`으로 캐스팅할 수 없으므로 line n2에서 컴파일 에러가 납니다.", "D": "line n1은 기본형 변환과 박싱만 일어나므로 `ClassCastException`이 날 여지가 없습니다. `ClassCastException`은 참조형 다운캐스트가 실패할 때 나는 예외입니다.", "E": "기본형을 String으로 캐스팅하는 것은 런타임 문제가 아니라 컴파일 단계에서 거부됩니다. 실행까지 가지 않습니다."}, "concepts": [{"title": "캐스트로 할 수 있는 것과 없는 것", "body": "기본형끼리는 `boolean`을 제외하면 서로 캐스팅할 수 있고, 참조형끼리는 상속 관계가 있을 때만 캐스팅할 수 있습니다. 기본형과 참조형 사이에서는 박싱/언박싱으로 연결되는 경우만 가능합니다. 예를 들어 `(long) shortWrapper`(언박싱 후 확장)나 `(Object) 5`(박싱 후 업캐스트)는 됩니다. 반면 `(String) 5`, `(String) longValue`, `(Integer) \"1\"`은 모두 컴파일 에러입니다. 숫자를 문자열로, 문자열을 숫자로 바꿀 때는 `String.valueOf`, `Integer.parseInt`, `Integer.valueOf` 같은 메서드를 씁니다."}, {"title": "래퍼 대입과 숫자 승격", "body": "`Short s = 200;`처럼 int 상수를 `Short`/`Byte`/`Character`에 대입하는 것은 상수가 범위 안일 때만 허용됩니다. `Long l = 5;`는 int → Long 변환이 없어 컴파일 에러이고 `Long l = 5L;`이어야 합니다. 이항 산술 연산에서는 래퍼가 먼저 언박싱되고, 두 피연산자 중 넓은 타입(최소 int)으로 승격됩니다. 그래서 `long * Integer`는 `long`입니다.\n```java\nLong a = 1L; Integer b = 2;\nlong r = a * b;   // OK\nLong x = b;       // 에러: Integer는 Long이 아님\n```"}], "trap": "line n1의 `(long) s1 + s2`처럼 래퍼에 기본형 캐스트를 섞어 n1이 문제처럼 보이게 하고, line n2의 캐스트 오류는 런타임 `ClassCastException`이라고 착각하게 만듭니다.", "no": 25, "topicName": "자료형", "lesson": "기본형(`long` 결과)을 `(String)`으로 캐스트하면 **컴파일 에러**입니다. `ClassCastException`은 상속 관계가 있어서 컴파일을 통과한 참조형 캐스트에서만 납니다. 런타임 예외(E)라고 골랐습니다.", "mine": {"tries": 1, "wrong": ["E"]}}, {"id": "41", "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int data[] = {2010, 2013, 2014, 2015, 2014};\n    int key = 2014;\n    int count = 0;\n    for (int e: data) {\n        if (e != key) {\n            continue;\n            count++;\n        }\n    }\n    System.out.print(count + \" Found\");\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "0 Found", "code": null}, {"key": "C", "text": "1 Found", "code": null}, {"key": "D", "text": "3 Found", "code": null}], "correct": "A", "dumpAnswer": "A/D", "answerNote": "덤프마다 A와 D로 표기가 다릅니다. 실제 정답은 A입니다. `continue;` 바로 다음의 `count++;`는 절대 실행될 수 없는 문장이라 `unreachable statement` 컴파일 에러가 납니다. D(3 Found)는 count++가 if 블록 밖에 있는 다른 변형 문제의 답으로 보입니다. 실행으로 확인했습니다.", "summary": "같은 블록에서 `continue;` 뒤에 오는 `count++;`는 도달할 수 없는 문장이므로 컴파일 에러가 납니다.", "walkthrough": "1. if 블록 `{ continue; count++; }` 안에서 `continue;`는 무조건 다음 반복으로 넘어갑니다.\n2. 따라서 바로 다음 문장 `count++;`는 어떤 경우에도 실행될 수 없습니다.\n3. Java는 도달할 수 없는 문장을 컴파일 에러(`unreachable statement`)로 처리합니다. `break`, `continue`, `return`, `throw` 바로 다음 문장이 대표적입니다.\n4. 그래서 출력값을 계산할 필요 없이 컴파일 실패입니다.\n\n참고: `count++`가 if 블록 밖에 있었다면 2014가 두 번 있으므로 `2 Found`가 나옵니다.", "optionNotes": {"A": "정답입니다. `continue;` 바로 뒤의 `count++;`가 도달할 수 없는 문장이라 컴파일 에러입니다.", "B": "count++가 결코 실행되지 않는다고 보고 0을 고른 것이지만, Java는 이런 코드를 아예 컴파일하지 않습니다.", "C": "컴파일되지 않으므로 출력이 없습니다. 실행되더라도 2014는 두 개라 1이 나올 이유가 없습니다.", "D": "2014가 아닌 원소(2010, 2013, 2015) 개수 3을 센 결과지만, 도달 불가능한 문장 때문에 컴파일되지 않습니다."}, "concepts": [{"title": "도달 불가능한 문장(unreachable statement)", "body": "같은 블록 안에서 `return`, `throw`, `break`, `continue` 바로 뒤에 문장이 있으면 컴파일 에러입니다. `while (true) { }` 같은 무한 루프 뒤(break가 없을 때)의 문장, `while (false) { ... }`의 본문도 도달 불가능합니다. 단, `if (false) { ... }`는 조건부 컴파일을 위해 예외적으로 허용됩니다."}, {"title": "break와 continue", "body": "`break`는 가장 안쪽의 반복문이나 switch를 빠져나가고, `continue`는 현재 반복의 나머지를 건너뛰고 다음 반복으로 갑니다. for 문에서 continue를 만나면 증감식이 실행된 뒤 조건을 검사합니다. 레이블(`outer:`)을 붙이면 바깥 반복문을 대상으로 지정할 수 있습니다."}], "trap": "들여쓰기 때문에 count++가 조건부로 실행되는 것처럼 보여 출력값을 계산하게 만듭니다. continue 바로 뒤의 문장은 컴파일 에러라는 점을 기억하세요.", "no": 61, "topicName": "반복문", "lesson": "`continue;` 바로 뒤, 같은 블록 안의 `count++;`는 도달할 수 없는 문장이라 컴파일 에러입니다. 출력값(B)을 계산하기 전에 이것부터 봅니다.", "mine": {"tries": 1, "wrong": ["B"]}}, {"id": "32", "topic": "methods", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Employee {\n    String name;\n    boolean contract;\n    double salary;\n    Employee() {\n        // line n1\n    }\n    public String toString(){\n        return name + \":\" + contract + \":\" + salary;\n    }\n    public static void main(String[] args) {\n        Employee e = new Employee();\n        // line n2\n        System.out.print(e);\n    }\n}"}, {"type": "text", "content": "Which two modifications, when made independently, enable the code to print Joe:true:100.0? (Choose two.)"}], "options": [{"key": "A", "text": "Replace line n2 with:", "code": "e.name = \"Joe\";\ne.contract = true;\ne.salary = 100;"}, {"key": "B", "text": "Replace line n2 with:", "code": "this.name = \"Joe\";\nthis.contract = true;\nthis.salary = 100;"}, {"key": "C", "text": "Replace line n1 with:", "code": "this.name = new String(\"Joe\");\nthis.contract = new Boolean(true);\nthis.salary = new Double(100);"}, {"key": "D", "text": "Replace line n1 with:", "code": "name = \"Joe\";\ncontract = TRUE;\nsalary = 100.0f;"}, {"key": "E", "text": "Replace line n1 with:", "code": "this(\"Joe\", true, 100);"}], "correct": "AC", "dumpAnswer": "AC", "answerNote": "", "summary": "main(static)에서는 참조 변수 e로 필드를 설정해야 하고, 생성자에서는 래퍼 객체를 대입해도 언박싱되어 정상 동작합니다.", "walkthrough": "각 보기를 직접 넣어 컴파일하고 실행했습니다.\n- A: main에서 `e.name = \"Joe\"; e.contract = true; e.salary = 100;` → int 100이 double로 확대 변환되어 100.0입니다. 출력은 `Joe:true:100.0`입니다.\n- B: main은 static 메서드라서 `this`가 없습니다. `non-static variable this cannot be referenced from a static context` 에러가 납니다.\n- C: 생성자에서 `new String(\"Joe\")`, `new Boolean(true)` → boolean으로 언박싱, `new Double(100)` → double로 언박싱 → 출력은 `Joe:true:100.0`입니다.\n- D: `TRUE`라는 변수가 없습니다(`Boolean.TRUE`라고 써야 합니다). `cannot find symbol` 에러가 납니다. `100.0f` 자체는 float → double 확대라서 문제없습니다.\n- E: `Employee(String, boolean, double)` 생성자가 정의되어 있지 않으므로 `this(\"Joe\", true, 100)`은 컴파일 에러입니다.", "optionNotes": {"A": "정답입니다. 인스턴스 참조 e로 필드에 접근하므로 static main에서도 문제없고, 100은 double 100.0으로 확대됩니다.", "B": "static 메서드인 main 안에서는 `this`를 쓸 수 없으므로 컴파일 에러입니다.", "C": "정답입니다. 생성자 안에서는 this를 쓸 수 있고, Boolean과 Double 객체는 boolean, double 필드에 대입될 때 자동 언박싱됩니다.", "D": "`TRUE`는 정의되지 않은 식별자라서 컴파일 에러입니다. Java의 boolean 리터럴은 소문자 `true`뿐입니다.", "E": "`this(...)`로 부를 3개짜리 생성자가 없어 `constructor Employee in class Employee cannot be applied to given types` 에러가 납니다."}, "concepts": [{"title": "static 컨텍스트와 this", "body": "static 메서드는 특정 객체 없이 실행되므로 `this`와 `super`를 쓸 수 없고, 인스턴스 필드나 인스턴스 메서드에 이름만으로 접근할 수도 없습니다. 인스턴스 멤버를 쓰려면 `e.name`처럼 객체 참조를 통해야 합니다. 반대로 인스턴스 메서드와 생성자는 static 멤버를 자유롭게 쓸 수 있습니다."}, {"title": "기본형 대입 변환과 언박싱", "body": "int → long → float → double 방향의 확대 변환은 자동입니다(`double d = 100;` OK, `double d = 100.0f;` OK). 래퍼 객체는 대응하는 기본형으로 언박싱된 뒤 필요하면 확대됩니다(`double d = new Integer(5);` OK). 하지만 박싱 후 확대는 안 됩니다. `Long l = 5;`는 int를 Long으로 박싱할 수 없어 에러입니다."}, {"title": "기본 생성자와 this(...) 호출", "body": "`this(...)`는 같은 클래스에 **실제로 선언된** 생성자만 호출할 수 있습니다. 생성자를 하나라도 직접 선언하면 컴파일러는 기본 생성자를 만들어 주지 않으므로, 없는 시그니처를 부르면 컴파일 에러입니다."}], "trap": "C의 `new Boolean(true)`, `new Double(100)`은 타입이 안 맞아 보이지만 언박싱으로 정상 동작합니다. B는 this를 static 메서드에서 쓴 것이고, D는 `TRUE` 대문자 함정입니다.", "no": 77, "topicName": "메서드와 캡슐화", "lesson": "static `main`에서는 `this`를 쓸 수 없고 `e.field`처럼 객체 참조를 거쳐야 합니다. 래퍼 `new Boolean(true)`를 기본형 필드에 넣는 것은 언박싱으로 합법입니다. `TRUE`(대문자)는 없는 이름이라 에러이니 D는 틀렸습니다.", "mine": {"tries": 2, "wrong": ["CD"]}}, {"id": "60", "topic": "methods", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Person {\n    String name;\n    int age = 25;\n\n    public Person(String name) {\n        this();                                    //line n1\n        setName(name);\n    }\n\n    public Person(String name, int age) {\n        Person(name);                              //line n2\n        setAge(age);\n    }\n\n    //setter and getter methods go here\n\n    public String show() {\n        return name + \" \" + age;\n    }\n    public static void main(String[] args) {\n        Person p1 = new Person(\"Jesse\");\n        Person p2 = new Person(\"Walter\",52);\n        System.out.println(p1.show());\n        System.out.println(p2.show());\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Jesse 25\nWalter 52"}, {"key": "B", "text": "Compilation fails only at line n1", "code": null}, {"key": "C", "text": "Compilation fails only at line n2", "code": null}, {"key": "D", "text": "Compilation fails at both line n1 and line n2", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "직접 컴파일했을 때 line n1(`no suitable constructor found for Person(no arguments)`)과 line n2(`cannot find symbol`)에서만 에러가 확인되었습니다(setter는 주석대로 있다고 보고 추가함). 덤프 정답 D와 같습니다.", "summary": "인자 없는 생성자가 없으므로 `this();`(line n1)가 실패하고, 생성자를 `Person(name);`처럼 메서드처럼 호출할 수 없으므로 line n2도 실패합니다.", "walkthrough": "1. line n1 `this();`: 같은 클래스의 인자 없는 생성자를 호출합니다. 하지만 `Person`에는 `Person(String)`과 `Person(String, int)`만 있습니다. 생성자를 하나라도 선언하면 컴파일러가 기본 생성자를 만들어 주지 않으므로 `Person()`이 없어 에러입니다.\n2. line n2 `Person(name);`: 다른 생성자를 호출하려면 `this(name);`이라고 써야 합니다. `Person(name)`은 `Person`이라는 이름의 **메서드** 호출로 해석되는데, 그런 메서드가 없으므로 `cannot find symbol` 에러입니다.\n3. 두 에러는 서로 독립적이므로 둘 다 보고됩니다. 따라서 D가 정답입니다.\n올바른 코드는 다음과 같습니다.\n```java\npublic Person(String name) { setName(name); }\npublic Person(String name, int age) {\n    this(name);   // 첫 문장이어야 함\n    setAge(age);\n}\n```", "optionNotes": {"A": "두 생성자 모두 컴파일 에러가 있어 실행되지 않습니다. 고친다면 `Jesse 25`, `Walter 52`가 출력됩니다.", "B": "line n1만 문제인 것이 아닙니다. line n2의 `Person(name);`도 생성자 호출 문법이 아니라 컴파일 에러입니다.", "C": "line n2만 문제인 것이 아닙니다. 인자 없는 생성자가 선언되지 않았으므로 line n1의 `this();`도 에러입니다.", "D": "정답입니다. 존재하지 않는 생성자를 호출하는 `this()`와, `this(...)` 대신 클래스 이름으로 생성자를 부른 `Person(name)` 모두 컴파일 에러입니다."}, "concepts": [{"title": "this()와 super()를 이용한 생성자 호출", "body": "같은 클래스의 다른 생성자는 `this(인자)`로, 부모 생성자는 `super(인자)`로 호출하며, 반드시 생성자의 **첫 문장**이어야 합니다. 그래서 둘을 한 생성자에서 함께 쓸 수 없습니다. 클래스 이름으로 `Person(name)`처럼 호출하는 문법은 없고, `new Person(name)`은 새 객체를 따로 만들 뿐 현재 객체를 초기화하지 않습니다. 생성자끼리 서로 호출해 순환이 생기면(`recursive constructor invocation`) 컴파일 에러입니다."}, {"title": "기본 생성자가 만들어지는 조건", "body": "클래스에 생성자를 **하나도** 선언하지 않았을 때만 컴파일러가 인자 없는 기본 생성자를 넣어 줍니다. 생성자를 하나라도 선언하면 기본 생성자는 생기지 않으므로 `new Person()`이나 `this()`가 에러가 됩니다. 자식 클래스 생성자는 첫 줄에 `super()`가 묵시적으로 들어가므로, 부모에 인자 없는 생성자가 없으면 자식 쪽에서 컴파일 에러가 나는 경우도 자주 출제됩니다."}], "trap": "한 줄만 틀린 것처럼 보이게 'only' 보기를 두지만, `this()`의 대상 생성자가 없다는 점과 `Person(name)`이 잘못된 문법이라는 점이 모두 에러입니다.", "no": 83, "topicName": "메서드와 캡슐화", "lesson": "생성자를 하나라도 직접 만들면 기본 생성자는 사라지므로 `this();`는 부를 대상이 없습니다. 다른 생성자는 `this(name)`으로만 부를 수 있고 `Person(name)`처럼 부를 수 없습니다. **두 줄 다 에러(D)**인데 n2만 골랐습니다(C).", "mine": {"tries": 1, "wrong": ["C"]}}, {"id": "22", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Vehicle {\n    int x;\n    Vehicle(){\n        this(10);  // line n1\n    }\n    Vehicle(int x) {\n        this.x = x;\n    }\n}\n\nclass Car extends Vehicle {\n    int y;\n    Car() {\n        super();\n        this(20);   // line n2\n    }\n    Car(int y) {\n       this.y = y;\n    }\n    public String toString() {\n        return super.x + \":\" + this.y;\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "Vehicle y = new Car();\nSystem.out.println(y);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10:20", "code": null}, {"key": "B", "text": "0:20", "code": null}, {"key": "C", "text": "Compilation fails at line n1", "code": null}, {"key": "D", "text": "Compilation fails at line n2", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "생성자 안에서 `super()`와 `this()`는 둘 다 첫 문장이어야 하므로 함께 쓸 수 없고, line n2에서 컴파일 에러가 납니다.", "walkthrough": "1. `Vehicle()`의 `this(10);`(line n1)은 생성자의 첫 문장이므로 문제없습니다.\n2. `Car()`는 먼저 `super();`를 호출하고 그다음 줄에서 `this(20);`(line n2)를 호출합니다.\n3. 명시적 생성자 호출(`this(...)` 또는 `super(...)`)은 생성자 본문의 **첫 문장**에만 올 수 있고, 하나의 생성자에는 하나만 쓸 수 있습니다.\n4. 그래서 두 번째 문장인 `this(20);`이 규칙을 어기고 컴파일러가 line n2에서 에러를 냅니다(Java 8 javac 메시지: `call to this must be first statement in constructor`).\n5. 컴파일이 안 되므로 출력값을 묻는 A, B는 볼 필요가 없습니다.\n\n참고: line n2가 없었다면 `new Car()` → `super()` → `Vehicle()` → `this(10)` 순서로 x=10이 되고, y는 기본값 0이므로 `10:0`이 출력됩니다.", "optionNotes": {"A": "`10:20`이 나오려면 `Car()`가 `this(20)`과 `super()`를 둘 다 실행해야 하는데, 한 생성자에서 두 호출을 함께 쓸 수 없어 컴파일 자체가 안 됩니다.", "B": "`0:20`은 x가 초기화되지 않은 경우를 가정한 값입니다. 실제로는 컴파일 에러라서 실행되지 않습니다.", "C": "line n1의 `this(10);`은 `Vehicle()`의 첫 문장이고 `Vehicle(int)` 생성자도 있으므로 문제가 없습니다.", "D": "정답입니다. `super();` 다음에 오는 `this(20);`은 생성자의 첫 문장이 아니므로 line n2에서 컴파일 에러가 납니다."}, "concepts": [{"title": "명시적 생성자 호출 규칙", "body": "`this(...)`는 같은 클래스의 다른 생성자를, `super(...)`는 부모 클래스의 생성자를 부릅니다. 둘 다 생성자 본문의 첫 문장이어야 하므로 한 생성자에 둘을 같이 쓸 수 없습니다. 둘 다 쓰지 않으면 컴파일러가 첫 줄에 `super();`를 자동으로 넣습니다. 메서드 안에서 `this(...)`처럼 생성자를 호출하는 것도 컴파일 에러입니다.\n```java\nCar() { this(20); }        // OK\nCar() { super(); }         // OK\nCar() { int a = 1; super(); } // 컴파일 에러\n```"}, {"title": "생성자 체이닝과 초기화 순서", "body": "`new Car()`는 항상 부모 생성자부터 실행합니다. `this(...)`로 같은 클래스의 다른 생성자에 넘기더라도 체인의 마지막 생성자가 결국 `super(...)`를 호출합니다. 그래서 부모 필드가 먼저 초기화되고, 자식 생성자 본문은 그 뒤에 실행됩니다. 생성자끼리 `this(...)`로 서로를 부르는 순환 호출은 컴파일 에러(`recursive constructor invocation`)입니다."}], "trap": "`super();`와 `this(20);`이 둘 다 문법적으로는 평범해 보여서 출력값(10:20)을 계산하게 만듭니다. 생성자에서 두 호출이 함께 나오면 바로 컴파일 에러를 의심하세요.", "no": 102, "topicName": "상속과 다형성", "lesson": "한 생성자 안에 `super()`와 `this()`가 같이 있으면 둘 다 첫 줄일 수 없으므로 바로 컴파일 에러입니다. 출력(A)을 계산하지 마세요.", "mine": {"tries": 2, "wrong": ["A"]}}, {"id": "111", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Vehicle {\n    String type = \"4W\";\n    int maxSpeed = 100;\n\n    Vehicle(String type, int maxSpeed) {\n        this.type = type;\n        this.maxSpeed = maxSpeed;\n    }\n}\n\nclass Car extends Vehicle {\n    String trans;\n\n    Car(String trans) {          //line n1\n        this.trans = trans;\n    }\n\n    Car(String type, int maxSpeed, String trans) {\n        super(type, maxSpeed);\n        this(trans);             //line n2\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "7. Car c1 = new Car(\"Auto\");\n8. Car c2 = new Car(\"4W\", 150, \"Manual\");\n9. System.out.println(c1.type + \" \" + c1.maxSpeed + \" \" + c1.trans);\n10. System.out.println(c2.type + \" \" + c2.maxSpeed + \" \" + c2.trans);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "4W 100 Auto\n4W 150 Manual"}, {"key": "B", "text": "", "code": "null 0 Auto\n4W 150 Manual"}, {"key": "C", "text": "Compilation fails only at line n1", "code": null}, {"key": "D", "text": "Compilation fails only at line n2", "code": null}, {"key": "E", "text": "Compilation fails at both line n1 and line n2", "code": null}], "correct": "E", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. line n1의 `Car(String)`은 암묵적으로 `super()`를 호출하는데 `Vehicle`에 인자 없는 생성자가 없어 에러이고, line n2의 `this(trans)`는 생성자의 첫 문장이 아니어서(이미 `super(...)`를 호출함) 역시 에러입니다. javac가 두 줄 모두 에러를 보고하므로 정답은 E입니다.", "summary": "n1은 Vehicle에 기본 생성자가 없어 암묵적 super() 호출이 실패하고, n2는 super()와 this()를 한 생성자에서 함께 호출해 실패하므로 두 곳 모두 컴파일 에러입니다.", "walkthrough": "1. `Vehicle`은 `Vehicle(String, int)` 생성자만 명시했으므로 컴파일러가 기본 생성자를 만들어 주지 않습니다.\n2. line n1: `Car(String trans)`의 첫 문장이 `super(...)`나 `this(...)`가 아니므로 컴파일러가 `super();`를 자동 삽입합니다. 그러나 `Vehicle()`이 없어서 `constructor Vehicle in class Vehicle cannot be applied to given types` 에러가 납니다.\n3. line n2: `super(type, maxSpeed);` 다음 줄에 `this(trans);`를 호출합니다. `this(...)`와 `super(...)`는 둘 다 생성자의 첫 문장이어야 하므로 한 생성자에서 둘을 함께 쓸 수 없습니다. javac는 `redundant explicit constructor invocation`(Java 8 컴파일러에서는 `call to this must be first statement in constructor`) 에러를 냅니다.\n4. 두 곳 모두 독립적인 에러이므로 E가 정답입니다.", "optionNotes": {"A": "코드가 컴파일되지 않으므로 출력이 없습니다. `Vehicle`의 필드 초기값과 생성자 인자를 섞은 그럴듯한 출력일 뿐입니다.", "B": "애초에 코드가 컴파일되지 않으므로 출력이 없습니다. 또한 `type`은 `\"4W\"`로 초기화되어 있어 `null`이 될 수도 없습니다.", "C": "line n1만 보고 판단한 답입니다. line n2도 `super(...)` 뒤에 `this(...)`를 호출해 에러이므로 '오직 n1'이 아닙니다.", "D": "line n2만 보고 판단한 답입니다. line n1도 `Vehicle()`이 없어 암묵적 `super()` 호출이 실패합니다.", "E": "정답입니다. n1(기본 생성자 부재)과 n2(this()가 첫 문장이 아님) 모두 컴파일 에러입니다."}, "concepts": [{"title": "생성자 첫 문장 규칙", "body": "모든 생성자의 첫 문장은 `this(...)`(같은 클래스의 다른 생성자 호출) 또는 `super(...)`(상위 클래스 생성자 호출) 중 하나입니다. 둘 다 쓰지 않으면 컴파일러가 `super();`를 자동으로 넣습니다. 둘을 동시에 쓰거나 첫 문장이 아닌 곳에 쓰면 컴파일 에러입니다. `this(...)`로 위임하면 최종적으로 위임받은 생성자가 `super(...)`를 호출하게 됩니다."}, {"title": "기본 생성자가 만들어지지 않는 경우", "body": "클래스에 생성자를 하나도 작성하지 않았을 때만 컴파일러가 인자 없는 기본 생성자를 만들어 줍니다. 인자 있는 생성자를 하나라도 작성하면 기본 생성자는 생기지 않습니다. 이때 하위 클래스 생성자가 명시적으로 `super(인자)`를 호출하지 않으면 자동 삽입된 `super()`가 실패합니다.\n```java\nclass A { A(int x) { } }\nclass B extends A {\n    B() { }          // 에러: A()가 없음\n    B(int x) { super(x); } // OK\n}\n```"}], "trap": "'only'라는 단어로 한 곳만 고르게 유도합니다. 생성자 문제에서는 암묵적 `super()` 실패와 `this()`/`super()` 위치 위반을 각각 따로 확인하십시오.", "no": 112, "topicName": "상속과 다형성", "lesson": "'n1만', 'n2만' 보기가 있으면 두 줄을 각각 검사합니다. n1은 부모에 기본 생성자가 없어서 숨은 `super()`가 실패합니다. n2만 봤습니다(D).", "mine": {"tries": 1, "wrong": ["D"]}}, {"id": "112", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Animal {\n    String type = \"Canine\";\n    int maxSpeed = 60;\n\n    Animal () {}\n\n    Animal (String type, int maxSpeed) {\n        this.type = type;\n        this.maxSpeed = maxSpeed;\n    }\n}\n\nclass WildAnimal extends Animal {\n    String bounds;\n\n    WildAnimal (String bounds) {\n        //line n1\n    }\n\n    WildAnimal (String type, int maxSpeed, String bounds) {\n        //line n2\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "7. WildAnimal wolf = new WildAnimal (\"Long\");\n8. WildAnimal tiger = new WildAnimal (\"Feline\", 80, \"Short\");\n9. System.out.println (wolf.type + \" \" + wolf.maxSpeed + \" \" + wolf.bounds);\n10. System.out.println (tiger.type + \" \" + tiger.maxSpeed + \" \" + tiger.bounds);"}, {"type": "text", "content": "Which two modifications enable the code to print the following output?"}, {"type": "code", "content": "Canine 60 Long\nFeline 80 Short"}], "options": [{"key": "A", "text": "Replace line n1 with:", "code": "super ();\nthis.bounds = bounds;"}, {"key": "B", "text": "Replace line n1 with:", "code": "this.bounds = bounds;\nsuper ();"}, {"key": "C", "text": "Replace line n2 with:", "code": "super (type, maxSpeed);\nthis (bounds);"}, {"key": "D", "text": "Replace line n1 with:", "code": "this (\"Canine\", 60);\nthis.bounds = bounds;"}, {"key": "E", "text": "Replace line n2 with:", "code": "super (type, maxSpeed);\nthis.bounds = bounds;"}], "correct": "AE", "dumpAnswer": "A", "answerNote": "덤프에는 정답이 A 하나만 표기되어 있지만 문제는 두 개를 고르라고 합니다. A(line n1)와 E(line n2)를 함께 적용하면 `Canine 60 Long`, `Feline 80 Short`가 출력되므로(javac로 확인) 정답은 AE입니다.", "summary": "n1에는 super() 후 bounds를 대입(A), n2에는 super(type, maxSpeed) 후 bounds를 대입(E)해야 두 줄이 기대대로 출력됩니다.", "walkthrough": "1. `wolf`는 `new WildAnimal(\"Long\")`이므로 line n1 생성자를 사용합니다. `type`, `maxSpeed`는 `Animal`의 필드 초기값 `\"Canine\"`, `60`이 그대로 유지되어야 하고 `bounds`만 `\"Long\"`이 되어야 합니다.\n- A: `super();`로 `Animal()`을 호출한 뒤 `this.bounds = bounds;`를 대입하므로 `Canine 60 Long`이 됩니다.\n2. `tiger`는 `new WildAnimal(\"Feline\", 80, \"Short\")`이므로 line n2 생성자를 사용합니다.\n- E: `super(type, maxSpeed);`로 상위 필드를 `Feline`, `80`으로 설정하고 `this.bounds = bounds;`로 `Short`를 대입하므로 `Feline 80 Short`가 됩니다.\n3. 나머지 보기는 모두 컴파일 에러입니다(아래 보기별 설명 참고).", "optionNotes": {"A": "정답입니다. `super()`가 첫 문장이고, 이어서 `bounds`를 설정하므로 `Canine 60 Long`이 출력됩니다.", "B": "`super()`가 생성자의 첫 문장이 아니므로 Java 8에서 컴파일 에러입니다.", "C": "한 생성자에서 `super(...)` 다음에 `this(...)`를 호출하므로 컴파일 에러입니다. `this(...)`도 첫 문장이어야 합니다.", "D": "`WildAnimal`에는 `(String, int)` 생성자가 없으므로 `this(\"Canine\", 60)`은 컴파일 에러입니다(`this`는 상위 클래스 생성자가 아니라 같은 클래스 생성자를 호출합니다).", "E": "정답입니다. `super(type, maxSpeed)`로 상위 필드를 설정한 뒤 `bounds`를 대입하므로 `Feline 80 Short`가 출력됩니다."}, "concepts": [{"title": "this(...)와 super(...)의 대상", "body": "`this(...)`는 **같은 클래스**의 다른 생성자를, `super(...)`는 **직계 상위 클래스**의 생성자를 호출합니다. 상위 클래스에 `(String, int)` 생성자가 있어도 하위 클래스에 같은 시그니처의 생성자가 없으면 `this(\"Canine\", 60)`은 실패합니다. 생성자는 상속되지 않는다는 점이 이유입니다."}, {"title": "객체 초기화 순서", "body": "`new`로 하위 클래스 객체를 만들면 (1) 하위 생성자가 호출되고 첫 문장에서 상위 생성자로 올라가며, (2) 상위 클래스의 필드 초기화식과 초기화 블록, 생성자 본문이 실행되고, (3) 하위 클래스의 필드 초기화식, 초기화 블록, 생성자 본문의 나머지가 실행됩니다. 그래서 `super()` 호출 후에도 `Animal`의 필드 초기값 `\"Canine\"`, `60`이 유지됩니다."}], "trap": "D는 상위 클래스의 생성자 시그니처를 `this`로 부르는 실수를, B와 C는 생성자 호출 위치 규칙을 노립니다. 두 생성자에 각각 맞는 보기를 하나씩 골라야 한다는 점도 놓치지 마십시오.", "no": 113, "topicName": "상속과 다형성", "lesson": "`this(...)`는 같은 클래스 생성자이고, 부모 시그니처 `(String, int)`를 부르려면 `super(...)`입니다. D의 `this(\"Canine\", 60)`은 에러입니다. 두 번 모두 D를 골랐습니다.", "mine": {"tries": 3, "wrong": ["AD", "AD"]}}, {"id": "X5", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class CD {\n    int r;\n    CD(int r){\n        this.r=r;\n    }\n}\n\nclass DVD extends CD {\n    int c;\n    DVD(int r, int c) {\n        // line n1\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "DVD dvd = new DVD(10,20);"}, {"type": "text", "content": "Which code fragment should you use at line n1 to instantiate the dvd object successfully?"}], "options": [{"key": "A", "text": "", "code": "super.r = r;\nthis.c = c;"}, {"key": "B", "text": "", "code": "super(r);\nthis(c);"}, {"key": "C", "text": "", "code": "super(r);\nthis.c = c;"}, {"key": "D", "text": "", "code": "this.c = r;\nsuper(c);"}], "choose": 1, "correct": "C", "dumpAnswersAll": ["C"], "answerNote": "", "summary": "`CD`에는 `CD(int)` 생성자만 있으므로 `DVD` 생성자는 첫 문장에서 반드시 `super(r)`를 명시적으로 호출해야 합니다.", "walkthrough": "1. `CD`는 `CD(int r)` 생성자를 직접 선언했으므로 컴파일러가 기본 생성자 `CD()`를 만들어 주지 않습니다.\n2. 서브클래스 생성자의 첫 문장이 `super(...)`나 `this(...)`가 아니면 컴파일러가 `super();`를 자동으로 넣습니다.\n3. A를 넣으면 첫 문장이 `super.r = r;`(일반 대입문)이므로 `super();`가 자동 삽입되는데, `CD()`가 없어서 컴파일 오류가 납니다.\n4. B는 `super(r);` 다음 줄에 `this(c);`를 둡니다. `super()`/`this()`는 생성자의 첫 문장에만 올 수 있고 둘을 함께 쓸 수도 없습니다. 게다가 `DVD(int)` 생성자도 없습니다.\n5. D는 `super(c);`가 두 번째 문장이라 Java 8에서 \"call to super must be first statement\" 오류가 납니다.\n6. C는 첫 문장에서 `super(r)`로 `CD(int)`를 호출해 `r = 10`을 설정하고, 이어서 `this.c = c`로 `c = 20`을 저장합니다. 컴파일·실행 모두 성공하므로 C가 정답입니다.", "optionNotes": {"A": "첫 문장이 `super(...)`가 아니므로 컴파일러가 `super();`를 넣는데, `CD`에는 인자 없는 생성자가 없어 컴파일 오류가 납니다.", "B": "`this(c)`가 두 번째 문장이라 불법이고, `super()`와 `this()`는 한 생성자에서 함께 쓸 수 없습니다. `DVD(int)` 생성자도 존재하지 않습니다.", "C": "정답입니다. 첫 문장에서 `super(r)`로 부모 생성자를 호출한 뒤 자신의 필드 `c`를 초기화합니다.", "D": "`super(c)`가 첫 문장이 아니므로 Java 8에서는 컴파일 오류입니다."}, "concepts": [{"title": "생성자 첫 문장 규칙과 super()", "body": "모든 생성자의 첫 문장은 `this(...)` 또는 `super(...)` 중 하나이며, 둘 다 없으면 컴파일러가 `super();`를 자동으로 삽입합니다.\n\n- `this(...)`와 `super(...)`는 첫 문장에만 올 수 있고, 한 생성자에서 둘 중 하나만 쓸 수 있습니다.\n- 부모 클래스에 인자 없는 생성자가 없으면, 자식 생성자는 반드시 `super(인자)`를 명시해야 합니다. 그렇지 않으면 자동 삽입된 `super();` 때문에 컴파일 오류가 납니다.\n- 생성자를 하나라도 직접 선언하면 컴파일러는 기본 생성자를 만들어 주지 않습니다."}, {"title": "super.필드 와 super() 의 차이", "body": "`super.r`은 부모로부터 물려받은 멤버에 접근하는 표현식일 뿐, 부모 생성자를 호출하지 않습니다. 부모 생성자 호출은 오직 `super(...)` 형태로만 가능합니다. 그래서 `super.r = r;`로 값을 넣어도 부모 객체 초기화(생성자 호출) 문제는 해결되지 않습니다."}], "trap": "`super.r = r;`로 부모 필드에 값을 넣으면 충분해 보이게 만드는 함정입니다. 부모에 기본 생성자가 없으면 반드시 첫 줄에서 `super(r)`를 호출해야 합니다.", "added": true, "dumpAnswer": "C", "no": 117, "topicName": "상속과 다형성", "lesson": "부모에 인자 있는 생성자만 있으면, 자식 생성자 첫 줄에 `super(r)`이 꼭 있어야 합니다. `super.r = r;`은 필드 대입일 뿐 생성자 호출이 아닙니다(A).", "mine": {"tries": 1, "wrong": ["A"]}}, {"id": "10", "topic": "inheritance", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "abstract class Toy {\n    int price;\n    // line n1\n}"}, {"type": "text", "content": "Which three code fragments are valid at line n1? (Choose three.)"}], "options": [{"key": "A", "text": "", "code": "public static void insertToy() {\n    /* code goes here */\n}"}, {"key": "B", "text": "", "code": "final Toy getToy() {\n    return new Toy();\n}"}, {"key": "C", "text": "", "code": "public void printToy();"}, {"key": "D", "text": "", "code": "public int calculatePrice() {\n    return price;\n}"}, {"key": "E", "text": "", "code": "public abstract int computeDiscount();"}], "correct": "ADE", "dumpAnswer": "CDE", "answerNote": "덤프 정답 CDE는 틀렸습니다. C `public void printToy();`는 본문이 없는데 `abstract`가 없어서 \"missing a method body, or should be declared abstract\" 컴파일 에러가 납니다. A의 static 메서드는 추상 클래스에 아무 문제 없이 들어갑니다. 각 보기를 단독으로 넣어 javac로 컴파일한 결과 A, D, E만 성공했습니다.", "summary": "추상 클래스에는 static 메서드, 구현된 메서드, abstract 메서드를 모두 둘 수 있지만, 자기 자신을 `new`할 수는 없고 abstract 없는 본문 없는 메서드도 안 됩니다.", "walkthrough": "보기를 하나씩 line n1에 넣어 컴파일한 결과입니다.\n- A `public static void insertToy() { }` → 성공. 추상 클래스도 static 메서드를 가질 수 있고, `Toy.insertToy()`로 호출할 수 있습니다.\n- B `final Toy getToy() { return new Toy(); }` → 실패: `Toy is abstract; cannot be instantiated`. final 메서드 자체는 괜찮지만 추상 클래스를 `new`할 수 없습니다.\n- C `public void printToy();` → 실패: 본문이 없는 메서드는 `abstract`로 선언해야 합니다.\n- D `public int calculatePrice() { return price; }` → 성공. 일반 구현 메서드입니다.\n- E `public abstract int computeDiscount();` → 성공. 추상 클래스 안의 추상 메서드입니다.\n따라서 정답은 A, D, E입니다.", "optionNotes": {"A": "정답입니다. 추상 클래스도 static 메서드를 가질 수 있습니다. abstract와 static을 함께 쓸 수 없을 뿐, static 메서드 자체는 문제없습니다.", "B": "`new Toy()`는 추상 클래스를 인스턴스화하므로 컴파일 에러입니다. `final` 키워드는 문제가 아닙니다.", "C": "본문 없이 세미콜론으로 끝나는 메서드는 `abstract`가 있어야 합니다(인터페이스와 달리 추상 클래스에서는 자동으로 abstract가 붙지 않습니다). 컴파일 에러입니다.", "D": "정답입니다. 추상 클래스에도 구현된 일반 메서드를 둘 수 있고, 필드 `price`에 접근하는 것도 정상입니다.", "E": "정답입니다. 추상 클래스에 본문 없는 `abstract` 메서드를 선언하는 것은 전형적인 사용법입니다."}, "concepts": [{"title": "추상 클래스의 규칙", "body": "`abstract class`는 `new`로 직접 생성할 수 없지만, 생성자, 필드, static 메서드, 구현 메서드, 추상 메서드를 모두 가질 수 있습니다. 추상 메서드가 하나라도 있으면 클래스도 abstract여야 합니다. 반대로 추상 메서드가 하나도 없어도 abstract 클래스로 선언할 수 있습니다. 추상 클래스를 상속한 구체 클래스는 모든 추상 메서드를 구현해야 하고, 하나라도 구현하지 않으면 그 클래스도 abstract로 선언해야 합니다. `new Toy() { ... }`처럼 익명 하위 클래스를 만드는 것은 가능합니다."}, {"title": "abstract와 함께 쓸 수 없는 제어자", "body": "추상 메서드는 하위 클래스가 오버라이딩해야 하므로 `final`, `private`, `static`과 함께 쓸 수 없습니다(`abstract final`, `private abstract`, `static abstract`는 모두 컴파일 에러). 추상 메서드는 본문 `{}`을 가질 수 없고 반드시 `;`로 끝납니다. 인터페이스의 본문 없는 메서드는 자동으로 `public abstract`가 되지만, 추상 클래스에서는 `abstract`를 명시해야 합니다."}], "trap": "인터페이스처럼 `public void printToy();`도 된다고 착각하게 만드는 C와, 추상 클래스에는 static이 안 될 것 같은 A가 함정입니다.", "no": 99, "topicName": "상속과 다형성", "lesson": "추상 클래스에는 static 메서드(A)와 구현된 메서드(D)를 둘 수 있습니다. 본문 없는 메서드(C)에는 `abstract`가 필수이고, `new Toy()`(B)는 불가입니다. 세 번 풀며 A와 C를 계속 반대로 판단했습니다.", "mine": {"tries": 3, "wrong": ["BCE", "BCD"]}}, {"id": "42", "topic": "inheritance", "parts": [{"type": "text", "content": "Which two class definitions fail to compile? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "abstract class A3 {\n    private static int i;\n    public void doStuff(){}\n    public A3(){}\n}"}, {"key": "B", "text": "", "code": "final class A1 {\n    public A1(){}\n}"}, {"key": "C", "text": "", "code": "private class A2 {\n    private static int i;\n    private A2(){}\n}"}, {"key": "D", "text": "", "code": "class A4 {\n    protected static final int i = 10;\n    private A4() {}\n}"}, {"key": "E", "text": "", "code": "final abstract class A5 {\n    protected static int i;\n    void doStuff(){}\n    abstract void doIt();\n}"}], "correct": "CE", "dumpAnswer": "CD", "answerNote": "덤프 정답 CD는 틀렸습니다. D의 `class A4`는 private 생성자와 `protected static final` 필드를 가졌지만 모두 합법이라 정상적으로 컴파일됩니다. 컴파일되지 않는 것은 C(최상위 클래스에 private 사용 불가)와 E(final과 abstract는 함께 쓸 수 없음)입니다. 각 클래스를 따로 컴파일해서 확인했습니다.", "summary": "최상위 클래스에는 private을 붙일 수 없고(C), final과 abstract는 함께 쓸 수 없습니다(E).", "walkthrough": "각 클래스를 별도 파일로 컴파일한 결과입니다.\n- A `abstract class A3`: abstract 클래스도 일반 메서드, 생성자, private static 필드를 가질 수 있어 컴파일됩니다.\n- B `final class A1`: 상속 불가 클래스에 public 생성자가 있는 정상 코드입니다.\n- C `private class A2`: `modifier private not allowed here` 에러가 납니다. 최상위 클래스에는 public 또는 default(생략)만 쓸 수 있습니다.\n- D `class A4`: `protected static final int i = 10;`과 `private A4() {}` 모두 합법이라 컴파일됩니다. 다른 클래스에서 `new A4()`를 할 수 없을 뿐입니다.\n- E `final abstract class A5`: `illegal combination of modifiers: abstract and final` 에러가 납니다. abstract는 상속해서 완성하라는 뜻이고 final은 상속 금지라서 모순입니다.", "optionNotes": {"A": "컴파일됩니다. abstract 클래스가 abstract 메서드 없이 구체 메서드와 생성자만 가져도 됩니다.", "B": "컴파일됩니다. final 클래스에 public 생성자가 있는 것은 아무 문제가 없습니다.", "C": "컴파일 실패입니다(정답). 최상위 클래스에는 private, protected를 쓸 수 없습니다.", "D": "컴파일됩니다. 생성자가 private이어도 선언 자체는 합법이며, 필드에 protected static final을 함께 쓰는 것도 문제없습니다.", "E": "컴파일 실패입니다(정답). abstract와 final은 서로 모순되는 수정자라 함께 쓸 수 없습니다."}, "concepts": [{"title": "최상위 클래스에 쓸 수 있는 수정자", "body": "최상위(top-level) 클래스의 접근 제어자는 `public` 또는 생략(package-private)만 가능합니다. 그 밖에 `abstract`, `final`, `strictfp`를 쓸 수 있습니다. `private`, `protected`, `static`은 중첩(내부) 클래스에만 쓸 수 있습니다. public 클래스는 파일 이름과 같아야 하며 한 파일에 하나만 둘 수 있습니다."}, {"title": "abstract와 함께 쓸 수 없는 수정자", "body": "- 클래스: `abstract final`은 불가합니다.\n- 메서드: `abstract`는 `final`, `private`, `static`과 함께 쓸 수 없습니다. 셋 다 오버라이드를 막기 때문입니다.\n- abstract 메서드가 하나라도 있으면 클래스도 abstract여야 하지만, abstract 클래스에 abstract 메서드가 없어도 됩니다.\n- abstract 클래스도 생성자를 가질 수 있으며, 자식 생성자의 super()로 호출됩니다."}], "trap": "D의 private 생성자를 보고 '객체를 만들 수 없으니 에러'라고 착각하게 만듭니다. 선언 자체는 합법이고, 외부에서 new를 못 할 뿐입니다.", "no": 104, "topicName": "상속과 다형성", "lesson": "최상위 클래스에는 `private`을 붙일 수 없고(C), `final abstract`도 불가입니다(E). abstract 메서드가 없는 abstract 클래스(A)는 **컴파일됩니다**.", "mine": {"tries": 2, "wrong": ["AE"]}}, {"id": "82", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface Readable {\n    public void readBook();\n    public void setBookMark();\n}\n\nabstract class Book implements Readable {    // line n1\n    public void readBook() { }\n    // line n2\n}\n\nclass EBook extends Book {                   // line n3\n    public void readBook() { }\n    // line n4\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "Book book1 = new EBook ();\nbook1.readBook();"}, {"type": "text", "content": "Which option enables the code to compile?"}], "options": [{"key": "A", "text": "Replace the code fragment at line n3 with:", "code": "abstract class EBook extends Book {"}, {"key": "B", "text": "Replace the code fragment at line n1 with:", "code": "class Book implements Readable {"}, {"key": "C", "text": "At line n2 insert:", "code": "public abstract void setBookMark ();"}, {"key": "D", "text": "At line n4 insert:", "code": "public void setBookMark ()  { }"}], "correct": "D", "dumpAnswer": "A/D", "answerNote": "덤프마다 A/D로 표기가 다릅니다. 실제 정답은 D입니다. A처럼 `EBook`을 abstract로 만들면 `new EBook()`으로 인스턴스를 만들 수 없어 \"EBook is abstract; cannot be instantiated\" 컴파일 에러가 납니다.", "summary": "구체 클래스 `EBook`이 인터페이스의 남은 추상 메서드 `setBookMark()`를 구현해야 컴파일됩니다.", "walkthrough": "1. `Readable` 인터페이스에는 추상 메서드 `readBook()`, `setBookMark()`가 있습니다.\n2. `Book`은 `abstract`이므로 `setBookMark()`를 구현하지 않아도 됩니다(`readBook()`만 구현).\n3. `EBook`은 abstract가 아닌 구체 클래스이므로 상속받은 모든 추상 메서드를 구현해야 하는데 `setBookMark()`가 없습니다. 원래 코드는 \"EBook is not abstract and does not override abstract method setBookMark()\" 에러로 실패합니다.\n4. 각 선택지를 컴파일해 보았습니다.\n- A: EBook 선언은 통과하지만 `new EBook()`에서 \"cannot be instantiated\" 에러.\n- B: Book이 구체 클래스가 되어 이번에는 Book에서 `setBookMark()` 미구현 에러.\n- C: Book에서 추상 메서드를 다시 선언해도 EBook의 구현 의무는 그대로라 같은 에러.\n- D: EBook에 `public void setBookMark() { }`를 추가하면 컴파일·실행 모두 성공.\n따라서 정답은 D입니다.", "optionNotes": {"A": "EBook을 abstract로 바꾸면 클래스 선언 자체는 컴파일되지만, 코드 조각의 `new EBook()`이 추상 클래스 인스턴스화가 되어 컴파일 에러입니다.", "B": "Book을 구체 클래스로 바꾸면 Book이 `setBookMark()`를 구현하지 않았으므로 Book에서 컴파일 에러가 납니다.", "C": "Book에 `public abstract void setBookMark();`를 다시 선언하는 것은 합법이지만, EBook이 여전히 이를 구현하지 않으므로 EBook에서 컴파일 에러가 납니다.", "D": "정답입니다. EBook이 `setBookMark()`를 `public`으로 구현하면 모든 추상 메서드가 구현되어 컴파일되고, `book1.readBook()`도 정상 호출됩니다."}, "concepts": [{"title": "구체 클래스의 추상 메서드 구현 의무", "body": "abstract가 아닌 클래스는 상속 계층(상위 클래스와 구현한 인터페이스 전부)에서 넘어온 모든 추상 메서드를 구현해야 합니다. 중간의 추상 클래스가 일부만 구현했다면 남은 메서드는 첫 번째 구체 하위 클래스가 책임집니다. 추상 클래스는 `new`로 직접 생성할 수 없지만, 참조 타입으로는 사용할 수 있습니다(`Book b = new EBook();`)."}, {"title": "인터페이스 메서드 구현 시 접근 제어자", "body": "인터페이스의 추상 메서드는 암묵적으로 `public abstract`입니다. 이를 구현하는 메서드는 반드시 `public`이어야 하며, `void setBookMark() { }`처럼 접근 제어자를 생략하면 package-private이 되어 \"weaker access privileges\" 컴파일 에러가 납니다. 추상 클래스에서 인터페이스 메서드를 `public abstract`로 다시 선언하는 것은 허용되지만 구현 의무를 바꾸지는 않습니다."}], "trap": "A는 EBook 선언 에러를 없애 정답처럼 보이지만, 추상 클래스는 인스턴스화할 수 없다는 점 때문에 `new EBook()`에서 실패합니다.", "no": 107, "topicName": "상속과 다형성", "lesson": "인터페이스 메서드가 남아 있으면 처음 나오는 구체 클래스(EBook)가 구현해야 합니다(D). 중간의 Book을 구체 클래스로 바꾸면(B) 이번에는 Book이 에러가 됩니다.", "mine": {"tries": 2, "wrong": ["B"]}}, {"id": "86", "topic": "inheritance", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "abstract class Planet {\n    protected void revolve() {          //line n1\n    }\n\n    abstract void rotate();             //line n2\n}\n\nclass Earth extends Planet {\n    void revolve() {                    //line n3\n    }\n\n    protected void rotate() {           //line n4\n    }\n}"}, {"type": "text", "content": "Which two modifications, made independently, enable the code to compile?"}], "options": [{"key": "A", "text": "Make the method at line n1 public.", "code": null}, {"key": "B", "text": "Make the method at line n2 public.", "code": null}, {"key": "C", "text": "Make the method at line n3 public.", "code": null}, {"key": "D", "text": "Make the method at line n3 protected.", "code": null}, {"key": "E", "text": "Make the method at line n4 public.", "code": null}], "correct": "CD", "dumpAnswer": "BC", "answerNote": "이 덤프는 BC로 표기했지만 틀렸습니다(다른 덤프 사본에는 CD로 되어 있습니다). 정답은 CD입니다. 원래 코드의 에러는 line n3의 `revolve()`가 `protected`를 default로 좁힌 것 하나이고, 이를 `public` 또는 `protected`로 바꾸면 해결됩니다. B처럼 line n2를 `public`으로 바꾸면 line n4의 `protected rotate()`가 접근을 좁히는 새 에러가 생기고, line n3의 에러도 그대로 남습니다.", "summary": "오버라이딩 메서드는 접근 범위를 좁힐 수 없으므로 line n3의 default `revolve()`를 `public`이나 `protected`로 넓혀야 합니다.", "walkthrough": "1. 원래 코드를 컴파일하면 line n3에서 \"revolve() in Earth cannot override revolve() in Planet; attempting to assign weaker access privileges; was protected\" 에러가 납니다.\n2. line n2의 `abstract void rotate()`는 default 접근이고 line n4의 `protected void rotate()`는 접근을 넓힌 것이므로 문제가 없습니다.\n3. 각 수정을 독립적으로 적용해 컴파일했습니다.\n- A(n1 public): 상위가 `public`이 되어 n3의 default가 더 심하게 좁히는 꼴이 되므로 여전히 에러.\n- B(n2 public): n4의 `protected`가 `public`보다 좁아 새 에러, n3 에러도 그대로.\n- C(n3 public): `protected` → `public`은 넓히는 것이므로 OK, 컴파일 성공.\n- D(n3 protected): 같은 접근 수준이므로 OK, 컴파일 성공.\n- E(n4 public): n4는 원래 문제가 없었고 n3 에러가 그대로 남음.\n따라서 정답은 C와 D입니다.", "optionNotes": {"A": "line n1을 `public`으로 바꾸면 Earth의 default `revolve()`가 `public`을 좁히는 것이 되어 여전히 컴파일 에러입니다.", "B": "line n2를 `public`으로 바꾸면 line n4의 `protected rotate()`가 접근을 좁혀 새로운 에러가 생기고, line n3 문제도 해결되지 않습니다.", "C": "정답입니다. line n3를 `public`으로 바꾸면 `protected`보다 넓은 접근이므로 오버라이딩 규칙을 만족합니다.", "D": "정답입니다. line n3를 `protected`로 바꾸면 상위 메서드와 같은 접근 수준이므로 합법입니다.", "E": "line n4는 원래부터 합법(default → protected 확장)이므로 바꿔도 line n3의 에러는 그대로 남습니다."}, "concepts": [{"title": "오버라이딩의 접근 제어자 규칙", "body": "오버라이딩 메서드는 상위 메서드보다 접근 범위를 좁힐 수 없고, 같거나 넓힐 수만 있습니다. 넓은 순서는 `public` > `protected` > default(package-private) > `private`입니다. 따라서 상위가 `protected`면 하위는 `protected` 또는 `public`, 상위가 default면 default/`protected`/`public` 모두 가능합니다. `private` 메서드는 상속되지 않으므로 하위 클래스에 같은 시그니처를 선언해도 오버라이딩이 아니라 새 메서드입니다. 인터페이스 메서드는 암묵적으로 `public`이라 구현 메서드는 반드시 `public`이어야 합니다."}, {"title": "오버라이딩 규칙 전체 정리", "body": "오버라이딩이 성립하려면 메서드 이름과 매개변수 목록이 같아야 합니다. 반환형은 같거나 하위 타입(공변 반환형)이어야 하며, 기본형은 정확히 같아야 합니다. checked 예외는 상위 메서드가 던지는 것과 같거나 그 하위 타입만, 혹은 아예 던지지 않을 수 있습니다(unchecked 예외는 제한 없음). static 메서드는 오버라이딩되지 않고 하위 클래스의 같은 static 메서드는 숨기기(hiding)가 됩니다. 인스턴스 메서드를 static으로 바꾸거나 그 반대로 하면 컴파일 에러입니다."}], "trap": "\"abstract 메서드는 public이어야 한다\"는 오해로 B를 고르게 만드는 문제입니다. 추상 메서드도 default나 protected일 수 있습니다.", "no": 108, "topicName": "상속과 다형성", "lesson": "오버라이딩은 범위를 좁힐 수 없으니 **자식 쪽(n3)**을 부모와 같거나 더 넓게 바꿉니다(C, D). 부모 쪽(n1)을 public으로 넓히면(A) 에러가 더 커집니다.", "mine": {"tries": 3, "wrong": ["AC", "AE"]}}, {"id": "91", "topic": "inheritance", "parts": [{"type": "text", "content": "You are asked to develop a program for a shopping application, and you are given the following information:\n- The application must contain the classes Toy, EduToy, and ConsToy. The Toy class is the superclass of the other two classes.\n- The int calculatePrice (Toy t) method calculates the price of a toy.\n- The void printToy (Toy t) method prints the details of a toy.\nWhich definition of the Toy class adds a valid layer of abstraction to the class hierarchy?"}], "options": [{"key": "A", "text": "", "code": "public abstract class Toy{\n    public abstract int calculatePrice(Toy t);\n    public void printToy(Toy t) { /* code goes here */ }\n}"}, {"key": "B", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t) ;\n    public void printToy(Toy t) ;\n}"}, {"key": "C", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t);\n    public final void printToy(Toy t){ /* code goes here */ }\n}"}, {"key": "D", "text": "", "code": "public abstract class Toy {\n    public abstract int calculatePrice(Toy t) { /* code goes here */ }\n    public abstract void printToy(Toy t) { /* code goes here */ }\n}"}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "추상 클래스는 몸체 없는 `abstract` 메서드와 몸체가 있는 일반 메서드를 함께 가질 수 있으며, 네 선택지 중 이 규칙을 지킨 것은 A뿐입니다.", "walkthrough": "각 선택지를 `Toy.java`로 컴파일했습니다.\n- A: `calculatePrice`는 `abstract`이고 몸체가 없으며, `printToy`는 몸체가 있는 일반 메서드입니다. 컴파일 성공. 하위 클래스가 `calculatePrice`를 구현하도록 강제하면서 공통 기능 `printToy`를 제공하므로 유효한 추상화 계층입니다.\n- B: 두 메서드 모두 `abstract`가 없는데 몸체도 없어 \"missing a method body, or should be declared abstract\" 에러가 2개 납니다.\n- C: `calculatePrice`가 `abstract` 없이 몸체가 없어 같은 에러입니다(`final` 메서드인 `printToy` 자체는 합법).\n- D: `abstract` 메서드에 몸체 `{ }`가 있어 \"abstract methods cannot have a body\" 에러입니다.\n따라서 정답은 A입니다.", "optionNotes": {"A": "정답입니다. 추상 메서드는 `abstract` + 세미콜론으로, 일반 메서드는 몸체와 함께 선언되어 규칙에 맞고 컴파일됩니다.", "B": "추상 클래스 안이라도 `abstract` 키워드 없이 몸체를 생략할 수는 없습니다. 두 메서드 모두 컴파일 에러입니다.", "C": "`calculatePrice`가 `abstract`가 아닌데 몸체가 없어 컴파일 에러입니다. `final` 메서드 `printToy`는 문제가 없습니다.", "D": "`abstract` 메서드는 몸체를 가질 수 없습니다. `{ }`를 붙였으므로 두 메서드 모두 컴파일 에러입니다."}, "concepts": [{"title": "추상 클래스와 추상 메서드 선언 규칙", "body": "추상 메서드는 `abstract` 키워드를 붙이고 몸체 없이 세미콜론으로 끝나야 합니다(`abstract void f();`). 빈 몸체 `{}`라도 붙이면 에러입니다. 반대로 abstract가 아닌 메서드는 반드시 몸체가 있어야 합니다. 추상 메서드가 하나라도 있으면 클래스도 abstract여야 하지만, 추상 클래스가 추상 메서드를 하나도 갖지 않는 것은 허용됩니다. 추상 클래스는 생성자, 필드, static 메서드, final 메서드도 가질 수 있습니다."}, {"title": "abstract와 함께 쓸 수 없는 제어자", "body": "추상 메서드는 하위 클래스가 오버라이딩해서 구현해야 하므로 오버라이딩을 막는 제어자와 함께 쓸 수 없습니다. `abstract final`, `abstract private`, `abstract static`은 모두 컴파일 에러입니다. 클래스에서도 `abstract final class`는 에러입니다(상속 불가능한 추상 클래스는 의미가 없음). `abstract`는 `public`, `protected`, default 접근과는 함께 쓸 수 있습니다."}], "trap": "B와 C처럼 \"추상 클래스 안이니 몸체를 생략해도 된다\"고 착각하거나, D처럼 abstract 메서드에 빈 몸체를 붙여도 된다고 착각하게 만드는 문제입니다.", "no": 109, "topicName": "상속과 다형성", "lesson": "abstract 메서드는 본문 없이 `;`로 끝나야 하고, 일반 메서드는 본문 `{ }`이 필수입니다. `abstract void m() { }`도, abstract 없는 `void m();`도 에러입니다.", "mine": {"tries": 1, "wrong": []}}, {"id": "107", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface Readable {\n    public void readBook();\n    public void setBookMark();\n}\n\nabstract class Book implements Readable {   // line n1\n    public void readBook() { }\n    // line n2\n}\n\nclass EBook extends Book {                  // line n3\n    public void readBook() { }\n    // line n4\n}"}, {"type": "text", "content": "Which two options enable the code to compile? (Choose two.)"}], "options": [{"key": "A", "text": "Replace the code fragment at line n1 with:", "code": "class Book implements Readable {"}, {"key": "B", "text": "At line n2 insert:", "code": "public abstract void setBookMark();"}, {"key": "C", "text": "Replace the code fragment at line n3 with:", "code": "abstract class EBook extends Book {"}, {"key": "D", "text": "At line n4 insert:", "code": "public void setBookMark() { }"}], "correct": "CD", "dumpAnswer": "C", "answerNote": "덤프는 C 하나만 정답으로 표기했지만, D(`EBook`에 `public void setBookMark() { }` 추가)도 javac로 컴파일에 성공합니다. 원래 한 개를 고르는 문항이었으나 C와 D가 모두 조건을 만족하므로 두 개를 고르는 문항으로 고쳤습니다. 시험에서 한 개만 고르라고 나오면 덤프 표기대로 C를 고르십시오.", "summary": "구체 클래스 EBook이 setBookMark()를 구현하지 않아 컴파일에 실패하므로, EBook을 abstract로 만들거나(C) EBook에서 setBookMark()를 구현하면(D) 해결됩니다.", "walkthrough": "원래 코드에서 `Book`은 abstract라 `setBookMark()`를 구현하지 않아도 되지만, 구체 클래스 `EBook`이 이를 구현하지 않아 line n3에서 에러가 납니다. 각 보기를 적용해 컴파일해 보았습니다.\n- A: `Book`을 구체 클래스로 바꾸면 `Book`이 `setBookMark()`를 구현하지 않아 이번에는 `Book`에서 에러입니다.\n- B: `Book`에 `public abstract void setBookMark();`를 다시 선언해도 여전히 추상 메서드이므로 `EBook`의 구현 의무는 그대로이고 에러가 남습니다.\n- C: `EBook`을 abstract로 만들면 구현 의무가 없어져 컴파일에 성공합니다.\n- D: `EBook`에서 `setBookMark()`를 구현하면 모든 추상 메서드가 구현되어 역시 컴파일에 성공합니다.\n따라서 정답은 C와 D입니다.", "optionNotes": {"A": "`Book`이 구체 클래스가 되면 `setBookMark()`를 구현해야 하는데 구현하지 않았으므로 `Book`에서 컴파일 에러입니다.", "B": "abstract 클래스에서 인터페이스 메서드를 abstract로 재선언하는 것은 합법이지만, `EBook`이 여전히 구현하지 않아 에러가 남습니다.", "C": "정답입니다. `EBook`이 abstract가 되면 남은 추상 메서드를 구현할 의무가 없어집니다.", "D": "정답입니다. `EBook`이 `setBookMark()`를 public으로 구현하므로 모든 추상 메서드가 구현되어 컴파일됩니다."}, "concepts": [{"title": "추상 메서드 구현 의무의 전파", "body": "abstract 클래스는 인터페이스의 메서드를 일부만 구현하거나 하나도 구현하지 않아도 됩니다. 남은 추상 메서드는 그 클래스를 상속하는 첫 번째 구체 클래스가 모두 구현해야 합니다. 해결 방법은 (1) 구체 클래스에서 구현하거나 (2) 그 클래스도 abstract로 선언하는 것 두 가지입니다."}, {"title": "인터페이스 메서드 구현 시 접근 제어자", "body": "인터페이스의 추상 메서드는 암묵적으로 `public abstract`입니다. 구현할 때 접근 범위를 좁힐 수 없으므로 반드시 `public`으로 선언해야 합니다.\n```java\nclass EBook extends Book {\n    void setBookMark() { }        // 에러: public보다 좁음\n    public void setBookMark() { } // OK\n}\n```"}], "trap": "중간의 abstract 클래스에 메서드를 다시 abstract로 선언하는 B가 해결책처럼 보이게 합니다. 추상 메서드를 다시 선언해도 구현 의무는 사라지지 않습니다.", "no": 111, "topicName": "상속과 다형성", "lesson": "해결책은 EBook을 abstract로 만들거나(C), EBook에서 메서드를 구현하는 것(D)입니다. Book을 구체 클래스로 바꾸면(A) 에러가 Book으로 옮겨갈 뿐입니다.", "mine": {"tries": 2, "wrong": ["AD"]}}, {"id": "92", "topic": "methods", "parts": [{"type": "text", "content": "Given: Acc.java:"}, {"type": "code", "content": "package p1;\npublic class Acc {\n    int p;\n    private int q;\n    protected int r;\n    public int s;\n}"}, {"type": "text", "content": "Test.java:"}, {"type": "code", "content": "package p2;\nimport p1.Acc;\npublic class Test extends Acc {\n    public static void main(String[] args) {\n        Acc obj = new Test();\n    }\n}"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "Both p and s are accessible by obj.", "code": null}, {"key": "B", "text": "Only s is accessible by obj.", "code": null}, {"key": "C", "text": "Both r and s are accessible by obj.", "code": null}, {"key": "D", "text": "p, r, and s are accessible by obj.", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "다른 패키지의 하위 클래스라도 상위 타입(Acc) 참조로는 protected 멤버에 접근할 수 없으므로 obj로 접근 가능한 것은 public인 s뿐입니다.", "walkthrough": "`Test`는 `p2` 패키지에 있고 `p1.Acc`를 상속합니다. 변수 `obj`의 선언 타입은 `Acc`입니다.\n- `p`(default): 같은 패키지(`p1`)에서만 접근할 수 있으므로 `p2`에서는 접근할 수 없습니다.\n- `q`(private): `Acc` 클래스 내부에서만 접근할 수 있습니다.\n- `r`(protected): 다른 패키지의 하위 클래스는 **자기 타입(Test 또는 그 하위 타입) 참조를 통해서만** 상속받은 protected 멤버에 접근할 수 있습니다. `obj`는 `Acc` 타입이므로 `obj.r`은 컴파일 에러입니다(실제로 javac가 `r has protected access in Acc`를 출력합니다). 반면 `Test t = new Test(); t.r`이나 그냥 `r`(인스턴스 메서드 안에서)은 허용됩니다.\n- `s`(public): 어디서나 접근할 수 있습니다.\n따라서 `obj`로 접근 가능한 것은 `s` 하나뿐입니다.", "optionNotes": {"A": "`p`는 default(package-private) 접근이라 `p2` 패키지의 `Test`에서는 접근할 수 없으므로 틀렸습니다.", "B": "정답입니다. public인 `s`만 `Acc` 타입 참조 `obj`로 접근할 수 있습니다.", "C": "`r`은 protected지만 다른 패키지에서는 하위 클래스 자신의 타입 참조로만 접근 가능합니다. `obj`가 `Acc` 타입이므로 `obj.r`은 컴파일 에러입니다.", "D": "`p`는 패키지 밖에서 접근 불가, `r`은 `Acc` 타입 참조로 접근 불가이므로 틀렸습니다."}, "concepts": [{"title": "4가지 접근 제어자", "body": "접근 범위는 `public` > `protected` > default(제어자 없음) > `private` 순입니다.\n- `public`: 모든 곳에서 접근 가능합니다.\n- `protected`: 같은 패키지 + 다른 패키지의 하위 클래스(상속을 통해)에서 접근 가능합니다.\n- default: 같은 패키지 안에서만 접근 가능합니다.\n- `private`: 선언한 클래스 내부에서만 접근 가능합니다.\n하위 클래스라도 패키지가 다르면 default 멤버는 보이지 않는다는 점을 꼭 기억하십시오."}, {"title": "다른 패키지에서의 protected 접근 규칙", "body": "다른 패키지의 하위 클래스 `Sub`는 상속받은 protected 멤버를 `this`(암묵적 포함)나 `Sub` 타입(또는 그 하위 타입) 참조를 통해서만 사용할 수 있습니다. 상위 클래스 타입 참조를 통한 접근은 금지됩니다.\n```java\npackage p2;\npublic class Sub extends p1.Base {\n    void m() {\n        r = 1;               // OK (this.r)\n        new Sub().r = 1;     // OK\n        p1.Base b = new Sub();\n        // b.r = 1;          // 컴파일 에러\n    }\n}\n```\n참조 변수의 **선언 타입**이 기준이며, 실제 객체가 `Sub`인지는 상관없습니다. 또한 static 메서드(`main`) 안에서는 `this`가 없으므로 그냥 `r`이라고 쓸 수도 없습니다."}], "trap": "`obj`에 실제로 `Test` 객체가 들어 있으니 protected `r`도 접근 가능하다고 착각하게 만듭니다. 접근 가능 여부는 참조 변수의 선언 타입(`Acc`)으로 컴파일 시점에 판단합니다.", "no": 86, "topicName": "메서드와 캡슐화", "lesson": "다른 패키지의 protected 멤버는 자식 타입 참조로만 접근할 수 있습니다. `Acc obj`로 `obj.r`에 접근하면 에러입니다. 컴파일러는 실제 객체가 아니라 **선언 타입**을 봅니다.", "mine": {"tries": 1, "wrong": ["C"]}}, {"id": "15", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "text", "content": "Base.java:"}, {"type": "code", "content": "class Base {\n    public void test(){\n        System.out.println(\"Base \");\n    }\n}"}, {"type": "text", "content": "DerivedA.java:"}, {"type": "code", "content": "class DerivedA extends Base {\n    public void test(){\n        System.out.println(\"DerivedA \");\n    }\n}"}, {"type": "text", "content": "DerivedB.java:"}, {"type": "code", "content": "class DerivedB  extends DerivedA {\n    public void test(){\n        System.out.println(\"DerivedB \");\n    }\n    public static void main(String[] args) {\n        Base b1 = new DerivedB();\n        Base b2 = new DerivedA();\n        Base b3 = new DerivedB();\n        Base b4 = b3;\n        b1 = (Base) b2;\n        b1.test();\n        b4.test();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Base\nDerivedA"}, {"key": "B", "text": "", "code": "Base\nDerivedB"}, {"key": "C", "text": "", "code": "DerivedB\nDerivedB"}, {"key": "D", "text": "", "code": "DerivedA\nDerivedB"}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "덤프 정답은 D이지만, 덤프의 보기 D는 \"DerivedBDerivedA\"로 실제 출력과 순서가 반대였습니다. 코드는 certleader·exambible 두 사본이 같고, 그대로 실행하면 `b1 = (Base) b2;`로 b1이 DerivedA 객체를, `b4 = b3`이 DerivedB 객체를 가리키므로 `DerivedA` / `DerivedB` 순서로 두 줄이 출력됩니다(javac/java 실행으로 확인). 정확히 일치하는 보기가 없어 답할 수 없는 상태였으므로, 정답 D를 실제 출력 `DerivedA`/`DerivedB`로 바로잡았습니다.", "summary": "메서드는 실제 객체 타입으로 결정되므로 `b1`(DerivedA 객체)은 \"DerivedA\", `b4`(DerivedB 객체)는 \"DerivedB\"를 출력합니다.", "walkthrough": "1. `b1` → DerivedB 객체, `b2` → DerivedA 객체, `b3` → DerivedB 객체.\n2. `Base b4 = b3;` → `b4`도 같은 DerivedB 객체를 가리킵니다.\n3. `b1 = (Base) b2;` → Base로의 업캐스트라 항상 성공합니다. 이제 `b1`은 DerivedA 객체를 가리키고, 처음 DerivedB 객체는 참조를 잃습니다.\n4. `b1.test();` → 실제 객체 DerivedA의 `test()` → `DerivedA ` 출력 후 줄바꿈.\n5. `b4.test();` → 실제 객체 DerivedB의 `test()` → `DerivedB ` 출력 후 줄바꿈.\n실제 실행 결과는 `DerivedA`, `DerivedB` 두 줄이며 보기 D와 같습니다. 업캐스트뿐이라 ClassCastException은 없고, 변수 타입 Base의 `test()`는 한 번도 실행되지 않습니다.", "optionNotes": {"A": "변수 타입이 Base여도 메서드는 실제 객체 기준으로 호출되므로 \"Base\"는 출력되지 않습니다.", "B": "A와 마찬가지로 \"Base\"가 출력될 수 없습니다. b1은 DerivedA 객체를 가리킵니다.", "C": "`b1 = (Base) b2;`로 b1이 DerivedA 객체로 바뀌었으므로 첫 출력은 DerivedB가 아닙니다.", "D": "정답입니다. b1은 DerivedA 객체, b4는 DerivedB 객체를 가리키므로 각 객체의 `test()`가 실행되어 DerivedA, DerivedB 순서로 출력됩니다.", "E": "`(Base) b2`는 업캐스트이고 나머지는 단순 대입이라 ClassCastException이 발생할 곳이 없습니다."}, "concepts": [{"title": "동적 바인딩", "body": "오버라이딩된 인스턴스 메서드는 런타임에 실제 객체의 클래스에서 찾습니다. 참조 변수 타입은 어떤 메서드를 호출할 수 있는지(컴파일 가능 여부)만 결정합니다. 업캐스트 `(Base) x`는 객체를 바꾸지 않으므로 호출 결과도 바뀌지 않습니다. 출력 추적 문제에서는 각 변수가 마지막으로 어떤 객체(new 된 클래스)를 가리키는지를 표로 정리한 뒤 그 클래스의 메서드를 찾으면 됩니다."}, {"title": "참조 대입은 객체 복사가 아님", "body": "`Base b4 = b3;`은 객체를 복사하지 않고 같은 객체를 가리키는 참조를 하나 더 만드는 것입니다. `b1 = b2;` 후에는 b1이 가리키던 기존 객체와의 연결이 끊어지고, 다른 참조가 없으면 그 객체는 GC 대상이 됩니다."}], "trap": "`(Base)` 캐스트 때문에 Base의 test()가 호출되거나 예외가 날 것처럼 보이게 합니다. 업캐스트는 실행할 메서드를 바꾸지 않습니다.", "no": 101, "topicName": "상속과 다형성", "lesson": "`(Base)`로 업캐스트해도 실행되는 메서드는 실제 객체의 것입니다. 오버라이딩된 메서드는 항상 `new`로 만든 클래스를 기준으로 실행됩니다.", "mine": {"tries": 2, "wrong": ["B"]}}, {"id": "58", "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "Base.java:\n\nclass Base {\n    public void test(){\n        System.out.println(\"Base \");\n    }\n}\n\nDerivedA.java:\n\nclass DerivedA extends Base {\n    public void test(){\n        System.out.println(\"DerivedA \");\n    }\n}\n\nDerivedB.java:\n\nclass DerivedB  extends DerivedA {\n    public void test(){\n        System.out.println(\"DerivedB \");\n    }\n    public static void main(String[] args) {\n        Base b1 = new DerivedB();\n        Base b2 = new DerivedA();\n        Base b3 = new DerivedB();\n        b1 = (Base) b3;\n        Base b4 = (DerivedA) b3;\n        b1.test();\n        b4.test();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Base\nDerivedA"}, {"key": "B", "text": "", "code": "Base\nDerivedB"}, {"key": "C", "text": "", "code": "DerivedB\nDerivedB"}, {"key": "D", "text": "", "code": "DerivedB\nDerivedA"}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "캐스팅은 참조 타입만 바꾸고 객체는 그대로이므로, `b1`과 `b4` 모두 실제 `DerivedB` 객체의 `test()`를 호출해 `DerivedB`를 두 번 출력합니다.", "walkthrough": "1. `b1 = new DerivedB()`, `b2 = new DerivedA()`, `b3 = new DerivedB()`를 만듭니다. 모두 `Base` 타입 참조이며 업캐스팅이라 문제가 없습니다.\n2. `b1 = (Base) b3;`: 이미 `Base` 타입이므로 의미 없는 캐스팅입니다. 이제 `b1`은 `b3`가 가리키는 `DerivedB` 객체를 가리킵니다.\n3. `Base b4 = (DerivedA) b3;`: 다운캐스팅이지만 `b3`의 실제 객체는 `DerivedB`이고 `DerivedB`는 `Deriv
