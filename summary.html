<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCAJP 개념 정리노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky left rail (exam-objective filter + question number grid) beside a single reading column of question cards; rail collapses into a top toolbar on phones. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --ink: #17202C; --muted: #5A6577; --line: #DCE1E8;
  --accent: #1F4FD1; --accent-weak: #E5EBFB;
  --ok: #1B7A48; --ok-weak: #E2F2E9; --bad: #B3322A; --bad-weak: #F8E4E2; --warn: #8F5B00; --warn-weak: #FAEFD7;
  --code-bg: #F6F8FB; --code-ink: #1D2633; --k: #7A2FB8; --s: #1B7A48; --n: #B0510F; --c: #7B8494; --t: #1F4FD1;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--font-mono); }

.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; }
header.top { min-width: 0; grid-column: 1 / -1; padding-block: 36px 8px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h1 .code { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

/* rail */
aside.rail { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 18px; padding-bottom: 8px; }
.rail h2 { margin: 0 0 8px; font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.topics { display: grid; gap: 2px; }
.topic-btn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 14px; }
.topic-btn:hover { background: var(--accent-weak); }
.topic-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.topic-btn .n { font-family: var(--font-mono); font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
.toggles { display: grid; gap: 6px; font-size: 14px; }
.toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.grid a { display: block; text-align: center; padding: 4px 0; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; text-decoration: none; color: var(--muted); border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.grid a.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.grid a.bad { background: var(--bad-weak); color: var(--bad); border-color: transparent; }
.grid a.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.grid a.supp { border-style: dashed; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }

/* main */
main { min-width: 0; display: grid; gap: 22px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.section-head h2 { margin: 0; font-size: 19px; }
.section-head span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
article.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 16px; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.qno { font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); white-space: nowrap; }
.chip.supp { background: var(--warn-weak); color: var(--warn); }
.chip.multi { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.qhead .spacer { flex: 1; }
.flag-btn { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.flag-btn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); background: var(--warn-weak); }
.src { font-size: 12.5px; color: var(--muted); }
.stem { display: grid; gap: 10px; min-width: 0; }
.stem p { margin: 0; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; tab-size: 4; }
pre.code code { font-family: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--k); }
.hljs-string { color: var(--s); }
.hljs-number { color: var(--n); }
.hljs-comment { color: var(--c); font-style: italic; }
.hljs-title, .hljs-type, .hljs-class .hljs-title { color: var(--t); }
.hljs-meta { color: var(--c); }

.opts { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-weight: 600; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--bg); font-size: 13px; }
.opt .body { min-width: 0; display: grid; gap: 6px; }
.opt .body pre.code { font-size: 12.5px; padding: 8px 12px; }
.opt.sel { border-color: var(--accent); background: var(--accent-weak); }
.opt.sel .key { background: var(--accent); color: var(--surface); }
.revealed .opt, .graded .opt { cursor: default; }
.revealed .opt.right, .graded .opt.right { border-color: var(--ok); background: var(--ok-weak); }
.revealed .opt.right .key, .graded .opt.right .key { background: var(--ok); color: var(--surface); }
.revealed .opt.wrong, .graded .opt.wrong { border-color: var(--bad); background: var(--bad-weak); }
.revealed .opt.wrong .key, .graded .opt.wrong .key { background: var(--bad); color: var(--surface); }
.graded .opt.sel:not(.wrong):not(.right) { border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn.ghost { background: none; color: var(--accent); }
.verdict { font-size: 14px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

.ex { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 16px; min-width: 0; }
.ex h3 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.answer-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.answer-line .ans { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--ok); }
.answer-line .sum { font-weight: 500; }
.note { border-radius: 8px; padding: 10px 14px; background: var(--warn-weak); color: var(--ink); font-size: 14.5px; }
.note b.lbl { color: var(--warn); }
.md { min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .5em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md code:not(pre code) { font-size: .9em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre.code { margin: .6em 0; }
.optex { display: grid; gap: 8px; }
.optex .row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.optex .row .key { font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding-top: 2px; color: var(--bad); }
.optex .row.right .key { color: var(--ok); }
details.concept { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.concept summary { cursor: pointer; padding: 9px 14px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.concept summary::before { content: "+"; font-family: var(--font-mono); color: var(--accent); width: 12px; }
details.concept[open] summary::before { content: "−"; }
details.concept .md { padding: 0 14px 12px 34px; }
.trap { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: none; cursor: pointer; color: var(--muted); }
.tag:hover { color: var(--accent); border-color: var(--accent); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

#index .cols { columns: 2 260px; column-gap: 28px; font-size: 14px; }
#index .entry { break-inside: avoid; padding: 3px 0; display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px dotted var(--line); }
#index .entry a { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; }

.syncbox { display: grid; gap: 8px; font-size: 13.5px; }
.syncbox h2 { margin: 0; }
.sync-status { margin: 0; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.sync-status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transform: translateY(-1px); }
.sync-status[data-s="ok"]::before { background: var(--ok); }
.sync-status[data-s="syncing"]::before { background: var(--accent); }
.sync-status[data-s="auth"]::before, .sync-status[data-s="error"]::before { background: var(--bad); }
.sync-status[data-s="offline"]::before { background: var(--warn); }
#sync-panel { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
#sync-panel .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sync-actions .btn { padding: 5px 12px; font-size: 13px; }
.rail-links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.src .mine { color: var(--ink); }
#history .hist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; }
#history .hist > div { min-width: 0; }
#history h3 { margin: 0 0 6px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.hist-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist-table th, .hist-table td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.hist-table th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.hist-table td.num { text-align: right; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ok); vertical-align: middle; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 92px; }
.days .d { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.days .col { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
.days .col.zero { background: var(--line); }
.recent { list-style: none; margin: 0; padding: 0; font-size: 14px; display: grid; gap: 2px; }
.recent li { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
.recent .when { color: var(--muted); font-size: 12.5px; min-width: 88px; }
.recent .ok { color: var(--ok); } .recent .bad { color: var(--bad); }
.hist-empty { color: var(--muted); margin: 0; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  aside.rail { position: static; max-height: none; overflow: visible; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-btn { width: auto; border: 1px solid var(--line); background: var(--surface); }
  .rail .grid-wrap { display: none; }
  article.q { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* Layout: sticky table of contents (chapters → sections, with checked-off progress) beside one reading column of concept sections; TOC folds into a <details> on phones. */
.back { font-size: 13.5px; }
.toc { display: grid; gap: 14px; font-size: 14px; }
.toc .ch > a { font-weight: 600; text-decoration: none; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.toc .ch > a .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.toc ol { list-style: none; margin: 4px 0 0; padding: 0 0 0 10px; border-left: 1px solid var(--line); display: grid; gap: 1px; }
.toc ol a { display: block; padding: 2px 6px; text-decoration: none; color: var(--muted); font-size: 13px; border-radius: 5px; }
.toc ol a:hover { color: var(--accent); background: var(--accent-weak); }
.toc ol a.done { color: var(--ok); }
.toc ol a.done::after { content: " ✓"; }
.toc ol a.bm::before { content: "●"; color: var(--warn); font-size: 9px; margin-right: 5px; vertical-align: 2px; }
details.toc-wrap > summary { display: none; }
.chapter-head { margin-top: 18px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); display: grid; gap: 6px; scroll-margin-top: 16px; }
.chapter-head .idx { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.chapter-head h2 { margin: 0; font-size: 24px; }
.chapter-head p { margin: 0; color: var(--muted); }
section.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 24px; display: grid; gap: 12px; min-width: 0; scroll-margin-top: 16px; }
section.sec > * { min-width: 0; }
section.sec.bm { border-left: 4px solid var(--warn); }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.sec-head h3 { margin: 0; font-size: 18px; flex: 1 1 auto; }
.sec-head .no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip.bm { background: var(--warn-weak); color: var(--warn); }
.pit { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; display: grid; gap: 4px; }
.pit h4, .rel h4 { margin: 0; font-size: 12.5px; font-family: var(--font-mono); letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.pit ul { margin: 0; padding-left: 1.2em; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rel a { font-family: var(--font-mono); font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--muted); }
.rel a.bm { border-color: var(--warn); color: var(--warn); background: var(--warn-weak); }
.sec-foot { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 10px; }
.sec-foot label { font-size: 13.5px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.md table { border-collapse: collapse; font-size: 14px; margin: .5em 0; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--bg); font-weight: 600; }
.progress { display: grid; gap: 6px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.progress .m { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  details.toc-wrap > summary { display: block; cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 500; }
  details.toc-wrap[open] > summary { margin-bottom: 12px; }
  section.sec { padding: 16px; }
}
@media print {
  aside.rail, .sec-foot, .back { display: none !important; }
  .shell { display: block; }
  section.sec { break-inside: avoid-page; border-color: #ccc; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="back" href="./">← 문제별 해설 노트로 돌아가기</a>
    <div class="eyebrow">Java SE 8 Programmer I · Exam 1Z0-808</div>
    <h1>OCAJP <span class="code">1Z0-808</span> 개념 정리노트</h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="rail" aria-label="목차">
    <input class="search" id="s-search" type="search" placeholder="개념 검색 (예: substring, super)">
    <div class="progress"><div class="meter"><i id="meter"></i></div><span class="m" id="prog"></span></div>
    <div class="toggles">
      <label><input type="checkbox" id="only-bm"> 북마크 관련 개념만</label>
      <label><input type="checkbox" id="hide-done"> 다 본 섹션 숨기기</label>
    </div>
    <details class="toc-wrap" id="toc-wrap" open>
      <summary>목차</summary>
      <nav class="toc" id="toc"></nav>
    </details>
  </aside>

  <main id="main"></main>
</div>

<script id="data" type="application/json">{"chapters": [{"topic": "basics", "name": "Java 기초", "en": "Java Basics", "intro": "Java 플랫폼의 특징(JVM·바이트코드, 객체 지향), 소스 파일·클래스의 구조, 변수 스코프, package/import, main 메서드와 `javac`/`java` 명령을 다룹니다. 점수는 주로 import 순서·와일드카드 범위, 필드와 지역 변수의 초기화 차이, '컴파일 에러인가 실행 오류인가'를 구분하지 못할 때 잃습니다.", "sections": [{"title": "플랫폼 독립성과 JDK·JRE·JVM", "body": "Java 프로그램은 **컴파일**과 **실행** 두 단계로 나뉩니다. 이 분리가 플랫폼 독립성의 근거입니다.\n\n1. `javac Hello.java` → 플랫폼과 무관한 **바이트코드** `Hello.class`를 만듭니다. JDK가 필요합니다.\n2. `java Hello` → JVM이 클래스를 로드·검증한 뒤 인터프리트하거나 JIT 컴파일해서 실행합니다. JRE만 있으면 됩니다.\n\n| 구성 요소 | 내용 | 필요한 때 |\n|---|---|---|\n| JVM | 바이트코드를 실행하는 가상 머신. OS마다 구현이 다름 | 실행 |\n| JRE | JVM + 표준 클래스 라이브러리 | 실행만 할 때 |\n| JDK | JRE + `javac`, `jar`, `javadoc` 등 개발 도구 | 컴파일할 때 |\n\n바이트코드에 관한 참인 진술:\n- `.class` 파일은 OS마다 다시 컴파일하지 않고 **JRE(JVM)가 설치된 플랫폼**이면 어디서든 실행됩니다 (Write Once, Run Anywhere).\n- 바이트코드는 파일이므로 네트워크로 전송할 수 있습니다.\n- 플랫폼마다 달라지는 것은 JVM 구현이고, 바이트코드는 같습니다.\n\n거짓 진술의 전형:\n- \"Java 컴파일러가 있는 플랫폼에서만 실행된다\" → 실행에는 컴파일러가 필요 없습니다.\n- \"특정 플랫폼용으로 컴파일해야 한다\" → 바이트코드는 플랫폼 중립입니다.\n- \"어떤 플랫폼에서나 실행된다\"(조건 없음) → JVM이 있어야 합니다.\n\n시험이 '특징' 보기로 자주 쓰는 다른 키워드: 자동 메모리 관리(GC, 포인터 연산 없음), 강한 타입 검사, 예외 처리, 멀티스레드 지원. 플랫폼 독립성은 Java의 특징이지만 **객체 지향 특징은 아닙니다**.", "pitfalls": ["실행 조건은 'JRE(JVM)가 있는 플랫폼'입니다. '컴파일러가 있는 플랫폼'은 컴파일 조건과 섞은 함정입니다.", "'아무 플랫폼에서나 실행된다'처럼 JVM 조건이 빠진 문장은 거짓입니다.", "플랫폼 독립성을 객체 지향 특징 보기로 고르지 마십시오. 묻는 범주를 먼저 확인합니다."], "qs": [6, 7]}, {"title": "객체 지향 특징과 java.lang.Object", "body": "| 특징 | Java에서의 구현 |\n|---|---|\n| 캡슐화 | `private` 필드 + `public` 메서드로 내부 상태 보호 |\n| 상속 | `extends`로 부모 클래스의 멤버를 물려받아 재사용 |\n| 다형성 | 상위 타입 참조로 하위 객체를 다루고, 오버라이드된 메서드가 실행됨 |\n| 추상화 | `abstract` 클래스, 인터페이스 |\n\n**Object는 모든 클래스의 루트**입니다.\n- `extends`를 쓰지 않은 클래스에는 컴파일러가 `extends Object`를 붙입니다.\n- 모든 클래스와 **배열**은 `toString()`, `equals()`, `hashCode()`, `getClass()` 등을 물려받습니다.\n- 그래서 어떤 참조든 `Object` 변수에 대입할 수 있습니다.\n- 클래스는 단일 상속만 되므로 상속 계층은 Object를 뿌리로 하는 트리입니다.\n\n**오버라이드는 선택, abstract 구현은 의무**입니다. 자식 클래스는 부모 메서드를 그대로 물려받아 써도 됩니다. 단, abstract 메서드를 물려받은 구체 클래스는 반드시 구현해야 하고, 자식도 abstract로 선언하면 의무를 다음 자식에게 넘길 수 있습니다.\n\n```java\nclass Animal { void sound() { System.out.println(\"...\"); } }\nclass Dog extends Animal { }               // ✓ 오버라이드 없이 sound() 상속\nabstract class Shape { abstract double area(); }\nabstract class Poly extends Shape { }       // ✓ abstract면 구현 의무를 넘김\n// class Circle extends Shape { }          // ✗ area()를 구현하지 않음\nObject o1 = new Dog();                      // ✓\nObject o2 = new int[3];                     // ✓ 배열도 Object\n```\n\n보기에 자주 나오는 **거짓** 진술:\n- \"모든 클래스(또는 패키지)에 main 메서드가 있어야 한다\"\n- \"객체는 재사용할 수 없다\"\n- \"패키지에는 클래스가 여러 개 있어야 한다\"\n- \"자식 클래스는 부모의 메서드를 반드시 오버라이드해야 한다\"", "pitfalls": ["'must'(반드시)가 들어간 객체 지향 보기는 대부분 거짓입니다.", "main은 `java 클래스명`으로 실행할 클래스에만 필요합니다. 객체 지향 특징과 무관합니다.", "Object를 상속하지 않는 클래스는 없습니다. `extends`가 없어도 Object의 메서드를 호출할 수 있습니다."], "qs": [5, 8]}, {"title": "소스 파일 구조와 클래스 선언", "body": "한 `.java` 파일의 순서는 고정입니다. 주석은 어디에 와도 됩니다.\n\n1. `package` 선언 (0~1개, 반드시 첫 문장)\n2. `import` 문 (0개 이상)\n3. 타입 선언 (class, interface, enum)\n\n파일과 클래스 규칙:\n- `public` 최상위 타입은 파일당 **최대 1개**이고, 파일 이름과 대소문자까지 같아야 합니다.\n- `public`이 아닌 클래스는 여러 개 둘 수 있고, 이름이 파일과 달라도 됩니다.\n- 컴파일하면 클래스마다 `.class` 파일이 따로 생깁니다.\n- 클래스에 꼭 필요한 것은 `class 이름 { }`뿐입니다. 필드, 메서드, 생성자, main은 모두 선택입니다. 생성자를 쓰지 않으면 기본 생성자가 추가됩니다.\n- 필드·메서드·타입 이름은 문맥으로 구분되므로 **필드와 메서드 이름이 같아도 됩니다**.\n- 클래스 이름과 같은 이름에 반환형을 붙이면 생성자가 아니라 일반 메서드입니다.\n\n```java\n// C.java\npackage p1;              // ✓ 첫 문장\nimport java.io.*;        // ✓ package 다음\nclass A {                // ✓ public이 아니므로 파일명(C)과 달라도 됨\n    int a;               // ✓ 필드와\n    public void a() { }  // ✓ 같은 이름의 메서드\n    void A() { }         // ✓ 반환형이 있으므로 생성자가 아닌 메서드\n}\n```\n\n```java\nimport java.io.*;\npackage p1;              // ✗ package는 import보다 먼저 와야 함\n```\n\n```java\n// A.java\npublic class B { }       // ✗ public 클래스 B는 B.java에 있어야 함\n```", "pitfalls": ["`import`가 `package`보다 앞에 있으면 컴파일 에러입니다. 다른 보기의 그럴듯한 오류에 가려 놓치기 쉽습니다.", "필드 `int a;`와 메서드 `void a()`의 공존은 합법입니다. 에러로 고르지 마십시오.", "'public 클래스에는 main이 있어야 한다', '클래스에는 필드나 메서드가 있어야 한다'는 거짓입니다."], "qs": [3, 4, 10, 12]}, {"title": "멤버 선언 규칙: 오버로딩, static, final, private 생성자", "body": "**오버로딩**은 같은 이름의 메서드나 생성자를 **매개변수 목록**(개수, 타입, 순서)을 다르게 해서 여러 개 두는 것입니다.\n- 반환형, 접근 제어자, `static` 여부만 다르면 오버로딩이 아니라 **중복 선언 에러**입니다.\n- static 메서드끼리, 생성자끼리(private 포함)도 오버로딩할 수 있습니다.\n\n**static과 final**\n- static 메서드는 오버라이드되지 않고, 자식에 같은 시그니처를 선언하면 숨김(hiding)이 됩니다.\n- `final static` 메서드는 합법이며, 자식이 같은 시그니처로 숨기는 것도 금지됩니다.\n- `abstract static`은 불가능합니다. abstract는 오버라이드를 전제로 하는데 static은 오버라이드되지 않기 때문입니다.\n\n**private 생성자**는 클래스 밖의 `new`를 막습니다. 유틸리티 클래스, 싱글턴, 정적 팩토리에 씁니다. 클래스 안에서는 `this(...)`나 `new`로 호출할 수 있습니다.\n\n```java\nclass Util {\n    private Util() { }                                       // ✓\n    private Util(int x) { this(); }                          // ✓ private 생성자 오버로딩\n    static int sum(int a, int b) { return a + b; }           // ✓\n    static double sum(double a, double b) { return a + b; }  // ✓ static 메서드 오버로딩\n    final static void log() { }                              // ✓\n    static Util create() { return new Util(1); }             // ✓ 클래스 안에서는 new 가능\n}\n```\n\n```java\nint m(int a) { return a; }\nlong m(int a) { return a; }        // ✗ 반환형만 다름: 이미 정의된 메서드\nstatic void s() { }\nvoid s() { }                       // ✗ static 여부만 다름\nabstract static void f();          // ✗ abstract와 static 조합 불가\nclass Other { Util u = new Util(); }  // ✗ Util()은 private\n```", "pitfalls": ["반환형만 다른 두 메서드는 오버로딩이 아니라 컴파일 에러입니다.", "'static 메서드는 오버로딩할 수 없다'는 거짓입니다. 오버라이드가 안 될 뿐입니다.", "`final static` 메서드와 오버로딩된 `private` 생성자는 모두 합법입니다."], "qs": [3, 4]}, {"title": "변수의 종류, 기본값, 스코프", "body": "| 종류 | 선언 위치 | 기본값 | 스코프(유효 범위) |\n|---|---|---|---|\n| 인스턴스 변수 | 클래스 안, 메서드 밖 | 있음 | 객체가 살아 있는 동안 |\n| static 변수 | 클래스 안, `static` | 있음 | 클래스가 로드된 동안 |\n| 지역 변수 | 메서드·블록 안 | **없음** | 선언 지점부터 블록 `}`까지 |\n| 매개변수 | 메서드 선언부 | 호출 시 전달값 | 메서드 끝까지 |\n\n기본값: 정수형 `0`, 실수형 `0.0`, `boolean`은 `false`, `char`는 `'\\u0000'`, 참조형은 `null`.\n\n규칙:\n- **필드는 초기화하지 않아도 사용할 수 있습니다.** 지역 변수는 대입 전에 읽으면 컴파일 에러입니다.\n- 지역 변수에 붙일 수 있는 수식어는 `final`뿐입니다. `private`, `public`, `static` 등을 붙이면 컴파일 에러입니다.\n- for 문에서 선언한 변수는 루프 밖에서 보이지 않습니다.\n\n```java\nclass T {\n    int f;                        // 기본값 0\n    void m() {\n        int x;                    // ✓ 선언만 하고 읽지 않으면 OK\n        System.out.println(f);    // ✓ 0 출력\n        final int y = 1;          // ✓\n        for (int i = 0; i < 2; i++) { }\n    }\n}\n```\n\n```java\nint x; System.out.println(x);   // ✗ variable x might not have been initialized\nprivate int z = 1;              // ✗ 지역 변수에 private\nstatic int w = 1;               // ✗ 지역 변수에 static\nfor (int i = 0; i < 2; i++) { }\nSystem.out.println(i);          // ✗ i는 for 밖에서 보이지 않음\n```\n\n보기 문장에 '초기화해야 사용할 수 있다'가 나오면 **필드 이야기인지 지역 변수 이야기인지** 먼저 구분하십시오. 자세한 확정 할당 규칙과 섀도잉은 자료형 장에서 다룹니다.", "pitfalls": ["'Fields need to be initialized before use'는 거짓입니다. 그 규칙은 지역 변수에만 해당합니다.", "지역 변수에 `private`/`static`을 붙인 코드는 컴파일 에러입니다. `final`만 허용됩니다.", "for 헤더에서 선언한 루프 변수를 루프 뒤에서 쓰면 `cannot find symbol`입니다."], "qs": [3, 4, 12]}, {"title": "패키지와 import", "body": "import는 두 형태입니다(static import 제외).\n- 단일 타입 import: `import java.util.ArrayList;`\n- 요청 시(와일드카드) import: `import java.util.*;`\n\n핵심 규칙:\n- `*`는 **그 패키지에 직접 속한 타입만** 가져옵니다. 하위 패키지는 포함하지 않습니다.\n- `p1`과 `p1.p2`는 이름만 비슷한 **서로 독립된 패키지**입니다. `p1.p2`의 클래스가 `p1`의 클래스를 쓰려면 import해야 하고, default(package-private) 멤버에도 접근할 수 없습니다.\n- `java.lang`과 같은 패키지의 클래스는 import 없이 씁니다.\n- import 없이 정규화된 이름(`p1.A`)을 직접 써도 됩니다.\n- 두 와일드카드가 같은 이름을 가져오면 그 이름을 **쓸 때** 모호성 에러가 납니다. 단일 타입 import를 추가하면 그쪽이 우선합니다.\n\n```java\n// p1/A.java      package p1;    public class A { }\n// p1/p2/B.java   package p1.p2; public class B { }\npackage p3;\nimport p1.*;                    // A만 가져옴\nimport p1.p2.*;                 // B는 따로 import해야 함\npublic class C {\n    A a; B b;                   // ✓\n    p1.A full = new p1.A();     // ✓ 정규화된 이름\n}\n```\n\n```java\nimport p1.*;  // 이것만 있으면\nB b;          // ✗ cannot find symbol: p1.*는 p1.p2.B를 가져오지 않음\nimport p1;    // ✗ 패키지 이름만 import할 수 없음\nimport p1.*.*;  // ✗ 와일드카드 중첩 불가\n```\n\n```java\nimport java.util.*;\nimport java.sql.*;\nDate d;                  // ✗ reference to Date is ambiguous\nimport java.util.Date;   // 이 줄을 추가하면 ✓ (단일 import 우선)\n```", "pitfalls": ["`import p1.*;`가 하위 패키지 `p1.p2`까지 가져온다고 보면 틀립니다. 두 패키지를 각각 import해야 합니다.", "패키지 사이에는 상속·포함 관계가 없습니다. `p1.p2`에서 `p1`의 default 멤버는 보이지 않습니다.", "`import 패키지명;`과 `import a.*.*;`는 문법 에러입니다."], "qs": [9, 10]}, {"title": "main 메서드와 실행 진입점", "body": "JVM이 진입점으로 쓰는 메서드는 `public` + `static` + 반환형 `void` + 이름 `main` + `String` 배열 매개변수 하나입니다.\n\n허용되는 변형:\n- 제어자 순서 변경: `static public void main`\n- `String args[]`, `String... args`\n- 매개변수 이름 변경, `final` 추가, `synchronized` 등 다른 제어자 추가\n\n```java\npublic static void main(String[] args)                     // ✓ 표준\npublic static void main(String args[])                     // ✓\npublic static void main(String... args)                    // ✓\nstatic public void main(final String[] x)                  // ✓\nfinal public static synchronized void main(String[] args)  // ✓\npublic static void main(String[])                          // ✗ 매개변수 이름 없음\nPublic static void main(String[] a)                        // ✗ Public은 키워드가 아님\nvoid public static main(String[] a)                        // ✗ 반환형은 메서드 이름 바로 앞\n```\n\n**컴파일 에러 vs 실행 오류**를 구분해야 합니다. 아래는 이름이 main인 평범한 메서드라 **컴파일은 됩니다**. 하지만 Java 8 JVM은 진입점으로 인식하지 못해 `java 클래스명`으로 실행하면 오류가 납니다.\n\n| 선언 | 컴파일 | Java 8 실행 |\n|---|---|---|\n| `public void main(String[] a)` | ✓ | static 아님 → 오류 |\n| `static void main(String[] a)` | ✓ | public 아님 → 오류 |\n| `public static int main(String[] a)` | ✓ | void 아님 → 오류 |\n\n**main 오버로딩**도 합법이지만 JVM은 `String[]` 버전만 호출합니다.\n\n```java\npublic class MainTest {\n    public static void main(int[] args)    { System.out.println(\"int main \" + args[0]); }\n    public static void main(Object[] args) { System.out.println(\"Object main \" + args[0]); }\n    public static void main(String[] args) { System.out.println(\"String main \" + args[0]); }\n}\n// java MainTest 1 2 3  →  String main 1\n```", "pitfalls": ["main 오버로딩은 컴파일 에러가 아닙니다. `Object[]`가 `String[]`를 받을 수 있어도 JVM은 `String[]` 버전만 호출합니다.", "static이나 public이 빠진 main은 '컴파일 실패'가 아니라 '실행 시 오류'입니다.", "`String []`, 괄호 앞 공백처럼 낯선 공백은 문법상 문제가 없습니다. 이름 누락, `Public` 같은 진짜 오류를 찾으십시오."], "qs": [11, 13]}, {"title": "javac·java 명령과 명령줄 인자", "body": "| 명령 | 받는 것 | 예 |\n|---|---|---|\n| `javac` | 소스 **파일 경로** (확장자 포함) | `javac Greeting.java`, `javac p1/A.java` |\n| `java` | 클래스의 **정규화된 이름** (확장자 없음) | `java Greeting Duke`, `java p1.A` |\n\n`java` 명령에서 클래스 이름 **뒤의** 토큰이 공백 기준으로 나뉘어 `String[] args`로 들어갑니다.\n- `java`나 클래스 이름은 포함되지 않습니다. `args[0]`이 첫 번째 인자입니다(C의 argv와 다름).\n- 따옴표로 묶으면 공백을 포함한 한 인자가 됩니다.\n- 인자가 없으면 `args`는 `null`이 아니라 **길이 0 배열**입니다. 없는 인덱스에 접근하면 `ArrayIndexOutOfBoundsException`이 납니다.\n- 모든 인자는 `String`입니다. 명령줄의 `null`도 문자열 `\"null\"`입니다. 숫자로 쓰려면 `Integer.parseInt(args[0])`로 변환합니다.\n\n```java\npublic class Echo {\n    public static void main(String[] args) {\n        System.out.println(args.length);\n        for (String s : args) System.out.println(\"[\" + s + \"]\");\n    }\n}\n// java Echo a \"b c\" 3   →  3, [a], [b c], [3]\n// java Echo             →  0\n```\n\n```java\npublic class MyFile {\n    public static void main(String[] args) {\n        String arg1 = args[1];\n        String arg2 = args[2];\n        String arg3 = args[3];\n        System.out.println(\"Arg is \" + arg3);\n    }\n}\n// java MyFile 1 3 2 2  →  Arg is 2   (args[3]이 네 번째 인자)\n// java MyFile 1 2 3    →  ArrayIndexOutOfBoundsException\n```\n\n```java\n// java Add 1 2\nSystem.out.println(args[0] + args[1]);                                     // 12 (문자열 연결)\nSystem.out.println(Integer.parseInt(args[0]) + Integer.parseInt(args[1])); // 3\n```", "pitfalls": ["`javac`에는 `.java`를 붙이고 `java`에는 `.class`를 붙이지 않습니다. 인자를 `javac` 쪽에 붙인 보기도 오답입니다.", "인덱스는 0부터이며 클래스 이름은 `args[0]`이 아닙니다. 필요한 최대 인덱스 + 1개 이상의 인자를 줘야 예외가 나지 않습니다.", "인자가 없을 때 `args`는 `null`이 아니라 길이 0 배열입니다. `args[0]`은 NullPointerException이 아니라 ArrayIndexOutOfBoundsException입니다."], "qs": [1, 2, 11]}]}, {"topic": "datatypes", "name": "자료형", "en": "Working With Java Data Types", "intro": "기본형과 리터럴, 형 변환과 숫자 승격, 기본값과 확정 할당, 스코프, 기본형·참조형 변수의 차이, 객체 수명과 GC, 래퍼 클래스를 다룹니다. 점수는 리터럴의 기본 타입(int, double), 캐스트가 필요한 축소 변환, 래퍼 대입 규칙, 그리고 '참조 복사'와 '객체 생성'을 구분하지 못할 때 잃습니다.", "sections": [{"title": "기본형 8가지와 리터럴", "body": "| 타입 | 크기 | 범위·값 | 리터럴 예 |\n|---|---|---|---|\n| `byte` | 8bit | -128 ~ 127 | `10` |\n| `short` | 16bit | -32768 ~ 32767 | `10` |\n| `int` | 32bit | 약 ±21억 | `10`, `0x1F`, `017`, `0b101` |\n| `long` | 64bit | | `10L` |\n| `float` | 32bit | | `1.5f`, `1.5F` |\n| `double` | 64bit | | `1.5`, `1.5d` |\n| `char` | 16bit | 0 ~ 65535 (부호 없음) | `'A'`, `65`, `'A'` |\n| `boolean` | - | `true`/`false`만 | `true` |\n\n- **정수 리터럴은 `int`, 소수점 리터럴은 `double`이 기본**입니다. int 범위를 넘는 정수는 `L`이 필요하고, float 변수에는 `f`가 필요합니다.\n- 진법: `0x`(16진), `0`으로 시작(8진), `0b`(2진, Java 7+). 8진 리터럴에 8, 9는 쓸 수 없습니다.\n- **밑줄 `_`**(Java 7+)은 **숫자와 숫자 사이에만** 올 수 있습니다. 묶는 간격은 자유(`123_45`)이고 값에 영향이 없습니다. 맨 앞·맨 뒤, 소수점 앞뒤, 접미사(`L`, `F`) 바로 앞, `0x` 바로 뒤는 불가합니다.\n- `boolean`은 숫자와 호환되지 않습니다.\n\n```java\nint    a  = 1_000_000;          // ✓\ndouble b  = 12_345.01;          // ✓ (123_45.00도 ✓)\nint h = 0x1F, o = 017, bi = 0b101;   // ✓ 31, 15, 5\nlong   l  = 3_000_000_000L;     // ✓\nfloat  f1 = 100.00F;            // ✓ 0이 많아도 F가 있으면 float\nfloat  f2 = 10;                 // ✓ int → float 확대\nchar c1 = 'A', c2 = 65, c3 = 'A';  // ✓ 모두 같은 문자\n```\n\n```java\nlong l2 = 3000000000;   // ✗ integer number too large (L 없음)\nfloat f3 = 1.5;         // ✗ double → float\ndouble c = 12_.5;       // ✗ 소수점 앞 _\nlong d = 10_L;          // ✗ 접미사 앞 _\nint e = 0x_1F;          // ✗ 0x 바로 뒤 _\nint g = 1_;             // ✗ 끝에 _\nint k = _10;            // ✗ _10은 식별자(변수 이름)로 해석됨\nint n = 08;             // ✗ 8진수에 8 없음\nchar c4 = -1;           // ✗ char 범위 밖\nboolean bo = 1;         // ✗\n```", "pitfalls": ["`100.00F`처럼 소수점 아래가 길어도 `F`가 붙으면 float입니다. 반대로 `F`가 없으면 double입니다.", "이상하게 묶인 밑줄(`124_56.02f`)은 합법입니다. 밑줄 위치가 숫자 사이인지만 확인합니다.", "`_10`은 숫자가 아니라 식별자입니다."], "qs": [22, 26]}, {"title": "확대 변환과 축소 변환(캐스팅)", "body": "**확대 변환**(캐스트 없이 자동): `byte → short → int → long → float → double`, 그리고 `char → int`.\n- `long → float`도 확대로 칩니다(정밀도는 잃을 수 있음).\n- `byte`/`short`와 `char` 사이는 어느 방향이든 캐스트가 필요합니다.\n\n**축소 변환**은 반드시 `(타입)` 캐스트가 필요합니다. `double → float`도 축소입니다.\n- 실수 → 정수 캐스트는 소수점 이하를 버립니다(0 쪽으로).\n- 범위를 넘으면 비트가 잘려 값이 바뀝니다.\n\n**상수 대입 예외**: `int` 타입 **컴파일 타임 상수**가 대상 범위 안이면 `byte`/`short`/`char`에 캐스트 없이 대입할 수 있습니다.\n- `final int K = 100;`처럼 선언과 동시에 상수로 초기화한 final 변수도 상수입니다.\n- 일반 변수, 범위 밖 값, `long`/`double` 상수에는 적용되지 않습니다.\n\n```java\nint iVar = 100; float fVar = 100.100f; double dVar = 123;\nfVar = iVar;          // ✓ int → float\ndVar = fVar;          // ✓ float → double\ndVar = iVar;          // ✓ int → double\niVar = (int) dVar;    // ✓ 캐스트\nbyte b1 = 10;         // ✓ 범위 안 int 상수\nfinal int K = 100;\nbyte b2 = K;          // ✓ 컴파일 타임 상수\nSystem.out.println((int) 3.9);    // 3\nSystem.out.println((int) -3.9);   // -3\nSystem.out.println((byte) 200);   // -56\n```\n\n```java\niVar = fVar;          // ✗ float → int\nfVar = dVar;          // ✗ double → float\niVar = dVar;          // ✗ double → int\nint i = 10; byte b3 = i;      // ✗ 변수는 상수가 아님\nbyte b4 = 128;                // ✗ 범위 밖\nint n = 10L;                  // ✗ long 상수에는 예외 없음\nbyte bt = 1; char c = bt;     // ✗ byte → char\nint t = (int) true;           // ✗ boolean은 캐스트도 불가\n```\n\n복합 대입(`b += 5`)은 묵시적 캐스트를 포함하므로 `byte`에도 컴파일됩니다(연산자 장 참고).", "pitfalls": ["float와 double 사이에도 축소가 있습니다. `double → float` 대입은 캐스트가 필요합니다.", "`byte b = 10;`은 되지만 `byte b = i;`(int 변수)는 안 됩니다. 상수냐 변수냐가 기준입니다.", "`(int)` 캐스트는 반올림이 아니라 버림입니다. `(int) -3.9`는 -3입니다."], "qs": [17, 26]}, {"title": "숫자 승격과 식의 결과 타입", "body": "**이항 숫자 승격**: 산술 연산(`+ - * / %`)과 비교 전에 두 피연산자를 같은 타입으로 맞춥니다.\n1. 한쪽이 `double`이면 double\n2. 아니면 한쪽이 `float`이면 float\n3. 아니면 한쪽이 `long`이면 long\n4. 그 밖에는 모두 **int** (`byte + byte`, `char + char`도 int)\n\n그래서 `byte`·`short`·`char` 변수끼리 계산한 결과를 같은 타입에 다시 넣으려면 캐스트가 필요합니다. 반면 `++`와 복합 대입은 원래 타입을 유지합니다.\n\n**char 산술**: `char`가 숫자 연산에 들어가면 코드값(int)으로 계산됩니다. String과 연결될 때만 문자로 붙습니다.\n\n**조건 연산자 `?:`의 결과 타입**: 두 값이 숫자형이면 **선택된 쪽과 무관하게** 승격된 타입이 결과입니다. int와 float이면 float, int와 double이면 double입니다. 예외로, 한쪽이 `char`이고 다른 쪽이 char 범위 안의 int 상수면 결과는 char입니다.\n\n```java\nbyte a = 1, b = 2;\nbyte c = (byte) (a + b);             // ✓\nbyte c2 = a + b;                     // ✗ byte + byte = int\nchar ch = 'A';\nSystem.out.println(ch + 1);          // 66\nSystem.out.println((char) (ch + 1)); // B\nSystem.out.println(\"\" + ch + 1);     // A1\nch++;                                // ✓ char 유지, B\nch = ch + 1;                         // ✗ int → char\n```\n\n```java\nfloat var1 = (12_345.01 >= 123_45.00) ? 12_456 : 124_56.02f;\nfloat var2 = var1 + 1024;\nSystem.out.println(var2);              // 13480.0 (int 12456이 float로)\nSystem.out.println(true ? 1 : 2.0);    // 1.0\nSystem.out.println(true ? 'a' : 0);    // a\nSystem.out.println(true ? 'a' : 70000);// 97 (70000은 char 범위 밖 → int)\nint r = true ? 1 : 2.0;                // ✗ 결과 타입이 double\n```\n\n- `float`/`double`은 `0.0`, `13480.0`처럼 출력되며 `f` 접미사는 붙지 않습니다.\n- 정수 나눗셈은 몫만 남습니다: `7 / 2` → `3`, `7 / 2.0` → `3.5`.", "pitfalls": ["조건이 true라 int 값이 선택돼도 다른 쪽이 float이면 결과는 float입니다. 출력에 `.0`이 붙습니다.", "`byte + byte`의 결과는 int입니다. 같은 타입끼리 더해도 캐스트 없이 byte에 넣을 수 없습니다.", "`char`와 숫자의 `+`는 덧셈입니다. 문자로 보려면 String과 먼저 연결하거나 `(char)`로 캐스트해야 합니다."], "qs": [14, 21, 22, 25]}, {"title": "필드 기본값과 지역 변수의 확정 할당", "body": "| 타입 | 필드·배열 원소 기본값 |\n|---|---|\n| `byte` `short` `int` `long` | `0` |\n| `float` `double` | `0.0` |\n| `char` | `'\\u0000'` (화면에 보이지 않음, 정수로 0) |\n| `boolean` | `false` |\n| 참조형 | `null` |\n\n인스턴스·static 필드와 **배열 원소**는 위 기본값을 받습니다. **지역 변수는 기본값이 없습니다.**\n\n**확정 할당(definite assignment)**: 지역 변수를 읽으려면 그 지점까지 **모든 실행 경로**에서 값이 대입되어 있어야 하며, 컴파일러가 흐름을 분석해 확인합니다.\n- 컴파일러는 변수의 **실행 시 값**을 보지 않습니다. `if (area == 0)`이 실제로 항상 참이어도, else 경로가 없으면 대입되지 않은 경로가 있다고 봅니다.\n- 조건이 `true` 같은 **컴파일 타임 상수**일 때만 그 분기를 확정으로 봅니다.\n- 선언만 하고 읽지 않으면 에러가 아닙니다.\n- 지역 배열 변수 자체도 지역 변수입니다. `int[] arr;`을 대입 없이 읽으면 에러이고, `new int[3]`로 만든 뒤의 원소는 0입니다.\n\n```java\npublic class FieldInit {\n    char c; boolean b; float f;\n    void printAll() {\n        System.out.println(\"c = \" + c);   // \"c = \" 뒤에 보이지 않는 '\\u0000'\n        System.out.println(\"b = \" + b);   // b = false\n        System.out.println(\"f = \" + f);   // f = 0.0\n    }\n}\n```\n\n```java\nboolean flag = args.length > 0;\nint y;\nif (flag) y = 1; else y = 2;\nSystem.out.println(y);       // ✓ 모든 경로에서 대입\nint z;\nif (true) z = 1;\nSystem.out.println(z);       // ✓ 조건이 상수 true\nint x;\nif (flag) x = 1;\nSystem.out.println(x);       // ✗ might not have been initialized\n```\n\n```java\nstatic double area;\npublic static void main(String[] args) {\n    double p, b, h;\n    if (area == 0) { b = 3; h = 4; p = 0.5; }\n    area = p * b * h;        // ✗ 실행하면 참이지만 컴파일러는 값을 보지 않음\n}\n```", "pitfalls": ["char 기본값은 `0`도 `null`도 아닌 `'\\u0000'`입니다. 문자열 연결로 출력하면 보이지 않는 문자가 찍힙니다.", "float 기본값은 `0.0`으로 출력됩니다. `0.0f`나 `0`이 아닙니다.", "if에 else가 없으면 그 안에서만 대입된 지역 변수는 if 뒤에서 읽을 수 없습니다. 실행 시 조건이 참인지는 상관없습니다.", "같은 이름의 필드가 초기화되어 있어도 지역 변수의 초기화로 치지 않습니다."], "qs": [14, 16]}, {"title": "변수 스코프와 섀도잉", "body": "**블록 스코프**: 지역 변수는 선언된 `{ }` 블록이 끝나면 사라집니다. try, if, for 블록도 같습니다.\n\ntry 블록도 블록입니다. try 안에서 선언한 변수는 catch, finally, try 문 뒤에서 보이지 않습니다. 그래서 try 안에서 같은 이름의 지역 변수를 선언해 값을 넣어도, try 뒤에서 그 이름은 다시 필드를 가리킵니다.\n\n**섀도잉(가리기)**: 지역 변수나 매개변수가 필드와 같은 이름이면 그 스코프 안에서는 지역 변수가 우선합니다.\n- 인스턴스 필드는 `this.이름`, static 필드는 `클래스명.이름`으로 접근합니다.\n- 블록을 벗어나면 그 이름은 다시 필드를 가리킵니다.\n\n**허용되지 않는 재선언**: 아직 살아 있는 지역 변수나 매개변수와 같은 이름을 안쪽 블록에서 다시 선언하면 컴파일 에러입니다. 스코프가 끝난 뒤에 같은 이름을 선언하는 것은 됩니다.\n\n**static 문맥**: static 메서드(main 포함)에서는 `this`가 없으므로 인스턴스 필드를 바로 쓸 수 없습니다.\n\n```java\npublic class App {\n    String myStr = \"7007\";\n    public void doStuff(String str) {\n        int myNum = 0;\n        try {\n            String myStr = str;               // ✓ 필드를 가리는 지역 변수\n            myNum = Integer.parseInt(myStr);\n        } catch (NumberFormatException ne) { }\n        System.out.println(\"myStr: \" + myStr + \", myNum: \" + myNum);\n    }\n}\n// new App().doStuff(\"9009\")  →  myStr: 7007, myNum: 9009\n```\n\n```java\nint x = 1;\n{ int x = 2; }           // ✗ x가 이미 정의됨\n{ int y = 2; }\nint y = 3;               // ✓ 앞의 y는 스코프가 끝남\nvoid m(int a) { int a = 5; }   // ✗ 매개변수와 같은 이름\n```\n\n```java\npublic class M {\n    int b = 2; static int s = 7;\n    void m() {\n        int b = 9; int s = 1;\n        System.out.println(b + \" \" + this.b + \" \" + s + \" \" + M.s);  // 9 2 1 7\n    }\n    public static void main(String[] args) {\n        System.out.println(b);           // ✗ static 문맥에서 인스턴스 필드\n        System.out.println(new M().b);   // ✓ 2\n    }\n}\n```", "pitfalls": ["블록 안에서 같은 이름의 지역 변수에 대입한 값은 블록 밖의 필드에 반영되지 않습니다.", "필드와 같은 이름의 지역 변수 선언은 합법이지만, 살아 있는 지역 변수와 같은 이름의 재선언은 컴파일 에러입니다.", "main에서 인스턴스 필드를 바로 쓰면 `non-static variable cannot be referenced from a static context`입니다."], "qs": [16, 19]}, {"title": "기본형 변수와 참조형 변수", "body": "| 구분 | 변수에 저장되는 것 | 대입 `a = b`의 의미 |\n|---|---|---|\n| 기본형 | 값 자체 | 값 복사. 이후 한쪽을 바꿔도 다른 쪽은 그대로 |\n| 참조형 | 객체를 가리키는 참조값 | 참조 복사. 두 변수가 **같은 객체**를 가리킴 |\n\n- **객체 수는 `new`가 실행된 횟수**로 셉니다(문자열 리터럴, 오토박싱, 배열 초기화도 객체를 만듭니다). 참조 변수가 몇 개인지와 무관합니다.\n- 필드는 `참조.필드`로 읽고 씁니다. 참조가 `null`이면 실행 시 `NullPointerException`이 납니다.\n- **Java는 항상 값에 의한 전달(pass-by-value)**입니다. 참조형 인자는 참조값이 복사됩니다.\n  - 메서드 안에서 그 참조로 객체 내부를 바꾸면 호출한 쪽에서도 보입니다.\n  - 매개변수에 새 객체를 대입해도 호출한 쪽 변수는 바뀌지 않습니다.\n  - 기본형 인자를 바꿔도 호출한 쪽은 그대로입니다.\n\n```java\nchar var1 = 'a';\nchar var2 = var1;\nvar2 = 'e';                      // var1은 'a' 그대로\nVowel obj1 = new Vowel();        // 객체 1개\nVowel obj2 = obj1;               // 같은 객체\nobj1.var = 'i';\nobj2.var = 'o';                  // 같은 객체의 필드를 덮어씀\nSystem.out.println(var1 + \", \" + var2);       // a, e\nSystem.out.print(obj1.var + \", \" + obj2.var); // o, o\n```\n\n```java\nstatic void change(MarkList m, int n) {\n    m.num += 10;          // 호출자의 객체가 바뀜\n    n += 10;              // 복사본만 바뀜\n    m = new MarkList();   // 매개변수만 새 객체를 가리킴\n    m.num = 99;\n}\n// MarkList a = new MarkList(); a.num = 60; int k = 1;\n// change(a, k);\n// System.out.println(a.num + \" \" + k);   // 70 1\n// MarkList z = null; z.num;  → NullPointerException\n```", "pitfalls": ["참조 변수가 여러 개 나와도 `new`가 한 번이면 인스턴스는 1개입니다. `null`로 선언한 변수는 객체를 만들지 않습니다.", "두 참조가 같은 객체를 가리키면 서로 다른 값을 대입해도 마지막 대입만 남습니다.", "메서드 안에서 매개변수에 새 객체를 대입하는 것은 호출한 쪽에 영향이 없습니다."], "qs": [20, 21]}, {"title": "객체 수명과 가비지 컬렉션", "body": "객체의 수명: `new`로 생성 → 참조로 사용 → **어떤 살아 있는 참조로도 도달할 수 없게 됨(GC 대상, eligible)** → 언젠가 수거.\n\n객체가 GC 대상이 되는 경우:\n- 그 객체를 가리키던 마지막 변수에 `null` 대입\n- 그 변수에 **다른 객체를 재대입**(dereference by reassignment)\n- 그 객체를 가리키던 지역 변수의 메서드가 끝남\n- 서로만 참조하는 객체 묶음이 외부에서 도달 불가(island of isolation)\n\n시험 포인트:\n- eligible은 '수거될 자격'일 뿐 **언제 수거되는지는 보장되지 않습니다**.\n- `System.gc()`는 요청일 뿐 실행을 보장하지 않습니다.\n- `null` 대입은 변수의 화살표를 지울 뿐입니다. 다른 변수가 같은 객체를 가리키면 그 객체는 살아 있습니다.\n- String 리터럴은 상수 풀에 있어 GC 개수 문제에서 보통 제외합니다.\n\n**풀이법**: 줄마다 '변수 → 객체' 표를 갱신하고, 어떤 변수도 가리키지 않는 객체를 셉니다.\n\n```java\nStudent s1 = new Student();   // O1\nStudent s2 = new Student();   // O2\nStudent s3 = new Student();   // O3\ns1 = s3;\ns3 = s2;\ns2 = null;\n```\n\n| 실행 후 | s1 | s2 | s3 | 참조 없는 객체 |\n|---|---|---|---|---|\n| 객체 3개 생성 | O1 | O2 | O3 | 없음 |\n| `s1 = s3` | O3 | O2 | O3 | O1 |\n| `s3 = s2` | O3 | O2 | O2 | O1 |\n| `s2 = null` | O3 | null | O2 | O1 |\n\n`s2 = null` 시점에 O2는 이미 `s3`가 가리키고 있으므로 살아 있습니다. GC 대상은 **O1 하나**입니다.", "pitfalls": ["`x = null`을 보자마자 그 객체를 GC 대상으로 세지 마십시오. 앞 줄에서 참조가 다른 변수로 복사되었는지 확인합니다.", "재대입(`s1 = s3`)만으로도 이전 객체가 GC 대상이 됩니다.", "'GC 대상이 된 객체는 즉시 수거된다', '`System.gc()`가 수거를 보장한다'는 거짓입니다."], "qs": [20, 24]}, {"title": "래퍼 클래스와 오토박싱", "body": "| 기본형 | 래퍼 | | 기본형 | 래퍼 |\n|---|---|---|---|---|\n| `byte` | `Byte` | | `float` | `Float` |\n| `short` | `Short` | | `double` | `Double` |\n| `int` | `Integer` | | `char` | `Character` |\n| `long` | `Long` | | `boolean` | `Boolean` |\n\n**대입에서의 박싱 규칙**\n- 박싱은 **자기 래퍼로만** 됩니다. 확대 후 박싱(int → long → Long)은 없습니다.\n- 예외: 범위 안의 **int 상수**는 `Byte`/`Short`/`Character`에 대입할 수 있습니다.\n- 박싱 후 상위 타입으로는 됩니다: `Object o = 5;`, `Number n = 5;`\n- 래퍼끼리는 상속 관계가 없습니다. `Integer`는 `Long`이 아닙니다.\n\n**연산**: 래퍼는 언박싱된 뒤 숫자 승격을 따릅니다. `null`인 래퍼를 언박싱하면 `NullPointerException`입니다.\n\n**캐스트**: 기본형끼리(boolean 제외), 상속 관계의 참조형끼리, 박싱·언박싱으로 연결되는 경우만 됩니다. 숫자 ↔ String 변환은 캐스트가 아니라 `String.valueOf`, `Integer.parseInt` 같은 메서드로 합니다.\n\n```java\nShort s1 = 200;                 // ✓ 범위 안 int 상수 → Short\nInteger s2 = 400;               // ✓\nLong s3 = (long) s1 + s2;       // ✓ Short→long, long + int = long → Long (600)\nObject o = 5;                   // ✓ Integer로 박싱\nLong l2 = 5L; Double d2 = 1.0; Float f2 = 100.0F;   // ✓\nString s5 = String.valueOf(s3 * s2);                // ✓ \"240000\"\n```\n\n```java\nLong l = 5;                        // ✗ int → Long 불가\nDouble d = 1;                      // ✗ int → Double 불가\nFloat f = 100.0;                   // ✗ double → Float 불가\nByte b = 200;                      // ✗ byte 범위 밖\nLong x = s2;                       // ✗ Integer는 Long이 아님\nString s4 = (String) (s3 * s2);    // ✗ long을 String으로 캐스트 불가\nInteger i = (Integer) \"1\";         // ✗\n```\n\n**`==` 비교 주의**: 래퍼의 `==`는 참조 비교입니다. -128~127은 캐시된 같은 객체라 `Integer a = 127, b = 127; a == b`는 true지만, `1000`끼리는 실행해 보면 false입니다. 값 비교는 `equals`를 씁니다. 단, `Long.valueOf(1).equals(1)`은 인자가 `Integer`라 false입니다.", "pitfalls": ["`Long l = 5;`, `Double d = 1;`, `Float f = 100.0;`은 모두 컴파일 에러입니다. 리터럴 타입이 래퍼와 정확히 맞아야 합니다.", "숫자 연산 결과를 `(String)`으로 캐스트하는 것은 런타임 ClassCastException이 아니라 컴파일 에러입니다.", "`(long) shortWrapper`처럼 래퍼에 기본형 캐스트를 붙이는 것은 합법입니다(언박싱 후 확대).", "null 래퍼를 기본형에 대입하거나 연산에 쓰면 NullPointerException입니다."], "qs": [25, 26]}, {"title": "문자열 → 값 변환: parseXxx, valueOf, Boolean 규칙", "body": "| 메서드 | 반환 | 잘못된 문자열일 때 |\n|---|---|---|\n| `Integer.parseInt(s)` | `int` | `NumberFormatException` |\n| `Integer.valueOf(s)` | `Integer` | `NumberFormatException` |\n| `Double.parseDouble(s)` | `double` | `NumberFormatException` |\n| `Boolean.parseBoolean(s)` | `boolean` | 예외 없음, `false` |\n| `Boolean.valueOf(String s)` | `Boolean` | 예외 없음, `false` |\n| `new Boolean(String s)` | `Boolean` | 예외 없음, `false` |\n\n**숫자 변환**: `Integer.parseInt`는 10진 정수 문자열만 받습니다. 앞의 `+`/`-` 부호는 허용됩니다. 공백, 소수점, 숫자 아닌 문자, 빈 문자열, `null`, int 범위 초과는 모두 `NumberFormatException`(RuntimeException)입니다.\n\n**Boolean 변환**: s가 `null`이 아니고 **대소문자 무시로 `\"true\"`**일 때만 true, 그 밖은 모두 false입니다. `\"1\"`, `\"yes\"`, `\"null\"`, `null`도 false이고 예외가 없습니다.\n\n**Boolean 생성자**는 `Boolean(boolean)`과 `Boolean(String)` 둘입니다.\n- `new Boolean(null)`: `null`은 기본형에 들어갈 수 없으므로 `Boolean(String)`이 선택되어 false입니다.\n- `new Boolean(Boolean.valueOf(...))`: Boolean이 언박싱되어 `Boolean(boolean)`이 호출됩니다.\n- 명령줄 인자 `null`은 null 참조가 아니라 문자열 `\"null\"`입니다.\n- 래퍼 생성자는 Java 9부터 deprecated지만 Java 8 시험에서는 정상 코드입니다.\n\n```java\npublic class Test {\n    public static void main(String[] args) {\n        boolean a = new Boolean(Boolean.valueOf(args[0]));\n        boolean b = new Boolean(args[1]);\n        System.out.println(a + \" \" + b);\n    }\n}\n// java Test 1 null     →  false false\n// java Test TRUE null  →  true false\n```\n\n```java\nBoolean[] bool = new Boolean[2];\nbool[0] = new Boolean(Boolean.parseBoolean(\"true\"));\nbool[1] = new Boolean(null);\nSystem.out.println(bool[0] + \" \" + bool[1]);   // true false\nBoolean.parseBoolean(\"TrUe\");   // true\nBoolean.parseBoolean(\"yes\");    // false\nInteger.parseInt(\"+12\");        // 12\nInteger.parseInt(\"1.0\");        // NumberFormatException\nInteger.parseInt(\" 12\");        // NumberFormatException\nInteger.parseInt(null);         // NumberFormatException\nBoolean bw = null;\nif (bw) { }                     // NullPointerException (언박싱)\n```", "pitfalls": ["`\"1\"`은 Boolean으로 true가 아닙니다. `\"TRUE\"`, `\"TrUe\"`는 true입니다.", "`new Boolean(null)`은 NPE도 모호성 에러도 아닌 false입니다.", "Boolean 변환은 예외를 던지지 않지만 `Integer.parseInt`는 `null`과 잘못된 문자열에 NumberFormatException을 던집니다.", "변환 메서드는 예외를 던지지 않아도, null인 `Boolean`을 조건에 쓰면 언박싱에서 NullPointerException이 납니다."], "qs": [15, 18, 19, 23]}]}, {"topic": "operators", "name": "연산자와 조건문", "en": "Operators and Decision Constructs", "intro": "연산자 우선순위와 결합, 증감·대입·문자열 연결, 관계·논리 연산과 단락 평가, `==`와 `equals()`, if/else, 삼항 연산자, switch를 다룹니다. 점수는 후위 증감의 평가 시점, 문자열 뒤 `+`의 연결, 중첩 삼항의 결합 방향, switch 허용 타입과 fall-through를 추적하지 못할 때 잃습니다.", "sections": [{"title": "연산자 우선순위와 산술 연산", "body": "| 순위 | 연산자 | 결합 |\n|---|---|---|\n| 1 | 후위 `x++` `x--` | |\n| 2 | 전위 `++x` `--x`, 단항 `+` `-` `!` `~`, 캐스트 `(타입)` | 오른쪽 |\n| 3 | `*` `/` `%` | 왼쪽 |\n| 4 | `+` `-` | 왼쪽 |\n| 5 | `<<` `>>` `>>>` | 왼쪽 |\n| 6 | `<` `>` `<=` `>=` `instanceof` | 왼쪽 |\n| 7 | `==` `!=` | 왼쪽 |\n\n그 아래는 높은 순서대로 `&` → `^` → `|` → `&&` → `||` → `? :`(오른쪽 결합) → `=` `+=` `-=` 등 대입(오른쪽 결합, 가장 낮음)입니다.\n\n- 우선순위는 **어떻게 묶는지**만 정합니다. 피연산자는 항상 **왼쪽에서 오른쪽으로 평가**됩니다.\n- 괄호는 묶음을 바꿉니다. 값 하나만 감싼 괄호 `(1)`은 아무것도 바꾸지 않습니다.\n\n**정수 산술**\n- `int / int`는 몫만 남기고 0 쪽으로 버립니다: `7 / 2` → 3, `-7 / 2` → -3.\n- `%`의 부호는 왼쪽 피연산자를 따릅니다: `-7 % 3` → -1, `7 % -3` → 1.\n- 정수를 0으로 나누거나 나머지를 구하면 `ArithmeticException`, 실수는 예외 없이 `Infinity`/`NaN`입니다.\n- 정수 오버플로는 예외 없이 값이 돌아갑니다.\n\n```java\nint a = 2 + 3 * 4;           // 14\nint b = (2 + 3) * 4;         // 20\nint c = 10 - 4 - 3;          // 3   (10-4)-3\nint d = 7 % 3 * 2;           // 2   (7%3)*2\nint x, y, z;\nx = y = z = 5;               // x = (y = (z = 5))\nboolean t = 1 + 2 == 3 && 4 > 3;      // true (산술 → 관계 → 논리)\nSystem.out.println(7 / 2.0);          // 3.5\nSystem.out.println(5.0 / 0);          // Infinity\nSystem.out.println(0.0 / 0);          // NaN\nSystem.out.println(Integer.MAX_VALUE + 1);   // -2147483648\nint zero = 0;\nSystem.out.println(5 / zero);         // ArithmeticException\n```", "pitfalls": ["`*`, `/`, `%`는 같은 순위라 왼쪽부터 계산합니다. `7 % 3 * 2`는 2입니다.", "정수끼리의 나눗셈은 몫만 남습니다. `i / 5`에서 소수점 결과를 기대하지 마십시오.", "정수 0 나눗셈은 실행 시 ArithmeticException, 실수 0 나눗셈은 Infinity입니다."], "qs": [29, 36, 39]}, {"title": "증감 연산자 ++ / --", "body": "| 형태 | 식의 값 | 변수 |\n|---|---|---|\n| `x++` (후위) | 증가 **전** 값 | 식 평가 직후 1 증가 |\n| `++x` (전위) | 증가 **후** 값 | 먼저 1 증가 |\n\n- 어느 형태든 그 피연산자가 평가된 **직후** 변수는 이미 바뀌어 있습니다. 같은 문장의 오른쪽 부분, 다음 문장, 출력문에서는 바뀐 값이 보입니다.\n- 조건 결과가 false여도 이미 평가된 증감은 되돌아가지 않습니다.\n- 단독 문장(`x++;`)에서는 전위와 후위의 차이가 없습니다.\n- `x = x++;`는 x를 바꾸지 않습니다. 이전 값이 다시 대입되기 때문입니다.\n- 증감은 원래 타입을 유지합니다. `byte`가 127에서 `++`되면 -128이 됩니다.\n- 변수에만 쓸 수 있습니다. 리터럴, 식, final 변수에는 쓸 수 없습니다.\n\n```java\nint a = 9;\nboolean b = a++ < 10;   // 9 < 10 → true, 이후 a = 10\nint c = 9;\nboolean d = ++c < 10;   // 10 < 10 → false, c = 10\nint x = 1, y = 0;\nboolean r = x++ > ++y;  // 1 > 1 → false, x = 2, y = 1\nint i = 1;\nint s = i++ + ++i;      // 1 + 3 = 4, i = 3\nint k = 5;\nk = k++;                // k = 5\n```\n\n```java\nint z = 5++;            // ✗ 리터럴\nint w = (a + 1)++;      // ✗ 식\nfinal int f = 1; f++;   // ✗ final\n```\n\n**추적 표**를 그리면 실수가 줄어듭니다.\n\n| 문장 | 식에 쓰인 값 | 문장 후 x |\n|---|---|---|\n| `int x = 100;` | | 100 |\n| `int a = x++;` | a = 100 | 101 |\n| `int b = ++x;` | b = 102 | 102 |\n| `int c = x++;` | c = 102 | 103 |\n\n```java\nif (aVar++ < 10) System.out.println(aVar + \" Hello World!\");   // aVar가 9이면\nelse System.out.println(aVar + \" Hello Universe!\");            // → 10 Hello World!\n```", "pitfalls": ["`aVar++ < 10`은 9로 비교하지만, 본문의 출력은 이미 증가한 10입니다. 비교 시점과 출력 시점의 값이 다릅니다.", "조건이 false라 else로 가도 조건 안의 `x++`, `++y`는 이미 적용되었습니다.", "`x = x++;` 뒤에 x는 그대로입니다."], "qs": [34, 37, 39, 40]}, {"title": "대입과 복합 대입 연산자", "body": "**대입은 식입니다.** `=`, `+=` 등의 값은 대입이 끝난 뒤 왼쪽 변수의 값입니다.\n- 오른쪽 결합이라 `a = b = c = 5`는 `a = (b = (c = 5))`입니다.\n- 대입 결과를 다른 계산에 바로 쓸 수 있습니다: `(j += i) / 5`.\n- `if (x = 5)`는 int라 컴파일 에러지만, boolean이면 `if (flag = true)`가 컴파일되고 **항상 true**입니다.\n\n**복합 대입 `x op= y`는 `x = (x의 타입)(x op (y))`**입니다.\n- 오른쪽 **전체**가 먼저 계산됩니다: `j *= 2 + 3`은 `j = j * (2 + 3)`.\n- 결과가 왼쪽 타입으로 **자동 캐스트**됩니다. 그래서 `short s; s += 1;`은 되지만 `s = s + 1;`은 에러입니다.\n- 대입 연산자는 우선순위가 가장 낮아서, `k = j += i / 5`는 `k = (j += (i / 5))`입니다.\n\n```java\nint i = 10, j = 20;\nint k = (j += i) / 5;        // j = 30, k = 30 / 5 = 6\nSystem.out.println(i + \" : \" + j + \" : \" + k);   // 10 : 30 : 6\ni = 10; j = 20;\nk = j += i / 5;              // j = 20 + 2 = 22, k = 22\nSystem.out.println(i + \" : \" + j + \" : \" + k);   // 10 : 22 : 22\nint m = 20;\nm *= 2 + 3;                  // 100\nshort s = 1;\ns += 1;                      // ✓ 묵시적 캐스트\ns += 100000;                 // ✓ 컴파일됨 (값은 잘림)\nboolean flag = false;\nif (flag = true) System.out.println(\"always\");   // ✓ 항상 실행\n```\n\n```java\ns = s + 1;                   // ✗ int를 short에 대입\nint x = 0;\nif (x = 5) { }               // ✗ int는 boolean이 아님\n```\n\n`String`에도 `+=`가 됩니다(연결 후 새 String 대입). switch 안의 `wd -= 1`, `wd += 2` 같은 누적도 같은 규칙입니다.", "pitfalls": ["괄호 안의 `(j += i)`도 j를 실제로 바꿉니다. 출력에서 j를 원래 값으로 적지 마십시오.", "`j += i / 5`는 `(j + i) / 5`가 아니라 `j + (i / 5)`입니다.", "`k = j += ...`에서 k에는 대입이 끝난 뒤의 j 값이 들어갑니다.", "`if (flag = true)`는 비교가 아니라 대입이라 컴파일되고 항상 참입니다."], "qs": [29, 36, 38]}, {"title": "+ 연산자와 문자열 연결", "body": "`+`는 **왼쪽에서 오른쪽**으로 결합합니다. 각 `+`마다 판단합니다.\n1. 두 피연산자 중 하나라도 `String`이면 → 문자열 연결, 결과는 String\n2. 둘 다 숫자형(`char` 포함)이면 → 산술 덧셈\n3. 그 결과가 다음 `+`의 왼쪽 피연산자가 됩니다.\n\n**풀이 순서 예**: `1 + 2 + \"A\" + 1 + 2`\n1. `1 + 2` → 숫자끼리 덧셈 → `3`\n2. `3 + \"A\"` → String이 있으므로 연결 → `\"3A\"`\n3. `\"3A\" + 1` → `\"3A1\"`, 4. `\"3A1\" + 2` → `\"3A12\"`\n\n따라서 문자열이 한 번 등장한 **뒤의** `+`는 모두 연결입니다. 괄호로 묶은 부분만 먼저 계산됩니다. 값 하나를 감싼 괄호 `(1)`은 덧셈을 앞당기지 않습니다.\n\n```java\nSystem.out.println(\"Result A \" + 0 + 1);      // Result A 01\nSystem.out.println(\"Result B \" + (1) + (2));  // Result B 12\nSystem.out.println(\"5 + 2 = \" + 3 + 4);       // 5 + 2 = 34\nSystem.out.println(\"5 + 2 = \" + (3 + 4));     // 5 + 2 = 7\nSystem.out.println(1 + 2 + \"A\" + 1 + 2);      // 3A12\nSystem.out.println('a' + 'b' + \"\");           // 195 (char + char = int)\nSystem.out.println(\"\" + 'a' + 'b');           // ab\nSystem.out.println('a' + 1 + \"B\");            // 98B\nString sn = null;\nSystem.out.println(\"x\" + sn);                 // xnull\nString t = \"A\"; t += 1; t += 'c'; t += 2.0;\nSystem.out.println(t);                        // A1c2.0\n```\n\n```java\nString s = \"A\" - 1;          // ✗ String에 - 불가\nString u = \"A\" + 3 - 1;      // ✗ (\"A3\") - 1\n```\n\n- 문자열 리터럴 안의 `\"5 + 2\"`는 계산되지 않는 글자입니다.\n- `null` 참조를 연결하면 `\"null\"`이 붙습니다(예외 아님).\n- `-`, `*`, `/`에는 연결 의미가 없습니다. `*`, `/`는 `+`보다 먼저 계산되므로 `\"A\" + 2 * 3`은 `\"A6\"`입니다.\n- `char`는 String을 만나기 전까지 코드값(int)으로 더해집니다.", "pitfalls": ["문자열 뒤의 `+ 3 + 4`는 7이 아니라 `34`입니다. 덧셈을 원하면 `(3 + 4)`처럼 묶어야 합니다.", "`(1) + (2)`의 괄호는 값 하나만 감싸므로 덧셈을 앞당기지 않습니다.", "문자열 앞에 놓인 숫자·char끼리는 먼저 더해집니다. `'a' + 'b' + \"\"`는 `195`입니다."], "qs": [31, 32]}, {"title": "관계·논리 연산자와 단락 평가", "body": "**관계 연산자** `< > <= >= == !=`는 boolean을 반환합니다.\n- 숫자끼리는 승격 후 값으로 비교합니다: `5 == 5.0` → true, `'a' == 97` → true.\n- `boolean`에는 `==`, `!=`만 쓸 수 있습니다. `true > false`는 에러입니다.\n\n**boolean과 숫자는 호환되지 않습니다.** C와 달리 `if (1)`, `boolean b = 1;`, `(int) true`는 모두 컴파일 에러입니다. `if`, `while`, `?:`의 조건에는 반드시 boolean 식이 와야 합니다.\n\n**논리 연산자**\n\n- `&&`(AND): 왼쪽이 false면 오른쪽을 **평가하지 않음**\n- `||`(OR): 왼쪽이 true면 오른쪽을 **평가하지 않음**\n- `&`, `|`(boolean AND/OR), `^`(XOR): 양쪽을 **항상 평가**\n- `!`(NOT): boolean에만 사용\n\n단락 평가로 오른쪽이 생략되면 그 안의 `++`, 메서드 호출도 **실행되지 않습니다**. 반대로 `>` 하나로 된 비교처럼 단락이 없는 식은 양쪽을 모두 평가합니다.\n\n```java\nint x = 0;\nif (false && x++ > 0) { }   // 오른쪽 생략, x = 0\nif (true || x++ > 0) { }    // 오른쪽 생략, x = 0\nif (false & x++ > 0) { }    // 양쪽 평가, x = 1\nif (true | x++ > 0) { }     // 양쪽 평가, x = 2\nSystem.out.println(x);      // 2\nint y = 5;\nboolean r = y > 3 || ++y > 0;\nSystem.out.println(r + \" \" + y);   // true 5\nSystem.out.println(true ^ true);   // false\n```\n\n```java\nint n = 1;\nif (n) { }                  // ✗ int는 조건이 될 수 없음\nboolean b = 1;              // ✗\nboolean c = !n;             // ✗ !는 boolean에만\nint d = n && 1;             // ✗ &&는 boolean에만\n```", "pitfalls": ["`&&`/`||`의 오른쪽에 있는 증감은 단락되면 일어나지 않습니다. 변수 값을 추적할 때 확인합니다.", "`&`, `|`는 boolean에서도 양쪽을 모두 평가합니다.", "정수를 조건으로 쓰는 C 습관(`if (1)`, `while (x)`)은 컴파일 에러입니다."], "qs": [37, 40, 43]}, {"title": "== 와 equals(): 문자열과 객체 비교", "body": "| 비교 | 의미 |\n|---|---|\n| `==` (참조형) | 두 참조가 **같은 객체**인지 |\n| `equals()` | 클래스가 정의한 **내용** 비교. String은 대소문자까지 정확히 |\n| `equalsIgnoreCase()` | String 내용을 대소문자 무시로 비교 |\n| `compareTo()` | 사전 순서를 int로, 같으면 0 |\n\n**String 상수 풀**\n- 같은 내용의 문자열 리터럴은 풀의 **같은 객체**를 공유합니다.\n- 리터럴끼리의 연결이나 final 상수 변수와의 연결은 **컴파일 타임 상수**라 풀의 객체가 됩니다.\n- 일반 변수가 낀 연결, `new String(...)`은 실행 중 **새 객체**를 만듭니다.\n- `intern()`은 풀의 객체를 반환합니다.\n\n**기타 규칙**\n- `Object.equals()`의 기본 동작은 `==`와 같습니다. `StringBuilder`는 equals를 재정의하지 않아 내용이 같아도 false입니다.\n- String은 불변입니다. `s.toLowerCase();`만 호출하고 반환값을 받지 않으면 s는 그대로입니다.\n- 참조 복사(`String s4 = s2;`)는 새 객체를 만들지 않습니다.\n- 상속 관계가 없는 두 타입을 `==`로 비교하면 컴파일 에러입니다.\n\n```java\nString s1 = \"Java\";\nString s2 = new String(\"java\");\nString s3 = \"Java\";\nSystem.out.println(s1 == s3);                 // true  (같은 리터럴)\nSystem.out.println(s1 == \"Ja\" + \"va\");        // true  (컴파일 타임 상수)\nString part = \"Ja\";\nSystem.out.println(s1 == part + \"va\");        // false (실행 중 새 객체)\nSystem.out.println(s1.equals(s2));            // false (대소문자 다름)\nSystem.out.println(s1.equalsIgnoreCase(s2));  // true\nSystem.out.println(s1 == new String(\"Java\")); // false\nSystem.out.println(s1 == new String(\"Java\").intern());  // true\ns1.toLowerCase();\nSystem.out.println(s1);                       // Java\nStringBuilder b1 = new StringBuilder(\"A\"), b2 = new StringBuilder(\"A\");\nSystem.out.println(b1.equals(b2));            // false\nSystem.out.println(b1.toString().equals(b2.toString()));  // true\n```\n\n```java\nSystem.out.println(s1 == b1);   // ✗ incomparable types: String and StringBuilder\nInteger i = 1; String n = \"1\";\nSystem.out.println(i == n);     // ✗ incomparable types\n```", "pitfalls": ["`String str3 = str2;`처럼 참조를 복사해도 `str1`과 같은 객체가 되지는 않습니다.", "\"Java\"와 \"java\"는 `equals()`로도 다릅니다. 대소문자 무시는 `equalsIgnoreCase()`뿐입니다.", "`StringBuilder`의 `equals()`는 내용 비교가 아닙니다.", "`toLowerCase()`의 반환값을 버리면 원본은 바뀌지 않습니다."], "qs": [42]}, {"title": "if / else if / else", "body": "- 조건은 반드시 **boolean** 식입니다.\n- `else if` 사슬은 **처음으로 참인 분기 하나만** 실행합니다. 따라서 범위 조건은 **좁은 범위(더 구체적인 조건)부터** 검사해야 합니다.\n- 독립된 `if` 문 여러 개는 **모두 검사**되므로 뒤의 대입이 앞의 결과를 덮어쓸 수 있습니다.\n- 중괄호가 없으면 바로 다음 문장 하나만 본문입니다.\n- `else`는 들여쓰기와 무관하게 **가장 가까운, 짝 없는 if**에 붙습니다(dangling else).\n- `if (조건);`처럼 세미콜론을 붙이면 빈 문장이 본문이 되고, 뒤의 블록은 항상 실행됩니다.\n\n```java\n// 요구: qty >= 90 → 0.5, 80 < qty < 90 → 0.2\nif (qty >= 90) discount = 0.5;          // ✓ 넓은 조건을 뒤에\nelse if (qty > 80) discount = 0.2;\n\nif (qty > 80) discount = 0.2;           // ✗ 순서가 뒤바뀜: 95도 0.2\nelse if (qty >= 90) discount = 0.5;\n\nif (qty >= 90) discount = 0.5;          // ✗ 독립된 if 두 개: 95가 0.5 → 0.2로 덮임\nif (qty > 80) discount = 0.2;\n```\n\n| qty | 첫 번째 | 두 번째 | 세 번째 |\n|---|---|---|---|\n| 95 | 0.5 | 0.2 | 0.2 |\n| 85 | 0.2 | 0.2 | 0.2 |\n\n```java\nint n = 5;\nif (n > 10)\n    if (n > 20) System.out.println(\"A\");\nelse System.out.println(\"B\");   // 안쪽 if에 붙음 → 아무것도 출력 안 됨\n```\n\n```java\nint x = 0;\nif (x > 5); { System.out.println(\"run\"); }   // run (세미콜론이 본문)\nif (x > 0) System.out.println(1); System.out.println(2); else System.out.println(3);  // ✗ 'else' without 'if'\n```\n\n조건에 증감이나 메서드 호출이 섞이면 먼저 조건의 값을 구하고, 그다음 변수의 새 값을 적용해 본문을 추적합니다(예: `args[0].equals(\"Hello\") ? false : true`는 인자가 Hello일 때 false → else 분기).", "pitfalls": ["범위를 검사하는 else-if 사슬에서 넓은 조건이 앞에 오면 뒤 분기는 절대 실행되지 않습니다. 경계값(80, 89, 90, 95)을 넣어 확인합니다.", "else로 이어지지 않은 if 두 개는 둘 다 실행되어 앞 결과를 덮어씁니다.", "들여쓰기에 속지 마십시오. else는 가장 가까운 if에 붙습니다."], "qs": [33, 34, 41, 43]}, {"title": "조건(삼항) 연산자 ? :", "body": "`조건 ? 값1 : 값2`는 조건이 true면 값1, false면 값2를 내는 **식**입니다.\n- 조건은 boolean이어야 합니다.\n- **선택되지 않은 쪽은 평가되지 않습니다**(그 안의 증감도 일어나지 않음).\n- 식이므로 대입, return, 인자, `if` 조건 안에 씁니다. **단독 문장으로 쓰면 `not a statement`** 에러입니다.\n- 두 값의 타입이 호환되어야 합니다. 숫자형이면 승격된 타입이 결과입니다(`true ? 1 : 2.0` → 1.0).\n\n**중첩과 결합 방향**: 오른쪽 결합입니다. `a ? b : c ? d : e`는 `a ? b : (c ? d : e)`, 즉 if / else if / else와 같습니다. 가운데 자리(`?`와 `:` 사이)에도 조건식이 올 수 있으므로, `?`마다 짝이 되는 `:`를 안쪽부터 맞춰 괄호를 쳐 봅니다.\n\n**대입과의 우선순위**: 대입이 더 낮으므로 마지막 피연산자에 대입식을 넣으려면 괄호가 필요합니다. 가운데 자리에는 괄호 없이 넣을 수 있습니다.\n\n```java\nString stuff = \"TV\";\nString res = stuff.equals(\"TV\") ? \"Walter\"\n           : stuff.equals(\"Movie\") ? \"White\" : \"No Result\";    // ✓ Walter\nint q = 85;\ndouble disc = q >= 90 ? 0.5 : q > 80 ? 0.2 : 0;               // ✓ 0.2\nint x = 100, a = 100, b = 102, c = 102;\nint d = (a < b) ? (a < c) ? a : (b < c) ? b : c : x;         // ✓ 100\n// 해석: a < b ? (a < c ? a : (b < c ? b : c)) : x\nint n = 0;\nint v = true ? n++ : n--;                                     // v = 0, n = 1\nObject o = true ? 1 : \"a\";                                    // ✓ 1\n```\n\n```java\nstuff.equals(\"TV\") ? \"Walter\" : \"White\";   // ✗ not a statement\nint r = true ? 1 : \"a\";                    // ✗ 결과 타입 불일치\nint r2 = true ? 1 : 2.0;                   // ✗ 결과가 double\nboolean f = true; int p, s;\nf ? p = 1 : s = 2;                         // ✗ 마지막 자리에 괄호 없는 대입\nint m = 1;\nint r3 = m ? 1 : 2;                        // ✗ 조건이 int\n```", "pitfalls": ["괄호가 부족해 보이는 중첩 삼항도 오른쪽 결합 규칙으로 해석되어 컴파일됩니다.", "if-else if-else를 삼항으로 바꿀 때는 두 번째 조건이 **세 번째 피연산자 자리**에 들어가야 합니다. 위치가 다르면 컴파일돼도 결과가 다릅니다.", "삼항식을 대입 없이 문장으로 쓰면 컴파일 에러입니다.", "`조건 ? false : true`는 조건을 뒤집습니다."], "qs": [30, 33, 39, 41]}, {"title": "switch 문", "body": "**switch 식에 허용되는 타입 (Java 8)**: `byte`, `short`, `char`, `int`, 그 래퍼 `Byte`, `Short`, `Character`, `Integer`, `String`(Java 7+), enum.\n`long`, `float`, `double`, `boolean`과 그 래퍼는 **불가**입니다.\n\n**case 라벨 규칙**\n- **컴파일 타임 상수**여야 합니다. 리터럴, 또는 선언과 동시에 상수로 초기화한 `final` 변수.\n- 중복되면 에러이고, `default`도 하나만 됩니다.\n- switch 식의 타입에 대입할 수 있어야 합니다(`byte` switch에 `case 200:` ✗, String switch에 `case 1:` ✗).\n- enum은 `case RED:`처럼 상수 이름만 씁니다(`case Color.RED:` ✗).\n\n**실행 흐름**\n- 일치하는 case로 점프한 뒤 `break`(또는 return, throw, switch 끝)를 만날 때까지 **아래로 계속 실행**합니다(fall-through).\n- `break`, `default`는 **선택 사항**이고, `default`는 어느 위치에 있어도 됩니다. 일치하는 case가 없을 때 진입점이 됩니다.\n- `case \"sat\": case \"sun\":`처럼 연달아 쓰면 같은 코드를 공유합니다.\n- String switch는 `equals()`로 비교하므로 대소문자를 구분합니다.\n- switch 식이 `null`인 String이나 래퍼면 `NullPointerException`입니다.\n\n```java\nint x = 5;\nswitch (x) {\n    default: System.out.print(\"D\");\n    case 1:  System.out.print(\"1\");\n}                                     // D1\n// n=1 → \"12\", n=2 → \"2\", n=3 → \"D\"\nswitch (n) {\n    case 1: System.out.print(\"1\");\n    case 2: System.out.print(\"2\"); break;\n    default: System.out.print(\"D\");\n}\n```\n\n```java\nint wd = 0;\nfor (String s : new String[]{\"sun\", \"mon\", \"wed\", \"sat\"}) {\n    switch (s) {\n        case \"sat\":\n        case \"sun\": wd -= 1; break;\n        case \"mon\": wd++;           // break 없음 → 아래로\n        case \"wed\": wd += 2;\n    }\n}\nSystem.out.println(wd);   // sun -1, mon +3, wed +2, sat -1 → 3\n```\n\n```java\nfinal int K = 3;  switch (m) { case K: }        // ✓\nByte bx = 1; short sx = 1; Integer ix = 1;      // ✓ 모두 switch (x) { case 1: } 가능\nfinal int J; J = 4;  switch (n) { case J: }     // ✗ constant expression required\nbyte bt = 1;  switch (bt) { case 200: }         // ✗ byte 범위 밖\nlong lg = 1;  switch (lg) { case 1: }           // ✗ long 불가\nboolean opt = true;  switch (opt) { case true: } // ✗ boolean 불가\nString sx2 = \"1\";  switch (sx2) { case 1: }     // ✗ 타입 불일치\nswitch (n) { case 1: case 1: }                  // ✗ duplicate case label\nLong lx = 1;                                    // ✗ (대입부터 불가)\n```", "pitfalls": ["'default가 필수', 'break가 필수'는 거짓입니다. 둘 다 선택이며 break가 없으면 fall-through됩니다.", "default가 맨 위에 있고 break가 없으면 그 아래 case까지 이어서 실행됩니다.", "boolean·long·double switch는 컴파일 에러입니다. break나 default를 고치는 보기는 원래 코드가 컴파일된다는 착각을 노립니다.", "String switch가 허용된다고 해서 `case 1:` 같은 int 라벨과 섞을 수는 없습니다."], "qs": [27, 28, 35, 38, 43]}]}, {"topic": "arrays", "name": "배열", "en": "Creating and Using Arrays", "intro": "1차원·다차원 배열의 선언, 생성, 초기화, 사용을 다룹니다. 문법 자체(선언부의 크기, `{}` 단독 대입)보다 참조 대입, 원소 기본값 null, 0부터 시작하는 인덱스, 비정형 2차원 배열의 행 길이를 놓쳐서 점수를 잃는 경우가 많습니다.", "sections": [{"title": "배열 선언 문법", "body": "배열 변수 선언에는 **크기를 쓰지 않습니다**. 크기는 `new`로 생성할 때만 지정합니다.\n\n- `[]`는 타입 뒤에 써도 되고 변수명 뒤에 써도 됩니다. 사이에 공백이 있어도 됩니다.\n- 한 줄에 여러 변수를 선언할 때, 타입 뒤의 `[]`는 **모든 변수**에, 변수명 뒤의 `[]`는 **그 변수에만** 적용됩니다.\n- 두 위치를 섞으면 차원이 더해집니다(`int[] e[]`는 `int[][]`).\n\n```java\nint[] a;          // ✓\nint b[];          // ✓\nint [] c;         // ✓\nint d [ ];        // ✓ 공백 허용\nint[] e[];        // ✓ int[][]와 같음\nint[3] j;         // ✗ 선언부에 크기를 쓸 수 없음\nint k[3];         // ✗ C 언어식 크기 지정 불가\n```\n\n| 선언 | 각 변수의 타입 |\n|---|---|\n| `int[] x, y;` | x: `int[]`, y: `int[]` |\n| `int x[], y;` | x: `int[]`, y: `int` |\n| `int[] x, y[];` | x: `int[]`, y: `int[][]` |\n\n```java\nint h[], i;\ni = 5;               // ✓ i는 int\ni = new int[1];      // ✗ i는 배열이 아님\n```\n\n매개변수 선언에도 같은 규칙이 적용됩니다. `main`의 매개변수는 아래 세 형태가 모두 진입점으로 동작합니다(가변 인자 `String...`도 메서드 안에서는 `String[]`입니다).\n\n```java\npublic static void main(String[] args)   // ✓\npublic static void main(String args[])   // ✓\npublic static void main(String... args)  // ✓\n```", "pitfalls": ["`int numbers [ ];`처럼 공백이 섞인 선언도 합법입니다. 낯설다고 컴파일 에러를 고르면 안 됩니다.", "`int a[], b;`에서 `b`는 배열이 아니라 그냥 `int`입니다.", "`int[2] a;`, `int a[2];`는 컴파일 에러입니다. 크기는 `new int[2]`에만 씁니다."], "qs": [44, 47, 53, 56]}, {"title": "배열 생성과 초기화", "body": "배열을 만드는 방법은 세 가지이고, **크기와 초기값을 동시에 지정할 수는 없습니다**.\n\n| 형태 | 예 | 쓸 수 있는 곳 |\n|---|---|---|\n| 크기만 지정 | `new int[3]` | 어디서나 (원소는 기본값) |\n| 초기값만 지정(익명 배열) | `new int[]{1, 2, 3}` | 어디서나 |\n| 초기화 식 | `{1, 2, 3}` | **선언과 동시에**만 |\n\n- 이미 선언된 변수에 대입하거나 메서드 인자로 넘길 때는 `new int[]{...}`를 써야 합니다.\n- 초기화 식의 마지막 원소 뒤 쉼표는 허용됩니다.\n- 크기 식은 `int`로 승격되는 타입(`byte`, `short`, `char`, `int`)만 됩니다. `long`은 안 됩니다.\n- 크기 0은 합법이고, 음수 크기는 컴파일은 되지만 실행 시 `NegativeArraySizeException`이 납니다.\n- 길이는 생성 후 바뀌지 않습니다. 같은 변수에 다시 `new`를 대입하면 **완전히 새 배열**을 가리킵니다.\n\n```java\nint[] a = new int[3];          // ✓ {0, 0, 0}\nint[] b = new int[]{1, 2, 3};  // ✓ 익명 배열\nint[] c = {1, 2, 3};           // ✓ 선언과 동시에\nint[] d = {1, 2, };            // ✓ 끝 쉼표 허용, 길이 2\nint[] e = new int[0];          // ✓ 빈 배열\nint[] f = new int[];           // ✗ 크기도 초기값도 없음\nint[] g = new int[2]{1, 2};    // ✗ 크기와 초기값 동시 지정\nc = {4, 5};                    // ✗ 선언이 아닌 곳에서 {} 단독 사용\nc = new int[]{4, 5};           // ✓\nlong n = 3;\nint[] h = new int[n];          // ✗ long → int 자동 변환 불가\nchar ch = 'A';\nint[] k = new int[ch];         // ✓ char → int 승격, 길이 65\nint[] m = new int[-1];         // 컴파일 ✓, 실행 시 NegativeArraySizeException\n```\n\n배열을 \"늘리는\" 것처럼 보이는 코드:\n\n```java\nint numbers [ ];\nnumbers = new int [2];\nnumbers [0] = 10; numbers [1] = 20;\nnumbers = new int [4];          // 새 배열, 10과 20은 사라짐\nnumbers [2] = 30; numbers [3] = 40;\nfor (int x : numbers) System.out.print(\" \" + x);   //  0 0 30 40\n```", "pitfalls": ["`numbers = new int[4];`는 기존 배열을 늘리는 것이 아니라 새 배열로 바꾸는 것입니다. 이전 값은 사라지고 기본값 0부터 시작합니다.", "`new int[2]{1, 2}`처럼 크기와 초기값을 함께 쓰면 컴파일 에러입니다.", "선언 후 `arr = {1, 2};`는 컴파일 에러이고 `arr = new int[]{1, 2};`로 써야 합니다.", "`new int[]`(크기도 초기값도 없음)는 컴파일 에러입니다."], "qs": [47, 56]}, {"title": "원소 기본값과 객체 배열의 null", "body": "`new`로 만든 배열의 원소는 **타입별 기본값**으로 자동 초기화됩니다. 지역 변수 안의 배열이라도 마찬가지입니다.\n\n| 원소 타입 | 기본값 |\n|---|---|\n| `byte`, `short`, `int`, `long` | `0` |\n| `float`, `double` | `0.0` |\n| `char` | `'\\u0000'` (공백 `' '`이 아님) |\n| `boolean` | `false` |\n| 참조형(`String`, 클래스, 배열) | `null` |\n\n- 배열 원소는 대입하지 않아도 읽을 수 있습니다. 하지만 배열 **변수** 자체가 초기화되지 않은 지역 변수라면 컴파일 에러입니다.\n- 객체 배열을 만들면 **참조 칸만** 생기고 객체는 하나도 생기지 않습니다. 각 칸에 직접 `new`로 대입해야 합니다.\n- null 원소를 문자열 연결(`+`)이나 `println`에 넘기면 `\"null\"`이 출력됩니다. 필드나 인스턴스 메서드에 접근하면 `NullPointerException`입니다.\n\n```java\nint[] x = new int[2];\nSystem.out.println(x[0]);          // 0\nint[] y;\nSystem.out.println(y[0]);          // ✗ 지역 변수 y가 초기화되지 않음\n\nString[] s = new String[2];\nSystem.out.println(s[0]);          // null\nSystem.out.println(s[0] + \"!\");    // null!\nSystem.out.println(s[0].length()); // NullPointerException\n\nStudent[] st = new Student[3];     // Student 객체는 0개\nst[1] = new Student(\"Richard\");\nfor (Student t : st)\n    System.out.println(\"\" + t.name);   // 첫 원소(null)에서 NullPointerException\n```\n\nString 불변성 문제처럼 보여도 null 원소에 메서드를 부르면 그 전에 NPE가 납니다.\n\n```java\nString[] strs = new String[2];\nstrs[0].concat(\" element\");   // NullPointerException (불변성과 무관)\n```", "pitfalls": ["`new Student[3]`은 Student 객체를 만들지 않습니다. 대입하지 않은 칸은 null입니다.", "`\"\" + s.name`에서 NPE가 나는 원인은 연결이 아니라 null 참조 `s`의 필드 접근입니다.", "String 불변성 함정처럼 보이는 코드도 먼저 null 원소에 메서드를 호출하는지 확인하세요.", "`char` 배열의 기본값 `'\\u0000'`은 공백 문자 `' '`와 다릅니다."], "qs": [45, 47, 50, 51, 52, 55, 56]}, {"title": "인덱스, length, 원소 대입", "body": "- 유효한 인덱스는 `0`부터 `length - 1`까지입니다. 그 밖의 인덱스(음수 포함)는 **컴파일은 되고**, 실행 시 `ArrayIndexOutOfBoundsException`이 납니다. 상수 인덱스여도 컴파일러는 잡지 않습니다.\n- 인덱스 식도 `int`로 승격되는 타입이어야 합니다(`a[0L]`은 컴파일 에러).\n- 길이를 얻는 방법은 대상마다 다릅니다.\n\n| 대상 | 길이 | 비고 |\n|---|---|---|\n| 배열 | `arr.length` | 괄호 없는 `final` 필드 |\n| `String` | `str.length()` | 메서드 |\n| `ArrayList` | `list.size()` | 메서드 |\n\n```java\nString[] p = {\"Mercury\", \"Venus\", \"Earth\", \"Mars\"};\nSystem.out.println(p.length);       // 4\nSystem.out.println(p[1].length());  // 5 (\"Venus\")\nint n1 = p.length();                // ✗ 배열에는 length() 메서드가 없음\nint n2 = p[1].length;               // ✗ String에는 length 필드가 없음\np.length = 10;                      // ✗ length는 final\np[4] = \"Pluto\";                     // 컴파일 ✓, 실행 시 ArrayIndexOutOfBoundsException\n```\n\n**원소 대입은 대입 시점의 값 복사**입니다. 기본형 배열에서 `a[i] = a[j];` 뒤에 `a[j]`를 바꿔도 `a[i]`는 따라가지 않습니다. 객체 배열은 참조가 복사되어 두 칸이 같은 객체를 가리키지만, 한 칸에 다른 객체를 대입해도 다른 칸은 그대로입니다.\n\n```java\nint[] a = {15, 30, 45, 60, 75};\na[2] = a[4];   // 75 복사\na[4] = 90;     // a[2]는 75 그대로\nSystem.out.println(Arrays.toString(a));   // [15, 30, 75, 60, 90]\n```", "pitfalls": ["`arr.length`는 원소 개수이지 마지막 인덱스가 아닙니다. `arr[arr.length]`는 예외입니다.", "`planets[1]`은 두 번째 원소입니다. 인덱스를 1부터 세게 만드는 보기가 꼭 나옵니다.", "`arr.length()`, `str.length`, `list.length`처럼 셋을 섞은 보기는 컴파일 에러입니다.", "범위를 벗어난 상수 인덱스도 컴파일은 됩니다. 결과는 런타임 예외입니다."], "qs": [47, 49, 50, 55, 58, 59]}, {"title": "배열은 객체: 참조 대입, 복사, 비교, 출력", "body": "배열 변수에는 배열 객체의 **참조**가 들어 있습니다.\n\n- `b = a;`는 원소 복사가 아니라 참조 복사입니다. 이후 두 변수는 같은 배열을 가리킵니다.\n- 길이는 타입에 포함되지 않으므로 **길이가 다른 배열끼리도 대입**할 수 있습니다.\n- 원소 타입은 맞아야 합니다. 기본형 배열끼리는 변환이 없고(`int[]` → `long[]` 불가), 참조형 배열은 원소 타입이 대입 가능하면 됩니다.\n- 내용 복사는 `clone()`, `Arrays.copyOf(src, newLength)`, `System.arraycopy(src, srcPos, dest, destPos, length)`를 씁니다.\n- 비교: `a == b`와 `a.equals(b)`는 모두 **같은 객체인지**만 봅니다. 내용 비교는 `Arrays.equals(a, b)`입니다.\n\n```java\nint[] a = {1, 2, 3};\nint[] b = {1, 2, 3, 4, 5};\nb = a;                     // ✓ 길이가 달라도 대입 가능\nb[0] = 9;                  // a[0]도 9, b.length는 3\nint[] c = a.clone();       // 별도 객체\nSystem.out.println(a == c);                // false\nSystem.out.println(a.equals(c));           // false\nSystem.out.println(Arrays.equals(a, c));   // true\nSystem.out.println(Arrays.toString(Arrays.copyOf(a, 5)));  // [9, 2, 3, 0, 0]\n\nObject o = new int[3];         // ✓ 배열은 Object\nObject[] os = new String[3];   // ✓ String은 Object\nlong[] l = new int[3];         // ✗ 기본형 배열끼리 변환 없음\nObject[] oi = new int[3];      // ✗ int는 Object가 아님\n```\n\n**출력 형식**: 배열은 `toString()`을 재정의하지 않아 `타입표기@16진수해시`가 출력됩니다.\n\n| 배열 | `println(arr)` 앞부분 |\n|---|---|\n| `int[]` | `[I@` |\n| `int[][]` | `[[I@` |\n| `String[]` | `[Ljava.lang.String;@` |\n| `Planet[]`(기본 패키지) | `[LPlanet;@` |\n\n- 내용을 보려면 `Arrays.toString(arr)` → `[1, 2]`, 다차원은 `Arrays.deepToString(arr)` → `[[1], [2, 3]]`입니다.\n- `char[]`만 예외입니다. `println(char[])` 오버로드가 있어 `hi`처럼 문자가 출력됩니다. 단 `\"\" + chars`는 `[C@...`입니다.", "pitfalls": ["`nums2 = nums1;`은 참조 대입이라 이후 nums2는 nums1의 길이와 내용을 따릅니다. 길이가 달라도 컴파일 에러가 아닙니다.", "`println(planets)`는 내용이 아니라 `[LPlanet;@16진수` 형태를 출력합니다. 다음 줄의 `planets[2].name`은 필드 값 그대로 출력됩니다.", "`a.equals(b)`는 내용이 아니라 참조를 비교합니다. 내용 비교는 `Arrays.equals(a, b)`입니다.", "`String[]`은 `Object[]`에 대입되지만 `int[]`는 `Object[]`나 `long[]`에 대입되지 않습니다."], "qs": [44, 49, 53, 54, 56]}, {"title": "다차원 배열과 비정형(jagged) 배열", "body": "Java의 2차원 배열은 **배열의 배열**입니다. `int[][]`의 원소 타입은 `int[]`입니다.\n\n- `new int[R][C]`: 길이 R인 바깥 배열의 각 칸에 길이 C인 `int[]`가 들어갑니다. `arr.length`는 R(행 수), `arr[i].length`는 i행의 길이입니다.\n- `arr[r][c]`에서 첫 인덱스가 행, 두 번째가 열입니다. 둘 다 0부터입니다.\n- 첫 번째 차원은 반드시 써야 하고, 뒤 차원은 생략할 수 있습니다. `new int[2][]`의 행은 `null`입니다.\n- 각 행은 독립된 객체라 **다른 길이의 배열로 교체**할 수 있습니다(비정형 배열).\n- 선언 형태 `int[][] a`, `int a[][]`, `int[] a[]`는 모두 같습니다.\n\n```java\nint[][] arr = new int[2][4];\narr[1] = new int[]{1, 3};        // ✓ 행 교체, 이제 arr[1].length는 2\nint[][] j = new int[2][];        // ✓ j[0], j[1]은 null\nj[0] = new int[1];\nj[1] = new int[5];\nint[][] bad = new int[][4];      // ✗ 첫 번째 차원은 생략 불가\nint[][] lit = {{1, 3}, {2, 4, 6}};   // ✓ 행 길이 2, 3\nint[] row = lit[1];              // ✓ 행 하나는 int[]\nint v = lit[1];                  // ✗ int[]를 int에 대입 불가\nint[][] n2 = new int[2][];\nn2[0][0] = 1;                    // 컴파일 ✓, 실행 시 NullPointerException (n2[0]이 null)\n```\n\n예: 안쪽 루프 조건을 행 길이가 아닌 행 수로 쓴 경우\n\n```java\nString[][] chs = new String[2][];\nchs[0] = new String[2];\nchs[1] = new String[5];\nint i = 97;\nfor (int a = 0; a < chs.length; a++)\n    for (int b = 0; b < chs.length; b++) {   // chs[a].length가 아님\n        chs[a][b] = \"\" + i; i++;\n    }\n// 출력(행마다 줄바꿈):\n// 97 98\n// 99 100 null null null\n```\n\n- `new int[1][3]`은 행 1개, 열 3개입니다. 숫자는 길이이고 유효 인덱스는 `[0][0]`~`[0][2]`입니다.\n- `new char[3][3]`에서 마지막 칸은 `[2][2]`입니다. `[3][x]`는 `ArrayIndexOutOfBoundsException`입니다.", "pitfalls": ["`new int[2][4]`로 만들었어도 `arr[1] = new int[]{1, 3};` 뒤에는 그 행의 길이가 2입니다(`1 3 0 0`이 아님).", "안쪽 루프 조건이 `arr[i].length`가 아니라 `arr.length`이면 행 길이와 무관하게 행 수만큼만 돕니다.", "`new int[2][]`의 행은 null이라 `a[0][0]`은 AIOOBE가 아니라 NPE입니다.", "`new int[1][3]`의 숫자를 인덱스 범위나 행·열 반대로 읽지 마세요. 첫 숫자가 행 수입니다."], "qs": [46, 48, 50, 51, 55, 57, 59]}, {"title": "배열 순회: 일반 for문과 향상된 for문", "body": "**향상된 for문** `for (T x : arr)`\n\n- 시작할 때 `arr`을 한 번 평가하고, 인덱스 0부터 `length - 1`까지 **정순으로만** 돕니다. 역순이나 인덱스가 필요하면 일반 for문을 씁니다.\n- 루프 변수는 원소의 **복사본**입니다. `x = 0;`처럼 대입해도 배열은 바뀌지 않습니다. 원소가 객체라면 `x.field = ...`로 객체 상태는 바꿀 수 있습니다.\n- 루프 변수는 헤더 안에서 선언해야 합니다.\n- 변수 타입은 원소 타입을 대입받을 수 있어야 합니다(확대 변환 OK, 축소 불가).\n- 2차원 배열의 바깥 루프 변수 타입은 행 타입(`int[]`)입니다.\n- 배열 참조가 null이면 `NullPointerException`입니다.\n\n```java\nint[] a = {1, 2, 3};\nfor (int x : a) x = 0;            // a는 그대로 {1, 2, 3}\nfor (long v : a) { }              // ✓ int → long 확대\nlong[] la = {1L};\nfor (int v : la) { }              // ✗ long → int 축소 불가\nint x;\nfor (x : a) { }                   // ✗ 루프 변수는 헤더에서 선언해야 함\nint[][] n = {{1, 3}, {2, 4}};\nfor (int v : n) { }               // ✗ n의 원소 타입은 int[]\nfor (int[] row : n)\n    for (int v : row) System.out.print(v);   // ✓ 1324\n```\n\n**바깥만 역순인 경우**: 행 순서만 뒤집히고 행 안은 정순입니다.\n\n```java\nfor (int i = n.length - 1; i >= 0; i--)\n    for (int y : n[i]) System.out.print(y);  // 2413\n```\n\n**일반 for문의 생략**: `for (초기화; 조건; 갱신)`의 세 부분은 모두 생략할 수 있지만 세미콜론 두 개는 있어야 합니다. 조건을 생략하면 무한 루프이고, 갱신식을 생략하면 본문에서 직접 증가시켜야 합니다.\n\n```java\nString[][] s = {{\"red\", \"blue\"}, {\"small\", \"medium\"}};\nfor (int i = 0; i < s.length; ) {\n    for (int j = 0; j < s[i].length; ) {\n        System.out.print(s[i][j] + \":\");\n        j++;\n    }\n    i++;\n}\n// red:blue:small:medium:\n```", "pitfalls": ["바깥 루프가 역순이어도 안쪽 향상된 for문은 정순입니다(답은 2413이고 4231이 아님).", "향상된 for문의 루프 변수에 대입해도 배열 원소는 바뀌지 않습니다.", "갱신식을 생략한 for문은 증가문의 위치와 시작값·조건을 한 줄씩 추적해야 합니다. 조금만 바뀌어도 원소를 건너뛰거나 예외가 납니다.", "`for (int v : twoDimArr)`처럼 2차원 배열을 바로 int로 받으면 컴파일 에러입니다."], "qs": [44, 46, 48, 51, 52, 53, 56, 57, 59]}]}, {"topic": "loops", "name": "반복문", "en": "Using Loop Constructs", "intro": "while, do-while, 기본 for, 향상된 for 문과 break/continue(레이블 포함), 도달 불가능한 코드를 다룹니다. 점수는 루프 종료 시점의 변수 값(off-by-one), do-while의 최소 1회 실행, 조건 안의 증감과 메서드 매개변수 복사, `continue` 뒤 문장의 컴파일 에러를 놓칠 때 잃습니다.", "sections": [{"title": "while 문과 반복 추적", "body": "`while (조건) 본문`은 **조건을 먼저 검사**합니다. 처음부터 false면 본문은 0번 실행됩니다. 조건은 boolean이어야 합니다(`while (x)`처럼 int는 ✗).\n\n**종료 값 규칙**(0부터 1씩 증가할 때)\n- `while (i < n) i++;` → `i == n`에서 끝남\n- `while (i <= n) i++;` → `i == n + 1`에서 끝남\n\n**조건에 메서드 호출이 있을 때**: 기본형 인자는 **복사본**이 전달됩니다. 메서드 안에서 `x--`를 해도 호출한 쪽의 x는 그대로이므로, 루프 변수는 호출한 쪽(본문)에서 바꿔야 루프가 끝납니다.\n\n반복마다 **(조건 평가 때의 값, 본문 출력 값, 변경 후 값)**을 표로 적으면 정확합니다.\n\n```java\npublic static void main(String[] args) {\n    int x = 5;\n    while (isAvailable(x)) {\n        System.out.print(x);\n        x--;                             // ✓ 호출한 쪽에서 감소\n    }                                    // 54321\n}\nstatic boolean isAvailable(int x) {\n    return x-- > 0 ? true : false;       // 복사본 감소. 비교는 x > 0과 같음\n}\n```\n\n같은 `isAvailable`에서 본문을 `System.out.print(--x);`로 바꾸면 `43210`이 출력됩니다. 감소 후 출력하므로 한 칸씩 밀립니다.\n\n```java\npublic static void main(String[] args) {\n    int x = 6;\n    while (isAvailable(x)) {\n        System.out.print(--x);           // 감소 후 출력 → 54321\n    }\n}\nstatic boolean isAvailable(int x) {\n    return --x > 0 ? true : false;       // 비교는 x - 1 > 0, 즉 x > 1\n}\n```\n\n| 조건 평가 때 x | isAvailable | 출력 | 본문 후 x |\n|---|---|---|---|\n| 6 | 5 > 0 true | 5 | 5 |\n| 2 | 1 > 0 true | 1 | 1 |\n| 1 | 0 > 0 false | 종료 | |\n\n이 경우 조건을 `while (isAvailable(--x))`로 바꾸면 메서드 안에서 한 번 더 줄어든 값으로 비교하므로 `5432`에서 멈춥니다.", "pitfalls": ["메서드 매개변수로 넘긴 int를 메서드 안에서 줄여도 루프 변수는 그대로입니다. 본문에서 바꾸지 않으면 무한 루프입니다.", "`print(x); x--;`와 `print(--x);`는 출력이 한 칸 다릅니다. 첫 값과 끝 값을 반드시 확인합니다.", "조건과 메서드 양쪽에서 감소하면 두 번 줄어든 값으로 비교됩니다. 마지막 반복이 빠지는지 끝까지 추적합니다."], "qs": [60, 68]}, {"title": "do-while 문", "body": "`do { 본문 } while (조건);`은 **본문을 먼저 한 번 실행한 뒤** 조건을 검사합니다.\n- 조건이 처음부터 false여도 본문은 **최소 1회** 실행됩니다. while은 0회일 수 있습니다.\n- 끝
