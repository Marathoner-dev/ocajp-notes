의 **세미콜론이 필수**입니다.\n- 본문 `{ }` 안에서 선언한 변수는 `while (조건)`에서 보이지 않습니다.\n- 루프가 끝난 뒤 변수 값은 '조건이 처음으로 false가 된 시점의 값'입니다.\n\n```java\nint num = 5;\ndo {\n    System.out.print(num-- + \" \");   // 5 출력, num = 4\n} while (num == 0);                  // 4 == 0 false → 종료\n// 출력: \"5 \" (한 번만)\n```\n\n```java\nint[] stack = {10, 20, 30};\nint size = 3, idx = 0;\ndo { idx++; } while (idx < size - 1);   // idx 1: 1<2 true / idx 2: 2<2 false\nSystem.out.print(stack[idx]);           // 30\n```\n\n```java\nint i = 5;\ndo { i++; } while (i < 3);   // 본문 1회 → i = 6\nint w = 5;\nwhile (w < 3) { w++; }       // 0회 → w = 5\ndo System.out.println(\"one\"); while (false);   // ✓ one (do-while은 false여도 1회)\n```\n\n```java\ndo { int k = 1; } while (k < 3);        // ✗ k는 본문 블록 밖에서 보이지 않음\nint n = 0; do { n++; } while (n < 3)    // ✗ 세미콜론 누락\n```\n\n**풀이 요령**: 1) 본문을 무조건 한 번 실행하고, 2) 바뀐 값으로 조건을 검사하는 순서를 표로 적습니다. 인덱스를 옮기는 루프라면 '조건이 처음 false가 된 순간의 인덱스'가 루프 뒤에서 쓰이는 값입니다. 보기마다 이 값을 구해 원하는 인덱스(예: 마지막 원소 `size - 1`)와 맞는지 비교합니다.\n\n**while과 비교**\n\n| 항목 | while | do-while |\n|---|---|---|\n| 조건 검사 | 본문 전 | 본문 후 |\n| 최소 실행 | 0회 | 1회 |\n| 끝 세미콜론 | 없음 | 필수 |", "pitfalls": ["카운트다운처럼 보여도 조건이 `num == 0`이면 한 번 실행 후 끝납니다. 조건식을 정확히 읽습니다.", "do-while은 조건이 false여도 본문이 1회 실행됩니다. 이 1회가 인덱스를 한 칸 더 옮깁니다.", "`while (조건)` 뒤 세미콜론이 없으면 컴파일 에러입니다."], "qs": [64, 67, 69]}, {"title": "기본 for 문", "body": "`for (초기화; 조건; 증감) 본문`의 실행 순서:\n1. 초기화 (한 번만)\n2. 조건 검사 → false면 종료\n3. 본문\n4. 증감 → 2로 돌아감\n\n- 조건은 본문보다 먼저 검사되므로 0회 실행될 수 있습니다. 조건 안의 식(`jj - 1`)은 매번 다시 계산합니다.\n- 세 부분 모두 생략할 수 있습니다. `for (;;)`는 무한 루프입니다.\n- 증감부에는 `i += 2`, `i--` 등 임의의 식을 쓰고, 쉼표로 여러 식을 나열할 수 있습니다.\n\n**초기화부 규칙**\n- 새 변수 선언(`int i = 0, j = 3`)이나 기존 변수 대입(`ii = 0`) 중 하나를 씁니다.\n- 선언할 때는 **한 타입만** 됩니다. 선언과 대입을 섞을 수도 없습니다.\n- 헤더에서 선언한 변수는 루프 밖에서 보이지 않습니다. 바깥 변수를 쓰면 루프 후에도 값이 남습니다.\n- 바깥에 살아 있는 지역 변수와 같은 이름을 헤더에서 다시 선언하면 에러입니다.\n\n```java\nint ii = 0, jj = 7;\nfor (ii = 0; ii < jj - 1; ii = ii + 2) System.out.print(ii + \" \");   // 0 2 4\nSystem.out.println(ii);                                                // 6\nfor (int i = 0, j = 3; i < j; i++, j--) System.out.print(i + \"\" + j + \" \");  // 03 12\nint a[] = {1, 2, 3, 4, 5};\nfor (int e = 0; e < a.length; e += 2) System.out.print(a[e]);   // 135 (인덱스 0,2,4)\nfor (int e = 1; e < a.length; e += 2) System.out.print(a[e]);   // 24\n```\n\n```java\nfor (int i = 0, long j = 0; ;) { }       // ✗ 선언은 한 타입만\nint i2; for (i2 = 0, int j = 0; ; ) { }  // ✗ 대입과 선언 혼합\nint ii = 0; for (int ii = 0; ii < 3; ii++) { }   // ✗ 바깥 ii와 이름 충돌\nfor (int i = 0; i < 3; i++) { }\nSystem.out.println(i);                   // ✗ i는 루프 밖에서 보이지 않음\n```\n\n표준 for 문은 인덱스를 직접 제어하므로 순방향, 역방향, 건너뛰기 순회가 모두 가능하고 인덱스로 배열 원소를 바꿀 수도 있습니다.", "pitfalls": ["'1, 3, 5번째 값'은 인덱스 0, 2, 4입니다. 시작값을 1로 고르면 2, 4가 출력됩니다.", "`ii < 6` 조건에서 6은 출력되지 않지만, 루프가 끝난 뒤 바깥 변수 ii의 값은 6입니다.", "for 헤더에서 `int i = 0, long j = 0`처럼 두 타입을 선언할 수 없습니다."], "qs": [62, 65, 70]}, {"title": "향상된 for 문 (for-each)", "body": "`for (타입 변수 : 배열 또는 Iterable)`은 **처음부터 끝까지 모든 원소를 순서대로** 변수에 복사해 줍니다.\n- 변수는 **인덱스가 아니라 원소 값**입니다.\n- 변수는 콜론 앞에서 **새로 선언**해야 합니다. 기존 변수 사용이나 초기화식은 ✗.\n- 변수에 다른 값을 대입해도 배열은 바뀌지 않습니다(복사본).\n- 인덱스, 역순, 건너뛰기를 지정할 수 없습니다. 그런 처리는 표준 for 문으로 합니다.\n- 원소 타입에서 변수 타입으로 대입이 가능해야 합니다(`int` 배열 → `long` 변수 ✓, `byte` 변수 ✗). `final`은 붙일 수 있습니다.\n- `ArrayList` 같은 `Iterable`에도 쓸 수 있습니다.\n\n```java\nint[] intArr = {8, 16, 32, 64, 128};\nfor (int v : intArr) System.out.print(v + \" \");                 // ✓ 8 16 32 64 128\nfor (int i = 0; i < intArr.length; i++)\n    System.out.print(intArr[i] + \" \");                          // ✓ 같은 출력\nfor (int v : intArr) v = 0;                                     // 배열은 그대로\nSystem.out.println(intArr[0]);                                  // 8\nfor (long v : intArr) { }                                       // ✓ 확대 변환\nfor (final int v : intArr) { }                                  // ✓\n```\n\n```java\nfor (int i : intArr) System.out.print(intArr[i]);  // ✗ 실행 시 ArrayIndexOutOfBoundsException (i는 8, 16, ...)\nint x; for (x : intArr) { }          // ✗ 헤더에서 선언해야 함\nfor (int x = 0 : intArr) { }         // ✗ 초기화식 불가\nfor (byte v : intArr) { }            // ✗ int → byte 축소\n```\n\n**요구사항별 선택**\n\n| 요구 | 표준 for | 향상된 for |\n|---|---|---|\n| 모든 원소를 입력 순서대로 | ✓ | ✓ |\n| 모든 원소를 역순으로 | ✓ | ✗ |\n| 하나씩 건너뛰며 | ✓ | ✗ |\n| 인덱스로 원소 수정 | ✓ | ✗ |", "pitfalls": ["for-each 변수를 인덱스로 써서 `arr[v]`로 접근하면 값이 인덱스로 쓰여 예외가 나거나 엉뚱한 원소가 나옵니다.", "for-each는 역순·건너뛰기를 지정할 수 없습니다. '세 요구사항 모두 for-each로 가능'은 거짓입니다.", "루프 변수에 대입해도 원본 배열은 바뀌지 않습니다."], "qs": [63, 65]}, {"title": "경계값과 역순 순회 (off-by-one)", "body": "길이 n 배열의 유효 인덱스는 **0 ~ n-1**입니다. 범위를 벗어나면 **컴파일은 되고 실행 중** `ArrayIndexOutOfBoundsException`이 납니다.\n\n**순방향**\n- 모든 원소: `for (int i = 0; i < a.length; i++)` (또는 `i <= a.length - 1`)\n- 짝수 인덱스: `i = 0; i < a.length; i += 2`\n- 마지막 원소에서 멈추기(0부터 1씩 증가): 조건 `i < n - 1`\n\n**역방향은 두 짝 중 하나로 통일합니다.**\n\n| 시작값 | 접근 | 조건 |\n|---|---|---|\n| `x = n` | `array[--x]` (감소 후 접근) | `x > 0` |\n| `x = n - 1` | `array[x--]` 또는 `array[i]` 후 `i--` | `x >= 0` |\n\n두 방식을 섞으면 한쪽 끝에서 범위를 벗어납니다.\n\n```java\nint[] array = {10, 20, 30, 40, 50};\nint x = array.length;\nwhile (x > 0) System.out.print(array[--x]);          // ✓ 5040302010\nint y = array.length;\ndo { System.out.print(array[--y]); } while (y > 0);  // ✓ 5040302010\nfor (int i = array.length - 1; i >= 0; i--)\n    System.out.print(array[i]);                      // ✓ 5040302010\n```\n\n```java\nint z = array.length;\nwhile (z >= 0) System.out.print(array[--z]);\n// ✗ 5040302010을 다 출력한 뒤 array[-1]에서 ArrayIndexOutOfBoundsException\nint w = array.length;\nwhile (w > 0) System.out.print(array[w--]);\n// ✗ 첫 접근이 array[5] → 바로 ArrayIndexOutOfBoundsException\n```\n\n**반복문 비교**\n\n| 반복문 | 최소 실행 | 인덱스 제어 | 주 용도 |\n|---|---|---|---|\n| while | 0회 | 직접 | 횟수를 모르는 반복 |\n| do-while | 1회 | 직접 | 최소 한 번 실행 |\n| for | 0회 | 헤더에서 | 횟수·인덱스가 정해진 반복 |\n| for-each | 0회 | 불가 | 전체를 순서대로 읽기 |", "pitfalls": ["원하는 출력을 모두 찍은 뒤 예외로 끝나는 코드는 정답이 아닙니다. 마지막 조건 검사 후 한 번 더 접근하는지 확인합니다.", "`x = length`에서 시작하면 '감소 후 접근'(`--x`) + `x > 0`, `x = length - 1`에서 시작하면 `x >= 0`입니다.", "배열 범위 초과는 컴파일 에러가 아니라 실행 시 ArrayIndexOutOfBoundsException입니다."], "qs": [64, 65, 69, 70]}, {"title": "break, continue와 레이블", "body": "| 문장 | 동작 | 쓸 수 있는 곳 |\n|---|---|---|\n| `break` | 가장 안쪽의 반복문 **또는 switch**를 즉시 빠져나감 | 반복문, switch |\n| `continue` | 현재 반복의 나머지를 건너뛰고 다음 반복으로 | 반복문만 |\n| `break 레이블` | 레이블이 붙은 바깥 문장을 빠져나감 | |\n| `continue 레이블` | 레이블이 붙은 바깥 반복문의 다음 반복으로 | |\n\n- for 문에서 `continue`를 만나면 **증감식이 실행된 뒤** 조건을 검사합니다.\n- 반복문 안의 switch에서 `break`는 **switch만** 빠져나갑니다. 루프는 계속됩니다.\n- switch 단독에서 `continue`, 반복문·switch 밖의 `break`, 정의되지 않은 레이블은 컴파일 에러입니다.\n\n```java\nString[] arr = {\"A\", \"B\", \"C\", \"D\"};\nfor (int i = 0; i < arr.length; i++) {\n    System.out.print(arr[i] + \" \");\n    if (arr[i].equals(\"C\")) {\n        continue;\n    }\n    System.out.println(\"Work done\");\n    break;                          // 첫 반복에서 무조건 종료\n}\n// 출력: A Work done\n```\n\n```java\nouter:\nfor (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 3; j++) {\n        if (j == 1) continue outer;   // 바깥 루프의 다음 i로\n        if (i == 2) break outer;      // 두 루프 모두 종료\n        System.out.print(i + \"\" + j + \" \");\n    }\n}\n// 출력: 00 10\nfor (int i = 0; i < 3; i++) {\n    switch (i) { case 1: break; }     // switch만 빠져나감\n    System.out.print(i);\n}\n// 출력: 012\n```\n\n```java\nswitch (n) { case 1: continue; }      // ✗ continue outside of loop\nif (n > 0) break;                     // ✗ break outside switch or loop\nfor (;;) { break outer; }             // ✗ undefined label\n```", "pitfalls": ["`continue`에 시선을 빼앗기지 마십시오. 그 조건이 거짓이면 아래의 무조건 `break`가 첫 반복에서 루프를 끝냅니다.", "루프 안 switch의 `break`는 루프를 끝내지 않습니다.", "레이블 없는 `break`/`continue`는 가장 안쪽 루프에만 작용합니다."], "qs": [61, 66]}, {"title": "도달 불가능한 코드와 무한 루프", "body": "컴파일러는 실행될 수 없는 문장을 **컴파일 에러(unreachable statement)**로 처리합니다.\n\n에러가 나는 경우:\n- 같은 블록에서 무조건적인 `break`, `continue`, `return`, `throw` **바로 뒤의 문장**\n- `while (false) { ... }`, `for (...; false; ...) { ... }`의 본문\n- `break` 없는 `while (true)`, `for (;;)`, `do { } while (true);` **뒤의 문장**\n\n에러가 나지 않는 경우:\n- `if (false) { ... }`: 조건부 컴파일을 위해 예외로 허용\n- `if` 안에 있는 `continue`/`break`/`return`: 조건부이므로 그 뒤 문장은 도달 가능\n- `do { ... } while (false);`: 본문은 1회 실행\n- 조건이 상수가 아닌 변수(`boolean t = true; while (t)`)인 경우\n\n```java\nfor (int e : data) {\n    if (e != key) {\n        continue;\n        count++;          // ✗ unreachable statement (continue 바로 뒤)\n    }\n}\n```\n\n```java\nfor (;;) { break; System.out.println(); }   // ✗ break 뒤\nreturn; System.out.println();               // ✗ return 뒤\nwhile (false) { System.out.println(); }     // ✗ 본문 도달 불가\nwhile (true) { } System.out.println();      // ✗ 무한 루프 뒤\nfor (;;) { } System.out.println();          // ✗\n```\n\n```java\nif (false) { System.out.println(\"x\"); }     // ✓\nint c = 0;\nfor (int i = 0; i < 3; i++) {\n    if (i == 1) continue;                   // ✓ 조건부\n    c++;                                    // 도달 가능, c = 2\n}\nint n = 0;\nwhile (true) { if (++n == 3) break; }       // ✓ break가 있으므로\nSystem.out.println(n);                      // 3\n```", "pitfalls": ["들여쓰기 때문에 `continue; count++;`가 조건부로 실행될 것처럼 보여도, 같은 블록에서 continue 바로 뒤이므로 컴파일 에러입니다.", "출력값을 계산하기 전에 컴파일 에러(unreachable, 미초기화)가 있는지 먼저 확인합니다.", "`if (false)`는 허용되지만 `while (false)`는 컴파일 에러입니다."], "qs": [61, 66]}]}, {"topic": "methods", "name": "메서드와 캡슐화", "en": "Methods and Encapsulation", "intro": "메서드 선언과 반환값, 오버로딩, static 멤버, 생성자, 접근 제어자, 캡슐화, 그리고 인자 전달 방식(pass-by-value)을 다룹니다. static 문맥에서 인스턴스 멤버나 `this`를 쓰는 코드, static 필드 공유, 메서드 안에서 바꾼 값이 호출한 쪽에 보이는지 판단하는 문제에서 점수를 가장 많이 잃습니다.", "sections": [{"title": "메서드 선언, 반환값, 가변 인자", "body": "**선언 순서**: `[접근 제어자] [static/final/abstract 등] 반환타입 이름(매개변수) [throws ...] { }`\n\n- 제어자끼리는 순서가 자유롭지만(`static public` OK), **반환 타입은 메서드 이름 바로 앞**에 와야 합니다.\n- 매개변수마다 타입과 이름이 있어야 하며, 이름이 호출하는 쪽 변수명과 같을 필요는 없습니다.\n- `void`가 아니면 모든 경로에서 값을 `return`해야 합니다. `return` 식은 반환 타입에 대입 가능해야 합니다(확대 변환, 박싱은 OK).\n- `return` 바로 뒤의 문장은 도달 불가라 컴파일 에러입니다.\n- 매개변수와 같은 이름의 지역 변수를 메서드 안에서 다시 선언할 수 없습니다.\n- 메서드 호출 결과는 값이라 `=`의 왼쪽에 올 수 없습니다.\n\n```java\nstatic int[] findMax(int[] max) { return new int[3]; }  // ✓ 매개변수 이름은 자유\nstatic public void a() { }          // ✓ 제어자 순서 자유\npublic void static b() { }          // ✗ 반환 타입은 이름 바로 앞\nint c() { }                         // ✗ return 없음\nvoid d() { return 1; }              // ✗ void는 값 반환 불가\nint e() { return; }                 // ✗ 값 없는 return\nlong f() { return 1; }              // ✓ int → long 확대\nInteger g() { return 1; }           // ✓ 박싱\nLong h() { return 1; }              // ✗ int는 Long으로 박싱 불가\nint i() { return 1; System.out.println(); }  // ✗ 도달 불가 코드\nvoid j(int x) { int x = 1; }        // ✗ 매개변수와 이름 중복\nacct.getAmount() = 0;               // ✗ 호출 결과에 대입 불가\nacct.changeAmount(-acct.getAmount());  // ✓ 현재 값만큼 빼서 0으로\n```\n\n**가변 인자(varargs)** `타입... 이름`\n\n- 메서드 안에서는 배열로 다룹니다. 호출할 때는 인자 0개 이상 또는 배열을 넘깁니다.\n- 매개변수 목록의 **마지막에 하나만** 올 수 있습니다.\n\n```java\nstatic int sum(int... n) { int s = 0; for (int v : n) s += v; return s; }\nsum();                     // ✓ 0 (빈 배열)\nsum(1, 2, 3);              // ✓ 6\nsum(new int[]{4, 5});      // ✓ 9\nvoid k(int... a, int b) { }         // ✗ 가변 인자는 마지막에만\nvoid m(int... a, String... b) { }   // ✗ 가변 인자는 하나만\n```", "pitfalls": ["시그니처를 고르는 문제에서 매개변수 이름은 상관없습니다. 반환 타입, static 여부, 매개변수 타입을 보세요.", "반환 타입 `int[]`와 `int`는 서로 변환되지 않습니다. 받는 변수 타입과 맞는지 확인하세요.", "`obj.getX() = 0;`처럼 메서드 호출 결과에 대입하는 보기는 컴파일 에러입니다.", "`Long h() { return 1; }`은 컴파일 에러입니다. 확대 변환 뒤에 박싱하는 변환은 없습니다."], "qs": [71, 84, 95]}, {"title": "static 필드와 인스턴스 필드", "body": "| 구분 | 생성 시점 | 개수 | 접근 |\n|---|---|---|---|\n| static 필드 | 클래스 로딩 시 한 번 | 클래스당 1개, 모든 객체가 공유 | `클래스명.f` (참조로도 가능) |\n| 인스턴스 필드 | `new`할 때마다 | 객체마다 1개 | `참조.f` |\n\n- `x1.i`, `x2.i`, `X.i`는 i가 static이면 **모두 같은 변수**입니다. 참조로 접근해도 컴파일되며, 컴파일러는 참조 변수의 선언 타입만 봅니다. 그래서 **참조가 null이어도 NPE가 나지 않습니다**.\n- 필드(static·인스턴스)는 대입하지 않으면 기본값(0, 0.0, false, `'\\u0000'`, null)을 가집니다. 지역 변수에는 기본값이 없습니다.\n- 출력 문제에서는 static 값이 **출력 시점에 얼마인지**를 봅니다. 객체를 모두 만든 뒤 출력하면 모든 줄에 같은 최종값이 찍힙니다.\n- 메서드·생성자 본문에서는 필드 선언 위치와 상관없이 쓸 수 있습니다. 선언 순서가 문제 되는 곳은 **필드 초기화식과 초기화 블록**뿐입니다.\n\n```java\nclass X {\n    static int i;\n    int j;\n    public static void main(String[] args) {\n        X x1 = new X(), x2 = new X();\n        x1.i = 3; x1.j = 4;\n        x2.i = 5; x2.j = 6;\n        System.out.println(x1.i + \" \" + x1.j + \" \" + x2.i + \" \" + x2.j); // 5 4 5 6\n        X n = null;\n        System.out.println(n.i);   // 5 (NPE 아님)\n    }\n}\n```\n\n```java\nclass F {\n    static int a = b;     // ✗ illegal forward reference\n    static int b = 1;\n}\npublic class Main {\n    static void m() { System.out.println(flag); }   // ✓ 메서드 안에서는 순서 무관\n    public static void main(String[] args) { m(); } // true\n    static boolean flag = true;\n}\n```\n\n조건부 대입 예: 생성자에서 `if (s < ns) { s = ns; this.ns = ns; }`로 50, 125, 100을 차례로 넣으면 출력은 `ns = 50 s = 125`, `ns = 125 s = 125`, `ns = 0 s = 125`입니다. 세 번째 객체는 조건이 false라 `ns`가 기본값 0으로 남습니다.", "pitfalls": ["`x1.i`, `x2.i`처럼 참조마다 따로 있는 것처럼 써도 static 필드는 하나뿐입니다.", "static 필드는 마지막에 대입된 값이 모든 참조에서 보입니다.", "필드 선언이 클래스 맨 아래에 있어도 메서드 안에서 쓰는 것은 컴파일 에러가 아닙니다.", "static 메서드를 `ts.doStuff()`처럼 참조로 호출해도 컴파일되고, 참조가 null이어도 실행됩니다.", "if 블록 안에서만 대입한 필드는 조건이 false인 객체에서 기본값으로 남습니다."], "qs": [72, 74, 78, 87, 96, 97]}, {"title": "static 문맥의 제약과 this", "body": "static 메서드(`main` 포함)와 static 초기화 블록은 특정 객체 없이 실행되므로 **`this`와 `super`가 없습니다**.\n\n| 어디서 \\ 무엇을 | static 멤버 | 인스턴스 멤버 |\n|---|---|---|\n| static 메서드 | 이름만으로 ✓ | 객체 참조를 거쳐야 함 (`obj.f`) |\n| 인스턴스 메서드·생성자 | ✓ | 이름만으로 ✓ (`this.` 생략) |\n\n```java\npublic class App {\n    int count;\n    static int total;\n    static void s() {\n        total++;              // ✓\n        new App().count++;    // ✓ 객체 참조를 거치면 가능\n        count++;              // ✗ static 문맥에서 인스턴스 변수\n        this.count++;         // ✗ static 문맥에 this 없음\n        super.toString();     // ✗ super도 없음\n        inst();               // ✗ 인스턴스 메서드 직접 호출 불가\n    }\n    void inst() { count++; total++; s(); }   // ✓ 인스턴스 문맥은 모두 가능\n}\n```\n\n- 컴파일 에러는 **인스턴스 멤버를 쓴 줄**에서 납니다. 그 메서드를 호출한 줄이 아닙니다.\n- 시그니처를 고르는 문제에서 호출부가 static `main`이고 `findMax(numbers)`처럼 객체 없이 부른다면 정답 메서드에는 `static`이 있어야 합니다.\n- 다른 클래스의 static `main`에서는 `acct.amount = 100;`처럼 참조를 통해야 합니다. `amount = 100;`, `this.amount = 100;`은 에러입니다.\n- 같은 클래스의 `main`이어도 인스턴스 필드는 `e.name = \"Joe\";`처럼 참조로 접근합니다.\n\n```java\npublic class Employee {\n    String name; boolean contract; double salary;\n    public static void main(String[] args) {\n        Employee e = new Employee();\n        e.name = \"Joe\"; e.contract = true; e.salary = 100;  // ✓\n        this.name = \"Joe\";                                  // ✗\n    }\n}\n```", "pitfalls": ["`this.amount = 100;`은 static `main`에서 컴파일 에러입니다. 클래스 안 생성자에서는 정상입니다.", "에러 위치는 static 메서드를 호출한 줄이 아니라 인스턴스 변수를 쓴 줄입니다.", "public이 붙어 가장 완전해 보이는 시그니처라도 static이 없으면 static `main`에서 직접 호출할 수 없습니다.", "`main`의 지역 변수(`acct`)는 다른 클래스의 생성자나 메서드에서 보이지 않습니다."], "qs": [71, 75, 77, 80, 84, 90, 95]}, {"title": "변수 스코프, 섀도잉, this", "body": "- 지역 변수(매개변수 포함)는 선언된 블록 `{}` 안에서만 보입니다. 다른 메서드의 같은 이름 변수와는 무관합니다.\n- 같은 메서드 안에서 아직 살아 있는 지역 변수와 같은 이름을 다시 선언하면 에러입니다. 블록이 끝난 뒤라면 다시 선언할 수 있습니다.\n- for문 헤더에서 선언한 변수는 루프 밖에서 쓸 수 없습니다.\n- 매개변수·지역 변수 이름이 필드와 같으면 **단순 이름은 지역 변수**를 가리킵니다(섀도잉). 필드는 `this.이름`으로 접근합니다.\n- 대입문은 **왼쪽**이 바뀝니다. `this`가 어느 쪽에 붙었는지 보세요.\n\n```java\nclass MyField {\n    int x, y;\n    void doStuff(int x, int y) {\n        this.x = x;   // 필드 x ← 매개변수 x\n        y = this.y;   // 매개변수 y ← 필드 y (필드 y는 그대로)\n    }\n    void set(int x) {\n        x = x;        // 컴파일 ✓, 매개변수 자기 대입이라 필드 변화 없음\n    }\n}\n// m1.x=100, m1.y=200 상태에서 m2.doStuff(m1.x, m1.y) 후\n// m1: 100 200, m2: 100 0\n```\n\n```java\nfor (int i = 0; i < 3; i++) { }\nSystem.out.println(i);     // ✗ i는 for문 밖에서 보이지 않음\n{ int k = 1; }\nint k = 2;                 // ✓ 앞의 k는 블록과 함께 사라짐\nint m = 1;\n{ int m = 2; }             // ✗ 바깥 지역 변수 m과 중복\n```\n\n**출력하는 변수가 누구인지 확인**: 생성자가 필드를 `x * x`로 바꿔도 `main`에서 `System.out.println(x + \" \" + y);`가 출력하는 것은 `main`의 지역 변수 `x`, `y`입니다. `x = 3, y = 5`라면 `3 5`가 출력되고, 필드는 `obj.x`, `obj.y`로 읽어야 9, 25입니다.", "pitfalls": ["`y = this.y;`와 `this.y = y;`는 방향이 반대입니다. 대입의 왼쪽을 먼저 보세요.", "setter에서 `price = price;`는 필드를 바꾸지 않습니다. `this.price = price;`여야 합니다.", "`main`에서 출력하는 이름이 지역 변수라면 객체 필드가 어떻게 바뀌었든 상관없습니다.", "호출 대상이 아닌 객체(m1)의 필드는 다른 객체의 메서드 호출로 바뀌지 않습니다."], "qs": [73, 75, 88, 89, 92]}, {"title": "값에 의한 전달(pass-by-value)", "body": "Java는 **항상 값을 복사해서** 인자를 넘깁니다.\n\n- 기본형: 값 자체가 복사됩니다. 메서드 안에서 매개변수를 바꿔도 호출한 쪽 변수는 그대로입니다.\n- 참조형: **참조값**이 복사됩니다. 그 참조로 객체 상태(필드, 배열 원소)를 바꾸면 호출한 쪽에서도 보입니다. 매개변수에 새 객체를 대입하는 것은 호출한 쪽에 영향이 없습니다.\n- `String`과 래퍼 클래스(`Integer` 등)는 불변입니다. `concat`, `toUpperCase` 등은 새 객체를 반환하므로 반환값을 버리면 효과가 없습니다.\n- `doProduct(item.a1)`처럼 필드를 넘기면 객체가 아니라 그 **값**이 전달됩니다.\n- `Integer`를 `int` 매개변수에 넘기면 언박싱된 값이 복사됩니다.\n\n| 메서드 안에서 한 일 | 호출한 쪽에 보이나 |\n|---|---|\n| 기본형 매개변수에 대입 | ✗ |\n| 참조 매개변수로 필드·원소 변경 | ✓ |\n| 참조 매개변수에 새 객체 대입 | ✗ |\n| String 매개변수에 `concat` 호출, `s = s + \"?\"` | ✗ |\n| StringBuilder 매개변수에 `append` | ✓ |\n\n```java\nstatic void m(int n, int[] arr, StringBuilder sb, String s) {\n    n = 99;\n    arr[0] = 99;\n    arr = new int[]{-1};\n    sb.append(\"!\");\n    s.concat(\"!\");\n    s = s + \"?\";\n}\n// 호출 전: n=1, arr={1}, sb=\"Hi\", s=\"Hi\"\n// m(n, arr, sb, s) 후 출력: 1 99 Hi! Hi\n```\n\n```java\npublic void updatePrice(Product product, double price) {\n    price = price * 2;                       // 지역 복사본만 200\n    product.price = product.price + price;   // 객체 필드는 400\n}\n// prt.price=200, newPrice=100으로 호출 → \"400.0 : 100.0\"\n```", "pitfalls": ["메서드 안에서 매개변수를 바꿔도 호출한 쪽 변수는 그대로입니다. 이름이 같아도(`var1`) 마찬가지입니다.", "변수 이름이 `sb`여도 타입이 String이면 `s.concat(...)`의 반환값을 버리는 순간 아무 효과가 없습니다.", "`doProduct(item.a1)`은 int 값을 넘기므로 `item.a1`은 바뀌지 않습니다.", "참조로 받은 객체의 필드 변경(`product.price = ...`)은 원본에 반영됩니다."], "qs": [73, 81, 88, 89, 92]}, {"title": "메서드 오버로딩과 호출 선택", "body": "**오버로딩**은 이름이 같고 **매개변수 목록**(개수, 타입, 순서)이 다른 메서드입니다.\n\n- 반환 타입, 접근 제어자, throws, static 여부만 다른 것은 오버로딩이 아니라 중복 선언입니다.\n- `int...`와 `int[]`는 같은 시그니처로 취급됩니다.\n\n```java\nstatic void m(int x, int y)         { }            // 기준\nstatic int  m(int a, int b)         { return 0; }  // ✗ 반환 타입만 다름\nstatic void m(long x, long y)       { }            // ✓\nstatic void m(Integer x, Integer y) { }            // ✓\nstatic void m(int... x)             { }            // ✓\nstatic void m(int[] x)              { }            // ✗ int...와 같은 시그니처\n```\n\n**호출할 메서드를 고르는 순서**(선언 순서와 무관)\n\n1. 정확히 일치\n2. 기본형 확대 변환(`int → long → float → double`)\n3. 박싱/언박싱(박싱 후 참조 확대 `int → Integer → Object`는 OK)\n4. 가변 인자\n\n같은 단계에 후보가 여럿이면 가장 구체적인 것을 고르고, 가릴 수 없으면 `ambiguous` 컴파일 에러입니다.\n\n```java\nstatic void p(long x)    { System.out.print(\"long \"); }\nstatic void p(Integer x) { System.out.print(\"Integer \"); }\nstatic void p(int... x)  { System.out.print(\"varargs \"); }\nstatic void q(Object o)  { System.out.print(\"Object \"); }\nstatic void q(int... x)  { System.out.print(\"varargs \"); }\nstatic void s(String x)  { System.out.print(\"String \"); }\nstatic void s(Object x)  { System.out.print(\"Object \"); }\np(5); q(5); s(null);     // long Object String\n```\n\n```java\nstatic void r(Long x) { }\nr(5);                    // ✗ int → Long 불가 (확대 후 박싱 없음)\nstatic void t(int a, long b) { }\nstatic void t(long a, int b) { }\nt(1, 1);                 // ✗ ambiguous\n```\n\n`doSum(Integer,Integer)`, `doSum(double,double)`, `doSum(float,float)`, `doSum(int,int)`이 있을 때 `doSum(10, 20)`은 `int sum is 30`, `doSum(10.0, 20.0)`은 `double sum is 30.0`입니다. int 버전이 없다면 `doSum(10, 20)`은 박싱보다 확대가 우선이라 `float sum is 30.0`입니다.", "pitfalls": ["`Integer` 버전이 맨 위에 선언되어 있어도 정확히 일치하는 `int` 버전이 먼저 선택됩니다.", "int 인자에 대해 `long`/`float`/`double` 버전이 있으면 `Integer` 버전보다 먼저 선택됩니다.", "반환 타입만 다른 두 메서드는 컴파일 에러입니다.", "`\"sum \" + x + y`는 `sum 1020`입니다. `(x + y)`처럼 괄호가 있어야 덧셈이 먼저입니다.", "double·float 결과는 정수 값이어도 `30.0`처럼 소수점이 붙어 출력됩니다."], "qs": [85]}, {"title": "생성자, this() 체인, 초기화 순서", "body": "**생성자 규칙**\n\n- 이름이 클래스명과 같고 **반환 타입이 없습니다**. `void Person()`처럼 반환 타입을 쓰면 그냥 메서드입니다.\n- 생성자를 **하나도 선언하지 않았을 때만** 컴파일러가 인자 없는 기본 생성자를 넣어 줍니다.\n- 같은 클래스의 다른 생성자는 `this(...)`, 부모 생성자는 `super(...)`로 부르며 **첫 문장**이어야 합니다. 그래서 둘을 함께 쓸 수 없습니다.\n- 둘 다 없으면 컴파일러가 첫 줄에 `super();`를 넣습니다. 부모에 인자 없는 생성자가 없으면 에러입니다.\n- 접근 제어자(private 포함)는 붙일 수 있지만 `static`, `final`, `abstract`는 붙일 수 없습니다.\n- 생성자 안에서 인스턴스 메서드를 호출할 수 있습니다.\n\n```java\nclass P {\n    String name; int age;\n    P(String name) { this(name, 0); }                 // ✓ 첫 문장 this(...)\n    P(String name, int age) { this.name = name; this.age = age; }\n}\n// 위 클래스에 아래를 하나씩 추가하면 각각 컴파일 에러\nP(int a, String n) { this(); }              // ✗ P()가 없음 (생성자를 선언했으므로)\nP(int a, String n) { P(n); }                // ✗ 생성자를 이름으로 호출하는 문법 없음\nP(int a, String n) { age = a; this(n); }    // ✗ this(...)는 첫 문장이어야 함\nP(int a) { this(a); }                       // ✗ 재귀 생성자 호출\nstatic P() { }                              // ✗ 생성자에 static 불가\nstatic void g() { new P(); }                // ✗ 기본 생성자 없음\n```\n\n```java\nclass Base { Base(int x) { } }\nclass Sub extends Base { Sub() { } }        // ✗ 묵시적 super()에 맞는 Base()가 없음\n\nclass Q { int v; void Q() { v = 5; } }      // void Q()는 메서드\nnew Q().v                                   // 0 (컴파일러가 만든 기본 생성자 사용)\n```\n\n**초기화 순서**\n\n1. static 필드 초기화식과 static 블록: 클래스가 처음 쓰일 때 한 번, 소스 순서대로\n2. 객체마다: 인스턴스 필드 초기화식과 인스턴스 블록(소스 순서) → 생성자 본문\n\n```java\nclass Init {\n    static { System.out.print(\"S \"); }\n    int a = f(\"F \");\n    { System.out.print(\"I \"); }\n    Init() { System.out.print(\"C \"); }\n    static int f(String s) { System.out.print(s); return 1; }\n}\n// new Init(); new Init();  →  S F I C F I C\n```\n\n**필드 대입 시 변환**: 생성자에서 `contract = new Boolean(true); salary = new Double(100);`은 언박싱되어 정상 동작합니다. `salary = 100;`도 int → double 확대라 정상입니다. 반면 `contract = TRUE;`는 `TRUE`라는 이름이 없어 에러입니다.", "pitfalls": ["생성자를 하나라도 선언하면 기본 생성자가 없어서 `this()`나 `new X()`가 에러가 됩니다.", "`Person(name);`은 컴파일 에러입니다. 같은 클래스의 다른 생성자는 `this(name);`으로 부릅니다.", "에러가 한 줄뿐이라는 보기에 속지 마세요. `this()` 대상 생성자가 없는 줄과 잘못된 생성자 호출 줄이 동시에 에러일 수 있습니다.", "`void ClassName()`은 생성자가 아니라 메서드입니다.", "래퍼 객체(`new Double(100)`)를 기본형 필드에 대입하는 것은 언박싱으로 정상입니다. 대문자 `TRUE`는 에러입니다."], "qs": [77, 83, 89, 96]}, {"title": "접근 제어자", "body": "| 제어자 | 같은 클래스 | 같은 패키지 | 다른 패키지의 하위 클래스 | 그 외 |\n|---|---|---|---|---|\n| `public` | ✓ | ✓ | ✓ | ✓ |\n| `protected` | ✓ | ✓ | ✓ (상속 경로로만) | ✗ |\n| (default) | ✓ | ✓ | ✗ | ✗ |\n| `private` | ✓ | ✗ | ✗ | ✗ |\n\n- 최상위 클래스에는 `public`과 default만 쓸 수 있습니다(`private class`, `protected class`는 에러).\n- **같은 소스 파일, 같은 패키지에 있어도** private 멤버는 다른 클래스에서 쓸 수 없습니다. 같은 클래스 안의 public 메서드가 private 메서드를 부르는 것은 항상 됩니다.\n- 중첩 클래스와 바깥 클래스는 서로의 private 멤버에 접근할 수 있습니다.\n- 지역 변수에는 접근 제어자를 붙일 수 없습니다.\n- **다른 패키지의 protected**: 하위 클래스 안에서 상속받은 멤버를 `this`(생략 포함)나 **자기 타입 참조**로만 쓸 수 있습니다. 상위 타입 참조로는 안 됩니다. 판단 기준은 실제 객체가 아니라 **참조 변수의 선언 타입**입니다.\n\n```java\npackage p1;\npublic class Acc { int p; private int q; protected int r; public int s; }\n```\n```java\npackage p2;\nimport p1.Acc;\npublic class Test extends Acc {\n    void m() {\n        r = 1;               // ✓ 상속받은 protected\n        s = 1;               // ✓\n        p = 1;               // ✗ default는 다른 패키지에서 안 보임\n        q = 1;               // ✗ private\n    }\n    public static void main(String[] args) {\n        Acc obj = new Test();\n        obj.s = 1;           // ✓\n        obj.r = 1;           // ✗ 상위 타입(Acc) 참조로 protected 접근 불가\n        new Test().r = 1;    // ✓ 자기 타입 참조\n        r = 1;               // ✗ static 문맥이라 this가 없음\n    }\n}\n```\n\n```java\nclass Caller {\n    private void init() { }\n    public void start() { init(); }   // ✓ 같은 클래스\n}\npublic class TestCall {\n    public static void main(String[] args) {\n        Caller c = new Caller();\n        c.start();           // ✓\n        c.init();            // ✗ 다른 클래스에서 private 접근\n    }\n}\n```", "pitfalls": ["같은 파일에 있는 클래스끼리도 private 멤버는 보이지 않습니다.", "`Acc obj = new Test();`에서 `obj.r`은 실제 객체가 Test여도 에러입니다. 참조의 선언 타입으로 판단합니다.", "하위 클래스라도 패키지가 다르면 default 멤버는 보이지 않습니다.", "다른 클래스가 호출해야 하는 메서드를 private으로 바꾸면 호출하는 쪽에서 컴파일 에러가 납니다."], "qs": [76, 79, 86, 91, 93, 94]}, {"title": "캡슐화 설계와 불변식", "body": "**캡슐화(encapsulation)**: 접근 제어자로 필드를 숨기고(`private`), 필요한 동작만 `public` 메서드로 공개해 객체가 자기 상태 규칙을 스스로 지키게 하는 설계입니다.\n\n| 개념 | 한 줄 정의 |\n|---|---|\n| 캡슐화 | 데이터를 숨기고 메서드를 통해서만 접근하게 함 |\n| 상속 | 기존 클래스의 멤버를 물려받아 확장함 |\n| 추상화 | 공통 기능만 드러내고 구현 세부를 감춤(추상 클래스, 인터페이스) |\n| 다형성 | 같은 타입의 참조로 여러 구현을 호출함 |\n\n**전형적인 형태(JavaBean 관례)**\n\n- 필드는 `private`, 접근 메서드는 `public`\n- `getX()` / `setX(...)`, boolean 필드는 `isX()`\n- setter에서 값 검증, 필요 없으면 setter를 두지 않아 읽기 전용으로 만듦\n\n**불변식(invariant) 지키기**\n\n- 상태를 바꾸는 **모든 경로**(모든 setter, 생성자)가 불변식을 유지해야 합니다.\n- 다른 필드에서 계산되는 값은 원본 필드를 바꾼 **뒤에** 다시 계산합니다. 아예 getter에서 계산하면 어긋날 일이 없습니다.\n- 불변식을 깨는 public 메서드(검증 없는 setter, 값을 깎는 메서드)를 남기면 안 됩니다.\n\n```java\npublic class Rectangle {\n    private double length, height, area;\n    public void setLength(double length) { this.length = length; setArea(); } // 대입 뒤 재계산\n    public void setHeight(double height) { this.height = height; setArea(); }\n    private void setArea() { area = length * height; }\n    public double getArea() { return area; }\n}\n```\n\n```java\npublic class ElectricAccount {\n    private double kWh;\n    private double rate = 0.07;\n    private double bill;\n    public void addKWh(double kWh) {          // Customer가 불러야 하므로 public\n        if (kWh > 0) {                        // 음수로 bill을 줄이는 것 차단\n            this.kWh += kWh;\n            setBill();\n        }\n    }\n    private void setBill() { bill = this.kWh * rate; }  // 외부에 공개하지 않음\n}\n```\n\n- `addKWh`를 private으로 만들면 `Customer`의 `acct.addKWh(kWh)`가 컴파일 에러입니다.\n- `setBill`이 public이면 외부에서 bill을 조작할 수 있으므로 캡슐화가 깨집니다.\n- public 필드(`public int amount;`)는 외부에서 마음대로 바꿀 수 있어 캡슐화되지 않은 상태입니다.", "pitfalls": ["접근 제어자로 데이터를 숨기는 개념은 Abstraction이 아니라 Encapsulation입니다.", "\"필드를 private으로 바꾼다\"만으로는 부족합니다. 불변식을 깨는 공개 경로가 남았는지 확인하세요.", "파생 값 재계산은 대입 **뒤**에 해야 합니다. setter 첫 줄에서 계산하면 이전 값으로 계산됩니다.", "더 안전해 보이는 private도 다른 클래스가 호출해야 하는 메서드라면 컴파일 에러를 만듭니다."], "qs": [76, 79, 82, 91, 93, 95]}]}, {"topic": "inheritance", "name": "상속과 다형성", "en": "Working with Inheritance", "intro": "상속 계층에서 참조 타입과 실제 객체 타입이 각각 무엇을 결정하는지, 생성자 체인, 오버라이딩 규칙, 추상 클래스와 인터페이스의 구현 의무를 다룹니다. 점수는 주로 컴파일은 되지만 런타임에 실패하는 캐스트, 눈에 보이지 않는 암묵적 `super()` 실패, 인터페이스 상속 사슬에 숨은 미구현 메서드를 놓칠 때 잃습니다.", "sections": [{"title": "상속 기본과 IS-A 관계", "body": "- 클래스는 `extends`로 **하나의** 클래스만 상속합니다. 아무것도 상속하지 않은 클래스도 암묵적으로 `Object`를 상속합니다.\n- 하위 클래스는 상위 클래스의 private이 아닌 필드와 메서드를 물려받습니다. **생성자와 private 멤버는 상속되지 않습니다.**\n- `Child`가 `Parent`를 `extends`/`implements`하면 \"Child IS-A Parent\"이고, `Parent p = new Child();`가 캐스트 없이 됩니다. 반대 방향은 안 됩니다.\n- 같은 부모를 공유하는 형제 타입은 서로 IS-A 관계가 아닙니다.\n- 어떤 필드와 메서드에 접근할 수 있는지는 컴파일러가 **참조 변수의 선언 타입**만 보고 정합니다. 실제로 어떤 객체가 들어 있는지는 보지 않습니다.\n\n| 관계 | 키워드 | 개수 |\n|---|---|---|\n| 클래스 → 클래스 | `extends` | 1개 |\n| 클래스 → 인터페이스 | `implements` | 여러 개 |\n| 인터페이스 → 인터페이스 | `extends` | 여러 개 |\n| 인터페이스 → 클래스 | 불가 | - |\n\n```java\nclass Employee { int salary; }\nclass Manager extends Employee { int budget; }\nclass Director extends Manager { int stockOptions; }\n\nEmployee e = new Manager();     // ✓ 업캐스트는 자동\ne.salary = 10;                  // ✓\ne.budget = 10;                  // ✗ Employee 타입에는 budget이 없음\n((Manager) e).budget = 10;      // ✓ 캐스트하면 접근 가능\nDirector d = new Director();\nd.budget = 1;                   // ✓ 상속받은 필드\nManager m = new Employee();     // ✗ 상위 객체를 하위 타입 변수에 대입 불가\n```\n\n```java\nclass Z extends X, Y { }        // ✗ 클래스 다중 상속 불가\nclass Z implements X, Y { }     // ✓ (X, Y가 인터페이스일 때)\ninterface W extends X, Y { }    // ✓\ninterface Y implements X { }    // ✗ 인터페이스끼리는 extends\ninterface Y extends X { }       // ✗ X가 클래스이면 불가\n```\n\n제네릭 컬렉션의 `add(T)`에도 같은 대입 규칙이 적용됩니다. T 자신이나 T의 하위 타입만 넣을 수 있습니다. 또 제네릭 타입끼리는 공변이 아닙니다.\n\n```java\nabstract class Animal {}  interface Hunter {}\nclass Cat extends Animal implements Hunter {}\nclass Tiger extends Cat {}\n\nList<Cat> cats = new ArrayList<>();\ncats.add(new Tiger());                   // ✓ Tiger IS-A Cat\nList<Hunter> hs = new ArrayList<>();\nhs.add(new Tiger());                     // ✓ 인터페이스 타입도 가능\nList<Tiger> ts = new ArrayList<>();\nts.add(new Cat());                       // ✗ Cat은 Tiger가 아님\nList<Animal> as = new ArrayList<Cat>();  // ✗ 제네릭은 공변이 아님\nAnimal[] arr = new Tiger[1];             // ✓ 배열은 공변\n```", "pitfalls": ["`Employee e = new Manager();`여도 `e.budget`은 컴파일 에러입니다. 접근할 수 있는 멤버는 선언 타입이 정합니다.", "필드 이름의 철자(`stockOption`과 `stockOptions`)까지 확인하세요. 철자가 다르면 그것만으로 컴파일 에러입니다.", "\"같은 부모를 공유한다\"는 형제 관계는 IS-A가 아니므로 `List<Cycle>`에 넣을 수 없습니다.", "`ArrayList<Tiger>`에는 상위 타입인 `Cat`을 넣을 수 없고, `List<Animal> x = new ArrayList<Cat>();`도 컴파일되지 않습니다."], "qs": [106, 114, 115]}, {"title": "생성자 체인: super()와 this()", "body": "1. 모든 생성자의 첫 문장은 `this(...)` 또는 `super(...)`입니다. 둘 다 없으면 컴파일러가 `super();`를 넣습니다.\n2. 둘 다 첫 문장이어야 하므로 **한 생성자에 함께 쓸 수 없고**, 다른 문장 뒤에 둘 수도 없습니다.\n3. 생성자를 **하나도** 작성하지 않았을 때만 컴파일러가 인자 없는 기본 생성자를 만들어 줍니다.\n4. 부모에 인자 없는 생성자가 없으면 자식 생성자는 `super(인자)`를 직접 호출해야 합니다. 자식에 생성자를 아예 쓰지 않아도, 자동으로 생긴 기본 생성자의 `super()`가 실패합니다.\n5. `this(...)`는 **같은 클래스**의 생성자를, `super(...)`는 **직계 부모**의 생성자를 부릅니다. 생성자는 상속되지 않으므로 부모 생성자의 시그니처를 `this(...)`로 부를 수 없습니다.\n6. `super.r = r;`은 부모 필드에 접근하는 것일 뿐 생성자 호출이 아닙니다.\n7. 생성자끼리 `this(...)`로 서로 부르는 순환 호출(recursive constructor invocation)과, 일반 메서드 안에서 `this(...)`를 호출하는 것은 컴파일 에러입니다.\n\n```java\nclass Vehicle {\n    String type = \"4W\";\n    Vehicle(String type, int speed) { this.type = type; }\n}\nclass Car extends Vehicle {\n    Car(String t) { super(t, 100); }                     // ✓\n    Car(int s) { this(\"4W\"); }                           // ✓ 위임한 생성자가 super(...) 호출\n    Car() { }                                            // ✗ 암묵적 super() 실패: Vehicle()이 없음\n    Car(String t, int s) { super(t, s); this(t); }       // ✗ super와 this를 함께 씀\n    Car(long x) { System.out.println(); super(\"x\", 1); } // ✗ super(...)가 첫 문장이 아님\n}\nclass Car2 extends Vehicle { }                           // ✗ 기본 생성자의 super()가 실패\n```\n\n```java\nclass CD { int r; CD(int r) { this.r = r; } }\nclass DVD extends CD {\n    int c;\n    DVD(int r, int c) { super(r); this.c = c; }        // ✓\n    DVD(int r, int c) { super.r = r; this.c = c; }     // ✗ 필드 대입일 뿐, 암묵적 super() 실패\n}\n```\n\n**초기화 순서**: 클래스를 처음 쓸 때 static 초기화가 부모 → 자식 순으로 한 번만 실행됩니다. 그다음 `new`마다 부모의 필드 초기화식과 생성자 본문, 자식의 필드 초기화식과 생성자 본문이 차례로 실행됩니다.\n\n```java\nclass P {\n    static { System.out.println(\"1 P static\"); }\n    String s = log(\"3 P field\");\n    P() { System.out.println(\"4 P ctor\"); }\n    static String log(String x) { System.out.println(x); return x; }\n}\nclass C extends P {\n    static { System.out.println(\"2 C static\"); }\n    String t = log(\"5 C field\");\n    C() { super(); System.out.println(\"6 C ctor\"); }\n}\nnew C();   // 1 P static → 2 C static → 3 P field → 4 P ctor → 5 C field → 6 C ctor\nnew C();   // 두 번째부터는 3 → 4 → 5 → 6 (static은 다시 실행되지 않음)\n```\n\n부모 생성자가 필드를 대입하지 않으면 부모 필드의 초기값(`\"Canine\"`, `60` 등)이 그대로 남습니다.", "pitfalls": ["`super(); this(20);`처럼 두 호출이 한 생성자에 있으면 출력값을 계산할 필요 없이 컴파일 에러입니다.", "부모에 인자 있는 생성자만 있으면 자식의 평범한 생성자도 컴파일 에러입니다(암묵적 `super()` 실패). 에러가 두 군데일 수 있으니 'only' 보기를 조심하세요.", "`super.r = r;`은 부모 생성자 호출이 아닙니다. 부모에 기본 생성자가 없으면 첫 줄에 `super(r)`가 필요합니다.", "부모의 `(String, int)` 생성자를 `this(\"Canine\", 60)`으로 부를 수 없습니다. 생성자는 상속되지 않습니다."], "qs": [102, 112, 113, 117]}, {"title": "메서드 오버라이딩 규칙", "body": "오버라이딩은 상위 클래스의 **인스턴스 메서드**를 같은 시그니처로 다시 정의하는 것입니다. 매개변수 목록이 다르면 오버로딩이며 아래 규칙은 적용되지 않습니다.\n\n| 항목 | 규칙 |\n|---|---|\n| 이름·매개변수 | 정확히 같아야 함 |\n| 반환형 | 같거나 하위 타입(공변 반환형). 기본형은 정확히 같아야 함 |\n| 접근 제어자 | 같거나 넓게만. `public` > `protected` > default > `private` |\n| checked 예외 | 상위가 던지는 것과 같거나 그 하위 타입, 또는 생략. unchecked는 제한 없음 |\n| static | 인스턴스 ↔ static으로 바꾸면 에러. static끼리는 숨기기(hiding) |\n| `final` 메서드 | 오버라이딩 불가 |\n| `private` 메서드 | 상속되지 않음. 같은 이름으로 선언하면 별개의 새 메서드 |\n\n아래의 `Earth` 각 줄은 **하나씩 따로 넣었을 때** 기준입니다.\n\n```java\nclass Planet {\n    protected void revolve() { }\n    Number size() { return 1; }\n    int count() { return 1; }\n    void load() throws IOException { }\n    static void info() { }\n    private void secret() { }\n    final void stop() { }\n}\nclass Earth extends Planet {\n    public void revolve() { }                     // ✓ protected → public으로 넓힘\n    void revolve() { }                            // ✗ protected → default로 좁힘\n    Integer size() { return 2; }                  // ✓ 공변 반환형\n    Object size() { return 2; }                   // ✗ 상위 타입 반환\n    long count() { return 2; }                    // ✗ 기본형 반환형은 정확히 같아야 함\n    void load() throws FileNotFoundException { }  // ✓ 하위 checked 예외\n    void load() throws RuntimeException { }       // ✓ unchecked는 제한 없음\n    void load() { }                               // ✓ 예외 생략\n    void load() throws Exception { }              // ✗ 더 넓은 checked 예외\n    void load(int x) throws Exception { }         // ✓ 매개변수가 달라 오버로딩\n    static void info() { }                        // ✓ 숨기기(오버라이딩 아님)\n    void info() { }                               // ✗ static → 인스턴스\n    static void revolve() { }                     // ✗ 인스턴스 → static\n    void secret() { }                             // ✓ private은 상속되지 않으므로 새 메서드\n    @Override void secret() { }                   // ✗ 오버라이드할 대상이 없음\n    void stop() { }                               // ✗ final 메서드\n}\n```\n\n- 추상 메서드도 default나 `protected`일 수 있습니다. `abstract void rotate();`를 `protected void rotate() { }`로 구현하면 접근 범위를 넓힌 것이므로 합법입니다.\n- 인터페이스 메서드는 암묵적으로 `public`이므로 구현 메서드는 반드시 `public`이어야 합니다.\n- 하위 클래스 안에서 부모 버전을 부르려면 `super.revolve()`처럼 씁니다.", "pitfalls": ["상위의 `protected` 메서드를 접근 제어자 없이(default) 오버라이딩하면 컴파일 에러입니다. `protected`나 `public`으로 고쳐야 합니다.", "\"abstract 메서드는 public이어야 한다\"는 오해입니다. default 접근의 추상 메서드도 합법입니다.", "private 메서드와 같은 시그니처를 선언하는 것은 오버라이딩이 아니므로 반환형이나 예외 규칙이 적용되지 않지만, `@Override`를 붙이면 컴파일 에러입니다.", "반환형이 `int`인 메서드를 `long`으로 오버라이딩할 수 없습니다. 공변 반환형은 참조형에만 해당합니다."], "qs": [108]}, {"title": "다형성과 동적 바인딩", "body": "| 대상 | 결정 기준 |\n|---|---|\n| 호출할 수 있는지(컴파일) | 참조 변수의 선언 타입 |\n| 실행되는 인스턴스 메서드 | 실제 객체 타입 (동적 바인딩) |\n| 필드 | 참조 변수의 선언 타입 |\n| static 메서드 | 참조 변수의 선언 타입 |\n\n- 캐스트는 컴파일러가 보는 참조 타입만 바꿉니다. `(Base) x`로 업캐스트해도 객체는 그대로이므로 실행되는 메서드도 바뀌지 않습니다.\n- `Base b4 = b3;`은 객체 복사가 아니라 같은 객체를 가리키는 참조를 하나 더 만드는 것입니다.\n- 다형성의 이점(개념 문제): 유연하고 확장 가능한 코드, 재사용 가능한 코드, 실행 시점에 동작이 결정되는 동적인 코드입니다. \"더 빠른/효율적인 코드\" 같은 성능 문장은 오답입니다.\n\n```java\nclass Base {\n    String name = \"Base\";\n    void test() { System.out.print(\"Base \"); }\n    static void s() { System.out.print(\"sBase \"); }\n}\nclass Derived extends Base {\n    String name = \"Derived\";\n    void test() { System.out.print(\"Derived \"); }\n    static void s() { System.out.print(\"sDerived \"); }\n    void only() { }\n    void callSuper() { super.test(); }\n}\n\nBase b = new Derived();\nb.test();                                   // Derived\n((Base) b).test();                          // Derived (캐스트해도 객체는 그대로)\nSystem.out.print(b.name + \" \");             // Base (필드는 참조 타입 기준)\nSystem.out.print(((Derived) b).name + \" \"); // Derived\nb.s();                                      // sBase (static은 참조 타입 기준)\n((Derived) b).callSuper();                  // Base (super.test())\nb.only();                                   // ✗ Base 타입에 only()가 없음\n```\n\n**출력 추적 요령**: 변수마다 \"지금 가리키는 `new` 객체\"를 표로 적고, 그 클래스의 메서드를 찾습니다.\n\n```java\n// class Base, DerivedA extends Base, DerivedB extends DerivedA, 모두 test()를 오버라이딩\nBase b1 = new DerivedB();\nBase b2 = new DerivedA();\nBase b3 = new DerivedB();\nBase b4 = b3;          // b4 → b3와 같은 DerivedB 객체\nb1 = (Base) b2;        // b1 → DerivedA 객체\nb1.test();             // DerivedA\nb4.test();             // DerivedB\nBase b5 = (DerivedA) b3;\nb5.test();             // DerivedB (캐스트로 객체가 바뀌지 않음)\n```", "pitfalls": ["`(Base)` 업캐스트를 보고 Base의 메서드가 실행된다고 착각하지 마세요. 실행되는 오버라이딩 메서드는 객체 타입이 정합니다.", "필드와 static 메서드는 다형적으로 동작하지 않고 참조 변수 타입을 따릅니다.", "다형성의 이점을 묻는 문제에서 \"more efficient/faster code\"는 오답입니다. 덤프마다 보기가 달라도 '유연성, 재사용성, 런타임에 동작 결정'이 키워드입니다.", "참조 변수 타입에 없는 메서드는 실제 객체에 있어도 호출할 수 없습니다(컴파일 에러)."], "qs": [98, 101, 103, 105, 110]}, {"title": "참조 형변환과 instanceof", "body": "캐스트는 두 단계로 검사합니다. 컴파일러는 두 타입이 **상속 관계로 이어질 가능성**이 있는지만 보고, JVM은 실행 시 **실제 객체**가 대상 타입인지 확인합니다.\n\n| 경우 | 컴파일 | 런타임 |\n|---|---|---|\n| 하위 → 상위 (업캐스트) | ✓ 캐스트 생략 가능 | 항상 성공 |\n| 상위 → 하위 (다운캐스트) | ✓ 명시적 캐스트 필요 | 실제 객체가 그 타입이 아니면 `ClassCastException` |\n| 관련 없는 클래스 (형제 타입 변수, `String` → `Integer`) | ✗ | - |\n| final이 아닌 클래스 ↔ 인터페이스 | ✓ | 객체가 구현하지 않았으면 `ClassCastException` |\n| final 클래스 → 구현하지 않은 인터페이스 | ✗ | - |\n\n- `instanceof`도 같은 컴파일 규칙을 따릅니다. 관련 없는 타입끼리 쓰면 컴파일 에러이고, `null instanceof X`는 `false`입니다.\n- 실행 시 실패를 막으려면 `if (a instanceof B)`로 먼저 확인합니다.\n\n```java\nclass A { }  class B extends A { }  class C extends A { }\ninterface I { }  final class F { }\n\nA a = new C();\nC c = (C) a;                 // ✓ 실제 객체가 C\nC c2 = a;                    // ✗ 다운캐스트는 명시해야 함\nB b = (B) a;                 // 컴파일 ✓, 런타임 ClassCastException (객체는 C)\nB b2 = (B) c;                // ✗ C와 B는 관련 없는 형제 타입\nI i = (I) a;                 // 컴파일 ✓, 런타임 ClassCastException (C는 I를 구현 안 함)\nI j = (I) new F();           // ✗ F는 final이고 I를 구현하지 않음\nString s = \"x\";\nInteger k = (Integer) s;     // ✗ String과 Integer는 관련 없음\n\nSystem.out.println(a instanceof B);   // false\nSystem.out.println(a instanceof C);   // true\nA n = null;\nSystem.out.println(n instanceof A);   // false\nboolean z = c instanceof B;           // ✗ 관련 없는 타입\n```\n\n인터페이스 타입에서 클래스로의 캐스트도 객체가 맞으면 성공합니다.\n\n```java\ninterface I1 { public void displayI(); }\nabstract class C2 implements I1 { public void displayC2() { System.out.print(\"C2\"); } }\nclass C1 extends C2 { public void displayI() { System.out.print(\"C1\"); } }\n\nC2 obj1 = new C1();\nI1 obj2 = new C1();\nC2 s = (C2) obj2;   // ✓ 인터페이스 → 클래스, 객체가 C1이라 성공\nI1 t = obj1;        // ✓ C2 IS-A I1\nt.displayI();       // C1\ns.displayC2();      // C2  → 전체 출력 C1C2\n```", "pitfalls": ["변수 타입이 공통 부모(`A`)이면 형제 클래스로의 캐스트 `(B) b2`도 컴파일됩니다. 실패는 런타임 `ClassCastException`입니다.", "반대로 변수 타입 자체가 형제 클래스(`C`)이면 `(B) c`와 `c instanceof B` 모두 컴파일 에러입니다.", "인터페이스와 final이 아닌 클래스 사이의 캐스트는 대부분 컴파일되므로 \"Compilation fails\"를 쉽게 고르지 마세요.", "업캐스트 `(A) b2`는 아무것도 바꾸지 않고 항상 성공합니다."], "qs": [98, 100, 105, 115]}, {"title": "추상 클래스와 추상 메서드", "body": "- `abstract class`는 `new`로 직접 생성할 수 없습니다. 참조 타입으로 쓰거나 익명 하위 클래스(`new Toy() { ... }`)를 만드는 것은 됩니다.\n- 생성자, 필드, static 메서드, 구현 메서드, final 메서드, 추상 메서드를 모두 가질 수 있습니다. 생성자는 자식 생성자의 `super(...)`로 호출됩니다.\n- 추상 메서드는 `abstract`를 붙이고 본문 없이 `;`로 끝납니다. 빈 `{ }`(주석만 든 것 포함)도 본문입니다.\n- `abstract`가 없는 메서드는 반드시 본문이 있어야 합니다. 인터페이스처럼 `void f();`만 쓰면 에러입니다.\n- 추상 메서드가 하나라도 있으면 클래스도 abstract여야 합니다. 반대로 추상 메서드가 0개인 추상 클래스는 합법입니다.\n- `abstract`는 `final`, `private`, `static`과 함께 쓸 수 없습니다(셋 다 오버라이딩을 막음). `public`, `protected`, default와는 함께 쓸 수 있습니다.\n- 구체 하위 클래스는 남은 추상 메서드를 **모두** 구현해야 하고, 그렇지 않으면 자신도 abstract로 선언해야 합니다.\n\n```java\nabstract class Toy {\n    int price;\n    Toy() { }                          // ✓ 생성자\n    static void info() { }             // ✓ static 메서드\n    void print() { }                   // ✓ 구현 메서드\n    final void fix() { }               // ✓ final 메서드\n    abstract int calc(Toy t);          // ✓ 추상 메서드\n    abstract void a() { }              // ✗ 추상 메서드에 본문\n    void b();                          // ✗ abstract 없는 본문 없는 메서드\n    final abstract void c();           // ✗\n    private abstract void d();         // ✗\n    static abstract void e();          // ✗\n    Toy make() { return new Toy(); }   // ✗ 추상 클래스는 안에서도 new 불가\n}\nToy t = new Toy() { int calc(Toy x) { return 0; } };  // ✓ 익명 하위 클래스\nclass X { abstract void f(); }         // ✗ 추상 메서드가 있으면 클래스도 abstract\nclass Car extends Toy { }              // ✗ calc() 미구현\nabstract class Car2 extends Toy { }    // ✓ abstract면 구현을 미룰 수 있음\nabstract class Empty { }               // ✓ 추상 메서드가 없어도 됨\n```\n\n\"유효한 추상화 계층\" 문제의 정답 형태는 다음과 같습니다.\n\n```java\npublic abstract class Toy {\n    public abstract int calculatePrice(Toy t);          // ✓\n    public void printToy(Toy t) { /* code */ }          // ✓\n}\npublic int calculatePrice(Toy t);                       // ✗ abstract 누락 (추상 클래스 안)\npublic abstract void printToy(Toy t) { /* code */ }     // ✗ 추상 메서드에 본문\n```", "pitfalls": ["인터페이스처럼 `public void printToy();`라고 쓰면 추상 클래스에서는 컴파일 에러입니다. `abstract`를 명시해야 합니다.", "주석만 든 `{ /* code */ }`도 본문이므로 abstract 메서드에 붙이면 에러입니다.", "추상 클래스 안의 static 메서드, 생성자, 구현 메서드는 모두 합법입니다. \"추상 클래스에는 static이 안 된다\"는 오해입니다.", "추상 클래스 내부 메서드에서도 `new Toy()`는 컴파일 에러입니다."], "qs": [99, 104, 109, 116]}, {"title": "인터페이스와 추상 메서드 구현 의무", "body": "- 인터페이스의 본문 없는 메서드는 암묵적으로 `public abstract`, 필드는 `public static final` 상수입니다.\n- Java 8부터 `default` 메서드(본문 있음, 구현 클래스가 물려받음)와 `static` 메서드(본문 있음, **인터페이스 이름으로만** 호출)를 둘 수 있습니다.\n- 인터페이스에는 생성자가 없고, `protected` 메서드도 둘 수 없습니다.\n- 구현 메서드는 반드시 `public`입니다. 접근 제어자를 생략하면 package-private이 되어 \"weaker access privileges\" 에러가 납니다.\n- 추상 클래스는 인터페이스 메서드를 일부만 구현하거나 하나도 구현하지 않아도 됩니다. 남은 메서드는 **첫 번째 구체 하위 클래스**가 모두 구현해야 합니다. 상위 인터페이스(`Readable extends Downloadable`)에서 내려온 메서드도 포함합니다.\n- 중간 추상 클래스에서 `public abstract void setBookMark();`로 다시 선언해도 구현 의무는 그대로 남습니다.\n- 해결 방법은 (1) 구체 클래스에서 구현하기, (2) 그 클래스도 abstract로 선언하기입니다. 단 (2)를 고르면 그 클래스를 `new`할 수 없습니다.\n\n```java\ninterface Downloadable { void download(); }\ninterface Readable extends Downloadable { void readBook(); }\nabstract class Book implements Readable {        // ✓ download() 미구현 허용\n    public void readBook() { }\n}\nclass EBook extends Book { }                                // ✗ download() 미구현\nclass EBook2 extends Book { public void download() { } }    // ✓\nclass EBook3 extends Book { void download() { } }           // ✗ public보다 좁음\nabstract class EBook4 extends Book { }                      // ✓ 의무를 다시 미룸\n\nBook b = new EBook2();   // ✓ 추상 클래스는 참조 타입으로 사용 가능\nb.readBook();\n```\n\n```java\ninterface Shape {\n    int SIDES = 0;                                // public static final\n    double area();                                // public abstract\n    default String name() { return \"shape\"; }\n    static String info() { return \"info\"; }\n}\nclass Sq implements Shape { public double area() { return 1.0; } }\n\nShape s = new Sq();\nSystem.out.println(s.name() + \" \" + Shape.info() + \" \" + Shape.SIDES + \" \" + Sq.SIDES); // shape info 0 0\nSq.info();           // ✗ static 인터페이스 메서드는 상속되지 않음\ns.info();            // ✗ 인터페이스 이름으로만 호출\nShape.SIDES = 1;     // ✗ final 상수\n```\n\n같은 default 메서드를 두 인터페이스에서 물려받으면 클래스가 직접 오버라이드해야 합니다.\n\n```java\ninterface X { default void hi() { System.out.println(\"X\"); } }\ninterface Y { default void hi() { System.out.println(\"Y\"); } }\nclass Z implements X, Y { }                                     // ✗ 충돌\nclass Z implements X, Y { public void hi() { X.super.hi(); } }  // ✓ new Z().hi() → X\nclass W implements X { void hi() { } }                          // ✗ default 메서드도 public\n```", "pitfalls": ["구체 클래스가 상위 인터페이스의 추상 메서드(`download()`)까지 구현했는지 인터페이스 상속 사슬을 따라가며 확인하세요.", "중간 추상 클래스에 메서드를 `abstract`로 다시 선언해도 구체 클래스의 구현 의무는 사라지지 않습니다.", "인터페이스 메서드를 접근 제어자 없이 구현하면 컴파일 에러입니다.", "구체 클래스를 abstract로 바꾸면 선언 에러는 사라지지만, `new EBook()`이 있는 코드에서는 인스턴스화 에러가 납니다."], "qs": [100, 107, 110, 111, 116]}, {"title": "클래스 선언 수정자와 final", "body": "| 수정자 | 최상위 클래스 | 중첩 클래스 |\n|---|---|---|\n| `public` | ✓ (파일당 하나, 파일 이름과 같아야 함) | ✓ |\n| 생략(package-private) | ✓ | ✓ |\n| `private`, `protected` | ✗ | ✓ |\n| `static` | ✗ | ✓ |\n| `abstract`, `final` | ✓ (둘을 함께는 ✗) | ✓ |\n\n- `final class`는 상속할 수 없고, `final` 메서드는 오버라이딩할 수 없습니다.\n- `abstract`와 `final`은 클래스에서도 메서드에서도 함께 쓸 수 없습니다.\n- private 생성자 **선언** 자체는 합법입니다. 다만 외부에서 `new`할 수 없고, 하위 클래스도 만들 수 없습니다(자식의 `super()`가 접근할 수 없음).\n\n```java\n// 파일 A.java\npublic class A { }                 // ✓ 파일 이름과 같음\nclass B2 { }                       // ✓\nfinal class F2 { }                 // ✓\nabstract class Ab { }              // ✓\nclass H { private H() { } }        // ✓ 선언은 합법\nclass O { private class In { } protected static class S { } }  // ✓ 중첩 클래스\nprivate class C { }                // ✗\nprotected class D { }              // ✗\nstatic class E { }                 // ✗\nfinal abstract class G { }         // ✗\npublic class B { }                 // ✗ public 클래스는 B.java에 있어야 함\nclass G2 extends F2 { }            // ✗ final 클래스 상속\nclass K extends H { }              // ✗ H()가 private\n```", "pitfalls": ["private 생성자만 있는 클래스 선언은 컴파일됩니다. \"객체를 만들 수 없으니 에러\"라고 고르지 마세요.", "최상위 클래스에는 `public`과 생략(default) 접근만 가능합니다. `private class`는 컴파일 에러입니다.", "`final abstract` 조합은 클래스·메서드 모두 컴파일 에러입니다."], "qs": [104]}]}, {"topic": "exceptions", "name": "예외 처리", "en": "Handling Exceptions", "intro": "예외 계층(checked, unchecked, Error), try-catch-finally의 실행 흐름, throw와 throws, 대표 예외 클래스를 다룹니다. 출력을 계산하기 전에 컴파일되는지(catch 순서, 처리되지 않은 checked 예외, 확정 할당)를 먼저 확인하지 않아서 점수를 잃는 경우가 가장 많습니다.", "sections": [{"title": "예외 계층과 checked/unchecked/Error", "body": "모든 예외는 `Throwable`을 상속합니다. `Throwable`의 직접 하위 클래스는 `Error`와 `Exception` 두 개입니다.\n\n| 분류 | 상위 클래스 | 대표 클래스 | 처리 의무 |\n|---|---|---|---|\n| Error | `Error` | `StackOverflowError`, `OutOfMemoryError`, `ExceptionInInitializerError` | 없음 (unchecked) |\n| 런타임 예외 | `RuntimeException` | `NullPointerException`, `ArithmeticException`, `ArrayIndexOutOfBoundsException`, `ClassCastException`, `IllegalArgumentException`, `NumberFormatException`, `IllegalStateException` | 없음 (unchecked) |\n| checked 예외 | 그 외 `Exception` | `Exception` 자신, `IOException`, `FileNotFoundException`, `SQLException` | 처리하거나 선언 (handle or declare) |\n\n- `RuntimeException`은 `Exception`의 하위입니다. `Error`는 `RuntimeException`의 하위가 **아닙니다**. 둘 다 unchecked일 뿐입니다.\n- `Error`는 final이 아니라서 상속할 수 있고, 문법상 catch할 수도 있습니다. 다만 보통 애플리케이션이 복구하리라 기대하지 않는 심각한 문제입니다.\n- `catch (Exception e)`는 `RuntimeException`까지 잡지만 `Error`는 잡지 못합니다. 모두 잡으려면 `catch (Throwable t)`입니다.\n- catch 매개변수와 `throw` 대상은 `Throwable` 하위 타입이어야 합니다.\n- 사용자 정의 예외: `extends Exception`이면 checked, `extends RuntimeException`이면 unchecked입니다.\n\n```java\nclass MyError extends Error { }                  // ✓ Error는 final이 아님\nclass MyChecked extends Exception { }\nclass MyUnchecked extends RuntimeException { }\n\nvoid a() { throw new MyUnchecked(); }            // ✓ 선언 불필요\nvoid b() { throw new MyError(); }                // ✓ 선언 불필요\nvoid c() { throw new MyChecked(); }              // ✗ checked인데 처리·선언 없음\nvoid d() throws MyChecked { throw new MyChecked(); }  // ✓\nvoid e() { try { } catch (String s) { } }        // ✗ Throwable 하위만 catch 가능\n```\n\n```java\ntry { throw new StackOverflowError(); }\ncatch (Exception e) { System.out.println(\"E\"); }\ncatch (Throwable t) { System.out.println(\"T\"); }   // T\n```", "pitfalls": ["`Error`는 `Throwable`의 직접 하위입니다. unchecked라는 공통점 때문에 `RuntimeException`의 하위라고 고르면 틀립니다.", "`Exception` 자신은 checked입니다. `throws Exception`이 붙은 메서드를 부르면 호출하는 쪽이 처리해야 합니다.", "`catch (Exception e)`로는 `OutOfMemoryError`, `StackOverflowError`를 잡을 수 없습니다.", "'RuntimeException은 복구할 수 없다', 'RuntimeException은 반드시 선언해야 한다'처럼 Error와 checked의 특징을 바꿔 붙인 보기를 조심하세요."], "qs": [119, 120, 122, 123, 124]}, {"title": "시험에 나오는 대표 예외", "body": "| 예외 | 상위 클래스 | 대표 상황 |\n|---|---|---|\n| `ArithmeticException` | `RuntimeException` | 정수 `/ 0`, `% 0` |\n| `ArrayIndexOutOfBoundsException` | `IndexOutOfBoundsException` | 배열 인덱스가 범위 밖 |\n| `StringIndexOutOfBoundsException` | `IndexOutOfBoundsException` | `\"abc\".charAt(5)`, `\"abc\".substring(4)` |\n| `IndexOutOfBoundsException` | `RuntimeException` | 빈 `ArrayList`의 `get(0)` |\n| `NullPointerException` | `RuntimeException` | null 참조의 멤버 접근, null 래퍼 언박싱 |\n| `ClassCastException` | `RuntimeException` | 실행 시 실제 객체와 맞지 않는 다운캐스트 |\n| `NumberFormatException` | `IllegalArgumentException` | `Integer.parseInt(\"two\")`, `parseInt(null)`, `parseInt(\"\")` |\n| `IllegalArgumentException`, `IllegalStateException` | `RuntimeException` | 주로 프로그래머나 API가 직접 던짐 |\n| `ExceptionInInitializerError` | `LinkageError` → `Error` | static 초기화 중 예외 |\n| `StackOverflowError` | `VirtualMachineError` → `Error` | 끝없는 재귀 |\n| `OutOfMemoryError` | `VirtualMachineError` → `Error` | 힙 고갈(끝없는 `list.add`) |\n\n```java\nSystem.out.println(10.0 / 0);   // Infinity (예외 없음)\nSystem.out.println(0.0 / 0);    // NaN (예외 없음)\nSystem.out.println(10 / 0);     // ArithmeticException\nObject o = \"a\";\nInteger i = (Integer) o;        // 컴파일 ✓, 실행 시 ClassCastException\nInteger j = (Integer) \"a\";      // ✗ String을 Integer로 캐스트할 수 없음 (컴파일 에러)\nInteger n = null;\nint k = n;                      // NullPointerException (언박싱)\nInteger.parseInt(null);         // NumberFormatException (NPE 아님)\nBoolean.parseBoolean(null);     // false, 예외 없음 (\"true\"를 대소문자 무시로 비교)\n```\n\n```java\nclass Bad { static int x = 1 / 0; }\nBad.x    // ExceptionInInitializerError (원인은 ArithmeticException)\n```\n\n루프 안 try-catch-finally 예:\n\n```java\nString[] arr = {\"10\", \"two\", null};\nint sum = 0;\nfor (String s : arr) {\n    try { sum += Integer.parseInt(s); }\n    catch (NumberFormatException e) { sum += 100; }\n    finally { sum += 1; }\n}\nSystem.out.println(sum);   // 213  (10+1, 100+1, 100+1)\n```", "pitfalls": ["`Integer.parseInt(null)`은 NPE가 아니라 `NumberFormatException`입니다.", "`NumberFormatException`은 `IllegalArgumentException`의 하위라 `catch (IllegalArgumentException e)`에도 잡힙니다.", "실수를 0으로 나누면 예외가 아니라 `Infinity`/`NaN`입니다. 정수 나눗셈만 `ArithmeticException`입니다.", "잘못된 다운캐스트는 실행 시 `ClassCastException`이지만, 상속 관계가 없는 타입끼리의 캐스트는 컴파일 에러입니다."], "qs": [122, 123, 126, 129]}, {"title": "try-catch-finally 실행 흐름", "body": "**흐름 규칙**\n\n1. try에서 예외가 나면 try의 나머지 문장은 건너뜁니다.\n2. 위에서부터 타입이 맞는 **첫 번째 catch 하나만** 실행합니다.\n3. finally를 실행합니다.\n4. 예외가 처리됐으면 try 문 다음으로 진행합니다. 맞는 catch가 없거나 catch에서 다시 예외가 나면 finally만 실행하고 **호출자로 전파**합니다. 이때 try 문 뒤의 코드는 실행되지 않습니다.\n\n- catch 안에서 던진 예외는 **같은 try 문의 다른 catch로 잡히지 않고** 바깥으로 나갑니다.\n- finally는 정상 종료, `return`, 예외 모든 경우에 실행됩니다. 예외는 `System.exit()` 호출 등 JVM이 멈추는 경우입니다.\n- try에서 `return x;`를 만나면 반환값을 먼저 계산해 두고 finally를 실행합니다. 기본형이라면 finally에서 `x`를 바꿔도 반환값은 그대로입니다.\n- finally에 `return`이 있으면 원래 반환값이나 **전파 중이던 예외를 덮어씁니다**.\n\n```java\nstatic int calc() {\n    int x = 1;\n    try { return x; }                          // 반환값 1 확정\n    finally { x = 2; System.out.print(\"F \"); }\n}\nstatic int over() {\n    try { throw new RuntimeException(); }\n    finally { return 3; }                      // 예외가 사라지고 3 반환\n}\n// println(calc()) → F 1,  println(over()) → 3\n```\n\n```java\nstatic void m1() {\n    try { m2(); System.out.print(\"1 \"); }\n    catch (ArithmeticException e) { System.out.print(\"2 \"); throw new IllegalStateException(); }\n    finally { System.out.print(\"3 \"); }\n    System.out.print(\"4 \");                    // 예외 전파 중이라 실행 안 됨\n}\nstatic void m2() { int x = 10 / 0; }\n// main: try { m1(); } catch (RuntimeException e) { System.out.print(\"5 \"); }\n//       System.out.println(\"6\");\n// 출력: 2 3 5 6\n```\n\n**문법**\n\n```java\ntry { }                                       // ✗ catch나 finally가 필요\ntry { } finally { } catch (Exception e) { }   // ✗ 순서는 try → catch → finally\ntry { int t = 1; } finally { System.out.print(t); }   // ✗ t는 try 블록 안에서만 보임\ntry { System.exit(0); } finally { System.out.print(\"F\"); }  // 컴파일 ✓, F 출력 안 됨\n```\n\n- try-catch가 **루프 안**에 있으면 한 번의 예외는 그 반복만 처리하고 루프는 계속됩니다.", "pitfalls": ["finally 뒤의 문장은 예외가 완전히 처리됐을 때만 실행됩니다. 전파 중이면 finally만 실행하고 건너뜁니다.", "catch에서 새 예외를 던지면 같은 try의 다음 catch가 아니라 호출자로 나갑니다.", "`return x;` 뒤 finally에서 `x`를 바꿔도 기본형 반환값은 바뀌지 않습니다.", "finally의 `return`은 반환값과 전파 중인 예외를 모두 덮어씁니다."], "qs": [125, 129, 130]}, {"title": "여러 catch의 순서와 catch할 수 있는 타입", "body": "- catch는 **하위 타입부터 상위 타입 순서**로 씁니다. 상위 타입이 먼저 오면 뒤의 하위 타입 catch는 도달할 수 없어 컴파일 에러입니다.\n- 상속 관계가 없는 예외끼리는 순서가 자유롭습니다.\n- try 블록에서 **절대 던질 수 없는 checked 예외**를 catch하면 컴파일 에러입니다. `Exception`, `Throwable`, unchecked 예외(`RuntimeException`, `Error` 계열)는 언제든 catch할 수 있습니다.\n- 컴파일러는 호출하는 메서드에 **선언된 throws 타입**으로 판단합니다. 본문에서 실제로 던지는 객체의 타입은 보지 않습니다.\n\n```java\ntry { int[] a = new int[2]; a[2] = 10; }\ncatch (Exception e) { System.out.println(\"E\"); }\ncatch (ArrayIndexOutOfBoundsException e) { System.out.println(\"A\"); }  // ✗ 이미 잡힘\n\ntry { } catch (ArithmeticException e) { } catch (NullPointerException e) { }  // ✓ 무관한 타입\ntry { } catch (FileNotFoundException e) { }   // ✗ try에서 던질 수 없는 checked 예외\ntry { int x = 1; } catch (IOException e) { }  // ✗ 같은 이유\ntry { } catch (Exception e) { }               // ✓\ntry { } catch (Throwable t) { }               // ✓\ntry { } catch (RuntimeException e) { }        // ✓\n```\n\n**선언 타입보다 좁게 잡은 경우**\n\n```java\nstatic void open() throws IOException {\n    throw new FileNotFoundException(\"no file\");\n}\npublic static void main(String[] args) {\n    try { open(); }\n    catch (FileNotFoundException e) { System.out.println(\"FNF\"); }\n    // 이 상태로는 ✗ unreported exception IOException\n    // catch (IOException e) { } 를 FNF catch 뒤에 추가하면 ✓, 실행 결과 FNF\n}\n```\n\n`catch (IOException e)`를 `catch (FileNotFoundException e)`보다 **앞**에 두면 FNF catch가 도달 불가가 되어 다시 컴파일 에러입니다.", "pitfalls": ["catch 순서 문제는 출력을 계산하기 전에 컴파일되는지부터 확인하세요. 실행 흐름만 따라가면 'E'를 고르게 됩니다.", "메서드가 `throws IOException`으로 선언됐다면 본문이 `FileNotFoundException`만 던져도 호출하는 쪽은 `IOException`을 처리해야 합니다.", "아무것도 던지지 않는 try에 `catch (IOException e)`를 붙이면 컴파일 에러입니다. `Exception`과 `Throwable`은 예외입니다."], "qs": [121, 122, 126, 128]}, {"title": "throw와 throws: handle or declare", "body": "checked 예외를 던지거나, checked 예외를 선언한 메서드를 호출하는 코드는 둘 중 하나를 해야 합니다.\n\n1. **handle**: 같은 타입이나 상위 타입으로 catch합니다.\n2. **declare**: 자기 메서드에 같은 타입이나 상위 타입을 `throws`로 선언합니다. `main`도 선언할 수 있고, 그러면 JVM으로 전달됩니다.\n\n- `throw`는 예외 **객체 하나를 던지는 문장**입니다: `throw new IOException();`. `new`를 빼면 메서드 호출로 해석되어 에러입니다. `throw` 바로 뒤 문장은 도달 불가라 에러입니다.\n- `throws`는 메서드 선언부에서 \"이 메서드가 던질 수 있는 예외\"를 **선언**합니다. 여러 개는 쉼표로 나열합니다. 본문에서 실제로 던지지 않아도 됩니다.\n- `throws RuntimeException`처럼 unchecked 예외를 선언해도 **호출하는 쪽에는 아무 의무가 없습니다**.\n\n```java\nclass X {\n    public void printFileContent() throws IOException {   // ✓ declare\n        throw new IOException();\n    }\n}\npublic class Test {\n    public static void main(String[] args) throws Exception {  // ✓ 상위 타입으로 declare\n        new X().printFileContent();\n    }\n}\n```\n\n```java\nvoid a() { throw new IOException(); }                 // ✗ 처리·선언 없음\nvoid b() throws IOException { throw IOException(); }  // ✗ new 누락\nvoid c() { throw new RuntimeException(); System.out.println(); }  // ✗ 도달 불가\nvoid d() throws IOException, SQLException { }         // ✓ 던지지 않아도 선언 가능\n```\n\n```java\nvoid readCard(int n) throws Exception { System.out.println(\"Reading Card\"); }\nvoid checkCard(int n) throws RuntimeException { System.out.println(\"Checking Card\"); }\npublic static void main(String[] args) {\n    Test ex = new Test();\n    ex.checkCard(1);   // ✓ unchecked 선언은 의무 없음\n    ex.readCard(1);    // ✗ unreported exception Exception\n}\n```", "pitfalls": ["본문이 `println` 한 줄뿐이어도 `throws Exception`이 선언돼 있으면 호출하는 쪽이 처리해야 합니다.", "`throws RuntimeException`이 붙은 메서드 선언이나 호출은 컴파일 에러가 아닙니다.", "`throw IOException();`처럼 `new`가 빠진 보기를 놓치지 마세요.", "'try-catch로 감싼다'는 보기도 catch의 순서와 타입이 맞는지까지 확인해야 정답입니다."], "qs": [119, 121, 124, 128]}, {"title": "예외 전파, 예외 처리의 장점, 사용자 정의 예외", "body": "**전파**: 예외가 나면 JVM은 현재 메서드에서 맞는 catch를 찾고, 없으면 그 메서드를 비정상 종료하고 호출한 메서드로 넘깁니다. 빠져나가는 각 try의 finally는 실행됩니다. `main`까지 처리되지 않으면 스택 트레이스를 출력하고 그 스레드가 종료됩니다.\n\n```java\nstatic void a() { b(); System.out.print(\"a \"); }   // \"a \"는 실행 안 됨\nstatic void b() { try { c(); } finally { System.out.print(\"fb \"); } }\nstatic void c() { throw new IllegalStateException(); }\n// main: try { a(); } catch (IllegalStateException e) { System.out.print(\"main \"); }\n// 출력: fb main\n```\n\n끝없이 `myList.add(...)`를 하면 `OutOfMemoryError`가 발생합니다. 이는 `Error`라서 `catch (RuntimeException)`과 `catch (Exception)`을 모두 통과하고, 처리되지 않은 채 `main` 스레드가 종료됩니다(뒤의 `\"Ready to use\"`는 출력되지 않음).\n\n**예외 메커니즘의 장점**\n\n- 정상 로직과 오류 처리 코드를 분리합니다.\n- 예외를 호출 스택 위로 전파해 **처리할 위치를 고를 수 있습니다**.\n- 예외 계층으로 오류를 분류하고, 상위 타입으로 묶어서 처리할 수 있습니다.\n- 사용자 정의 예외로 도메인에 맞는 오류를 표현할 수 있습니다.\n\n\"예외는 발생한 메서드에서 반드시 처리해야 한다\"는 틀린 설명입니다.\n\n**사용자 정의 예외**\n\n```java\nclass InsufficientFundsException extends Exception {     // checked\n    InsufficientFundsException(String msg) { super(msg); }\n}\nclass Account {\n    int balance = 10;\n    void withdraw(int amt) throws InsufficientFundsException {\n        if (amt > balance) throw new InsufficientFundsException(\"balance \" + balance);\n        balance -= amt;\n    }\n}\ntry { new Account().withdraw(50); }\ncatch (InsufficientFundsException e) {\n    System.out.println(e.getMessage());   // balance 10\n    System.out.println(e);                // InsufficientFundsException: balance 10\n}\n```\n\n- 예외의 `toString()`은 `클래스의 완전한 이름: 메시지` 형식입니다(`java.lang.RuntimeException: x`). 메시지 없이 만들면 `getMessage()`는 `null`입니다.", "pitfalls": ["'반드시 발생한 메서드에서 처리해야 한다'는 장점이 아니라 틀린 규칙입니다. 그럴듯한 앞부분에 속지 마세요.", "처리되지 않은 예외가 메서드를 빠져나가면 그 메서드와 호출한 메서드들의 나머지 코드는 실행되지 않습니다. finally만 실행됩니다.", "catch가 두 개 있어도 둘 다 `Exception` 계열이면 `Error`는 잡히지 않습니다."], "qs": [119, 123, 130]}, {"title": "확정 할당과 도달 가능성", "body": "**확정 할당(definite assignment)**: 지역 변수는 읽기 전에 **모든 경로**에서 값이 대입됐음을 컴파일러가 증명할 수 있어야 합니다.\n\n- 컴파일러는 변수의 실제 값을 추적하지 않습니다. 상수 식(`true` 리터럴 등)만 예외입니다.\n- try 블록 안의 대입은 예외 때문에 실행되지 않았을 수 있다고 봅니다. try 문 뒤에서 변수를 읽으려면 **정상 종료하는 모든 catch**에서도 대입하거나, 그 catch를 `return`/`throw`로 끝내거나, finally에서 대입해야 합니다.\n\n```java\nint ans;\ntry { int num = 10, div = 0; ans = num / div; }\ncatch (ArithmeticException ae) { ans = 0; }\ncatch (Exception e) { System.out.println(\"Invalid calculation\"); }\nSystem.out.println(\"Answer = \" + ans);   // ✗ 두 번째 catch 경로에서 미할당\n// 두 번째 catch에 return; 또는 ans = -1; 을 넣으면 ✓, 출력 Answer = 0\n```\n\n```java\nint y;\ntry { y = 1; } finally { }\nSystem.out.println(y);          // ✓ try가 정상 종료해야 여기 도달\nboolean flag = true;\nint x;\nif (flag) x = 1;\nSystem.out.println(x);          // ✗ flag 값은 추적하지 않음\nint z;\nif (true) z = 1;\nSystem.out.println(z);          // ✓ 상수 조건\n```\n\n**도달 가능성(reachability)**: `return`, `throw`, `break`, `continue` 바로 뒤의 문장과, `break` 없는 `while (true)` 바로 뒤의 문장은 도달 불가라 컴파일 에러입니다. 그런데 `while (true)`가 try 안에 있고 정상 종료할 수 있는 catch가 있으면 **try 문 뒤는 도달 가능**합니다.\n\n```java\nwhile (true) { }\nSystem.out.println(\"x\");        // ✗ 도달 불가\n\ntry { while (true) { list.add(\"s\"); } }\ncatch (RuntimeException re) { }\nSystem.out.println(\"Ready\");    // ✓ catch가 정상 종료할 수 있음\n```", "pitfalls": ["'0으로 나누니까 반드시 ArithmeticException catch로 간다'는 실행 흐름은 컴파일러가 고려하지 않습니다. 모든 catch 경로를 검사합니다.", "catch 하나라도 변수를 대입하지 않고 정상 종료하면 try 문 뒤에서 그 변수를 읽을 수 없습니다.", "`break` 없는 `while (true)` 바로 뒤는 컴파일 에러지만, 루프가 try 안에 있으면 try 문 뒤는 도달 가능합니다."], "qs": [118, 123]}, {"title": "오버라이딩과 throws 규칙", "body": "오버라이딩 메서드의 `throws` 절 규칙\n\n1. 부모 메서드가 선언하지 않은 **새 checked 예외나 더 넓은 checked 예외**는 선언할 수 없습니다.\n2. 부모 예외의 하위 타입으로 좁히거나 throws를 **아예 생략**할 수 있습니다.\n3. unchecked 예외는 종류와 개수에 제한이 없습니다.\n\n이유는 다형성입니다. `Reader r = new FileReader2(); r.read();`를 쓰는 코드는 `IOException`만 처리하도록 작성되어 있으므로, 자식이 더 넓은 checked 예외를 던지면 그 코드가 깨집니다.\n\n```java\nclass Reader { void read() throws IOException { } }\n\nclass R1 extends Reader { void read() { } }                               // ✓ 생략\nclass R2 extends Reader { void read() throws FileNotFoundException { } }  // ✓ 하위 타입\nclass R3 extends Reader { void read() throws IOException, IllegalArgumentException { } } // ✓ unchecked 추가\nclass R7 extends Reader { public void read() throws IOException { } }     // ✓ 접근 범위 확대\nclass R4 extends Reader { void read() throws Exception { } }              // ✗ 더 넓은 checked\nclass R5 extends Reader { void read() throws SQLException { } }           // ✗ 새 checked\nclass R6 extends Reader { private void read() { } }                       // ✗ 접근 범위 축소\nclass R8 extends Reader { void read(int n) throws Exception { } }         // ✓ 오버로딩이라 제한 없음\n```\n\n- 하나라도 규칙을 어기면 전체가 에러입니다. `throws IOException, SQLException`은 `SQLException` 때문에 에러입니다.\n- 호출하는 쪽의 처리 의무는 **참조 변수의 선언 타입**의 메서드를 기준으로 합니다. `Reader r = new R1(); r.read();`는 R1이 throws를 생략했어도 `IOException`을 처리해야 합니다. `R1 r1 = new R1(); r1.read();`는 처리하지 않아도 됩니다.\n- 오버라이딩 체크리스트: 이름과 매개변수 동일, 반환 타입은 같거나 하위 타입(공변), 접근 범위는 같거나 넓게, checked 예외는 같거나 좁게.", "pitfalls": ["보기에 `RuntimeException`이 섞여 있어도 목록의 checked 예외를 하나씩 따로 확인해야 합니다.", "throws를 생략하거나 하위 타입으로 좁히는 것은 항상 허용됩니다.", "매개변수가 다르면 오버로딩이라 throws 제한이 없습니다.", "접근 제어자를 좁히는 것도 오버라이딩 에러입니다(default → private 불가)."], "qs": [127]}]}, {"topic": "api", "name": "Java API", "en": "Selected Classes from the Java API", "intro": "String, StringBuilder, ArrayList, 람다와 Predicate, java.time(LocalDate·LocalDateTime·DateTimeFormatter·Period)의 시험 범위 메서드를 다룹니다. 점수는 대부분 불변 객체 메서드의 반환값을 버리는 코드, `remove(int)`와 `remove(Object)` 오버로딩, 인덱스 경계, 그리고 컴파일 에러와 런타임 예외를 구분하지 못할 때 잃습니다.", "sections": [{"title": "String 생성과 == / equals()", "body": "- `==`는 두 참조가 **같은 객체**인지, `equals()`는 **내용**이 같은지 비교합니다. String은 `equals()`를 내용 비교로 재정의했습니다.\n- 리터럴과 **컴파일 타임 상수식**(`\"Ja\" + \"va\"`, final 상수끼리의 연결)은 상수 풀의 같은 객체를 씁니다. 그래서 `==`가 `true`입니다.\n- 실행 중에 만들어지는 문자열은 새 객체입니다. `new String(...)`, 변수가 낀 `+`, `concat()`, `StringBuilder.toString()`이 그렇습니다. 그래서 리터럴과 `==`로 비교하면 `false`입니다.\n- `intern()`은 풀에 있는 같은 내용의 객체를 돌려줍니다.\n- `equalsIgnoreCase()`는 대소문자를 무시하고 비교합니다.\n- `\"Java\".equals(sb)`처럼 인자가 String이 아니면 `false`입니다. `StringBuilder`와 `String`을 `==`로 비교하면 관련 없는 타입이라 컴파일 에러입니다.\n\n```java\nString a = \"Java\";\nString b = \"Ja\" + \"va\";        // 컴파일 시 상수\nString p = \"Ja\";\nString c = p + \"va\";           // 런타임 연결 → 새 객체\nfinal String f = \"Ja\";\nString d = f + \"va\";           // f가 상수 → 컴파일 시 상수\nString e = new String(\"Java\");\n\nSystem.out.println(a == b);                     // true\nSystem.out.println(a == c);                     // false\nSystem.out.println(a == d);                     // true\nSystem.out.println(a == e);                     // false\nSystem.out.println(a.equals(e));                // true\nSystem.out.println(a == e.intern());            // true\nSystem.out.println(\"JAVA\".equalsIgnoreCase(a)); // true\n\nString s3 = \"\";\nfor (String x : new String[]{\"J\", \"a\", \"v\", \"a\"}) s3 = s3 + x;\nSystem.out.println((a == s3) + \", \" + a.equals(s3));   // false, true\n```\n\n```java\nStringBuilder sb1 = new StringBuilder(\"Duke\");\nString str1 = sb1.toString();\nString str2 = str1;\nSystem.out.println(str1 == str2);                // true (같은 참조)\nSystem.out.println(str1 == sb1.toString());      // false (toString()은 매번 새 String)\n\nStringBuilder sb = new StringBuilder(\"a\");\nString s = \"a\";\nboolean z = (sb == s);                           // ✗ incomparable types\n```", "pitfalls": ["반복문에서 `+`로 이어 붙인 문자열은 내용이 같아도 리터럴과 `==`가 `false`입니다.", "`sb.toString()`을 다시 호출하면 새 객체가 나옵니다. `==`가 `true`이려면 같은 참조를 대입해야 합니다.", "`final` 지역 변수끼리의 연결은 컴파일 타임 상수라 `==`가 `true`입니다.", "`StringBuilder == String`은 `false`가 아니라 컴파일 에러입니다."], "qs": [143, 151, 154]}, {"title": "String 불변성과 반환값", "body": "- String 객체는 만들어진 뒤 내용이 바뀌지 않습니다.\n- `concat`, `replace`, `trim`, `toUpperCase`, `toLowerCase`, `substring`은 모두 **새 String을 반환**합니다. 반환값을 대입하지 않으면 아무 효과가 없습니다.\n- `s += \"x\";`와 `s = s.concat(\"x\");`는 새 객체를 변수에 다시 대입하는 것입니다.\n- 향상된 for문의 변수는 요소 참조를 복사한 지역 변수입니다. 거기에 대입해도 배열은 바뀌지 않으므로 `arr[i] = ...`로 대입해야 합니다.\n- `concat(null)`은 `NullPointerException`이고, `+` 연산자는 `null`을 `\"null\"`로 붙입니다.\n- `isEmpty()`는 `length() == 0`일 때만 `true`입니다. 공백만 있는 `\" \"`은 비어 있지 않습니다(`isBlank()`는 Java 11 API라 범위 밖).\n\n```java\nString ta = \"A \";\nta = ta.concat(\"B \");          // 대입 → 반영\nString tb = \"C \";\nta = ta.concat(tb);\nta.replace('C', 'D');          // 반환값 버림 → 효과 없음\nta = ta.concat(tb);\nSystem.out.println(ta);        // A B C C\n\nString str = \" \";\nstr.trim();\nSystem.out.println(str.equals(\"\") + \" \" + str.isEmpty());  // false false\n\nString myStr = \"Hello World \";\nmyStr.trim();\nSystem.out.println(myStr.indexOf(\" \"));                    // 5\n\nString u = \"ab\";\nu.toUpperCase();  System.out.println(u);       // ab\nu = u.toUpperCase();  System.out.println(u);   // AB\n```\n\n```java\nString[] strs = {\"A\", \"B\"};\nfor (String s : strs) { s = s.concat(\"!\"); }  // 지역 변수 s만 바뀜\nSystem.out.println(strs[0] + strs[1]);        // AB\nstrs[0] = strs[0].concat(\"!\");                // 요소 자리에 대입\nSystem.out.println(strs[0]);                  // A!\n\nString n = null;\nSystem.out.println(\"a\" + n);                  // anull\n\"a\".concat(n);                                // NullPointerException\n```\n\n반대로 `StringBuilder`의 `append`, `insert`, `reverse`, `delete`는 객체 자체를 바꾸므로 대입하지 않아도 반영됩니다.", "pitfalls": ["`s.trim();`, `s.concat(...)`, `s.replace(...)`처럼 대입 없는 호출은 원본을 바꾸지 않습니다.", "한 코드 안에서 어떤 호출은 대입하고 어떤 호출은 버립니다. 줄마다 대입 여부를 확인하세요.", "for-each 변수에 새 String을 대입하거나 결과를 버려도 배열 요소는 그대로입니다.", "`\" \".isEmpty()`는 `false`입니다. 길이가 1이기 때문입니다."], "qs": [135, 142, 150, 153]}, {"title": "String 주요 메서드와 인덱스 규칙", "body": "| 메서드 | 동작 | 예 → 결과 |\n|---|---|---|\n| `length()` | 문자 수(공백 포함) | `\"Java Duke\".trim().length()` → `9` |\n| `charAt(i)` | i번째 문자, 0 ~ `length()-1` | `\"Java\".charAt(2)` → `v` |\n| `substring(b)` / `substring(b, e)` | b부터 e-1까지, 길이 e-b | `\"Thomas\".substring(2, 6)` → `omas` |\n| `indexOf(x)` / `indexOf(x, from)` | 첫 위치, 없으면 `-1` | `\"banana\".indexOf('a', 2)` → `3` |\n| `lastIndexOf(x)` | 마지막 위치 | `\"Hello World \".lastIndexOf(\" \")` → `11` |\n| `trim()` | **앞뒤** 공백만 제거 | `\"  a b  \".trim()` → `a b` |\n| `replace(a, b)` | 모두 치환(char 또는 문자열) | `\"aXbX\".replace('X', '-')` → `a-b-` |\n| `startsWith` / `endsWith` / `contains` | boolean | `\"Java\".contains(\"av\")` → `true` |\n| `toUpperCase` / `toLowerCase` | 대소문자 변환 | `\"Java\".toUpperCase()` → `JAVA` |\n\n- `substring`: `begin < 0`, `end > length()`, `begin > end` 중 하나라도 해당하면 `StringIndexOutOfBoundsException`입니다. `end == length()`는 허용되고, `begin == end`이면 빈 문자열입니다.\n- `charAt(length())`도 `StringIndexOutOfBoundsException`입니다. `indexOf`는 못 찾아도 예외 없이 `-1`입니다.\n- 가운데 공백까지 없애려면 `replace(\" \", \"\")`를 씁니다.\n- 길이는 String·StringBuilder가 `length()`, 배열이 `length` 필드, 컬렉션이 `size()`입니다.\n\n```java\n\"Peter\".substring(2, 5);   // \"ter\"\n\"Peter\".substring(2, 6);   // StringIndexOutOfBoundsException (end > length)\n\"Peter\".substring(3, 2);   // StringIndexOutOfBoundsException (begin > end)\n\"abc\".substring(3);        // \"\" (begin == length는 허용)\n\"Java\".charAt(4);          // StringIndexOutOfBoundsException\n\"abc\".indexOf(\"z\");        // -1\n\"a b\".replace(\" \", \"\");    // \"ab\"\n\"Java SE 8 1\".trim().length();   // 11\n\nString s = \"a\";  int[] arr = {1};  List<String> l = new ArrayList<>();\nint n = s.length() + arr.length + l.size();  // ✓\nint n1 = s.length;         // ✗ String은 메서드\nint n2 = arr.length();     // ✗ 배열은 필드\nint n3 = l.length();       // ✗ 컬렉션은 size()\n```\n\n예외가 루프 전체를 감싼 try 안에서 나면 루프가 중단되고, catch 다음 코드는 정상 실행됩니다.\n\n```java\nString names[] = {\"Thomas\", \"Peter\", \"Joseph\"};\nString pwd[] = new String[3];\nint idx = 0;\ntry {\n    for (String n : names) { pwd[idx] = n.substring(2, 6); idx++; }\n} catch (Exception e) { System.out.println(\"Invalid Name\"); }\nfor (String p : pwd) System.out.println(p);\n// Invalid Name / omas / null / null\n```", "pitfalls": ["`trim()`은 가운데 공백을 지우지 않습니다. `\"Java Duke\".trim().length()`는 8이 아니라 9입니다.", "길이 5인 `\"Peter\"`에 `substring(2, 6)`을 쓰면 예외입니다. 끝 인덱스는 `length()`까지만 허용됩니다.", "try 안에서 예외가 나도 catch 뒤 코드는 계속 실행되고, 값이 대입되지 않은 String 배열 요소는 `null`로 출력됩니다.", "마지막 인덱스(`length()-1`)와 길이를 혼동하지 마세요. `\"Java SE 8 1\"`의 길이는 11, 마지막 인덱스는 10입니다."], "qs": [144, 146, 150, 152]}, {"title": "StringBuilder", "body": "- 가변 객체입니다. `append`, `insert`, `delete(start, end)`, `deleteCharAt`, `replace(start, end, str)`, `reverse`는 객체 자신을 바꾸고 `this`를 반환하므로 체이닝할 수 있습니다. `setLength(n)`도 객체를 바꿉니다.\n- `substring`, `charAt`, `indexOf`, `length`, `toString`은 내용을 바꾸지 않습니다. 특히 `substring()`은 **String**을 반환합니다.\n- 생성자는 세 가지입니다. `new StringBuilder()`는 용량 16인 빈 객체, `new StringBuilder(int)`는 그 용량의 빈 객체(내용 아님), `new StringBuilder(String)`은 그 내용으로 시작하는 객체를 만듭니다.\n- 비우기는 `sb.delete(0, sb.length())` 또는 `sb.setLength(0)`입니다.\n- `delete`의 end가 길이보다 크면 길이까지로 보정됩니다. start가 end보다 크면 `StringIndexOutOfBoundsException`입니다.\n- `equals()`를 재정의하지 않았으므로 **참조 비교**입니다. 내용 비교는 `sb.toString().equals(...)` 또는 `str.contentEquals(sb)`를 씁니다.\n- `append(CharSequence s, int start, int end)`의 세 번째 인자는 끝 인덱스(제외)이고, `append(char[] s, int offset, int len)`의 세 번째 인자는 길이입니다.\n\n```java\nStringBuilder sb = new StringBuilder(\"abcdef\");\nString r = sb.substring(1, 3);         // r = \"bc\", sb는 그대로 abcdef\nsb.delete(1, 3);                       // adef\nsb.insert(1, \"XY\");                    // aXYdef\nsb.deleteCharAt(0);                    // XYdef\nsb.replace(0, 2, \"_\");                 // _def\nsb.reverse();                          // fed_\nsb.append(1).append('c').append(true); // fed_1ctrue\nsb.delete(0, sb.length());             // 빈 문자열, length() == 0\n\nnew StringBuilder(\"hello\").delete(2, 100);   // he (end 초과는 보정)\nnew StringBuilder(\"abc\").delete(2, 1);       // StringIndexOutOfBoundsException\nnew StringBuilder(5).length();               // 0 (용량만 5)\nnew StringBuilder().capacity();              // 16\nnew StringBuilder(\"ab\").capacity();          // 18\n```\n\n```java\nString cc = \"1234-5678-9101-1121\";\nString m1 = \"XXXX-XXXX-XXXX-\" + cc.substring(15, 19);              // XXXX-XXXX-XXXX-1121\nStringBuilder m2 = new StringBuilder(\"XXXX-XXXX-XXXX-\").append(cc, 15, 19); // XXXX-XXXX-XXXX-1121\nnew StringBuilder().append(\"abcdef\", 1, 3);                // bc  (끝 인덱스 3)\nnew StringBuilder().append(\"abcdef\".toCharArray(), 1, 3);  // bcd (길이 3)\n\nStringBuilder e1 = new StringBuilder(\"Java\");\nString s = \"Java\";\nSystem.out.println(e1.equals(s) + \" \" + s.equals(e1) + \" \" + e1.equals(new StringBuilder(\"Java\")));  // false false false\nSystem.out.println(e1.toString().equals(s) + \" \" + s.contentEquals(e1));                            // true true\n\nint n = sb.size();                      // ✗ length()를 써야 함\nsb.removeAll();                         // ✗ 없는 메서드\nStringBuilder t = sb.substring(1);      // ✗ substring은 String 반환\nStringBuilder u = \"abc\";                // ✗ String을 대입할 수 없음\n```", "pitfalls": ["`new StringBuilder(5)`는 내용 \"5\"가 아니라 용량 5인 빈 객체입니다. `toString()`은 빈 문자열입니다.", "`sb.equals(s)`는 내용 비교가 아닙니다. 내용이 같아도 `false`이므로 `toString()`으로 바꾼 뒤 비교합니다.", "`sb.substring(...)`은 sb를 자르지 않고 새 String을 반환합니다.", "`append(creditCard, 15, 19)`의 19는 길이가 아니라 끝 인덱스입니다.", "StringBuilder를 비우는 메서드는 `delete(0, sb.length())`/`setLength(0)`입니다. `size()`와 `removeAll()`은 없습니다."], "qs": [133, 141, 145, 151, 154]}, {"title": "문자열 연결(+)과 toString()", "body": "- `+`는 왼쪽부터 평가합니다. 피연산자 중 하나가 String이 되는 순간부터 문자열 연결이고, 그 전까지는 숫자 덧셈입니다. `char`끼리 더하면 숫자입니다.\n- 객체를 연결하면 그 객체의 `toString()` 결과가 붙고, `null`이면 `\"null\"`이 붙습니다. `System.out.println(obj)`도 같은 규칙입니다.\n- `String`, `StringBuilder`, 래퍼 클래스, `ArrayList` 같은 컬렉션은 `toString()`을 재정의해 내용을 돌려줍니다.\n- 직접 만든 클래스가 `toString()`을 재정의하지 않으면 `Object.toString()`이 쓰여 `패키지.클래스명@16진수해시`가 출력됩니다. 배열도 `[I@...` 형태이고, 내용을 보려면 `Arrays.toString()`을 씁니다.\n- 접근 제어자를 생략한 클래스·생성자는 같은 패키지 안이면 다른 파일에서도 사용할 수 있습니다.\n\n```java\nSystem.out.println(1 + 2 + \"a\");      // 3a\nSystem.out.println(\"a\" + 1 + 2);      // a12\nSystem.out.println(\"a\" + (1 + 2));    // a3\nSystem.out.println('a' + 'b' + \"c\");  // 195c (char끼리는 숫자 덧셈)\nSystem.out.println(\"c\" + 'a' + 'b');  // cab\n\nList<String> l = new ArrayList<>();\nl.add(\"x\"); l.add(null);\nSystem.out.println(l);                                 // [x, null]\nSystem.out.println(Arrays.toString(new int[]{1, 2}));  // [1, 2]\n```\n\n```java\npackage p1;\nclass MyString { String msg; MyString(String m) { msg = m; } }   // toString() 재정의 없음\npublic class Test {\n    public static void main(String[] a) {\n        System.out.println(\"Hello \" + new StringBuilder(\"Java SE 8\")); // Hello Java SE 8\n        System.out.println(\"Hello \" + new MyString(\"Java SE 8\"));     // Hello p1.MyString@(해시값)\n        System.out.println(new int[0]);                                // [I@(해시값)\n    }\n}\n```", "pitfalls": ["필드에 \"Java SE 8\"이 있어도 `toString()`을 재정의하지 않으면 `클래스명@해시`가 출력됩니다.", "같은 패키지의 package-private 클래스는 다른 파일에서도 쓸 수 있으므로 컴파일 에러가 아닙니다.", "`1 + 2 + \"a\"`는 `3a`, `\"a\" + 1 + 2`는 `a12`입니다. 연결이 시작되는 위치를 확인하세요."], "qs": [155]}, {"title": "ArrayList 기본 사용", "body": "| 메서드 | 반환 | 인덱스 범위 / 비고 |\n|---|---|---|\n| `add(e)` | `boolean` | 끝에 추가 |\n| `add(i, e)` | `void` | `0 ≤ i ≤ size()` (끝 위치 포함) |\n| `get(i)` | 요소 | `0 ≤ i < size()` |\n| `set(i, e)` | **이전** 요소 | `0 ≤ i < size()` |\n| `remove(i)` | 지운 요소 | `0 ≤ i < size()` |\n| `remove(o)` | `boolean` | 첫 번째 일치 하나만, 없으면 `false` |\n| `indexOf(o)` / `contains(o)` | `int`(없으면 -1) / `boolean` | `equals()`로 비교 |\n| `size()` / `isEmpty()` / `clear()` | | |\n\n- 범위를 벗어난 인덱스는 `IndexOutOfBoundsException`입니다.\n- 삽입과 삭제 뒤에는 뒤쪽 요소의 인덱스가 밀리거나 당겨집니다.\n- `indexOf`, `contains`, `remove(Object)`는 `equals()`로 비교합니다. `equals()`를 재정의하지 않은 클래스는 참조가 같아야만 찾습니다. String과 래퍼는 내용으로 찾습니다.\n- 중복과 `null`을 허용하고, `toString()`은 `[a, b]` 형식입니다.\n- `Arrays.asList(...)`는 고정 크기 리스트입니다. `set`은 되지만 `add`/`remove`는 `UnsupportedOperationException`입니다. 크기를 바꾸려면 `new ArrayList<>(Arrays.asList(...))`로 복사합니다.\n- 제네릭 타입 인자에 기본형은 쓸 수 없고, 다이아몬드 `<>`는 오른쪽에만 씁니다. raw 타입 `List`의 `get()`은 `Object`를 반환합니다.\n\n```java\nList<String> colors = new ArrayList<>();\ncolors.add(\"green\"); colors.add(\"red\"); colors.add(\"blue\"); colors.add(\"yellow\");\ncolors.remove(2);                            // blue 삭제 → [green, red, yellow]\ncolors.add(3, \"cyan\");                       // 3 == size() → 끝에 추가\nSystem.out.println(colors);                  // [green, red, yellow, cyan]\nSystem.out.println(colors.set(0, \"black\"));  // green (이전 값)\n\nList<String> names = new ArrayList<>(Arrays.asList(\"Robb\", \"Bran\", \"Rick\", \"Bran\"));\nSystem.out.println(names.remove(\"Bran\") + \" \" + names.remove(\"Jon\"));  // true false\nSystem.out.println(names);                   // [Robb, Rick, Bran]\n```\n\n```java\nclass Patient { String name; Patient(String n) { name = n; } }  // equals() 재정의 없음\n\nList<Patient> ps = new ArrayList<>();\nPatient p2 = new Patient(\"Mike\");\nps.add(p2);\nps.indexOf(p2);                    // 0\nps.indexOf(new Patient(\"Mike\"));   // -1 (다른 객체)\nps.indexOf(Patient(\"Mike\"));       // ✗ new 없는 생성자 호출은 메서드 호출로 해석\n\nList<String> fixed = Arrays.asList(\"a\", \"b\");\nfixed.set(0, \"z\");                 // ✓ [z, b]\nfixed.add(\"c\");                    // UnsupportedOperationException\nfixed.remove(0);                   // UnsupportedOperationException\n\nList<int> l1 = new ArrayList<>();          // ✗ 기본형 타입 인자\nList<> l2 = new ArrayList<String>();       // ✗ 다이아몬드는 오른쪽에만\nList raw = new ArrayList();\nraw.add(\"g\");\nString s = raw.get(0);                     // ✗ raw 타입은 Object 반환\nString t = (String) raw.get(0);            // ✓\n```", "pitfalls": ["삭제 후에는 뒤 요소의 인덱스가 당겨집니다. 연산마다 리스트 상태를 적어 보며 추적하세요.", "`add(size(), e)`는 합법(끝에 추가)이지만 `get(size())`는 `IndexOutOfBoundsException`입니다.", "없는 요소를 `remove(Object)`하면 예외 없이 `false`이고, 중복된 요소는 첫 번째 하나만 지워집니다.", "`equals()`를 재정의하지 않은 클래스는 필드가 같은 새 객체로 `indexOf`/`contains`를 해도 찾지 못합니다."], "qs": [140, 156, 157]}, {"title": "List.remove(int)와 remove(Object)", "body": "- `List`에는 `remove(int index)`와 `remove(Object o)`가 오버로딩되어 있습니다.\n\n| 메서드 | 삭제 대상 | 반환 | 실패 시 |\n|---|---|---|---|\n| `remove(int index)` | 그 위치의 요소 | 지운 요소 | `IndexOutOfBoundsException` |\n| `remove(Object o)` | `equals()`로 처음 일치하는 요소 하나 | `boolean` | `false` (예외 없음) |\n\n- 오버로딩 해석은 1) 정확한 일치·기본형 확장 2) 박싱·언박싱 3) 가변인자 순서입니다. 앞 단계에서 후보가 나오면 뒤 단계는 보지 않습니다.\n- 그래서 `List<Integer>`에 `int` 리터럴을 넘기면 박싱이 필요 없는 `remove(int)`가 선택되어 **인덱스**로 지웁니다.\n- 값으로 지우려면 `remove(Integer.valueOf(1))` 또는 `remove((Integer) 1)`처럼 객체를 넘깁니다.\n- `null`은 기본형이 될 수 없으므로 `remove(null)`은 `remove(Object)`로 가서 첫 번째 `null`을 지웁니다. NPE가 나지 않습니다.\n- `List<Integer>`에서 꺼낸 `null`을 `int`로 언박싱하면 `NullPointerException`입니다.\n\n```java\nArrayList<Integer> points = new ArrayList<>();\npoints.add(1); points.add(2); points.add(3); points.add(4); points.add(null);\npoints.remove(1);              // 인덱스 1(값 2) 삭제\npoints.remove(null);           // remove(Object): 첫 null 삭제\nSystem.out.println(points);    // [1, 3, 4]\n// 같은 리스트에서 remove(2)였다면 인덱스 2(값 3)가 지워져 [1, 2, 4]\n```\n\n```java\nList<Integer> l = new ArrayList<>(Arrays.asList(10, 1, 20));\nInteger removed = l.remove(1);              // 1 (인덱스 1의 요소), l = [10, 20]\nboolean bb = l.remove(Integer.valueOf(10)); // true, l = [20]\nl.add(5);\nl.remove((Integer) 5);                      // 값 5 삭제, l = [20]\nl.remove(Integer.valueOf(99));              // false\nl.remove(10);                               // IndexOutOfBoundsException\nboolean b = l.remove(0);                    // ✗ remove(int)는 Integer를 반환\n\nList<Integer> n = new ArrayList<>();\nn.add(null);\nint x = n.get(0);                           // NullPointerException (언박싱)\n```", "pitfalls": ["`List<Integer>`에서 `remove(1)`은 값 1이 아니라 인덱스 1을 지웁니다.", "`remove(null)`은 NPE나 컴파일 에러가 아니라 첫 번째 `null` 요소를 지웁니다.", "두 메서드의 반환형이 다릅니다. `remove(int)`는 요소를, `remove(Object)`는 `boolean`을 반환합니다."], "qs": [131, 147]}, {"title": "람다식과 Predicate", "body": "- 함수형 인터페이스는 추상 메서드가 하나인 인터페이스입니다. `java.util.function.Predicate<T>`는 `boolean test(T t)`를 가지며, default 메서드 `and`, `or`, `negate`가 있습니다.\n- Java 8의 `Collection.removeIf(Predicate)`는 조건을 만족하는 요소를 모두 지우고, 하나라도 지웠으면 `true`를 반환합니다.\n\n| 형태 | 예 | 결과 |\n|---|---|---|\n| 매개변수 1개, 타입 생략 | `p -> p.getAge() > 40` | ✓ |\n| 타입 명시 | `(Person p) -> p.getAge() > 40` | ✓ |\n| 블록 본문 | `p -> { return p.getAge() > 40; }` | ✓ |\n| 매개변수 0개 / 2개 | `() -> \"a\"`, `(x, y) -> true` | ✓ 괄호 필수 |\n| 타입 명시인데 괄호 없음 | `Person p -> p.getAge() > 40` | ✗ |\n| 블록인데 `return` 없음 | `p -> { p.getAge() > 40; }` | ✗ |\n| `return`인데 중괄호 없음 | `p -> return p.getAge() > 40;` | ✗ |\n| 블록 안 `;` 누락 | `p -> { return p.getAge() > 40 }` | ✗ |\n| 2개인데 괄호 없음 | `x, y -> true` | ✗ |\n| 타입 명시와 생략 혼용 | `(String x, y) -> true` | ✗ |\n\n변수 규칙:\n- 람다 매개변수는 람다 본문 안에서만 유효합니다.\n- 람다 매개변수 이름은 바깥의 지역 변수와 같을 수 없습니다.\n- 람다 안에서 쓰는 바깥 지역 변수는 `final`이거나 사실상 final(effectively final)이어야 합니다.\n\n```java\nstatic void checkAge(List<Person> list, Predicate<Person> predicate) {\n    for (Person p : list)\n        if (predicate.test(p)) System.out.println(p.name + \" \");\n}\nList<Person> iList = Arrays.asList(new Person(\"Hank\", 45),\n        new Person(\"Charlie\", 40), new Person(\"Smith\", 38));\ncheckAge(iList, p -> p.getAge() > 40);    // Hank (40은 > 40이 아님)\n```\n\n```java\nPredicate<String> empty = s -> s.isEmpty();\nempty.test(\"\");                               // true\nempty.negate().test(\"\");                      // false\nempty.or(s -> s.length() > 3).test(\"abcd\");   // true\nempty.and(s -> true).test(\"a\");               // false\nPredicate<String> bad = s -> s.length();      // ✗ boolean이 아닌 값 반환\n\nList<String> arrList = new ArrayList<>(Arrays.asList(\"Hi\", \"How\", \"Are\", \"You\"));\nboolean removed = arrList.removeIf(s -> s.length() <= 2);\nSystem.out.println(removed + \" \" + arrList);  // true [How, Are, You]\nif (arrList.removeIf((String s) -> { return s.length() <= 2; })) {\n    System.out.println(s + \"removed\");        // ✗ s는 람다 밖에서 보이지 않음\n}\n\nString s = \"\";\narrList.removeIf(s -> s.isEmpty());           // ✗ 바깥 지역 변수 s와 이름 충돌\nint min = 1; min++;\narrList.removeIf(x -> x.length() < min);      // ✗ min이 effectively final이 아님\nArrays.asList(\"Hi\", \"How\").removeIf(x -> x.length() <= 2);  // UnsupportedOperationException\n```", "pitfalls": ["타입을 적으면 괄호가 필요하고, 중괄호를 쓰면 `return`과 `;`가 필요합니다.", "람다 매개변수는 람다 밖(예: `if` 블록 안)에서 쓸 수 없고, 바깥 지역 변수와 이름이 같아도 안 됩니다.", "`Arrays.asList()` 결과에 `removeIf`를 써서 실제로 지워지는 요소가 있으면 `UnsupportedOperationException`입니다.", "`> 40`과 `>= 40` 같은 경계 조건에 따라 출력 대상이 바뀝니다."], "qs": [134, 136]}, {"title": "LocalDate·LocalTime·LocalDateTime 생성과 불변성", "body": "- public 생성자가 없어 `new LocalDate()`는 컴파일 에러입니다. static 팩토리 `now()`, `of(...)`, `parse(...)`로 만듭니다.\n- `LocalDate.of(year, month, day)`의 순서는 항상 **연-월-일**입니다.
