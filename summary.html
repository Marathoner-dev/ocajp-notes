month는 1~12 `int` 또는 `Month.JUNE` 같은 enum입니다. `LocalTime.of(hour, minute[, second])`, `LocalDateTime.of(y, m, d, h, min[, s])`도 큰 단위부터 씁니다.\n- 존재하지 않는 값(월 0·13·20, 1월 32일, 평년 2월 29일, 25시)은 **컴파일은 되고** 실행 시 `DateTimeException`(RuntimeException)입니다.\n- `0`으로 시작하는 정수 리터럴은 8진수입니다. `01`은 1이라 합법이지만 `08`, `09`는 컴파일 에러입니다.\n- **불변 객체**: `plusXxx`, `minusXxx`, `withXxx`는 새 객체를 반환합니다. 결과를 대입하지 않으면 원래 값이 그대로입니다.\n- 날짜 연산은 월·연을 올바르게 넘깁니다. `plusMonths`는 결과 달에 그날이 없으면 말일로 맞추며 예외가 나지 않습니다.\n- `LocalDate`에는 `plusHours` 같은 시간 메서드가 없습니다(컴파일 에러). 시간 연산은 `LocalTime`, `LocalDateTime`에 있습니다.\n- `toString()` 형식: `2012-01-30`, `10:15`, `2014-07-31T01:01`, 초가 있으면 `2012-01-30T10:15:30`입니다.\n\n```java\nLocalDate date = LocalDate.of(2012, 1, 30);\ndate.plusDays(10);                 // 결과 버림\nSystem.out.println(date);          // 2012-01-30\ndate = date.plusDays(10);\nSystem.out.println(date);          // 2012-02-09\n\nLocalDateTime dt = LocalDateTime.of(2014, 7, 31, 1, 1);\ndt.plusDays(30);  dt.plusMonths(1);                          // 둘 다 버림\nSystem.out.println(dt.format(DateTimeFormatter.ISO_DATE));   // 2014-07-31\nSystem.out.println(dt);                                      // 2014-07-31T01:01\n```\n\n```java\nLocalDate.of(2012, 01, 32);    // 컴파일 ✓, 런타임 DateTimeException (1월 32일)\nLocalDate.of(6, 20, 2014);     // 런타임 DateTimeException (월 = 20)\nLocalDate.of(2015, 2, 29);     // 런타임 DateTimeException (평년)\nLocalDate.of(2016, 2, 29);     // ✓ 윤년\nLocalTime.of(25, 0);           // 런타임 DateTimeException\nLocalDate.of(2015, 08, 1);     // ✗ 컴파일 에러: 08은 잘못된 8진수\nnew LocalDate();               // ✗ 생성자 없음\nLocalDate.now().plusHours(1);  // ✗ LocalDate에는 시간 메서드가 없음\nLocalDateTime.now().plusHours(1);  // ✓\n\nLocalDate.of(2012, 1, 31).plusDays(1);    // 2012-02-01\nLocalDate.of(2014, 1, 31).plusMonths(1);  // 2014-02-28 (말일 보정)\nLocalDate d = LocalDate.of(2014, 6, 20);\nd.getDayOfWeek();     // FRIDAY\nd.getMonth();         // JUNE\nd.getMonthValue();    // 6\nd.isBefore(LocalDate.of(2014, 6, 21));    // true\nd.withYear(2000);     // 2000-06-20\nd.minusWeeks(1);      // 2014-06-13\n```", "pitfalls": ["`date.plusDays(10);`처럼 반환값을 버리면 원래 날짜가 출력됩니다. 날짜 계산부터 하지 말고 대입 여부를 먼저 보세요.", "존재하지 않는 날짜는 컴파일 에러가 아니라 런타임 `DateTimeException`입니다. 그보다 앞서 `plusDays` 결과를 계산할 필요도 없습니다.", "`08`, `09` 리터럴은 컴파일 에러이지만 `01`은 합법입니다.", "인자 순서는 항상 연-월-일입니다. 미국식 `of(6, 20, 2014)`는 런타임 예외입니다."], "qs": [132, 137, 138, 139, 149]}, {"title": "날짜 포맷·파싱과 Period", "body": "- `toString()`은 항상 고정된 ISO 형식입니다. 파싱에 쓴 포매터는 객체에 저장되지 않으므로 출력 형식에 영향을 주지 않습니다.\n- 다른 모양으로 출력하려면 `date.format(formatter)` 또는 `formatter.format(date)`를 씁니다. `ofPattern`의 주요 기호는 `yyyy`(연), `MM`(월), `dd`(일), `HH`(시), `mm`(분)입니다.\n- 객체에 포매터가 요구하는 필드가 **없으면** 실행 시 `UnsupportedTemporalTypeException`입니다. 필드가 **남는** 것은 괜찮습니다.\n- `LocalDate.parse(text)`는 `yyyy-MM-dd`(두 자리)만 받습니다. 형식이 다르면 `DateTimeParseException`입니다. 다른 형식은 `parse(text, DateTimeFormatter.ofPattern(...))`로 파싱합니다.\n- `DateTimeParseException`과 `UnsupportedTemporalTypeException`은 모두 `DateTimeException`의 하위 클래스이고 RuntimeException입니다.\n\n| 객체 / 포매터 | `ISO_DATE` | `ISO_LOCAL_TIME` | `ISO_DATE_TIME` |\n|---|---|---|---|\n| `LocalDate` | `2014-06-20` | 예외 | 예외 |\n| `LocalDateTime` (09:05) | `2014-06-20` | `09:05:00` | `2014-06-20T09:05:00` |\n\n```java\nLocalDate d = LocalDate.of(2014, 6, 20);\nd.format(DateTimeFormatter.ofPattern(\"MM/dd/yyyy\"));     // 06/20/2014\nDateTimeFormatter.ofPattern(\"dd.MM.yy\").format(d);       // 20.06.14\nLocalDate.parse(\"06/20/2014\", DateTimeFormatter.ofPattern(\"MM/dd/yyyy\"));  // 2014-06-20\nLocalDate d3 = LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE);\nSystem.out.println(\"date3 = \" + d3);                    // date3 = 2014-06-20\nLocalDate.parse(\"2014/06/20\");     // DateTimeParseException\nLocalDate.parse(\"2014-6-20\");      // DateTimeParseException (두 자리 필요)\nLocalDate.parse(\"2014-05-04\").format(DateTimeFormatter.ISO_DATE_TIME);  // UnsupportedTemporalTypeException\nLocalDate.now().format(DateTimeFormatter.ofPattern(\"HH:mm\"));           // UnsupportedTemporalTypeException\nLocalTime.now().format(DateTimeFormatter.ofPattern(\"yyyy\"));            // UnsupportedTemporalTypeException\nLocalDateTime ldt = LocalDateTime.of(2014, 6, 20, 9, 5);\nldt.format(DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm\"));            // 2014-06-20 09:05\n```\n\n**Period**는 연·월·일 단위의 기간입니다. `toString()`은 `P1Y2M3D` 형식입니다.\n\n```java\nPeriod.of(1, 2, 3);                   // P1Y2M3D\nPeriod.ofWeeks(2);                    // P14D\nPeriod.ofMonths(14);                  // P14M (연으로 바꾸지 않음)\nPeriod.ofYears(1).ofMonths(2);        // P2M (static 메서드라 앞의 값은 무시됨)\nPeriod.ofYears(1).plusMonths(2);      // P1Y2M\nd.plus(Period.ofMonths(1));           // 2014-07-20\nPeriod.between(LocalDate.of(2014, 1, 1), LocalDate.of(2014, 3, 15));  // P2M14D\nLocalTime.of(10, 0).plus(Period.ofDays(1));   // UnsupportedTemporalTypeException\nPeriod.ofHours(1);                    // ✗ 없는 메서드\n```", "pitfalls": ["`LocalDate`를 `ISO_DATE_TIME`으로 포맷하면 시간이 00:00으로 채워지지 않고 런타임 `UnsupportedTemporalTypeException`이 납니다.", "`LocalDateTime`을 `ISO_DATE`로 포맷하는 것은 정상이며 날짜 부분만 출력됩니다.", "`DateParseException`이라는 클래스는 없습니다. 실제 이름은 `DateTimeParseException`입니다.", "`parse`에 어떤 포매터를 썼든 `println(date)`는 항상 `yyyy-MM-dd`로 출력됩니다.", "`Period.ofYears(1).ofMonths(2)`는 `P1Y2M`이 아니라 `P2M`입니다."], "qs": [138, 139, 148, 158]}]}], "bookmarked": [5, 12, 16, 17, 21, 24, 25, 30, 31, 34, 35, 39, 48, 51, 52, 56, 61, 64, 65, 66, 68, 77, 81, 83, 86, 89, 99, 101, 102, 103, 104, 105, 107, 108, 109, 111, 112, 113, 115, 117, 118, 119, 128, 130, 131, 132, 133, 134, 137, 138, 144, 158]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CH = DATA.chapters, BM = new Set(DATA.bookmarked);

  // ---- tiny markdown (main notes page's, plus pipe tables) ----
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function codeBlock(src, lang) {
    let html;
    try { html = (window.hljs && lang !== 'text') ? hljs.highlight(src, { language: 'java', ignoreIllegals: true }).value : esc(src); }
    catch (e) { html = esc(src); }
    return '<pre class="code"><code>' + html + '</code></pre>';
  }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  const cells = l => l.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  function md(text) {
    if (!text) return '';
    const out = []; const lines = String(text).replace(/\r/g, '').split('\n');
    let i = 0, para = [], list = null;
    const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
    while (i < lines.length) {
      const l = lines[i];
      const fence = l.match(/^\s*```(\w*)/);
      if (fence) {
        flushP(); flushL(); const buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        out.push(codeBlock(buf.join('\n'), fence[1] || 'java')); i++; continue;
      }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        flushP(); flushL();
        const head = cells(l); i += 2; const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push('<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
        continue;
      }
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        flushP(); const t = ul ? 'ul' : 'ol';
        if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
        list.items.push((ul || ol)[1]); i++; continue;
      }
      if (!l.trim()) { flushP(); flushL(); i++; continue; }
      if (list) { list.items[list.items.length - 1] += ' ' + l.trim(); i++; continue; }
      para.push(l.trim()); i++;
    }
    flushP(); flushL();
    return out.join('');
  }

  // ---- "다 봤음" checkmarks, per viewer ----
  const KEY = 'ocajp-summary-v1';
  let done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

  // ---- render ----
  const all = [];
  CH.forEach((c, ci) => c.sections.forEach((s, si) => {
    s.id = c.topic + '-' + (si + 1); s.label = (ci + 1) + '.' + (si + 1);
    s.bmQs = s.qs.filter(n => BM.has(n));
    all.push(s);
  }));
  const bmSecs = all.filter(s => s.bmQs.length).length;
  document.getElementById('lede').textContent = '158문제의 해설을 시험 범위 9개 단원, ' + all.length + '개 개념으로 다시 묶었습니다. 개념마다 규칙, 직접 컴파일해 확인한 예제, 시험 함정, 그 개념을 묻는 문제 번호를 정리했습니다.';
  document.getElementById('stats').innerHTML = '<span><b>' + CH.length + '</b>단원</span><span><b>' + all.length + '</b>개념</span>' +
    '<span>북마크 문제와 연결된 개념 <b>' + bmSecs + '</b>개 <span style="color:var(--warn)">●</span></span>' +
    '<span><a href="bookmarks.html">북마크 오답 노트 →</a></span>';

  document.getElementById('toc').innerHTML = CH.map((c, ci) =>
    '<div class="ch"><a href="#ch-' + c.topic + '"><span>' + (ci + 1) + '. ' + esc(c.name) + '</span><span class="n" data-ch="' + c.topic + '"></span></a><ol>' +
    c.sections.map(s => '<li><a href="#' + s.id + '" data-sec="' + s.id + '"' + (s.bmQs.length ? ' class="bm"' : '') + '>' + esc(s.title) + '</a></li>').join('') + '</ol></div>').join('');

  document.getElementById('main').innerHTML = CH.map((c, ci) =>
    '<div class="chapter-head" id="ch-' + c.topic + '"><span class="idx">CHAPTER ' + (ci + 1) + ' · ' + esc(c.en) + '</span><h2>' + esc(c.name) + '</h2><p>' + inline(c.intro) + '</p></div>' +
    c.sections.map(s =>
      '<section class="sec' + (s.bmQs.length ? ' bm' : '') + '" id="' + s.id + '" data-text="' + esc((s.title + ' ' + s.body + ' ' + s.pitfalls.join(' ')).toLowerCase()) + '">' +
      '<div class="sec-head"><span class="no">' + s.label + '</span><h3>' + esc(s.title) + '</h3>' +
      (s.bmQs.length ? '<span class="chip bm">북마크 ' + s.bmQs.length + '문제</span>' : '') + '</div>' +
      '<div class="md">' + md(s.body) + '</div>' +
      (s.pitfalls.length ? '<div class="pit"><h4>시험 함정</h4><div class="md"><ul>' + s.pitfalls.map(p => '<li>' + inline(p) + '</li>').join('') + '</ul></div></div>' : '') +
      '<div class="sec-foot"><div class="rel"><h4>이 개념을 묻는 문제</h4>' + s.qs.map(n => '<a href="./#q' + n + '"' + (BM.has(n) ? ' class="bm" title="북마크한 문제"' : '') + '>Q' + String(n).padStart(3, '0') + '</a>').join('') + '</div>' +
      '<label><input type="checkbox" class="done" data-sec="' + s.id + '"> 다 봤음</label></div></section>').join('')).join('') +
    '<p class="empty" id="empty" hidden>조건에 맞는 개념이 없습니다.</p>';

  // ---- interaction ----
  const state = { q: '', bm: false, hide: false };
  function apply() {
    let shown = 0;
    all.forEach(s => {
      const el = document.getElementById(s.id);
      const hit = (!state.q || el.dataset.text.includes(state.q)) && (!state.bm || s.bmQs.length) && (!state.hide || !done[s.id]);
      el.hidden = !hit; if (hit) shown++;
    });
    CH.forEach(c => { document.getElementById('ch-' + c.topic).hidden = c.sections.every(s => document.getElementById(s.id).hidden); });
    document.getElementById('empty').hidden = shown > 0;
  }
  function refresh() {
    const n = all.filter(s => done[s.id]).length;
    document.getElementById('meter').style.width = (100 * n / all.length) + '%';
    document.getElementById('prog').textContent = '다 본 개념 ' + n + ' / ' + all.length;
    document.querySelectorAll('.toc ol a').forEach(a => a.classList.toggle('done', !!done[a.dataset.sec]));
    document.querySelectorAll('input.done').forEach(b => b.checked = !!done[b.dataset.sec]);
    CH.forEach(c => { document.querySelector('.toc .n[data-ch="' + c.topic + '"]').textContent = c.sections.filter(s => done[s.id]).length + '/' + c.sections.length; });
    if (state.hide) apply();
  }
  document.getElementById('main').addEventListener('change', e => {
    if (!e.target.matches('input.done')) return;
    if (e.target.checked) done[e.target.dataset.sec] = Date.now(); else delete done[e.target.dataset.sec];
    save(); refresh();
  });
  let t;
  document.getElementById('s-search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); apply(); }, 120); });
  document.getElementById('only-bm').addEventListener('change', e => { state.bm = e.target.checked; apply(); });
  document.getElementById('hide-done').addEventListener('change', e => { state.hide = e.target.checked; apply(); });
  if (matchMedia('(max-width: 860px)').matches) document.getElementById('toc-wrap').open = false;
  document.getElementById('toc').addEventListener('click', e => { if (e.target.closest('a') && matchMedia('(max-width: 860px)').matches) document.getElementById('toc-wrap').open = false; });
  refresh();
})();
</script>
</body>
