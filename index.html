 {\n    String[] arr = {\"Hi\", \"How\", \"Are\", \"You\"};\n    List<String> arrList = new ArrayList<>(Arrays.asList(arr));\n    if (arrList.removeIf((String s) -> {return s.length() <= 2;})) {\n        System.out.println(s + \"removed\");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "Hi removed", "code": null}, {"key": "C", "text": "An UnsupportedOperationException is thrown at runtime.", "code": null}, {"key": "D", "text": "The program compiles, but it prints nothing.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "람다 매개변수 s를 람다 밖의 println에서 사용하므로 `cannot find symbol` 컴파일 에러가 납니다. 실제로 컴파일해 확인했습니다.", "summary": "람다 매개변수 s는 람다 본문 안에서만 유효하므로 if 블록 안의 `System.out.println(s + \"removed\")`에서 컴파일 에러가 납니다.", "walkthrough": "1. `String[] arr = {\"Hi\", \"How\", \"Are\", \"You\"};`와 `new ArrayList<>(Arrays.asList(arr))`는 수정 가능한 ArrayList를 만듭니다. 그래서 removeIf를 호출해도 UnsupportedOperationException은 나지 않습니다.\n2. `removeIf((String s) -> {return s.length() <= 2;})`는 람다 문법이 올바르고, 길이 2 이하인 \"Hi\"를 지운 뒤 true를 반환할 것입니다.\n3. 하지만 if 블록 안의 `System.out.println(s + \"removed\");`에서 s는 람다의 매개변수입니다. 람다 매개변수의 범위는 람다 본문뿐이라 밖에서는 보이지 않습니다.\n4. 바깥 범위에 s라는 변수가 없으므로 `cannot find symbol` 컴파일 에러가 납니다.\n5. 실제로 컴파일해 println 줄에서 이 에러를 확인했습니다.", "optionNotes": {"A": "정답입니다. 람다 매개변수 s를 람다 밖에서 사용해 컴파일 에러가 납니다.", "B": "removeIf 자체는 \"Hi\"를 지우고 true를 반환하겠지만, s가 범위 밖이라 컴파일되지 않으므로 출력이 나올 수 없습니다.", "C": "`Arrays.asList`의 결과를 그대로 쓰면 removeIf에서 UnsupportedOperationException이 나지만, 여기서는 `new ArrayList<>(...)`로 복사했으므로 해당하지 않습니다. 애초에 컴파일도 안 됩니다.", "D": "컴파일되지 않으므로 '컴파일되지만 아무것도 출력하지 않는다'는 틀렸습니다."}, "concepts": [{"title": "ArrayList.removeIf(Predicate)", "body": "`removeIf`는 Java 8에서 Collection에 추가된 default 메서드입니다. 조건(Predicate)을 만족하는 원소를 모두 지우고, 하나라도 지웠으면 true를 반환합니다. `Arrays.asList()`가 반환하는 리스트는 크기가 고정이라 원소를 실제로 지우려 하면 UnsupportedOperationException이 납니다. 그래서 `new ArrayList<>(Arrays.asList(...))`로 복사해서 씁니다."}, {"title": "람다의 변수 범위", "body": "람다 매개변수는 람다 본문 안에서만 유효합니다. 또한 람다 매개변수 이름은 바깥의 지역 변수와 같으면 안 됩니다(`String s = \"\"; list.removeIf(s -> ...)`는 에러). 람다 안에서 바깥 지역 변수를 쓰려면 그 변수가 final이거나 사실상 final(effectively final)이어야 합니다."}], "trap": "removeIf와 수정 가능한 리스트 여부(UnsupportedOperationException)에 신경 쓰게 만들고, 람다 밖에서 s를 쓰는 범위 문제를 놓치게 합니다.", "tags": ["ArrayList.removeIf", "람다 변수 범위"], "occurrences": ["exambible Q4 p26", "certleader-B Q3 p100"], "verified": "compiled", "fixes": ["배열 초기화 `(\"Hi\", ...)`의 소괄호를 중괄호 `{ }`로 수정", "`Arrays.asList(arr);`에 빠진 닫는 괄호를 추가해 `Arrays.asList(arr));`로 수정", "람다 본문 `(return s.length() <= 2;)`의 소괄호를 `{ }`로 수정", "println 끝의 `'`를 `;`로 수정 (람다 밖에서 s를 쓰는 의도된 컴파일 에러는 유지)"], "no": 136}, {"id": 47, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2012, 1, 30);\n    date.plusDays(10);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2012-02-10 00:00", "code": null}, {"key": "B", "text": "2012-01-30", "code": null}, {"key": "C", "text": "2012-02-10", "code": null}, {"key": "D", "text": "A DateTimeException is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "B/C", "answerNote": "덤프마다 B/C로 표기가 다릅니다. 실제 정답은 B입니다. `LocalDate`는 불변 객체이므로 `date.plusDays(10)`은 새 객체를 반환할 뿐 `date`를 바꾸지 않고, 반환값을 버렸으므로 `2012-01-30`이 출력됩니다(직접 실행해서 확인). C는 `date = date.plusDays(10);`처럼 다시 대입했을 때의 결과입니다.\n\n**덤프 사본 비교:** LocalDate는 불변이므로 plusDays(10)의 반환값을 버리면 date는 그대로이고, 실행 결과도 2012-01-30입니다. exambible Q25와 certleader-B Q55 사본은 보기 A와 C의 순서가 바뀌어 있고(C = 2012-02-10 00:00) 정답을 C로 적었는데, 그 사본에서도 C는 틀린 답입니다.", "summary": "`LocalDate`는 불변이고 `plusDays`의 반환값을 받지 않았으므로 원래 날짜 `2012-01-30`이 출력됩니다.", "walkthrough": "1. `LocalDate.of(2012, 1, 30)`은 2012년 1월 30일을 나타내는 `LocalDate`를 만듭니다.\n2. `date.plusDays(10)`은 10일 뒤인 2012-02-09를 담은 **새** `LocalDate`를 반환합니다. 1월 30일에 10일을 더하면 2월 9일이므로 C의 02-10도 애초에 틀린 날짜입니다.\n3. 그 반환값을 어떤 변수에도 대입하지 않았으므로 새 객체는 그대로 버려집니다. `date`는 여전히 2012-01-30을 가리킵니다.\n4. `System.out.println(date)`는 `LocalDate.toString()`의 ISO 형식(`yyyy-MM-dd`)으로 `2012-01-30`을 출력합니다.\n`LocalDate`에는 시간 정보가 없으므로 `00:00`이 붙는 A는 나올 수 없고, 날짜 값이 모두 유효하므로 예외도 발생하지 않습니다.", "optionNotes": {"A": "`LocalDate`는 날짜만 가지므로 `toString()`에 시간(`00:00`)이 붙지 않습니다. 게다가 `date`는 바뀌지도 않았습니다.", "B": "정답입니다. `plusDays`의 결과를 다시 대입하지 않았으므로 `date`는 원래 값 그대로입니다.", "C": "`date = date.plusDays(10);`처럼 대입했다면 날짜가 바뀌지만, 그 경우에도 결과는 2012-02-09입니다. 이 코드에서는 원래 값이 출력됩니다.", "D": "2012년 1월 30일은 유효한 날짜이고 날짜 더하기도 정상 연산이므로 `DateTimeException`이 발생하지 않습니다."}, "concepts": [{"title": "java.time 클래스의 불변성", "body": "`LocalDate`, `LocalTime`, `LocalDateTime`, `Period`는 모두 불변(immutable)입니다. `plusDays`, `minusMonths`, `withYear` 같은 메서드는 원본을 고치지 않고 새 객체를 반환합니다. 따라서 결과를 쓰려면 반드시 다시 대입해야 합니다.\n```java\nLocalDate d = LocalDate.of(2012, 1, 30);\nd.plusDays(10);        // 효과 없음\nd = d.plusDays(10);    // 2012-02-09\n```\nString의 `concat`, `toUpperCase`도 같은 원리이므로 함께 기억해 두면 좋습니다."}, {"title": "LocalDate/LocalDateTime의 toString 형식", "body": "`LocalDate.toString()`은 `2012-01-30`처럼 ISO-8601 `yyyy-MM-dd` 형식입니다. `LocalDateTime.toString()`은 `2012-01-30T10:15`처럼 날짜와 시간 사이에 `T`가 들어가고, 초가 0이면 초 부분은 생략됩니다. `LocalDate`에는 시간 필드가 없으므로 시간이 출력되는 보기는 바로 지울 수 있습니다."}], "trap": "날짜를 더하는 메서드를 호출하고 결과를 버리는 패턴입니다. 불변 객체이므로 원본 값이 그대로 출력됩니다.", "tags": ["LocalDate 불변성", "plusDays"], "occurrences": ["exambible Q10 p29", "exambible Q25 p33", "certleader-B Q55 p111", "certleader-C Q19 p145"], "verified": "compiled", "fixes": [], "no": 137}, {"id": 56, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "LocalDate date1 = LocalDate.now();\nLocalDate date2 = LocalDate.of(6, 20, 2014 );\nLocalDate date3 = LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE);\nSystem.out.println(\"date1 = \" + date1);\nSystem.out.println(\"date2 = \" + date2);\nSystem.out.println(\"date3 = \" + date3);"}, {"type": "text", "content": "Assume that the system date is June 20, 2014. What is the result?"}], "options": [{"key": "A", "text": "", "code": "date1 = 2014-06-20\ndate2 = 2014-06-20\ndate3 = 2014-06-20"}, {"key": "B", "text": "", "code": "date1 = 06/20/2014\ndate2 = 2014-06-20\ndate3 = Jun 20, 2014"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. `LocalDate.of`의 인자 순서는 `(year, month, dayOfMonth)`이므로 `LocalDate.of(6, 20, 2014)`는 6년 20월 2014일을 뜻합니다. 월 20은 범위(1~12)를 벗어나므로 런타임에 `DateTimeException: Invalid value for MonthOfYear (valid values 1 - 12): 20`이 발생합니다(직접 실행해서 확인). 어떤 출력도 나오기 전에 예외로 종료되므로 D가 정답입니다.", "summary": "`LocalDate.of(6, 20, 2014)`는 (연, 월, 일) 순서이므로 월이 20이 되어 런타임에 `DateTimeException`이 발생합니다.", "walkthrough": "1. `LocalDate.now()`는 정상적으로 시스템 날짜(가정상 2014-06-20)를 반환합니다.\n2. `LocalDate.of(6, 20, 2014)`: 시그니처가 `of(int year, int month, int dayOfMonth)`이므로 year=6, month=20, day=2014로 해석됩니다. 인자가 모두 `int`이므로 **컴파일은 됩니다**.\n3. 실행하면 월 값 20이 1~12 범위를 벗어나므로 `java.time.DateTimeException`(unchecked)이 발생합니다. 잡는 코드가 없으므로 `main`이 비정상 종료됩니다.\n4. 예외가 출력문보다 먼저 발생하므로 `date1 = ...`조차 출력되지 않습니다.\n참고로 3행의 `LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE)`는 정상입니다. 2행을 `LocalDate.of(2014, 6, 20)`으로 고치면 A처럼 세 줄 모두 `2014-06-20`이 출력됩니다.", "optionNotes": {"A": "인자 순서가 (월, 일, 연)이라고 착각했을 때의 출력입니다. 실제로는 2행에서 예외가 발생해 아무것도 출력되지 않습니다(덤프 정답이지만 오답).", "B": "`LocalDate.toString()`은 항상 ISO `yyyy-MM-dd` 형식이므로 `06/20/2014`나 `Jun 20, 2014` 같은 형식으로 출력되지 않습니다.", "C": "`LocalDate.of(int, int, int)`에 int 세 개를 넘겼으므로 컴파일은 정상입니다. 값의 유효성은 실행 시에만 검사합니다.", "D": "정답입니다. month=20이 유효 범위 밖이므로 실행 시 `DateTimeException`이 발생합니다."}, "concepts": [{"title": "LocalDate.of의 오버로딩과 인자 순서", "body": "`LocalDate.of(int year, int month, int dayOfMonth)`와 `LocalDate.of(int year, Month month, int dayOfMonth)`가 있습니다. 순서는 항상 **연-월-일**입니다. 월은 1부터 시작하며(0이 아님), 범위를 벗어나거나 `of(2015, 2, 29)`처럼 존재하지 않는 날짜를 넘기면 컴파일은 되지만 실행 시 `DateTimeException`이 발생합니다. `LocalTime.of(hour, minute)`, `LocalDateTime.of(year, month, day, hour, minute)`도 큰 단위에서 작은 단위 순서입니다."}, {"title": "parse와 DateTimeFormatter", "body": "`LocalDate.parse(CharSequence)`는 ISO 형식 `yyyy-MM-dd`를 기본으로 해석하고, `parse(text, formatter)`는 지정한 포맷터로 해석합니다. 형식이 맞지 않으면 `DateTimeParseException`(DateTimeException의 하위 클래스)이 발생합니다. `DateTimeFormatter.ISO_DATE`는 `2014-06-20` 또는 오프셋이 붙은 `2014-06-20+01:00`을 처리합니다. 출력 형식을 바꾸려면 `date.format(DateTimeFormatter.ofPattern(\"MM/dd/yyyy\"))`처럼 명시해야 합니다."}], "trap": "미국식 날짜 표기(월/일/연)처럼 인자를 넣어 두고, 컴파일 에러인지 런타임 예외인지 헷갈리게 만듭니다. 컴파일은 되고 실행 시 예외가 발생합니다.", "tags": ["LocalDate.of 인자 순서", "DateTimeException"], "occurrences": ["exambible Q45 p34", "certleader-D Q22 p177"], "verified": "compiled", "fixes": [], "no": 138}, {"id": 64, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "LocalDateTime dt = LocalDateTime.of (2014, 7, 31, 1, 1);\ndt.plusDays (30);\ndt.plusMonths (1);\nSystem.out.print (dt.format (DateTimeFormatter.ISO_DATE));"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "An exception is thrown at runtime.", "code": null}, {"key": "B", "text": "07-31-2014", "code": null}, {"key": "C", "text": "2014-07-31", "code": null}, {"key": "D", "text": "2014-09-30", "code": null}], "correct": "C", "dumpAnswer": "D", "answerNote": "덤프 정답 D는 틀렸고, 다른 사본(certleader-C)의 A도 틀렸습니다. `LocalDateTime`은 불변이므로 `dt.plusDays(30)`과 `dt.plusMonths(1)`의 반환값을 버리면 `dt`는 그대로 2014-07-31T01:01입니다. 이를 `ISO_DATE`로 포맷하면 `2014-07-31`이 출력됩니다(직접 실행해서 확인). D(2014-09-30)는 `dt = dt.plusDays(30).plusMonths(1);`처럼 다시 대입했을 때의 결과입니다.", "summary": "`LocalDateTime`은 불변이라 `plusDays`/`plusMonths`의 결과를 버리면 원래 날짜가 남으므로 `2014-07-31`이 출력됩니다.", "walkthrough": "1. `dt`는 2014-07-31T01:01입니다.\n2. `dt.plusDays(30)`은 2014-08-30T01:01인 새 객체를 반환하지만 대입하지 않으므로 버려집니다.\n3. `dt.plusMonths(1)`도 2014-08-31T01:01인 새 객체를 반환하지만 버려집니다.\n4. `dt.format(DateTimeFormatter.ISO_DATE)`는 날짜 부분만 `yyyy-MM-dd`로 출력하므로 `2014-07-31`이 됩니다. `ISO_DATE`의 오프셋 부분은 선택 항목이라 `LocalDateTime`에 써도 예외가 발생하지 않습니다.\n참고로 결과를 이어서 대입하면 7/31 + 30일 = 8/30, 여기에 1개월을 더하면 9/30이 되어 D가 나옵니다.", "optionNotes": {"A": "`ISO_DATE`는 날짜 필드만 필요하고 오프셋은 선택 항목이므로 `LocalDateTime`을 포맷해도 예외가 발생하지 않습니다.", "B": "`ISO_DATE`는 `yyyy-MM-dd` 형식이므로 `07-31-2014`처럼 출력되지 않습니다.", "C": "정답입니다. 불변 객체의 반환값을 버렸으므로 `dt`는 원래 날짜 그대로이고 ISO 형식으로 `2014-07-31`이 출력됩니다.", "D": "`dt = dt.plusDays(30).plusMonths(1);`로 다시 대입했을 때의 결과입니다. 이 코드에서는 `dt`가 바뀌지 않습니다."}, "concepts": [{"title": "java.time 클래스의 불변성", "body": "`LocalDate`, `LocalTime`, `LocalDateTime`, `Period`, `Duration`은 모두 불변입니다. `plusXxx`, `minusXxx`, `withXxx`는 새 객체를 반환하므로 결과를 다시 대입하거나 메서드 체이닝으로 이어 써야 합니다. 시험에는 반환값을 버리는 코드가 자주 나오며, 그때는 항상 원래 값이 출력됩니다."}, {"title": "DateTimeFormatter 상수와 지원 필드", "body": "`ISO_LOCAL_DATE`/`ISO_DATE`는 날짜만, `ISO_LOCAL_TIME`/`ISO_TIME`은 시간만, `ISO_LOCAL_DATE_TIME`/`ISO_DATE_TIME`은 날짜와 시간을 출력합니다. 포맷할 객체에 포맷터가 요구하는 필드가 없으면 실행 시 `UnsupportedTemporalTypeException`(DateTimeException의 하위 클래스)이 발생합니다. 예를 들어 `LocalDate.now().format(DateTimeFormatter.ISO_LOCAL_TIME)`은 시간 필드가 없어 예외가 납니다. 반대로 `LocalDateTime`을 `ISO_DATE`로 포맷하는 것은 날짜 필드가 있으므로 정상입니다."}, {"title": "월 더하기의 말일 보정", "body": "`plusMonths`는 결과 달에 그날이 없으면 그 달의 마지막 날로 맞춥니다. 예를 들어 `2014-01-31.plusMonths(1)`은 `2014-02-28`입니다. 예외는 발생하지 않습니다. 반면 `LocalDate.of(2014, 2, 30)`처럼 처음부터 잘못된 날짜를 만들면 `DateTimeException`이 발생합니다."}], "trap": "날짜 계산을 실제로 해 보게 유도해 2014-09-30을 고르게 만들지만, 반환값을 대입하지 않았으므로 원래 날짜가 출력됩니다.", "tags": ["LocalDateTime 불변성", "DateTimeFormatter.ISO_DATE"], "occurrences": ["surepassexam Q7 p52", "certleader-C Q8 p143"], "verified": "compiled", "fixes": ["`LocalDate Time`을 `LocalDateTime`으로, `dt=`를 `dt =`로 수정", "`dt. plusMonths`의 점 뒤 공백 제거", "`dt format`에 빠진 점을 넣어 `dt.format`으로 수정하고 `DateTimeFormatter. ISO_DATE`의 공백 제거", "보기 A의 'runtim'을 'runtime.'으로 수정"], "no": 139}, {"id": 66, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "13. List colors = new ArrayList();\n14. colors.add(\"green\");\n15. colors.add(\"red\");\n16. colors.add(\"blue\");\n17. colors.add(\"yellow\");\n18. colors.remove(2);\n19. colors.add(3, \"cyan\");\n20. System.out.print(colors);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "[green, red, yellow, cyan]", "code": null}, {"key": "B", "text": "[green, blue, yellow, cyan]", "code": null}, {"key": "C", "text": "[green, red, cyan, yellow]", "code": null}, {"key": "D", "text": "An IndexOutOfBoundsException is thrown at runtime.", "code": null}], "correct": "A", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. `remove(2)` 뒤 리스트는 `[green, red, yellow]`(크기 3)이고, `add(3, \"cyan\")`은 인덱스 3 = 크기이므로 맨 뒤에 추가됩니다. 따라서 결과는 `[green, red, yellow, cyan]`이고(직접 실행해서 확인) 보기 A에 해당합니다. C는 `add(2, \"cyan\")`일 때의 결과입니다.", "summary": "`remove(2)`로 blue를 지우면 크기가 3이 되고, `add(3, \"cyan\")`은 끝(인덱스 = 크기)에 추가하므로 `[green, red, yellow, cyan]`이 됩니다.", "walkthrough": "1. 네 번의 `add` 후 리스트: `[green, red, blue, yellow]`(인덱스 0~3)\n2. `colors.remove(2)`: 인자가 `int`이므로 `remove(int index)`가 호출되어 인덱스 2의 `blue`를 지웁니다. 뒤 원소가 앞으로 당겨져 `[green, red, yellow]`(크기 3)가 됩니다.\n3. `colors.add(3, \"cyan\")`: `add(int index, E e)`는 `0 <= index <= size()`면 허용됩니다. index 3 == size 3이므로 맨 끝에 추가되어 `[green, red, yellow, cyan]`이 됩니다.\n4. `System.out.print(colors)`는 `AbstractCollection.toString()`으로 `[green, red, yellow, cyan]`을 출력합니다.\nraw 타입 `List`를 써서 unchecked 경고는 나지만 컴파일과 실행은 정상입니다. index가 4 이상이었다면 `IndexOutOfBoundsException`이 발생했을 것입니다.", "optionNotes": {"A": "정답입니다. blue가 지워진 뒤 cyan이 크기와 같은 인덱스 3, 즉 맨 끝에 추가됩니다.", "B": "`remove(2)`는 인덱스 2(blue)를 지웁니다. red를 지운 결과처럼 보는 것은 인덱스를 1부터 센 착각입니다.", "C": "cyan이 yellow 앞에 들어가려면 `add(2, \"cyan\")`이어야 합니다. 삭제 후 인덱스가 당겨진 것을 반영하지 않은 결과입니다(덤프 정답이지만 오답).", "D": "`add(index, e)`는 `index == size()`까지 허용하므로 크기 3인 리스트에 인덱스 3으로 추가해도 예외가 발생하지 않습니다."}, "concepts": [{"title": "ArrayList 인덱스 연산의 허용 범위", "body": "`get(i)`, `set(i, e)`, `remove(i)`는 `0 <= i < size()`만 허용합니다. `add(i, e)`는 끝에 붙이는 경우까지 포함해 `0 <= i <= size()`를 허용합니다. 범위를 벗어나면 `IndexOutOfBoundsException`이 발생합니다. 삽입과 삭제 후에는 뒤 원소의 인덱스가 하나씩 밀리거나 당겨지므로, 연속된 연산은 매번 리스트 상태를 새로 적어 보며 추적해야 합니다."}, {"title": "remove(int)와 remove(Object)", "body": "`List`에는 `remove(int index)`와 `remove(Object o)`가 오버로딩되어 있습니다. 기본형 int 인자는 정확히 일치하는 `remove(int)`가 우선합니다. 그래서 `List<Integer> list`에서 `list.remove(1)`은 값 1이 아니라 **인덱스 1**의 원소를 지웁니다. 값으로 지우려면 `list.remove(Integer.valueOf(1))`처럼 객체를 넘겨야 합니다. `remove(Object)`는 지웠는지를 boolean으로, `remove(int)`는 지운 원소를 반환합니다."}], "trap": "삭제 후 인덱스가 당겨지는 것과 `add(size(), e)`가 허용된다는 점을 놓쳐 C나 D를 고르게 만듭니다.", "tags": ["ArrayList.remove(int)", "ArrayList.add(int, E)", "ArrayList toString"], "occurrences": ["surepassexam Q9 p52"], "verified": "compiled", "fixes": ["보기 A~C의 괄호 `( )`를 실제 `toString()` 출력과 같은 `[ ]`로 수정", "보기 D의 붙어 버린 'AnIndexOutOfBoundsExceptionis'를 'An IndexOutOfBoundsException is'로 띄어 씀"], "no": 140}, {"id": 68, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    StringBuilder sb = new StringBuilder(5);\n    String s = \"\";\n\n    if (sb.equals(s)) {\n        System.out.println(\"Match 1\");\n    } else if (sb.toString().equals(s.toString())) {\n        System.out.println(\"Match 2\");\n    } else {\n        System.out.println(\"No Match\");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Match 1", "code": null}, {"key": "B", "text": "Match 2", "code": null}, {"key": "C", "text": "No Match", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "`StringBuilder`는 `equals`를 오버라이드하지 않아 String과 비교하면 false이고, `toString()`으로 바꾼 뒤 비교하면 둘 다 빈 문자열이라 `Match 2`가 출력됩니다.", "walkthrough": "1. `new StringBuilder(5)`는 초기 **용량**이 5인 빈 StringBuilder를 만듭니다. 내용이 `\"5\"`인 것이 아니고 길이는 0입니다.\n2. `sb.equals(s)`: `StringBuilder`는 `Object.equals`를 그대로 쓰므로 참조가 같은지(`==`)만 비교합니다. `sb`와 `s`는 서로 다른 객체이고 타입도 다르므로 false입니다.\n3. `sb.toString().equals(s.toString())`: `sb.toString()`은 `\"\"`, `s.toString()`도 `\"\"`입니다. `String.equals`는 내용을 비교하므로 true입니다.\n4. 따라서 `Match 2`가 출력됩니다. null인 참조가 없으므로 NullPointerException도 발생하지 않습니다.", "optionNotes": {"A": "`StringBuilder.equals`는 `Object`의 참조 비교라서 String과 비교하면 항상 false입니다.", "B": "정답입니다. 두 값을 String으로 바꾼 뒤 비교하면 둘 다 빈 문자열이므로 true가 됩니다.", "C": "두 번째 조건에서 내용 비교를 하므로 일치합니다. `StringBuilder(5)`의 5는 내용이 아니라 용량입니다.", "D": "`sb`와 `s` 모두 실제 객체를 가리키므로 null 참조로 메서드를 호출하는 곳이 없습니다."}, "concepts": [{"title": "StringBuilder의 equals와 내용 비교", "body": "`String`은 `equals`를 오버라이드해 문자 내용을 비교하지만, `StringBuilder`와 `StringBuffer`는 오버라이드하지 않아 참조 비교만 합니다. 그래서 내용이 같은 두 StringBuilder끼리도 `sb1.equals(sb2)`는 false입니다. 내용을 비교하려면 `sb1.toString().equals(sb2.toString())`이나 `String.contentEquals(sb)`를 씁니다. `\"abc\".equals(sb)`도 인자가 String이 아니므로 false입니다."}, {"title": "StringBuilder 생성자", "body": "`new StringBuilder()`는 용량 16인 빈 객체, `new StringBuilder(int capacity)`는 지정한 용량의 빈 객체, `new StringBuilder(String s)`는 `s` 내용으로 시작하는 객체를 만듭니다. 용량은 내부 버퍼 크기일 뿐 `length()`(실제 문자 수)와 다르며, 필요하면 자동으로 늘어납니다. `new StringBuilder(5).length()`는 0입니다."}], "trap": "`StringBuilder(5)`가 내용 \"5\"를 만드는 것처럼 보이게 하고, `equals`가 내용을 비교할 것이라고 착각하게 만듭니다.", "tags": ["StringBuilder.equals", "String.equals", "toString 비교"], "occurrences": ["surepassexam Q10 p53"], "verified": "compiled", "fixes": [], "no": 141}, {"id": 72, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String str = \" \";\n    str.trim();\n    System.out.println(str.equals(\"\") + \" \" + str.isEmpty());\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "true true", "code": null}, {"key": "B", "text": "true false", "code": null}, {"key": "C", "text": "false false", "code": null}, {"key": "D", "text": "false true", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`str.trim()`의 반환값을 버렸으므로 `str`은 여전히 공백 한 칸 `\" \"`이고, `equals(\"\")`와 `isEmpty()` 모두 `false`입니다.", "walkthrough": "1. `str`은 공백 문자 하나로 된 문자열 `\" \"`(길이 1)입니다.\n2. `str.trim();`은 앞뒤 공백을 제거한 **새 String** `\"\"`를 반환하지만, 그 결과를 어떤 변수에도 대입하지 않으므로 버려집니다. String은 불변이라 `str` 자체는 바뀌지 않습니다.\n3. `str.equals(\"\")`: `\" \"`와 `\"\"`는 내용이 다르므로 `false`입니다.\n4. `str.isEmpty()`: 길이가 1이므로 `false`입니다.\n5. `false + \" \" + false`가 연결되어 `false false`가 출력됩니다.\n\n만약 `str = str.trim();`이었다면 `true true`가 됩니다.", "optionNotes": {"A": "`str = str.trim();`처럼 결과를 다시 대입했을 때의 결과입니다. 이 코드는 반환값을 버리므로 해당하지 않습니다.", "B": "`equals(\"\")`가 `true`라면 길이도 0이므로 `isEmpty()`도 `true`여야 합니다. 이 조합은 나올 수 없습니다.", "C": "정답입니다. `str`은 그대로 `\" \"`이므로 두 검사 모두 `false`입니다.", "D": "`isEmpty()`는 `length() == 0`일 때만 `true`입니다. 공백 한 칸은 길이 1이므로 `false`입니다."}, "concepts": [{"title": "String 불변성과 반환값", "body": "`String` 객체는 생성 후 내용을 바꿀 수 없습니다. `trim()`, `toUpperCase()`, `replace()`, `concat()`, `substring()` 등은 원본을 수정하지 않고 새 String을 반환합니다. 따라서 반환값을 변수에 대입하지 않으면 아무 효과가 없습니다. 반면 `StringBuilder`의 `append()`, `insert()`, `reverse()` 등은 객체 자체를 변경합니다.\n```java\nString s = \"abc\";\ns.toUpperCase();      // s는 여전히 \"abc\"\ns = s.toUpperCase();  // 이제 \"ABC\"\n```"}, {"title": "trim()과 isEmpty()", "body": "`trim()`은 문자열 앞뒤의 공백(코드값 `\\u0020` 이하인 문자)을 제거하며 가운데 공백은 그대로 둡니다. `isEmpty()`는 `length() == 0`일 때만 `true`이므로 공백만 있는 문자열 `\" \"`은 비어 있지 않습니다. 참고로 공백만 있는지 확인하는 `isBlank()`는 Java 11에서 추가된 메서드라 Java 8 시험 범위가 아닙니다."}], "trap": "`trim()`을 호출했으니 `str`이 바뀌었다고 착각하게 만드는 전형적인 String 불변성 문제입니다.", "tags": ["String 불변성", "String.trim()", "String.isEmpty()"], "occurrences": ["surepassexam Q20 p56"], "verified": "compiled", "fixes": [], "no": 142}, {"id": 73, "topic": "api", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Equal {\n    public static void main (String [] args) {\n        String str1 = \"Java\";\n        String [] str2 = { \"J\", \"a\", \"v\", \"a\"};\n        String str3 = \"\";\n        for (String str : str2) {\n            str3 = str3+str;\n        }\n        boolean b1 = (str1 == str3);\n        boolean b2 = (str1.equals (str3));\n        System.out.print (b1+\", \"+b2);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "false, false", "code": null}, {"key": "B", "text": "false, true", "code": null}, {"key": "C", "text": "true, false", "code": null}, {"key": "D", "text": "true, true", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "반복문에서 `+`로 만든 문자열은 런타임에 새 객체로 생성되므로 리터럴 `\"Java\"`와 `==`는 `false`, 내용 비교 `equals`는 `true`입니다.", "walkthrough": "1. `str1`은 리터럴 `\"Java\"`이므로 String 상수 풀의 객체를 가리킵니다.\n2. `str3`은 `\"\"`에서 시작해 반복문에서 `\"J\"`, `\"Ja\"`, `\"Jav\"`, `\"Java\"` 순으로 바뀝니다. `str3 + str`은 변수끼리의 연결이므로 컴파일 시점 상수가 아니며, 매번 런타임에 새 String 객체가 만들어집니다.\n3. `str1 == str3`는 참조(주소) 비교입니다. 풀의 `\"Java\"`와 힙에 새로 만들어진 `\"Java\"`는 다른 객체이므로 `false`입니다.\n4. `str1.equals(str3)`는 내용 비교이므로 `true`입니다.\n5. 출력은 `false, true`이며 선택지 B에 해당합니다.", "optionNotes": {"A": "`equals()`는 문자 내용을 비교하므로 둘 다 `\"Java\"`인 이상 `true`입니다.", "B": "정답입니다. 서로 다른 객체이므로 `==`는 `false`, 내용이 같으므로 `equals()`는 `true`입니다.", "C": "`==`가 `true`이면서 `equals()`가 `false`인 경우는 String에서 있을 수 없습니다(같은 객체면 내용도 같습니다).", "D": "`str3`는 런타임 연결로 만든 새 객체라 풀의 `\"Java\"`와 같은 참조가 아닙니다. `str3.intern()`을 썼다면 `true`가 됐을 것입니다."}, "concepts": [{"title": "String 상수 풀과 == 비교", "body": "문자열 리터럴과 컴파일 시점 상수식(`\"Ja\" + \"va\"`, `final` 상수끼리의 연결)은 상수 풀에서 같은 객체를 공유하므로 `==`가 `true`입니다. 하지만 일반 변수가 끼어 있는 연결, `new String(\"Java\")`, `substring()` 등 메서드 결과는 런타임에 새 객체를 만들므로 `==`가 `false`입니다. 내용 비교는 항상 `equals()`를 쓰세요.\n```java\nString a = \"Java\";\nString b = \"Ja\" + \"va\";      // 컴파일 시 상수 → a == b : true\nString p = \"Ja\";\nString c = p + \"va\";          // 런타임 연결 → a == c : false\nfinal String f = \"Ja\";\nString d = f + \"va\";          // f는 상수 → a == d : true\n```"}, {"title": "equals()와 intern()", "body": "`String.equals(Object)`는 대소문자까지 같은 문자 시퀀스인지 비교하며, 인자가 String이 아니면 `false`입니다. `equalsIgnoreCase()`는 대소문자를 무시합니다. `intern()`은 풀에 같은 내용이 있으면 그 객체를, 없으면 등록 후 그 객체를 반환하므로 `str3.intern() == str1`은 `true`가 됩니다."}], "trap": "결과 문자열의 내용이 리터럴과 같으면 `==`도 `true`라고 착각하게 만드는 문제입니다. 런타임 연결은 새 객체입니다.", "tags": ["== vs equals", "String 풀", "런타임 문자열 연결"], "occurrences": ["surepassexam Q25 p56"], "verified": "compiled", "fixes": ["`(str1= = str3)`의 `= =`를 `==`로 수정", "`b1+\",    \"+b2`의 쉼표 뒤 공백 4칸(이미지 글꼴 간격)을 한 칸으로 줄여 보기 'false, true'와 출력이 정확히 일치하도록 수정"], "no": 143}, {"id": 78, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [] args) {\n    String names [] = {\"Thomas\", \"Peter\", \"Joseph\"};\n    String pwd [] = new String [3];\n    int idx = 0;\n    try {\n        for (String n: names) {\n            pwd [idx] = n.substring (2, 6);\n            idx++;\n        }\n    }\n    catch (Exception e) {\n        System.out.println (\"Invalid Name\");\n    }\n    for (String p: pwd) {\n        System.out.println (p);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Invalid Name", "code": null}, {"key": "B", "text": "", "code": "Invalid Name\nomas"}, {"key": "C", "text": "", "code": "Invalid Name\nomas\nnull\nnull"}, {"key": "D", "text": "", "code": "omas\nter\nseph"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`\"Peter\".substring(2, 6)`에서 예외가 나 루프가 중단되므로 `pwd`에는 `\"omas\"`만 들어가고 나머지는 `null`입니다.", "walkthrough": "1. `pwd`는 길이 3의 String 배열이며 모든 요소가 `null`로 초기화됩니다.\n2. 첫 반복 `n = \"Thomas\"`(길이 6): `substring(2, 6)`은 인덱스 2~5인 `\"omas\"`입니다. `pwd[0] = \"omas\"`, `idx = 1`.\n3. 둘째 반복 `n = \"Peter\"`(길이 5): `substring(2, 6)`의 끝 인덱스 6이 길이 5를 넘으므로 `StringIndexOutOfBoundsException`이 발생합니다. 대입 전에 예외가 났으므로 `pwd[1]`은 그대로 `null`입니다.\n4. 예외는 `catch (Exception e)`에서 잡혀 `Invalid Name`이 출력됩니다. try 블록은 중단되므로 `\"Joseph\"`은 처리되지 않습니다.\n5. 이후 for문이 `pwd`를 출력하여 `omas`, `null`, `null`이 각각 한 줄씩 출력됩니다.\n최종 출력: `Invalid Name` / `omas` / `null` / `null`.", "optionNotes": {"A": "catch 이후에도 프로그램은 계속 진행되어 `pwd` 배열을 출력하는 for문이 실행되므로 `Invalid Name`만 출력되지 않습니다.", "B": "`omas` 다음에 `pwd[1]`, `pwd[2]`의 `null`도 출력됩니다. 향상된 for문은 배열 길이 3만큼 모두 순회합니다.", "C": "정답입니다. 첫 이름만 처리된 뒤 예외로 루프가 끝나고, 나머지 요소는 기본값 `null`로 출력됩니다.", "D": "`\"Peter\"`는 길이가 5라 `substring(2, 6)`에서 예외가 발생하므로 `ter`, `seph`가 출력될 수 없습니다. D는 끝 인덱스를 무시하고 `substring(2)`처럼 계산한 결과입니다."}, "concepts": [{"title": "substring(begin, end)의 범위 규칙", "body": "`substring(begin, end)`는 인덱스 `begin`부터 `end - 1`까지를 반환합니다(끝 인덱스는 제외). 결과 길이는 `end - begin`입니다. `begin < 0`, `end > length()`, `begin > end` 중 하나라도 해당하면 `StringIndexOutOfBoundsException`이 발생합니다. `end == length()`는 허용되며, `begin == end`이면 빈 문자열을 반환합니다.\n```java\n\"Thomas\".substring(2, 6); // \"omas\"\n\"Peter\".substring(2, 5);  // \"ter\"\n\"Peter\".substring(2, 6);  // 예외\n\"abc\".substring(3);       // \"\"\n```"}, {"title": "try 블록에서 예외 발생 시 흐름", "body": "try 블록 안에서 예외가 발생하면 그 지점 이후의 문장은 실행되지 않고 바로 일치하는 catch 블록으로 이동합니다. 이 문제처럼 루프 전체가 try 안에 있으면 루프 자체가 중단됩니다. 반대로 try-catch를 루프 안에 두면 한 요소에서 예외가 나도 다음 반복을 계속합니다. catch로 예외를 처리한 뒤에는 try-catch 다음 문장부터 정상 실행이 이어집니다. 배열 요소는 기본값으로 초기화되므로 대입되지 않은 String 요소는 `null`이며, `println(null 참조)`는 `null`을 출력합니다."}], "trap": "모든 이름 길이가 6 이상이라고 생각하면 D를 고르게 됩니다. 길이 5인 `\"Peter\"`에서 예외가 나는 점과, 예외 후에도 출력 루프가 실행되는 점을 확인해야 합니다.", "tags": ["String.substring()", "StringIndexOutOfBoundsException", "try-catch 흐름", "배열 기본값"], "occurrences": ["surepassexam Q42 p59"], "verified": "compiled", "fixes": ["배열 초기화 `(\"Thomas\", \"Peter\", \"Joseph\")`의 소괄호를 중괄호 `{ }`로 수정", "배열 선언 이름 `pws`를 사용처와 같은 `pwd`로 통일", "보기 B~D의 사라진 줄바꿈을 복원해 코드 블록으로 분리('omasterseph' → omas / ter / seph)"], "no": 144}, {"id": 81, "topic": "api", "parts": [{"type": "text", "content": "You are developing a banking module. You have developed a class named CCMask that has a maskCC method. Given the code fragment:"}, {"type": "code", "content": "class CCMask {\n    public static String maskCC(String creditCard) {\n        String x = \"XXXX-XXXX-XXXX-\";\n        //line n1\n    }\n\n    public static void main(String[] args) {\n        System.out.println(maskCC(\"1234-5678-9101-1121\"));\n    }\n}"}, {"type": "text", "content": "You must ensure that the maskCC method returns a string that hides all digits of the credit card number except the four last digits (and the hyphens that separate each group of four digits)."}, {"type": "text", "content": "Which two code fragments should you use at line n1, independently, to achieve this requirement?"}], "options": [{"key": "A", "text": "", "code": "StringBuilder sb = new StringBuilder(creditCard);\nsb.substring(15, 19);\nreturn x + sb;"}, {"key": "B", "text": "", "code": "return x + creditCard.substring(15, 19);"}, {"key": "C", "text": "", "code": "StringBuilder sb = new StringBuilder(x);\nsb.append(creditCard, 15, 19);\nreturn sb.toString();"}, {"key": "D", "text": "", "code": "StringBuilder sb = new StringBuilder(creditCard);\nStringBuilder s = sb.insert(0, x);\nreturn s.toString();"}], "correct": "BC", "dumpAnswer": "BC", "answerNote": "", "summary": "마지막 4자리 `creditCard.substring(15, 19)`를 접두사에 붙이는 B와, `append(creditCard, 15, 19)`로 같은 범위를 붙이는 C만 요구사항을 만족합니다.", "walkthrough": "입력 `\"1234-5678-9101-1121\"`의 인덱스 15~18이 마지막 4자리 `\"1121\"`입니다. 각 선택지를 실행한 결과입니다.\n- A: `sb.substring(15, 19)`는 새 String을 반환할 뿐 `sb`를 바꾸지 않습니다. 반환값을 버렸으므로 `x + sb`는 `XXXX-XXXX-XXXX-1234-5678-9101-1121`입니다.\n- B: `x + \"1121\"` → `XXXX-XXXX-XXXX-1121`.\n- C: `new StringBuilder(x)`에 `append(CharSequence s, int start, int end)`로 `creditCard`의 인덱스 15~18을 붙여 `XXXX-XXXX-XXXX-1121`.\n- D: `insert(0, x)`는 원래 카드 번호 앞에 `x`를 끼워 넣을 뿐이므로 `XXXX-XXXX-XXXX-1234-5678-9101-1121`입니다.\n따라서 B와 C가 정답입니다.", "optionNotes": {"A": "`StringBuilder.substring()`은 String을 반환하며 `sb` 자체를 잘라내지 않습니다. 반환값을 버렸으므로 카드 번호 전체가 그대로 노출됩니다.", "B": "정답입니다. `substring(15, 19)`가 `\"1121\"`을 반환하고 접두사와 연결됩니다.", "C": "정답입니다. `append(CharSequence, start, end)`는 지정 범위(15 이상 19 미만)의 문자만 덧붙이므로 `XXXX-XXXX-XXXX-1121`이 됩니다.", "D": "`insert(0, x)`는 앞에 접두사를 추가할 뿐 기존 숫자를 지우지 않으므로 모든 숫자가 노출됩니다."}, "concepts": [{"title": "StringBuilder의 변경 메서드와 비변경 메서드", "body": "`append()`, `insert()`, `delete()`, `deleteCharAt()`, `replace()`, `reverse()`, `setCharAt()`, `setLength()`는 StringBuilder 자신을 변경하며, `setCharAt`/`setLength`를 제외하면 자기 자신(`this`)을 반환해 메서드 체이닝이 가능합니다. 반면 `substring()`, `charAt()`, `indexOf()`, `length()`, `toString()`은 내용을 바꾸지 않습니다. 특히 `substring()`은 StringBuilder가 아니라 **String**을 반환한다는 점이 자주 출제됩니다.\n```java\nStringBuilder sb = new StringBuilder(\"abcdef\");\nsb.substring(1, 3);   // \"bc\" 반환, sb는 그대로 \"abcdef\"\nsb.delete(1, 3);      // sb가 \"adef\"로 변경\n```"}, {"title": "append(CharSequence s, int start, int end)", "body": "이 오버로드는 `s`의 인덱스 `start`부터 `end - 1`까지를 덧붙입니다. 세 번째 인자는 길이가 아니라 끝 인덱스(제외)라는 점에 주의하세요. 이름이 비슷한 `append(char[] str, int offset, int len)`은 세 번째 인자가 **길이**입니다. String은 CharSequence를 구현하므로 String을 넘기면 첫 번째 오버로드가 선택됩니다.\n```java\nnew StringBuilder().append(\"abcdef\", 1, 3);              // \"bc\"\nnew StringBuilder().append(\"abcdef\".toCharArray(), 1, 3); // \"bcd\"\n```"}], "trap": "A는 `substring()`이 StringBuilder를 직접 잘라낸다고 착각하게 만들고, C의 `append(…, 15, 19)`는 세 번째 인자를 길이로 착각하면 틀렸다고 판단하게 만듭니다.", "tags": ["StringBuilder 메서드", "String.substring()", "StringBuilder.append(CharSequence,int,int)"], "occurrences": ["surepassexam Q49 p61"], "verified": "compiled", "fixes": ["문제 설명의 클래스·메서드 이름 `ccMask`/`maskcc`를 코드와 같은 `CCMask`/`maskCC`로 대소문자 수정"], "no": 145}, {"id": 87, "topic": "api", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class MyClass {\n    public static void main(String[] args) {\n        String s = \"Java Duke\";\n        int len = s.trim().length();\n        System.out.print(len);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "11", "code": null}, {"key": "C", "text": "8", "code": null}, {"key": "D", "text": "9", "code": null}, {"key": "E", "text": "10", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "`\"Java Duke\"`는 가운데 공백을 포함해 9글자이고, `trim()`은 앞뒤 공백만 제거하므로 길이는 9입니다.", "walkthrough": "1. `s = \"Java Duke\"`의 문자는 `J a v a (공백) D u k e`로 총 9개입니다.\n2. `trim()`은 문자열의 **앞과 뒤**의 공백만 제거합니다. 이 문자열에는 앞뒤 공백이 없으므로 결과는 그대로 `\"Java Duke\"`입니다. 가운데 공백은 제거되지 않습니다.\n3. `length()`는 9를 반환하고 `print(9)`가 실행되어 `9`가 출력됩니다.", "optionNotes": {"A": "`trim()`과 `length()`는 모두 String의 정상적인 메서드이며 체이닝도 합법이므로 컴파일됩니다.", "B": "11은 문자열 앞뒤에 공백이 하나씩 더 있을 때의 길이입니다. 이 문자열은 9글자입니다.", "C": "8은 가운데 공백까지 제거된다고 착각한 값입니다. `trim()`은 앞뒤 공백만 제거합니다.", "D": "정답입니다. 가운데 공백을 포함해 9글자이므로 `9`가 출력됩니다.", "E": "10은 공백이 하나 더 있을 때의 길이로, 이 문자열과 맞지 않습니다."}, "concepts": [{"title": "trim()이 제거하는 범위", "body": "`trim()`은 문자열 시작과 끝에 연속된 공백 문자(코드값 `\\u0020` 이하: 공백, 탭, 줄바꿈 등)만 제거한 새 String을 반환합니다. 단어 사이의 공백은 그대로 남습니다. 앞뒤에 제거할 공백이 없으면 원래 객체를 그대로 반환합니다. 모든 공백을 지우려면 `replace(\" \", \"\")`를 사용해야 합니다.\n```java\n\"  a b  \".trim();          // \"a b\" (길이 3)\n\"a b\".replace(\" \", \"\");    // \"ab\"\n```"}, {"title": "length() - 배열과 String의 차이", "body": "String의 길이는 메서드 `length()`로, 배열의 길이는 필드 `length`로 구합니다(괄호 없음). `ArrayList`의 요소 수는 `size()`입니다. 시험에서는 `str.length`나 `arr.length()`처럼 섞어 써서 컴파일 에러를 노리는 경우가 많습니다. String의 `length()`는 공백도 문자 하나로 셉니다."}], "trap": "`trim()`이 가운데 공백까지 지운다고 착각해 8을 고르게 만드는 문제입니다.", "tags": ["String.trim()", "String.length()"], "occurrences": ["surepassexam Q71 p65"], "verified": "compiled", "fixes": [], "no": 146}, {"id": 122, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [] args) {\n    ArrayList<Integer> points = new ArrayList<> ();\n    points.add (1);\n    points.add (2);\n    points.add (3);\n    points.add (4);\n    points.add (null);\n    points.remove (2);\n    points.remove (null);\n    System.out.println(points);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "B", "text": "[1, 2, 4]", "code": null}, {"key": "C", "text": "[1, 2, 4, null]", "code": null}, {"key": "D", "text": "[1, 3, 4, null]", "code": null}, {"key": "E", "text": "[1, 3, 4]", "code": null}, {"key": "F", "text": "Compilation fails.", "code": null}], "correct": "B", "dumpAnswer": "F", "answerNote": "덤프 정답 F(컴파일 실패)는 틀렸습니다. 덤프 해설의 스크린샷은 코드 조각을 클래스 없이 온라인 컴파일러에 붙여 넣어 \"No public class found\"가 나온 것일 뿐이며, 그 코드에는 `remove(2)`도 빠져 있습니다. 코드 조각 문제이므로 `import java.util.ArrayList;`와 클래스로 감싸서 실행하면 `[1, 2, 4]`(B)가 출력됩니다.", "summary": "`remove(2)`는 int 인자이므로 인덱스 2(값 3)를 지우고, `remove(null)`은 remove(Object)로 null 요소를 지워 `[1, 2, 4]`가 됩니다.", "walkthrough": "1. add 다섯 번 후 리스트는 `[1, 2, 3, 4, null]`입니다. ArrayList는 null 요소를 허용합니다.\n2. `points.remove(2)`: 인자 `2`는 int 리터럴이므로 박싱이 필요 없는 `remove(int index)`가 우선 선택됩니다. 인덱스 2의 값 3이 제거되어 `[1, 2, 4, null]`이 됩니다.\n3. `points.remove(null)`: null은 int가 될 수 없으므로 `remove(Object o)`가 선택되고, 첫 번째 null 요소를 찾아 제거합니다. 결과 `[1, 2, 4]`.\n4. `println`은 ArrayList의 toString으로 `[1, 2, 4]`를 출력합니다.\n실행 결과도 `[1, 2, 4]`입니다.", "optionNotes": {"A": "ArrayList는 null 요소를 저장하고, remove(Object)는 null을 `o == null` 비교로 찾아 지우므로 NullPointerException이 발생하지 않습니다.", "B": "정답입니다. 인덱스 2(값 3)가 지워지고 이어서 null 요소가 지워집니다.", "C": "`remove(null)`은 remove(Object)로 동작해 null 요소를 실제로 지우므로 null이 남지 않습니다.", "D": "`remove(2)`는 값 2가 아니라 인덱스 2(값 3)를 지웁니다. 또 null도 지워집니다.", "E": "`remove(2)`를 값 2 삭제로 오해한 결과입니다. int 인자는 remove(int index)가 선택됩니다.", "F": "`remove(null)`은 remove(int)에 맞지 않으므로 모호하지 않게 remove(Object)로 결정됩니다. 필요한 import와 클래스만 있으면 컴파일됩니다."}, "concepts": [{"title": "List.remove(int) vs remove(Object)", "body": "`List<Integer>`에서 `remove(1)`처럼 int를 넘기면 박싱 없이 맞는 `remove(int index)`가 선택되어 해당 위치를 지웁니다. 값을 지우고 싶으면 `remove(Integer.valueOf(1))`처럼 객체를 넘겨야 합니다. `remove(int)`는 지운 요소를 반환하고 범위를 벗어나면 IndexOutOfBoundsException, `remove(Object)`는 boolean을 반환하고 첫 번째로 일치하는 요소 하나만 지웁니다.\n```java\nList<Integer> l = new ArrayList<>(Arrays.asList(10, 1, 20));\nl.remove(1);                  // 인덱스 1 삭제 -> [10, 20]\nl.remove(Integer.valueOf(10)); // 값 10 삭제 -> [20]\n```"}, {"title": "오버로딩 해석 순서", "body": "컴파일러는 1단계 정확한 일치/확대 변환, 2단계 박싱·언박싱, 3단계 가변인자 순서로 메서드를 찾습니다. 앞 단계에서 후보가 나오면 뒤 단계는 보지 않습니다. 그래서 int 인자에 대해 remove(int)가 remove(Object)(박싱 필요)보다 우선합니다. null은 기본형으로 변환될 수 없으므로 참조형 매개변수만 후보가 됩니다."}], "trap": "`remove(2)`를 '값 2 삭제'로 읽게 만들고, `remove(null)`에서 NPE나 컴파일 에러를 떠올리게 만드는 함정입니다.", "tags": ["ArrayList.remove(int)", "ArrayList.remove(Object)", "오버로딩 해석"], "occurrences": ["surepassexam Q192 p90"], "verified": "compiled", "fixes": ["보기 C·D·E의 닫는 괄호 앞 불필요한 공백(`null ]`, `4 ]`)을 제거해 ArrayList 출력 형식과 맞춤"], "no": 147}, {"id": 133, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "LocalDate date1 = LocalDate.now();\nLocalDate date2 = LocalDate.of(2014, 6, 20);\nLocalDate date3 = LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE);\nSystem.out.println(\"date1 = \" + date1);\nSystem.out.println(\"date2 = \" + date2);\nSystem.out.println(\"date3 = \" + date3);"}, {"type": "text", "content": "Assume that the system date is June 20, 2014. What is the result?"}], "options": [{"key": "A", "text": "", "code": "date1 = 2014-06-20\ndate2 = 2014-06-20\ndate3 = 2014-06-20"}, {"key": "B", "text": "", "code": "date1 = 06/20/2014\ndate2 = 2014-06-20\ndate3 = Jun 20, 2014"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "A DateParseException is thrown at runtime.", "code": null}], "correct": "A", "dumpAnswer": "C/D", "answerNote": "덤프마다 C/D로 표기가 다르지만 둘 다 틀렸고 실제 정답은 A입니다. `\"2014-06-20\"`은 ISO_DATE 형식에 정확히 맞으므로 parse가 성공하고, LocalDate의 toString은 항상 `yyyy-MM-dd`(ISO-8601) 형식입니다. 또한 `DateParseException`이라는 클래스는 존재하지 않습니다(파싱 실패 시는 DateTimeParseException). `java.time.*`, `java.time.format.*` import를 보충해 실행했고, date2·date3가 `2014-06-20`으로 출력됨을 확인했습니다(date1은 실행 당일 날짜이므로 문제 가정대로라면 2014-06-20).\n\n**덤프 사본 비교:** 두 사본은 보기 순서가 다릅니다. p53 사본의 정답 C는 'ISO 형식 날짜 세 개' 보기(06이 05로 잘못 찍힘)라서 내용상 맞는 답이고, 이 전사본(p96)에서는 A에 해당합니다. p96의 정답 D(DateParseException)는 틀렸습니다. ISO_DATE에 맞는 문자열이라 파싱이 성공하고, LocalDate는 항상 yyyy-MM-dd 형식으로 출력됩니다.", "summary": "세 LocalDate 모두 2014-06-20이며, LocalDate.toString()은 항상 ISO 형식 `2014-06-20`으로 출력됩니다.", "walkthrough": "1. `LocalDate.now()`는 시스템 날짜를 가져오므로 가정에 따라 2014-06-20입니다.\n2. `LocalDate.of(2014, 6, 20)`은 월을 1부터 세는 int로 받으므로 2014년 6월 20일입니다.\n3. `LocalDate.parse(\"2014-06-20\", DateTimeFormatter.ISO_DATE)`: ISO_DATE는 `yyyy-MM-dd`(오프셋 선택적) 형식이며 문자열이 정확히 일치하므로 파싱 성공입니다.\n4. 문자열 연결 시 `LocalDate.toString()`이 호출되는데, 이는 생성 방식이나 파싱에 사용한 포매터와 무관하게 항상 `yyyy-MM-dd`를 반환합니다.\n5. 따라서 세 줄 모두 `2014-06-20`입니다.", "optionNotes": {"A": "정답입니다. 세 객체 모두 같은 날짜이고 toString()은 ISO 형식이므로 세 줄 모두 `2014-06-20`입니다.", "B": "LocalDate는 로케일에 따른 형식(`06/20/2014`, `Jun 20, 2014`)으로 출력하지 않습니다. 그런 형식은 `format()`에 별도 포매터를 넘겨야 얻을 수 있습니다.", "C": "`LocalDate.now()`, `of()`, `parse(CharSequence, DateTimeFormatter)`는 모두 존재하는 static 메서드이고 `DateTimeFormatter.ISO_DATE`도 존재하는 상수입니다. import만 있으면 컴파일됩니다.", "D": "입력 문자열이 ISO_DATE 형식과 정확히 일치하므로 파싱 예외가 없습니다. 게다가 실제 예외 클래스 이름은 `DateTimeParseException`이며 `DateParseException`은 존재하지 않습니다."}, "concepts": [{"title": "LocalDate 생성 방법", "body": "LocalDate는 생성자가 없고(private) static 팩토리 메서드로 만듭니다. `now()`, `of(year, month, day)`(month는 1~12 int 또는 `Month.JUNE`), `parse(문자열)`(기본 ISO_LOCAL_DATE), `parse(문자열, 포매터)`가 있습니다. 잘못된 날짜 값은 DateTimeException, 형식이 맞지 않는 문자열은 DateTimeParseException(런타임 예외)을 던집니다.\n```java\nLocalDate.parse(\"2014-06-20\");        // OK\nLocalDate.parse(\"2014/06/20\");        // DateTimeParseException\nLocalDate.of(2014, Month.JUNE, 20);   // OK\n```"}, {"title": "toString()과 format()의 차이", "body": "LocalDate.toString()은 항상 `2014-06-20`, LocalTime은 `10:15:30`, LocalDateTime은 `2014-06-20T10:15:30` 형식입니다. 다른 모양으로 출력하려면 `date.format(DateTimeFormatter.ofPattern(\"MM/dd/yyyy\"))`처럼 포매터를 명시해야 합니다. 파싱에 쓴 포매터는 객체에 저장되지 않으므로 출력 형식에 영향을 주지 않습니다."}], "trap": "ISO_DATE 포매터나 now()를 보고 출력 형식이 달라지거나 예외가 날 것처럼 보이게 만들고, 존재하지 않는 예외 이름(DateParseException)으로 혼동을 줍니다.", "tags": ["LocalDate.of/parse/now", "DateTimeFormatter.ISO_DATE", "LocalDate.toString"], "occurrences": ["surepassexam Q234 p96", "surepassexam Q10 p53"], "verified": "compiled", "fixes": ["보기 D의 철자 오류 `DateParseExcpetion`을 `DateParseException`으로 수정(존재하지 않는 예외 이름이라는 함정은 유지)"], "no": 148}, {"id": 134, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2012, 01, 32);\n    date.plusDays(10);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2012-02-10", "code": null}, {"key": "B", "text": "2012-02-11", "code": null}, {"key": "C", "text": "Compilation fails", "code": null}, {"key": "D", "text": "A DateTimeException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "C", "answerNote": "덤프 정답 C(컴파일 실패)는 틀렸습니다. `01`은 합법적인 8진수 int 리터럴(값 1)이고 `32`도 int이므로 컴파일됩니다. 날짜 유효성은 런타임에 검사되어 `LocalDate.of(2012, 1, 32)`에서 DateTimeException이 발생합니다. 실제 실행 결과도 `java.time.DateTimeException: Invalid value for DayOfMonth (valid values 1 - 28/31): 32`였습니다.", "summary": "1월 32일은 존재하지 않으므로 `LocalDate.of`가 런타임에 DateTimeException을 던집니다.", "walkthrough": "1. `LocalDate.of(2012, 01, 32)`의 인자는 모두 int입니다. `01`은 0으로 시작하는 8진수 리터럴이지만 값은 1이며 합법입니다(08, 09였다면 컴파일 에러).\n2. 컴파일러는 날짜 유효성을 검사하지 않으므로 컴파일은 성공합니다.\n3. 실행 시 `of()`가 일(day-of-month) 값을 검증하는데 32는 1~31 범위를 벗어나므로 `DateTimeException`을 던집니다.\n4. 예외가 처리되지 않아 main이 종료되므로 이후 `plusDays`와 `println`은 실행되지 않습니다.\n참고로 날짜가 유효했더라도 `date.plusDays(10);`의 반환값을 버리므로 date는 바뀌지 않습니다.", "optionNotes": {"A": "LocalDate는 범위를 넘는 일자를 다음 달로 넘겨 주지(lenient) 않습니다. 32일 자체가 예외입니다.", "B": "1월 32일을 2월 1일로 보정한 뒤 10일을 더한 값처럼 보이지만, 보정 없이 예외가 나고 plusDays 결과도 대입되지 않습니다.", "C": "`01`은 합법적인 8진수 리터럴이며 날짜 범위는 컴파일 시점에 검사하지 않으므로 컴파일됩니다. 덤프 정답이지만 틀립니다.", "D": "정답입니다. 존재하지 않는 날짜(1월 32일)로 `LocalDate.of`를 호출해 DateTimeException이 발생합니다."}, "concepts": [{"title": "LocalDate.of의 값 검증", "body": "`LocalDate.of`는 연·월·일이 유효한지 런타임에 검사해 잘못되면 `DateTimeException`(RuntimeException 하위)을 던집니다. 월 13, 일 0, 평년 2월 29일(`of(2013, 2, 29)`) 모두 예외입니다. 이전 Calendar처럼 넘친 값을 자동으로 다음 달로 넘기지 않습니다. 반면 `plusDays(40)`처럼 연산 메서드는 월·연을 넘어가도록 올바르게 계산합니다."}, {"title": "java.time 객체는 불변", "body": "LocalDate, LocalTime, LocalDateTime, Period는 불변 객체입니다. `plusDays`, `minusMonths`, `withYear` 등은 새 객체를 반환하므로 결과를 대입해야 합니다.\n```java\nLocalDate d = LocalDate.of(2012, 1, 31);\nd.plusDays(1);        // 결과 버림, d는 그대로\nd = d.plusDays(1);    // 2012-02-01\n```"}, {"title": "정수 리터럴 진법", "body": "0으로 시작하면 8진수(`010` == 8), `0x`는 16진수, `0b`는 2진수(Java 7+)입니다. 8진수에는 0~7만 쓸 수 있어 `08`, `09`는 컴파일 에러입니다. 그래서 `of(2012, 01, 32)`는 컴파일되지만 `of(2012, 09, 1)`은 컴파일되지 않습니다."}], "trap": "`01`(8진수)과 잘못된 날짜를 보고 컴파일 에러를 고르게 만들거나, 반환값을 버리는 `plusDays`로 날짜 계산 결과를 고르게 만듭니다.", "tags": ["LocalDate.of 검증", "DateTimeException", "LocalDate 불변성", "8진수 리터럴"], "occurrences": ["surepassexam Q235 p96"], "verified": "compiled", "fixes": [], "no": 149}, {"id": 147, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String myStr = \"Hello World \";\n    myStr.trim();\n    int i1 = myStr.indexOf(\" \");\n    System.out.println(i1);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "An exception is thrown at runtime.", "code": null}, {"key": "B", "text": "-1", "code": null}, {"key": "C", "text": "5", "code": null}, {"key": "D", "text": "10", "code": null}], "correct": "C", "dumpAnswer": "A", "answerNote": "덤프 정답 A(런타임 예외)는 틀렸습니다. `myStr.trim()`의 반환값을 버렸을 뿐 예외가 날 곳이 없습니다. 실제로 실행하면 `5`가 출력됩니다(javac/java로 확인). 정답은 C입니다.", "summary": "`trim()`은 새 String을 반환할 뿐 원본을 바꾸지 않으므로, `\"Hello World \"`에서 첫 공백의 위치인 5가 출력됩니다.", "walkthrough": "1. `myStr`는 `\"Hello World \"`(끝에 공백 포함, 길이 12)를 참조합니다.\n2. `myStr.trim();`은 앞뒤 공백을 제거한 새 문자열 `\"Hello World\"`를 만들어 반환합니다. 하지만 그 결과를 어떤 변수에도 대입하지 않았으므로 버려집니다. String은 불변이라 `myStr`는 여전히 `\"Hello World \"`입니다.\n3. `myStr.indexOf(\" \")`는 처음 나오는 공백의 인덱스를 반환합니다. `H(0) e(1) l(2) l(3) o(4) ' '(5)`이므로 `5`입니다.\n4. `System.out.println(i1)`이 `5`를 출력합니다.\n참고로 `trim()` 결과를 대입했더라도 `\"Hello World\"`의 첫 공백은 역시 인덱스 5이므로 답은 같습니다. 이 문제에서 `trim()`은 결과에 영향을 주지 않습니다.", "optionNotes": {"A": "예외가 발생할 코드가 없습니다. `trim()`과 `indexOf()`는 null이 아닌 문자열에서 정상 동작하고, `indexOf`는 찾지 못해도 예외 대신 -1을 반환합니다.", "B": "-1은 `indexOf`가 대상을 찾지 못했을 때의 반환값입니다. 문자열에 공백이 있으므로 -1이 아닙니다.", "C": "정답입니다. 첫 번째 공백은 \"Hello\" 다음, 인덱스 5에 있습니다.", "D": "10은 마지막 문자 'd'의 인덱스이고, 끝 공백의 인덱스는 11입니다. `indexOf`는 첫 번째로 일치하는 위치를 반환하므로 10도 11도 아닙니다. 마지막 위치는 `lastIndexOf`로 구합니다."}, "concepts": [{"title": "String 불변성과 반환값 무시", "body": "String의 `trim()`, `toUpperCase()`, `concat()`, `replace()`, `substring()` 같은 메서드는 원본을 바꾸지 않고 새 String을 반환합니다. 결과를 다시 대입하지 않으면(`s = s.trim();`) 원본 변수는 그대로입니다. 시험에서는 `s.trim();`, `s.concat(\"x\");`처럼 반환값을 버리는 코드를 자주 냅니다. 반대로 `StringBuilder`의 `append()`, `insert()`, `reverse()`, `delete()`는 객체 자체를 바꿉니다."}, {"title": "indexOf / lastIndexOf", "body": "`indexOf(String str)`는 처음 일치하는 시작 인덱스를, 찾지 못하면 `-1`을 반환하며 예외를 던지지 않습니다. `indexOf(str, fromIndex)`는 `fromIndex`부터 검색하고, `lastIndexOf`는 뒤에서부터 찾습니다. 인덱스는 0부터 시작합니다.\n```java\n\"Hello World \".indexOf(\" \");     // 5\n\"Hello World \".lastIndexOf(\" \"); // 11\n\"abc\".indexOf(\"z\");              // -1\n```"}], "trap": "`myStr.trim();`처럼 결과를 대입하지 않은 호출이 원본을 바꾼다고 착각하게 만들고, 예외라는 그럴듯한 보기를 섞어 둡니다.", "tags": ["String 불변성", "String.trim()", "String.indexOf()"], "occurrences": ["certleader-B Q57 p111", "certleader-C Q48 p151"], "verified": "compiled", "fixes": [], "no": 150}, {"id": 151, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    StringBuilder sb = new StringBuilder(\"Java\");\n    String s = \"Java\";\n\n    if (sb.toString().equals(s.toString())) {\n        System.out.println(\"Match 1\");\n    } else if (sb.equals(s)) {\n        System.out.println(\"Match 2\");\n    } else {\n        System.out.println(\"No Match\");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Match 1", "code": null}, {"key": "B", "text": "Match 2", "code": null}, {"key": "C", "text": "No Match", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "`sb.toString()`으로 만든 String과 `s`는 내용이 같으므로 `String.equals()`가 true가 되어 `Match 1`이 출력됩니다.", "walkthrough": "1. `sb`는 내용이 \"Java\"인 `StringBuilder`, `s`는 문자열 리터럴 \"Java\"입니다.\n2. 첫 조건 `sb.toString().equals(s.toString())`에서 `sb.toString()`은 \"Java\" 내용의 새 String입니다. `s.toString()`은 String 자기 자신을 반환합니다.\n3. `String.equals()`는 문자 내용을 비교하므로 true입니다. 따라서 `Match 1`이 출력되고 나머지 `else if`/`else`는 평가되지 않습니다.\n4. 참고로 두 번째 조건 `sb.equals(s)`가 평가됐다면 false입니다. `StringBuilder`는 `equals()`를 오버라이딩하지 않아 `Object.equals()`, 즉 참조 비교를 쓰고, 타입부터 다른 String과 비교하기 때문입니다.", "optionNotes": {"A": "정답입니다. `toString()`으로 String을 만든 뒤 `String.equals()`로 내용을 비교하므로 true입니다.", "B": "실행 흐름이 첫 `if`에서 끝나므로 이 분기에는 도달하지 않습니다. 도달하더라도 `StringBuilder.equals()`는 참조 비교라 String과 비교하면 false입니다.", "C": "첫 조건이 true이므로 `else`에 가지 않습니다.", "D": "`sb`와 `s` 모두 null이 아닌 객체를 참조하므로 `NullPointerException`이 발생할 이유가 없습니다."}, "concepts": [{"title": "StringBuilder는 equals()를 오버라이딩하지 않는다", "body": "`String`은 `equals()`를 오버라이딩해서 문자 내용을 비교하지만 `StringBuilder`(`StringBuffer`도)는 오버라이딩하지 않았으므로 `Object.equals()`, 즉 `==`와 같은 참조 비교가 됩니다. 그래서 `new StringBuilder(\"a\").equals(new StringBuilder(\"a\"))`도 false입니다. 내용을 비교하려면 `sb1.toString().equals(sb2.toString())`처럼 String으로 바꿔 비교합니다. `\"Java\".equals(sb)`도 false입니다. `String.equals()`는 인자가 String일 때만 true가 될 수 있기 때문입니다. 내용 비교가 필요하면 `\"Java\".contentEquals(sb)`를 씁니다."}, {"title": "== 와 equals() 비교", "body": "`==`는 참조형에서 같은 객체인지를 비교합니다. `String s = \"Java\"; String t = \"Java\";`는 상수 풀 때문에 `s == t`가 true이지만, `sb.toString()`은 런타임에 새 String을 만들므로 `sb.toString() == s`는 false입니다. 또 `sb == s`처럼 서로 관련 없는 클래스 타입끼리 `==`로 비교하면 컴파일 에러(incomparable types)가 납니다."}], "trap": "`sb.equals(s)`가 내용 비교라고 착각하게 만들지만, 사실 이 줄은 첫 `if`에서 이미 걸러져 실행되지 않습니다. 문제는 첫 조건만 정확히 판단하면 됩니다.", "tags": ["StringBuilder.equals()", "String.equals()", "toString()"], "occurrences": ["certleader-B Q75 p113", "certleader-C Q60 p152"], "verified": "compiled", "fixes": [], "no": 151}, {"id": 165, "topic": "api", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class MyClass {\n    public static void main(String[] args) {\n        String s = \"Java SE 8 1\";\n        int len = s.trim().length();\n        System.out.print(len);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "11", "code": null}, {"key": "C", "text": "8", "code": null}, {"key": "D", "text": "9", "code": null}, {"key": "E", "text": "10", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "`trim()`은 문자열 앞뒤 공백만 제거하므로, 앞뒤에 공백이 없는 `\"Java SE 8 1\"`의 길이 11이 그대로 출력됩니다.", "walkthrough": "1. `s = \"Java SE 8 1\"`의 문자를 세면 `J a v a`(4) + 공백(1) + `S E`(2) + 공백(1) + `8`(1) + 공백(1) + `1`(1) = 11입니다.\n2. `s.trim()`은 맨 앞과 맨 뒤의 공백만 제거합니다. 이 문자열은 첫 글자 `J`, 마지막 글자 `1`이라 제거할 공백이 없고, 가운데 공백 3개는 그대로 남습니다.\n3. `length()`는 11이고 `print(len)`이 `11`을 출력합니다. 실제 실행 결과도 `11`입니다.", "optionNotes": {"A": "`s.trim().length()`는 String을 반환하는 메서드에 이어서 호출하는 합법적인 메서드 체이닝이므로 컴파일 에러가 없습니다.", "B": "정답입니다. 앞뒤 공백이 없어 `trim()` 후에도 길이 11이 유지됩니다.", "C": "8은 공백 3개를 모두 뺀 글자 수입니다. `trim()`은 중간 공백을 지우지 않습니다.", "D": "9는 중간 공백 일부를 지웠다고 잘못 계산한 값입니다. 공백은 하나도 제거되지 않습니다.", "E": "10은 길이를 마지막 인덱스(10)와 혼동했을 때의 값입니다. 인덱스는 0~10이고 길이는 11입니다."}, "concepts": [{"title": "trim()의 동작 범위", "body": "`trim()`은 문자열의 맨 앞과 맨 뒤에서 코드값 `\\u0020` 이하의 문자(공백, 탭, 줄바꿈 등)를 연속으로 제거한 새 String을 반환합니다. 가운데 공백은 건드리지 않습니다. 제거할 것이 없으면 같은 객체를 그대로 반환합니다. 중간 공백까지 없애려면 `replace(\" \", \"\")`를 씁니다. (`strip()`은 Java 11 API이므로 1Z0-808 범위가 아닙니다.)"}, {"title": "length()와 인덱스", "body": "String은 `length()` 메서드, 배열은 `length` 필드로 크기를 구합니다(`s.length` 또는 `arr.length()`는 컴파일 에러). 인덱스는 0부터 `length()-1`까지이므로, 마지막 문자의 인덱스와 길이가 1 차이 난다는 점을 늘 확인해야 합니다. `charAt(length())`는 `StringIndexOutOfBoundsException`을 던집니다."}], "trap": "`trim()`이 모든 공백을 지운다고 착각하게 해서 8을 고르게 하거나, 마지막 인덱스(10)와 길이를 혼동하게 만듭니다.", "tags": ["String.trim()", "String.length()"], "occurrences": ["certleader-C Q21 p146"], "verified": "compiled", "fixes": [], "no": 152}, {"id": 169, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "String[] strs = {\"A\", \"B\"};\nint idx = 0;\nfor (String s : strs) {\n    strs[idx].concat(\" element \" + idx);\n    idx++;\n}\nfor (idx = 0; idx < strs.length; idx++) {\n    System.out.println(strs[idx]);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "A\nB"}, {"key": "B", "text": "", "code": "A element 0\nB element 1"}, {"key": "C", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "D", "text": "", "code": "A 0\nB 1"}], "correct": "A", "dumpAnswer": "C", "answerNote": "덤프 정답 C(NullPointerException)는 틀렸습니다. 배열 요소 \"A\", \"B\"는 null이 아니고, `concat()` 결과를 버릴 뿐 예외가 날 곳이 없습니다. 실제로 실행하면 `A`와 `B`가 각각 한 줄씩 출력됩니다(javac/java로 확인). 정답은 A입니다.", "summary": "`concat()`의 결과를 배열에 다시 대입하지 않았으므로 배열은 그대로이며, `A`와 `B`가 출력됩니다.", "walkthrough": "(컴파일을 위해 코드를 `main` 메서드 안에 넣어 테스트했습니다.)\n1. `strs = {\"A\", \"B\"}`, `idx = 0`.\n2. 첫 번째 for-each 반복(`s`=\"A\"): `strs[0].concat(\" element 0\")`이 새 문자열 \"A element 0\"을 CE (f8) Q18", "gratisexam-VCE (f9) Q16", "passleader-300q (f2) Q18", "passleader-300q (f2) Q2", "passleader-300q (f2) Q26", "passleader-300q (f2) Q36", "scanned (f3) Q22"], "added": true, "dumpAnswer": "A/D", "no": 157}, {"id": "X17", "topic": "api", "tags": ["LocalDate", "DateTimeFormatter", "UnsupportedTemporalTypeException", "ISO_DATE_TIME"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String date = LocalDate\n                    .parse(\"2014-05-04\")\n                    .format(DateTimeFormatter.ISO_DATE_TIME);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "May 04, 2014T00:00:00.000", "code": null}, {"key": "B", "text": "2014-05-04T00:00:00.000", "code": null}, {"key": "C", "text": "5/4/14T00:00:00.000", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "choose": 1, "correct": "D", "dumpAnswersAll": ["D"], "answerNote": "", "verified": "compiled", "summary": "`LocalDate`에는 시간 필드가 없는데 `ISO_DATE_TIME`은 시·분·초를 요구하므로, 실행 시 `UnsupportedTemporalTypeException`이 발생합니다.", "walkthrough": "1. `LocalDate.parse(\"2014-05-04\")`는 ISO 형식(yyyy-MM-dd) 문자열을 정상적으로 파싱해 2014년 5월 4일 `LocalDate`를 만듭니다.\n2. `.format(DateTimeFormatter.ISO_DATE_TIME)`은 날짜 + `T` + 시간(시:분:초)을 출력하는 포매터입니다.\n3. 포매터가 시간 부분을 출력하려고 `HourOfDay` 필드를 요청하지만, `LocalDate`는 날짜만 가진 객체라 그 필드를 지원하지 않습니다.\n4. 그래서 `java.time.temporal.UnsupportedTemporalTypeException: Unsupported field: HourOfDay`가 실행 시점에 던져집니다(`DateTimeException`의 하위 클래스, unchecked).\n5. 컴파일은 정상이고 `println`까지 도달하지 못하므로 정답은 D입니다.", "optionNotes": {"A": "`ISO_DATE_TIME`은 월 이름(May) 형식을 쓰지 않으며, 애초에 `LocalDate`에는 시간이 없어 예외가 발생합니다.", "B": "`LocalDateTime`이었다면 비슷한 ISO 형식이 나왔겠지만(`2014-05-04T00:00:00`), `LocalDate`에는 시간 필드가 없어 예외가 발생합니다. 시간이 0으로 자동 채워지지 않습니다.", "C": "`5/4/14` 같은 짧은 형식은 `ISO_DATE_TIME`과 무관하며, 결국 예외가 발생합니다.", "D": "정답입니다. 시간 필드가 없는 `LocalDate`를 시간까지 출력하는 포매터로 포맷하면 `UnsupportedTemporalTypeException`이 발생합니다."}, "concepts": [{"title": "java.time 타입과 포매터의 궁합", "body": "`LocalDate`는 날짜만, `LocalTime`은 시간만, `LocalDateTime`은 둘 다 가집니다. 포매터가 요구하는 필드를 객체가 가지고 있지 않으면 실행 시 `UnsupportedTemporalTypeException`이 발생합니다(컴파일 오류가 아님).\n\n- `LocalDate` + `ISO_DATE` / `ISO_LOCAL_DATE` → `2014-05-04` 정상.\n- `LocalDate` + `ISO_DATE_TIME`, `ofPattern(\"HH:mm\")` → 예외.\n- `LocalTime` + `ofPattern(\"yyyy\")` → 예외.\n- `LocalDateTime` + `ISO_DATE` → 날짜 부분만 출력되며 정상입니다(필드가 남는 것은 괜찮고, 모자라는 것이 문제)."}, {"title": "LocalDate.parse()", "body": "`LocalDate.parse(CharSequence)`는 기본으로 `ISO_LOCAL_DATE`(yyyy-MM-dd) 형식만 받습니다. \"2014-5-4\"처럼 두 자리를 지키지 않거나 다른 형식이면 `DateTimeParseException`이 발생합니다. 다른 형식은 `LocalDate.parse(text, DateTimeFormatter.ofPattern(...))`로 파싱합니다."}], "trap": "parse가 성공하니 format도 시간을 00:00으로 채워 출력할 것 같지만, `LocalDate`에는 시간 필드가 없어 예외가 발생합니다. 보기 B가 그럴듯해 보이도록 만든 함정입니다.", "fixes": ["보기 B의 \"2014-05-04T00:00: 00. 000\"에 끼어든 공백 인쇄 오류를 제거했습니다.", "gratisexam f20 사본에서 빠진 `String` 타입 선언을 다른 사본에 따라 복원했습니다."], "occurrences": ["gratisexam-VCE (f20) Q3", "passleader-300q (f2) Q3", "passleader-300q (f2) Q49", "scanned (f3) Q5"], "added": true, "dumpAnswer": "D", "no": 158}], "lede": "여러 덤프 사이트의 1Z0-808 샘플을 합친 PDF에서 중복을 걸러낸 문제마다, 코드를 Java 8로 직접 컴파일·실행해 확인한 정답과 해설, 관련 개념을 정리했습니다. 보기를 골라 풀어 본 뒤 해설을 펼쳐 보세요."}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const TOPICS = DATA.topics;            // [{key, name, en}]
  const QS = DATA.questions;             // ordered
  const topicName = Object.fromEntries(TOPICS.map(t => [t.key, t.name]));

  // ---- progress: append-only attempt log + bookmarks, kept in this browser and optionally synced to a private gist ----
  const KEY = 'ocajp-notes-v2', OLD_KEY = 'ocajp-notes-v1', SYNC_KEY = 'ocajp-sync-v1', GIST_FILE = 'ocajp-progress.json';
  const sid = q => String(q.id);
  const noById = Object.fromEntries(QS.map(q => [sid(q), q.no]));
  const idByNo = Object.fromEntries(QS.map(q => [q.no, sid(q)]));
  let db = { log: [], flag: {}, reset: 0 };          // log: [{q: id, p: picked, ok: 0|1, t: ms}], flag: {id: {on, t}}
  let store = { res: {}, flag: {}, stat: {} };       // derived view keyed by question no
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && Array.isArray(s.log)) db = Object.assign(db, s);
    else {
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if (old && old.res) {
        const t = Date.now();
        Object.keys(old.res).forEach(no => idByNo[no] && db.log.push({ q: idByNo[no], p: '', ok: old.res[no] === 'ok' ? 1 : 0, t }));
        Object.keys(old.flag || {}).forEach(no => idByNo[no] && (db.flag[idByNo[no]] = { on: 1, t }));
      }
    }
  } catch (e) {}
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
  function derive() {
    const res = {}, stat = {}, flag = {};
    db.log.forEach(e => {
      const no = noById[e.q]; if (!no) return;
      const s = stat[no] || (stat[no] = { n: 0, c: 0, t: 0 });
      s.n++; if (e.ok) s.c++;
      if (e.t >= s.t) { s.t = e.t; s.p = e.p; res[no] = e.ok ? 'ok' : 'bad'; }
    });
    Object.keys(db.flag).forEach(id => { if (db.flag[id].on && noById[id]) flag[noById[id]] = 1; });
    store = { res, flag, stat };
  }
  function merge(a, b) {
    const seen = new Set(), log = [];
    (a.log || []).concat(b.log || []).forEach(e => {
      const k = e.q + '|' + e.t + '|' + e.p;
      if (!seen.has(k)) { seen.add(k); log.push(e); }
    });
    log.sort((x, y) => x.t - y.t);
    const flag = Object.assign({}, a.flag);
    Object.keys(b.flag || {}).forEach(id => { if (!flag[id] || b.flag[id].t > flag[id].t) flag[id] = b.flag[id]; });
    const reset = Math.max(a.reset || 0, b.reset || 0);
    Object.keys(flag).forEach(id => { if (flag[id].t <= reset) delete flag[id]; });
    return { log: log.filter(e => e.t > reset).slice(-5000), flag, reset };
  }

  // gist sync
  let sync = {};
  try { sync = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch (e) {}
  const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} };
  let pushTimer = null, running = false, pending = false;
  const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function setStatus(s) {
    const el = document.getElementById('sync-status');
    const text = {
      off: '이 기기에만 저장하고 있습니다.',
      syncing: '동기화하는 중입니다…',
      ok: 'GitHub gist와 동기화했습니다 · ' + hhmm(sync.last || Date.now()),
      offline: '오프라인입니다. 기기에 저장해 두고, 연결되면 올립니다.',
      auth: '토큰이 거부되었습니다. gist 권한이 있는 토큰인지 확인해 주세요.',
      error: '동기화하지 못했습니다. 기록은 기기에 남아 있고, 다음 풀이 때 다시 시도합니다.'
    }[s];
    el.dataset.s = s; el.textContent = text;
  }
  async function api(path, opt) {
    const r = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opt, {
      headers: { Authorization: 'Bearer ' + sync.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
    }));
    if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
    return r.json();
  }
  async function findGist() {
    if (sync.gist) return;
    for (let page = 1; page <= 10; page++) {
      const list = await api('/gists?per_page=100&page=' + page);
      const g = list.find(x => x.files && x.files[GIST_FILE]);
      if (g) { sync.gist = g.id; return; }
      if (list.length < 100) break;
    }
    const g = await api('/gists', { method: 'POST', body: JSON.stringify({
      description: 'OCAJP 1Z0-808 해설 노트 풀이 기록', public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(db) } } }) });
    sync.gist = g.id;
  }
  async function readRemote() {
    const g = await api('/gists/' + sync.gist);
    const f = g.files && g.files[GIST_FILE];
    if (!f) return { log: [], flag: {}, reset: 0 };
    let text = f.content;
    if (f.truncated) text = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
    try { return JSON.parse(text); } catch (e) { return { log: [], flag: {}, reset: 0 }; }
  }
  async function syncNow() {
    if (!sync.token) { setStatus('off'); return; }
    if (running) { pending = true; return; }
    if (navigator.onLine === false) { setStatus('offline'); return; }
    running = true; clearTimeout(pushTimer); pushTimer = null; setStatus('syncing');
    try {
      await findGist(); saveSync();
      const remote = await readRemote();
      const merged = merge(db, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(merge(remote, { log: [], flag: {} }));
      db = merged; saveLocal(); derive(); renderAll();
      if (changed) await api('/gists/' + sync.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(db) } } }) });
      sync.last = Date.now(); saveSync(); setStatus('ok');
    } catch (e) {
      if (e.status === 401 || e.status === 403) setStatus('auth');
      else if (e.status === 404) { sync.gist = null; saveSync(); setStatus('error'); }
      else setStatus(navigator.onLine === false ? 'offline' : 'error');
    } finally {
      running = false;
      if (pending) { pending = false; schedulePush(500); }
    }
  }
  function schedulePush(ms) { if (!sync.token) return; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, ms == null ? 2500 : ms); }
  function commit() { saveLocal(); derive(); renderAll(); schedulePush(); }

  // ---- tiny markdown ----
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function codeBlock(src, lang) {
    let html;
    try { html = (window.hljs && lang !== 'text') ? hljs.highlight(src, { language: 'java', ignoreIllegals: true }).value : esc(src); }
    catch (e) { html = esc(src); }
    return '<pre class="code"><code>' + html + '</code></pre>';
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  function md(text) {
    if (!text) return '';
    const out = []; const lines = String(text).replace(/\r/g, '').split('\n');
    let i = 0, para = [], list = null;
    const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
    while (i < lines.length) {
      const l = lines[i];
      const fence = l.match(/^\s*```(\w*)/);
      if (fence) {
        flushP(); flushL(); const buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        out.push(codeBlock(buf.join('\n'), fence[1] || 'java')); i++; continue;
      }
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        flushP(); const t = ul ? 'ul' : 'ol';
        if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
        list.items.push((ul || ol)[1]); i++; continue;
      }
      if (!l.trim()) { flushP(); flushL(); i++; continue; }
      if (list) { list.items[list.items.length - 1] += ' ' + l.trim(); i++; continue; }
      para.push(l.trim()); i++;
    }
    flushP(); flushL();
    return out.join('');
  }
  const looksLikeCode = s => /[;{}()=]|^\s*(java|javac)\s/.test(s) && !/[가-힣]/.test(s);

  // ---- render ----
  const main = document.getElementById('main');
  const state = { topic: 'all', q: '', flag: false, wrong: false, disputed: false, reveal: false };

  function stemHTML(q) {
    return q.parts.map(p => p.type === 'code' ? codeBlock(p.content) : '<p>' + inline(p.content).replace(/\n/g, '<br>') + '</p>').join('');
  }
  function optHTML(o) {
    let body = '';
    if (o.text) body += looksLikeCode(o.text) && !o.code ? codeBlock(o.text) : '<div>' + inline(o.text) + '</div>';
    if (o.code) body += codeBlock(o.code);
    return '<li><button type="button" class="opt" data-k="' + o.key + '"><span class="key">' + o.key + '</span><span class="body">' + body + '</span></button></li>';
  }
  function exHTML(q) {
    const right = new Set(q.correct.split(''));

    if (q.answerNote) h += '<div class="note md"><b class="lbl">' + (q.dumpAnswer && q.dumpAnswer !== q.correct ? '덤프 표기 ' + esc(q.dumpAnswer) + ' · 검증 정답 ' + esc(q.correct) : '참고') + '</b> ' + md(q.answerNote).replace(/^<p>|<\/p>$/g, '') + '</div>';
    if (q.fixes && q.fixes.length) h += '<details class="concept"><summary>원본 덤프의 인쇄 오류 ' + q.fixes.length + '곳을 바로잡았습니다</summary><div class="md">' + md(q.fixes.map(f => '- ' + f).join('\n')) + '</div></details>';
    h += '<section><h3>풀이</h3><div class="md">' + md(q.walkthrough) + '</div></section>';
    h += '<section><h3>보기별 분석</h3><div class="optex">' + q.options.map(o =>
      '<div class="row' + (right.has(o.key) ? ' right' : '') + '"><span class="key">' + o.key + (right.has(o.key) ? ' ✓' : '') + '</span><div class="md">' + md((q.optionNotes || {})[o.key] || '') + '</div></div>').join('') + '</div></section>';
    if (q.concepts && q.concepts.length) h += '<section><h3>관련 개념</h3><div style="display:grid;gap:8px">' + q.concepts.map((c, i) =>
      '<details class="concept"' + (i === 0 ? ' open' : '') + '><summary>' + inline(c.title) + '</summary><div class="md">' + md(c.body) + '</div></details>').join('') + '</div></section>';
    if (q.trap) h += '<section><h3>시험 함정</h3><div class="trap md">' + md(q.trap) + '</div></section>';
    if (q.tags && q.tags.length) h += '<div class="tags">' + q.tags.map(t => '<button type="button" class="tag" data-tag="' + esc(t) + '">#' + esc(t) + '</button>').join('') + '</div>';
    return h + '</div>';
  }
  function cardHTML(q) {
    const occ = q.occurrences || [];
    let src = q.supplement ? '이 PDF에 없는 범위를 보완하려고 직접 만든 연습 문제입니다.' :
      '출처: ' + esc(occ[0] || '') + (occ.length > 1 ? ' 외 ' + (occ.length - 1) + '곳에 같은 문제' : '') + (q.added ? ' · 추가 덤프 저장소에서 보완' : '');
    return '<article class="q" id="q' + q.no + '" data-no="' + q.no + '">' +
      '<div class="qhead"><span class="qno">Q' + String(q.no).padStart(3, '0') + '</span>' +

      (q.fixes && q.fixes.length ? '<span class="chip multi" title="원본 덤프의 인쇄 오류를 바로잡은 문제입니다">원문 수정</span>' : '') +
      (q.correct.length > 1 ? '<span class="chip multi">' + q.correct.length + '개 선택</span>' : '') +
      '<span class="spacer"></span><button type="button" class="flag-btn" aria-pressed="false">북마크</button></div>' +
      '<div class="stem">' + stemHTML(q) + '</div>' +
      '<ul class="opts">' + q.options.map(optHTML).join('') + '</ul>' +
      '<div class="actions"><button type="button" class="btn act-check">채점하기</button><button type="button" class="btn ghost act-show">해설 보기</button><button type="button" class="btn ghost act-retry" hidden>다시 풀기</button><span class="verdict"></span></div>' +
      exHTML(q) +
      '<div class="src">' + src + '<span class="mine"></span></div></article>';
  }

  const byNo = Object.fromEntries(QS.map(q => [q.no, q]));
  let html = '';
  TOPICS.forEach(t => {
    const list = QS.filter(q => q.topic === t.key);

    html += '<div class="section-head" data-topic="' + t.key + '"><h2>' + esc(t.name) + '</h2><span>' + esc(t.en) + ' · ' + list.length + '문제</span></div>';
    html += list.map(cardHTML).join('');
  });
  html += '<p class="empty" id="empty" hidden>조건에 맞는 문제가 없습니다. 검색어나 필터를 바꿔 보세요.</p>';
  html += '<section id="history"><div class="section-head"><h2>학습 기록</h2><span id="hist-sub"></span></div><div class="hist" id="hist"></div>' +
    '<p style="margin:14px 0 0"><button class="linkish" id="reset" type="button">풀이 기록 초기화</button></p></section>';
  html += '<section id="index"><div class="section-head"><h2>개념 색인</h2><span>태그별 관련 문제</span></div><div class="cols" id="index-cols"></div></section>';
  main.innerHTML = html;

  // concept index
  const tagMap = {};
  QS.forEach(q => (q.tags || []).forEach(t => (tagMap[t] = tagMap[t] || []).push(q.no)));
  document.getElementById('index-cols').innerHTML = Object.keys(tagMap).sort((a, b) => a.localeCompare(b, 'ko')).map(t =>
    '<div class="entry"><span>' + esc(t) + '</span><span>' + tagMap[t].map(n => '<a href="#q' + n + '">' + n + '</a>').join('') + '</span></div>').join('');

  // topics rail
  const topicsEl = document.getElementById('topics');
  topicsEl.innerHTML = [{ key: 'all', name: '전체' }].concat(TOPICS).map(t => {
    const n = t.key === 'all' ? QS.length : QS.filter(q => q.topic === t.key).length;
    return n ? '<button type="button" class="topic-btn" data-topic="' + t.key + '" aria-pressed="' + (t.key === 'all') + '"><span>' + esc(t.name) + '</span><span class="n">' + n + '</span></button>' : '';
  }).join('');

  // header copy
  const disputed = QS.filter(q => q.dumpAnswer && q.dumpAnswer !== q.correct).length;
  const supp = QS.filter(q => q.supplement).length;
  document.getElementById('lede').textContent = DATA.lede;
  function renderStats() {
    const res = store.res, done = Object.keys(res).filter(k => byNo[k]);
    const ok = done.filter(k => res[k] === 'ok').length;
    document.getElementById('stats').innerHTML =
      '<span>전체 <b>' + QS.length + '</b>문제' + (supp ? ' (보충 ' + supp + ')' : '') + '</span>' +
      '<span>덤프와 정답이 다른 문제 <b>' + disputed + '</b></span>' +
      '<span>푼 문제 <b>' + done.length + '</b></span>' +
      '<span>정답률 <b>' + (done.length ? Math.round(ok / done.length * 100) + '%' : '–') + '</b></span>' +
      '<span>합격선 65%</span>';
  }
  function renderGrid() {
    document.getElementById('grid').innerHTML = QS.map(q => {
      const r = store.res[q.no], f = store.flag[q.no];
      return '<a href="#q' + q.no + '" class="' + [r || '', f ? 'flag' : '', q.supplement ? 'supp' : ''].join(' ') + '" data-no="' + q.no + '">' + q.no + '</a>';
    }).join('');
  }

  const DAY = 864e5;
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const mmdd = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
  function renderHistory() {
    const el = document.getElementById('hist');
    const log = db.log.filter(e => noById[e.q]);
    document.getElementById('hist-sub').textContent = log.length ? '총 ' + log.length + '회 풀이 · ' + (sync.token ? 'gist에 동기화' : '이 기기에 저장') : '';
    if (!log.length) {
      el.innerHTML = '<p class="hist-empty">아직 푼 문제가 없습니다. 보기를 고르면 채점 결과가 여기에 쌓입니다. 왼쪽의 기기 간 동기화를 설정하면 휴대폰과 PC의 기록이 합쳐집니다.</p>';
      return;
    }
    // per objective: latest result per question
    let rows = '';
    TOPICS.forEach(t => {
      const qs = QS.filter(q => q.topic === t.key); if (!qs.length) return;
      const done = qs.filter(q => store.res[q.no]);
      const ok = done.filter(q => store.res[q.no] === 'ok').length;
      const pct = done.length ? Math.round(ok / done.length * 100) : null;
      rows += '<tr><td>' + esc(t.name) + '</td><td class="num">' + done.length + '/' + qs.length + '</td><td class="num">' + (pct == null ? '–' : pct + '%') +
        '</td><td><span class="bar" style="width:' + (pct || 0) * 0.6 + 'px"></span></td></tr>';
    });
    const table = '<div><h3>범위별 정답률 (최근 결과 기준)</h3><div class="table-wrap"><table class="hist-table"><thead><tr><th>범위</th><th class="num">푼 문제</th><th class="num">정답률</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    // last 7 days
    const today = dayStart(Date.now()), days = [];
    for (let i = 6; i >= 0; i--) { const s = today - i * DAY; days.push({ s, n: log.filter(e => e.t >= s && e.t < s + DAY).length }); }
    const max = Math.max(1, ...days.map(d => d.n));
    const week = '<div><h3>최근 7일 풀이 수</h3><div class="days">' + days.map(d =>
      '<div class="d"><span>' + d.n + '</span><span class="col' + (d.n ? '' : ' zero') + '" style="height:' + Math.max(2, d.n / max * 56) + 'px"></span><span>' + mmdd(d.s) + '</span></div>').join('') + '</div></div>';
    // recent attempts
    const recent = log.slice(-12).reverse().map(e => {
      const no = noById[e.q];
      return '<li><span class="when">' + mmdd(e.t) + ' ' + hhmm(e.t) + '</span><a href="#q' + no + '">Q' + String(no).padStart(3, '0') + '</a><span class="' + (e.ok ? 'ok' : 'bad') + '">' + (e.ok ? '정답' : '오답') + (e.p ? ' (' + e.p.split('').join(',') + ')' : '') + '</span></li>';
    }).join('');
    const wrongNow = Object.keys(store.res).filter(k => store.res[k] === 'bad').length;
    const rec = '<div><h3>최근 풀이</h3><ul class="recent">' + recent + '</ul>' +
      (wrongNow ? '<p style="margin:10px 0 0;font-size:14px">지금 틀린 상태인 문제 <b>' + wrongNow + '</b>개 · <button class="linkish" id="go-wrong" type="button">틀린 문제만 보기</button></p>' : '') + '</div>';
    el.innerHTML = table + week + rec;
  }
  function renderMine() {
    main.querySelectorAll('article.q').forEach(c => {
      const s = store.stat[c.dataset.no];
      c.querySelector('.mine').textContent = s ? ' · 내 기록 ' + s.n + '회 중 ' + s.c + '회 정답, 마지막 ' + mmdd(s.t) : '';
      c.querySelector('.flag-btn').setAttribute('aria-pressed', store.flag[c.dataset.no] ? 'true' : 'false');
      const picking = c.querySelector('.opt.sel') && !c.classList.contains('graded');
      if (s && String(s.t) !== c.dataset.t && !picking) {
        const ok = store.res[c.dataset.no] === 'ok';
        showAttempt(c, s.p, ok, s.t).textContent = '지난 풀이: ' + (ok ? '정답' : '오답 · 정답 ' + byNo[c.dataset.no].correct.split('').join(', ')) + ' (' + mmdd(s.t) + ')';
      } else if (!s && c.classList.contains('graded')) clearCard(c);
    });
  }
  function renderAll() { renderGrid(); renderStats(); renderHistory(); renderMine(); if (state.flag || state.wrong) applyFilter(); }

  // ---- card behaviour ----
  function reveal(card, on) {
    card.classList.toggle('revealed', on);
    card.querySelector('.ex').hidden = !on;
    card.querySelector('.act-show').textContent = on ? '해설 접기' : '해설 보기';
  }
  // a graded card shows the picked options, right/wrong colouring and a verdict; options are locked until "다시 풀기"
  function showAttempt(card, picked, ok, t) {
    const right = byNo[card.dataset.no].correct.split(''), p = (picked || '').split('');
    card.querySelectorAll('.opt').forEach(b => {
      const k = b.dataset.k;
      b.classList.toggle('sel', p.includes(k));
      b.classList.toggle('right', right.includes(k));
      b.classList.toggle('wrong', p.includes(k) && !right.includes(k));
    });
    card.classList.add('graded'); card.dataset.t = String(t);
    card.querySelector('.act-check').hidden = true; card.querySelector('.act-retry').hidden = false;
    const v = card.querySelector('.verdict'); v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    return v;
  }
  function clearCard(card) {
    card.classList.remove('graded');
    card.querySelectorAll('.opt').forEach(b => b.classList.remove('sel', 'right', 'wrong'));
    card.querySelector('.act-check').hidden = false; card.querySelector('.act-retry').hidden = true;
    const v = card.querySelector('.verdict'); v.textContent = ''; v.className = 'verdict';
    reveal(card, false);
  }
  function grade(card) {
    const q = byNo[card.dataset.no];
    const sel = [...card.querySelectorAll('.opt.sel')].map(b => b.dataset.k).sort().join('');
    if (!sel) {
      card.querySelectorAll('.opt').forEach(b => b.classList.toggle('right', q.correct.includes(b.dataset.k)));
      reveal(card, true); return;
    }
    const ok = sel === q.correct, t = Date.now();
    showAttempt(card, sel, ok, t).textContent = ok ? '정답입니다' : '오답입니다 · 정답 ' + q.correct.split('').join(', ');
    reveal(card, true);
    db.log.push({ q: sid(q), p: sel, ok: ok ? 1 : 0, t }); commit();
  }
  main.addEventListener('click', e => {
    const card = e.target.closest('article.q');
    const tag = e.target.closest('.tag');
    if (tag) { const s = document.getElementById('q-search'); s.value = tag.dataset.tag; state.q = tag.dataset.tag.toLowerCase(); applyFilter(); window.scrollTo({ top: 0 }); return; }
    if (!card) return;
    const q = byNo[card.dataset.no];
    const opt = e.target.closest('.opt');
    if (opt && !card.classList.contains('revealed') && !card.classList.contains('graded')) {
      if (q.correct.length === 1) card.querySelectorAll('.opt.sel').forEach(b => b !== opt && b.classList.remove('sel'));
      opt.classList.toggle('sel');
      if (q.correct.length === 1 && opt.classList.contains('sel')) grade(card);
      return;
    }
    if (e.target.closest('.act-check')) { grade(card); return; }
    if (e.target.closest('.act-show')) {
      const on = !card.classList.contains('revealed');
      if (!card.classList.contains('graded')) {
        if (on) card.querySelectorAll('.opt').forEach(b => b.classList.toggle('right', q.correct.includes(b.dataset.k)));
        else card.querySelectorAll('.opt').forEach(b => b.classList.remove('sel', 'right', 'wrong'));
      }
      reveal(card, on); return;
    }
    if (e.target.closest('.act-retry')) { clearCard(card); return; }
    const fb = e.target.closest('.flag-btn');
    if (fb) { db.flag[sid(q)] = { on: store.flag[q.no] ? 0 : 1, t: Date.now() }; commit(); }
  });

  // ---- filtering ----
  const hay = Object.fromEntries(QS.map(q => [q.no, [q.parts.map(p => p.content).join(' '), q.options.map(o => (o.text || '') + ' ' + (o.code || '')).join(' '), (q.tags || []).join(' '), q.summary || '', topicName[q.topic] || ''].join(' ').toLowerCase()]));
  function applyFilter() {
    let shown = 0;
    main.querySelectorAll('article.q').forEach(c => {
      const q = byNo[c.dataset.no];
      const vis = (state.topic === 'all' || q.topic === state.topic) && (!state.q || hay[q.no].includes(state.q)) &&
        (!state.flag || store.flag[q.no]) && (!state.wrong || store.res[q.no] === 'bad') && (!state.disputed || (q.dumpAnswer && q.dumpAnswer !== q.correct));
      c.hidden = !vis; if (vis) shown++;
    });
    main.querySelectorAll('.section-head[data-topic]').forEach(h => {
      let n = h.nextElementSibling, any = false;
      while (n && n.matches('article.q')) { if (!n.hidden) any = true; n = n.nextElementSibling; }
      h.hidden = !any;
    });
    document.getElementById('empty').hidden = shown > 0;
  }
  topicsEl.addEventListener('click', e => {
    const b = e.target.closest('.topic-btn'); if (!b) return;
    state.topic = b.dataset.topic;
    topicsEl.querySelectorAll('.topic-btn').forEach(x => x.setAttribute('aria-pressed', x === b));
    applyFilter();
  });
  document.getElementById('q-search').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); applyFilter(); });
  [['opt-flag', 'flag'], ['opt-wrong', 'wrong'], ['opt-disputed', 'disputed']].forEach(([id, k]) =>
    document.getElementById(id).addEventListener('change', e => { state[k] = e.target.checked; applyFilter(); }));
  document.getElementById('opt-reveal').addEventListener('change', e => {
    main.querySelectorAll('article.q').forEach(c => {
      const q = byNo[c.dataset.no];
      if (!c.classList.contains('graded')) {
        if (e.target.checked) c.querySelectorAll('.opt').forEach(b => b.classList.toggle('right', q.correct.includes(b.dataset.k)));
        else c.querySelectorAll('.opt').forEach(b => b.classList.remove('sel', 'right', 'wrong'));
      }
      reveal(c, e.target.checked);
    });
  });
  document.getElementById('reset').addEventListener('click', e => {
    if (e.target.dataset.armed) {
      db = { log: [], flag: {}, reset: Date.now() }; commit();
      e.target.textContent = sync.token ? '초기화했습니다. 다른 기기에도 반영됩니다' : '초기화했습니다'; delete e.target.dataset.armed;
    } else { e.target.dataset.armed = 1; e.target.textContent = '한 번 더 누르면 모든 기록과 북마크가 지워집니다'; }
  });
  document.getElementById('history').addEventListener('click', e => {
    if (!e.target.closest('#go-wrong')) return;
    const cb = document.getElementById('opt-wrong'); cb.checked = true; state.wrong = true; applyFilter(); window.scrollTo({ top: 0 });
  });

  // sync controls
  const panel = document.getElementById('sync-panel'), tokenIn = document.getElementById('sync-token');
  document.getElementById('sync-toggle').addEventListener('click', () => { panel.hidden = !panel.hidden; if (!panel.hidden && !sync.token) tokenIn.focus(); });
  document.getElementById('sync-connect').addEventListener('click', () => {
    const t = tokenIn.value.trim(); if (!t) { tokenIn.focus(); return; }
    sync = { token: t }; saveSync(); tokenIn.value = ''; syncNow();
  });
  document.getElementById('sync-now').addEventListener('click', () => syncNow());
  document.getElementById('sync-off').addEventListener('click', () => { sync = {}; saveSync(); setStatus('off'); renderHistory(); });
  window.addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncNow();
    else if (pushTimer) syncNow();
  });

  derive(); renderAll(); applyFilter();
  if (sync.token) { tokenIn.placeholder = '연결됨 · 다른 토큰으로 바꾸려면 입력'; syncNow(); } else setStatus('off');
  const h = location.hash.match(/^#q(\d+)$/);
  if (h && document.getElementById('q' + h[1])) document.getElementById('q' + h[1]).scrollIntoView();
})();
</script>

</body>
</html>
