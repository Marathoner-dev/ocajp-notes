객체의 `num`이 70이 됩니다.\n참조 변수는 4개(`obj1`~`obj4`)가 등장하지만 객체는 1개입니다.", "optionNotes": {"A": "정답입니다. `new MarkList()`가 단 한 번 실행되므로 인스턴스는 1개입니다.", "B": "`obj2 = obj1`은 참조 복사이지 객체 복제가 아니므로 2개가 되지 않습니다.", "C": "`obj3 = null`은 객체를 만들지 않으므로 3개라는 계산은 틀렸습니다.", "D": "참조 변수 수(obj1~obj4)와 객체 수를 혼동한 답입니다. 객체는 1개입니다."}, "concepts": [{"title": "참조 변수와 객체의 구분", "body": "객체는 `new`(또는 문자열 리터럴, 오토박싱, 배열 초기화 등 객체를 만드는 표현식)가 실행될 때만 생성됩니다. `a = b` 형태의 대입이나 메서드 인자 전달은 참조값(주소)을 복사할 뿐입니다. 시험에서 '객체가 몇 개 만들어졌는가', 'GC 대상이 몇 개인가'를 물을 때는 `new`가 실행된 횟수와 각 객체를 가리키는 참조가 남아 있는지를 따로 세어야 합니다."}, {"title": "pass-by-value와 객체 수정", "body": "자바는 항상 값에 의한 전달입니다. 참조형 인자의 경우 참조값이 복사되므로, 메서드 안에서 `obj.num += 10`처럼 객체 내부를 바꾸면 호출한 쪽에서도 변경이 보입니다. 하지만 메서드 안에서 매개변수에 `obj = new MarkList()`처럼 새 객체를 대입하면 호출한 쪽 변수에는 영향이 없습니다."}], "trap": "참조 변수가 4개 등장하므로 4개나 3개를 고르게 유도합니다. 객체 수는 `new`의 실행 횟수로 셉니다.", "tags": ["객체 생성", "참조 복사", "null 참조"], "occurrences": ["surepassexam Q97 p68"], "verified": "reasoned", "fixes": [], "no": 20}, {"id": 103, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Vowel {\n    private char var;\n    public static void main(String[] args) {\n        char var1 = 'a';\n        char var2 = var1;\n        var2 = 'e';\n\n        Vowel obj1 = new Vowel ();\n        Vowel obj2 = obj1;\n        obj1.var = 'i';\n        obj2.var = 'o';\n\n        System.out.println(var1 + \", \" +var2);\n        System.out.print(obj1.var + \", \" +obj2.var);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "a, e\ni, o"}, {"key": "B", "text": "", "code": "a, e\no, o"}, {"key": "C", "text": "", "code": "e, e\ni, o"}, {"key": "D", "text": "", "code": "e, e\no, o"}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "char는 값이 복사되므로 var1은 'a'로 남고, obj1과 obj2는 같은 객체를 가리키므로 마지막에 대입한 'o'가 둘 다에서 보입니다.", "walkthrough": "1. `char var1 = 'a'; char var2 = var1;` 에서 `var2`에는 값 `'a'`가 복사됩니다.\n2. `var2 = 'e';`는 `var2`만 바꾸므로 `var1`은 여전히 `'a'`입니다.\n3. `Vowel obj2 = obj1;`은 참조를 복사하므로 두 변수는 같은 객체를 가리킵니다.\n4. `obj1.var = 'i';` 다음 `obj2.var = 'o';`로 같은 객체의 필드가 최종적으로 `'o'`가 됩니다.\n5. 첫 `println`이 `a, e`를 출력하고 줄을 바꿉니다.\n6. `print`가 `o, o`를 출력합니다.\n`main`은 같은 클래스 안이므로 private 필드 `var`에 접근할 수 있습니다. 또한 `var1 + \", \"`는 앞이 char여도 뒤가 String이므로 문자열 연결이 됩니다.", "optionNotes": {"A": "둘째 줄을 `i, o`로 본 답입니다. `obj1`과 `obj2`는 같은 객체이므로 마지막 대입 `'o'`가 양쪽 모두에서 보여 `o, o`가 됩니다.", "B": "정답입니다. 실제 출력은 `a, e` 다음 줄에 `o, o`입니다.", "C": "첫 줄을 `e, e`로 본 답입니다. `var1`은 기본형이라 `var2`의 변경에 영향받지 않고 `'a'`로 남습니다. 둘째 줄도 같은 객체이므로 `o, o`여야 합니다.", "D": "둘째 줄 `o, o`는 맞지만 첫 줄이 `e, e`라서 틀렸습니다. 기본형 변수끼리는 값만 복사되므로 `var1`은 `'a'`로 남습니다."}, "concepts": [{"title": "기본형 대입과 참조형 대입", "body": "기본형 변수끼리 대입하면 값 자체가 복사되므로 이후 한쪽을 바꿔도 다른 쪽은 그대로입니다. 참조형 변수끼리 대입하면 같은 객체를 가리키게 되므로, 어느 참조로 필드를 바꾸든 같은 객체가 바뀝니다. 래퍼 객체나 String은 불변이라 '바꾸는' 것처럼 보이는 연산이 실제로는 새 객체를 만든다는 점도 함께 알아 두십시오."}, {"title": "char와 + 연산", "body": "`+`는 피연산자 중 하나라도 String이면 문자열 연결이고, 둘 다 숫자형(char 포함)이면 산술 덧셈입니다. 왼쪽부터 계산하므로 `'a' + 'b' + \"\"`는 `\"195\"`, `\"\" + 'a' + 'b'`는 `\"ab\"`입니다. 이 문제의 `var1 + \", \"`는 String이 끼어 있으므로 `a, `가 됩니다."}], "trap": "참조형 두 변수에 서로 다른 값을 대입하면 각자 다른 값을 가질 것처럼 보이게 합니다. 같은 객체를 가리키면 마지막 대입만 남습니다.", "tags": ["기본형 값 복사", "참조 복사", "char"], "occurrences": ["surepassexam Q123 p74"], "verified": "compiled", "fixes": ["두 출력 줄이 합쳐지고 `e`가 `o`로 잘못 인쇄된 보기(`a, oi, o` 등)를 A `a, e`/`i, o`, B `a, e`/`o, o`, C `e, e`/`i, o`, D `e, e`/`o, o`로 복원하고 줄바꿈을 살려 코드 블록으로 표시"], "no": 21}, {"id": 116, "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "24. float var1 = (12_345.01 >= 123_45.00) ? 12_456 : 124_56.02f;\n25. float var2 = var1 + 1024;\n26. System.out.print(var2);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "An exception is thrown at runtime.", "code": null}, {"key": "B", "text": "Compilation fails.", "code": null}, {"key": "C", "text": "13480.0", "code": null}, {"key": "D", "text": "13480.02", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "조건 연산자의 두 피연산자가 int와 float이면 결과 타입은 float이 되어 12456.0f + 1024 = 13480.0이 출력됩니다.", "walkthrough": "1. `12_345.01`과 `123_45.00`은 언더스코어가 숫자 사이에만 있으므로 합법적인 double 리터럴이며 각각 12345.01, 12345.0입니다.\n2. `12345.01 >= 12345.0`은 `true`이므로 조건 연산자는 두 번째 피연산자 `12_456`을 선택합니다.\n3. 두 번째 피연산자는 `int`, 세 번째는 `float`(`124_56.02f`)이므로 이항 숫자 승격에 의해 조건식 전체의 타입은 `float`입니다. 따라서 결과값은 `12456.0f`이고 `float var1`에 그대로 대입됩니다.\n4. 25행 `var1 + 1024`는 float + int → float이므로 `var2 = 13480.0f`입니다.\n5. `System.out.print(float)`는 소수점 이하가 0이어도 `13480.0`처럼 `.0`을 붙여 출력합니다.\n실제로 컴파일·실행하면 `13480.0`이 출력됩니다.", "optionNotes": {"A": "예외를 던질 연산이 전혀 없습니다. 실수 비교와 덧셈만 있으므로 런타임 예외는 발생하지 않습니다.", "B": "`12_345.01`, `123_45.00`, `124_56.02f` 모두 언더스코어가 숫자와 숫자 사이에 있어 합법입니다. 조건식 타입도 float이라 `float var1`에 대입 가능하므로 컴파일됩니다.", "C": "정답입니다. 조건이 true라 12456이 선택되고 float으로 승격되어 12456.0, 여기에 1024를 더해 `13480.0`이 출력됩니다.", "D": "`13480.02`가 되려면 세 번째 피연산자 `12456.02f`가 선택되어야 하는데, 조건이 true라 두 번째 피연산자 12456이 선택됩니다."}, "concepts": [{"title": "숫자 리터럴의 언더스코어 규칙", "body": "Java 7부터 숫자 리터럴에 `_`를 넣어 가독성을 높일 수 있습니다. 위치는 반드시 숫자와 숫자 사이여야 하며, 맨 앞/맨 뒤, 소수점 바로 앞뒤, 접미사(`L`, `f`, `d`) 바로 앞, `0x` 접두사 바로 뒤에는 올 수 없습니다. 자릿수를 어떻게 묶든(`123_45`) 값에는 영향이 없습니다.\n```java\nint a = 1_000_000;   // OK\ndouble b = 12_345.01; // OK\n// double c = 12_.5;  // 에러: 소수점 앞\n// long d = 10_L;     // 에러: 접미사 앞\n// int e = _10;       // 식별자로 해석됨\n```"}, {"title": "조건 연산자(?:)의 결과 타입", "body": "두 번째와 세 번째 피연산자가 모두 숫자 타입이면, 어느 쪽이 선택되든 결과 타입은 이항 숫자 승격 규칙으로 정해집니다. int와 float이면 float, int와 double이면 double, int와 long이면 long입니다. 그래서 `true ? 1 : 2.0`의 값은 `1.0`입니다. 예외적으로 한쪽이 int 상수이고 다른 쪽이 byte/short/char이며 상수가 그 범위에 들어가면 좁은 타입이 결과가 됩니다.\n```java\nSystem.out.println(true ? 1 : 2.0);   // 1.0\nSystem.out.println(true ? 'a' : 0);   // a (char)\nSystem.out.println(true ? 'a' : 70000); // 97 (int)\n```"}], "trap": "조건이 true라서 int 12456이 그대로 출력된다고 생각하기 쉽지만, 조건식의 타입이 float으로 승격되므로 `.0`이 붙습니다. 또 이상하게 묶인 언더스코어를 보고 컴파일 에러를 고르게 만드는 함정입니다.", "tags": ["숫자 리터럴 언더스코어", "조건 연산자 타입 승격", "float 출력 형식"], "occurrences": ["surepassexam Q162 p85"], "verified": "compiled", "fixes": ["보기 B `Compilation fail`을 `Compilation fails.`로 수정"], "no": 22}, {"id": 120, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        boolean a = new Boolean(Boolean.valueOf (args[0]));\n        boolean b = new Boolean(args[1]);\n        System.out.println(a + \" \" + b);\n    }\n}"}, {"type": "text", "content": "And given the commands:"}, {"type": "code", "content": "javac Test.java\njava Test TRUE null"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "TRUE null", "code": null}, {"key": "B", "text": "true false", "code": null}, {"key": "C", "text": "false false", "code": null}, {"key": "D", "text": "true true", "code": null}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "D", "answerNote": "덤프 정답 D(true true)는 틀렸습니다. `new Boolean(\"null\")`은 문자열이 \"true\"(대소문자 무시)가 아니면 false를 만들므로 b는 false입니다. 실제 실행 결과는 `true false`(B)입니다.", "summary": "Boolean의 String 변환은 대소문자 무시하고 \"true\"일 때만 true이고, 그 외 문자열(\"null\" 포함)은 모두 false입니다.", "walkthrough": "1. `java Test TRUE null`이므로 `args[0] = \"TRUE\"`, `args[1] = \"null\"`(null 참조가 아니라 네 글자 문자열)입니다.\n2. `Boolean.valueOf(\"TRUE\")`는 대소문자를 무시하고 \"true\"와 비교하므로 `Boolean.TRUE`를 반환합니다.\n3. `new Boolean(Boolean)` 생성자는 없지만, 인자가 `boolean`으로 언박싱되어 `Boolean(boolean)` 생성자가 선택됩니다. 결과 Boolean 객체는 다시 `boolean a`로 언박싱되어 `a = true`입니다.\n4. `new Boolean(\"null\")`은 `Boolean(String)` 생성자로, \"true\"가 아니므로 false 객체를 만들고 `b = false`가 됩니다.\n5. `a + \" \" + b`는 문자열 연결이므로 `true false`가 출력됩니다.\n실제 실행 결과도 `true false`입니다.", "optionNotes": {"A": "a와 b는 boolean 기본형이므로 출력은 항상 소문자 `true`/`false`입니다. 입력 문자열이 그대로 찍히지 않습니다.", "B": "정답입니다. \"TRUE\"는 대소문자 무시로 true, \"null\"은 \"true\"가 아니므로 false입니다.", "C": "`Boolean.valueOf(\"TRUE\")`는 대소문자를 구분하지 않으므로 a는 true입니다.", "D": "\"null\"은 \"true\"와 같지 않으므로 b는 false입니다. 덤프 정답이지만 실행 결과와 다릅니다.", "E": "형변환(cast)이 전혀 없고 박싱/언박싱만 일어나므로 ClassCastException은 발생하지 않습니다. Boolean의 String 변환은 어떤 문자열이든(null 포함) 예외를 던지지 않습니다."}, "concepts": [{"title": "문자열을 boolean으로 바꾸는 규칙", "body": "`Boolean.parseBoolean(s)`, `Boolean.valueOf(s)`, `new Boolean(s)`는 모두 같은 규칙을 따릅니다. `s`가 null이 아니고 대소문자 무시로 \"true\"와 같으면 true, 그 외에는 전부 false입니다. 숫자 래퍼(`Integer.parseInt(\"abc\")`)처럼 NumberFormatException을 던지는 일이 없다는 점이 다릅니다.\n```java\nBoolean.parseBoolean(\"TrUe\"); // true\nBoolean.parseBoolean(\"yes\");  // false\nBoolean.parseBoolean(null);   // false (예외 없음)\n```"}, {"title": "래퍼 생성자와 오토언박싱", "body": "Boolean은 `Boolean(boolean)`과 `Boolean(String)` 두 생성자만 있습니다. `new Boolean(Boolean객체)`는 Boolean→boolean 언박싱 후 `Boolean(boolean)`이 호출되어 컴파일됩니다. 래퍼 객체를 기본형 변수에 대입하면 자동으로 언박싱되며, 래퍼가 null이면 그때 NullPointerException이 납니다. 래퍼 생성자는 Java 9부터 deprecated지만 Java 8 시험 범위에서는 정상 코드입니다."}], "trap": "명령행의 `null`은 null 참조가 아니라 문자열 \"null\"입니다. 또 \"TRUE\" 대문자를 보고 false라고 착각하게 만듭니다.", "tags": ["Boolean 래퍼", "Boolean.valueOf/parseBoolean", "오토언박싱"], "occurrences": ["surepassexam Q175 p88"], "verified": "compiled", "fixes": ["보기 E의 띄어쓰기가 빠진 `AClassCastExceptionis`를 `A ClassCastException is`로 수정"], "no": 23}, {"id": 157, "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragments:"}, {"type": "code", "content": "class Student {\n    String name;\n    int age;\n}"}, {"type": "text", "content": "And:"}, {"type": "code", "content": "4. public class Test {\n5.     public static void main(String[] args) {\n6.         Student s1 = new Student();\n7.         Student s2 = new Student();\n8.         Student s3 = new Student();\n9.         s1 = s3;\n10.        s3 = s2;\n11.        s2 = null;\n12.    }\n13. }"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "After line 11, three objects are eligible for garbage collection.", "code": null}, {"key": "B", "text": "After line 11, two objects are eligible for garbage collection.", "code": null}, {"key": "C", "text": "After line 11, one object is eligible for garbage collection.", "code": null}, {"key": "D", "text": "After line 11, none of the objects are eligible for garbage collection.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "line 11 이후 아무도 참조하지 않는 객체는 처음 `s1`이 가리키던 객체 하나뿐이므로, GC 대상은 1개입니다.", "walkthrough": "생성된 객체를 순서대로 O1, O2, O3라고 하고 참조를 추적합니다.\n1. line 6~8: `s1→O1`, `s2→O2`, `s3→O3`.\n2. line 9 `s1 = s3;` → `s1→O3`. 이제 O1을 가리키는 변수가 없으므로 **O1은 GC 대상**입니다.\n3. line 10 `s3 = s2;` → `s3→O2`. 현재 `s1→O3`, `s2→O2`, `s3→O2`.\n4. line 11 `s2 = null;` → `s2`는 아무것도 가리키지 않지만 O2는 여전히 `s3`가 참조합니다. O3는 `s1`이 참조합니다.\n결과적으로 line 11 이후 도달할 수 없는 객체는 O1 하나입니다. 실제로 실행해 보면 `s1`, `s3` 모두 null이 아니라는 것도 확인됩니다.", "optionNotes": {"A": "O2는 `s3`, O3는 `s1`이 여전히 참조하므로 세 객체 모두 GC 대상일 수 없습니다.", "B": "`s2 = null`로 O2가 버려진 것처럼 보이지만, line 10에서 `s3`가 이미 O2를 가리키게 되었으므로 O2는 대상이 아닙니다.", "C": "정답입니다. line 9에서 `s1`이 O3로 옮겨 가면서 O1만 참조를 잃습니다.", "D": "O1은 line 9 이후 어떤 변수도 참조하지 않으므로 GC 대상이 하나 있습니다."}, "concepts": [{"title": "GC 대상(eligible) 판단법", "body": "객체는 살아 있는 스레드에서 어떤 참조 경로로도 도달할 수 없을 때 GC 대상이 됩니다. 시험에서는 표를 그려 각 줄마다 \"변수→객체\" 화살표를 갱신하고, 화살표가 하나도 없는 객체를 세면 됩니다. `null` 대입은 변수의 화살표를 지울 뿐이고, 다른 변수가 같은 객체를 가리키면 그 객체는 살아 있습니다. 객체끼리 서로만 참조하는 고립된 섬(island of isolation)도 외부에서 도달할 수 없으면 GC 대상입니다."}, {"title": "GC에 관한 시험 포인트", "body": "\"eligible\"은 수거될 자격이 있다는 뜻일 뿐 언제 수거되는지는 보장되지 않습니다. `System.gc()`는 요청일 뿐 실행을 보장하지 않습니다. 메서드가 끝나면 그 지역 변수가 사라지므로, 지역 변수만 참조하던 객체도 대상이 됩니다. String 리터럴은 상수 풀에 있어 GC 문제에서 보통 제외합니다."}], "trap": "`s2 = null`이 보이면 O2가 버려졌다고 반사적으로 세게 만들지만, 그 전에 `s3 = s2`로 참조가 복사되었다는 점을 놓치게 합니다.", "tags": ["가비지 컬렉션 대상", "참조 변수 재할당"], "occurrences": ["certleader-C Q4 p141"], "verified": "compiled", "fixes": [], "no": 24}, {"id": 161, "topic": "datatypes", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    Short s1 = 200;\n    Integer s2 = 400;\n    Long s3 = (long) s1 + s2;           //line n1\n    String s4 = (String) (s3 * s2);     //line n2\n    System.out.println(\"Sum is \" + s4);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Sum is 600", "code": null}, {"key": "B", "text": "Compilation fails at line n1.", "code": null}, {"key": "C", "text": "Compilation fails at line n2.", "code": null}, {"key": "D", "text": "A ClassCastException is thrown at line n1.", "code": null}, {"key": "E", "text": "A ClassCastException is thrown at line n2.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "숫자 연산 결과인 `long`은 `(String)`으로 캐스팅할 수 없으므로 line n2에서 컴파일 에러가 납니다. line n1은 문제없습니다.", "walkthrough": "1. `Short s1 = 200;`은 상수 200이 short 범위 안이므로 박싱 대입이 허용됩니다. `Integer s2 = 400;`도 정상입니다.\n2. line n1 `(long) s1 + s2`: 캐스트가 덧셈보다 우선순위가 높아 `((long) s1) + s2`입니다. 캐스트 문맥에서는 언박싱 후 확장 변환(Short → short → long)이 허용됩니다. `long + Integer`는 `s2`가 언박싱되어 `long` 600이 되고, `Long`으로 박싱되어 `s3`에 대입됩니다. 따라서 컴파일 에러도, `ClassCastException`도 없습니다. line n1만 남겨 실행하면 `s3 = 600`으로 확인됩니다.\n3. line n2 `(s3 * s2)`는 두 값이 언박싱되어 `long` 240000이 됩니다. 기본형 `long`을 참조형 `String`으로 바꾸는 캐스트 변환은 존재하지 않으므로 `incompatible types: long cannot be converted to String` 컴파일 에러가 납니다.\n4. 문자열로 바꾸려면 `String.valueOf(s3 * s2)`, `\"\" + (s3 * s2)`, `Long.toString(...)`을 써야 합니다.", "optionNotes": {"A": "line n2가 컴파일되지 않아 실행되지 않습니다. 실행된다 해도 `s4`는 곱셈 결과(240000)라 600이 출력되지 않습니다.", "B": "`(long) s1`은 Short를 언박싱한 뒤 long으로 확장하는 합법적인 캐스트이고, `long + Integer`의 결과 long은 `Long`으로 박싱됩니다. line n1은 컴파일됩니다.", "C": "정답입니다. 기본형 `long`을 `String`으로 캐스팅할 수 없으므로 line n2에서 컴파일 에러가 납니다.", "D": "line n1은 기본형 변환과 박싱만 일어나므로 `ClassCastException`이 날 여지가 없습니다. `ClassCastException`은 참조형 다운캐스트가 실패할 때 나는 예외입니다.", "E": "기본형을 String으로 캐스팅하는 것은 런타임 문제가 아니라 컴파일 단계에서 거부됩니다. 실행까지 가지 않습니다."}, "concepts": [{"title": "캐스트로 할 수 있는 것과 없는 것", "body": "기본형끼리는 `boolean`을 제외하면 서로 캐스팅할 수 있고, 참조형끼리는 상속 관계가 있을 때만 캐스팅할 수 있습니다. 기본형과 참조형 사이에서는 박싱/언박싱으로 연결되는 경우만 가능합니다. 예를 들어 `(long) shortWrapper`(언박싱 후 확장)나 `(Object) 5`(박싱 후 업캐스트)는 됩니다. 반면 `(String) 5`, `(String) longValue`, `(Integer) \"1\"`은 모두 컴파일 에러입니다. 숫자를 문자열로, 문자열을 숫자로 바꿀 때는 `String.valueOf`, `Integer.parseInt`, `Integer.valueOf` 같은 메서드를 씁니다."}, {"title": "래퍼 대입과 숫자 승격", "body": "`Short s = 200;`처럼 int 상수를 `Short`/`Byte`/`Character`에 대입하는 것은 상수가 범위 안일 때만 허용됩니다. `Long l = 5;`는 int → Long 변환이 없어 컴파일 에러이고 `Long l = 5L;`이어야 합니다. 이항 산술 연산에서는 래퍼가 먼저 언박싱되고, 두 피연산자 중 넓은 타입(최소 int)으로 승격됩니다. 그래서 `long * Integer`는 `long`입니다.\n```java\nLong a = 1L; Integer b = 2;\nlong r = a * b;   // OK\nLong x = b;       // 에러: Integer는 Long이 아님\n```"}], "trap": "line n1의 `(long) s1 + s2`처럼 래퍼에 기본형 캐스트를 섞어 n1이 문제처럼 보이게 하고, line n2의 캐스트 오류는 런타임 `ClassCastException`이라고 착각하게 만듭니다.", "tags": ["오토박싱/언박싱", "캐스팅", "숫자 승격"], "occurrences": ["certleader-C Q9 p143", "certleader-D Q3 p171"], "verified": "compiled", "fixes": [], "no": 25}, {"id": "X4", "topic": "datatypes", "tags": ["float 리터럴", "축소 변환", "오토박싱", "숫자 밑줄"], "parts": [{"type": "text", "content": "Which two code fragments cause a compilation error? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "float flt = 100.00F;"}, {"key": "B", "text": "", "code": "float flt = (float) 1_11.00;"}, {"key": "C", "text": "", "code": "Float flt = 100.00;"}, {"key": "D", "text": "", "code": "double y1 = 203.22;\nfloat flt = y1;"}, {"key": "E", "text": "", "code": "int y2 = 100;\nfloat flt = (float) y2 ;"}], "choose": 2, "correct": "CD", "dumpAnswersAll": ["AD"], "answerNote": "정답은 C, D입니다. 모든 덤프가 AD로 표기했지만 A의 `100.00F`는 접미사 F가 붙은 정상적인 float 리터럴이라 문제없이 컴파일됩니다. 실제로 컴파일하면 C(`double cannot be converted to Float`)와 D(`possible lossy conversion from double to float`)만 오류가 납니다.", "verified": "compiled", "summary": "double 값은 캐스트 없이 float 변수에 넣을 수 없고(D), double 리터럴을 `Float`로 오토박싱할 수도 없습니다(C).", "walkthrough": "1. A: `100.00F`는 접미사 F가 붙은 float 리터럴이므로 float 변수에 그대로 대입됩니다.\n2. B: `1_11.00`은 숫자 사이에 밑줄을 넣은 double 리터럴(111.0)이고, `(float)`로 명시적 캐스트를 했으므로 컴파일됩니다.\n3. C: `100.00`은 double 리터럴입니다. 오토박싱은 double을 `Double`로만 감쌀 수 있고 `Float`로는 감쌀 수 없으므로 컴파일 오류입니다.\n4. D: `y1`은 double 변수입니다. double → float는 축소 변환이라 캐스트 없이 대입하면 컴파일 오류입니다.\n5. E: int → float는 확대 변환이라 캐스트가 없어도 되고, 있어도 문제없습니다.\n6. 따라서 컴파일 오류가 나는 두 개는 C와 D입니다.", "optionNotes": {"A": "`100.00F`는 float 리터럴이므로 정상입니다. 덤프가 고른 보기지만 실제로는 컴파일됩니다.", "B": "`1_11.00`은 숫자 사이에 밑줄을 둔 올바른 double 리터럴이고 `(float)` 캐스트가 있어 컴파일됩니다.", "C": "오류입니다. double 리터럴은 `Double`로만 박싱되므로 `Float` 참조에 대입할 수 없습니다.", "D": "오류입니다. 변수 `y1`이 double이라 float로 넣으려면 `(float)` 캐스트가 필요합니다.", "E": "int → float는 자동 확대 변환이므로 캐스트가 있든 없든 컴파일됩니다."}, "concepts": [{"title": "부동소수점 리터럴과 float 대입", "body": "소수점이 있는 리터럴은 기본이 **double**입니다. float로 쓰려면 `F`/`f` 접미사를 붙이거나 `(float)`로 캐스트해야 합니다.\n\n- `float f = 1.5;` → 오류, `float f = 1.5F;` → 정상\n- `float f = 10;` → 정상 (int → float 확대 변환)\n- `long`, `int` 등 정수형은 모두 float/double로 자동 확대 변환됩니다.\n- double 변수를 float에 넣을 때는 상수든 아니든 항상 캐스트가 필요합니다. (int 상수를 byte에 넣는 암묵적 축소 규칙은 정수형에만 적용됩니다.)"}, {"title": "오토박싱은 정확한 타입끼리만", "body": "오토박싱은 기본형을 **자기 자신의 래퍼 클래스**로만 감쌉니다. 확대 변환 후 박싱(widening + boxing)은 대입에서 일어나지 않습니다.\n\n- `Double d = 100.0;` 정상, `Float f = 100.0;` 오류, `Float f = 100.0F;` 정상\n- `Long l = 10;` 오류(int → Long 불가), `Long l = 10L;` 정상\n- 예외적으로 `Byte b = 10;`, `Short s = 10;`, `Character c = 65;`처럼 범위 안의 int 상수는 해당 래퍼로 대입할 수 있습니다."}, {"title": "숫자 리터럴의 밑줄(_)", "body": "Java 7부터 숫자 리터럴의 **숫자와 숫자 사이**에 밑줄을 넣을 수 있습니다(`1_000_000`, `1_11.00`). 리터럴의 처음이나 끝, 소수점 바로 앞뒤, `F`/`L` 같은 접미사 바로 앞, `0x` 바로 뒤에는 넣을 수 없습니다. 예: `1_.0`, `_1`, `1_F`는 모두 컴파일 오류입니다."}], "trap": "`100.00F`처럼 소수점 아래 0이 여러 개 붙은 리터럴을 보고 double이라 착각하게 만들고, `Float flt = 100.00;`처럼 래퍼 타입으로 바꾸면 괜찮을 것 같다는 생각을 노립니다.", "fixes": ["D, E는 한 줄에 붙어 인쇄된 사본이 있어 두 문장을 줄을 나눠 정리했습니다."], "occurrences": ["2passeasy (f27) Q55", "2passeasy (f29) Q38", "2passeasy (f30) Q47", "gratisexam-VCE (f14) Q52", "passleader-300q (f2) Q38", "passleader-300q (f2) Q44", "surepassexam (f28) Q53"], "added": true, "dumpAnswer": "AD", "no": 26}, {"id": 3, "topic": "operators", "parts": [{"type": "text", "content": "Which statement is true about the switch statement?"}], "options": [{"key": "A", "text": "It must contain the default section.", "code": null}, {"key": "B", "text": "The break statement, at the end of each case block, is mandatory.", "code": null}, {"key": "C", "text": "Its case label literals can be changed at runtime.", "code": null}, {"key": "D", "text": "Its expression must evaluate to a single value.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "switch의 식은 하나의 값으로 평가되어 그 값과 일치하는 case로 분기합니다.", "walkthrough": "switch 문의 규칙을 보기마다 대조해 보겠습니다.\n- `default`는 선택 사항입니다. 없으면 일치하는 case가 없을 때 아무것도 실행하지 않습니다.\n- `break`도 선택 사항입니다. 없으면 다음 case로 이어서 실행되는데, 이를 fall-through라고 합니다.\n- case 라벨은 컴파일 타임 상수(리터럴, `final` 상수, enum 상수)여야 하므로 런타임에 바뀔 수 없습니다.\n- switch의 괄호 안 식은 `int` 이하 정수형(`byte`, `short`, `char`, `int`), 그 래퍼 타입, `String`, enum 중 하나의 단일 값으로 평가됩니다. 배열이나 컬렉션 같은 여러 값의 묶음은 쓸 수 없습니다.\n따라서 맞는 설명은 D입니다.", "optionNotes": {"A": "`default`는 선택 사항이라 생략해도 컴파일됩니다.", "B": "`break`는 필수가 아닙니다. 생략하면 다음 case로 fall-through될 뿐이고, 의도적으로 생략하는 경우도 많습니다.", "C": "case 라벨은 컴파일 타임 상수여야 합니다. 일반 변수를 쓰면 \"constant expression required\" 컴파일 에러가 납니다.", "D": "정답입니다. switch 식은 하나의 값으로 평가되고, 그 값과 같은 case 라벨로 분기합니다."}, "concepts": [{"title": "switch 문에 쓸 수 있는 타입과 case 라벨 조건 (Java 8)", "body": "switch 식에 쓸 수 있는 타입은 `byte`, `short`, `char`, `int`와 그 래퍼(`Byte`, `Short`, `Character`, `Integer`), `String`, enum입니다. `long`, `float`, `double`, `boolean`은 쓸 수 없습니다. case 라벨은 컴파일 타임 상수여야 하고, 같은 값이 두 번 나오면 컴파일 에러입니다. `final int K = 3;`처럼 선언과 동시에 상수로 초기화한 지역 변수는 case에 쓸 수 있지만, `final int K; K = 3;`처럼 나중에 대입하면 상수가 아니므로 쓸 수 없습니다. 라벨 값은 switch 식의 타입에 대입할 수 있어야 합니다. 예를 들어 `byte` 식에 `case 200:`을 쓰면 에러입니다."}, {"title": "fall-through와 default 위치", "body": "일치하는 case를 찾으면 그 지점부터 `break`나 switch 끝을 만날 때까지 아래 문장을 모두 실행합니다. `default`는 맨 아래가 아니어도 되고, 일치하는 case가 없을 때 실행이 시작되는 지점입니다. default가 중간에 있고 break가 없으면 그 아래 case까지 이어서 실행됩니다.\n```java\nint x = 5;\nswitch (x) {\n    default: System.out.print(\"D\");\n    case 1: System.out.print(\"1\");\n}\n// 출력: D1\n```"}], "trap": "\"default 필수\", \"break 필수\"처럼 관례를 규칙인 것처럼 적은 보기가 오답입니다. 문법상 필수인 것만 정답으로 고르면 됩니다.", "tags": ["switch 문 규칙", "case 상수", "break와 fall-through"], "occurrences": ["certleader-A Q3 p2", "exambible Q38 p34", "surepassexam Q187 p89", "certleader-B Q10 p103", "certleader-B Q76 p113"], "verified": "reasoned", "fixes": [], "no": 27}, {"id": 11, "topic": "operators", "parts": [{"type": "text", "content": "Which is true about the switch statement?"}], "options": [{"key": "A", "text": "Its expression can evaluate to a collection of values.", "code": null}, {"key": "B", "text": "The break statement, at the end of each case block, is optional.", "code": null}, {"key": "C", "text": "Its case label literals can be changed at runtime.", "code": null}, {"key": "D", "text": "It must contain the default section.", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "각 case 끝의 `break`는 선택 사항이고, 생략하면 다음 case로 fall-through됩니다.", "walkthrough": "보기를 switch 규칙과 대조해 보겠습니다.\n- switch 식은 정수형/래퍼/String/enum 중 하나의 단일 값으로 평가됩니다. 컬렉션이나 배열은 쓸 수 없습니다.\n- `break`는 필수가 아닙니다. 생략하면 이어지는 case의 문장까지 계속 실행되고(fall-through), 컴파일 에러는 아닙니다.\n- case 라벨은 컴파일 타임 상수여야 하므로 실행 중에 바뀔 수 없습니다.\n- `default`는 생략할 수 있습니다.\n따라서 맞는 설명은 B입니다. 3번 문항과 같은 개념을 반대 방향에서 묻는 문제입니다.", "optionNotes": {"A": "switch 식은 하나의 값이어야 합니다. `List`나 배열 같은 값의 묶음은 허용 타입이 아니므로 컴파일 에러입니다.", "B": "정답입니다. break를 생략하면 fall-through가 일어날 뿐 문법상 문제는 없습니다.", "C": "case 라벨은 리터럴, 선언 시 초기화된 final 상수, enum 상수 같은 컴파일 타임 상수여야 하므로 런타임에 바뀔 수 없습니다.", "D": "`default`는 선택 사항입니다."}, "concepts": [{"title": "fall-through 추적법", "body": "switch는 일치하는 case 라벨로 점프한 뒤 `break`, `return`, `throw` 또는 switch 블록 끝을 만날 때까지 아래 문장을 순서대로 실행합니다. 라벨은 진입 지점일 뿐 경계가 아닙니다. 출력 추적 문제에서는 1) 진입 라벨을 찾고 2) 그 아래로 내려가며 break가 있는지 확인하세요.\n```java\nint n = 2;\nswitch (n) {\n    case 1: System.out.print(\"a\");\n    case 2: System.out.print(\"b\");\n    case 3: System.out.print(\"c\"); break;\n    case 4: System.out.print(\"d\");\n}\n// 출력: bc\n```"}, {"title": "switch 식에 쓸 수 있는 타입과 case 라벨 조건 (Java 8)", "body": "switch 식에 쓸 수 있는 타입은 `byte`, `short`, `char`, `int`, 그 래퍼, `String`, enum뿐입니다. `long`, `boolean`, `float`, `double`은 컴파일 에러입니다. case 라벨은 컴파일 타임 상수여야 하고, 중복되면 안 되며, switch 식 타입에 대입할 수 있어야 합니다. String switch는 `equals`로 비교하므로 대소문자를 구분합니다. switch 식이 null인 래퍼나 String이면 NullPointerException이 납니다."}], "trap": "\"break가 없으면 컴파일 에러\"라는 오해를 노립니다. break는 흐름 제어용일 뿐 필수 문법이 아닙니다.", "tags": ["switch 문 규칙", "break와 fall-through", "case 상수"], "occurrences": ["certleader-A Q10 p6", "2passeasy Q9 p20", "certleader-B Q32 p107", "certleader-D Q9 p173"], "verified": "reasoned", "fixes": [], "no": 28}, {"id": 25, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class App {\n    public static void main(String[] args) {\n        int i = 10;\n        int j = 20;\n        int k =(j += i)/ 5;\n        System.out.print(i + \" : \" + j + \" : \" + k);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 : 30 : 6", "code": null}, {"key": "B", "text": "10 : 22 : 22", "code": null}, {"key": "C", "text": "10 : 22 : 20", "code": null}, {"key": "D", "text": "10 : 22 : 6", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "`(j += i)`는 j를 30으로 바꾸고 그 값 30을 결과로 돌려주므로 k = 30 / 5 = 6입니다.", "walkthrough": "1. `i = 10`, `j = 20`으로 시작합니다.\n2. `int k = (j += i) / 5;`에서 괄호 안부터 계산합니다. `j += i`는 `j = j + i`와 같아서 j는 30이 됩니다.\n3. 대입 연산식 자체의 값은 대입된 값이므로 `(j += i)`는 30입니다.\n4. `30 / 5 = 6`이므로 k는 6입니다.\n5. i는 바뀌지 않아서 10입니다.\n6. 출력은 `10 : 30 : 6`입니다.", "optionNotes": {"A": "정답입니다. i=10은 그대로이고, j는 `+=`로 30이 되며, k는 30/5 = 6입니다.", "B": "j=22는 `j += i`를 `j += 2` 같은 다른 계산으로 잘못 본 값입니다. 실제 j는 30이고 k도 22가 아닙니다.", "C": "j와 k 모두 틀렸습니다. `(j += i)`의 값은 30이고 k는 그 값을 5로 나눈 6입니다.", "D": "k=6은 맞지만 j가 22가 될 근거가 없습니다. j는 20 + 10 = 30입니다."}, "concepts": [{"title": "대입 연산식의 값", "body": "Java에서 `=`, `+=`, `-=` 같은 대입은 문장이 아니라 **식**이고, 식의 값은 대입이 끝난 뒤 왼쪽 변수의 값입니다. 그래서 `a = b = 5;`처럼 연쇄 대입을 할 수 있고, `(j += i) / 5`처럼 대입 결과를 바로 다른 계산에 쓸 수 있습니다. `if (x = 5)`는 결과가 int라서 컴파일 에러지만, boolean 변수라면 `if (flag = true)`가 컴파일되는 함정도 있습니다."}, {"title": "복합 대입 연산자의 암시적 형변환", "body": "`a += b`는 `a = (a의 타입)(a + b)`와 같습니다. 그래서 `short s = 1; s += 1;`은 컴파일되지만 `s = s + 1;`은 int를 short에 대입하는 것이라서 컴파일 에러입니다. 복합 대입은 왼쪽 피연산자를 한 번만 계산한다는 점도 기억하세요."}], "trap": "괄호 안의 `j += i`가 실제로 j를 바꾼다는 점을 놓치면 출력에서 j를 20으로 적기 쉽습니다.", "tags": ["복합 대입 연산자", "연산자 우선순위"], "occurrences": ["certleader-A Q46 p13", "certleader-B Q101 p117"], "verified": "compiled", "fixes": [], "no": 29}, {"id": 29, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "String stuff = \"TV\";\nString res = null;\n\nif (stuff.equals(\"TV\")) {\n    res = \"Walter\";\n} else if (stuff.equals(\"Movie\")) {\n    res = \"White\";\n} else {\n    res = \"No Result\";\n}"}, {"type": "text", "content": "Which code fragment can replace the if block?"}], "options": [{"key": "A", "text": "", "code": "stuff.equals (\"TV\") ? res= \"Walter\" : stuff.equals (\"Movie\") ?\nres = \"White\" : res = \"No Result\";"}, {"key": "B", "text": "", "code": "res = stuff.equals (\"TV\") ? \"Walter\" else stuff.equals\n(\"Movie\")? \"White\" : \"No Result\";"}, {"key": "C", "text": "", "code": "res = stuff.equals (\"TV\") ? stuff.equals (\"Movie\")? \"Walter\" :\n\"White\" : \"No Result\";"}, {"key": "D", "text": "", "code": "res = stuff.equals (\"TV\")? \"Walter\" : stuff.equals (\"Movie\")?\n\"White\" : \"No Result\";"}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "삼항 연산자를 중첩한 `res = cond1 ? \"Walter\" : cond2 ? \"White\" : \"No Result\";`가 if-else if-else와 같은 의미입니다.", "walkthrough": "1. 원래 if 블록은 \"TV\"이면 Walter, \"Movie\"이면 White, 그 밖에는 No Result를 res에 대입합니다.\n2. 삼항 연산자는 오른쪽 결합이므로 D의 `a ? x : b ? y : z`는 `a ? x : (b ? y : z)`로 묶입니다. if / else if / else와 정확히 같은 구조입니다.\n3. stuff가 \"TV\"이므로 D를 실행하면 res는 \"Walter\"입니다(실행 결과 확인).\n4. C는 컴파일되지만 \"TV\"일 때 안쪽 조건 `stuff.equals(\"Movie\")`가 false라서 \"White\"가 나와 의미가 다릅니다.\n5. A와 B는 컴파일 에러입니다.", "optionNotes": {"A": "조건 연산식만으로는 문장이 될 수 없어 단독으로 쓸 수 없습니다. 게다가 마지막 피연산자 자리에 대입식 `res = \"No Result\"`를 괄호 없이 넣으면 `(… ? … : res) = \"No Result\"`로 해석되어 `unexpected type` 컴파일 에러가 납니다.", "B": "삼항 연산자에는 `else`가 없고 `:`를 써야 합니다. `else`가 들어가서 컴파일 에러입니다.", "C": "컴파일은 되지만 논리가 다릅니다. \"TV\"일 때 안쪽 `stuff.equals(\"Movie\") ? \"Walter\" : \"White\"`가 실행되어 \"White\"가 대입됩니다.", "D": "정답입니다. 첫 조건이 참이면 \"Walter\", 아니면 두 번째 조건으로 \"White\" 또는 \"No Result\"를 고르는 구조로, 원래 if 블록과 같습니다."}, "concepts": [{"title": "조건(삼항) 연산자", "body": "`조건 ? 값1 : 값2`는 값을 만드는 **식**이므로 보통 대입이나 반환, 메서드 인자에 씁니다. `x > 0 ? a() : b();`처럼 단독 문장으로 쓰면 `not a statement` 컴파일 에러가 납니다. 오른쪽 결합이라 `a ? b : c ? d : e`는 `a ? b : (c ? d : e)`입니다. 두 번째와 세 번째 피연산자의 타입은 호환되어야 하며, 숫자형이면 더 넓은 타입으로 승격됩니다(예: `true ? 1 : 2.0`은 1.0)."}, {"title": "삼항 연산자와 대입의 우선순위", "body": "대입 연산자는 조건 연산자보다 우선순위가 낮습니다. 그래서 `c ? x = 1 : y = 2`의 마지막 부분은 `(c ? x = 1 : y) = 2`로 해석되고, 조건식의 결과는 변수가 아니므로 대입할 수 없어 에러가 납니다. 가운데 피연산자 자리(`?`와 `:` 사이)에는 대입식을 넣을 수 있지만, 마지막 피연산자에는 괄호로 감싸야 합니다."}], "trap": "C는 컴파일되기 때문에 정답처럼 보이지만 조건의 중첩 위치가 달라 결과가 다릅니다. A는 if 문을 그대로 옮긴 것처럼 보이지만 삼항 식을 문장으로 쓸 수 없다는 규칙에 걸립니다.", "tags": ["삼항 연산자", "if-else 대체"], "occurrences": ["2passeasy Q3 p17", "certleader-C Q6 p142"], "verified": "compiled", "fixes": [], "no": 30}, {"id": 69, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [] args) {\n    System.out.println (\"Result A \" + 0 + 1);\n    System.out.println (\"Result B \" + (1) + (2) );\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Result A 1\nResult B 3"}, {"key": "B", "text": "", "code": "Result A 01\nResult B 3"}, {"key": "C", "text": "", "code": "Result A 01\nResult B 12"}, {"key": "D", "text": "", "code": "Result A 1\nResult B 12"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "문자열 뒤의 `+`는 모두 문자열 연결이며, 값 하나만 감싼 괄호 `(1)`은 덧셈을 먼저 하게 만들지 않습니다.", "walkthrough": "1. `\"Result A \" + 0 + 1`은 왼쪽부터 평가합니다. `\"Result A \" + 0` → `\"Result A 0\"`(String), 이어서 `+ 1` → `\"Result A 01\"`입니다.\n2. `\"Result B \" + (1) + (2)`에서 괄호는 각각 리터럴 하나만 감싸므로 `1`, `2` 그 자체입니다. 덧셈 `1 + 2`를 묶는 괄호가 아닙니다.\n3. 따라서 `\"Result B \" + 1` → `\"Result B 1\"`, 다시 `+ 2` → `\"Result B 12\"`입니다.\n4. 출력은 `Result A 01` / `Result B 12`이며 실제로 컴파일·실행해서 확인했습니다.\n\n참고로 `\"Result B \" + (1 + 2)`였다면 `Result B 3`이 됩니다.", "optionNotes": {"A": "`Result A 1`은 `0 + 1`이 먼저 정수 덧셈된다고 착각한 결과입니다. 문자열 뒤에서는 연결이 일어나므로 `01`이 됩니다.", "B": "첫 줄은 맞지만, `(1) + (2)`는 덧셈을 묶은 괄호가 아니므로 `3`이 아니라 `12`가 출력됩니다.", "C": "정답입니다. 두 줄 모두 왼쪽부터 문자열 연결이 일어나 `Result A 01`, `Result B 12`가 출력됩니다.", "D": "두 줄 모두 반대로 계산했습니다. 첫 줄은 `01`, 둘째 줄은 `12`입니다."}, "concepts": [{"title": "문자열 연결(+)의 평가 순서", "body": "`+` 연산자는 왼쪽에서 오른쪽으로 결합합니다. 피연산자 중 하나라도 `String`이면 그 `+`는 문자열 연결이 되고, 그 결과(String)가 다음 `+`의 왼쪽 피연산자가 됩니다. 따라서 `\"A\" + 1 + 2`는 `(\"A\" + 1) + 2` → `\"A1\" + 2` → `\"A12\"`입니다. 반대로 `1 + 2 + \"A\"`는 앞의 `1 + 2`가 먼저 정수 덧셈이 되어 `\"3A\"`입니다. 괄호는 평가 순서를 바꾸므로 `\"A\" + (1 + 2)`는 `\"A3\"`입니다. 단, `(1)`처럼 값 하나만 감싼 괄호는 아무것도 바꾸지 않습니다.\n```java\nSystem.out.println(1 + 2 + \"A\" + 1 + 2); // 3A12\nSystem.out.println('a' + 1 + \"B\");     // 98B (char + int = int)\n```"}, {"title": "main 메서드 선언 규칙", "body": "JVM이 실행 시작점으로 인식하는 메서드는 `public static void main(String[] args)`입니다. Java 키워드는 모두 소문자이므로 `Public`은 키워드가 아니라 식별자로 해석되어 컴파일 에러가 납니다. 매개변수는 `String[] args`, `String args[]`, `String... args` 모두 가능하고 이름 `args`는 바꿔도 됩니다. `public`과 `static`의 순서는 바꿀 수 있지만(`static public void main`), 반환형 `void`는 메서드 이름 바로 앞에 와야 합니다. `final`을 붙여도 유효한 main입니다."}], "trap": "`(1) + (2)`처럼 괄호가 있으면 덧셈이 먼저 된다고 착각하게 만드는 문제입니다. 괄호가 무엇을 묶는지 확인하세요.", "tags": ["문자열 연결 순서", "괄호와 연산 우선순위"], "occurrences": ["surepassexam Q11 p53"], "verified": "compiled", "fixes": ["`Public static void main`의 대문자 `P`를 `public`으로 수정"], "no": 31}, {"id": 71, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "System.out.println(\"5 + 2 = \" + 3 + 4);\nSystem.out.println(\"5 + 2 = \" + (3 + 4));"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "5 + 2 = 34\n5 + 2 = 34"}, {"key": "B", "text": "", "code": "5 + 2 + 3 + 4\n5 + 2 = 7"}, {"key": "C", "text": "", "code": "7 = 7\n7 + 7"}, {"key": "D", "text": "", "code": "5 + 2 = 34\n5 + 2 = 7"}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "문자열 뒤의 `3 + 4`는 연결되어 `34`, 괄호로 묶은 `(3 + 4)`는 먼저 더해져 `7`이 됩니다.", "walkthrough": "1. 첫 줄 `\"5 + 2 = \" + 3 + 4`: 왼쪽부터 평가하여 `\"5 + 2 = \" + 3` → `\"5 + 2 = 3\"`, 다시 `+ 4` → `\"5 + 2 = 34\"`입니다.\n2. 문자열 리터럴 안의 `5 + 2`는 그저 글자일 뿐 계산되지 않습니다.\n3. 둘째 줄 `\"5 + 2 = \" + (3 + 4)`: 괄호 안의 `3 + 4`가 먼저 정수 덧셈되어 `7`, 그 다음 연결되어 `\"5 + 2 = 7\"`입니다.\n4. 실행 결과는 `5 + 2 = 34` / `5 + 2 = 7`입니다.", "optionNotes": {"A": "둘째 줄은 괄호 덕분에 `3 + 4`가 먼저 계산되어 `7`이 되므로 `34`가 아닙니다.", "B": "첫 줄에서 `=` 문자가 사라질 이유가 없습니다. 문자열 리터럴은 그대로 출력되고 뒤에 `34`가 붙습니다.", "C": "문자열 리터럴 `\"5 + 2 = \"` 안의 내용은 계산되지 않으므로 `7 = 7` 같은 출력은 나올 수 없습니다.", "D": "정답입니다. 첫 줄은 문자열 연결로 `34`, 둘째 줄은 괄호 안 덧셈이 먼저 되어 `7`입니다."}, "concepts": [{"title": "문자열 연결(+)의 평가 순서", "body": "`+` 연산자는 왼쪽에서 오른쪽으로 결합합니다. 피연산자 중 하나라도 `String`이면 그 `+`는 문자열 연결이 되고, 그 결과(String)가 다음 `+`의 왼쪽 피연산자가 됩니다. 따라서 `\"A\" + 1 + 2`는 `(\"A\" + 1) + 2` → `\"A1\" + 2` → `\"A12\"`입니다. 반대로 `1 + 2 + \"A\"`는 앞의 `1 + 2`가 먼저 정수 덧셈이 되어 `\"3A\"`입니다. 괄호는 평가 순서를 바꾸므로 `\"A\" + (1 + 2)`는 `\"A3\"`입니다. 단, `(1)`처럼 값 하나만 감싼 괄호는 아무것도 바꾸지 않습니다.\n```java\nSystem.out.println(1 + 2 + \"A\" + 1 + 2); // 3A12\nSystem.out.println('a' + 1 + \"B\");     // 98B (char + int = int)\n```"}], "trap": "문자열 리터럴 안의 수식이 계산된다고 생각하거나, 괄호 유무 차이를 놓치게 만드는 문제입니다.", "tags": ["문자열 연결 순서", "괄호와 연산 우선순위"], "occurrences": ["surepassexam Q15 p55"], "verified": "compiled", "fixes": [], "no": 32}, {"id": 84, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n\n    public static void main(String[] args) {\n        if (args[0].equals(\"Hello\") ? false : true) {\n            System.out.println(\"Success\");\n        } else {\n            System.out.println(\"Failure\");\n        }\n    }\n}"}, {"type": "text", "content": "And given the commands:"}, {"type": "code", "content": "javac Test.java\njava Test Hello"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Success", "code": null}, {"key": "B", "text": "Failure", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An exception is thrown at runtime", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "`args[0]`이 `\"Hello\"`이면 `equals`가 `true`이고 삼항 연산자가 `false`를 반환하므로 else 분기의 `Failure`가 출력됩니다.", "walkthrough": "1. `java Test Hello`로 실행하면 `args`는 `{\"Hello\"}`이므로 `args[0]`은 `\"Hello\"`입니다. 클래스 이름 `Test`는 인수에 포함되지 않습니다.\n2. `args[0].equals(\"Hello\")`는 `true`입니다.\n3. 삼항 연산자 `조건 ? false : true`는 조건이 `true`이므로 `false`를 반환합니다.\n4. `if (false)`이므로 else 블록이 실행되어 `Failure`가 출력됩니다.\n5. 삼항 연산자의 결과는 `boolean`이므로 if 조건으로 쓰는 데 문제가 없고 컴파일도 정상입니다. 실제로 `java Test Hello`로 실행해 `Failure`를 확인했습니다.", "optionNotes": {"A": "조건이 `true`일 때 삼항 연산자는 두 번째 피연산자인 `false`를 반환하므로 `Success`가 아닙니다.", "B": "정답입니다. `equals`가 `true` → 삼항 결과 `false` → else 분기 실행으로 `Failure`가 출력됩니다.", "C": "삼항 연산자는 `boolean` 값을 만들어 내므로 if 조건으로 사용해도 컴파일됩니다.", "D": "인수 `Hello`가 전달되므로 `args[0]` 접근에서 `ArrayIndexOutOfBoundsException`이 발생하지 않습니다. 인수 없이 실행했다면 예외가 납니다."}, "concepts": [{"title": "삼항 연산자 `? :`", "body": "`조건 ? 값1 : 값2`는 조건이 `true`이면 값1, `false`이면 값2를 반환하는 식(expression)입니다. 조건은 반드시 `boolean`이어야 합니다. 결과가 값이므로 대입문, 인수, if 조건 등 식이 올 수 있는 곳 어디에나 쓸 수 있습니다. 선택되지 않은 쪽 피연산자는 평가되지 않습니다. 두 값의 타입이 다르면 숫자 승격 규칙 등이 적용됩니다(예: `true ? 1 : 2.0`의 결과는 `1.0`)."}, {"title": "명령줄 인수와 javac/java", "body": "`javac Test.java`는 소스 파일을 컴파일하므로 `.java` 확장자를 포함한 파일 이름을 씁니다. `java Test arg1 arg2`는 클래스 이름(확장자 없음)으로 실행하며, 그 뒤의 문자열들이 `args` 배열에 들어갑니다. `args[0]`은 클래스 이름이 아닌 첫 번째 인수입니다. 공백이 포함된 인수는 따옴표로 묶으면 하나로 전달됩니다. 인수를 주지 않으면 `args`는 길이 0인 배열(`null` 아님)이므로 `args[0]` 접근 시 `ArrayIndexOutOfBoundsException`이 발생합니다."}], "trap": "`equals`가 `true`이니 `Success`라고 서두르기 쉽습니다. 삼항 연산자가 결과를 뒤집는다는 점을 확인하세요.", "tags": ["삼항 연산자", "명령줄 인수", "javac/java 명령"], "occurrences": ["surepassexam Q61 p63"], "verified": "compiled", "fixes": ["명령어 `javac Test.Java` / `Java Test Hello`를 `javac Test.java` / `java Test Hello`로 소문자 수정"], "no": 33}, {"id": 90, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "if (aVar++ < 10) {\n    System.out.println(aVar + \" Hello World!\");\n} else {\n    System.out.println(aVar + \" Hello Universe!\");\n}"}, {"type": "text", "content": "What is the result if the integer aVar is 9?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "10 Hello Universe!", "code": null}, {"key": "C", "text": "10 Hello World!", "code": null}, {"key": "D", "text": "9 Hello World!", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`aVar++ < 10`은 증가 전 값 9로 비교해 참이 되고, 비교 직후 `aVar`는 10이 되므로 `10 Hello World!`가 출력됩니다.", "walkthrough": "코드 조각이라 `int aVar = 9;`를 앞에 두고 main 안에서 실행했습니다.\n1. `aVar++`는 후위 증가이므로 식의 값은 증가 **전** 값 `9`입니다.\n2. 비교 `9 < 10`은 `true`입니다. 동시에 `aVar`는 부수 효과로 10이 됩니다.\n3. if 블록이 실행되며, 이 시점의 `aVar`는 10이므로 `10 Hello World!`가 출력됩니다.\n4. else 블록은 실행되지 않습니다.", "optionNotes": {"A": "`aVar`가 `int`로 선언되어 있다는 전제이므로 후위 증가와 비교는 모두 합법이며 컴파일됩니다.", "B": "비교는 증가 전 값 9로 하므로 `9 < 10`이 참입니다. 증가 후 값 10으로 비교했다고 착각하면 else라고 생각하게 됩니다.", "C": "정답입니다. 조건은 9로 비교해 참이고, 출력 시점의 `aVar`는 이미 10입니다.", "D": "증가는 조건 평가 중에 이미 일어났으므로 블록 안에서 `aVar`는 10입니다. 9가 출력되지 않습니다."}, "concepts": [{"title": "전위/후위 증감 연산자", "body": "`x++`(후위)는 현재 값을 식의 결과로 쓰고 나서 `x`를 1 증가시키며, `++x`(전위)는 먼저 증가시킨 뒤 그 값을 결과로 씁니다. 어느 쪽이든 식이 평가된 직후 변수 자체는 이미 바뀌어 있습니다. 조건식, 배열 인덱스, 메서드 인수 안에서 사용될 때 특히 주의해야 합니다.\n```java\nint a = 9;\nboolean b = a++ < 10;  // b = true, a = 10\nint c = 9;\nboolean d = ++c < 10;  // d = false, c = 10\nint x = 5;\nx = x++;               // x는 5 그대로\n```"}], "trap": "조건을 증가 후 값으로 비교한다고 착각(B)하거나, 출력 시점에 증가가 아직 안 됐다고 착각(D)하게 만드는 문제입니다.", "tags": ["후위 증가 연산자", "if/else"], "occurrences": ["surepassexam Q81 p66"], "verified": "compiled", "fixes": [], "no": 34}, {"id": 98, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        //line n1\n        switch (x) {\n            case 1:\n                System.out.println(\"One\");\n                break;\n            case 2:\n                System.out.println(\"Two\");\n                break;\n        }\n    }\n}"}, {"type": "text", "content": "Which three code fragments can be independently inserted at line n1 to enable the code to print One?"}], "options": [{"key": "A", "text": "", "code": "Byte x = 1;"}, {"key": "B", "text": "", "code": "short x = 1;"}, {"key": "C", "text": "", "code": "String x = \"1\";"}, {"key": "D", "text": "", "code": "Long x = 1;"}, {"key": "E", "text": "", "code": "Double x = 1;"}, {"key": "F", "text": "", "code": "Integer x = new Integer (\"1\");"}], "correct": "ABF", "dumpAnswer": "ABF", "answerNote": "", "summary": "switch는 byte/short/char/int와 그 래퍼, String, enum만 허용하므로 Byte, short, Integer는 되고 Long, Double은 안 되며, String은 case 1과 타입이 맞지 않습니다.", "walkthrough": "각 선언을 line n1에 넣고 컴파일·실행해 보았습니다.\n- A `Byte x = 1;`: int 상수 1이 byte 범위 안이므로 축소 변환 후 박싱되어 `Byte`에 대입됩니다. switch는 `Byte`를 언박싱해 처리하고 `One`을 출력합니다.\n- B `short x = 1;`: 상수 대입이므로 합법이고, `short`는 switch 허용 타입입니다. `One` 출력.\n- C `String x = \"1\";`: switch 자체는 String을 허용하지만 `case 1`이 int 상수라 `incompatible types: int cannot be converted to String` 컴파일 에러입니다.\n- D `Long x = 1;`: int 리터럴은 `Long`으로 박싱되지 않아 대입부터 컴파일 에러이며, `Long`은 switch 타입으로도 허용되지 않습니다.\n- E `Double x = 1;`: 마찬가지로 `int cannot be converted to Double` 컴파일 에러입니다.\n- F `Integer x = new Integer(\"1\");`: 값 1인 `Integer`가 만들어지고 언박싱되어 `One`을 출력합니다.", "optionNotes": {"A": "정답입니다. `Byte x = 1;`은 상수 축소 변환+박싱으로 합법이고, `Byte`는 switch 허용 타입입니다.", "B": "정답입니다. `short`는 switch에 쓸 수 있고 case 상수 1, 2가 short 범위에 들어갑니다.", "C": "switch 표현식이 String이면 case 라벨도 String 상수여야 합니다. `case 1`은 int라 컴파일 에러입니다.", "D": "int 리터럴 1은 `Long`으로 박싱될 수 없어 선언에서 컴파일 에러이고, `long`/`Long`은 switch 타입으로도 금지입니다.", "E": "int 리터럴을 `Double`에 대입할 수 없어 컴파일 에러이며, 실수형도 switch에 쓸 수 없습니다.", "F": "정답입니다. `new Integer(\"1\")`은 값 1을 가진 `Integer`이고, switch에서 언박싱됩니다."}, "concepts": [{"title": "switch 표현식에 허용되는 타입 (Java 8)", "body": "`char`, `byte`, `short`, `int`, 그 래퍼 클래스 `Character`, `Byte`, `Short`, `Integer`, 그리고 `String`, `enum`만 허용됩니다. `long`, `float`, `double`, `boolean`과 그 래퍼는 사용할 수 없습니다. case 라벨은 컴파일 타임 상수여야 하고, switch 타입에 대입 가능한 값이어야 합니다(예: `byte` switch에 `case 200:`은 에러). 래퍼 타입 switch에서 값이 `null`이면 실행 중 NullPointerException이 발생합니다."}, {"title": "상수 대입 시 축소 변환과 박싱", "body": "int 컴파일 타임 상수는 범위 안이면 `byte`, `short`, `char`에 캐스트 없이 대입할 수 있고, 이어서 `Byte`, `Short`, `Character`로 박싱하는 것까지 허용됩니다. 그러나 확대 후 박싱(int -> long -> Long)은 허용되지 않습니다.\n```java\nByte b = 1;     // OK\nShort s = 1;    // OK\nLong l = 1;     // 에러\nLong l2 = 1L;   // OK\nDouble d = 1;   // 에러\nDouble d2 = 1.0;// OK\n```"}], "trap": "`Long x = 1;`이나 `Double x = 1;`이 기본형처럼 자동으로 넓혀질 것이라 생각하게 만들고, String switch를 허용된다는 사실만으로 C를 고르게 유도합니다.", "tags": ["switch 허용 타입", "오토박싱", "상수 대입 변환"], "occurrences": ["surepassexam Q111 p71"], "verified": "compiled", "fixes": ["문제의 `print one`을 실제 출력 문자열에 맞춰 `print One`으로 수정"], "no": 35}, {"id": 108, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class App {\n    public static void main(String[] args) {\n        int i = 10;\n        int j = 20;\n        int k = j += i / 5;\n        System.out.print(i + \" : \" + j + \" : \" + k);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 : 30 : 6", "code": null}, {"key": "B", "text": "10 : 22 : 22", "code": null}, {"key": "C", "text": "10 : 22 : 20", "code": null}, {"key": "D", "text": "10 : 22 : 6", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "j += i / 5는 j = 20 + 2 = 22이고, 대입식 자체의 값 22가 k에 들어가므로 10 : 22 : 22입니다.", "walkthrough": "1. `i = 10`, `j = 20`입니다.\n2. `int k = j += i / 5;`에서 대입 연산자는 오른쪽부터 결합하므로 `k = (j += (i / 5))`로 해석됩니다.\n3. `i / 5`는 정수 나눗셈으로 2입니다.\n4. `j += 2`로 `j`는 22가 되고, 이 대입식의 값도 22입니다.\n5. `k`에 22가 대입됩니다. `i`는 바뀌지 않습니다.\n6. 출력은 `10 : 22 : 22`입니다.", "optionNotes": {"A": "`j += i / 5`를 `(j + i) / 5`처럼 계산한 결과(30, 6)입니다. 나눗셈이 먼저 계산되므로 `j`는 22입니다.", "B": "정답입니다. `j`는 22가 되고, 대입식의 값 22가 `k`에 저장됩니다.", "C": "`k`에 대입 전 `j`의 값 20이 들어간다고 본 답입니다. 대입식의 값은 대입 **후** 값입니다.", "D": "`k`에 `i / 5`의 결과만 들어간다고 본 답입니다. `k`에는 `j += 2` 전체의 결과 22가 들어갑니다."}, "concepts": [{"title": "대입식은 값을 가진다", "body": "자바에서 `=`, `+=` 같은 대입은 식(expression)이며 그 값은 대입된 후 왼쪽 변수의 값입니다. 대입 연산자는 오른쪽 결합이라 `a = b = c = 5;`는 `a = (b = (c = 5))`입니다. `if (flag = true)`처럼 boolean 대입이 조건식에 쓰이면 컴파일되고 항상 true라는 함정도 자주 출제됩니다."}, {"title": "복합 대입 연산자의 동작", "body": "`x op= y`는 `x = (x의 타입)(x op (y))`와 같습니다. 오른쪽 전체가 먼저 계산되고, 결과가 왼쪽 타입으로 자동 캐스트됩니다.\n```java\nint j = 20;\nj *= 2 + 3;     // j = 20 * (2 + 3) = 100\nshort s = 1;\ns += 100000;    // 자동 캐스트로 컴파일 OK\n// s = s + 1;   // 에러: int를 short에 대입\n```"}], "trap": "`j += i / 5`에서 `j + i`를 먼저 계산하거나, `k`에 대입 전의 `j`가 들어간다고 착각하게 만듭니다.", "tags": ["복합 대입 연산자", "연산자 우선순위", "대입식의 값"], "occurrences": ["surepassexam Q135 p78"], "verified": "compiled", "fixes": [], "no": 36}, {"id": 126, "topic": "operators", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        int x = 1;\n        int y = 0;\n        if(x++ > ++y) {\n            System.out.print(\"Hello \");\n        } else {\n            System.out.print(\"Welcome \");\n        }\n        System.out.print(\"Log \" + x + \":\" + y);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Hello Log 1:0", "code": null}, {"key": "B", "text": "Hello Log 2:1", "code": null}, {"key": "C", "text": "Welcome Log 2:1", "code": null}, {"key": "D", "text": "Welcome Log 1:0", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`x++ > ++y`는 1 > 1로 false이고, 비교 후 x=2, y=1이 되어 `Welcome Log 2:1`이 출력됩니다.", "walkthrough": "1. 초기값 x=1, y=0.\n2. `x++`는 현재 값 1을 비교에 쓰고 x를 2로 만듭니다.\n3. `++y`는 y를 먼저 1로 증가시키고 1을 비교에 씁니다.\n4. `1 > 1`은 false이므로 else 블록이 실행되어 `Welcome `이 출력됩니다.\n5. 증감은 조건 결과와 관계없이 이미 일어났으므로 x=2, y=1이고 `Log 2:1`이 이어서 출력됩니다.\n최종 출력은 `Welcome Log 2:1`입니다.", "optionNotes": {"A": "비교값이 1 > 1로 false이므로 Hello가 출력되지 않고, 증감도 반영되어 1:0이 아닙니다.", "B": "변수 값 2:1은 맞지만, 후위 증가 `x++`는 증가 전 값 1로 비교하므로 조건이 false라 Hello가 아닙니다.", "C": "정답입니다. 1 > 1은 false라 Welcome이 출력되고, 비교 과정의 증감으로 x=2, y=1입니다.", "D": "Welcome은 맞지만 조건식 안의 `x++`, `++y`가 실제로 변수를 바꾸므로 1:0이 아니라 2:1입니다."}, "concepts": [{"title": "식 안에서의 증감 연산 평가", "body": "피연산자는 왼쪽에서 오른쪽으로 평가되며, 증감의 부수 효과는 해당 피연산자를 평가하는 즉시 반영됩니다. 후위형은 '이전 값'을, 전위형은 '새 값'을 식에 제공합니다. 조건이 false여도 이미 평가된 증감은 되돌아가지 않습니다.\n```java\nint i = 1;\nint r = i++ + ++i; // 1 + 3 = 4, i = 3\n```"}, {"title": "단락 평가와의 차이", "body": "`&&`, `||`는 왼쪽만으로 결과가 정해지면 오른쪽을 평가하지 않으므로 오른쪽의 증감도 일어나지 않습니다. 이 문제처럼 `>` 하나만 있는 경우에는 양쪽이 모두 평가됩니다. `&`, `|`는 boolean에서도 양쪽을 모두 평가합니다."}], "trap": "결과가 Welcome이면 증감도 안 된 것처럼 보이게 만든 함정으로, 조건 평가 중 일어난 증감은 분기와 무관하게 남습니다.", "tags": ["후위/전위 증감", "관계 연산자", "if/else"], "occurrences": ["surepassexam Q206 p92", "certleader-B Q4 p100", "certleader-C Q7 p142"], "verified": "compiled", "fixes": [], "no": 37}, {"id": 132, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int wd = 0;\nString days[] = {\"sun\", \"mon\", \"wed\", \"sat\"};\nfor (String s:days) {\n    switch (s) {\n        case \"sat\":\n        case \"sun\":\n            wd -= 1;\n            break;\n        case \"mon\":\n            wd++;\n        case \"wed\":\n            wd += 2;\n    }\n}\nSystem.out.println(wd);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "3", "code": null}, {"key": "B", "text": "4", "code": null}, {"key": "C", "text": "-1", "code": null}, {"key": "D", "text": "Compilation fails.", "code": null}], "correct": "A", "dumpAnswer": "B", "answerNote": "이 덤프(surepassexam)의 정답 B(4)는 틀렸습니다. 다른 출처(certleader-C)에는 A로 표기되어 있으며 A가 맞습니다. 코드를 실제 실행해 3을 확인했습니다.", "summary": "sun(-1), mon(+1 후 fall-through로 +2), wed(+2), sat(-1)을 합하면 wd = 3입니다.", "walkthrough": "시작값 wd = 0에서 배열 순서대로 추적합니다.\n1. \"sun\": `case \"sat\":`(빈 case)와 `case \"sun\":`이 같은 블록을 공유합니다. `wd -= 1` → -1, `break`로 switch 탈출.\n2. \"mon\": `wd++` → 0. break가 없으므로 `case \"wed\":`로 fall-through되어 `wd += 2` → 2.\n3. \"wed\": `wd += 2` → 4. 마지막 case라 switch 종료.\n4. \"sat\": \"sun\"과 같은 블록으로 들어가 `wd -= 1` → 3, break.\n5. `System.out.println(wd)`는 `3`을 출력합니다.", "optionNotes": {"A": "정답입니다. -1 → 2 → 4 → 3 순으로 바뀌어 최종 3이 출력됩니다.", "B": "4는 \"wed\"까지 처리했을 때의 값입니다. 마지막 \"sat\"이 sun과 같은 블록에서 1을 빼므로 3이 됩니다.", "C": "-1은 첫 원소 \"sun\"만 처리한 직후의 값입니다. 이후 mon(+1, fall-through로 +2), wed(+2), sat(-1)이 더 처리되므로 최종값은 3입니다.", "D": "String switch, 빈 case 공유(`case \"sat\":` 바로 다음 `case \"sun\":`), break 없는 fall-through는 모두 합법이므로 컴파일됩니다."}, "concepts": [{"title": "switch의 fall-through", "body": "case 라벨은 진입 지점일 뿐이므로 break가 없으면 다음 case의 문장까지 계속 실행됩니다. 여러 case를 연달아 쓰면(`case \"sat\": case \"sun\":`) 같은 코드를 공유합니다. default도 위치와 관계없이 일치하는 case가 없을 때 진입하며, 그 뒤에 break가 없으면 아래 case로 이어집니다.\n```java\nswitch (n) {\n    case 1: System.out.print(\"1\");\n    case 2: System.out.print(\"2\"); break;\n    default: System.out.print(\"D\");\n}\n// n=1 -> 12, n=2 -> 2, n=3 -> D\n```"}, {"title": "switch에 쓸 수 있는 타입", "body": "Java 8의 switch 식에는 char, byte, short, int와 그 래퍼, enum, String을 쓸 수 있습니다. long, float, double, boolean은 불가합니다. case 값은 컴파일 타임 상수여야 하고 중복되면 안 됩니다. String switch는 `equals()`로 비교하므로 대소문자를 구분하며, switch 식이 null이면 NullPointerException이 납니다."}], "trap": "mon 다음 break가 없어 wed의 +2가 함께 실행되는 fall-through와, sat이 sun 블록을 공유한다는 점을 동시에 추적해야 합니다.", "tags": ["switch fall-through", "String switch", "복합 대입 연산자"], "occurrences": ["surepassexam Q231 p95", "certleader-C Q54 p151"], "verified": "compiled", "fixes": ["배열 초기화의 소괄호 `(\"sun\", ... \"sat\")`를 중괄호 `{ }`로 수정", "`wd -= 1:`의 콜론을 세미콜론으로 수정"], "no": 38}, {"id": 137, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int x = 100;\nint a = x++;\nint b = ++x;\nint c = x++;\nint d = (a < b) ? (a < c) ? a: (b <c )? b: c: x;\nSystem.out.println(d);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "100", "code": null}, {"key": "B", "text": "101", "code": null}, {"key": "C", "text": "102", "code": null}, {"key": "D", "text": "103", "code": null}, {"key": "E", "text": "Compilation fails", "code": null}], "correct": "A", "dumpAnswer": "E", "answerNote": "덤프 정답 E(컴파일 실패)는 틀렸습니다. 조건 연산자는 오른쪽 결합이며 두 번째 피연산자 자리에 또 다른 조건식이 올 수 있으므로 `(a < b) ? (a < c) ? a : (b < c) ? b : c : x`는 합법입니다. 실제로 컴파일·실행하면 100이 출력됩니다.", "summary": "a=100, b=102, c=102이고 중첩 조건식은 `a<b ? (a<c ? a : (b<c ? b : c)) : x`로 해석되어 a인 100이 선택됩니다.", "walkthrough": "1. x = 100.\n2. `a = x++` → a = 100, x = 101.\n3. `b = ++x` → x = 102, b = 102.\n4. `c = x++` → c = 102, x = 103.\n5. 조건식은 오른쪽 결합이므로 다음과 같이 묶입니다.\n```java\nd = (a < b) ? ((a < c) ? a : ((b < c) ? b : c)) : x;\n```\n6. `a < b`(100 < 102) true → 안쪽 식 평가. `a < c`(100 < 102) true → `a` 선택.\n7. d = 100이 출력됩니다.", "optionNotes": {"A": "정답입니다. a<b, a<c가 모두 참이라 a(100)가 선택됩니다.", "B": "101은 어떤 변수에도 저장되지 않는 중간값(첫 증가 후 x)입니다. a는 후위 증가라 100입니다.", "C": "102는 b와 c의 값입니다. `a < c`가 true이므로 b나 c까지 가지 않습니다.", "D": "103은 최종 x 값으로, `a < b`가 false일 때만 선택됩니다.", "E": "중첩 조건 연산자는 괄호 없이도 오른쪽 결합으로 해석되어 합법입니다. 각 피연산자가 int라 `int d`에 대입하는 것도 문제없습니다."}, "concepts": [{"title": "중첩 조건 연산자 읽는 법", "body": "`?:`는 오른쪽 결합입니다. `a ? b : c ? d : e`는 `a ? b : (c ? d : e)`입니다. 두 번째 피연산자(`?`와 `:` 사이)에도 조건식이 올 수 있어, `?`를 만날 때마다 짝이 되는 `:`를 가장 가까운 것부터 맞춰 괄호를 쳐 보면 됩니다. 조건 연산자의 결과는 반드시 값이어야 하므로 void 메서드 호출은 피연산자로 쓸 수 없습니다.\n```java\nint n = 5;\nString s = n > 10 ? \"big\" : n > 3 ? \"mid\" : \"small\"; // mid\n```"}, {"title": "증감 연산 추적", "body": "한 줄씩 '식에 쓰인 값'과 '문장 실행 후 변수 값'을 구분해 표로 적으면 실수가 줄어듭니다. `y = x++`는 y에 이전 값, `y = ++x`는 y에 새 값이 들어가며 두 경우 모두 x는 1 증가합니다."}], "trap": "괄호가 부족해 보이는 중첩 조건식으로 컴파일 에러를 고르게 만드는 함정입니다.", "tags": ["중첩 조건 연산자", "후위/전위 증감", "연산자 결합 방향"], "occurrences": ["certleader-B Q5 p101"], "verified": "compiled", "fixes": [], "no": 39}, {"id": 174, "topic": "operators", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "if (aVar++ < 10) {\n    System.out.println(aVar + \" Hello Universe!\");\n} else {\n    System.out.println(aVar + \" Hello World!\");\n}"}, {"type": "text", "content": "What is the result if the integer aVar is 9?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "10 Hello Universe!", "code": null}, {"key": "C", "text": "10 Hello World!", "code": null}, {"key": "D", "text": "9 Hello World!", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "`aVar++ < 10`은 증가 전 값 9로 비교해 true가 되고, 비교 직후 `aVar`는 10이 되었으므로 `10 Hello Universe!`가 출력됩니다.", "walkthrough": "(코드 조각이므로 `int aVar = 9;`를 선언한 `main`을 붙여 테스트했습니다.)\n1. `aVar++`는 후위 증가라서 식의 값은 증가 전 값인 `9`이고, 평가 직후 `aVar`가 `10`으로 증가합니다.\n2. 조건 `9 < 10`이 true이므로 if 블록으로 들어갑니다.\n3. 블록 안에서 `aVar`를 읽을 때는 이미 증가가 반영된 `10`이므로 `\"10 Hello Universe!\"`가 출력됩니다.\n실행 결과도 `10 Hello Universe!`입니다.", "optionNotes": {"A": "`aVar`가 int 변수로 선언되어 있다는 전제(\"the integer aVar is 9\")라면 문법 오류가 없습니다.", "B": "정답입니다. 비교에는 9가 쓰여 true가 되고, 출력 시점의 `aVar`는 10입니다.", "C": "후위 증가의 비교값은 9이므로 조건이 true입니다. else 분기로 가지 않습니다. 전위 증가 `++aVar < 10`이었다면 `10 < 10`이 false가 되어 이 출력이 나옵니다.", "D": "조건식에서 증가가 이미 일어났으므로 출력 시 `aVar`는 9가 아닙니다. 또 조건이 true라 else로 가지도 않습니다."}, "concepts": [{"title": "전위/후위 증감 연산자", "body": "`x++`(후위)는 현재 값을 식의 결과로 쓰고 나서 증가시키고, `++x`(전위)는 먼저 증가시킨 뒤 증가된 값을 식의 결과로 씁니다. 어느 쪽이든 그 식이 평가된 직후에는 변수 자체가 이미 증가해 있습니다. 같은 문장에서 여러 번 쓰이면 왼쪽부터 차례로 평가합니다.\n```java\nint x = 5;\nint y = x++ + ++x; // 5 + 7 = 12, x는 7\n```\n`x = x++;`는 x가 변하지 않는 대표적 함정입니다. 원래 값이 다시 대입되기 때문입니다."}, {"title": "조건식 안의 부수 효과", "body": "if, while, 삼항 연산자의 조건에 `++`/`--`나 대입이 들어 있으면 조건 판단 후에도 그 변화가 남습니다. 단, `&&`/`||`의 단락 평가(short-circuit) 때문에 오른쪽 피연산자가 평가되지 않으면 그 안의 증가도 일어나지 않습니다. 예: `if (false && x++ > 0)` → `x`는 그대로입니다."}], "trap": "후위 증가라서 비교는 9로 하지만 출력은 10으로 한다는 두 시점의 차이를 노립니다. 9를 출력하는 D나, 증가된 10으로 비교한 C를 고르게 만듭니다.", "tags": ["후위 증가 연산자", "if/else 조건식"], "occurrences": ["certleader-D Q40 p178"], "verified": "compiled", "fixes": [], "no": 40}, {"id": "X11", "topic": "operators", "tags": ["삼항 연산자 중첩", "if 문 순서", "조건 범위 검사"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    double discount = 0;\n    int qty = Integer.parseInt(args[0]);\n    //line n1;\n}"}, {"type": "text", "content": "And given the requirements:\n- If the value of the qty variable is greater than or equal to 90, discount = 0.5\n- If the value of the qty variable is between 80 and 90, discount = 0.2"}, {"type": "text", "content": "Which two code fragments can be independently placed at line n1 to meet the requirements? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "if (qty >= 90) { discount = 0.5; }\nif (qty > 80 && qty < 90) { discount = 0.2; }"}, {"key": "B", "text": "", "code": "discount = (qty >= 90) ? 0.5 : 0;\ndiscount = (qty > 80) ? 0.2 : 0;"}, {"key": "C", "text": "", "code": "discount = (qty >= 90) ? 0.5 : (qty > 80)? 0.2 : 0;"}, {"key": "D", "text": "", "code": "if (qty > 80 && qty < 90) {\n    discount = 0.2;\n} else {\n    discount = 0;\n}\nif (qty >= 90) {\n    discount = 0.5;\n} else {\n    discount = 0;\n}"}, {"key": "E", "text": "", "code": "discount = (qty > 80) ? 0.2 : (qty >= 90) ? 0.5 : 0;"}], "choose": 2, "correct": "AC", "dumpAnswersAll": ["AC", "D"], "answerNote": "A, C가 정답입니다. qty 50·80·81·85·89·90·95로 다섯 보기를 모두 실행해 보니 요구 사항과 항상 일치하는 것은 A와 C뿐이었습니다. 일부 사본(5부)이 적은 D는 두 번째 if-else가 첫 번째 결과를 덮어써서 qty가 81~89일 때 0.2가 아니라 0이 됩니다. 게다가 두 개를 고르는 문제에 답을 하나만 적은 것이므로 명백한 오류입니다.", "verified": "compiled", "summary": "두 조건이 서로 겹치지 않게 처리되는 A와, 큰 범위(>= 90)를 먼저 검사하는 중첩 삼항 C만 요구 사항을 만족합니다.", "walkthrough": "1. 요구 사항: qty >= 90 → 0.5, 80 < qty < 90 → 0.2, 나머지는 초기값 0을 유지합니다.\n2. A: 두 if의 조건이 겹치지 않습니다. 95 → 첫 if만 참 → 0.5, 85 → 둘째 if만 참 → 0.2, 50 → 둘 다 거짓 → 0. 요구 사항을 만족합니다.\n3. B: 두 번째 대입이 항상 실행돼 첫 번째 결과를 덮어씁니다. 95이면 `qty > 80`이 참이므로 결국 0.2가 되어 틀립니다.\n4. C: `(qty >= 90) ? 0.5 : ((qty > 80) ? 0.2 : 0)`으로 묶입니다. 95 → 0.5, 85 → 0.2, 50 → 0이므로 만족합니다(삼항 연산자는 오른쪽 결합).\n5. D: 두 번째 if-else가 항상 discount를 다시 씁니다. 85이면 첫 블록에서 0.2가 되지만 두 번째 블록의 else에서 0으로 덮여 틀립니다.\n6. E: `qty > 80`을 먼저 검사하므로 95도 0.2가 됩니다. 뒤의 `(qty >= 90)` 분기는 절대 도달하지 못합니다.\n7. 따라서 정답은 A와 C입니다.", "optionNotes": {"A": "정답입니다. 두 조건이 겹치지 않으므로 어떤 qty에도 한 블록만 실행되거나 아무것도 실행되지 않습니다.", "B": "두 번째 문장이 무조건 discount를 다시 대입합니다. qty가 90 이상이면 0.5가 0.2로 덮여 틀립니다.", "C": "정답입니다. 90 이상을 먼저 검사하고, 아니면 80 초과인지 검사하는 올바른 순서의 중첩 삼항입니다.", "D": "두 번째 if-else의 else가 qty 81~89일 때 0.2를 0으로 덮어써 요구 사항을 어깁니다.", "E": "`qty > 80`을 먼저 검사해 90 이상도 0.2가 됩니다. 넓은 조건을 먼저 검사하면 좁은 조건은 영원히 도달하지 못합니다."}, "concepts": [{"title": "중첩 삼항 연산자의 결합과 검사 순서", "body": "삼항 연산자 `a ? b : c`는 오른쪽 결합이므로 `x ? 1 : y ? 2 : 3`은 `x ? 1 : (y ? 2 : 3)`으로 해석됩니다. 즉 if / else if / else 사슬과 같습니다.\n\n- 앞의 조건이 참이면 뒤의 조건은 평가하지 않습니다.\n- 그래서 범위 조건은 좁은(더 구체적인) 것부터 검사해야 합니다. `qty > 80`을 `qty >= 90`보다 먼저 두면 90 이상인 값이 모두 앞 분기에 걸립니다."}, {"title": "연속된 대입·if-else는 서로 덮어쓴다", "body": "독립된 if 문 두 개나 대입문 두 개를 이어 쓰면 둘 다 실행되므로, 뒤의 문장이 앞의 결과를 덮어쓸 수 있습니다. 특히 `else { x = 0; }`처럼 기본값을 다시 넣는 else가 있으면 앞 블록이 설정한 값이 사라집니다. 이런 보기는 경계값(81, 89, 90, 95 등)을 직접 넣어 추적하면 빠르게 판별할 수 있습니다."}], "trap": "D와 B는 언뜻 각 조건을 꼼꼼히 처리하는 것처럼 보이지만, 뒤의 문장이 앞 결과를 덮어씁니다. E는 조건 검사 순서가 뒤바뀌어 90 이상도 0.2가 됩니다.", "fixes": ["대부분의 사본에서 빠진 \"(Choose two.)\"를 gratisexam f14 사본에 따라 복원했습니다.", "두 요구 사항이 한 문단에 붙어 인쇄된 것을 두 줄 목록으로 정리했습니다."], "occurrences": ["gratisexam-VCE (f10) Q30", "gratisexam-VCE (f11) Q29", "gratisexam-VCE (f14) Q21", "gratisexam-VCE (f15) Q29", "gratisexam-VCE (f20) Q34", "gratisexam-VCE (f8) Q30", "passleader-300q (f2) Q14", "passleader-300q (f2) Q30", "passleader-300q (f2) Q38", "scanned (f3) Q34"], "added": true, "dumpAnswer": "AC/D", "no": 41}, {"id": "X13", "topic": "operators", "tags": ["equalsIgnoreCase", "== 참조 비교", "toLowerCase"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class App {\n    public static void main(String[] args) {\n        String str1 = \"Java\";\n        String str2 = new String(\"java\");\n        //line n1\n        {\n            System.out.println(\"Equal\");\n        } else {\n            System.out.println(\"Not Equal\");\n        }\n    }\n}"}, {"type": "text", "content": "Which code fragment, when inserted at line n1, enables the App class to print Equal?"}], "options": [{"key": "A", "text": "", "code": "String str3 = str2;\nif (str1 == str3)"}, {"key": "B", "text": "", "code": "if (str1.equalsIgnoreCase(str2))"}, {"key": "C", "text": "", "code": "String str3 = str2;\nif (str1.equals(str3))"}, {"key": "D", "text": "", "code": "if (str1.toLowerCase() == str2.toLowerCase())"}], "choose": 1, "correct": "B", "dumpAnswersAll": ["A", "B"], "answerNote": "정답은 B입니다. 이 보기 구성의 사본 다수(7부)가 A로 표기했지만 `str3`은 `str2`와 같은 객체일 뿐 `str1`(\"Java\" 리터럴)과는 다른 객체라 `str1 == str3`은 false입니다. 컴파일해 실행하면 B만 Equal을 출력합니다. B로 표기한 사본(f14)은 보기 A, C가 `str1.toLowerCase();` 형태로 바뀌고 B가 `str2.equals(str1.toLowerCase())`인 변형이며, 그 변형에서도 B가 정답입니다.", "verified": "compiled", "summary": "\"Java\"와 \"java\"는 대소문자가 달라 `equals()`로도 다르고 객체도 다르므로, 대소문자를 무시하는 `equalsIgnoreCase()`만 Equal을 출력합니다.", "walkthrough": "1. `str1`은 문자열 풀의 리터럴 \"Java\"(대문자 J), `str2`는 `new`로 만든 힙 객체 \"java\"(소문자 j)입니다. 내용도 다르고 객체도 다릅니다.\n2. A: `str3 = str2`로 `str3`은 `str2`와 같은 객체가 됩니다. `str1 == str3`은 `str1 == str2`와 같고, 서로 다른 객체이므로 false입니다.\n3. B: `equalsIgnoreCase()`는 대소문자를 무시하고 내용을 비교하므로 \"Java\"와 \"java\"는 같다고 판단해 true입니다.\n4. C: `equals()`는 대소문자를 구분하므로 \"Java\"와 \"java\"는 다르고 false입니다.\n5. D: `str1.toLowerCase()`는 새 String \"java\"를 만들고, `str2.toLowerCase()`는 이미 소문자라 `str2` 자신을 반환합니다. 내용은 같지만 서로 다른 객체이므로 `==`는 false입니다.\n6. 실제 실행 결과도 B만 `Equal`, 나머지는 `Not Equal`입니다.", "optionNotes": {"A": "`str3`은 `str2`의 별칭일 뿐입니다. `str1`과는 다른 객체라 `==`가 false입니다.", "B": "정답입니다. `equalsIgnoreCase()`는 대소문자를 무시하고 내용을 비교하므로 true입니다.", "C": "`equals()`는 대소문자를 구분합니다. \"Java\"와 \"java\"는 다른 문자열이라 false입니다.", "D": "두 결과의 내용은 \"java\"로 같지만 `toLowerCase()`가 만든 새 객체와 `str2`는 다른 객체라 `==`가 false입니다."}, "concepts": [{"title": "문자열 비교 메서드 정리", "body": "- `==`: 두 참조가 같은 객체인지 비교합니다.\n- `equals()`: 내용을 대소문자까지 정확히 비교합니다.\n- `equalsIgnoreCase()`: 내용을 대소문자 구분 없이 비교합니다.\n- `compareTo()` / `compareToIgnoreCase()`: 사전 순서를 int로 돌려주며, 같으면 0입니다.\n\n`String str3 = str2;`처럼 참조를 복사하면 새 객체가 생기지 않고 같은 객체를 가리키는 변수가 하나 더 생길 뿐입니다."}, {"title": "toLowerCase()/toUpperCase()의 반환 객체", "body": "String은 불변이라 `toLowerCase()`는 원본을 바꾸지 않고 결과를 반환합니다. 바꿀 문자가 있으면 새 객체를 만들고, 이미 모두 소문자라면 원본 객체(`this`)를 그대로 돌려줍니다. 어느 경우든 반환값을 `==`로 다른 문자열과 비교하는 것은 믿을 수 없으므로 `equals()`를 써야 합니다. 반환값을 받지 않고 `str1.toLowerCase();`만 호출하면 `str1`은 그대로 \"Java\"입니다."}], "trap": "A처럼 새 변수 `str3`을 만들면 같은 객체가 되는 것처럼 보이게 합니다. `str3`은 `str2`와 같을 뿐 `str1`과는 여전히 다른 객체입니다.", "fixes": ["이미지로 인쇄된 보기(Option A~D)의 코드를 읽어 보기 본문으로 옮겼습니다."], "occurrences": ["gratisexam-VCE (f10) Q40", "gratisexam-VCE (f11) Q38", "gratisexam-VCE (f14) Q27", "gratisexam-VCE (f14) Q85", "gratisexa 됩니다. `\"true\".equals(\"true\")`가 성립해 `True`를 출력하고 `break`로 빠져나간 뒤 `Done`을 출력합니다. 결과는 `TrueDone`입니다.\n4. B: `boolean opt = 1;`은 int를 boolean에 대입할 수 없어 오류이고, 여전히 boolean switch이므로 오류가 남습니다.\n5. C와 D는 switch 식의 타입을 그대로 두므로 계속 컴파일되지 않습니다.", "optionNotes": {"A": "정답입니다. Java 7부터 String switch가 허용되므로 컴파일되고, case `\"true\"`가 일치해 `True` 다음 `Done`이 출력됩니다.", "B": "Java에서 `int`와 `boolean`은 서로 변환되지 않으므로 `boolean opt = 1;`부터 컴파일 오류입니다. `case 1:`도 boolean 식과 맞지 않습니다.", "C": "`break`를 지워도 boolean switch라는 근본 문제가 남아 컴파일되지 않습니다. 설령 컴파일된다 해도 fall-through로 `True***Done`이 출력됩니다.", "D": "`default`는 원래 선택 사항이라 지워도 컴파일 오류의 원인인 boolean switch는 그대로입니다."}, "concepts": [{"title": "switch 식에 허용되는 타입 (Java 8)", "body": "switch 식은 `char`, `byte`, `short`, `int`, 이들의 래퍼 클래스, `String`(Java 7부터), enum만 허용합니다. `boolean`, `long`, `float`, `double`은 쓸 수 없습니다.\n\n- case 라벨은 컴파일 시점 상수여야 하고 switch 식의 타입에 대입 가능해야 합니다. 같은 값의 case가 중복되면 컴파일 오류입니다.\n- String switch는 `equals()`로 비교하므로 대소문자가 다르면 일치하지 않습니다(`\"True\"`와 `\"true\"`는 다름).\n- `default`는 선택 사항이며 위치도 자유롭습니다."}, {"title": "boolean과 숫자는 호환되지 않습니다", "body": "C/C++과 달리 Java의 `boolean`은 숫자형과 서로 변환할 수 없습니다. `boolean b = 1;`, `int i = true;`, `if (1)`은 모두 컴파일 오류이고, 캐스트로도 바꿀 수 없습니다. 조건문(`if`, `while`, 삼항 연산자의 조건)에는 반드시 boolean 식이 와야 합니다."}], "trap": "`break` 제거나 `default` 제거처럼 출력 흐름만 바꾸는 보기로 시선을 끌지만, 원래 코드는 boolean switch라 컴파일조차 되지 않는다는 점이 핵심입니다.", "fixes": ["보기 A의 `String result = \"true\";`(사본 4개 중 3개)를 passleader Q21 판에 따라 `String opt = \"true\";`로 바꿨습니다. `result`로 두면 `switch (opt)`가 컴파일되지 않아 정답이 없어집니다.", "보기 B의 `boolean opt = l;` / `case 1=`를 `boolean opt = 1;` / `case 1:`로 복원했습니다.", "두 줄로 인쇄된 보기 A, B를 한 문장으로 합쳤습니다."], "occurrences": ["gratisexam-VCE (f20) Q17", "passleader-300q (f2) Q21", "passleader-300q (f2) Q73", "scanned (f3) Q19"], "added": true, "dumpAnswer": "A", "no": 43}, {"id": 21, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int nums1[] = {1, 2, 3};\nint nums2[] = {1, 2, 3, 4, 5};\nnums2 = nums1;\nfor (int x : nums2){\n    System.out.print(x + \":\");\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "1:2:3:4:5:", "code": null}, {"key": "B", "text": "1:2:3:", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An ArrayIndexOutOfBoundsException is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. `nums2 = nums1;`은 배열 내용을 복사하지 않고 nums2가 nums1과 같은 길이 3의 배열 객체를 가리키게 합니다. 그러므로 향상된 for문은 1, 2, 3만 돌고 `1:2:3:`을 출력합니다(실행으로 확인).\n\n**덤프 사본 비교:** `nums2 = nums1;`은 배열 내용을 복사하지 않고 참조만 바꾸므로, 길이 3인 배열을 돌아 `1:2:3:`이 출력됩니다. 이미지의 숫자 부분이 덧칠되어 띄어 보이지만 편집 흔적으로 보이고, 덤프 답 A가 나오는 해석은 없습니다.", "summary": "배열 변수 대입은 참조 복사라서 `nums2`가 길이 3인 `nums1` 배열을 가리키므로 `1:2:3:`이 출력됩니다.", "walkthrough": "1. `nums1` → `{1, 2, 3}` 배열 객체, `nums2` → `{1, 2, 3, 4, 5}` 배열 객체.\n2. `nums2 = nums1;` → nums2의 참조값이 nums1과 같아집니다. 원소를 복사하는 것이 아니라 같은 배열 객체를 가리키게 되는 것입니다. 원래 길이 5 배열은 참조가 없어져 GC 대상이 됩니다.\n3. `for (int x : nums2)` → 현재 nums2가 가리키는 길이 3 배열을 순회합니다.\n4. 각 원소마다 `x + \":\"` 출력 → `1:2:3:`.\n배열 크기가 달라도 같은 원소 타입(`int[]`)이면 대입할 수 있어 컴파일 에러가 없고, 향상된 for문은 실제 배열 길이만큼만 돌기 때문에 인덱스 예외도 없습니다.", "optionNotes": {"A": "nums2가 원래 길이 5 배열을 계속 가리킨다고 보거나, 대입이 원소를 덮어쓴다고 착각한 결과입니다. 대입 후 nums2는 길이 3 배열을 가리킵니다.", "B": "정답입니다. 참조 대입으로 nums2가 nums1 배열을 가리키므로 1:2:3:이 출력됩니다.", "C": "배열 크기는 타입의 일부가 아니므로 `int[]`끼리 자유롭게 대입할 수 있습니다. 컴파일됩니다.", "D": "향상된 for문은 배열의 실제 길이만큼만 반복하므로 인덱스 범위를 벗어날 일이 없습니다."}, "concepts": [{"title": "배열은 객체: 참조 대입 vs 복사", "body": "배열 변수는 배열 객체를 가리키는 참조입니다. `a = b;`는 두 변수가 같은 배열을 공유하게 할 뿐이라, 이후 `b[0] = 9;`를 하면 `a[0]`도 9가 됩니다. 배열의 길이는 생성 시 고정되며 타입(`int[]`)에 포함되지 않으므로 길이가 다른 배열끼리 대입할 수 있습니다. 내용을 복사하려면 `b.clone()`, `Arrays.copyOf`, `System.arraycopy`를 써야 합니다. 같은 배열을 가리키는지는 `a == b`로, 내용이 같은지는 `Arrays.equals(a, b)`로 비교합니다(`a.equals(b)`는 `==`과 같습니다)."}, {"title": "향상된 for문의 동작", "body": "`for (T x : arr)`는 루프를 시작할 때 `arr`을 한 번 평가해 그 배열의 0번부터 `length-1`까지 순회합니다. 루프 변수 `x`는 원소의 복사본이라, `x = 0;`처럼 대입해도 배열은 바뀌지 않습니다. 인덱스가 필요하거나 역순으로 돌거나 원소를 바꾸려면 일반 for문을 써야 합니다. 배열 참조가 null이면 NullPointerException이 납니다."}, {"title": "배열 선언 문법", "body": "`int nums1[]`와 `int[] nums1`은 같습니다. 단, `int[] a, b;`는 둘 다 배열이고 `int a[], b;`는 a만 배열이고 b는 int입니다. 배열 초기화 `{1, 2, 3}`은 선언과 함께 쓸 때만 단독으로 쓸 수 있고, 나중에 대입할 때는 `a = new int[]{1, 2, 3};`처럼 써야 합니다."}], "trap": "배열 대입을 원소 복사로 착각하거나, 크기가 다른 배열 대입이 컴파일 에러라고 생각하게 만듭니다.", "tags": ["배열 참조 대입", "향상된 for문"], "occurrences": ["certleader-A Q40 p12", "2passeasy Q22 p22", "certleader-D Q37 p178"], "verified": "compiled", "fixes": ["3행 이미지의 `nums 2 = nums 1;` 띄어쓰기는 이미 `nums2 = nums1;`로 정리되어 있어 answerNote의 관련 설명만 삭제", "보기 D의 예외 이름 `ArrayOutOfBoundsException`을 `ArrayIndexOutOfBoundsException`으로 수정"], "no": 44}, {"id": 34, "topic": "arrays", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Student {\n    String name;\n    public Student(String name) {\n        this.name = name;\n    }\n}\n\npublic class Test {\n    public static void main(String[] args) {\n        Student[] students = new Student[3];\n        students[1] = new Student(\"Richard\");\n        students[2] = new Student(\"Donald\");\n        for (Student s : students) {\n            System.out.println(\"\" + s.name);\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "null\nRichard\nDonald"}, {"key": "B", "text": "", "code": "Richard\nDonald"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An ArrayIndexOutOfBoundsException is thrown at runtime.", "code": null}, {"key": "E", "text": "A NullPointerException is thrown at runtime.", "code": null}], "correct": "E", "dumpAnswer": "A/E", "answerNote": "덤프마다 A와 E로 표기가 다릅니다. 실제 정답은 E입니다. `students[0]`은 대입되지 않아 null이고, 향상된 for 문의 첫 반복에서 `s.name`에 접근하는 순간 NullPointerException이 납니다. `\"\" + s`였다면 null이 출력되겠지만 `s.name`은 null 참조의 필드 접근입니다. 실행으로 확인했습니다.", "summary": "객체 배열의 원소는 기본값이 null이므로, 대입하지 않은 students[0]에서 `s.name`을 읽으면 NullPointerException이 납니다.", "walkthrough": "1. `new Student[3]`은 Student 객체 3개가 아니라 참조 3칸을 만들고, 각 칸은 null로 초기화됩니다.\n2. `students[1]`, `students[2]`에만 객체가 대입되고 `students[0]`은 null 그대로입니다.\n3. 향상된 for 문은 인덱스 0부터 돌기 때문에 첫 반복에서 s = null입니다.\n4. `\"\" + s.name`을 계산하려면 먼저 `s.name`을 읽어야 하는데, s가 null이라 NullPointerException이 발생합니다.\n5. 첫 반복에서 예외가 나므로 아무것도 출력되지 않고 프로그램이 종료됩니다.", "optionNotes": {"A": "`\"\" + s`였다면 \"null\"이 출력되었겠지만, 여기서는 null 참조의 필드 `s.name`을 읽으므로 아무것도 출력되기 전에 NPE가 납니다.", "B": "null 원소를 건너뛰는 규칙은 없습니다. 첫 원소에서 예외가 납니다.", "C": "문법적으로 문제가 없어 정상적으로 컴파일됩니다.", "D": "향상된 for 문은 배열 길이만큼만 돌기 때문에 인덱스 범위를 벗어나지 않습니다.", "E": "정답입니다. students[0]이 null이라 `s.name`에서 NullPointerException이 발생합니다."}, "concepts": [{"title": "배열 생성과 원소 기본값", "body": "`new 타입[n]`으로 만든 배열의 원소는 타입별 기본값으로 채워집니다. int는 0, boolean은 false, 참조형은 null입니다. 객체 배열을 만들어도 객체는 생성되지 않으므로 각 칸에 직접 `new`로 대입해야 합니다. 배열 초기화 식 `{a, b}`를 쓰면 값이 바로 들어갑니다."}, {"title": "null과 문자열 연결", "body": "문자열 연결에서 null 참조 자체는 \"null\"로 바뀝니다(`\"\" + null` → \"null\"). 하지만 null 참조로 필드나 인스턴스 메서드에 접근하면(`s.name`, `s.toString()`) NullPointerException이 납니다. 예외적으로 static 멤버 접근은 참조가 null이어도 동작합니다."}], "trap": "'null이 출력될 것'이라는 직관을 노립니다. 연결 대상이 `s`가 아니라 `s.name`이라는 점이 핵심입니다.", "tags": ["객체 배열 기본값 null", "NullPointerException"], "occurrences": ["2passeasy Q10 p21", "surepassexam Q169 p87"], "verified": "compiled", "fixes": ["보기 A, B(`nullRichardDonald`, `RichardDonald`)는 println 출력이 한 줄로 붙은 것이므로 줄바꿈을 살려 코드 블록으로 표시"], "no": 45}, {"id": 43, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int n [] [] = {{1, 3}, {2, 4}};\nfor (int i = n.length-1; i >= 0; i--) {\n    for (int y : n[i]) {\n        System.out.print (y);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "1324", "code": null}, {"key": "B", "text": "2413", "code": null}, {"key": "C", "text": "3142", "code": null}, {"key": "D", "text": "4231", "code": null}], "correct": "B", "dumpAnswer": "D", "answerNote": "실제 출력은 `2413`입니다. 바깥 루프가 행을 뒤에서부터(n[1] → n[0]) 돌고, 안쪽 향상된 for 문은 각 행을 앞에서부터 돌기 때문입니다. 덤프 정답 D(4231)는 안쪽 원소까지 역순으로 돈 결과라 틀렸습니다. 실행으로 확인했습니다.", "summary": "바깥 루프는 행만 역순(n[1], n[0])으로 돌고 각 행의 원소는 순서대로 출력되므로 결과는 2413입니다.", "walkthrough": "1. `n = {{1, 3}, {2, 4}}`이므로 `n[0] = {1, 3}`, `n[1] = {2, 4}`이고 `n.length = 2`입니다.\n2. 바깥 루프는 `i = n.length - 1 = 1`에서 시작해 i가 0이 될 때까지 감소합니다.\n3. i = 1일 때 `for (int y : n[1])`이 2, 4를 차례로 출력합니다 → `24`.\n4. i = 0일 때 `for (int y : n[0])`이 1, 3을 출력합니다 → `13`.\n5. print는 줄바꿈이 없으므로 최종 출력은 `2413`입니다.\n6. 향상된 for 문은 항상 인덱스 0부터 순서대로 돌기 때문에 안쪽 원소가 뒤집히지 않습니다.", "optionNotes": {"A": "`1324`는 행을 앞에서부터(n[0] → n[1]) 돈 결과입니다. 바깥 루프는 역순입니다.", "B": "정답입니다. 행은 역순, 행 안의 원소는 정순으로 출력되어 `2413`이 됩니다.", "C": "`3142`는 열 단위로 거꾸로 읽은 결과처럼 보이지만, 이 코드는 행 단위로 접근하므로 나올 수 없습니다.", "D": "`4231`은 행과 원소를 모두 역순으로 돈 결과입니다. 향상된 for 문은 원소를 역순으로 돌지 않습니다."}, "concepts": [{"title": "2차원 배열 구조", "body": "Java의 2차원 배열은 '배열의 배열'입니다. `n.length`는 행의 개수, `n[i].length`는 i번째 행의 길이입니다. 행마다 길이가 다른 비정형(jagged) 배열도 만들 수 있습니다: `int[][] a = new int[3][];`. 선언 형태 `int n[][]`, `int[] n[]`, `int[][] n`은 모두 같습니다."}, {"title": "향상된 for 문의 특징", "body": "`for (타입 변수 : 배열)`은 인덱스 0부터 끝까지 순서대로만 돕니다. 역순 반복이나 인덱스 사용이 필요하면 일반 for 문을 써야 합니다. 루프 변수에 값을 대입해도 배열 원소는 바뀌지 않습니다(기본형은 값의 복사본입니다). 변수 타입은 원소 타입과 대입 호환이어야 합니다(`for (long y : intArr)`는 OK)."}], "trap": "바깥 루프가 역순이라 원소까지 모두 뒤집힌다고 생각하게 만듭니다(4231). 안쪽 향상된 for 문은 항상 정순입니다.", "tags": ["2차원 배열", "향상된 for 문", "역순 반복"], "occurrences": ["exambible Q7 p28", "certleader-D Q6 p172"], "verified": "compiled", "fixes": ["보기 B의 '2313'을 실제 출력 '2413'으로 수정(4가 3으로 잘못 인쇄됨)"], "no": 46}, {"id": 65, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "1. public class Test {\n2.     public static void main(String[] args) {\n3.         /* insert code here */\n4.         array[0]=10;\n5.         array[1]=20;\n6.         System.out.print(array[0]+\":\"+array[1]);\n7.     }\n8. }"}, {"type": "text", "content": "Which code fragment, when inserted at line 3, enables the code to print 10:20?"}], "options": [{"key": "A", "text": "", "code": "int[] array = new int[2];"}, {"key": "B", "text": "", "code": "int[] array;array = int[2];"}, {"key": "C", "text": "", "code": "int array = new int[2];"}, {"key": "D", "text": "", "code": "int array [2] ;"}], "correct": "A", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. C의 `int array = new int[2];`는 `int[]`를 `int` 변수에 대입하므로 컴파일 에러이고, 이후 `array[0]`도 int에 인덱스를 쓴 것이라 에러입니다. A를 넣으면 `10:20`이 출력됩니다(네 보기 모두 직접 컴파일해서 확인).", "summary": "배열은 `int[] array = new int[2];`처럼 배열 타입으로 선언하고 `new`로 크기를 지정해 생성해야 하므로 A가 정답입니다.", "walkthrough": "line 4~6은 `array`가 길이 2 이상인 int 배열이어야 동작합니다. 보기별로 컴파일한 결과는 다음과 같습니다.\n- A `int[] array = new int[2];`: `int[]` 타입 변수에 길이 2 배열을 대입합니다. 원소는 0으로 초기화된 뒤 10, 20이 들어가고 `10:20`이 출력됩니다.\n- B `int[] array;array = int[2];`: `new` 없이 `int[2]`라고 쓸 수 없으므로 `']' expected` 구문 에러입니다.\n- C `int array = new int[2];`: 변수 타입이 `int`라서 `int[] cannot be converted to int` 에러가 나고, 이후 `array[0]` 등에서도 `array required, but int found` 에러가 납니다.\n- D `int array [2];`: Java는 선언할 때 대괄호 안에 크기를 쓸 수 없으므로(C 스타일) `']' expected` 에러입니다.", "optionNotes": {"A": "정답입니다. `int[]`로 선언하고 `new int[2]`로 생성하므로 두 원소에 값을 넣고 `10:20`이 출력됩니다.", "B": "배열 생성에는 `new` 키워드가 필요합니다. `array = new int[2];`라고 써야 하므로 `int[2]`만 쓰면 구문 에러입니다.", "C": "변수 타입이 `int`라서 배열 객체를 담을 수 없고, int 변수에 `[0]`처럼 인덱스를 쓸 수도 없어 컴파일 에러입니다(덤프 정답이지만 오답).", "D": "Java는 선언부에 배열 크기를 쓸 수 없습니다(`int array[2];`는 C 문법). 크기는 `new int[2]`에서만 지정합니다."}, "concepts": [{"title": "배열 선언, 생성, 초기화 문법", "body": "올바른 형태는 다음과 같습니다.\n```java\nint[] a = new int[2];        // 크기 지정, 원소는 기본값 0\nint b[] = new int[2];        // 대괄호를 변수명 뒤에 써도 됨\nint[] c = {10, 20};          // 선언과 동시에 초기화할 때만 가능\nint[] d = new int[]{10, 20}; // 크기 없이 초기값만 지정\n```\n잘못된 형태는 `int[2] a;`, `int a[2];`(선언부에 크기), `new int[]`(크기도 초기값도 없음), `new int[2]{1,2}`(둘 다 지정), 선언 후 `a = {1, 2};`(배열 초기화 리터럴 단독 사용)입니다."}, {"title": "배열 원소의 기본값", "body": "`new`로 만든 배열의 원소는 자동으로 기본값을 갖습니다. 정수형은 0, 실수형은 0.0, `boolean`은 false, `char`는 `'\\u0000'`, 참조형은 null입니다. 지역 변수와 달리 배열 원소는 초기화하지 않아도 읽을 수 있습니다. 배열 길이는 `a.length`(메서드가 아니라 필드)로 얻고, 범위를 벗어난 인덱스는 실행 시 `ArrayIndexOutOfBoundsException`이 발생합니다."}], "trap": "C처럼 `[]`를 빠뜨린 선언이나 D처럼 C 언어식 크기 선언을 섞어 두어 배열 문법을 정확히 아는지 확인합니다.", "tags": ["배열 선언과 생성", "배열 문법 오류"], "occurrences": ["surepassexam Q8 p52"], "verified": "compiled", "fixes": ["보기 A의 `int[] array n= new int[2];`에서 잘못 들어간 `n`을 제거해 `int[] array = new int[2];`로 수정"], "no": 47}, {"id": 85, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "String shirts[][] = new String[2][2];\nshirts[0][0] = \"red\";\nshirts[0][1] = \"blue\";\nshirts[1][0] = \"small\";\nshirts[1][1] = \"medium\";"}, {"type": "text", "content": "Which code fragment prints red:blue:small:medium:?"}], "options": [{"key": "A", "text": "", "code": "for (int index = 1; index < 2; index++) {\n    for (int idx = 1; idx < 2; idx++) {\n        System.out.print(shirts[index][idx] + \":\");\n    }\n}"}, {"key": "B", "text": "", "code": "for (int index = 0; index < 2; ++index) {\n    for (int idx = 0; idx < index; ++idx) {\n        System.out.print(shirts[index][idx] + \":\");\n    }\n}"}, {"key": "C", "text": "", "code": "for (String c : colors) {\n    for (String s : sizes) {\n        System.out.println(s + \":\");\n    }\n}"}, {"key": "D", "text": "", "code": "for (int index = 0; index < 2;) {\n    for (int idx = 0; idx < 2;) {\n        System.out.print(shirts[index][idx] + \":\");\n        idx++;\n    }\n    index++;\n}"}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "갱신식을 생략하고 루프 본문 끝에서 `idx++`, `index++`를 하는 D만 2×2 배열의 네 요소를 모두 순서대로 출력합니다.", "walkthrough": "배열 상태: `shirts[0] = {\"red\", \"blue\"}`, `shirts[1] = {\"small\", \"medium\"}`. 각 선택지를 실행했습니다.\n- A: `index`와 `idx`가 모두 1에서 시작해 1까지만 돌므로 `shirts[1][1]`만 출력됩니다 → `medium:`.\n- B: 안쪽 조건이 `idx < index`라서 `index = 0`일 때는 한 번도 돌지 않고, `index = 1`일 때 `idx = 0`만 돕니다 → `small:`.\n- C: `colors`, `sizes`라는 변수가 선언되어 있지 않아 컴파일 에러입니다.\n- D: 바깥 루프 `index = 0`에서 안쪽 루프가 `idx = 0, 1`을 돌며 `red:blue:`를 출력하고 본문 끝에서 `index++`; `index = 1`에서 `small:medium:`을 출력합니다 → `red:blue:small:medium:`.\nfor문의 갱신식을 비워 두고 본문에서 증가시키는 것은 합법입니다.", "optionNotes": {"A": "두 루프 모두 1부터 시작하므로 인덱스 `[1][1]` 하나만 방문해 `medium:`만 출력됩니다.", "B": "안쪽 조건 `idx < index` 때문에 첫 행은 건너뛰고 둘째 행은 첫 요소만 방문해 `small:`만 출력됩니다.", "C": "`colors`와 `sizes`는 선언되지 않은 변수이므로 \"cannot find symbol\" 컴파일 에러입니다.", "D": "정답입니다. 갱신식을 생략했지만 본문 끝에서 `idx++`, `index++`를 하므로 모든 요소를 행 순서대로 출력합니다."}, "concepts": [{"title": "2차원 배열 순회", "body": "Java의 2차원 배열은 \"배열의 배열\"입니다. `shirts.length`는 행 개수, `shirts[i].length`는 i번째 행의 길이이며 행마다 길이가 다를 수도 있습니다(가변 배열). 모든 요소를 순회하려면 바깥 루프는 행 인덱스 0부터 `length - 1`까지, 안쪽 루프는 열 인덱스 0부터 해당 행의 `length - 1`까지 돌아야 합니다.\n```java\nfor (int r = 0; r < a.length; r++)\n    for (int c = 0; c < a[r].length; c++)\n        System.out.print(a[r][c] + \" \");\n// 향상된 for문 버전\nfor (String[] row : a) for (String s : row) System.out.print(s);\n```"}, {"title": "for문 구성 요소의 생략", "body": "`for (초기화; 조건; 갱신)`의 세 부분은 모두 생략할 수 있지만 세미콜론 두 개는 반드시 있어야 합니다. 조건을 생략하면 `true`로 간주되어 무한 루프가 됩니다(`for (;;)`). 갱신식을 생략하면 본문 안에서 직접 변수를 바꿔야 하며, 그렇지 않으면 무한 루프가 됩니다. 초기화와 갱신 부분에는 쉼표로 여러 식을 쓸 수 있지만, 초기화에서 선언할 때는 한 가지 타입만 가능합니다(`for (int i = 0, j = 5; ...)`)."}], "trap": "A와 B는 시작값이나 조건을 살짝 바꿔 일부 요소만 출력하게 만든 함정입니다. 루프 변수의 시작값과 조건을 정확히 추적하세요.", "tags": ["2차원 배열", "중첩 for문", "for문 갱신식 생략"], "occurrences": ["surepassexam Q63 p63"], "verified": "compiled", "fixes": ["문제의 출력 `red: blue: small: medium`을 실제 출력과 같은 `red:blue:small:medium:`(공백 없음, 끝 콜론)으로 수정"], "no": 48}, {"id": 88, "topic": "arrays", "parts": [{"type": "text", "content": "Given the following code:"}, {"type": "code", "content": "int[] intArr = {15, 30, 45, 60, 75};\nintArr[2] = intArr[4];\nintArr[4] = 90;"}, {"type": "text", "content": "What are the values of each element in intArr after this code has executed?"}], "options": [{"key": "A", "text": "15, 60, 45, 90, 75", "code": null}, {"key": "B", "text": "15, 90, 45, 90, 75", "code": null}, {"key": "C", "text": "15, 30, 75, 60, 90", "code": null}, {"key": "D", "text": "15, 30, 90, 60, 90", "code": null}, {"key": "E", "text": "15, 4, 45, 60, 90", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`intArr[2]`에 `intArr[4]`의 값 75가 복사되고, 그 뒤 `intArr[4]`만 90으로 바뀌므로 결과는 15, 30, 75, 60, 90입니다.", "walkthrough": "1. 초기 상태: 인덱스 0~4 = `15, 30, 45, 60, 75`.\n2. `intArr[2] = intArr[4];`: 인덱스 4의 값 75를 인덱스 2에 복사합니다 → `15, 30, 75, 60, 75`.\n3. `intArr[4] = 90;`: 인덱스 4를 90으로 바꿉니다 → `15, 30, 75, 60, 90`.\n4. 기본형 `int` 값의 복사이므로 이후 `intArr[4]`를 바꿔도 `intArr[2]`는 75로 유지됩니다.\n실행 결과 `[15, 30, 75, 60, 90]`을 확인했습니다.", "optionNotes": {"A": "인덱스를 1부터 센다고 착각한 결과입니다. Java 배열 인덱스는 0부터 시작하므로 `intArr[2]`는 세 번째 요소입니다.", "B": "인덱스를 잘못 셌을 뿐 아니라 90을 두 군데에 넣은 결과로, 코드와 맞지 않습니다.", "C": "정답입니다. 인덱스 2에 75가 복사되고 인덱스 4가 90으로 바뀝니다.", "D": "대입 시점에 값이 복사되므로 나중에 `intArr[4]`를 90으로 바꿔도 `intArr[2]`는 75 그대로입니다. 참조가 연결되지 않습니다.", "E": "`intArr[4]`는 인덱스 4가 아니라 인덱스 4에 있는 **값**(75)을 의미합니다. 숫자 4가 대입되지 않습니다."}, "concepts": [{"title": "배열 인덱스와 값 복사", "body": "Java 배열의 인덱스는 0부터 `length - 1`까지이며, 범위를 벗어나면 런타임에 `ArrayIndexOutOfBoundsException`이 발생합니다. `a[i] = a[j];`는 대입 시점의 `a[j]` 값을 `a[i]`에 복사하는 것이므로 이후 `a[j]`가 바뀌어도 `a[i]`에는 영향이 없습니다. 이는 기본형 배열의 경우이고, 객체 배열은 참조가 복사되므로 두 요소가 같은 객체를 가리키게 됩니다(그래도 요소 자체를 다른 객체로 바꾸는 것은 서로 영향이 없습니다)."}], "trap": "D는 `intArr[2]`가 `intArr[4]`를 계속 따라간다고 착각하게 만들고, E는 인덱스와 값을 혼동하게 만듭니다.", "tags": ["배열 요소 대입", "배열 인덱스"], "occurrences": ["surepassexam Q76 p65"], "verified": "compiled", "fixes": [], "no": 49}, {"id": 113, "topic": "arrays", "parts": [{"type": "text", "content": "The following grid shows the state of a 2D array:"}, {"type": "code", "content": "+---+---+---+\n| 0 | 0 |   |\n+---+---+---+\n|   | X | 0 |\n+---+---+---+\n|   | X | X |\n+---+---+---+"}, {"type": "text", "content": 2]`가 비어 있어 세 개가 연속되지 않습니다."}, "concepts": [{"title": "2차원 배열의 인덱스와 기본값", "body": "`new char[3][3]`은 길이 3인 `char[]` 3개를 담은 배열입니다. `grid[r][c]`에서 첫 번째 인덱스가 행(바깥 배열), 두 번째가 열(안쪽 배열)이며 둘 다 0부터 `length - 1`까지입니다. 생성 시 요소는 타입별 기본값(char는 `'\\u0000'`, int는 0, 참조형은 null)으로 채워집니다. 범위를 벗어난 인덱스는 컴파일은 되지만 실행 중 `ArrayIndexOutOfBoundsException`을 던집니다."}, {"title": "비정형(jagged) 2차원 배열", "body": "자바의 2차원 배열은 '배열의 배열'이라 행마다 길이가 다를 수 있습니다.\n```java\nint[][] a = new int[3][];\na[0] = new int[1];\na[1] = new int[4];\nSystem.out.println(a[1].length); // 4\n// a[2][0] = 1; // NullPointerException (a[2]는 null)\n```\n`grid.length`는 행 수, `grid[i].length`는 i번째 행의 길이입니다."}], "trap": "1부터 세는 습관으로 인덱스 3을 고르게 하거나, 대각선처럼 보이는 위치를 골라 실제로 칸이 다 채워지는지 확인하지 않게 만듭니다.", "tags": ["2차원 배열", "배열 인덱스", "ArrayIndexOutOfBoundsException"], "occurrences": ["surepassexam Q153 p83"], "verified": "compiled", "fixes": ["문제가 언급하는 `//line n1`이 코드에 없어 코드 끝에 `//line n1`을 추가"], "no": 50}, {"id": 121, "topic": "arrays", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n\n    public static void main(String[] args) {\n\n        String[][] chs = new String[2][];\n        chs[0] = new String[2];\n        chs[1] = new String[5];\n        int i = 97;\n\n        for (int a = 0; a < chs.length; a++) {\n            for (int b = 0; b < chs.length; b++) {\n                chs[a][b] = \"\" + i;\n                i++;\n            }\n        }\n\n        for (String[] ca : chs) {\n            for (String c : ca) {\n                System.out.print(c + \" \");\n            }\n            System.out.println();\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "97 98\n99 100 null null null"}, {"key": "B", "text": "", "code": "97 98\n99 100 101 102 103"}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "E", "text": "An Ar 대해 `.concat()`, `.length()` 같은 인스턴스 메서드를 호출하면 NullPointerException이 납니다. 반면 `+` 문자열 연결이나 `println(null참조)`는 null을 \"null\"로 바꿔 처리하므로 예외가 나지 않습니다.\n```java\nString s = null;\nSystem.out.println(s + \"!\");   // null!\nSystem.out.println(s.concat(\"!\")); // NullPointerException\n```"}, {"title": "String 불변성과 반환값 무시", "body": "String의 `concat`, `toUpperCase`, `replace`, `trim`, `substring` 등은 원본을 바꾸지 않고 새 String을 반환합니다. 반환값을 변수에 다시 대입하지 않으면 아무 효과가 없습니다. 원본을 직접 바꾸려면 StringBuilder의 `append`, `insert`, `reverse` 등을 사용합니다."}], "trap": "String 불변성(값이 안 바뀜)에만 집중해 null 출력을 고르게 만들지만, 그 전에 null 요소에 메서드를 호출해 NPE가 난다는 점이 핵심입니다.", "tags": ["배열 기본값 null", "String 불변성", "NullPointerException"], "occurrences": ["surepassexam Q200 p91"], "verified": "compiled", "fixes": ["보기 A·B·C의 사라진 줄바꿈을 복원해 두 줄 출력(code 블록)으로 표시하고, 줄 시작의 대문자(`Element`, `Null`)를 실제 출력 형태인 소문자로 수정"], "no": 52}, {"id": 130, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int nums1[] = new int[3];\nint nums2[] = {1, 2, 3, 4, 5};\nnums1 = nums2;\nfor (int x : nums1){\n    System.out.print(x + \":\");\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "1:2:3:4:5:", "code": null}, {"key": "B", "text": "1:2:3:", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An ArrayIndexOutOfBoundsException is thrown at runtime.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "`nums1 = nums2`는 배열 복사가 아니라 참조 대입이므로 nums1은 길이 5 배열을 가리키고 `1:2:3:4:5:`가 출력됩니다.", "walkthrough": "1. `nums1`은 길이 3짜리 int 배열 {0,0,0}을 가리킵니다.\n2. `nums2`는 {1,2,3,4,5}를 가리킵니다.\n3. `nums1 = nums2;`는 참조값을 대입하므로 이제 nums1과 nums2가 같은 길이 5 배열을 가리킵니다. 원래 길이 3 배열은 더 이상 참조되지 않아 GC 대상이 됩니다.\n4. 두 변수 모두 타입이 `int[]`이므로 길이와 관계없이 대입이 허용됩니다.\n5. 향상된 for문이 길이 5 배열을 순회하며 `1:2:3:4:5:`를 출력합니다.", "optionNotes": {"A": "정답입니다. nums1이 nums2의 배열 객체를 가리키게 되어 다섯 요소가 모두 출력됩니다.", "B": "배열 변수의 대입은 요소 복사가 아니라 참조
