ssing a method body, or should be declared abstract\" 에러가 2개 납니다.\n- C: `calculatePrice`가 `abstract` 없이 몸체가 없어 같은 에러입니다(`final` 메서드인 `printToy` 자체는 합법).\n- D: `abstract` 메서드에 몸체 `{ }`가 있어 \"abstract methods cannot have a body\" 에러입니다.\n따라서 정답은 A입니다.", "optionNotes": {"A": "정답입니다. 추상 메서드는 `abstract` + 세미콜론으로, 일반 메서드는 몸체와 함께 선언되어 규칙에 맞고 컴파일됩니다.", "B": "추상 클래스 안이라도 `abstract` 키워드 없이 몸체를 생략할 수는 없습니다. 두 메서드 모두 컴파일 에러입니다.", "C": "`calculatePrice`가 `abstract`가 아닌데 몸체가 없어 컴파일 에러입니다. `final` 메서드 `printToy`는 문제가 없습니다.", "D": "`abstract` 메서드는 몸체를 가질 수 없습니다. `{ }`를 붙였으므로 두 메서드 모두 컴파일 에러입니다."}, "concepts": [{"title": "추상 클래스와 추상 메서드 선언 규칙", "body": "추상 메서드는 `abstract` 키워드를 붙이고 몸체 없이 세미콜론으로 끝나야 합니다(`abstract void f();`). 빈 몸체 `{}`라도 붙이면 에러입니다. 반대로 abstract가 아닌 메서드는 반드시 몸체가 있어야 합니다. 추상 메서드가 하나라도 있으면 클래스도 abstract여야 하지만, 추상 클래스가 추상 메서드를 하나도 갖지 않는 것은 허용됩니다. 추상 클래스는 생성자, 필드, static 메서드, final 메서드도 가질 수 있습니다."}, {"title": "abstract와 함께 쓸 수 없는 제어자", "body": "추상 메서드는 하위 클래스가 오버라이딩해서 구현해야 하므로 오버라이딩을 막는 제어자와 함께 쓸 수 없습니다. `abstract final`, `abstract private`, `abstract static`은 모두 컴파일 에러입니다. 클래스에서도 `abstract final class`는 에러입니다(상속 불가능한 추상 클래스는 의미가 없음). `abstract`는 `public`, `protected`, default 접근과는 함께 쓸 수 있습니다."}], "trap": "B와 C처럼 \"추상 클래스 안이니 몸체를 생략해도 된다\"고 착각하거나, D처럼 abstract 메서드에 빈 몸체를 붙여도 된다고 착각하게 만드는 문제입니다.", "tags": ["추상 클래스", "추상 메서드 선언 규칙"], "occurrences": ["surepassexam Q86 p67"], "verified": "compiled", "fixes": ["덤프에서 빠진 \"given the following information\"의 내용(Toy/EduToy/ConsToy 클래스 구성, calculatePrice·printToy 메서드 설명)을 이 문항의 표준 원문대로 복원"], "no": 109}, {"id": 106, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface Downloadable {\n    public void download();\n}\n\ninterface Readable extends Downloadable {        // line n1\n    public void readBook();\n}\n\nabstract class Book implements Readable {        // line n2\n    public void readBook() {\n        System.out.println(\"Read Book\");\n    }\n}\n\nclass EBook extends Book {                       // line n3\n    public void readBook() {\n        System.out.println(\"Read E-Book\");\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "Book book1 = new EBook();\nbook1.readBook();"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails at line n2.", "code": null}, {"key": "B", "text": "Read Book", "code": null}, {"key": "C", "text": "Read E-Book", "code": null}, {"key": "D", "text": "Compilation fails at line n1.", "code": null}, {"key": "E", "text": "Compilation fails at line n3.", "code": null}], "correct": "E", "dumpAnswer": "B", "answerNote": "덤프 정답 B는 틀렸습니다. `Readable`은 `Downloadable`을 상속하므로 `download()`도 구현해야 하는 추상 메서드입니다. `Book`은 abstract라 구현하지 않아도 되지만, 구체 클래스 `EBook`은 `download()`를 구현하지 않았으므로 line n3에서 `EBook is not abstract and does not override abstract method download()` 컴파일 에러가 납니다(javac로 확인). 설령 컴파일되더라도 실제 객체가 `EBook`이므로 출력은 `Read Book`이 아니라 `Read E-Book`이었을 것입니다.", "summary": "EBook은 구체 클래스인데 Downloadable에서 상속된 download()를 구현하지 않았으므로 line n3에서 컴파일이 실패합니다.", "walkthrough": "1. line n1: 인터페이스가 다른 인터페이스를 `extends`하는 것은 합법입니다. `Readable`은 `download()`와 `readBook()` 두 추상 메서드를 갖게 됩니다.\n2. line n2: `Book`은 `readBook()`만 구현하고 `download()`는 구현하지 않았지만 `abstract` 클래스이므로 문제없습니다.\n3. line n3: `EBook`은 `abstract`가 아닌 구체 클래스입니다. 구체 클래스는 상속받은 모든 추상 메서드를 구현해야 하는데, `readBook()`만 오버라이딩하고 `download()`는 아무도 구현하지 않았습니다. 따라서 여기서 컴파일 에러가 납니다.\n4. 클래스 정의가 컴파일되지 않으므로 `book1.readBook()`은 실행되지 않습니다.\n만약 `EBook`에 `public void download() {}`를 추가한다면 동적 바인딩에 따라 `Read E-Book`이 출력됩니다.", "optionNotes": {"A": "추상 클래스는 인터페이스의 메서드 일부만 구현해도 되므로 line n2는 정상입니다.", "B": "컴파일이 되지 않으며, 설령 된다 해도 실제 객체가 `EBook`이므로 오버라이딩된 `Read E-Book`이 출력되어야 합니다.", "C": "`EBook`이 `download()`를 구현했다면 나올 결과지만, 실제로는 line n3에서 컴파일이 실패합니다.", "D": "인터페이스는 다른 인터페이스를 `extends`로 상속할 수 있으므로 line n1은 정상입니다.", "E": "정답입니다. 구체 클래스 `EBook`이 추상 메서드 `download()`를 구현하지 않아 line n3에서 컴파일 에러가 납니다."}, "concepts": [{"title": "추상 메서드 구현 의무", "body": "구체(non-abstract) 클래스는 상위 클래스와 구현한 인터페이스(그리고 그 인터페이스가 상속한 인터페이스)에서 내려온 **모든** 추상 메서드를 구현해야 합니다. 중간의 abstract 클래스는 구현을 미룰 수 있지만, 그 의무는 계층 아래의 첫 구체 클래스로 그대로 넘어갑니다. 문제를 풀 때는 인터페이스 상속 사슬을 따라가며 추상 메서드 목록을 모으고, 구체 클래스까지 내려오는 동안 누가 구현했는지 확인하십시오."}, {"title": "클래스·인터페이스 간 상속 키워드", "body": "- 클래스 -> 클래스: `extends` (하나만)\n- 클래스 -> 인터페이스: `implements` (여러 개 가능)\n- 인터페이스 -> 인터페이스: `extends` (여러 개 가능)\n인터페이스가 클래스를 상속하거나 인터페이스가 다른 인터페이스를 `implements`하는 것은 불가능합니다."}, {"title": "동적 바인딩", "body": "인스턴스 메서드 호출은 참조 변수의 타입이 아니라 실제 객체의 타입에 따라 실행할 메서드가 결정됩니다. `Book book1 = new EBook();`에서 `book1.readBook()`은 `EBook`의 `readBook()`을 실행합니다. 다만 호출 가능 여부(메서드 존재 여부)는 참조 변수 타입으로 컴파일 시점에 검사합니다."}], "trap": "`readBook()`의 오버라이딩에 시선을 끌어 출력 결과를 고르게 하지만, 인터페이스 상속으로 숨어 있는 `download()` 구현 누락이 핵심입니다.", "tags": ["인터페이스 구현", "추상 클래스", "인터페이스 상속"], "occurrences": ["surepassexam Q128 p76"], "verified": "compiled", "fixes": ["코드 조각의 `boook1.readBook();`을 `book1.readBook();`으로 수정"], "no": 110}, {"id": 107, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface Readable {\n    public void readBook();\n    public void setBookMark();\n}\n\nabstract class Book implements Readable {   // line n1\n    public void readBook() { }\n    // line n2\n}\n\nclass EBook extends Book {                  // line n3\n    public void readBook() { }\n    // line n4\n}"}, {"type": "text", "content": "Which two options enable the code to compile? (Choose two.)"}], "options": [{"key": "A", "text": "Replace the code fragment at line n1 with:", "code": "class Book implements Readable {"}, {"key": "B", "text": "At line n2 insert:", "code": "public abstract void setBookMark();"}, {"key": "C", "text": "Replace the code fragment at line n3 with:", "code": "abstract class EBook extends Book {"}, {"key": "D", "text": "At line n4 insert:", "code": "public void setBookMark() { }"}], "correct": "CD", "dumpAnswer": "C", "answerNote": "덤프는 C 하나만 정답으로 표기했지만, D(`EBook`에 `public void setBookMark() { }` 추가)도 javac로 컴파일에 성공합니다. 원래 한 개를 고르는 문항이었으나 C와 D가 모두 조건을 만족하므로 두 개를 고르는 문항으로 고쳤습니다. 시험에서 한 개만 고르라고 나오면 덤프 표기대로 C를 고르십시오.", "summary": "구체 클래스 EBook이 setBookMark()를 구현하지 않아 컴파일에 실패하므로, EBook을 abstract로 만들거나(C) EBook에서 setBookMark()를 구현하면(D) 해결됩니다.", "walkthrough": "원래 코드에서 `Book`은 abstract라 `setBookMark()`를 구현하지 않아도 되지만, 구체 클래스 `EBook`이 이를 구현하지 않아 line n3에서 에러가 납니다. 각 보기를 적용해 컴파일해 보았습니다.\n- A: `Book`을 구체 클래스로 바꾸면 `Book`이 `setBookMark()`를 구현하지 않아 이번에는 `Book`에서 에러입니다.\n- B: `Book`에 `public abstract void setBookMark();`를 다시 선언해도 여전히 추상 메서드이므로 `EBook`의 구현 의무는 그대로이고 에러가 남습니다.\n- C: `EBook`을 abstract로 만들면 구현 의무가 없어져 컴파일에 성공합니다.\n- D: `EBook`에서 `setBookMark()`를 구현하면 모든 추상 메서드가 구현되어 역시 컴파일에 성공합니다.\n따라서 정답은 C와 D입니다.", "optionNotes": {"A": "`Book`이 구체 클래스가 되면 `setBookMark()`를 구현해야 하는데 구현하지 않았으므로 `Book`에서 컴파일 에러입니다.", "B": "abstract 클래스에서 인터페이스 메서드를 abstract로 재선언하는 것은 합법이지만, `EBook`이 여전히 구현하지 않아 에러가 남습니다.", "C": "정답입니다. `EBook`이 abstract가 되면 남은 추상 메서드를 구현할 의무가 없어집니다.", "D": "정답입니다. `EBook`이 `setBookMark()`를 public으로 구현하므로 모든 추상 메서드가 구현되어 컴파일됩니다."}, "concepts": [{"title": "추상 메서드 구현 의무의 전파", "body": "abstract 클래스는 인터페이스의 메서드를 일부만 구현하거나 하나도 구현하지 않아도 됩니다. 남은 추상 메서드는 그 클래스를 상속하는 첫 번째 구체 클래스가 모두 구현해야 합니다. 해결 방법은 (1) 구체 클래스에서 구현하거나 (2) 그 클래스도 abstract로 선언하는 것 두 가지입니다."}, {"title": "인터페이스 메서드 구현 시 접근 제어자", "body": "인터페이스의 추상 메서드는 암묵적으로 `public abstract`입니다. 구현할 때 접근 범위를 좁힐 수 없으므로 반드시 `public`으로 선언해야 합니다.\n```java\nclass EBook extends Book {\n    void setBookMark() { }        // 에러: public보다 좁음\n    public void setBookMark() { } // OK\n}\n```"}], "trap": "중간의 abstract 클래스에 메서드를 다시 abstract로 선언하는 B가 해결책처럼 보이게 합니다. 추상 메서드를 다시 선언해도 구현 의무는 사라지지 않습니다.", "tags": ["추상 클래스", "인터페이스 구현", "추상 메서드 구현 의무"], "occurrences": ["surepassexam Q133 p77"], "verified": "compiled", "fixes": ["C와 D가 모두 javac로 컴파일되므로 문제를 `Which two options enable the code to compile? (Choose two.)`로 바꾸고 정답을 CD로 수정"], "no": 111}, {"id": 111, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Vehicle {\n    String type = \"4W\";\n    int maxSpeed = 100;\n\n    Vehicle(String type, int maxSpeed) {\n        this.type = type;\n        this.maxSpeed = maxSpeed;\n    }\n}\n\nclass Car extends Vehicle {\n    String trans;\n\n    Car(String trans) {          //line n1\n        this.trans = trans;\n    }\n\n    Car(String type, int maxSpeed, String trans) {\n        super(type, maxSpeed);\n        this(trans);             //line n2\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "7. Car c1 = new Car(\"Auto\");\n8. Car c2 = new Car(\"4W\", 150, \"Manual\");\n9. System.out.println(c1.type + \" \" + c1.maxSpeed + \" \" + c1.trans);\n10. System.out.println(c2.type + \" \" + c2.maxSpeed + \" \" + c2.trans);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "4W 100 Auto\n4W 150 Manual"}, {"key": "B", "text": "", "code": "null 0 Auto\n4W 150 Manual"}, {"key": "C", "text": "Compilation fails only at line n1", "code": null}, {"key": "D", "text": "Compilation fails only at line n2", "code": null}, {"key": "E", "text": "Compilation fails at both line n1 and line n2", "code": null}], "correct": "E", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. line n1의 `Car(String)`은 암묵적으로 `super()`를 호출하는데 `Vehicle`에 인자 없는 생성자가 없어 에러이고, line n2의 `this(trans)`는 생성자의 첫 문장이 아니어서(이미 `super(...)`를 호출함) 역시 에러입니다. javac가 두 줄 모두 에러를 보고하므로 정답은 E입니다.", "summary": "n1은 Vehicle에 기본 생성자가 없어 암묵적 super() 호출이 실패하고, n2는 super()와 this()를 한 생성자에서 함께 호출해 실패하므로 두 곳 모두 컴파일 에러입니다.", "walkthrough": "1. `Vehicle`은 `Vehicle(String, int)` 생성자만 명시했으므로 컴파일러가 기본 생성자를 만들어 주지 않습니다.\n2. line n1: `Car(String trans)`의 첫 문장이 `super(...)`나 `this(...)`가 아니므로 컴파일러가 `super();`를 자동 삽입합니다. 그러나 `Vehicle()`이 없어서 `constructor Vehicle in class Vehicle cannot be applied to given types` 에러가 납니다.\n3. line n2: `super(type, maxSpeed);` 다음 줄에 `this(trans);`를 호출합니다. `this(...)`와 `super(...)`는 둘 다 생성자의 첫 문장이어야 하므로 한 생성자에서 둘을 함께 쓸 수 없습니다. javac는 `redundant explicit constructor invocation`(Java 8 컴파일러에서는 `call to this must be first statement in constructor`) 에러를 냅니다.\n4. 두 곳 모두 독립적인 에러이므로 E가 정답입니다.", "optionNotes": {"A": "코드가 컴파일되지 않으므로 출력이 없습니다. `Vehicle`의 필드 초기값과 생성자 인자를 섞은 그럴듯한 출력일 뿐입니다.", "B": "애초에 코드가 컴파일되지 않으므로 출력이 없습니다. 또한 `type`은 `\"4W\"`로 초기화되어 있어 `null`이 될 수도 없습니다.", "C": "line n1만 보고 판단한 답입니다. line n2도 `super(...)` 뒤에 `this(...)`를 호출해 에러이므로 '오직 n1'이 아닙니다.", "D": "line n2만 보고 판단한 답입니다. line n1도 `Vehicle()`이 없어 암묵적 `super()` 호출이 실패합니다.", "E": "정답입니다. n1(기본 생성자 부재)과 n2(this()가 첫 문장이 아님) 모두 컴파일 에러입니다."}, "concepts": [{"title": "생성자 첫 문장 규칙", "body": "모든 생성자의 첫 문장은 `this(...)`(같은 클래스의 다른 생성자 호출) 또는 `super(...)`(상위 클래스 생성자 호출) 중 하나입니다. 둘 다 쓰지 않으면 컴파일러가 `super();`를 자동으로 넣습니다. 둘을 동시에 쓰거나 첫 문장이 아닌 곳에 쓰면 컴파일 에러입니다. `this(...)`로 위임하면 최종적으로 위임받은 생성자가 `super(...)`를 호출하게 됩니다."}, {"title": "기본 생성자가 만들어지지 않는 경우", "body": "클래스에 생성자를 하나도 작성하지 않았을 때만 컴파일러가 인자 없는 기본 생성자를 만들어 줍니다. 인자 있는 생성자를 하나라도 작성하면 기본 생성자는 생기지 않습니다. 이때 하위 클래스 생성자가 명시적으로 `super(인자)`를 호출하지 않으면 자동 삽입된 `super()`가 실패합니다.\n```java\nclass A { A(int x) { } }\nclass B extends A {\n    B() { }          // 에러: A()가 없음\n    B(int x) { super(x); } // OK\n}\n```"}], "trap": "'only'라는 단어로 한 곳만 고르게 유도합니다. 생성자 문제에서는 암묵적 `super()` 실패와 `this()`/`super()` 위치 위반을 각각 따로 확인하십시오.", "tags": ["생성자 체이닝", "super()/this()", "기본 생성자"], "occurrences": ["surepassexam Q146 p81"], "verified": "compiled", "fixes": ["줄바꿈이 사라진 보기 A·B(`4W 100 Auto4W 150 Manual` 등)를 두 줄 코드 블록으로 수정", "보기 B의 `Null`을 Java 출력 형식인 `null`로 수정"], "no": 112}, {"id": 112, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Animal {\n    String type = \"Canine\";\n    int maxSpeed = 60;\n\n    Animal () {}\n\n    Animal (String type, int maxSpeed) {\n        this.type = type;\n        this.maxSpeed = maxSpeed;\n    }\n}\n\nclass WildAnimal extends Animal {\n    String bounds;\n\n    WildAnimal (String bounds) {\n        //line n1\n    }\n\n    WildAnimal (String type, int maxSpeed, String bounds) {\n        //line n2\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "7. WildAnimal wolf = new WildAnimal (\"Long\");\n8. WildAnimal tiger = new WildAnimal (\"Feline\", 80, \"Short\");\n9. System.out.println (wolf.type + \" \" + wolf.maxSpeed + \" \" + wolf.bounds);\n10. System.out.println (tiger.type + \" \" + tiger.maxSpeed + \" \" + tiger.bounds);"}, {"type": "text", "content": "Which two modifications enable the code to print the following output?"}, {"type": "code", "content": "Canine 60 Long\nFeline 80 Short"}], "options": [{"key": "A", "text": "Replace line n1 with:", "code": "super ();\nthis.bounds = bounds;"}, {"key": "B", "text": "Replace line n1 with:", "code": "this.bounds = bounds;\nsuper ();"}, {"key": "C", "text": "Replace line n2 with:", "code": "super (type, maxSpeed);\nthis (bounds);"}, {"key": "D", "text": "Replace line n1 with:", "code": "this (\"Canine\", 60);\nthis.bounds = bounds;"}, {"key": "E", "text": "Replace line n2 with:", "code": "super (type, maxSpeed);\nthis.bounds = bounds;"}], "correct": "AE", "dumpAnswer": "A", "answerNote": "덤프에는 정답이 A 하나만 표기되어 있지만 문제는 두 개를 고르라고 합니다. A(line n1)와 E(line n2)를 함께 적용하면 `Canine 60 Long`, `Feline 80 Short`가 출력되므로(javac로 확인) 정답은 AE입니다.", "summary": "n1에는 super() 후 bounds를 대입(A), n2에는 super(type, maxSpeed) 후 bounds를 대입(E)해야 두 줄이 기대대로 출력됩니다.", "walkthrough": "1. `wolf`는 `new WildAnimal(\"Long\")`이므로 line n1 생성자를 사용합니다. `type`, `maxSpeed`는 `Animal`의 필드 초기값 `\"Canine\"`, `60`이 그대로 유지되어야 하고 `bounds`만 `\"Long\"`이 되어야 합니다.\n- A: `super();`로 `Animal()`을 호출한 뒤 `this.bounds = bounds;`를 대입하므로 `Canine 60 Long`이 됩니다.\n2. `tiger`는 `new WildAnimal(\"Feline\", 80, \"Short\")`이므로 line n2 생성자를 사용합니다.\n- E: `super(type, maxSpeed);`로 상위 필드를 `Feline`, `80`으로 설정하고 `this.bounds = bounds;`로 `Short`를 대입하므로 `Feline 80 Short`가 됩니다.\n3. 나머지 보기는 모두 컴파일 에러입니다(아래 보기별 설명 참고).", "optionNotes": {"A": "정답입니다. `super()`가 첫 문장이고, 이어서 `bounds`를 설정하므로 `Canine 60 Long`이 출력됩니다.", "B": "`super()`가 생성자의 첫 문장이 아니므로 Java 8에서 컴파일 에러입니다.", "C": "한 생성자에서 `super(...)` 다음에 `this(...)`를 호출하므로 컴파일 에러입니다. `this(...)`도 첫 문장이어야 합니다.", "D": "`WildAnimal`에는 `(String, int)` 생성자가 없으므로 `this(\"Canine\", 60)`은 컴파일 에러입니다(`this`는 상위 클래스 생성자가 아니라 같은 클래스 생성자를 호출합니다).", "E": "정답입니다. `super(type, maxSpeed)`로 상위 필드를 설정한 뒤 `bounds`를 대입하므로 `Feline 80 Short`가 출력됩니다."}, "concepts": [{"title": "this(...)와 super(...)의 대상", "body": "`this(...)`는 **같은 클래스**의 다른 생성자를, `super(...)`는 **직계 상위 클래스**의 생성자를 호출합니다. 상위 클래스에 `(String, int)` 생성자가 있어도 하위 클래스에 같은 시그니처의 생성자가 없으면 `this(\"Canine\", 60)`은 실패합니다. 생성자는 상속되지 않는다는 점이 이유입니다."}, {"title": "객체 초기화 순서", "body": "`new`로 하위 클래스 객체를 만들면 (1) 하위 생성자가 호출되고 첫 문장에서 상위 생성자로 올라가며, (2) 상위 클래스의 필드 초기화식과 초기화 블록, 생성자 본문이 실행되고, (3) 하위 클래스의 필드 초기화식, 초기화 블록, 생성자 본문의 나머지가 실행됩니다. 그래서 `super()` 호출 후에도 `Animal`의 필드 초기값 `\"Canine\"`, `60`이 유지됩니다."}], "trap": "D는 상위 클래스의 생성자 시그니처를 `this`로 부르는 실수를, B와 C는 생성자 호출 위치 규칙을 노립니다. 두 생성자에 각각 맞는 보기를 하나씩 골라야 한다는 점도 놓치지 마십시오.", "tags": ["생성자 체이닝", "super()/this()", "기본 생성자"], "occurrences": ["surepassexam Q150 p82"], "verified": "compiled", "fixes": ["잘린 두 번째 생성자 헤더 `WildAnimal (String type, int maxSpeed,`를 `WildAnimal (String type, int maxSpeed, String bounds) {`로 복원", "첫 번째 생성자의 닫는 중괄호 들여쓰기 정리", "코드 조각 10행의 `Sytem`을 `System`으로, 빠진 `)`를 추가하고 9·10행의 끊긴 줄을 한 줄로 합침", "보기 D의 `this.bounds = bounds` 뒤에 빠진 `;` 추가(D는 여전히 컴파일 실패)"], "no": 113}, {"id": 125, "topic": "inheritance", "parts": [{"type": "text", "content": "Given the following class declarations:"}, {"type": "code", "content": "abstract class Animal {}\ninterface Hunter {}\nclass Cat extends Animal implements Hunter {}\nclass Tiger extends Cat {}"}, {"type": "text", "content": "Which answer fails to compile?"}], "options": [{"key": "A", "text": "", "code": "ArrayList<Animal> myList = new ArrayList<>();\nmyList.add(new Tiger());"}, {"key": "B", "text": "", "code": "ArrayList<Hunter> myList = new ArrayList<>();\nmyList.add(new Cat());"}, {"key": "C", "text": "", "code": "ArrayList<Hunter> myList = new ArrayList<>();\nmyList.add(new Tiger());"}, {"key": "D", "text": "", "code": "ArrayList<Tiger> myList = new ArrayList<>();\nmyList.add(new Cat());"}, {"key": "E", "text": "", "code": "ArrayList<Animal> myList = new ArrayList<>();\nmyList.add(new Cat());"}], "correct": "D", "dumpAnswer": "E", "answerNote": "덤프 정답 E는 틀렸습니다. 덤프의 보기 E에는 `ArrayLIst`라는 인쇄 오타가 있었는데, 이를 실패 이유로 보면 D와 E가 둘 다 실패해 '하나를 고르라'는 조건과 맞지 않습니다. 오타를 바로잡으면 Cat은 Animal이므로 E는 컴파일되고, 실패하는 것은 D(Cat은 Tiger가 아님)뿐입니다. 각 보기를 실제로 컴파일해 확인했습니다.", "summary": "`ArrayList<Tiger>`에는 Tiger(와 그 하위 타입)만 넣을 수 있고, 상위 클래스인 Cat 객체는 넣을 수 없습니다.", "walkthrough": "클래스 계층은 다음과 같습니다.\n```java\nabstract class Animal {}\ninterface Hunter {}\nclass Cat extends Animal implements Hunter {}\nclass Tiger extends Cat {}\n```\n1. `List<T>.add(E e)`에는 T 타입 또는 T의 하위 타입 객체를 넣을 수 있습니다.\n2. Tiger는 Cat, Animal, Hunter 모두에 IS-A 관계입니다. Cat은 Animal과 Hunter에 IS-A이지만 Tiger는 아닙니다.\n3. A: Tiger는 Animal → OK. B: Cat은 Hunter를 구현 → OK. C: Tiger는 Cat을 통해 Hunter 구현 → OK. E: Cat은 Animal → OK.\n4. D: `ArrayList<Tiger>`에 Cat을 넣으려면 Cat→Tiger 변환이 필요한데, 상위→하위는 자동 변환되지 않으므로 `incompatible types: Cat cannot be converted to Tiger` 컴파일 에러가 납니다.", "optionNotes": {"A": "Tiger는 Cat을 거쳐 Animal을 상속하므로 `ArrayList<Animal>`에 추가할 수 있습니다. 컴파일됩니다.", "B": "Cat은 Hunter를 구현하므로 `ArrayList<Hunter>`에 추가할 수 있습니다. 인터페이스 타입을 제네릭 타입 인자로 써도 됩니다.", "C": "Tiger는 Cat의 하위 클래스이므로 Hunter 구현을 물려받습니다. 컴파일됩니다.", "D": "정답입니다. Cat은 Tiger의 상위 클래스이므로 `ArrayList<Tiger>.add(Cat)`은 컴파일 에러입니다.", "E": "Cat은 Animal의 하위 클래스이므로 `ArrayList<Animal>`에 추가할 수 있어 컴파일됩니다. 덤프 정답이지만 틀립니다."}, "concepts": [{"title": "제네릭 컬렉션에 넣을 수 있는 타입", "body": "`List<T>`의 `add`는 매개변수 타입이 T이므로, T에 대입 가능한(T 자신 또는 하위 클래스/구현 클래스) 객체만 넣을 수 있습니다. 상위 타입 객체를 넣으려면 명시적 캐스팅이 필요하고, 실제 객체가 그 타입이 아니면 런타임에 ClassCastException이 납니다. 인터페이스나 추상 클래스도 타입 인자로 쓸 수 있습니다(인스턴스를 만들 수 없을 뿐입니다)."}, {"title": "제네릭은 공변이 아니다", "body": "Tiger가 Animal의 하위 타입이어도 `ArrayList<Tiger>`는 `ArrayList<Animal>`의 하위 타입이 아닙니다. `ArrayList<Animal> l = new ArrayList<Tiger>();`는 컴파일 에러입니다. 다이아몬드 `new ArrayList<>()`는 왼쪽 선언의 타입 인자를 그대로 추론합니다.\n```java\nList<Animal> a = new ArrayList<>();      // OK, ArrayList<Animal>\n// List<Animal> b = new ArrayList<Tiger>(); // 컴파일 에러\nAnimal[] arr = new Tiger[1];             // 배열은 공변이라 OK\n```"}], "trap": "상속 방향을 거꾸로 생각해 '고양이과니까 Cat도 Tiger 리스트에 들어간다'고 착각하게 만듭니다. 하위 타입은 상위 타입 자리에 들어가지만 반대는 안 됩니다.", "tags": ["제네릭 타입 호환", "상속과 인터페이스 IS-A", "다이아몬드 연산자"], "occurrences": ["surepassexam Q201 p92"], "verified": "compiled", "fixes": ["덤프에서 빠진 클래스 선언(`abstract class Animal`, `interface Hunter`, `class Cat extends Animal implements Hunter`, `class Tiger extends Cat`)을 다른 출처의 원문대로 보충", "보기 E의 `ArrayLIst`(대문자 I)를 `ArrayList`로 수정"], "no": 114}, {"id": 153, "topic": "inheritance", "parts": [{"type": "text", "content": "Given this segment of code:"}, {"type": "code", "content": "ArrayList<Cycle> myList = new ArrayList<>();\nmyList.add(new MotorCycle());"}, {"type": "text", "content": "Which two statements, if either were true, would make the code compile? (Choose two.)"}], "options": [{"key": "A", "text": "MotorCycle is an interface that implements the Cycle class.", "code": null}, {"key": "B", "text": "Cycle is an interface that is implemented by the MotorCycle class.", "code": null}, {"key": "C", "text": "Cycle is an abstract superclass of MotorCycle.", "code": null}, {"key": "D", "text": "Cycle and MotorCycle both extend the Transportation superclass.", "code": null}, {"key": "E", "text": "Cycle and MotorCycle both implement the Transportation interface.", "code": null}, {"key": "F", "text": "MotorCycle is a superclass of Cycle.", "code": null}], "correct": "BC", "dumpAnswer": "BC", "answerNote": "", "summary": "`ArrayList<Cycle>`에 `MotorCycle`을 넣으려면 `MotorCycle`이 `Cycle`의 하위 타입(IS-A Cycle)이어야 하므로, Cycle이 인터페이스이거나(B) 상위 클래스(C)인 경우만 컴파일됩니다.", "walkthrough": "1. `myList.add(...)`의 매개변수 타입은 `Cycle`입니다. 따라서 `new MotorCycle()`이 `Cycle` 타입으로 대입될 수 있어야 합니다. 즉 `MotorCycle IS-A Cycle`이 성립해야 합니다.\n2. B: `class MotorCycle implements Cycle` → `MotorCycle`은 `Cycle` 타입이므로 컴파일됩니다.\n3. C: `abstract class Cycle`, `class MotorCycle extends Cycle` → 하위 클래스이므로 컴파일됩니다. 추상 클래스는 인스턴스를 만들 수 없을 뿐 타입 인자, 참조 타입으로는 쓸 수 있습니다.\n4. D, E: 둘이 같은 부모를 공유할 뿐 서로는 형제 관계이므로 `MotorCycle`을 `Cycle`로 변환할 수 없습니다. 실제로 형제 클래스로 테스트하면 `MotorCycle3 cannot be converted to Cycle3` 에러가 납니다.\n5. F: 방향이 반대라서 `Cycle IS-A MotorCycle`이 되므로 `MotorCycle`을 `Cycle` 자리에 넣을 수 없습니다.", "optionNotes": {"A": "인터페이스는 클래스를 implements할 수 없습니다(인터페이스는 인터페이스만 `extends`). 전제가 Java 문법상 불가능합니다.", "B": "정답입니다. 인터페이스를 구현한 클래스는 그 인터페이스 타입이므로 `Cycle` 리스트에 넣을 수 있습니다.", "C": "정답입니다. `MotorCycle extends Cycle`이면 업캐스팅이 자동으로 일어나므로 컴파일됩니다.", "D": "`Cycle`과 `MotorCycle`이 형제 클래스일 뿐이므로 `MotorCycle`은 `Cycle`이 아닙니다. `incompatible types` 컴파일 에러가 납니다.", "E": "같은 인터페이스를 구현해도 서로 타입 관계가 생기지 않습니다. `List<Transportation>`이었다면 가능했겠지만 `List<Cycle>`에는 넣을 수 없습니다.", "F": "`MotorCycle`이 부모이면 `Cycle`이 `MotorCycle`의 하위 타입이 됩니다. 부모 객체를 자식 타입 자리에 넣을 수는 없습니다."}, "concepts": [{"title": "IS-A 관계와 대입 호환성", "body": "참조형 대입 `Parent p = new Child();`는 `Child`가 `Parent`를 `extends`(클래스)하거나 `implements`(인터페이스)할 때, 즉 상속 계층에서 위쪽 타입으로 갈 때만 자동으로 됩니다. 공통 부모를 공유하는 형제 타입끼리는 대입할 수도, 캐스팅할 수도 없습니다. 형제 클래스 간 캐스트는 컴파일 에러입니다. 메서드 인자도 같은 규칙을 따르므로 `List<Cycle>.add()`에는 `Cycle`의 하위 타입이면 무엇이든 넣을 수 있습니다."}, {"title": "클래스/인터페이스 상속 키워드 규칙", "body": "- 클래스 `extends` 클래스(하나만)\n- 클래스 `implements` 인터페이스(여러 개 가능)\n- 인터페이스 `extends` 인터페이스(여러 개 가능)\n- 인터페이스는 클래스를 상속하거나 구현할 수 없습니다.\n추상 클래스와 인터페이스는 `new`로 인스턴스를 만들 수 없지만, 변수 타입이나 제네릭 타입 인자로는 얼마든지 쓸 수 있습니다."}], "trap": "D, E처럼 \"같은 부모를 공유한다\"는 보기로 형제 관계도 호환된다고 착각하게 만들고, A처럼 문법상 불가능한 관계를 그럴듯하게 섞어 둡니다.", "tags": ["다형성", "IS-A 관계", "제네릭 타입 호환"], "occurrences": ["certleader-B Q81 p114"], "verified": "compiled", "fixes": [], "no": 115}, {"id": 158, "topic": "inheritance", "parts": [{"type": "text", "content": "You are asked to develop a program for a shopping application, and you are given this information:"}, {"type": "text", "content": "- The application must contain the classes Toy, EduToy, and ConsToy. The Toy class is the superclass of the other two classes.\n- The int calculatePrice (Toy t) method calculates the price of a toy.\n- The void printToy (Toy t) method prints the details of a toy."}, {"type": "text", "content": "Which definition of the Toy class adds a valid layer of abstraction to the class hierarchy?"}], "options": [{"key": "A", "text": "", "code": "public abstract class Toy{\n    public abstract int calculatePrice(Toy t);\n    public void printToy(Toy t) { /* code goes here */ }\n}"}, {"key": "B", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t) ;\n    public void printToy(Toy t) ;\n}"}, {"key": "C", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t);\n    public final void printToy(Toy t){ /* code goes here */ }\n}"}, {"key": "D", "text": "", "code": "public abstract class Toy {\n    public abstract int calculatePrice(Toy t) { /* code goes here */ }\n    public abstract void printToy(Toy t) { /* code goes here */ }\n}"}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "추상 메서드는 `abstract` 키워드가 있고 본문이 없어야 하며, 일반 메서드는 본문이 있어야 합니다. 이 규칙을 지킨 것은 A뿐입니다.", "walkthrough": "네 보기를 각각 `Toy.java`로 컴파일해 확인했습니다.\n- A: `calculatePrice`는 `abstract` + 세미콜론(본문 없음), `printToy`는 본문이 있는 일반 메서드입니다 → 컴파일 성공. 하위 클래스 `EduToy`, `ConsToy`는 가격 계산만 각자 구현하고 출력 로직은 물려받을 수 있어, 계층에 의미 있는 추상화 층이 생깁니다.\n- B: 두 메서드 모두 본문이 없는데 `abstract`가 없습니다 → \"missing a method body, or should be declared abstract\" 에러가 2개 납니다.\n- C: `calculatePrice`가 본문 없이 `abstract`도 없습니다 → 같은 에러입니다. `final printToy`는 그 자체로는 문제없습니다.\n- D: `abstract` 메서드에 `{ }` 본문이 있습니다 → \"abstract methods cannot have a body\" 에러가 납니다. 주석만 있는 빈 블록도 본문으로 취급됩니다.", "optionNotes": {"A": "정답입니다. 추상 메서드와 구현 메서드를 올바르게 섞은 합법적인 추상 클래스입니다.", "B": "`abstract` 없이 본문을 생략하면 컴파일 에러입니다. 클래스가 `abstract`라고 해서 메서드가 자동으로 abstract가 되지는 않습니다(인터페이스와 다른 점).", "C": "`calculatePrice`가 본문도 `abstract`도 없어 컴파일 에러입니다.", "D": "`abstract` 메서드는 본문을 가질 수 없습니다. 비어 있는 `{ }`도 본문이므로 컴파일 에러입니다."}, "concepts": [{"title": "abstract 클래스와 메서드 규칙", "body": "- `abstract` 메서드는 본문 없이 `;`로 끝나야 하고, `abstract` 메서드가 하나라도 있으면 클래스도 `abstract`여야 합니다.\n- `abstract` 클래스에는 추상 메서드가 하나도 없어도 되고, 생성자, 필드, 구현 메서드를 가질 수 있습니다.\n- `abstract`는 `final`, `private`, `static`과 함께 쓸 수 없습니다(오버라이딩이 불가능해지기 때문).\n- 추상 클래스를 상속한 구체 클래스는 모든 추상 메서드를 구현해야 하고, 그렇지 않으면 그 클래스도 `abstract`로 선언해야 합니다."}, {"title": "인터페이스와의 차이", "body": "인터페이스에서는 본문 없는 메서드가 암묵적으로 `public abstract`이므로 `int calculatePrice(Toy t);`만 써도 됩니다. Java 8부터는 `default`, `static` 메서드에 본문을 둘 수 있습니다. 반면 추상 클래스에서는 `abstract`를 반드시 명시해야 합니다. 시험에서는 B처럼 인터페이스 문법을 추상 클래스에 그대로 쓴 보기를 자주 냅니다."}], "trap": "B처럼 인터페이스 스타일의 메서드 선언을 추상 클래스에 쓰면 된다고 착각하게 만들고, D처럼 주석만 든 `{ }`는 본문이 아니라고 생각하게 만듭니다.", "tags": ["abstract 클래스", "abstract 메서드 규칙", "final 메서드"], "occurrences": ["certleader-C Q5 p141"], "verified": "compiled", "fixes": [], "no": 116}, {"id": "X5", "topic": "inheritance", "tags": ["super() 호출", "생성자 체이닝", "기본 생성자"], "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class CD {\n    int r;\n    CD(int r){\n        this.r=r;\n    }\n}\n\nclass DVD extends CD {\n    int c;\n    DVD(int r, int c) {\n        // line n1\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "DVD dvd = new DVD(10,20);"}, {"type": "text", "content": "Which code fragment should you use at line n1 to instantiate the dvd object successfully?"}], "options": [{"key": "A", "text": "", "code": "super.r = r;\nthis.c = c;"}, {"key": "B", "text": "", "code": "super(r);\nthis(c);"}, {"key": "C", "text": "", "code": "super(r);\nthis.c = c;"}, {"key": "D", "text": "", "code": "this.c = r;\nsuper(c);"}], "choose": 1, "correct": "C", "dumpAnswersAll": ["C"], "answerNote": "", "verified": "compiled", "summary": "`CD`에는 `CD(int)` 생성자만 있으므로 `DVD` 생성자는 첫 문장에서 반드시 `super(r)`를 명시적으로 호출해야 합니다.", "walkthrough": "1. `CD`는 `CD(int r)` 생성자를 직접 선언했으므로 컴파일러가 기본 생성자 `CD()`를 만들어 주지 않습니다.\n2. 서브클래스 생성자의 첫 문장이 `super(...)`나 `this(...)`가 아니면 컴파일러가 `super();`를 자동으로 넣습니다.\n3. A를 넣으면 첫 문장이 `super.r = r;`(일반 대입문)이므로 `super();`가 자동 삽입되는데, `CD()`가 없어서 컴파일 오류가 납니다.\n4. B는 `super(r);` 다음 줄에 `this(c);`를 둡니다. `super()`/`this()`는 생성자의 첫 문장에만 올 수 있고 둘을 함께 쓸 수도 없습니다. 게다가 `DVD(int)` 생성자도 없습니다.\n5. D는 `super(c);`가 두 번째 문장이라 Java 8에서 \"call to super must be first statement\" 오류가 납니다.\n6. C는 첫 문장에서 `super(r)`로 `CD(int)`를 호출해 `r = 10`을 설정하고, 이어서 `this.c = c`로 `c = 20`을 저장합니다. 컴파일·실행 모두 성공하므로 C가 정답입니다.", "optionNotes": {"A": "첫 문장이 `super(...)`가 아니므로 컴파일러가 `super();`를 넣는데, `CD`에는 인자 없는 생성자가 없어 컴파일 오류가 납니다.", "B": "`this(c)`가 두 번째 문장이라 불법이고, `super()`와 `this()`는 한 생성자에서 함께 쓸 수 없습니다. `DVD(int)` 생성자도 존재하지 않습니다.", "C": "정답입니다. 첫 문장에서 `super(r)`로 부모 생성자를 호출한 뒤 자신의 필드 `c`를 초기화합니다.", "D": "`super(c)`가 첫 문장이 아니므로 Java 8에서는 컴파일 오류입니다."}, "concepts": [{"title": "생성자 첫 문장 규칙과 super()", "body": "모든 생성자의 첫 문장은 `this(...)` 또는 `super(...)` 중 하나이며, 둘 다 없으면 컴파일러가 `super();`를 자동으로 삽입합니다.\n\n- `this(...)`와 `super(...)`는 첫 문장에만 올 수 있고, 한 생성자에서 둘 중 하나만 쓸 수 있습니다.\n- 부모 클래스에 인자 없는 생성자가 없으면, 자식 생성자는 반드시 `super(인자)`를 명시해야 합니다. 그렇지 않으면 자동 삽입된 `super();` 때문에 컴파일 오류가 납니다.\n- 생성자를 하나라도 직접 선언하면 컴파일러는 기본 생성자를 만들어 주지 않습니다."}, {"title": "super.필드 와 super() 의 차이", "body": "`super.r`은 부모로부터 물려받은 멤버에 접근하는 표현식일 뿐, 부모 생성자를 호출하지 않습니다. 부모 생성자 호출은 오직 `super(...)` 형태로만 가능합니다. 그래서 `super.r = r;`로 값을 넣어도 부모 객체 초기화(생성자 호출) 문제는 해결되지 않습니다."}], "trap": "`super.r = r;`로 부모 필드에 값을 넣으면 충분해 보이게 만드는 함정입니다. 부모에 기본 생성자가 없으면 반드시 첫 줄에서 `super(r)`를 호출해야 합니다.", "fixes": [], "occurrences": ["gratisexam-VCE (f10) Q9", "gratisexam-VCE (f11) Q9", "gratisexam-VCE (f12) Q6", "gratisexam-VCE (f15) Q9", "gratisexam-VCE (f20) Q9", "gratisexam-VCE (f8) Q9", "gratisexam-VCE (f9) Q6", "passleader-300q (f2) Q13", "passleader-300q (f2) Q181", "passleader-300q (f2) Q59", "passleader-300q (f2) Q9", "scanned (f3) Q11"], "added": true, "dumpAnswer": "C", "no": 117}, {"id": 27, "topic": "exceptions", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int ans;\n    try {\n        int num = 10;\n        int div = 0;\n        ans = num / div;\n    } catch (ArithmeticException ae) {\n        ans = 0;                                // line n1\n    } catch (Exception e) {\n        System.out.println(\"Invalid calculation\");\n    }\n    System.out.println(\"Answer = \" + ans);   // line n2\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Answer = 0", "code": null}, {"key": "B", "text": "Invalid calculation", "code": null}, {"key": "C", "text": "Compilation fails only at line n1.", "code": null}, {"key": "D", "text": "Compilation fails only at line n2.", "code": null}, {"key": "E", "text": "Compilation fails at line n1 and line n2.", "code": null}], "correct": "D", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. line n1의 `ans = 0;`은 문제없는 대입문입니다. 에러는 `catch (Exception e)` 경로에서 ans에 값이 대입되지 않아 line n2에서 `variable ans might not have been initialized`가 나는 것입니다. 덤프 해설의 IDE 화면도 에러 표시가 println 줄(line n2)에 있으므로 정답은 D입니다. 실제 컴파일로 확인했습니다.", "summary": "두 번째 catch 블록에서는 ans에 값이 대입되지 않으므로, 컴파일러는 line n2의 ans가 확정 할당되지 않았다고 보고 컴파일 에러를 냅니다.", "walkthrough": "1. `int ans;`는 지역 변수라서 기본값이 없습니다.\n2. 컴파일러는 실제 실행값(div = 0)이 아니라 **가능한 모든 경로**를 보고 ans가 반드시 대입되는지 판단합니다.\n3. try 블록이 정상 종료하면 `ans = num / div;`가 실행되어 대입됩니다.\n4. ArithmeticException 경로에서는 line n1의 `ans = 0;`으로 대입됩니다.\n5. 하지만 `catch (Exception e)` 경로에서는 메시지만 출력하고 ans에 대입하지 않습니다. 컴파일러는 try 블록 안에서 다른 예외가 날 수 있다고 보기 때문에 이 경로를 무시하지 않습니다.\n6. 따라서 line n2에서 ans는 확정 할당되지 않은 상태이고, `variable ans might not have been initialized` 에러가 납니다.\n7. line n1 자체에는 아무 문제가 없으므로 에러는 line n2 하나뿐입니다.", "optionNotes": {"A": "실행된다면 ArithmeticException 경로를 거쳐 `Answer = 0`이 나오겠지만, ans의 확정 할당 문제로 컴파일되지 않습니다.", "B": "실제로 발생하는 예외는 ArithmeticException이므로 실행되더라도 이 메시지는 나오지 않습니다. 애초에 컴파일되지도 않습니다.", "C": "line n1의 `ans = 0;`은 이미 선언된 int 변수에 값을 대입하는 정상 문장이라 에러가 없습니다.", "D": "정답입니다. `catch (Exception e)` 경로에서 ans가 대입되지 않으므로 line n2에서만 컴파일 에러가 납니다.", "E": "line n1에는 에러가 없으므로 두 곳 모두라는 설명은 틀렸습니다."}, "concepts": [{"title": "확정 할당(definite assignment)", "body": "지역 변수는 읽기 전에 모든 실행 경로에서 값이 대입되었다는 것을 컴파일러가 증명할 수 있어야 합니다. 컴파일러는 상수 조건(`if (true)`, `while (true)`)을 빼고는 변수의 실제 값을 추적하지 않습니다. 그래서 `int x; if (flag) x = 1; System.out.println(x);`는 flag가 늘 true여도 에러입니다. 해결하려면 선언할 때 초기화하거나 모든 분기(else, 모든 catch)에서 대입해야 합니다."}, {"title": "try-catch에서의 확정 할당", "body": "try 블록 안의 대입은 예외 때문에 실행되지 않았을 수도 있다고 간주됩니다. 그래서 try 다음 코드에서 변수를 쓰려면 모든 catch 블록에서도 대입하거나, catch에서 return이나 throw로 빠져나가야 합니다. 예를 들어 두 번째 catch 끝에 `return;`을 넣거나 `ans = -1;`을 넣으면 이 코드는 컴파일됩니다. finally에서 대입하는 방법도 있습니다."}], "trap": "0으로 나누기 때문에 'ArithmeticException 경로 → Answer = 0'이라고 실행 흐름만 따라가게 만듭니다. 컴파일러는 실행값이 아니라 모든 가능한 경로를 검사한다는 점이 핵심입니다.", "tags": ["지역 변수 확정 할당", "try-catch 흐름"], "occurrences": ["2passeasy Q1 p16", "exambible Q2 p25"], "verified": "compiled", "fixes": ["보기 E의 `line2`를 `line n2`로 수정"], "no": 118}, {"id": 35, "topic": "exceptions", "parts": [{"type": "text", "content": "Which three are advantages of the Java exception mechanism? (Choose three.)"}], "options": [{"key": "A", "text": "Improves the program structure because the error handling code is separated from the normal program function", "code": null}, {"key": "B", "text": "Provides a set of standard exceptions that covers all possible errors", "code": null}, {"key": "C", "text": "Improves the program structure because the programmer can choose where to handle exceptions", "code": null}, {"key": "D", "text": "Improves the program structure because exceptions must be handled in the method in which they occurred", "code": null}, {"key": "E", "text": "Allows the creation of new exceptions that are customized to the particular program being created", "code": null}], "correct": "ACE", "dumpAnswer": "ACE", "answerNote": "", "summary": "예외 메커니즘은 정상 로직과 오류 처리 코드를 분리하고, 처리 위치를 선택할 수 있게 하며, 사용자 정의 예외를 만들 수 있게 합니다.", "walkthrough": "Java 예외 메커니즘의 장점을 하나씩 보면 다음과 같습니다.\n- try 블록에는 정상 흐름을, catch 블록에는 오류 처리를 두어 코드가 분리됩니다(A).\n- 예외는 호출 스택을 따라 전파되므로, 직접 처리하거나 `throws`로 호출자에게 넘겨 원하는 곳에서 처리할 수 있습니다(C).\n- `Exception`이나 `RuntimeException`을 상속해 프로그램에 맞는 예외 클래스를 만들 수 있습니다(E).\n- 표준 예외가 모든 오류를 다룰 수는 없기 때문에 E가 존재합니다(B 거짓).\n- 예외가 발생한 메서드에서 반드시 처리해야 한다는 규칙은 없습니다(D 거짓).", "optionNotes": {"A": "정답입니다. try/catch로 정상 처리 코드와 오류 처리 코드가 분리되어 구조가 명확해집니다.", "B": "표준 예외 클래스가 많긴 하지만 모든 오류를 다루지는 못합니다. 그래서 사용자 정의 예외를 만들 수 있게 되어 있습니다.", "C": "정답입니다. 예외는 호출 스택을 따라 전파되므로 프로그래머가 처리할 위치를 고를 수 있습니다.", "D": "거짓입니다. 메서드는 `throws`로 예외를 호출자에게 넘길 수 있으므로 발생한 곳에서 꼭 처리할 필요가 없습니다.", "E": "정답입니다. Exception 계열 클래스를 상속해 도메인에 맞는 예외를 정의할 수 있습니다."}, "concepts": [{"title": "예외 전파와 handle-or-declare 규칙", "body": "checked 예외(Exception 중 RuntimeException 계열이 아닌 것)는 메서드 안에서 try/catch로 처리하거나 `throws`로 선언해야 합니다. unchecked 예외(RuntimeException, Error 계열)는 둘 다 하지 않아도 됩니다. 처리되지 않은 예외는 호출 스택을 거슬러 올라가며, main까지 처리되지 않으면 스택 트레이스를 출력하고 스레드가 종료됩니다."}, {"title": "사용자 정의 예외", "body": "`class InsufficientFundsException extends Exception { ... }`처럼 Exception을 상속하면 checked 예외, RuntimeException을 상속하면 unchecked 예외가 됩니다. 보통 메시지를 받는 생성자를 두고 `super(message)`를 호출합니다."}], "trap": "D는 '구조를 개선한다'는 그럴듯한 앞부분에 '발생한 메서드에서 꼭 처리해야 한다'는 틀린 규칙을 붙인 문장입니다.", "tags": ["예외 처리 장점", "사용자 정의 예외"], "occurrences": ["2passeasy Q14 p21"], "verified": "reasoned", "fixes": [], "no": 119}, {"id": 55, "topic": "exceptions", "parts": [{"type": "text", "content": "Which two statements are true? (Choose two.)"}], "options": [{"key": "A", "text": "Error class is unextendable.", "code": null}, {"key": "B", "text": "Error class is extendable.", "code": null}, {"key": "C", "text": "Error is a RuntimeException.", "code": null}, {"key": "D", "text": "Error is an Exception.", "code": null}, {"key": "E", "text": "Error is a Throwable.", "code": null}], "correct": "BE", "dumpAnswer": "BC", "answerNote": "덤프 정답 BC는 틀렸습니다. `java.lang.Error`는 `Throwable`을 직접 상속하며 `RuntimeException`(또는 `Exception`)의 하위 클래스가 아닙니다. 따라서 C는 거짓이고 E가 참입니다. 확인 코드에서 `Error.class.getSuperclass()`는 `java.lang.Throwable`이고, `Error`는 final이 아니라 `class MyError extends Error {}`가 컴파일되었습니다.", "summary": "`Error`는 final이 아니라 상속할 수 있고(B), `Throwable`의 직접 하위 클래스입니다(E).", "walkthrough": "예외 계층은 다음과 같습니다.\n```\nObject\n └─ Throwable\n     ├─ Error            (OutOfMemoryError, StackOverflowError ...)\n     └─ Exception        (IOException ...)\n         └─ RuntimeException (NullPointerException ...)\n```\n- `Error`는 `public class Error extends Throwable`로 선언되어 있고 `final`이 아니므로 `class MyError extends Error {}`처럼 상속할 수 있습니다. 그래서 B가 참이고 A는 거짓입니다. 실제로 컴파일하면 문제없이 됩니다.\n- `Error`의 부모는 `Throwable`이므로 \"Error is a Throwable\"(E)은 참입니다.\n- `Error`는 `Exception` 계열과 형제 관계일 뿐이므로 `Exception`도 `RuntimeException`도 아닙니다. 그래서 C와 D는 거짓입니다.\n`Error`와 `RuntimeException`은 둘 다 unchecked라는 공통점이 있어서 C를 고르기 쉽지만, 상속 관계는 전혀 다릅니다.", "optionNotes": {"A": "`Error`는 final 클래스가 아니므로 상속할 수 있습니다. 실제로 `extends Error`가 컴파일됩니다.", "B": "정답입니다. `Error`는 final이 아닌 일반 public 클래스이므로 사용자 정의 Error를 만들 수 있습니다.", "C": "`Error`는 `Throwable`의 직접 하위 클래스이고 `RuntimeException` 계층에 속하지 않습니다. unchecked라는 점만 같습니다(덤프 정답이지만 오답).", "D": "`Error`와 `Exception`은 둘 다 `Throwable`의 하위 클래스인 형제 관계이므로 Error는 Exception이 아닙니다. `catch (Exception e)`로는 Error를 잡을 수 없습니다.", "E": "정답입니다. `Error extends Throwable`이므로 is-a 관계가 성립하고 `throw`/`catch (Throwable t)`의 대상이 됩니다."}, "concepts": [{"title": "Throwable 계층과 checked/unchecked 구분", "body": "`Throwable`의 직접 하위 클래스는 `Error`와 `Exception` 두 개입니다. `RuntimeException`과 그 하위 클래스, 그리고 `Error`와 그 하위 클래스는 **unchecked**라서 throws 선언이나 catch를 강제하지 않습니다. 나머지 `Exception` 계열(예: `IOException`, `SQLException`)은 **checked**라서 반드시 처리하거나 선언해야 합니다. `catch (Exception e)`는 RuntimeException까지 잡지만 Error는 잡지 못하고, Error까지 잡으려면 `catch (Throwable t)`가 필요합니다."}, {"title": "시험에 나오는 대표 Error", "body": "`StackOverflowError`는 무한 재귀 같은 깊은 호출로 스택이 넘칠 때, `OutOfMemoryError`는 힙이 부족할 때, `ExceptionInInitializerError`는 static 초기화 중 예외가 발생할 때, `NoClassDefFoundError`는 실행 시 클래스를 찾지 못할 때 JVM이 던집니다. 모두 `Error`의 하위 클래스이며, 일반적으로 애플리케이션이 복구하리라고 기대하지 않는 심각한 문제입니다. 그래도 문법상 catch하는 것은 가능합니다."}], "trap": "Error와 RuntimeException이 모두 unchecked라는 공통점을 이용해, Error가 RuntimeException의 하위 클래스라고 착각하게 만듭니다.", "tags": ["예외 계층 구조", "Error", "Throwable"], "occurrences": ["exambible Q42 p34", "surepassexam Q94 p68", "certleader-B Q83 p114", "certleader-C Q67 p153", "certleader-D Q20 p177"], "verified": "compiled", "fixes": [], "no": 120}, {"id": 110, "topic": "exceptions", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "1. class X {\n2.     public void printFileContent() {\n3.         /* code goes here */\n4.         throw new IOException();\n5.     }\n6. }\n7. public class Test {\n8.     public static void main(String[] args) {\n9.         X xobj = new X();\n10.        xobj.printFileContent();\n11.    }\n12. }"}, {"type": "text", "content": "Which two modifications should you make so that the code compiles successfully?"}], "options": [{"key": "A", "text": "Replace line 8 with:", "code": "public static void main(String[] args) throws Exception {"}, {"key": "B", "text": "Replace line 10 with:", "code": "try {\n    xobj.printFileContent();\n}\ncatch(Exception e) { }\ncatch(IOException e) { }"}, {"key": "C", "text": "Replace line 2 with:", "code": "public void printFileContent() throws IOException {"}, {"key": "D", "text": "Replace line 4 with:", "code": "throw IOException(\"Exception raised\");"}, {"key": "E", "text": "At line 11, insert:", "code": "throw new IOException();"}], "correct": "AC", "dumpAnswer": "AC", "answerNote": "", "summary": "IOException은 checked 예외이므로 printFileContent에 throws IOException을 선언하고(C), 호출하는 main도 throws Exception으로 선언해야(A) 컴파일됩니다.", "walkthrough": "(코드 조각에 `import java.io.IOException;`이 없으므로 import는 있다고 가정하고 테스트했습니다.)\n1. 원래 코드는 line 4에서 checked 예외인 `IOException`을 던지는데 잡지도 선언하지도 않아 `unreported exception IOException` 에러입니다.\n2. C를 적용하면 `printFileContent()`에 `throws IOException`이 선언되어 line 4가 해결됩니다.\n3. 그러면 이번에는 line 10의 호출부가 checked 예외를 처리해야 합니다. A로 `main`에 `throws Exception`을 선언하면 `IOException`도 포함되므로 해결됩니다.\n4. A와 C를 함께 적용하면 컴파일에 성공합니다(javac로 확인).\n- B는 `catch(Exception)` 뒤에 `catch(IOException)`이 와서 `exception IOException has already been caught` 에러입니다.\n- D는 `new`가 없어 `IOException(...)`을 메서드 호출로 해석해 `cannot find symbol` 에러입니다.\n- E는 `main`에서 또 다른 checked 예외를 던질 뿐 line 4 문제는 그대로입니다.", "optionNotes": {"A": "정답입니다. `main`이 `throws Exception`을 선언하면 `printFileContent()`가 던지는 `IOException`을 처리하지 않아도 됩니다.", "B": "상위 타입 `Exception`을 먼저 잡으면 뒤의 `catch(IOException)`에 도달할 수 없어 컴파일 에러입니다. 게다가 line 4의 미선언 문제도 남습니다.", "C": "정답입니다. 메서드가 checked 예외를 던지려면 `throws IOException`을 선언해야 합니다.", "D": "`throw` 뒤에는 예외 객체가 와야 하는데 `new`가 없어 `IOException`이라는 메서드를 찾는 것으로 해석되어 컴파일 에러입니다.", "E": "line 4의 미선언 checked 예외 문제를 해결하지 못하고, `main`에 처리되지 않은 `IOException`을 하나 더 만들 뿐입니다."}, "concepts": [{"title": "checked 예외의 catch-or-declare 규칙", "body": "`Exception`의 하위 클래스 중 `RuntimeException` 계열이 아닌 것(`IOException`, `FileNotFoundException`, `SQLException` 등)은 checked 예외입니다. 이를 던질 수 있는 코드는 `try-catch`로 잡거나 메서드에 `throws`로 선언해야 합니다. 선언한 메서드를 호출하는 쪽도 같은 규칙을 따라야 하며, `main`에서 `throws`로 선언하면 JVM으로 전달됩니다. `RuntimeException`과 `Error` 계열(unchecked)은 처리 의무가 없습니다."}, {"title": "다중 catch 블록 순서", "body": "catch 블록은 위에서부터 검사합니다. 상위 타입 catch가 하위 타입 catch보다 앞에 오면 하위 catch는 도달할 수 없으므로 컴파일 에러입니다. 항상 구체적인(하위) 타입을 먼저, 일반적인(상위) 타입을 나중에 둡니다.\n```java\ntry { ... }\ncatch (FileNotFoundException e) { }\ncatch (IOException e) { }\ncatch (Exception e) { }\n```"}], "trap": "B처럼 try-catch로 감싸면 해결될 것 같아 보이지만 catch 순서가 잘못되었고, D는 `new` 누락이라는 작은 문법 오류를 숨겨 두었습니다.", "tags": ["checked 예외", "throws 선언", "catch 순서"], "occurrences": ["surepassexam Q141 p80"], "verified": "compiled", "fixes": ["보기 A, C, D, E 설명문(`Replace line 8 with` 등) 끝에 빠진 콜론을 B와 같게 추가"], "no": 121}, {"id": 167, "topic": "exceptions", "parts": [{"type": "text", "content": "Which three statements are true about exception handling? (Choose three.)"}], "options": [{"key": "A", "text": "Only unchecked exceptions can be rethrown.", "code": null}, {"key": "B", "text": "All subclasses of the RuntimeException class are not recoverable.", "code": null}, {"key": "C", "text": "The parameter in a catch block is of Throwable type.", "code": null}, {"key": "D", "text": "All subclasses of the RuntimeException class must be caught or declared to be thrown.", "code": null}, {"key": "E", "text": "All subclasses of the RuntimeException class are unchecked exceptions.", "code": null}, {"key": "F", "text": "All subclasses of the Error class are not recoverable.", "code": null}], "correct": "CEF", "dumpAnswer": "BCD", "answerNote": "덤프 정답 BCD는 틀렸습니다. D(\"RuntimeException 하위 클래스는 반드시 catch하거나 throws로 선언해야 한다\")는 checked 예외의 규칙이며, RuntimeException은 unchecked라 정반대입니다. B(\"RuntimeException은 모두 복구 불가능\")도 틀렸습니다. RuntimeException은 catch해서 정상 흐름으로 돌아갈 수 있고, \"복구 불가능\"은 Error에 대한 설명입니다. RuntimeException을 throws 없이 던지고 잡아 정상 진행되는 것과, checked 예외를 다시 던질 수 있는 것은 실행해서 확인했습니다.", "summary": "catch 매개변수는 Throwable 계열이고(C), RuntimeException 계열은 unchecked이며(E), Error 계열은 일반적으로 복구할 수 없는 문제(F)입니다.", "walkthrough": "예외 계층은 `Throwable` 아래에 `Error`와 `Exception`이 있고, `Exception` 아래에 `RuntimeException`이 있습니다.\n- A: `catch (Exception e) { throw e; }`처럼 checked 예외도 다시 던질 수 있습니다. 메서드에 `throws`만 선언하면 됩니다. 직접 실행해 확인했습니다 → 거짓입니다.\n- B: `RuntimeException`(예: `IllegalStateException`)을 catch하고 프로그램을 계속 진행하는 것은 흔한 일입니다. 실행해 보면 \"recovered\"가 출력됩니다 → 거짓입니다.\n- C: catch 매개변수 타입은 `Throwable`이거나 그 하위 클래스여야 하며, `catch (String s)`는 \"String cannot be converted to Throwable\" 에러가 납니다. 즉 catch 매개변수는 Throwable 타입입니다 → 참입니다.\n- D: catch나 throws 선언을 강제하는 것은 checked 예외입니다. `RuntimeException`은 강제하지 않습니다 → 거짓입니다.\n- E: JLS 정의상 `RuntimeException`과 그 하위 클래스, `Error`와 그 하위 클래스가 unchecked 예외입니다 → 참입니다.\n- F: `Error`는 `OutOfMemoryError`, `StackOverflowError`처럼 애플리케이션이 일반적으로 처리하거나 복구할 수 없는 심각한 문제를 나타냅니다 → 참입니다(시험의 표준 해석).", "optionNotes": {"A": "checked 예외도 catch 블록에서 다시 던질 수 있습니다. 해당 메서드가 `throws`로 선언하기만 하면 됩니다.", "B": "RuntimeException은 프로그램 버그나 잘못된 입력을 뜻하는 경우가 많지만, catch해서 대체 처리 후 계속 실행할 수 있습니다. \"복구 불가능\"은 Error의 특징입니다.", "C": "정답입니다. catch 매개변수는 `Throwable` 또는 그 하위 타입이어야 하므로 Throwable 타입이라 할 수 있습니다.", "D": "catch 또는 throws를 강제하는 handle-or-declare 규칙은 checked 예외에만 적용됩니다. RuntimeException 계열은 선언하지 않아도 됩니다.", "E": "정답입니다. RuntimeException과 그 모든 하위 클래스는 unchecked 예외입니다.", "F": "정답입니다. Error 계열은 JVM이나 시스템 수준의 심각한 문제를 나타내며, 애플리케이션이 복구하리라 기대하지 않습니다."}, "concepts": [{"title": "예외 계층과 checked/unchecked", "body": "`Throwable` → `Error`(unchecked), `Exception` → `RuntimeException`(unchecked), 그 외 `Exception` 하위(`IOException`, `SQLException`, `Exception` 자신 등)는 checked입니다. checked 예외는 handle-or-declare 규칙, 즉 `try-catch`로 잡거나 `throws`로 선언해야 하며 그렇지 않으면 컴파일 에러입니다. unchecked는 강제하지 않습니다. 대표 unchecked 예외로는 `NullPointerException`, `ArithmeticException`, `ArrayIndexOutOfBoundsException`, `ClassCastException`, `IllegalArgumentException`, `NumberFormatException`이 있습니다. 대표 Error로는 `StackOverflowError`, `OutOfMemoryError`, `ExceptionInInitializerError`가 있습니다."}, {"title": "catch 블록 규칙", "body": "catch 매개변수는 Throwable 계열만 가능합니다. 여러 catch를 둘 때는 하위 타입을 먼저 써야 하며, 상위 타입을 먼저 쓰면 뒤의 catch에 도달할 수 없어 컴파일 에러가 납니다. try 블록에서 절대 던질 수 없는 checked 예외(`Exception`, `Throwable` 제외)를 catch해도 컴파일 에러입니다. Error도 문법적으로는 catch할 수 있지만 권장되지 않습니다."}], "trap": "D처럼 checked 예외의 규칙을 RuntimeException에 붙여 놓고, B처럼 Error의 특징(복구 불가)을 RuntimeException의 특징인 것처럼 바꿔 놓습니다.", "tags": ["checked vs unchecked", "RuntimeException", "Error", "catch 매개변수 타입"], "occurrences": ["certleader-C Q28 p147", "certleader-D Q8 p173"], "verified": "compiled", "fixes": [], "no": 122}, {"id": "X12", "topic": "exceptions", "tags": ["Error와 Exception", "OutOfMemoryError", "catch 범위"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    ArrayList myList = new ArrayList();\n    String[] myArray;\n    try {\n        while (true) {\n            myList.add(\"My String\");\n        }\n    }\n    catch (RuntimeException re) {\n        System.out.println(\"Caught a RuntimeException\");\n    }\n    catch (Exception e) {\n        System.out.println(\"Caught an Exception\");\n    }\n    System.out.println(\"Ready to use\");\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Execution terminates in the first catch statement, and caught a RuntimeException is printed to the console.", "code": null}, {"key": "B", "text": "Execution terminates in the second catch statement, and caught an Exception is printed to the console.", "code": null}, {"key": "C", "text": "A runtime error is thrown in the thread \"main\".", "code": null}, {"key": "D", "text": "Execution completes normally, and Ready to use is printed to the console.", "code": null}, {"key": "E", "text": "The code fails to compile because a throws keyword is required.", "code": null}], "choose": 1, "correct": "C", "dumpAnswersAll": ["C", "D"], "answerNote": "정답은 C입니다. 보기와 코드는 모든 사본에서 같고 일부 사본만 D를 적었습니다. 무한 루프로 리스트가 계속 커지면 결국 `OutOfMemoryError`가 발생하는데, 이는 `Error`의 하위 클래스라 `catch (RuntimeException)`과 `catch (Exception)` 어느 쪽에도 잡히지 않습니다. 따라서 `Ready to use`는 출력되지 않고 main 스레드가 오류로 종료됩니다.", "verified": "compiled", "summary": "끝없는 `add()`로 힙이 고갈되어 `OutOfMemoryError`가 발생하며, 이는 `Exception`이 아닌 `Error`라 두 catch를 모두 통과해 main 스레드를 종료시킵니다.", "walkthrough": "1. 코드는 정상 컴파일됩니다. raw 타입 `ArrayList`에 대한 unchecked 경고만 나오고, checked 예외를 던지는 코드가 없으므로 `throws`도 필요 없습니다.\n2. `while (true)` 안에 `break`가 없으므로 `myList.add(\"My String\")`이 끝없이 실행됩니다.\n3. 같은 문자열 리터럴을 넣더라도 리스트 내부 배열은 계속 커져야 하므로 결국 힙 메모리가 바닥납니다.\n4. 그 순간 JVM은 `java.lang.OutOfMemoryError`를 던집니다. 계층은 `Throwable → Error → VirtualMachineError → OutOfMemoryError`입니다.\n5. `catch (RuntimeException re)`와 `catch (Exception e)`는 `Exception` 계열만 잡으므로 이 오류는 그대로 통과합니다.\n6. 마지막 `println(\"Ready to use\")`에 도달하지 못하고 `Exception in thread \"main\" java.lang.OutOfMemoryError: Java heap space`가 출력되며 종료합니다.", "optionNotes": {"A": "`OutOfMemoryError`는 `RuntimeException`의 하위 클래스가 아니므로 첫 번째 catch에 잡히지 않습니다.", "B": "`Error`는 `Exception`의 하위 클래스도 아닙니다. 두 번째 catch에도 잡히지 않습니다.", "C": "정답입니다. 잡히지 않은 `OutOfMemoryError`가 main 스레드에서 전파되어 프로그램이 비정상 종료합니다.", "D": "오류가 어느 catch에도 잡히지 않으므로 try-catch 뒤의 `Ready to use` 출력 문까지 실행이 이어지지 않습니다.", "E": "try 블록 안에 checked 예외를 던지는 코드가 없고, `Error`는 unchecked이므로 `throws` 선언이 필요 없습니다. 컴파일은 성공합니다."}, "concepts": [{"title": "Throwable 계층: Error vs Exception", "body": "모든 예외·오류는 `Throwable`을 상속하며 크게 둘로 나뉩니다.\n\n- `Exception`: 프로그램이 처리할 수 있는 상황입니다. 그중 `RuntimeException` 계열은 unchecked, 나머지(`IOException` 등)는 checked입니다.\n- `Error`: JVM 수준의 심각한 문제입니다(`OutOfMemoryError`, `StackOverflowError`, `ExceptionInInitializerError` 등). unchecked이며 보통 잡지 않습니다.\n\n`catch (Exception e)`는 `Error`를 잡지 못합니다. `Error`까지 잡으려면 `catch (Error e)`나 `catch (Throwable t)`를 써야 합니다. 무한 재귀는 `StackOverflowError`, 끝없는 객체 추가는 `OutOfMemoryError`라는 짝도 함께 기억해 두면 좋습니다."}, {"title": "while (true)와 도달 가능성", "body": "`break`가 없는 `while (true)`는 정상 종료할 수 없으므로 그 바로 뒤의 문장은 '도달 불가'로 판정되어 컴파일 오류가 됩니다. 하지만 이 문제에서는 루프가 try 블록 안에 있고, catch 블록은 정상 종료할 수 있으므로 try-catch 문 전체는 완료될 수 있다고 판단됩니다. 그래서 그 뒤의 `System.out.println(\"Ready to use\");`는 컴파일러 입장에서 도달 가능한 코드이고 컴파일 오류가 나지 않습니다."}], "trap": "catch가 두 개나 있으니 무엇이든 잡힐 것이라고 생각하게 만듭니다. 메모리 고갈은 `Exception`이 아니라 `Error`입니다.", "fixes": ["보기 B의 `terminates In`을 `terminates in`으로 고쳤습니다."], "occurrences": ["gratisexam-VCE (f10) Q35", "gratisexam-VCE (f11) Q33", "gratisexam-VCE (f12) Q25", "gratisexam-VCE (f13) Q28", "gratisexam-VCE (f15) Q33", "gratisexam-VCE (f20) Q41", "gratisexam-VCE (f8) Q35", "gratisexam-VCE (f9) Q25", "passleader-300q (f2) Q35", "passleader-300q (f2) Q45", "passleader-300q (f2) Q54", "passleader-300q (f2) Q69", "scanned (f3) Q43"], "added": true, "dumpAnswer": "C/D", "no": 123}, {"id": "X16", "topic": "exceptions", "tags": ["checked 예외", "unchecked 예외", "throws 선언"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Test {\n\n    void readCard(int cardNo) throws Exception {\n        System.out.println(\"Reading Card\");\n    }\n\n    void checkCard(int cardNo) throws RuntimeException { // line n1\n        System.out.println(\"Checking Card\");\n    }\n\n    public static void main(String[] args) {\n        Test ex = new Test();\n        int cardNo = 12344;\n        ex.checkCard(cardNo);        //line n2\n        ex.readCard(cardNo);         //line n3\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Reading Card\nChecking Card"}, {"key": "B", "text": "Compilation fails only at line n1.", "code": null}, {"key": "C", "text": "Compilation fails only at line n2.", "code": null}, {"key": "D", "text": "Compilation fails only at line n3.", "code": null}, {"key": "E", "text": "Compilation fails at both line n2 and line n3.", "code": null}], "choose": 1, "correct": "D", "dumpAnswersAll": ["D"], "answerNote": "덤프 답 D가 맞습니다. 다만 f14 사본은 n2에서 `readCard()`, n3에서 `checkCard()`를 호출하도록 순서가 바뀐 변형인데도 D로 표기했습니다. 그 변형이라면 오류는 n2에서 나므로 C가 답입니다. 여기서는 다수 사본의 순서(n2: `checkCard`, n3: `readCard`)를 따랐습니다.", "verified": "compiled", "summary": "`readCard()`는 checked 예외인 `Exception`을 선언하므로 처리하지도 선언하지도 않은 `main`의 호출(n3)에서만 컴파일 오류가 납니다.", "walkthrough": "1. `readCard()`는 `throws Exception`을 선언합니다. `Exception`은 checked 예외이므로 호출하는 쪽에서 반드시 처리(try-catch)하거나 다시 선언(throws)해야 합니다.\n2. `checkCard()`는 `throws RuntimeException`을 선언합니다. `RuntimeException`은 unchecked 예외라 선언해도 호출하는 쪽에 의무가 생기지 않습니다. 그래서 line n1은 합법입니다.\n3. line n2의 `ex.checkCard(cardNo)`는 처리 의무가 없으므로 그대로 컴파일됩니다.\n4. line n3의 `ex.readCard(cardNo)`는 `main`에 try-catch도 `throws Exception`도 없으므로 `unreported exception Exception` 오류가 납니다.\n5. 실제로 컴파일하면 n3 한 곳에서만 오류가 보고되므로 답은 D입니다. 컴파일이 실패하므로 아무것도 출력되지 않습니다.", "optionNotes": {"A": "n3에서 컴파일이 실패하므로 프로그램이 실행되지 않습니다. 실행된다고 해도 `checkCard`가 먼저 호출되니 순서도 반대입니다.", "B": "메서드가 `throws RuntimeException`을 선언하는 것은 합법입니다. 불필요할 뿐 오류가 아닙니다.", "C": "`checkCard()`가 던질 수 있는 예외는 unchecked라 호출하는 쪽에서 처리하지 않아도 됩니다.", "D": "정답입니다. checked 예외 `Exception`을 선언한 `readCard()`를 처리 없이 호출했기 때문에 n3만 실패합니다.", "E": "n2의 `checkCard()` 호출에는 checked 예외가 없으므로 n2는 오류가 아닙니다."}, "concepts": [{"title": "checked 예외와 unchecked 예외", "body": "`Exception`과 그 하위 클래스 중 `RuntimeException` 계열이 아닌 것이 **checked 예외**입니다(`IOException`, `Exception` 자체 등). checked 예외를 던질 수 있는 메서드를 호출하면 컴파일러가 처리를 강제합니다(handle or declare).\n\n- 처리: `try { ex.readCard(1); } catch (Exception e) { }`\n- 선언: `public static void main(String[] args) throws Exception`\n\n`RuntimeException`과 그 하위 클래스, `Error` 계열은 **unchecked**라서 `throws`에 적어도, 적지 않아도 호출하는 쪽에 의무가 없습니다."}, {"title": "throws 절의 의미", "body": "`throws`는 \"이 메서드가 이 예외를 던질 수 있다\"는 선언일 뿐이며, 메서드 본문에서 실제로 던지지 않아도 됩니다. 컴파일러는 선언된 타입만 보고 호출하는 쪽의 처리 의무를 판단합니다. 그래서 본문이 `println` 한 줄뿐인 `readCard()`도 호출하는 쪽에서 `Exception`을 처리해야 합니다."}], "trap": "`throws RuntimeException`이 적힌 n1이나 n2에서도 오류가 날 것처럼 보이게 합니다. unchecked 예외의 throws 선언은 호출하는 쪽에 아무 의무를 만들지 않습니다.", "fixes": [], "occurrences": ["gratisexam-VCE (f13) Q10", "gratisexam-VCE (f14) Q12", "gratisexam-VCE (f20) Q15", "passleader-300q (f2) Q19", "passleader-300q (f2) Q65", "scanned (f3) Q17"], "added": true, "dumpAnswer": "D", "no": 124}, {"id": "S1", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    static int calc() {\n        int x = 1;\n        try {\n            return x;\n        } finally {\n            x = 2;\n            System.out.print(\"F \");\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(calc());\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "1", "code": null}, {"key": "B", "text": "2", "code": null}, {"key": "C", "text": "F 1", "code": null}, {"key": "D", "text": "F 2", "code": null}, {"key": "E", "text": "Compilation fails.", "code": null}], "correct": "C", "summary": "`return` 값은 finally가 실행되기 전에 이미 정해지므로, finally에서 지역 변수를 바꿔도 반환값은 1입니다.", "walkthrough": "1. `calc()`가 호출되고 `x = 1`입니다.\n2. `try`에서 `return x;`를 만나면 JVM은 반환할 값 1을 먼저 계산해 따로 보관합니다.\n3. 메서드를 빠져나가기 직전에 `finally`가 반드시 실행됩니다. `x = 2`로 바뀌고 `F `가 출력됩니다.\n4. finally가 끝나면 보관해 둔 값 1이 반환됩니다. `x`는 지역 변수(기본형)라서 나중에 바꿔도 이미 복사된 반환값에는 영향이 없습니다.\n5. `main`이 반환값 1을 출력하므로 최종 출력은 `F 1`입니다.", "optionNotes": {"A": "finally 블록의 `F `도 출력되므로 1만 나오지 않습니다.", "B": "반환값은 finally 실행 전에 확정되므로 2가 아닙니다. finally 안에 `return x;`가 따로 있었다면 2가 됩니다.", "C": "정답입니다. finally가 먼저 `F `를 찍고, 확정된 반환값 1이 출력됩니다.", "D": "finally에서 `x = 2`를 해도 이미 보관된 반환값 1은 바뀌지 않습니다.", "E": "try-finally에서 return을 쓰는 것은 합법적인 코드입니다."}, "concepts": [{"title": "try / catch / finally 실행 순서", "body": "finally는 try나 catch가 정상 종료되든, return으로 빠져나가든, 예외가 던져지든 항상 실행됩니다. 예외는 `System.exit()`가 호출되거나 JVM이 죽는 경우뿐입니다.\n\n- try에서 return을 만나면 반환값을 계산해 보관한 다음 finally를 실행합니다.\n- finally 안에 또 return이 있으면 그 값이 원래 반환값(또는 던져지던 예외)을 덮어씁니다.\n- 반환값이 객체 참조라면 finally에서 그 객체의 상태를 바꾼 결과는 호출자에게 보입니다. 참조 자체는 그대로이기 때문입니다."}], "trap": "finally에서 변수를 바꾸면 반환값도 바뀐다고 착각하게 만드는 문제입니다. 기본형 지역 변수는 return 시점에 값이 복사됩니다.", "tags": ["finally", "return과 finally"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 125}, {"id": "S2", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        try {\n            int[] a = new int[2];\n            a[2] = 10;\n        } catch (Exception e) {\n            System.out.println(\"E\");\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"A\");\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "E", "code": null}, {"key": "B", "text": "A", "code": null}, {"key": "C", "text": "E A", "code": null}, {"key": "D", "text": "Compilation fails.", "code": null}, {"key": "E", "text": "An ArrayIndexOutOfBoundsException is thrown at runtime.", "code": null}], "correct": "D", "summary": "상위 타입 `Exception`을 먼저 잡으면 그 뒤의 하위 타입 catch는 도달할 수 없는 코드가 되어 컴파일 에러가 납니다.", "walkthrough": "`ArrayIndexOutOfBoundsException`은 `RuntimeException`을 거쳐 `Exception`을 상속합니다. 첫 번째 `catch (Exception e)`가 이미 모든 `Exception` 하위 타입을 잡기 때문에 두 번째 catch는 절대 실행될 수 없습니다. 자바 컴파일러는 도달할 수 없는 catch 블록을 에러로 처리합니다(`exception ArrayIndexOutOfBoundsException has already been caught`). 그래서 프로그램은 실행조차 되지 않습니다. 두 catch의 순서를 바꾸면 컴파일되고, 실행하면 `A`가 출력됩니다.", "optionNotes": {"A": "catch 순서가 바뀌지 않는 한 컴파일되지 않으므로 아무것도 출력되지 않습니다.", "B": "순서를 바꾸면 A가 출력되지만, 지금 코드는 컴파일 단계에서 막힙니다.", "C": "catch 블록은 많아야 하나만 실행됩니다. 두 블록이 연달아 실행되는 일은 없습니다.", "D": "정답입니다. 하위 타입 catch가 상위 타입 catch 뒤에 있어 도달할 수 없는 코드가 됩니다.", "E": "컴파일이 실패하므로 런타임까지 가지 않습니다."}, "concepts": [{"title": "catch 블록 순서 규칙", "body": "여러 catch를 쓸 때는 **하위 타입부터 상위 타입 순서**로 써야 합니다. 상위 타입 catch가 앞에 있으면 뒤의 하위 타입 catch는 unreachable이 되어 컴파일 에러입니다.\n\n```java\ntry { ... }\ncatch (FileNotFoundException e) { }  // 하위\ncatch (IOException e) { }            // 상위\ncatch (Exception e) { }              // 최상위\n```\n서로 상속 관계가 없는 예외(예: `ArithmeticException`과 `NullPointerException`)는 순서를 바꿔도 됩니다."}, {"title": "예외 계층 구조", "body": "`Throwable` 아래에 `Error`와 `Exception`이 있고, `Exception` 아래의 `RuntimeException`과 그 하위 클래스가 unchecked 예외입니다. `ArrayIndexOutOfBoundsException`, `NullPointerException`, `ClassCastException`, `ArithmeticException`, `NumberFormatException`(`IllegalArgumentException`의 하위)이 대표적인 RuntimeException입니다."}], "trap": "코드를 실행 흐름대로만 따라가면 A를 고르기 쉽습니다. catch 순서 문제는 출력을 계산하기 전에 컴파일되는지부터 확인해야 합니다.", "tags": ["catch 순서", "예외 계층"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 126}, {"id": "S3", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "import java.io.*;\nimport java.sql.SQLException;\n\nclass Reader {\n    void read() throws IOException { }\n}\nclass FileReader2 extends Reader {\n    // line n1\n}"}, {"type": "text", "content": "Which two methods, inserted independently at line n1, compile? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "void read() throws Exception { }"}, {"key": "B", "text": "", "code": "void read() throws FileNotFoundException { }"}, {"key": "C", "text": "", "code": "public void read() { }"}, {"key": "D", "text": "", "code": "private void read() throws IOException { }"}, {"key": "E", "text": "", "code": "void read() throws RuntimeException, IOException, SQLException { }"}], "correct": "BC", "summary": "오버라이딩 메서드는 부모보다 넓은 checked 예외를 던질 수 없고, 접근 제어자를 좁힐 수 없습니다.", "walkthrough": "부모 `read()`는 package-private 접근이고 `IOException`을 던집니다. 오버라이딩 규칙을 보기마다 적용해 보면 다음과 같습니다.\n- checked 예외는 부모가 선언한 예외와 같거나 그 하위 타입이어야 하고, 아예 안 던져도 됩니다.\n- unchecked 예외(`RuntimeException` 계열)는 자유롭게 추가할 수 있습니다.\n- 접근 제어자는 같거나 더 넓어야 합니다(private < default < protected < public).\n\nB는 `FileNotFoundException`이 `IOException`의 하위라서 허용되고, C는 예외를 없애고 접근을 public으로 넓혔으므로 허용됩니다. 실제로 `javac --release 8`로 컴파일하면 B와 C만 통과합니다.", "optionNotes": {"A": "`Exception`은 `IOException`보다 넓은 checked 예외라서 `cannot override` 컴파일 에러입니다.", "B": "정답입니다. `FileNotFoundException`은 `IOException`의 하위 클래스이므로 허용됩니다.", "C": "정답입니다. checked 예외를 선언하지 않아도 되고, default에서 public으로 넓히는 것도 허용됩니다.", "D": "default 접근을 private으로 좁히므로 오버라이딩 규칙 위반입니다.", "E": "`RuntimeException`과 `IOException`은 괜찮지만 `SQLException`은 부모가 선언하지 않은 새 checked 예외라서 에러입니다."}, "concepts": [{"title": "오버라이딩과 throws 절", "body": "오버라이딩 메서드의 throws 절 규칙은 다음과 같습니다.\n1. 부모가 던지지 않는 새 checked 예외는 추가할 수 없습니다.\n2. 부모 예외의 하위 타입으로 좁히거나 아예 생략할 수 있습니다.\n3. unchecked 예외는 개수와 종류에 제한이 없습니다.\n\n이유는 다형성 때문입니다. `Reader r = new FileReader2();`로 `r.read()`를 호출하는 코드는 `IOException`만 처리하도록 작성되어 있으므로, 자식이 더 넓은 checked 예외를 던지면 그 코드가 깨집니다."}, {"title": "오버라이딩 체크리스트", "body": "시그니처(이름과 매개변수)가 같아야 하고, 반환 타입은 같거나 공변(하위 타입)이어야 합니다. 접근 제어자는 좁힐 수 없고, checked 예외는 넓힐 수 없으며, static 메서드는 오버라이딩이 아니라 하이딩(hiding)입니다. 부모 메서드가 private이면 자식에게 보이지 않으므로 같은 이름으로 만들어도 오버라이딩이 아닙니다."}], "trap": "E처럼 RuntimeException을 섞어 두면 전체가 허용되는 것처럼 보입니다. 목록의 checked 예외를 하나씩 따로 확인해야 합니다.", "tags": ["오버라이딩 규칙", "checked 예외"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 127}, {"id": "S4", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "import java.io.*;\npublic class Test {\n    static void open() throws IOException {\n        throw new FileNotFoundException(\"no file\");\n    }\n    public static void main(String[] args) {\n        try {\n            open();\n        } catch (FileNotFoundException e) {\n            System.out.println(\"FNF\");\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "FNF", "code": null}, {"key": "B", "text": "no file", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "A FileNotFoundException is thrown at runtime.", "code": null}], "correct": "C", "summary": "컴파일러는 선언된 타입(`IOException`)만 보므로, 하위 예외만 catch하면 IOException이 처리되지 않았다는 컴파일 에러가 납니다.", "walkthrough": "`open()`은 실제로 `FileNotFoundException`을 던지지만, 시그니처에는 `throws IOException`이라고 선언되어 있습니다. 호출하는 쪽에서 컴파일러가 보는 것은 메서드 본문이 아니라 이 선언입니다. `main`은 `FileNotFoundException`만 잡고 있어 나머지 `IOException` 가능성이 처리되지 않았고, `main`에 throws 선언도 없습니다. 그래서 `unreported exception IOException; must be caught or declared to be thrown` 컴파일 에러가 납니다. `catch (IOException e)`를 추가하거나 `main`에 `throws IOException`을 붙이면 컴파일되고, 실행하면 `FNF`가 출력됩니다.", "optionNotes": {"A": "런타임에 실제로 던져지는 예외는 FileNotFoundException이 맞지만, 컴파일 단계를 통과하지 못합니다.", "B": "예외 메시지를 출력하는 코드는 어디에도 없습니다.", "C": "정답입니다. checked 예외 검사는 선언된 타입 기준으로 컴파일 시점에 이루어집니다.", "D": "컴파일되지 않으므로 런타임 예외도 발생하지 않습니다."}, "concepts": [{"title": "Handle or Declare 규칙", "body": "checked 예외(`RuntimeException` 계열이 아닌 `Exception` 하위 타입)를 던질 수 있는 코드는 반드시 둘 중 하나를 해야 합니다.\n- try/catch로 처리합니다(같은 타입이나 상위 타입으로 catch).\n- 메서드 선언에 `throws`로 떠넘깁니다.\n\n컴파일러는 호출하는 메서드의 **선언된** throws 절을 기준으로 검사합니다. 반대로 try 블록에서 절대 던질 수 없는 checked 예외를 catch하면(예: 아무 IO도 없는데 `catch (IOException e)`) 그것도 컴파일 에러입니다. 단, `Exception`과 `Throwable`은 예외적으로 언제든 catch할 수 있습니다."}], "trap": "본문이 FileNotFoundException을 던지니 FNF가 출력될 것처럼 보이게 만든 문제입니다. 컴파일러가 무엇을 근거로 판단하는지가 핵심입니다.", "tags": ["checked 예외", "handle or declare"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 128}, {"id": "S5", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        String[] arr = {\"10\", \"two\", null};\n        int sum = 0;\n        for (String s : arr) {\n            try {\n                sum += Integer.parseInt(s);\n            } catch (NumberFormatException e) {\n                sum += 100;\n            } finally {\n                sum += 1;\n            }\n        }\n        System.out.println(sum);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "11", "code": null}, {"key": "B", "text": "112", "code": null}, {"key": "C", "text": "213", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "E", "text": "Compilation fails.", "code": null}], "correct": "C", "summary": "`Integer.parseInt(null)`은 NPE가 아니라 `NumberFormatException`을 던지므로 세 번 모두 catch/finally를 거쳐 213이 됩니다.", "walkthrough": "반복을 하나씩 따라가 보겠습니다.\n1. `\"10\"`: 파싱에 성공해 `sum = 10`이 되고, finally에서 +1이 되어 11입니다.\n2. `\"two\"`: `NumberFormatException`이 발생해 catch에서 +100(111), finally에서 +1이 되어 112입니다.\n3. `null`: `Integer.parseInt(null)`도 `NumberFormatException`(메시지 `null` 또는 `Cannot parse null string`)을 던집니다. catch에서 +100(212), finally에서 +1이 되어 213입니다.\n\n세 번 모두 finally가 실행되며, `javac --release 8`로 실행해도 `213`이 출력됩니다.", "optionNotes": {"A": "첫 반복만 계산한 값입니다. 예외가 나도 루프는 계속 돕니다.", "B": "null도 NumberFormatException으로 처리된다는 점을 빠뜨린 값입니다.", "C": "정답입니다. 10+1, +100+1, +100+1의 합이 213입니다.", "D": "null 인자에 대해 `parseInt`는 NPE가 아니라 NumberFormatException을 던지도록 정의되어 있습니다.", "E": "문법 오류가 없습니다. finally에서 지역 변수를 변경해도 문제없습니다."}, "concepts": [{"title": "래퍼 클래스 파싱 메서드와 예외", "body": "`Integer.parseInt(String)`은 `int`를, `Integer.valueOf(String)`은 `Integer`를 반환합니다. 둘 다 숫자로 해석할 수 없는 문자열이나 `null`을 받으면 `NumberFormatException`을 던집니다. 이 예외는 `IllegalArgumentException`의 하위 클래스이고 unchecked입니다. 반면 `Boolean.parseBoolean`은 예외를 던지지 않고, `\"true\"`(대소문자 무시)가 아니면 모두 false를 반환합니다."}, {"title": "루프 안의 try-catch", "body": "try-catch가 루프 **안**에 있으면 한 번의 예외가 해당 반복만 처리하고 루프는 계속됩니다. try가 루프 **바깥**을 감싸고 있다면 첫 예외에서 루프 전체가 끝납니다. 출력 문제에서는 try 블록의 범위부터 확인하세요."}], "trap": "null을 보면 반사적으로 NullPointerException을 떠올리게 만든 문제입니다. `parseInt(null)`은 NumberFormatException입니다.", "tags": ["NumberFormatException", "finally", "래퍼 클래스"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 129}, {"id": "S6", "topic": "exceptions", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    static void m1() {\n        try {\n            m2();\n            System.out.print(\"1 \");\n        } catch (ArithmeticException e) {\n            System.out.print(\"2 \");\n            throw new IllegalStateException();\n        } finally {\n            System.out.print(\"3 \");\n        }\n        System.out.print(\"4 \");\n    }\n    static void m2() {\n        int x = 10 / 0;\n    }\n    public static void main(String[] args) {\n        try {\n            m1();\n        } catch (RuntimeException e) {\n            System.out.print(\"5 \");\n        }\n        System.out.println(\"6\");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2 3 4 5 6", "code": null}, {"key": "B", "text": "2 3 5 6", "code": null}, {"key": "C", "text": "1 3 4 6", "code": null}, {"key": "D", "text": "2 5 6", "code": null}, {"key": "E", "text": "Compilation fails.", "code": null}], "correct": "B", "summary": "catch에서 새 예외를 던져도 finally는 먼저 실행되고, finally 뒤의 코드는 건너뛴 채 예외가 호출자로 전파됩니다.", "walkthrough": "1. `m2()`의 `10 / 0`에서 `ArithmeticException`이 발생합니다. `m2`에는 처리 코드가 없으므로 예외가 `m1`로 전파되고, `1 `은 출력되지 않습니다.\n2. `m1`의 catch가 잡아 `2 `를 출력한 뒤 `IllegalStateException`을 새로 던집니다.\n3. 메서드를 빠져나가기 전에 finally가 실행되어 `3 `이 출력됩니다.\n4. 예외가 아직 진행 중이므로 try 문 뒤의 `4 `는 실행되지 않습니다.\n5. `main`의 `catch (RuntimeException e)`가 `IllegalStateException`(RuntimeException의 하위)을 잡아 `5 `를 출력합니다.\n6. 이제 정상 흐름으로 돌아와 `6`이 출력됩니다.\n\n최종 출력은 `2 3 5 6`이며, 컴파일 후 실행해 확인했습니다.", "optionNotes": {"A": "catch에서 던진 예외가 메서드를 빠져나가므로 try 문 뒤의 `4 `는 실행되지 않습니다.", "B": "정답입니다. 2(catch), 3(finally), 5(main catch), 6 순서로 출력됩니다.", "C": "`m2()`에서 예외가 나므로 `1 `은 출력되지 않습니다.", "D": "예외가 던져지는 중에도 finally는 실행되므로 `3 `이 빠질 수 없습니다.", "E": "unchecked 예외만 사용하므로 throws 선언 없이도 컴파일됩니다."}, "concepts": [{"title": "예외 전파와 콜 스택", "body": "예외가 발생하면 JVM은 현재 메서드에서 맞는 catch를 찾고, 없으면 메서드를 종료하고 호출한 메서드로 예외를 넘깁니다. 이 과정은 main을 넘어가면 스레드가 종료되며 스택 트레이스가 출력될 때까지 반복됩니다. 각 단계에서 빠져나가는 try 블록의 finally는 모두 실행됩니다."}, {"title": "catch 안에서 예외 던지기", "body": "catch 블록에서 던진 예외는 **같은 try 문의 다른 catch로는 잡히지 않고** 바깥으로 나갑니다. finally는 그 전에 실행됩니다. 만약 finally에서도 예외를 던지면 catch에서 던진 예외는 사라지고 finally의 예외가 전파됩니다."}], "trap": "finally 뒤의 문장(4)까지 실행된다고 생각하기 쉽습니다. finally 이후 정상 흐름이 이어지는 것은 예외가 완전히 처리됐을 때뿐입니다.", "tags": ["예외 전파", "finally", "RuntimeException"], "answerNote": "", "verified": "compiled", "supplement": true, "dumpAnswer": "", "no": 130}, {"id": 5, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    ArrayList<Integer> points = new ArrayList<>();\n    points.add(1);\n    points.add(2);\n    points.add(3);\n    points.add(4);\n    points.add(null);\n    points.remove(1);\n    points.remove(null);\n    System.out.println(points);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A NullPointerException is thrown at runtime.", "code": null}, {"key": "B", "text": "[1, 2, 4]", "code": null}, {"key": "C", "text": "[1, 2, 4, null]", "code": null}, {"key": "D", "text": "[1, 3, 4, null]", "code": null}, {"key": "E", "text": "[1, 3, 4]", "code": null}, {"key": "F", "text": "Compilation fails.", "code": null}], "correct": "E", "dumpAnswer": "B", "answerNote": "덤프 정답 B는 틀렸습니다. `points.remove(1)`은 `remove(Object)`가 아니라 `remove(int index)`가 선택되어 인덱스 1의 요소(값 2)를 지웁니다. 이어서 `remove(null)`이 null을 지우므로 결과는 `[1, 3, 4]`입니다(실행으로 확인). B `[1, 2, 4]`가 나오려면 값 3을 지워야 하는데, 코드 어디에도 그런 호출은 없습니다.", "summary": "`remove(1)`은 인덱스 1을 지우고 `remove(null)`은 첫 null을 지워 `[1, 3, 4]`가 됩니다.", "walkthrough": "1. `add` 다섯 번 → `[1, 2, 3, 4, null]`. ArrayList는 null 요소를 허용합니다.\n2. `points.remove(1)`: 인자 `1`은 `int` 리터럴입니다. 오버로딩 해석의 1단계는 박싱 없이 맞는 메서드를 찾는 것이라 `remove(int index)`가 선택됩니다. 인덱스 1의 값 `2`가 삭제되어 `[1, 3, 4, null]`이 됩니다.\n3. `points.remove(null)`: `null`은 `int`가 될 수 없으므로 `remove(Object o)`가 선택됩니다. 리스트에서 처음 나오는 null(`o == null` 비교)이 삭제되어 `[1, 3, 4]`가 됩니다. NullPointerException은 나지 않습니다.\n4. `println(points)` → `[1, 3, 4]`.\n실제로 실행하면 중간 상태는 `[1, 3, 4, null]`, 최종 결과는 `[1, 3, 4]`입니다.", "optionNotes": {"A": "ArrayList는 null을 저장할 수 있고 `remove(null)`도 null을 찾아 지우는 정상 동작이라 NullPointerException은 발생하지 않습니다.", "B": "값 3을 지운 결과처럼 보이지만, `remove(1)`은 인덱스 1의 값 2를 지우므로 2가 남을 수 없습니다.", "C": "`remove(1)`을 값 1 삭제가 아니라 다른 것으로 잘못 보고, `remove(null)`도 무시한 결과입니다. null은 두 번째 remove에서 삭제됩니다.", "D": "`remove(1)`까지만 반영한 중간 상태입니다. 이어지는 `remove(null)`이 null을 지웁니다.", "E": "정답입니다. 인덱스 1의 2가 지워지고 null이 지워져 `[1, 3, 4]`가 출력됩니다.", "F": "`remove(int)`와 `remove(Object)` 모두 유효한 호출이고 `null`을 인자로 넘기는 것도 문법상 문제없으니 컴파일됩니다."}, "concepts": [{"title": "List.remove 오버로딩: remove(int) vs remove(Object)", "body": "`List<Integer>`에는 `remove(int index)`(삭제한 요소 반환)와 `remove(Object o)`(boolean 반환) 두 가지가 있습니다. 오버로딩 해석은 1) 정확히 일치하거나 기본형 확장(widening) 2) 박싱/언박싱 3) 가변인자 순서로 진행되므로, `int` 인자는 항상 `remove(int)`에 먼저 매칭됩니다. 값으로 지우고 싶다면 `list.remove(Integer.valueOf(1))`이나 `list.remove((Integer) 1)`처럼 객체로 넘겨야 합니다. 인덱스 범위를 벗어나면 `IndexOutOfBoundsException`이 납니다."}, {"title": "ArrayList와 null", "body": "ArrayList는 null을 여러 개 담을 수 있습니다. `remove(Object)`, `contains`, `indexOf`는 내부적으로 `o == null ? e == null : o.equals(e)`로 비교하므로 null을 넘겨도 NPE가 나지 않습니다. `toString()`은 null 요소를 `null`로 출력합니다. 다만 `List<Integer>`에서 null을 꺼내 `int`로 언박싱하면 NPE가 납니다."}], "trap": "`remove(1)`을 \"값 1을 지운다\"로 읽게 만드는 함정입니다. `List<Integer>`에 int 리터럴을 넘기면 인덱스로 해석됩니다.", "tags": ["ArrayList.remove(int)", "ArrayList.remove(Object)", "오토박싱과 오버로딩"], "occurrences": ["certleader-A Q5 p3", "certleader-D Q5 p172"], "verified": "compiled", "fixes": ["보기 A의 잘린 `runtim`을 `runtime.`으로 복원"], "no": 131}, {"id": 12, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    LocalDate date = LocalDate.of(2012, 01, 32);\n    date.plusDays(10);\n    System.out.println(date);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2012-02-10", "code": null}, {"key": "B", "text": "2012-02-11", "code": null}, {"key": "C", "text": "Compilation fails", "code": null}, {"key": "D", "text": "A DateTimeException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "`LocalDate.of(2012, 01, 32)`는 존재하지 않는 날짜라 런타임에 DateTimeException이 납니다.", "walkthrough": "1. `01`은 앞에 0이 붙은 8진수 리터럴이지만 값은 1이므로 컴파일에는 문제가 없습니다. 반면 `08`이나 `09`라면 \"illegal digit in an octal literal\" 컴파일 에러가 납니다(실제로 확인했습니다).\n2. `LocalDate.of(2012, 1, 32)`가 실행되면 일(day-of-month) 값을 검사합니다. 32는 범위(1~28/31)를 벗어나므로 `java.time.DateTimeException: Invalid value for DayOfMonth (valid values 1 - 28/31): 32`가 발생합니다.\n3. 예외가 첫 줄에서 발생하므로 이후 코드는 실행되지 않습니다.\n4. 참고로 날짜가 정상이었더라도 `date.plusDays(10);`의 반환값을 버렸기 때문에 `date`는 바뀌지 않습니다. LocalDate는 불변 객체입니다.\n정답은 D입니다.", "optionNotes": {"A": "1월 32일을 2월 1일로 넘겨 계산해 주지 않습니다. LocalDate.of는 잘못된 값을 보정하지 않고 예외를 던집니다. 게다가 plusDays 결과를 대입하지 않았으므로 날짜가 바뀌어 출력되지도 않습니다.", "B": "A와 같은 이유로 틀립니다. 생성 단계에서 예외가 발생합니다.", "C": "`01`은 유효한 8진수 리터럴(값 1)이고, 일 값 32는 int로 문법상 유효하므로 컴파일됩니다. 값 검사는 런타임에 일어납니다.", "D": "정답입니다. 32일은 유효하지 않으므로 `LocalDate.of`가 런타임에 DateTimeException을 던집니다."}, "concepts": [{"title": "LocalDate 생성과 유효성 검사", "body": "`LocalDate.of(year, month, day)`는 월(1~12)과 일(해당 월의 일수)을 검사하고, 잘못되면 `DateTimeException`(RuntimeException)을 던집니다. 예: `LocalDate.of(2015, 2, 29)`도 평년이라 예외이고, `LocalDate.of(2016, 2, 29)`는 윤년이라 정상입니다. 월은 0부터가 아니라 1부터 시작하며, `Month.JANUARY` 같은 enum도 받습니다. LocalDate에는 public 생성자가 없으므로 `new LocalDate()`는 컴파일 에러입니다."}, {"title": "java.time 클래스는 불변", "body": "`LocalDate`, `LocalTime`, `LocalDateTime`, `Period`의 `plusXxx`/`minusXxx`/`withXxx` 메서드는 원본을 바꾸지 않고 새 객체를 반환합니다. 그래서 `date.plusDays(10);`처럼 결과를 버리면 아무 효과가 없고, `date = date.plusDays(10);`처럼 다시 대입해야 합니다. 시험에서는 반환값을 버리는 코드로 \"원래 날짜 그대로 출력\" 보기를 정답으로 만드는 경우가 많습니다."}, {"title": "정수 리터럴 진법", "body": "`0`으로 시작하면 8진수(`017` = 15), `0x`는 16진수, `0b`는 2진수(Java 7+)입니다. 8진수에는 0~7만 쓸 수 있으므로 `08`, `09`는 컴파일 에러입니다. 날짜 문제에서 `LocalDate.of(2015, 08, 1)` 같은 코드는 런타임 예외가 아니라 컴파일 에러라는 점을 구분하세요."}], "trap": "plusDays를 계산해 2월 날짜를 고르게 유도하지만, 생성 시점에 이미 예외가 납니다. 반환값을 버리는 plusDays도 이중 함정입니다.", "tags": ["LocalDate.of 유효성 검사", "LocalDate 불변성", "8진수 리터럴"], "occurrences": ["certleader-A Q13 p6", "certleader-B Q33 p107"], "verified": "compiled", "fixes": [], "no": 132}, {"id": 20, "topic": "api", "parts": [{"type": "text", "content": "Which statement will empty the contents of a StringBuilder variable named sb?"}], "options": [{"key": "A", "text": "", "code": "sb.deleteAll ();"}, {"key": "B", "text": "", "code": "sb.delete (0, sb.size ());"}, {"key": "C", "text": "", "code": "sb.delete (0, sb.length ());"}, {"key": "D", "text": "", "code": "sb.removeAll ();"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "StringBuilder를 비우려면 `sb.delete(0, sb.length())`(또는 `sb.setLength(0)`)를 씁니다.", "walkthrough": "1. StringBuilder의 `delete(int start, int end)`는 `start` 이상 `end` 미만 구간의 문자를 지우고 자기 자신을 반환합니다.\n2. 길이는 `length()` 메서드로 구합니다. `size()`는 컬렉션(List 등)의 메서드라 StringBuilder에는 없습니다.\n3. `sb.delete(0, sb.length())` → 0부터 끝까지 지우므로 빈 상태가 됩니다. 실제로 `\"abc\"`에 적용하면 `[]`, 길이 0이 됩니다.\n4. `deleteAll()`, `removeAll()`, `size()`는 StringBuilder에 없는 메서드라 cannot find symbol 컴파일 에러입니다(확인 완료).", "optionNotes": {"A": "StringBuilder에는 `deleteAll()` 메서드가 없어 컴파일 에러입니다.", "B": "StringBuilder의 길이는 `length()`이고 `size()`는 없으므로 컴파일 에러입니다.", "C": "정답입니다. 인덱스 0부터 `length()`까지(끝 미포함) 전부 지워 빈 StringBuilder가 됩니다.", "D": "`removeAll()`은 Collection의 메서드(`removeAll(Collection)`)이고 StringBuilder에는 없어 컴파일 에러입니다."}, "concepts": [{"title": "StringBuilder 주요 메서드", "body": "`append(x)`, `insert(offset, x)`, `delete(start, end)`, `deleteCharAt(index)`, `replace(start, end, str)`, `reverse()`, `setLength(n)`, `charAt`, `indexOf`, `length`, `substring`, `toString` 등이 있습니다. append/insert/delete/deleteCharAt/replace/reverse는 원본을 직접 바꾸고 `this`를 반환하므로 메서드 체이닝을 할 수 있습니다. 반면 `substring`은 새 String을 반환할 뿐 StringBuilder를 바꾸지 않습니다. `delete`의 end가 길이보다 크면 길이까지로 보정되지만, start가 음수이거나 length보다 크거나 end보다 크면 `StringIndexOutOfBoundsException`이 납니다. 내용을 비우는 다른 방법은 `sb.setLength(0)`입니다."}, {"title": "길이를 구하는 방법 비교", "body": "배열은 필드 `arr.length`(괄호 없음), String/StringBuilder는 메서드 `length()`, 컬렉션(ArrayList 등)은 메서드 `size()`입니다. 시험에서 이 셋을 섞어 쓴 코드는 컴파일 에러를 노리는 경우가 많습니다. StringBuilder의 `capacity()`는 내부 버퍼 크기로 `length()`와 다릅니다(기본 16 + 초기 문자열 길이)."}], "trap": "`size()`, `removeAll()`처럼 컬렉션 API 이름을 섞어 그럴듯하게 만든 보기입니다. StringBuilder는 `length()`를 씁니다.", "tags": ["StringBuilder.delete", "length() vs size()"], "occurrences": ["certleader-A Q39 p11", "certleader-D Q30 p177"], "verified": "compiled", "fixes": ["PDF에서 `.` 기준으로 쪼개진 보기(A. s / B. deleteAll (); …)를 4개 보기로 재구성한 상태를 PDF 원본으로 재확인(보기 순서 deleteAll / size / length / removeAll, 정답 C)"], "no": 133}, {"id": 28, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragments:"}, {"type": "text", "content": "Person.java:"}, {"type": "code", "content": "public class Person {\n    String name;\n    int age;\n\n    public Person(String n, int a) {\n        name = n;\n        age = a;\n    }\n\n    public String getName() {\n        return name;\n    }\n\n    public int getAge() {\n        return age;\n    }\n}"}, {"type": "text", "content": "Test.java:"}, {"type": "code", "content": "public static void checkAge(List<Person> list, Predicate<Person> predicate) {\n    for (Person p : list) {\n        if (predicate.test(p)) {\n            System.out.println(p.name + \" \");\n        }\n    }\n}\n\npublic static void main(String[] args) {\n    List<Person> iList = Arrays.asList(new Person(\"Hank\", 45),\n                                       new Person(\"Charlie\", 40),\n                                       new Person(\"Smith\", 38));\n    //line n1\n}"}, {"type": "text", "content": "Which code fragment, when inserted at line n1, enables the code to print Hank?"}], "options": [{"key": "A", "text": "", "code": "checkAge (iList, ( ) -> p.getAge ( ) > 40);"}, {"key": "B", "text": "", "code": "checkAge(iList, Person p -> p.getAge( ) > 40);"}, {"key": "C", "text": "", "code": "checkAge (iList, p -> p.getAge ( ) > 40);"}, {"key": "D", "text": "", "code": "checkAge(iList, (Person p) -> { p.getAge() > 40; });"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "`Predicate<Person>`에 맞는 람다는 매개변수 하나를 받아 boolean을 돌려주는 `p -> p.getAge() > 40`이며, 45세인 Hank만 출력됩니다.", "walkthrough": "1. `checkAge`의 두 번째 매개변수는 `Predicate<Person>`이고, 추상 메서드는 `boolean test(Person p)`입니다. 따라서 람다는 매개변수 하나를 받아 boolean을 반환해야 합니다.\n2. C의 `p -> p.getAge() > 40`에서 p의 타입은 `Person`으로 추론됩니다.\n3. Hank(45)는 true, Charlie(40)는 `40 > 40`이 false, Smith(38)는 false입니다.\n4. 그래서 `println(p.name + \" \")`이 Hank에 대해서만 실행되어 `Hank `가 출력됩니다.\n5. 나머지 보기는 모두 람다 문법 오류로 컴파일되지 않습니다(옵션별 설명 참고). 각 보기를 실제로 넣어 컴파일해 확인했습니다.", "optionNotes": {"A": "`( ) ->`는 매개변수가 없는 람다인데 `test`는 매개변수를 하나 받으므로 타입이 맞지 않고, 본문의 p도 정의되지 않은 변수라 컴파일 에러입니다.", "B": "매개변수 타입을 적을 때는 반드시 괄호가 필요합니다. `Person p -> ...`가 아니라 `(Person p) -> ...`라고 써야 하므로 컴파일 에러입니다.", "C": "정답입니다. 매개변수 하나는 괄호를 생략할 수 있고, 식 본문의 결과(boolean)가 그대로 반환되어 Hank만 출력됩니다.", "D": "중괄호 블록 본문에서는 `return`이 필요합니다. `p.getAge() > 40;`은 단독 문장이 될 수 없는 식이라 `not a statement` 컴파일 에러가 납니다."}, "concepts": [{"title": "람다 식 문법 규칙", "body": "- 매개변수가 하나이고 타입을 생략하면 괄호도 생략할 수 있습니다: `p -> ...`\n- 타입을 적거나 매개변수가 0개 또는 2개 이상이면 괄호가 필요합니다: `(Person p) -> ...`, `() -> ...`, `(a, b) -> ...`\n- 식 본문(`-> 식`)은 return과 세미콜론 없이 식의 값이 반환됩니다.\n- 블록 본문(`-> { ... }`)에서 값을 돌려주려면 `return 식;`이 필요하고 각 문장 끝에 세미콜론을 붙입니다.\n- 매개변수 목록 안에서 타입을 쓰는 것과 생략하는 것을 섞을 수 없습니다: `(Person a, b)`는 에러입니다."}, {"title": "java.util.function.Predicate", "body": "`Predicate<T>`는 `boolean test(T t)` 하나만 가진 함수형 인터페이스입니다. 조건 검사를 매개변수로 넘길 때 쓰며, `and`, `or`, `negate` 같은 default 메서드도 있습니다. OCA 시험에서는 주로 람다를 Predicate에 대입하거나 `ArrayList.removeIf(Predicate)`에 넘기는 형태로 나옵니다."}], "trap": "D처럼 중괄호를 쓰고 return을 빼거나, B처럼 타입을 쓰고 괄호를 빼는 문법 실수를 고르게 유도합니다. 40세인 Charlie는 `> 40` 조건에서 빠진다는 점도 확인하세요.", "tags": ["람다 문법", "Predicate"], "occurrences": ["2passeasy Q2 p16", "exambible Q3 p25", "surepassexam Q139 p79"], "verified": "compiled", "fixes": ["보기 A의 `p. get Age ( )`를 `p.getAge ( )`로 수정"], "no": 134}, {"id": 39, "topic": "api", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String ta = \"A \";\n    ta = ta.concat(\"B \");\n    String tb = \"C \";\n    ta = ta.concat(tb);\n    ta.replace('C', 'D');\n    ta = ta.concat(tb);\n    System.out.println(ta);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A B C D", "code": null}, {"key": "B", "text": "A C D", "code": null}, {"key": "C", "text": "A B C C", "code": null}, {"key": "D", "text": "A B D", "code": null}, {"key": "E", "text": "A B D C", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "실제 출력은 `A B C C `(끝에 공백)이며 덤프 정답 C와 일치합니다. 실행으로 확인했습니다.", "summary": "String은 불변이므로 `ta.replace('C', 'D')`의 결과를 대입하지 않으면 ta는 그대로이고, 최종 값은 \"A B C C \"입니다.", "walkthrough": "1. `ta = \"A \"`입니다.\n2. `ta = ta.concat(\"B \")` → `\"A B \"`입니다.\n3. `tb = \"C \"`입니다.\n4. `ta = ta.concat(tb)` → `\"A B C \"`입니다.\n5. `ta.replace('C', 'D');`는 `\"A B D \"`라는 **새 문자열**을 만들지만 어디에도 대입하지 않아 버려집니다. ta는 여전히 `\"A B C \"`입니다.\n6. `ta = ta.concat(tb)` → `\"A B C C \"`입니다.\n7. 출력은 `A B C C`(끝에 공백)입니다.", "optionNotes": {"A": "D가 들어 있으려면 replace 결과가 반영되어야 하는데 대입하지 않았으므로 D는 나오지 않습니다. B도 빠지지 않습니다.", "B": "\"B \"는 concat 결과를 ta에 대입했으므로 남아 있고, replace는 반영되지 않았으므로 틀렸습니다.", "C": "정답입니다. replace 결과를 대입하지 않았으므로 C가 D로 바뀌지 않고, 마지막 concat으로 C가 하나 더 붙습니다.", "D": "replace가 반영되었다고 보고 마지막 concat을 빠뜨린 결과입니다. 실제로는 replace가 무시되고 concat은 대입되었습니다.", "E": "`ta.replace(...)`의 반환값을 ta에 대입했다고 착각한 결과입니다. String은 불변이라 ta는 바뀌지 않습니다."}, "concepts": [{"title": "String 불변성", "body": "String 객체는 한 번 만들어지면 내용이 바뀌지 않습니다. `concat`, `replace`, `toUpperCase`, `trim`, `substring` 등은 모두 새 String을 반환하며, 반환값을 변수에 대입하지 않으면 결과가 사라집니다. 반대로 StringBuilder의 `append`, `insert`, `reverse`, `delete`는 객체 자체를 바꾸므로 대입하지 않아도 반영됩니다.\n```java\nString s = \"ab\"; s.toUpperCase(); // s는 여전히 \"ab\"\nStringBuilder sb = new StringBuilder(\"ab\"); sb.reverse(); // sb는 \"ba\"\n```"}, {"title": "String.replace 오버로드", "body": "`replace(char old, char new)`는 모든 old 문자를 new로 바꾼 새 문자열을 반환하고, `replace(CharSequence, CharSequence)`는 부분 문자열을 모두 바꿉니다. 바꿀 대상이 없으면 원래 객체를 그대로 반환할 수 있습니다. 정규식을 쓰는 것은 `replaceAll`입니다."}], "trap": "결과를 대입하지 않은 `ta.replace(...)` 한 줄이 함정입니다. 반대로 concat은 대입했으므로 반영된다는 점도 같이 확인해야 합니다.", "tags": ["String 불변성", "String.concat/replace"], "occurrences": ["exambible Q1 p25", "certleader-C Q2 p140"], "verified": "compiled", "fixes": ["보기 C의 'A C D D'를 실제 출력이자 원본 보기인 'A B C C'로 수정"], "no": 135}, {"id": 40, "topic": "api", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String[] args)
