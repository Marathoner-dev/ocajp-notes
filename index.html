 교체이므로, 원래 길이 3이 남아 있지 않습니다.", "C": "배열 변수 타입은 길이를 포함하지 않으며(`int[]`), 같은 타입끼리의 대입이므로 컴파일됩니다. `int nums1[]` 형태 선언도 합법입니다.", "D": "향상된 for문은 실제 배열 길이만큼만 순회하므로 범위를 벗어날 수 없습니다. 길이 3 배열에 5개를 '넣는' 동작도 없습니다."}, "concepts": [{"title": "배열은 객체, 변수는 참조", "body": "배열 변수에는 배열 객체의 참조가 저장됩니다. 배열끼리 대입하면 같은 객체를 공유하게 되어 한쪽에서 요소를 바꾸면 다른 쪽에서도 보입니다. 배열 길이는 객체가 생성될 때 고정되고 변수 타입에는 길이가 없으므로, 길이가 다른 같은 타입 배열을 자유롭게 대입할 수 있습니다. 요소를 복사하려면 `Arrays.copyOf`, `System.arraycopy`, `clone()`을 사용합니다.\n```java\nint[] a = {1, 2};\nint[] b = a;   // 같은 객체\nb[0] = 9;      // a[0]도 9\nint[] c = a.clone(); // 별도 객체\n```"}, {"title": "배열 선언 문법", "body": "`int[] a`, `int a[]`, `int []a` 모두 합법입니다. `int[] a, b;`는 둘 다 배열이지만 `int a[], b;`는 a만 배열이고 b는 int입니다. 선언부에 크기를 쓰면(`int[3] a`) 컴파일 에러이고, 크기는 `new int[3]`처럼 생성식에만 씁니다."}], "trap": "길이 3짜리로 선언했으니 3개만 출력되거나 크기 불일치로 에러가 날 것이라는 착각을 노립니다.", "tags": ["배열 참조 대입", "향상된 for문", "배열 길이 고정"], "occurrences": ["surepassexam Q221 p94"], "verified": "compiled", "fixes": ["보기 D의 잘못된 예외 이름 `ArrayoutofBoundsException`을 `ArrayIndexOutOfBoundsException`으로 수정"], "no": 53}, {"id": 138, "topic": "arrays", "parts": [{"type": "text", "content": "Given this code for a Planet object:"}, {"type": "code", "content": "public class Planet {\n    public String name;\n    public int moons;\n\n    public Planet(String name, int moons) {\n        this.name = name;\n        this.moons = moons;\n    }\n}"}, {"type": "text", "content": "And this method:"}, {"type": "code", "content": "public static void main(String[] args){\n    Planet[] planets = {\n        new Planet(\"Mercury\", 0),\n        new Planet(\"Venus\", 0),\n        new Planet(\"Earth\", 1),\n        new Planet(\"Mars\", 2)\n    };\n\n    System.out.println(planets);\n    System.out.println(planets[2].name);\n    System.out.println(planets[2].moons);\n}"}, {"type": "text", "content": "What is the output?"}], "options": [{"key": "A", "text": "", "code": "planets\nEarth\n1"}, {"key": "B", "text": "", "code": "[LPlanets.Planet;@15db9742\nEarth\n1"}, {"key": "C", "text": "", "code": "[LPlanets.Planet;@15db9742\nPlanets.Planet@6d06d69c\n1"}, {"key": "D", "text": "", "code": "[LPlanets.Planet;@15db9742\nPlanets.Planet@6d06d69c\n[LPlanets.Moon;@7852e922"}, {"key": "E", "text": "", "code": "[LPlanets.Planet;@15db9742\nVenus\n0"}], "correct": "B", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. `planets[2].name`은 String 필드이므로 객체의 해시 표현(`Planets.Planet@...`)이 아니라 \"Earth\"가 출력됩니다. Planet을 `Planets` 패키지에 두고 실행하면 `[LPlanets.Planet;@1dbd16a6`, `Earth`, `1`이 출력되어 B와 일치합니다(해시값은 실행마다 다름).", "summary": "배열을 그대로 출력하면 `[L클래스명;@해시` 형태가 나오고, `planets[2].name`과 `.moons`는 필드 값 Earth와 1입니다.", "walkthrough": "1. `planets`는 Planet 객체 4개를 담은 배열입니다. 인덱스 2는 `new Planet(\"Earth\", 1)`입니다.\n2. `System.out.println(planets)`: 배열은 toString()을 재정의하지 않으므로 Object.toString()이 호출되어 `[L패키지.Planet;@16진수해시` 형태가 출력됩니다. `[`는 1차원 배열, `L…;`는 참조형 요소 타입을 뜻합니다. 보기는 Planet이 `Planets` 패키지에 있다고 가정한 표기입니다.\n3. `planets[2].name`은 String 필드 \"Earth\"이므로 `Earth`가 출력됩니다.\n4. `planets[2].moons`는 int 필드 1이므로 `1`이 출력됩니다.\n실행 결과 `[LPlanets.Planet;@1dbd16a6 / Earth / 1`로 B와 같습니다.", "optionNotes": {"A": "println에 배열 참조를 넘기면 변수 이름 \"planets\"가 아니라 Object.toString() 결과(`[LPlanets.Planet;@해시`)가 출력됩니다.", "B": "정답입니다. 배열은 기본 toString 형식, name은 \"Earth\", moons는 1입니다.", "C": "두 번째 줄은 Planet 객체가 아니라 String 필드 `name`을 출력하므로 `Planets.Planet@…`가 아니라 `Earth`입니다. 덤프 정답이지만 틀립니다.", "D": "`moons`는 int 필드이므로 `[LPlanets.Moon;@…` 같은 배열 표현이 나올 수 없고, Moon 클래스도 존재하지 않습니다. 두 번째 줄도 Earth입니다.", "E": "인덱스는 0부터 시작하므로 `planets[2]`는 세 번째 요소 Earth입니다. Venus는 인덱스 1입니다."}, "concepts": [{"title": "배열과 객체의 기본 toString()", "body": "toString()을 재정의하지 않은 객체는 `클래스의 완전한 이름@16진수 해시코드`를 출력합니다. 배열의 클래스 이름은 `[I`(int[]), `[[I`(int[][]), `[Ljava.lang.String;`(String[])처럼 표기됩니다. 배열 내용을 보려면 `Arrays.toString(arr)`, 2차원 이상은 `Arrays.deepToString(arr)`을 씁니다. 단, `char[]`는 `println(char[])` 오버로드가 있어 문자들이 그대로 출력됩니다.\n```java\nint[] a = {1, 2};\nSystem.out.println(a);                  // [I@1b6d3586\nSystem.out.println(Arrays.toString(a)); // [1, 2]\nSystem.out.println(new char[]{'h','i'}); // hi\n```"}, {"title": "배열 요소를 통한 멤버 접근", "body": "`arr[i].field`, `arr[i].method()`는 i번째 요소가 가리키는 객체의 멤버에 접근합니다. 요소가 null이면 NullPointerException, 인덱스가 범위를 벗어나면 ArrayIndexOutOfBoundsException입니다. 필드 타입이 String이나 int면 그 값이 그대로 출력됩니다."}], "trap": "첫 줄의 해시 표현에 이끌려 두 번째 줄도 객체 표현일 것이라 착각하게 만들고, 0부터 시작하는 인덱스를 놓치면 Venus를 고르게 됩니다.", "tags": ["배열 toString", "Object.toString 형식", "배열 요소 필드 접근"], "occurrences": ["certleader-B Q6 p101"], "verified": "compiled", "fixes": [], "no": 54}, {"id": 142, "topic": "arrays", "parts": [{"type": "text", "content": "This grid shows the state of a 2D array:"}, {"type": "code", "content": "+---+---+---+\n| 0 | 0 |   |\n+---+---+---+\n|   | X | 0 |\n+---+---+---+\n| X |   | X |\n+---+---+---+"}, {"type": "text", "content": "The grid is created with this code:"}, {"type": "code", "content": "char[][] grid = new char[3][3];\ngrid[1][1] = 'X';\ngrid[0][0] = '0';\ngrid[2][0] = 'X';\ngrid[0][1] = '0';\ngrid[2][2] = 'X';\ngrid[1][2] = '0';\n//line n1"}, {"type": "text", "content": "Which line of code, when inserted in place of //line n1, adds an X into the grid so that the grid contains three consecutive Xs?"}], "options": [{"key": "A", "text": "", "code": "grid[2][1] = 'X';"}, {"key": "B", "text": "", "code": "grid[3][2] = 'X';"}, {"key": "C", "text": "", "code": "grid[3][1] = 'X';"}, {"key": "D", "text": "", "code": "grid[2][3] = 'X';"}], "correct": "A", "dumpAnswer": "D", "answerNote": "덤프 정답 D는 틀렸습니다. `new char[3][3]`의 유효 인덱스는 0~2이므로 `grid[2][3]`은 ArrayIndexOutOfBoundsException을 던지며 X를 추가하지 못합니다. `grid[2][1] = 'X'`를 넣으면 마지막 행이 X X X가 되어 연속 세 개가 됩니다. 각 보기를 실행해 확인했습니다.", "summary": "`grid[행][열]`에서 마지막 행(인덱스 2)은 이미 [2][0], [2][2]가 X이므로 [2][1]에 X를 넣으면 가로로 X 세 개가 됩니다.", "walkthrough": "1. `new char[3][3]`은 3행 3열, 인덱스 0~2입니다. 첫 번째 인덱스가 행, 두 번째가 열입니다.\n2. 대입 결과: 행0 = ['0','0',빈칸], 행1 = [빈칸,'X','0'], 행2 = ['X',빈칸,'X']. 문제의 그림과 같습니다.\n3. 행2는 [2][0]과 [2][2]가 X이고 [2][1]만 비어 있으므로 `grid[2][1] = 'X'`를 넣으면 X X X가 완성됩니다.\n4. B, C, D는 인덱스 3을 사용하므로 런타임에 ArrayIndexOutOfBoundsException이 발생하고 아무것도 추가되지 않습니다(컴파일은 됨).", "optionNotes": {"A": "정답입니다. 3번째 행의 가운데 칸을 채워 [2][0], [2][1], [2][2]가 모두 X가 됩니다.", "B": "행 인덱스 3은 존재하지 않아(0~2) ArrayIndexOutOfBoundsException이 발생합니다.", "C": "행 인덱스 3은 범위를 벗어나므로 ArrayIndexOutOfBoundsException이 발생합니다.", "D": "열 인덱스 3은 범위를 벗어나 ArrayIndexOutOfBoundsException이 발생합니다. 1부터 세는 실수를 노린 보기입니다. 덤프 정답이지만 틀립니다."}, "concepts": [{"title": "2차원 배열의 인덱스와 범위", "body": "`new T[r][c]`로 만든 배열은 `arr[0..r-1][0..c-1]`만 유효합니다. 범위 밖 인덱스는 컴파일러가 잡지 않고(상수라도) 런타임에 ArrayIndexOutOfBoundsException이 발생합니다. `arr.length`는 행 수, `arr[i].length`는 i행의 열 수입니다.\n```java\nchar[][] g = new char[3][3];\ng[2][2] = 'X'; // 마지막 칸\n// g[3][0] = 'X'; // 런타임 예외\n```"}, {"title": "char 배열의 기본값", "body": "char 배열 요소의 기본값은 `'\\u0000'`(널 문자)이며 공백 ' '과 다릅니다. 출력하면 보이지 않는 문자가 찍힙니다. 시험의 그림에서 빈칸은 이 기본값을 의미합니다."}], "trap": "인덱스를 1부터 세면 마지막 칸을 [2][3]이나 [3][x]로 착각하게 됩니다. 길이 3 배열의 마지막 인덱스는 2입니다.", "tags": ["2차원 배열 인덱스", "배열 인덱스 범위", "ArrayIndexOutOfBoundsException"], "occurrences": ["certleader-B Q17 p105"], "verified": "compiled", "fixes": [], "no": 55}, {"id": 148, "topic": "arrays", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Test {\n    public static void main (String [] args) {\n        int numbers [ ];\n        numbers = new int [2];\n        numbers [0] = 10;\n        numbers [1] = 20;\n\n        numbers = new int [4];\n        numbers [2] = 30;\n        numbers [3] = 40;\n        for (int x : numbers) {\n            System.out.print (\" \" + x) ;\n        }\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 20 30 40", "code": null}, {"key": "B", "text": "0 0 30 40", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "An exception is thrown at runtime.", "code": null}], "correct": "B", "dumpAnswer": "C", "answerNote": "덤프 정답 C(컴파일 실패)는 틀렸습니다. `int numbers [ ];`처럼 대괄호를 변수 이름 뒤에 두고 사이에 공백을 넣는 것도 합법적인 선언입니다. 실제로 컴파일과 실행이 되며 ` 0 0 30 40`이 출력됩니다(javac/java로 확인). 정답은 B입니다.", "summary": "`numbers = new int[4]`로 새 배열을 대입하면 이전 값 10, 20은 사라지고, 기본값 0이 든 새 배열에 30, 40만 채워져 `0 0 30 40`이 출력됩니다.", "walkthrough": "1. `int numbers [ ];`는 `int[] numbers;`와 같은 선언입니다. 대괄호는 타입 뒤에도 변수명 뒤에도 둘 수 있고, 사이의 공백은 무시됩니다.\n2. `numbers = new int[2];` 다음 `[0]=10`, `[1]=20` → 첫 번째 배열은 `{10, 20}`입니다.\n3. `numbers = new int[4];`는 기존 배열을 늘리는 것이 아니라 길이 4인 **새 배열**을 만들어 참조를 바꿉니다. 새 int 배열의 요소는 모두 기본값 `0`으로 초기화됩니다 → `{0, 0, 0, 0}`.\n4. `[2]=30`, `[3]=40` → `{0, 0, 30, 40}`. 이전 배열 `{10, 20}`은 더 이상 참조되지 않아 GC 대상이 됩니다.\n5. 향상된 for문이 각 요소 앞에 공백을 붙여 출력하므로 ` 0 0 30 40`이 출력됩니다. 인덱스는 모두 0~3 범위라 예외도 없습니다.", "optionNotes": {"A": "배열은 크기를 늘릴 수 없습니다. `new int[4]`는 새 배열이므로 이전 배열의 10, 20이 복사되지 않습니다.", "B": "정답입니다. 새 배열의 0, 1번 요소는 기본값 0이고 2, 3번 요소만 30, 40으로 채워졌습니다.", "C": "`int numbers [ ];`는 C 스타일 배열 선언으로 Java에서도 합법이고, 선언과 생성을 분리한 것도 문제없습니다. 컴파일 에러가 날 곳이 없습니다.", "D": "접근한 인덱스는 모두 길이 4인 배열의 0~3 범위 안이므로 `ArrayIndexOutOfBoundsException`이 나지 않습니다."}, "concepts": [{"title": "배열 선언의 여러 형태", "body": "다음은 모두 합법입니다: `int[] a;`, `int a[];`, `int [] a;`, `int a [ ];`. 다차원은 `int[][] b;`, `int b[][];`, `int[] b[];`를 섞어 써도 됩니다. 주의할 점은 `int[] x, y;`는 둘 다 배열이지만 `int x[], y;`는 `x`만 배열이고 `y`는 int라는 것입니다. 선언부에 크기를 쓰는 `int[3] a;`는 컴파일 에러입니다. 크기는 `new int[3]`처럼 생성할 때만 지정합니다."}, {"title": "배열 요소의 기본값과 재할당", "body": "`new`로 만든 배열의 요소는 지역 변수 안에 있어도 자동으로 기본값으로 초기화됩니다: 정수형 `0`, `double` `0.0`, `boolean` `false`, `char` `'\\u0000'`, 참조형 `null`. 배열 길이는 생성 후 바뀌지 않으므로, 같은 변수에 `new`를 다시 대입하면 완전히 새로운 객체를 가리키게 됩니다. 기존 값을 유지하며 키우려면 `Arrays.copyOf`나 `System.arraycopy`를 써야 합니다."}], "trap": "`int numbers [ ];`라는 낯선 선언 형태로 컴파일 에러를 떠올리게 하고, 배열이 \"확장\"되어 10, 20이 남아 있을 것이라는 착각(A)을 노립니다.", "tags": ["배열 선언 문법", "배열 기본값", "참조 재할당"], "occurrences": ["certleader-B Q62 p112", "certleader-D Q15 p176"], "verified": "compiled", "fixes": [], "no": 56}, {"id": 154, "topic": "arrays", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int[][] arr = new int [2] [4];\n    arr[0] = new int []{1, 3, 5, 7};\n    arr[1] = new int []{1, 3};\n    for (int[] a : arr) {\n        for (int i : a) {\n            System.out.print(i+ \" \");\n        }\n        System.out.println();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "", "code": "1 3\n1 3"}, {"key": "C", "text": "followed by an ArrayIndexOutOfBoundsException", "code": "1 3"}, {"key": "D", "text": "", "code": "1 3\n1 3 0 0"}, {"key": "E", "text": "", "code": "1 3 5 7\n1 3"}], "correct": "E", "dumpAnswer": "E", "answerNote": "", "summary": "`arr[1]`에 길이 2인 새 배열을 대입하면 원래의 길이 4 행은 대체되므로, 출력은 `1 3 5 7` 다음 줄에 `1 3`입니다.", "walkthrough": "1. `new int[2][4]`는 길이 4인 int 배열 2개를 가진 2차원 배열을 만듭니다. 처음에는 모두 0입니다.\n2. `arr[0] = new int[]{1, 3, 5, 7};` → 0행이 새 배열(길이 4)로 교체됩니다.\n3. `arr[1] = new int[]{1, 3};` → 1행이 길이 2인 새 배열로 **교체**됩니다. Java의 2차원 배열은 \"배열의 배열\"이라 각 행의 길이가 달라도 됩니다. 원래 길이 4였다는 사실은 남지 않습니다.\n4. 바깥 for문은 행 배열을, 안쪽 for문은 그 행의 실제 길이만큼 요소를 순회합니다.\n- 0행: `1 3 5 7 ` 출력 후 줄바꿈\n- 1행: `1 3 ` 출력 후 줄바꿈\n향상된 for문은 각 행의 실제 길이를 따르므로 인덱스 초과 예외가 생기지 않습니다.", "optionNotes": {"A": "`new int[2][4]`로 만든 뒤 행에 다른 길이의 배열을 대입하는 것은 합법입니다. 행의 타입은 `int[]`이고 길이는 타입에 포함되지 않습니다.", "B": "0행에는 `{1, 3, 5, 7}`이 들어 있으므로 첫 줄이 `1 3`일 수 없습니다.", "C": "향상된 for문은 각 행의 `length`만큼만 돌기 때문에 `ArrayIndexOutOfBoundsException`이 발생하지 않습니다.", "D": "1행은 원래 길이 4 배열에 값을 덮어쓴 것이 아니라 길이 2인 새 배열로 대체되었으므로 `0 0`이 남지 않습니다. 첫 줄도 `1 3 5 7`이어야 합니다.", "E": "정답입니다. 각 행을 실제 길이만큼 출력하므로 `1 3 5 7` / `1 3`이 됩니다."}, "concepts": [{"title": "2차원 배열 = 배열의 배열", "body": "`int[][] arr = new int[2][4];`는 `int[]` 타입 요소 2개를 가진 배열이며, 각 요소가 길이 4인 `int[]`를 가리킵니다. 각 행은 독립된 객체이므로 `arr[1] = new int[]{1, 3};`처럼 다른 길이의 배열로 바꿀 수 있습니다(jagged array). `new int[2][]`처럼 두 번째 차원을 생략하면 행이 `null`로 시작하고, 이때 `arr[0][0]`에 접근하면 `NullPointerException`이 납니다. 첫 번째 차원은 생략할 수 없으므로 `new int[][4]`는 컴파일 에러입니다."}, {"title": "향상된 for문으로 2차원 배열 순회", "body": "`for (int[] row : arr)`의 변수 타입은 행 타입인 `int[]`이어야 하고, `for (int x : row)`는 그 행의 요소를 순회합니다. 반복 횟수는 각 배열의 실제 `length`로 정해지므로 행마다 길이가 달라도 안전합니다. 일반 for문에서 `arr[i].length` 대신 고정 숫자를 쓰면 jagged 배열에서 예외가 날 수 있으니 주의합니다."}], "trap": "`new int[2][4]` 선언 때문에 1행 길이가 여전히 4라고 생각해 `1 3 0 0`(D)을 고르게 하거나, 크기가 다른 배열 대입이 컴파일 에러라고 착각하게 만듭니다.", "tags": ["다차원 배열", "가변 길이(jagged) 배열", "향상된 for문"], "occurrences": ["certleader-B Q92 p115"], "verified": "compiled", "fixes": [], "no": 57}, {"id": "X14", "topic": "arrays", "tags": ["배열 length", "String length()", "배열 인덱스 0부터"], "parts": [{"type": "text", "content": "Given the following code:"}, {"type": "code", "content": "public static void main(String[] args){\n    String[] planets = {\"Mercury\", \"Venus\", \"Earth\", \"Mars\"};\n\n    System.out.println(planets.length);\n    System.out.println(planets[1].length());\n}"}, {"type": "text", "content": "What is the output?"}], "options": [{"key": "A", "text": "", "code": "4\n4"}, {"key": "B", "text": "", "code": "3\n5"}, {"key": "C", "text": "", "code": "4\n7"}, {"key": "D", "text": "", "code": "5\n4"}, {"key": "E", "text": "", "code": "4\n5"}, {"key": "F", "text": "", "code": "4\n21"}], "choose": 1, "correct": "E", "dumpAnswersAll": ["E", "B"], "answerNote": "E가 정답입니다(실제 실행 결과 `4` / `5`). 일부 사본(2부)이 B를 적었지만, 배열의 `length`는 마지막 인덱스(3)가 아니라 요소 개수(4)이므로 B는 틀립니다.", "verified": "compiled", "summary": "`planets.length`는 요소 개수 4, `planets[1]`은 두 번째 요소 \"Venus\"이므로 `length()`는 5입니다.", "walkthrough": "1. `planets`는 요소 4개짜리 String 배열입니다: 인덱스 0 \"Mercury\", 1 \"Venus\", 2 \"Earth\", 3 \"Mars\".\n2. `planets.length`는 배열의 **필드**로, 요소 개수 4를 돌려줍니다. 첫 줄에 `4`가 출력됩니다.\n3. 배열 인덱스는 0부터 시작하므로 `planets[1]`은 첫 번째가 아니라 두 번째 요소 \"Venus\"입니다.\n4. `\"Venus\".length()`는 String의 **메서드**로, 문자 수 5를 돌려줍니다. 둘째 줄에 `5`가 출력됩니다.\n5. 결과는 `4`와 `5`이므로 E입니다.", "optionNotes": {"A": "`planets[1]`은 \"Venus\"(5글자)이며, \"Mars\"(4글자)가 아닙니다.", "B": "`length`는 마지막 인덱스(3)가 아니라 요소 개수(4)입니다.", "C": "7은 \"Mercury\"의 길이입니다. 인덱스가 0부터 시작한다는 점을 놓치면 이렇게 고르게 됩니다.", "D": "배열 길이와 문자열 길이를 바꿔 쓴 값입니다. 배열 요소는 4개이고 \"Venus\"는 5글자입니다.", "E": "정답입니다. 배열 요소 개수 4, \"Venus\"의 글자 수 5가 각 줄에 출력됩니다.", "F": "21은 모든 행성 이름의 글자 수 합계(7+5+5+4)입니다. `planets[1].length()`는 한 요소의 길이만 구합니다."}, "concepts": [{"title": "배열 length 필드 vs String length() 메서드", "body": "배열의 길이는 `arr.length`(괄호 없는 final 필드), 문자열의 길이는 `str.length()`(메서드), `ArrayList`의 크기는 `list.size()`(메서드)입니다.\n\n- `arr.length()`라고 쓰거나 `str.length`라고 쓰면 컴파일 오류입니다.\n- 배열 인덱스는 0부터 `length - 1`까지이므로 `arr[arr.length]`는 `ArrayIndexOutOfBoundsException`을 일으킵니다.\n- 시험에서는 이 세 가지를 섞어서 컴파일 오류 보기를 자주 만듭니다."}], "trap": "인덱스 1을 첫 번째 요소(\"Mercury\", 7글자)로 착각하거나, `length`를 마지막 인덱스(3)로 착각하게 만드는 문제입니다.", "fixes": ["passleader 일부 사본에서 두 줄 출력 보기가 \"45\"처럼 한 줄로 붙어 인쇄된 것을 두 줄로 복원했습니다."], "occurrences": ["gratisexam-VCE (f12) Q21", "gratisexam-VCE (f13) Q24", "gratisexam-VCE (f20) Q37", "gratisexam-VCE (f9) Q21", "passleader-300q (f2) Q126", "passleader-300q (f2) Q17", "passleader-300q (f2) Q41", "scanned (f3) Q39"], "added": true, "dumpAnswer": "E/B", "no": 58}, {"id": "X15", "topic": "arrays", "tags": ["2차원 배열", "중첩 for 문", "배열 길이"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int num[][] = new int[1][3];\nfor (int i = 0; i < num.length; i++) {\n    for (int j = 0; j < num[i].length; j++) {\n        num[i][j] = 10;\n    }\n}"}, {"type": "text", "content": "Which option represents the state of the num array after successful completion of the outer loop?"}], "options": [{"key": "A", "text": "", "code": "num[0][0]=10\nnum[0][1]=10\nnum[0][2]=10"}, {"key": "B", "text": "", "code": "num[0][0]=10\nnum[1][0]=10\nnum[2][0]=10"}, {"key": "C", "text": "", "code": "num[0][0]=10\nnum[0][1]=0\nnum[0][2]=0"}, {"key": "D", "text": "", "code": "num[0][0]=10\nnum[0][1]=10\nnum[0][2]=10\nnum[0][3]=10\nnum[1][0]=0\nnum[1][1]=0\nnum[1][2]=0\nnum[1][3]=0"}], "choose": 1, "correct": "A", "dumpAnswersAll": ["A"], "answerNote": "", "verified": "compiled", "summary": "`new int[1][3]`은 행 1개, 열 3개짜리 배열이므로 `num[0][0]`~`num[0][2]` 세 칸이 모두 10이 됩니다.", "walkthrough": "1. `new int[1][3]`은 길이 1인 바깥 배열을 만들고, 그 유일한 원소 `num[0]`에 길이 3인 `int` 배열을 넣습니다. 모든 칸은 기본값 0으로 시작합니다.\n2. `num.length`는 1이므로 바깥 루프는 `i = 0` 한 번만 돕니다.\n3. `num[0].length`는 3이므로 안쪽 루프는 `j = 0, 1, 2`를 돕니다.\n4. `num[0][0]`, `num[0][1]`, `num[0][2]`에 차례로 10이 들어갑니다.\n5. 바깥 루프가 끝난 뒤 배열은 `num[0][0]=10, num[0][1]=10, num[0][2]=10`으로 A와 같습니다.", "optionNotes": {"A": "정답입니다. 행 하나에 열 3개가 있고 안쪽 루프가 세 칸을 모두 10으로 채웁니다.", "B": "첫 번째 크기와 두 번째 크기를 바꿔 읽은 결과입니다. `num[1]`, `num[2]`는 존재하지 않으며 접근하면 `ArrayIndexOutOfBoundsException`이 발생합니다.", "C": "안쪽 루프가 한 번만 도는 것처럼 본 오답입니다. `num[0].length`는 3이므로 세 칸 모두 대입됩니다.", "D": "`[1][3]`을 인덱스 0~1, 0~3까지 있는 배열로 오해한 결과입니다. 크기 지정값은 길이이므로 유효 인덱스는 `[0][0]`~`[0][2]`뿐이고, 원소도 3개뿐입니다."}, "concepts": [{"title": "다차원 배열의 생성과 length", "body": "Java의 2차원 배열은 '배열의 배열'입니다. `new int[R][C]`는 길이 R인 바깥 배열을 만들고 각 칸에 길이 C인 `int[]`를 넣습니다.\n\n- `num.length`는 행 수(R), `num[i].length`는 i번째 행의 길이(C)입니다.\n- 크기 지정값은 길이이고 유효 인덱스는 0부터 길이-1까지입니다. `new int[1][3]`의 유효 인덱스는 `[0][0]`~`[0][2]`입니다.\n- 원소 수는 R × C이고, 생성 직후 모든 칸은 기본값(int는 0)입니다.\n- `new int[2][]`처럼 두 번째 크기를 생략하면 각 행은 null이고 나중에 길이가 다른 행을 넣을 수 있습니다(가변 배열)."}, {"title": "중첩 루프의 경계는 length로", "body": "2차원 배열을 순회할 때 바깥 루프는 `i < arr.length`, 안쪽 루프는 `j < arr[i].length`로 쓰는 것이 안전합니다. 행마다 길이가 달라도 정확히 동작하고, 인덱스 초과 예외도 막아 줍니다. 향상된 for 문으로는 `for (int[] row : arr) for (int v : row)`처럼 씁니다."}], "trap": "`[1][3]`의 숫자를 인덱스 범위로 읽거나 행과 열을 뒤바꿔 읽게 만드는 함정입니다. 첫 번째 숫자가 행 수, 두 번째가 각 행의 길이입니다.", "fixes": [], "occurrences": ["gratisexam-VCE (f12) Q34", "gratisexam-VCE (f20) Q53", "gratisexam-VCE (f9) Q34", "passleader-300q (f2) Q26", "passleader-300q (f2) Q57", "scanned (f3) Q55"], "added": true, "dumpAnswer": "A", "no": 59}, {"id": 19, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "3. public static void main(String[] args) {\n4.     int x = 6;\n5.     while (isAvailable(x)) {\n6.         System.out.print(x);\n7.\n8.     }\n9. }\n10.\n11. public static boolean isAvailable(int x) {\n12.     return --x > 0 ? true : false;\n13. }"}, {"type": "text", "content": "Which modification enables the code to print 54321?"}], "options": [{"key": "A", "text": "Replace line 6 with System.out.print (--x);", "code": null}, {"key": "B", "text": "At line 7, insert x--;", "code": null}, {"key": "C", "text": "Replace line 5 with while (isAvailable(--x)) {", "code": null}, {"key": "D", "text": "Replace line 12 with return (x > 0) ? false : true;", "code": null}], "correct": "A", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. C `while (isAvailable(--x))`로 바꾸면 x가 루프 조건에서 먼저 줄어 5, 4, 3, 2를 출력하고, x가 1이 되면 `isAvailable(1)`이 `0 > 0` → false라 끝나므로 출력은 `5432`입니다. A(`print(--x)`)는 정확히 `54321`을 출력합니다. 보기 4개를 모두 실행해 A=54321, B=65432, C=5432, D=출력 없음을 확인했습니다.", "summary": "`isAvailable`은 x의 복사본만 줄이므로 main의 x는 따로 줄여야 하고, `print(--x)`로 바꾸면 54321이 출력됩니다.", "walkthrough": "원래 코드: `isAvailable(x)`의 `--x`는 매개변수 복사본만 줄이므로 main의 x는 계속 6입니다. `5 > 0`이 항상 true라 `6`이 무한히 출력됩니다.\nA `System.out.print(--x);`로 바꾸면:\n1. x=6: isAvailable(6) → 5>0 true → `--x`로 x=5, `5` 출력\n2. x=5: 4>0 true → x=4, `4`\n3. x=4: 3>0 true → x=3, `3`\n4. x=3: 2>0 true → x=2, `2`\n5. x=2: 1>0 true → x=1, `1`\n6. x=1: isAvailable(1) → 0>0 false → 종료\n출력 `54321`.\nC `while (isAvailable(--x))`: x=5 → 4>0 출력 5, x=4 → 출력 4, x=3 → 출력 3, x=2 → 1>0 출력 2, x=1 → 0>0 false. 출력 `5432`로 1이 빠집니다.\nB는 출력 후 감소라 `65432`, D는 6>0에서 false를 반환해 아무것도 출력하지 않습니다.", "optionNotes": {"A": "정답입니다. 전위 감소로 출력 전에 x를 줄이므로 5,4,3,2,1이 출력되고, x=1에서 `isAvailable`의 `0 > 0`이 false라 멈춥니다.", "B": "출력 후에 x를 줄이므로 처음 값 6부터 출력되어 `65432`가 됩니다.", "C": "조건에서 먼저 x를 줄이고, isAvailable 안에서 한 번 더(복사본) 줄여 비교하므로 x=1일 때 0>0이 false가 되어 `5432`에서 멈춥니다. 1이 출력되지 않습니다.", "D": "x=6일 때 `6 > 0`이 true라 false를 반환하므로 루프에 한 번도 들어가지 않고, 아무것도 출력하지 않습니다. 또 x가 바뀌지 않으므로 54321이 나올 수 없습니다."}, "concepts": [{"title": "전위(++x/--x)와 후위(x++/x--) 증감", "body": "전위는 먼저 값을 바꾸고 바뀐 값을 식의 결과로 쓰고, 후위는 기존 값을 식의 결과로 쓴 뒤 값을 바꿉니다. `int x = 5; print(--x);` → 4, `print(x--);` → 5(이후 x=4). 루프 조건에 증감을 넣으면 비교와 본문에서 보는 값이 달라지므로, 반복마다 (조건 평가 시 값, 본문 출력값, 변경 후 값)을 표로 추적하는 습관을 들이세요."}, {"title": "기본형 매개변수 변경은 호출자에 영향 없음", "body": "`isAvailable(int x)` 안의 `--x`는 매개변수 복사본만 바꿉니다. 그래서 루프 변수를 메서드에 넘겨 메서드 안에서 줄여도 호출한 쪽의 루프 변수는 그대로라, 무한 루프가 생길 수 있습니다. 호출자의 값을 바꾸려면 반환값을 받아 다시 대입하거나 호출자 쪽에서 직접 증감해야 합니다."}], "trap": "C처럼 조건에서 미리 감소시키면 그럴듯하지만, 메서드 안에서 한 번 더 감소한 값으로 비교하므로 마지막 1이 빠집니다. 끝값까지 직접 추적해야 합니다.", "tags": ["전위/후위 증감 연산자", "while 루프", "값에 의한 전달"], "occurrences": ["certleader-A Q36 p11", "certleader-D Q17 p176"], "verified": "compiled", "fixes": ["보기 C의 `is Available`을 `isAvailable`로 수정", "보기 B의 `x --;`를 `x--;`로 수정"], "no": 60}, {"id": 41, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int data[] = {2010, 2013, 2014, 2015, 2014};\n    int key = 2014;\n    int count = 0;\n    for (int e: data) {\n        if (e != key) {\n            continue;\n            count++;\n        }\n    }\n    System.out.print(count + \" Found\");\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "0 Found", "code": null}, {"key": "C", "text": "1 Found", "code": null}, {"key": "D", "text": "3 Found", "code": null}], "correct": "A", "dumpAnswer": "A/D", "answerNote": "덤프마다 A와 D로 표기가 다릅니다. 실제 정답은 A입니다. `continue;` 바로 다음의 `count++;`는 절대 실행될 수 없는 문장이라 `unreachable statement` 컴파일 에러가 납니다. D(3 Found)는 count++가 if 블록 밖에 있는 다른 변형 문제의 답으로 보입니다. 실행으로 확인했습니다.", "summary": "같은 블록에서 `continue;` 뒤에 오는 `count++;`는 도달할 수 없는 문장이므로 컴파일 에러가 납니다.", "walkthrough": "1. if 블록 `{ continue; count++; }` 안에서 `continue;`는 무조건 다음 반복으로 넘어갑니다.\n2. 따라서 바로 다음 문장 `count++;`는 어떤 경우에도 실행될 수 없습니다.\n3. Java는 도달할 수 없는 문장을 컴파일 에러(`unreachable statement`)로 처리합니다. `break`, `continue`, `return`, `throw` 바로 다음 문장이 대표적입니다.\n4. 그래서 출력값을 계산할 필요 없이 컴파일 실패입니다.\n\n참고: `count++`가 if 블록 밖에 있었다면 2014가 두 번 있으므로 `2 Found`가 나옵니다.", "optionNotes": {"A": "정답입니다. `continue;` 바로 뒤의 `count++;`가 도달할 수 없는 문장이라 컴파일 에러입니다.", "B": "count++가 결코 실행되지 않는다고 보고 0을 고른 것이지만, Java는 이런 코드를 아예 컴파일하지 않습니다.", "C": "컴파일되지 않으므로 출력이 없습니다. 실행되더라도 2014는 두 개라 1이 나올 이유가 없습니다.", "D": "2014가 아닌 원소(2010, 2013, 2015) 개수 3을 센 결과지만, 도달 불가능한 문장 때문에 컴파일되지 않습니다."}, "concepts": [{"title": "도달 불가능한 문장(unreachable statement)", "body": "같은 블록 안에서 `return`, `throw`, `break`, `continue` 바로 뒤에 문장이 있으면 컴파일 에러입니다. `while (true) { }` 같은 무한 루프 뒤(break가 없을 때)의 문장, `while (false) { ... }`의 본문도 도달 불가능합니다. 단, `if (false) { ... }`는 조건부 컴파일을 위해 예외적으로 허용됩니다."}, {"title": "break와 continue", "body": "`break`는 가장 안쪽의 반복문이나 switch를 빠져나가고, `continue`는 현재 반복의 나머지를 건너뛰고 다음 반복으로 갑니다. for 문에서 continue를 만나면 증감식이 실행된 뒤 조건을 검사합니다. 레이블(`outer:`)을 붙이면 바깥 반복문을 대상으로 지정할 수 있습니다."}], "trap": "들여쓰기 때문에 count++가 조건부로 실행되는 것처럼 보여 출력값을 계산하게 만듭니다. continue 바로 뒤의 문장은 컴파일 에러라는 점을 기억하세요.", "tags": ["continue", "도달 불가능한 코드"], "occurrences": ["exambible Q5 p27", "certleader-B Q7 p102", "surepassexam Q28 p57"], "verified": "compiled", "fixes": [], "no": 61}, {"id": 44, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int ii = 0;\n    int jj = 7;\n    for (ii = 0; ii < jj - 1; ii = ii + 2) {\n        System.out.print(ii + \" \");\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "2 4", "code": null}, {"key": "B", "text": "0 2 4 6", "code": null}, {"key": "C", "text": "0 2 4", "code": null}, {"key": "D", "text": "Compilation fails", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "조건식 `ii < jj - 1`은 `ii < 6`이므로 0, 2, 4까지만 출력됩니다.", "walkthrough": "`jj`가 7이므로 조건식 `ii < jj - 1`은 매 반복마다 `ii < 6`으로 평가됩니다. 증감식 `ii = ii + 2`는 `ii`를 2씩 늘립니다.\n1. `ii = 0`: `0 < 6`이 true이므로 `0 `을 출력합니다. 이후 `ii`는 2가 됩니다.\n2. `ii = 2`: `2 < 6`이 true이므로 `2 `를 출력합니다. 이후 `ii`는 4가 됩니다.\n3. `ii = 4`: `4 < 6`이 true이므로 `4 `를 출력합니다. 이후 `ii`는 6이 됩니다.\n4. `ii = 6`: `6 < 6`이 false이므로 루프가 끝납니다.\n따라서 출력은 `0 2 4 `입니다. `ii`를 루프 밖에서 선언하고 초기화부에서 다시 대입하는 것은 문법상 아무 문제가 없습니다.", "optionNotes": {"A": "첫 반복에서 `ii`는 0이고 `0 < 6`이 참이므로 0이 출력됩니다. 0을 빠뜨린 출력이라 틀립니다.", "B": "`ii`가 6이 되면 `6 < 6`이 거짓이 되어 루프가 끝나므로 6은 출력되지 않습니다.", "C": "정답입니다. `ii`가 0, 2, 4일 때만 조건이 참이므로 `0 2 4`가 출력됩니다.", "D": "루프 밖에서 선언한 변수를 for 초기화부에서 대입(`ii = 0`)하는 것은 합법이므로 컴파일 에러가 나지 않습니다."}, "concepts": [{"title": "for 문의 실행 순서", "body": "`for (초기화; 조건; 증감) 본문`은 초기화를 한 번 실행한 뒤 **조건 검사 → 본문 → 증감**을 반복합니다. 조건은 본문보다 먼저 검사되므로 처음부터 조건이 거짓이면 본문은 한 번도 실행되지 않습니다. 조건식 안의 산술식(`jj - 1`)도 매 반복마다 다시 계산합니다. 출력 문제에서는 표를 만들어 반복마다 변수 값과 조건 결과를 적어 보는 것이 가장 확실합니다."}, {"title": "for 초기화부의 선언과 대입", "body": "초기화부에는 새 변수 선언(`int i = 0`)과 기존 변수에 대한 대입(`i = 0`)을 모두 쓸 수 있습니다. 다만 둘을 섞을 수는 없고, 선언할 때는 한 가지 타입만 쓸 수 있습니다(`int i = 0, j = 0`은 되지만 `int i = 0, long j = 0`은 안 됨). 바깥에 이미 `ii`가 있는데 `for (int ii = 0; ...)`처럼 같은 이름을 다시 선언하면 컴파일 에러입니다. 이 문제처럼 바깥 변수를 쓰면 루프가 끝난 뒤에도 `ii`(여기서는 6)를 사용할 수 있습니다."}], "trap": "경계값 `ii < 6`에서 6이 포함되는지 헷갈리게 만들고, 루프 밖에서 선언한 변수를 다시 대입하는 형태로 컴파일 에러를 떠올리게 합니다.", "tags": ["for 루프 조건식", "증감식"], "occurrences": ["exambible Q8 p28", "certleader-C Q12 p144"], "verified": "compiled", "fixes": [], "no": 62}, {"id": 70, "topic": "loops", "parts": [{"type": "text", "content": "Given the following array:"}, {"type": "code", "content": "int[] intArr = {8, 16, 32, 64, 128};"}, {"type": "text", "content": "Which two code fragments, independently, print each element in this array? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "for (int i : intArr) {\n    System.out.print(intArr[i] +\" \");\n}"}, {"key": "B", "text": "", "code": "for (int i : intArr) {\n    System.out.print(i +\" \");\n}"}, {"key": "C", "text": "", "code": "for (int i=0 : intArr) {\n    System.out.print(intArr[i] +\" \");\n    i++;\n}"}, {"key": "D", "text": "", "code": "for (int i=0; i < intArr.length; i++) {\n    System.out.print(i +\" \");\n}"}, {"key": "E", "text": "", "code": "for (int i=0; i < intArr.length; i++) {\n    System.out.print(intArr[i] +\" \");\n}"}, {"key": "F", "text": "", "code": "for (int i; i < intArr.length; i++) {\n    System.out.print(intArr[i] +\" \");\n}"}], "correct": "BE", "dumpAnswer": "BE", "answerNote": "", "summary": "향상된 for문의 변수는 인덱스가 아니라 요소 값 자체이고, 일반 for문에서는 `intArr[i]`로 요소를 꺼내야 합니다.", "walkthrough": "각 선택지를 실제로 컴파일·실행했습니다.\n- A: `i`에는 8, 16, ... 같은 요소 값이 들어갑니다. 첫 반복에서 `intArr[8]`을 접근하므로 길이 5 배열에서 `ArrayIndexOutOfBoundsException`이 발생합니다.\n- B: `i`가 요소 값이므로 `8 16 32 64 128`이 출력됩니다.\n- C: 향상된 for문에는 초기화식(`=0`)을 쓸 수 없으므로 컴파일 에러입니다.\n- D: 인덱스 `0 1 2 3 4`를 출력할 뿐 요소를 출력하지 않습니다.\n- E: 인덱스 0~4로 `intArr[i]`를 출력하므로 `8 16 32 64 128`이 출력됩니다.\n- F: `int i;`로 선언만 하고 초기화하지 않았으므로 조건식 `i < intArr.length`에서 \"variable i might not have been initialized\" 컴파일 에러가 납니다.\n따라서 요소를 모두 출력하는 것은 B와 E입니다.", "optionNotes": {"A": "향상된 for문의 `i`는 요소 값(8, 16, ...)이므로 `intArr[8]` 접근 시 런타임에 `ArrayIndexOutOfBoundsException`이 발생합니다.", "B": "정답입니다. `i`가 각 요소 값을 차례로 받으므로 모든 요소가 출력됩니다.", "C": "향상된 for문 `for (Type var : 배열)`에는 `=0` 같은 초기화를 넣을 수 없어 컴파일 에러입니다.", "D": "컴파일·실행은 되지만 요소가 아니라 인덱스 `0 1 2 3 4`를 출력합니다.", "E": "정답입니다. 전형적인 인덱스 기반 for문으로 모든 요소를 출력합니다.", "F": "지역 변수 `i`가 초기화되지 않은 채 조건식에서 사용되므로 컴파일 에러입니다."}, "concepts": [{"title": "향상된 for문(enhanced for)", "body": "`for (int x : arr)`는 배열이나 `Iterable`의 요소를 처음부터 끝까지 하나씩 `x`에 복사해 줍니다. `x`는 인덱스가 아니라 요소 값이며, 인덱스가 필요하면 일반 for문을 써야 합니다. 루프 변수는 콜론 앞에서 새로 선언해야 하고(`for (x : arr)`처럼 기존 변수를 쓰면 컴파일 에러), 초기화식도 넣을 수 없습니다. 루프 안에서 `x`에 다른 값을 대입해도 원본 배열은 바뀌지 않습니다.\n```java\nint[] a = {1, 2};\nfor (int x : a) x = 0;      // a는 여전히 {1, 2}\n```"}, {"title": "지역 변수의 명시적 초기화", "body": "지역 변수는 기본값이 없으므로 값을 읽기 전에 반드시 초기화해야 합니다. 컴파일러가 확정 대입(definite assignment)을 확인할 수 없으면 \"might not have been initialized\" 에러를 냅니다. 반면 인스턴스/static 필드와 배열 요소는 기본값(`0`, `false`, `null` 등)으로 자동 초기화됩니다. for문의 초기화 부분에서 `int i;`처럼 선언만 하는 것은 문법상 허용되지만 조건식에서 읽는 순간 에러가 납니다."}], "trap": "향상된 for문의 변수를 인덱스로 착각하게 만드는 A와, 인덱스만 출력하는 D가 함정입니다.", "tags": ["향상된 for문", "for문 초기화", "ArrayIndexOutOfBoundsException"], "occurrences": ["surepassexam Q12 p54"], "verified": "compiled", "fixes": ["문제 끝에 빠진 '(Choose two.)'를 추가"], "no": 63}, {"id": 89, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main (String [ ] args) {\n    int [] stack = {10,20,30};\n    int size = 3;\n    int idx = 0;\n    /*line n1 */\n    System.out.print (\"The Top element: \" + stack [idx] );\n}"}, {"type": "text", "content": "Which code fragment, inserted at line n1, prints The Top element: 30?"}], "options": [{"key": "A", "text": "", "code": "do {\n    idx++;\n} while (idx >=size);"}, {"key": "B", "text": "", "code": "while (idx < size) {\n    idx++;\n}"}, {"key": "C", "text": "", "code": "do {\n    idx++;\n} while (idx <size -1);"}, {"key": "D", "text": "", "code": "do {\n    idx++;\n} while (idx<= size);"}, {"key": "E", "text": "", "code": "while (idx <= size -1) {\n    idx++;\n}"}], "correct": "C", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. A는 `do { idx++; } while (idx >= size);`에서 `idx`가 1이 된 뒤 조건 `1 >= 3`이 거짓이라 루프를 바로 빠져나와 `stack[1]`인 `The Top element: 20`을 출력합니다. `idx`를 2에서 멈추는 것은 C(`while (idx < size - 1)`)뿐입니다.", "summary": "`stack[2]`(30)를 출력하려면 `idx`가 정확히 2에서 멈춰야 하며, 이를 만족하는 것은 `do { idx++; } while (idx < size - 1);`인 C뿐입니다.", "walkthrough": "`idx = 0`, `size = 3`에서 시작하며, 30은 인덱스 2에 있으므로 루프 후 `idx == 2`여야 합니다. 각 선택지를 실행했습니다.\n- A: `idx++` → 1, 조건 `1 >= 3` 거짓 → 종료. `stack[1]` = **20** 출력.\n- B: `0<3`, `1<3`, `2<3`일 때 증가하여 `idx = 3`에서 종료. `stack[3]` → `ArrayIndexOutOfBoundsException`.\n- C: `idx++` → 1, `1 < 2` 참 → `idx++` → 2, `2 < 2` 거짓 → 종료. `stack[2]` = **30** 출력.\n- D: `idx`가 4가 될 때까지 증가(`3 <= 3`까지 참). `stack[4]` → 예외.\n- E: `idx <= 2`인 동안 증가해 `idx = 3`이 되므로 `stack[3]` → 예외.\n따라서 `The Top element: 30`을 출력하는 것은 C입니다.", "optionNotes": {"A": "do-while 본문이 한 번 실행되어 `idx = 1`이 된 뒤 `1 >= 3`이 거짓이라 종료하므로 `The Top element: 20`이 출력됩니다. 덤프 정답과 달리 30이 아닙니다.", "B": "`idx < size`인 동안 증가하므로 `idx = 3`에서 끝나고, `stack[3]` 접근 시 `ArrayIndexOutOfBoundsException`이 발생합니다.", "C": "정답입니다. `idx`가 1, 2로 증가한 뒤 `2 < 2`가 거짓이 되어 멈추므로 `stack[2]`인 30이 출력됩니다.", "D": "`idx <= size`인 동안 계속 증가해 `idx = 4`가 되므로 `stack[4]` 접근 시 예외가 발생합니다.", "E": "`idx <= size - 1`, 즉 `idx <= 2`인 동안 증가하므로 `idx = 3`에서 끝나고, `stack[3]` 접근 시 `ArrayIndexOutOfBoundsException`이 발생합니다."}, "concepts": [{"title": "do-while문의 실행 순서", "body": "do-while은 본문을 **먼저 한 번 실행한 뒤** 조건을 검사합니다. 따라서 조건이 처음부터 거짓이어도 본문은 최소 1회 실행됩니다. 반면 while은 조건을 먼저 검사하므로 0회 실행될 수 있습니다. do-while은 `while (조건);`처럼 끝에 세미콜론이 반드시 필요합니다. 루프 종료 후 변수 값을 구할 때는 \"마지막으로 조건이 거짓이 된 시점의 값\"을 추적하세요.\n```java\nint i = 5;\ndo { i++; } while (i < 3);  // 본문 1회 실행, i = 6\nwhile (i < 3) { i++; }       // 0회 실행\n```"}, {"title": "루프 종료 값 계산 요령", "body": "`while (i < n) i++;`처럼 1씩 증가하는 루프는 `i == n`에서 끝나고, `while (i <= n) i++;`은 `i == n + 1`에서 끝납니다. 이렇게 끝난 값을 배열 인덱스로 쓰면 범위를 벗어나기 쉽습니다(off-by-one 오류). 길이 `n`인 배열의 마지막 인덱스는 `n - 1`이므로, 마지막 요소에서 멈추려면 조건이 `i < n - 1`이어야 합니다(1씩 증가하고 0에서 시작할 때)."}], "trap": "do-while의 조건이 처음 검사에서 바로 거짓이 되어도 본문이 한 번 실행된다는 점, 그리고 종료 시 `idx` 값이 정확히 몇인지(off-by-one)를 따져야 합니다.", "tags": ["do-while문", "while문", "ArrayIndexOutOfBoundsException"], "occurrences": ["surepassexam Q79 p66"], "verified": "compiled", "fixes": ["`int [] stack = {10,20,30}` 뒤에 빠진 `;` 추가", "`inti dx = 0;`을 `int idx = 0;`으로 수정", "선택지 E의 `idx++` 뒤에 빠진 `;` 추가", "문제의 `pints`를 `prints`로 수정"], "no": 64}, {"id": 101, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int[] array = {1, 2, 3, 4, 5};"}, {"type": "text", "content": "And given the requirements:\n1. Process all the elements of the array in the order of entry.\n2. Process all the elements of the array in the reverse order of entry.\n3. Process alternating elements of the array in the order of entry.\nWhich two statements are true?"}], "options": [{"key": "A", "text": "Requirements 1, 2, and 3 can be implemented by using the enhanced for loop.", "code": null}, {"key": "B", "text": "Requirements 1, 2, and 3 can be implemented by using the standard for loop.", "code": null}, {"key": "C", "text": "Requirements 2 and 3 CANNOT be implemented by using the standard for loop.", "code": null}, {"key": "D", "text": "Requirement 1 can be implemented by using the enhanced for loop.", "code": null}, {"key": "E", "text": "Requirement 3 CANNOT be implemented by using either the enhanced for loop or the standard for loop.", "code": null}], "correct": "BD", "dumpAnswer": "BD", "answerNote": "", "summary": "표준 for문은 인덱스를 자유롭게 제어하므로 세 요구사항 모두 가능하고, 향상된 for문은 앞에서부터 모든 요소를 차례대로 처리하는 1번에 적합합니다.", "walkthrough": "- 요구사항 1(입력 순서대로 전체 처리): `for (int n : array)`로도, `for (int i = 0; i < array.length; i++)`로도 가능합니다.\n- 요구사항 2(역순 처리): 향상된 for문은 항상 처음부터 끝까지 한 방향으로만 돌기 때문에 역순으로 처리할 수 없습니다. 표준 for문은 `for (int i = array.length - 1; i >= 0; i--)`로 가능합니다.\n- 요구사항 3(하나 건너 하나 처리): 표준 for문은 `for (int i = 0; i < array.length; i += 2)`로 자연스럽게 구현합니다. 향상된 for문은 인덱스와 증감식을 지정할 수 없으므로 이런 용도에 맞지 않습니다(시험에서는 '구현할 수 없다'로 봅니다).\n따라서 B(표준 for문으로 1, 2, 3 모두 가능)와 D(향상된 for문으로 1 가능)가 참입니다.", "optionNotes": {"A": "향상된 for문은 인덱스 없이 앞에서부터 순서대로만 순회하므로 역순 처리(2)를 구현할 수 없습니다.", "B": "정답입니다. 표준 for문은 시작값, 조건, 증감식을 자유롭게 정할 수 있어 세 가지 모두 구현됩니다.", "C": "표준 for문으로 `i--`나 `i += 2`를 쓰면 2와 3을 구현할 수 있으므로 거짓입니다.", "D": "정답입니다. 모든 요소를 입력 순서대로 처리하는 것은 향상된 for문의 기본 동작입니다.", "E": "표준 for문에서 `i += 2`로 3번을 구현할 수 있으므로 거짓입니다."}, "concepts": [{"title": "향상된 for문(for-each)의 특징과 한계", "body": "`for (타입 변수 : 배열 또는 Iterable)` 형태로, 처음부터 끝까지 모든 요소를 차례대로 꺼냅니다. 인덱스에 접근할 수 없고, 역방향이나 건너뛰기 순회를 지정할 수 없습니다. 반복 변수에 값을 대입해도 배열 요소는 바뀌지 않습니다(복사본이기 때문입니다).\n```java\nint[] a = {1, 2, 3};\nfor (int n : a) { n = 0; } // a는 여전히 {1, 2, 3}\n```"}, {"title": "표준 for문의 구성", "body": "`for (초기화; 조건; 증감)`의 세 부분은 모두 생략 가능하며, 쉼표로 여러 변수를 다룰 수도 있습니다. 증감식에 `i--`, `i += 2` 등을 써서 역순·건너뛰기 순회가 가능하고, 인덱스로 요소를 수정할 수도 있습니다."}], "trap": "'모두 가능하다'는 A와 B 중 어느 반복문이 인덱스를 제어할 수 있는지 구분하게 하는 문제입니다. 향상된 for문은 방향과 간격을 바꿀 수 없습니다.", "tags": ["향상된 for문", "표준 for문", "반복문 선택"], "occurrences": ["surepassexam Q119 p73"], "verified": "reasoned", "fixes": [], "no": 65}, {"id": 104, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    String[] arr = {\"A\", \"B\", \"C\", \"D\"};\n    for (int i = 0; i < arr.length; i++) {\n        System.out.print(arr[i] + \" \");\n        if (arr[i].equals(\"C\")) {\n            continue;\n        }\n        System.out.println(\"Work done\");\n        break;\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "A B C Work done", "code": null}, {"key": "B", "text": "A B C D Work done", "code": null}, {"key": "C", "text": "A Work done", "code": null}, {"key": "D", "text": "Compilation fails", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "첫 요소 \"A\"는 \"C\"가 아니므로 continue를 건너뛰고 Work done 출력 후 break로 바로 반복이 끝납니다.", "walkthrough": "1. `i = 0`: `A `를 출력합니다. `\"A\".equals(\"C\")`가 false라서 `continue`는 실행되지 않습니다.\n2. 이어서 `Work done`을 `println`으로 출력합니다.\n3. 다음 문장 `break;`가 무조건 실행되어 for문 전체가 끝납니다.\n`B`, `C`, `D`는 처리되지 않습니다. 최종 출력은 `A Work done`입니다. `continue`가 실행되는 것은 요소가 `\"C\"`일 때뿐인데, 거기까지 도달하지 못합니다.", "optionNotes": {"A": "`break`가 조건 없이 첫 반복에서 실행되므로 `B`와 `C`까지 출력될 수 없습니다.", "B": "모든 요소를 출력하려면 `break`가 없어야 합니다. 첫 반복에서 루프가 끝나므로 틀렸습니다.", "C": "정답입니다. `A ` 출력 후 `Work done`을 찍고 `break`로 종료합니다.", "D": "`continue` 뒤에 `break`가 있어도 if 블록 안의 `continue`이므로 이후 문장은 도달 가능하며 문법 문제가 없습니다."}, "concepts": [{"title": "break와 continue", "body": "`break`는 가장 가까운 반복문(또는 switch)을 즉시 빠져나갑니다. `continue`는 현재 반복의 나머지를 건너뛰고 다음 반복(for문이라면 증감식 실행 후 조건 검사)으로 넘어갑니다. 라벨을 붙이면 바깥 반복문을 대상으로 할 수 있습니다(`break outer;`)."}, {"title": "도달할 수 없는 코드(unreachable statement)", "body": "블록 안에서 무조건적인 `break`, `continue`, `return`, `throw` 바로 뒤에 문장을 두면 컴파일 에러입니다.\n```java\nfor (;;) {\n    continue;\n    // System.out.println(); // 에러: unreachable\n}\n```\n그러나 이 문제처럼 `if` 안에 있는 `continue`는 조건부이므로 그 뒤 문장은 도달 가능하다고 판단됩니다."}], "trap": "`continue`에 시선을 끌어 \"C\"까지 진행될 것처럼 보이게 하지만, 실제로는 첫 반복의 무조건 `break`가 결과를 결정합니다.", "tags": ["continue/break", "for문 흐름"], "occurrences": ["surepassexam Q125 p74"], "verified": "compiled", "fixes": [], "no": 66}, {"id": 114, "topic": "loops", "parts": [{"type": "text", "content": "Given the following main method:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int num = 5;\n    do {\n        System.out.print(num-- +\" \");\n    } while(num == 0);\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "5 4 3 2 1 0", "code": null}, {"key": "B", "text": "5 4 3 2 1", "code": null}, {"key": "C", "text": "4 2 1", "code": null}, {"key": "D", "text": "5", "code": null}, {"key": "E", "text": "Nothing is printed", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "do-while은 본문을 최소 한 번 실행하므로 5를 출력하고, num이 4가 된 뒤 조건 num == 0이 false라 종료합니다.", "walkthrough": "1. `num = 5`입니다.\n2. do 블록이 조건 검사 없이 먼저 실행됩니다. `num--`는 후위 연산자라 현재 값 5를 사용해 `5 `를 출력하고, 그 후 `num`은 4가 됩니다.\n3. `while (num == 0)`에서 `4 == 0`은 false이므로 반복이 끝납니다.\n최종 출력은 `5 ` 하나입니다.", "optionNotes": {"A": "조건이 `num >= 0`이었다면 나올 출력입니다. 실제 조건은 `num == 0`이라 첫 반복 후 종료됩니다.", "B": "조건이 `num > 0`이었다면 나올 출력입니다. `4 == 0`이 false라 더 반복하지 않습니다.", "C": "어떤 해석으로도 나오지 않는 수열입니다. 후위 감소는 출력 후 값을 1씩 줄입니다.", "D": "정답입니다. do 본문이 한 번 실행되어 `5`를 출력하고, 조건이 false라 종료됩니다.", "E": "do-while은 조건과 관계없이 본문을 최소 한 번 실행하므로 아무것도 출력되지 않을 수는 없습니다."}, "concepts": [{"title": "while과 do-while의 차이", "body": "`while`은 조건을 먼저 검사하므로 처음부터 false면 본문이 한 번도 실행되지 않습니다. `do-while`은 본문을 먼저 실행한 뒤 조건을 검사하므로 최소 한 번은 실행됩니다. `do { } while (조건);`의 끝에는 세미콜론이 필요하다는 문법도 자주 출제됩니다."}, {"title": "전위/후위 증감 연산자", "body": "`x--`(후위)는 식의 값으로 현재 값을 쓴 후 감소시키고, `--x`(전위)는 먼저 감소시킨 후 그 값을 씁니다.\n```java\nint a = 5;\nint b = a--; // b = 5, a = 4\nint c = --a; // a = 3, c = 3\n```\n같은 식 안에서 같은 변수에 여러 번 쓰인 경우 왼쪽에서 오른쪽으로 하나씩 값을 적용하며 따라가십시오."}], "trap": "카운트다운 형태의 코드를 보여 주어 `5 4 3 2 1`을 고르게 유도하지만, 조건이 `num == 0`이라 한 번만 실행됩니다.", "tags": ["do-while", "후위 증감 연산자"], "occurrences": ["surepassexam Q158 p84", "certleader-B Q2 p100", "certleader-D Q2 p171"], "verified": "compiled", "fixes": [], "no": 67}, {"id": 123, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "3. public static void main(String[] args) {\n4.     int x = 5;\n5.     while (isAvailable(x)) {\n6.         System.out.print(x);\n7.\n8.     }\n9. }\n10.\n11. public static boolean isAvailable(int x) {\n12.     return x-- > 0 ? true : false;\n13. }"}, {"type": "text", "content": "Which modification enables the code to print 54321?"}], "options": [{"key": "A", "text": "Replace line 6 with System.out.print(--x);", "code": null}, {"key": "B", "text": "At line 7, insert x--;", "code": null}, {"key": "C", "text": "Replace line 6 with --x; and, at line 7, insert System.out.print(x);", "code": null}, {"key": "D", "text": "Replace line 12 with return (x > 0) ? false: true;", "code": null}], "correct": "B", "dumpAnswer": "A", "answerNote": "덤프 정답 A(line 6을 `System.out.print(--x);`로 교체)는 출력 전에 감소하므로 `43210`을 출력해 틀렸습니다(실행으로 확인). 정답은 B(line 7에 `x--;` 삽입)입니다.", "summary": "isAvailable 안의 `x--`는 복사본만 줄이므로 원래 코드는 무한 루프이고, main의 x를 출력 후 1씩 줄여야(line 7에 `x--;`) 54321이 나옵니다.", "walkthrough": "1. 원래 코드: main의 x=5. `isAvailable(x)`에는 값 5의 복사본이 전달되고, `x-- > 0`은 감소 전 값 5로 비교해 true를 반환합니다. 메서드 안의 x 감소는 main의 x와 무관합니다.\n2. 따라서 main의 x는 계속 5이고 `5`가 끝없이 출력되는 무한 루프입니다.\n3. line 7에 `x--;`를 넣으면: 5 출력→x=4, 4 출력→x=3, …, 1 출력→x=0, `isAvailable(0)`에서 `0 > 0`이 false라 종료합니다. 출력 `54321`.\n4. line 6을 `print(--x)`로 바꾸면 먼저 감소 후 출력하므로 4,3,2,1,0이 출력되고(x=0 이후 종료) `43210`입니다.\n5. `--x;` 후 `print(x)`도 같은 이유로 `43210`입니다.\n6. line 12를 `(x > 0) ? false : true`로 바꾸면 x=5에서 바로 false가 되어 아무것도 출력되지 않습니다.\n각 수정안을 실제로 실행해 위 결과를 확인했습니다.", "optionNotes": {"A": "출력 전에 감소(`--x`)하므로 4,3,2,1,0이 찍혀 `43210`이 출력됩니다. 덤프 정답이지만 틀립니다.", "B": "정답입니다. 출력 후 감소하므로 5,4,3,2,1이 찍히고 x가 0이 되면 `isAvailable(0)`이 false라 루프가 끝나 `54321`입니다.", "C": "먼저 `--x`로 감소한 뒤 출력하므로 `43210`입니다.", "D": "x=5일 때 `(5 > 0) ? false : true`가 false이므로 루프 본문이 한 번도 실행되지 않아 아무것도 출력되지 않습니다.", "E": "보기 D의 잘린 나머지(`print(x);`)로, 독립된 수정안이 아닙니다.", "F": "x=5일 때 `(5 > 0) ? false : true`가 false이므로 루프 본문이 한 번도 실행되지 않아 아무것도 출력되지 않습니다."}, "concepts": [{"title": "후위 vs 전위 증감 연산자", "body": "`x--`는 현재 값을 식의 결과로 쓴 뒤 감소시키고, `--x`는 먼저 감소시킨 뒤 새 값을 결과로 씁니다. 단독 문장(`x--;`)에서는 차이가 없지만 비교·출력·대입 식 안에서는 결과가 달라집니다.\n```java\nint x = 5;\nSystem.out.print(x--); // 5 출력, x=4\nSystem.out.print(--x); // 3 출력, x=3\n```"}, {"title": "기본형 인자의 증감은 호출자에게 반영되지 않음", "body": "메서드 매개변수는 인자 값의 복사본이므로 메서드 안에서 `x--`를 해도 호출한 쪽 변수는 그대로입니다. 루프 조건을 메서드로 분리했다면 루프 변수 변경은 루프 본문(호출자 쪽)에서 해야 루프가 끝납니다."}], "trap": "isAvailable 안의 `x--`가 main의 x를 줄인다고 착각하게 만들고, 전위 감소 `--x`로 출력이 한 칸씩 밀리는 점(43210)을 노립니다.", "tags": ["while 루프", "후위/전위 증감", "pass-by-value"], "occurrences": ["surepassexam Q196 p91"], "verified": "compiled", "fixes": ["`System.out.print`가 '.'에서 잘려 4개 보기가 A~F 6개로 나뉜 것을 원래 4개 보기(A: line 6을 `System.out.print(--x);`로 교체, B: line 7에 `x--;` 삽입, C: line 6을 `--x;`로 바꾸고 line 7에 `System.out.print(x);` 삽입, D: line 12 교체)로 재구성", "`System, ou`, `system, ou`, `x --`, `line7`, `With` 등 깨진 표기를 정상 코드/영문으로 수정", "보기 재구성에 따라 정답 표기를 C에서 B로 변경"], "no": 68}, {"id": 129, "topic": "loops", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public static void main(String[] args) {\n    int array[] = {10, 20, 30, 40, 50};\n    int x = array.length;\n    /* line n1 */\n}"}, {"type": "text", "content": "Which two code fragments can be independently inserted at line n1 to enable the code to print the elements of the array in reverse order?"}], "options": [{"key": "A", "text": "", "code": "while (x > 0) {x--;System.out.print(array[x]);}"}, {"key": "B", "text": "", "code": "do {x--;System.out.print(array[x]);} while (x >= 0);"}, {"key": "C", "text": "", "code": "while (x >= 0) {System.out.print(array[x]);x--;}"}, {"key": "D", "text": "", "code": "do {System.out.print(array[x]);--x;} while (x >= 0);"}, {"key": "E", "text": "", "code": "while (x > 0) {System.out.print(array[--x]);}"}], "correct": "AE", "dumpAnswer": "BE", "answerNote": "덤프 정답 BE는 틀렸습니다. B는 50~10을 출력한 뒤 x가 0일 때 조건 `x >= 0`이 참이라 한 번 더 돌아 `array[-1]`에서 ArrayIndexOutOfBoundsException이 납니다. 각 보기를 실행해 A와 E만 정상 종료함을 확인했습니다.", "summary": "x=5에서 시작하므로 '감소 후 접근'하면서 x>0일 때만 도는 A와 E만 인덱스 4~0을 정확히 출력하고 끝납니다.", "walkthrough": "x = array.length = 5, 유효 인덱스는 0~4입니다.\n1. A `while (x > 0) {x--; print(array[x]);}`: x를 4,3,2,1,0으로 줄이며 출력하고, x=0이면 조건 false로 종료합니다. 출력 `5040302010`.\n2. B `do {x--; print(array[x]);} while (x >= 0);`: 50~10까지 출력한 뒤 x=0에서 `0 >= 0`이 true라 한 번 더 실행해 x=-1, `array[-1]`에서 ArrayIndexOutOfBoundsException.\n3. C `while (x >= 0) {print(array[x]); x--;}`: 첫 반복에서 `array[5]`에 접근해 즉시 예외.\n4. D `do {print(array[x]); --x;} while (x >= 0);`: do-while이라 조건 검사 없이 `array[5]`부터 접근해 즉시 예외.\n5. E `while (x > 0) {print(array[--x]);}`: 전위 감소로 4~0 인덱스에 접근해 A와 같은 결과를 내고 정상 종료합니다.\n따라서 정답은 A, E입니다.", "optionNotes": {"A": "정답입니다. 출력 전에 x를 감소시키므로 인덱스 4부터 0까지 접근하고 x=0에서 루프가 끝납니다.", "B": "역순 출력은 되지만 x=0 이후 조건 `x >= 0`이 true라 한 번 더 돌면서 `array[-1]`로 ArrayIndexOutOfBoundsException이 발생합니다. 덤프 정답에 포함됐지만 틀립니다.", "C": "감소 전에 `array[5]`를 출력하려 하므로 첫 반복에서 ArrayIndexOutOfBoundsException이 발생합니다.", "D": "do-while은 본문을 먼저 실행하므로 `array[5]` 접근으로 즉시 예외가 납니다. 조건도 `x >= 0`이라 끝에서 -1까지 내려갑니다.", "E": "정답입니다. `array[--x]`는 감소된 값(4~0)으로 접근하며 x=0이 되면 조건 `x > 0`이 false라 종료합니다."}, "concepts": [{"title": "while과 do-while의 차이", "body": "while은 조건을 먼저 검사하므로 본문이 0번 실행될 수 있고, do-while은 본문을 먼저 실행한 뒤 조건을 검사하므로 최소 1번 실행됩니다. do-while은 `while (조건);`처럼 끝에 세미콜론이 필요합니다. 경계값 문제에서는 '마지막 반복 직후 조건이 어떻게 되는지'를 반드시 추적해야 합니다."}, {"title": "역순 순회의 경계 처리", "body": "길이 n 배열의 유효 인덱스는 0~n-1입니다. `x = n`에서 시작하면 접근 전에 감소시키고(`array[--x]`) 조건은 `x > 0`으로 둡니다. `x = n - 1`에서 시작하면 접근 후 감소시키고 조건은 `x >= 0`입니다. 두 방식을 섞으면 한쪽 끝에서 범위를 벗어납니다.\n```java\nfor (int i = arr.length - 1; i >= 0; i--) System.out.print(arr[i]);\n```"}], "trap": "B처럼 원하는 출력을 모두 찍은 뒤에 예외가 나는 코드를 정답처럼 보이게 만듭니다. 출력이 맞아도 예외로 끝나면 '역순 출력을 가능하게 하는 코드'로 볼 수 없습니다.", "tags": ["while vs do-while", "배열 인덱스 범위", "전위 감소"], "occurrences": ["surepassexam Q219 p94"], "verified": "compiled", "fixes": ["`array.lenth`의 오타를 `array.length`로 수정"], "no": 69}, {"id": "X6", "topic": "loops", "tags": ["for 문", "배열 인덱스", "증감식"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "int a[] = {1, 2, 3, 4, 5};\nfor (XXX) {\n    System.out.print(a[e]);\n}"}, {"type": "text", "content": "Which option can replace XXX to enable the code to print 135?"}], "options": [{"key": "A", "text": "", "code": "int e = 0; e <= 4; e++"}, {"key": "B", "text": "", "code": "int e = 0; e < 5; e += 2"}, {"key": "C", "text": "", "code": "int e = 1; e <= 5; e += 1"}, {"key": "D", "text": "", "code": "int e = 1; e < 5; e += 2"}], "choose": 1, "correct": "B", "dumpAnswersAll": ["B", "D"], "answerNote": "정답은 B입니다. 여러 gratisexam 사본이 D를 답으로 적었지만 보기와 코드는 모든 사본에서 같습니다. D는 인덱스 1, 3을 방문해 `24`를 출력하므로 오답입니다. 배열 인덱스가 0부터 시작한다는 점을 놓친 답안 오류입니다.", "verified": "compiled", "summary": "값 1, 3, 5는 인덱스 0, 2, 4에 있으므로 `e = 0`에서 시작해 2씩 증가시키는 B만 `135`를 출력합니다.", "walkthrough": "1. 배열 `a`는 `a[0]=1, a[1]=2, a[2]=3, a[3]=4, a[4]=5`입니다.\n2. `135`를 출력하려면 인덱스 0, 2, 4를 차례로 방문해야 합니다.\n3. B: `e=0` → `a[0]=1` 출력, `e=2` → `a[2]=3` 출력, `e=4` → `a[4]=5` 출력, `e=6`에서 `6 < 5`가 false라 종료합니다. 결과는 `135`입니다.\n4. A는 0~4를 모두 돌아 `12345`를 출력합니다.\n5. C는 `e=1`부터 5까지 돌며 `2345`를 출력한 뒤 `a[5]`에서 `ArrayIndexOutOfBoundsException`이 발생합니다.\n6. D는 `e=1`, `e=3`만 방문해 `24`를 출력하고 `e=5`에서 종료합니다.", "optionNotes": {"A": "인덱스 0부터 4까지 1씩 증가하므로 모든 요소를 출력해 `12345`가 됩니다.", "B": "정답입니다. 인덱스 0, 2, 4를 방문해 `135`를 출력하고 `e=6`에서 종료합니다.", "C": "인덱스 1부터 시작해 `2345`를 출력하고, `e=5`일 때 `a[5]`에 접근하면서 `ArrayIndexOutOfBoundsException`이 발생합니다.", "D": "인덱스 1, 3만 방문하므로 `24`가 출력됩니다. 1부터 센 '첫째, 셋째, 다섯째'를 인덱스로 착각하게 만든 보기입니다."}, "concepts": [{"title": "배열 인덱스와 for 문 경계", "body": "배열 인덱스는 0부터 `length - 1`까지입니다. 길이 5인 배열의 유효 인덱스는 0~4이고, `a[5]`에 접근하면 컴파일은 되지만 실행 중 `ArrayIndexOutOfBoundsException`이 발생합니다.\n\n- 모든 요소 순회: `for (int i = 0; i < a.length; i++)` 또는 `i <= a.length - 1`\n- 짝수 인덱스(첫째, 셋째, 다섯째 요소): `i = 0; i < a.length; i += 2`\n- 홀수 인덱스(둘째, 넷째 요소): `i = 1; i < a.length; i += 2`\n\n`<=`와 `<`, 시작값 0과 1의 조합이 시험에서 가장 자주 바뀌는 부분이므로 각 반복에서 인덱스 값을 직접 적어 보는 것이 안전합니다."}, {"title": "for 문의 실행 순서", "body": "`for (초기식; 조건식; 증감식) 본문`은 초기식을 한 번 실행한 뒤 `조건식 검사 → 본문 → 증감식`을 반복합니다. 조건식이 처음부터 false면 본문은 한 번도 실행되지 않습니다. 증감식에는 `e++`뿐 아니라 `e += 2`, `e--` 같은 임의의 식을 쓸 수 있고, 쉼표로 여러 식을 나열할 수도 있습니다(`i++, j--`)."}], "trap": "\"1, 3, 5번째 값\"이라는 생각에 시작값을 1로 고르게 만드는 함정입니다. Java 배열은 0부터 인덱스를 셉니다.", "fixes": ["보기의 `e < = 4`, `e + = 2`, `e+ =2` 같은 인쇄상 공백을 `<=`, `+=`로 정리했습니다.", "질문의 `xxx`를 코드와 맞춰 `XXX`로 표기했습니다."], "occurrences": ["gratisexam-VCE (f10) Q10", "gratisexam-VCE (f11) Q10", "gratisexam-VCE (f12) Q7", "gratisexam-VCE (f14) Q8", "gratisexam-VCE (f15) Q10", "gratisexam-VCE (f20) Q10", "gratisexam-VCE (f8) Q10", "gratisexam-VCE (f9) Q7", "passleader-300q (f2) Q10", "passleader-300q (f2) Q14", "passleader-300q (f2) Q200", "passleader-300q (f2) Q60", "scanned (f3) Q10"], "added": true, "dumpAnswer": "B/D", "no": 70}, {"id": 1, "topic": "methods", "parts": [{"type": "text", "content": "You are asked to create a method that accepts an array of integers and returns the highest value from that array.\nGiven the code fragment:"}, {"type": "code", "content": "class Test{\n    public static void main(String[] args) {\n        int numbers[] = {12, 13, 42, 32, 15, 156, 23, 51, 12};\n        int[] keys = findMax(numbers);\n    }\n\n    /* line n1 */ {\n        int[] keys = new int[3];\n        /* code goes here*/\n        return keys;\n    }\n}"}, {"type": "text", "content": "Which method signature do you use at line n1?"}], "options": [{"key": "A", "text": "public int findMax (int[] numbers)", "code": null}, {"key": "B", "text": "static int[] findMax (int[] max)", "code": null}, {"key": "C", "text": "static int findMax (int[] numbers)", "code": null}, {"key": "D", "text": "final int findMax (int[] )", "code": null}], "correct": "B", "dumpAnswer": "C", "answerNote": "덤프 정답 C는 틀렸습니다. C처럼 반환 타입이 `int`이면 메서드 본문의 `return keys;`(`int[]`)가 `int`로 변환되지 않고, main의 `int[] keys = findMax(numbers);`에서도 `int`를 `int[]`에 대입할 수 없어 컴파일 에러가 두 군데에서 납니다(javac로 확인). static이면서 `int[]`를 반환하는 B만 컴파일됩니다.", "summary": "static main에서 호출되고 int[]를 반환해야 하므로 `static int[] findMax(int[] max)`가 정답입니다.", "walkthrough": "시그니처가 만족해야 할 조건을 코드에서 하나씩 뽑아 보면 다음과 같습니다.\n1. `findMax(numbers)`는 static 메서드인 `main` 안에서 객체 없이 호출됩니다. 그러므로 `findMax`도 `static`이어야 합니다.\n2. 호출 결과를 `int[] keys`에 대입하므로 반환 타입은 `int[]`이어야 합니다.\n3. 메서드 본문이 `int[] keys = new int[3]; ... return keys;`이므로 이 부분에서도 반환 타입은 `int[]`여야 합니다.\n4. 인자로 `int[]` 하나를 넘기므로 매개변수는 `int[]` 타입 하나입니다. 매개변수 이름은 무엇이든 상관없습니다.\nB `static int[] findMax (int[] max)`만 네 조건을 모두 만족합니다. 매개변수 이름이 `max`라서 main의 `numbers`와 다르지만 이름은 호출과 무관합니다. 실제로 B를 넣어 컴파일하면 정상 실행되고, A/C/D는 모두 컴파일 에러가 납니다.", "optionNotes": {"A": "`static`이 없는 인스턴스 메서드라서 static `main`에서 `findMax(numbers)`로 직접 호출하면 \"non-static method cannot be referenced from a static context\" 에러가 납니다. 반환 타입 `int`도 `int[]`와 맞지 않습니다.", "B": "정답입니다. static이므로 main에서 직접 호출할 수 있고, 반환 타입 `int[]`가 본문의 `return keys;`와 호출부의 `int[] keys`에 모두 맞습니다.", "C": "static이라 호출은 되지만 반환 타입이 `int`입니다. 본문의 `return keys;`(`int[]` → `int`)와 main의 대입(`int` → `int[]`) 양쪽에서 incompatible types 컴파일 에러가 납니다.", "D": "`(int[] )`처럼 매개변수 이름이 없어 문법 오류(`<identifier> expected`)입니다. 게다가 static이 아니고 반환 타입도 `int`입니다."}, "concepts": [{"title": "static 문맥에서의 멤버 접근", "body": "static 메서드(`main` 포함)는 특정 객체 없이 실행되므로 `this`가 없습니다. 그래서 같은 클래스의 인스턴스 메서드나 인스턴스 변수를 이름만으로 쓸 수 없고, `new Test().findMax(...)`처럼 객체를 만들어서 호출해야 합니다. 반대로 인스턴스 메서드에서는 static 멤버를 자유롭게 쓸 수 있습니다. 시험에서는 static main에서 인스턴스 멤버를 직접 쓰는 코드가 자주 나오는데, 이런 코드는 컴파일 에러입니다."}, {"title": "메서드 선언의 구성과 반환 타입 일치", "body": "메서드 선언은 `[접근제어자] [static/final/abstract 등] 반환타입 이름(매개변수목록) [throws ...]` 순서입니다. 매개변수마다 타입과 이름이 모두 있어야 하고, 이름은 호출하는 쪽 변수명과 같을 필요가 없습니다. `return` 식의 타입은 선언된 반환 타입에 대입할 수 있어야 하고, 호출 결과를 받는 변수도 반환 타입을 받을 수 있어야 합니다. 배열 타입 `int[]`와 `int`는 서로 변환되지 않습니다."}], "trap": "매개변수 이름이 `numbers`인 C를 고르게 유도합니다. 이름 일치는 상관없고, 반환 타입 `int[]`와 static 여부를 봐야 합니다.", "tags": ["메서드 시그니처", "static 메서드 호출", "반환 타입"], "occurrences": ["certleader-A Q1 p2", "certleader-B Q1 p100", "certleader-C Q3 p140"], "verified": "compiled", "fixes": [], "no": 71}, {"id": 2, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        Test ts = new Test();\n        System.out.print(isAvailable + \" \");\n        isAvailable= ts.doStuff();\n        System.out.println(isAvailable);\n    }\n    public static boolean doStuff() {\n        return !isAvailable;\n    }\n    static boolean isAvailable = true;\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "false true", "code": null}, {"key": "C", "text": "true false", "code": null}, {"key": "D", "text": "true true", "code": null}, {"key": "E", "text": "false false", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "static 필드 `isAvailable`은 선언 위치와 관계없이 메서드 안에서 쓸 수 있어 \"true false\"가 출력됩니다.", "walkthrough": "1. 클래스가 로드되면서 static 필드 `isAvailable`이 `true`로 초기화됩니다. 선언이 클래스 맨 아래에 있어도 메서드 본문에서 쓰는 데에는 문제가 없습니다.\n2. `Test ts = new Test();`로 객체를 하나 만듭니다.\n3. `System.out.print(isAvailable + \" \");` → `\"true \"`를 출력합니다.\n4. `ts.doStuff()`는 static 메서드를 참조 변수로 호출한 것이고, 문법상 허용됩니다(경고 수준). `!isAvailable`은 `!true`이므로 `false`를 반환하고, 이 값이 `isAvailable`에 대입됩니다.\n5. `System.out.println(isAvailable);` → `false`를 출력합니다.\n최종 출력은 `true false`이고, 실제 실행 결과도 같습니다.", "optionNotes": {"A": "컴파일 에러는 나지 않습니다. 필드 선언이 아래에 있어도 메서드 본문에서 참조할 수 있고, static 메서드를 참조 변수 `ts`로 호출하는 것도 허용됩니다.", "B": "처음 출력 시점의 `isAvailable`은 초기값 `true`이므로 첫 단어가 false일 수 없습니다.", "C": "정답입니다. 초기값 `true`를 출력한 뒤 `!true`인 `false`가 대입되어 `false`를 출력합니다.", "D": "`doStuff()`가 `!isAvailable`을 반환해 값이 `false`로 바뀌므로 두 번째 값은 true가 아닙니다.", "E": "첫 출력은 초기값 `true`입니다."}, "concepts": [{"title": "필드 전방 참조 규칙", "body": "메서드 본문, 생성자 등 실행 코드 안에서는 클래스 안 어디에 선언된 필드든 참조할 수 있습니다. 선언 순서가 문제가 되는 곳은 필드 초기화식과 초기화 블록뿐입니다. 예를 들어 `static int a = b; static int b = 1;`은 illegal forward reference 컴파일 에러입니다. 시험에서 필드 선언이 클래스 맨 끝에 있다는 것만으로는 에러가 아닙니다."}, {"title": "참조 변수로 static 멤버 호출", "body": "`ts.doStuff()`처럼 인스턴스 참조로 static 메서드를 호출해도 컴파일됩니다. 컴파일러는 변수의 선언 타입으로 static 메서드를 찾고, 실제 객체는 쓰지 않습니다. 그래서 `Test ts = null; ts.doStuff();`도 NullPointerException 없이 실행됩니다. static 메서드는 오버라이딩되지 않고 숨겨지는(hiding) 것뿐이라, 다형성도 적용되지 않습니다."}], "trap": "필드가 아래쪽에 선언되었거나 static 메서드를 인스턴스로 호출했다는 이유로 \"Compilation fails\"를 고르게 하는 함정입니다.", "tags": ["static 변수", "전방 참조", "논리 부정 연산자"], "occurrences": ["certleader-A Q2 p2"], "verified": "compiled", "fixes": [], "no": 72}, {"id": 8, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Product {\n    double price;\n}\n\npublic class Test {\n    public void updatePrice(Product product, double price) {\n        price = price * 2;\n        product.price = product.price + price;\n    }\n    public static void main(String[] args) {\n        Product prt = new Product();\n        prt.price = 200;\n        double newPrice = 100;\n\n        Test t = new Test();\n        t.updatePrice(prt, newPrice);\n        System.out.println(prt.price + \" : \" + newPrice);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "200.0 : 100.0", "code": null}, {"key": "B", "text": "400.0 : 200.0", "code": null}, {"key": "C", "text": "400.0 : 100.0", "code": null}, {"key": "D", "text": "Compilation fails.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "기본형 인자는 복사본이라 원본이 바뀌지 않고, 참조로 넘긴 객체의 필드 변경은 원본에 반영되어 \"400.0 : 100.0\"입니다.", "walkthrough": "1. `prt.price = 200` → 200.0, `newPrice = 100` → 100.0.\n2. `t.updatePrice(prt, newPrice)` 호출 시 매개변수 `product`에는 `prt`의 참조값 복사본이, `price`에는 100.0의 복사본이 들어갑니다.\n3. `price = price * 2;` → 지역 매개변수 `price`만 200.0이 됩니다. main의 `newPrice`는 그대로 100.0입니다.\n4. `product.price = product.price + price;` → `product`는 main의 `prt`와 같은 객체를 가리키므로 그 객체의 `price`가 200.0 + 200.0 = 400.0으로 바뀝니다.\n5. main으로 돌아와 `prt.price + \" : \" + newPrice` → `400.0 : 100.0`.\ndouble을 출력하면 `400.0`처럼 소수점이 붙는다는 점도 확인하세요.", "optionNotes": {"A": "객체 필드 변경은 메서드가 끝나도 유지되므로 `prt.price`는 400.0으로 바뀝니다.", "B": "`price = price * 2`는 매개변수 복사본만 바꾸므로 main의 `newPrice`는 100.0 그대로입니다.", "C": "정답입니다. 같은 객체를 통해 바뀐 필드는 400.0이고, 기본형 변수 newPrice는 100.0으로 유지됩니다.", "D": "매개변수 이름 `price`가 Product의 필드 이름과 같아도, 매개변수와 `product.price`는 구분되므로 문제없이 컴파일됩니다."}, "concepts": [{"title": "Java는 항상 값에 의한 전달(pass-by-value)", "body": "메서드 호출 시 인자의 값이 매개변수로 복사됩니다. 기본형은 값 자체가 복사되므로 메서드 안에서 바꿔도 호출한 쪽 변수는 그대로입니다. 참조형은 참조값(주소)이 복사되므로, 그 참조를 통해 객체 상태를 바꾸면(`product.price = ...`) 호출한 쪽에서도 보입니다. 하지만 매개변수에 새 객체를 대입하는 것(`product = new Product();`)은 호출한 쪽 변수에 영향을 주지 않습니다. String이나 래퍼 클래스는 불변이라 메서드 안에서 \"바꾼\" 것처럼 보여도 실제로는 새 객체를 대입한 것이므로 원본이 바뀌지 않습니다."}, {"title": "섀도잉: 매개변수와 필드 이름이 같을 때", "body": "메서드 안에서 단순 이름 `price`는 가장 가까운 범위의 변수, 즉 매개변수를 가리킵니다. 같은 이름의 필드에 접근하려면 `this.price`나 `객체.price`처럼 한정해야 합니다. 세터에서 `price = price;`라고 쓰면 매개변수에 자기 자신을 대입하는 것이라 필드가 바뀌지 않는 것이 단골 함정입니다."}], "trap": "메서드 안에서 `price`가 200으로 바뀌었으니 newPrice도 200이라고 생각하게 하는 함정입니다.", "tags": ["값에 의한 전달", "참조 전달과 객체 변경"], "occurrences": ["certleader-A Q8 p5", "2passeasy Q7 p19", "certleader-B Q25 p105"], "verified": "compiled", "fixes": [], "no": 73}, {"id": 9, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class X {\n    static int i;\n    int j;\n    public static void main(String[] args) {\n        X x1 = new X();\n        X x2 = new X();\n        x1.i = 3;\n        x1.j = 4;\n        x2.i = 5;\n        x2.j = 6;\n        System.out.println(\n            x1.i + \" \" +\n            x1.j + \" \" +\n            x2.i + \" \" +\n            x2.j);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "3 4 5 6", "code": null}, {"key": "B", "text": "3 4 3 6", "code": null}, {"key": "C", "text": "5 4 5 6", "code": null}, {"key": "D", "text": "3 6 4 6", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "static 필드 `i`는 모든 객체가 공유하므로 마지막 값 5가 양쪽에서 보이고, 인스턴스 필드 `j`는 객체마다 따로 있습니다.", "walkthrough": "1. `i`는 static이라 클래스에 하나만 있습니다. `j`는 인스턴스 필드라 `x1`, `x2`가 각각 갖습니다.\n2. `x1.i = 3;` → `X.i = 3`.\n3. `x1.j = 4;` → x1의 j = 4.\n4. `x2.i = 5;` → 같은 `X.i`를 5로 덮어씁니다.\n5. `x2.j = 6;` → x2의 j = 6.\n6. 출력 시 `x1.i`와 `x2.i`는 모두 `X.i`(5)를 읽고, `x1.j` = 4, `x2.j` = 6입니다.\n결과: `5 4 5 6`.", "optionNotes": {"A": "`i`를 객체마다 따로 있는 인스턴스 변수로 착각한 결과입니다. static이라 `x2.i = 5`가 공유 값을 덮어씁니다.", "B": "`x2.i`가 3으로 남을 수 없습니다. 마지막 대입 5가 공유 값이고, `x1.i`도 5입니다.", "C": "정답입니다. static `i`는 5로 공유되고, `j`는 각각 4와 6입니다.", "D": "`x1.j`는 4이고 `x2.i`는 5입니다. j가 공유된다고 본 엉뚱한 조합입니다."}, "concepts": [{"title": "static(클래스) 변수와 인스턴스 변수", "body": "static 변수는 클래스가 로드될 때 한 번 만들어지고 모든 인스턴스가 같은 저장소를 공유합니다. `X.i`, `x1.i`, `x2.i`는 모두 같은 변수입니다(참조로 접근하는 것도 허용되지만 권장되지는 않습니다). 인스턴스 변수는 `new`할 때마다 새로 만들어집니다. static 메서드에서는 인스턴스 변수에 직접 접근할 수 없지만, 이 문제처럼 `x1.j`처럼 객체 참조를 통하면 접근할 수 있습니다. 객체 수를 세는 카운터(`static int count; X(){ count++; }`)가 대표적인 활용 예입니다."}], "trap": "`x1.i`라는 표기 때문에 객체마다 별도의 i가 있다고 착각하게 만듭니다.", "tags": ["static 변수 공유", "인스턴스 변수"], "occurrences": ["certleader-A Q9 p5", "2passeasy Q8 p20", "certleader-B Q27 p106", "certleader-C Q23 p147", "certleader-D Q7 p173", "surepassexam Q122 p73"], "verified": "compiled", "fixes": [], "no": 74}, {"id": 14, "topic": "methods", "parts": [{"type": "text", "content": "Given this class:"}, {"type": "code", "content": "public class CheckingAccount {\n    public int amount;\n    //line n1\n}"}, {"type": "text", "content": "And given this main method, located in another class:"}, {"type": "code", "content": "public static void main(String[] args) {\n    CheckingAccount acct = new CheckingAccount();\n    //line n2\n}"}, {"type": "text", "content": "Which three pieces of code, when inserted independently, set the value of amount to 100? (Choose three.)"}], "options": [{"key": "A", "text": "At line n1 insert:", "code": "public CheckingAccount(){\n    amount = 100;\n}"}, {"key": "B", "text": "At line n2 insert:", "code": "this.amount = 100;"}, {"key": "C", "text": "At line n2 insert:", "code": "amount = 100;"}, {"key": "D", "text": "At line n1 insert:", "code": "public CheckingAccount(){\n    this.amount = 100;\n}"}, {"key": "E", "text": "At line n2 insert:", "code": "acct.amount = 100;"}, {"key": "F", "text": "At line n1 insert:", "code": "public CheckingAccount(){\n    acct.amount = 100;\n}"}], "correct": "ADE", "dumpAnswer": "BCE/DE", "answerNote": "덤프마다 정답이 BCE/DE로 다르고, 둘 다 틀렸습니다. 실제 정답은 A, D, E입니다(문제도 '세 개'를 요구합니다). A와 D는 생성자에서 필드에 100을 대입하고(`this.` 생략 여부만 다름), E는 다른 클래스의 main에서 참조 변수로 public 필드에 대입합니다. B는 static main에서 `this`를 쓰므로, C는 다른 클래스에 `amount`라는 변수가 없으므로, F는 생성자 안에 `acct`라는 변수가 없으므로 컴파일 에러입니다. 보기마다 별도로 javac/java를 실행해 A/D/E는 100 출력, B/C/F는 컴파일 에러임을 확인했습니다.\n\n**덤프 사본 비교:** 생성자 안에서 `amount = 100`(A)이나 `this.amount = 100`(D)으로, 또는 외부에서 `acct.amount = 100`(E)으로 설정할 수 있습니다. certleader 사본의 답 DE는 A가 빠져 있습니다. surepass 사본은 보기 순서가 달라 정답이 CDE이고, 표기된 BCE의 B(`This. amount`)는 컴파일되지 않습니다.", "summary": "필드 값은 생성자 안에서 `amount`/`this.amount`로, 외부에서는 `acct.amount`로 설정할 수 있습니다.", "walkthrough": "보기를 하나씩 넣어 본 결과입니다.\n- A (n1) `public CheckingAccount(){ amount = 100; }` → 생성자 안에서 `amount`는 이 객체의 필드를 뜻합니다(`this.amount`와 같음). `new CheckingAccount()` 시 100이 됩니다. 실행 결과 100.\n- B (n2) `this.amount = 100;` → main은 static이라 `this`가 없습니다: \"non-static variable this cannot be referenced from a static context\" 컴파일 에러.\n- C (n2) `amount = 100;` → main은 다른 클래스에 있으므로 `amount`라는 이름이 범위 안에 없습니다: cannot find symbol.\n- D (n1) `this.amount = 100;` 생성자 → A와 같은 효과. 실행 결과 100.\n- E (n2) `acct.amount = 100;` → `amount`가 public이라 다른 클래스에서 참조 변수를 통해 접근할 수 있습니다. 실행 결과 100.\n- F (n1) 생성자 안의 `acct.amount = 100;` → `acct`는 main의 지역 변수라 생성자에서 보이지 않습니다: cannot find symbol.\n정답은 A, D, E입니다.", "optionNotes": {"A": "정답입니다. 생성자 안에서 단순 이름 `amount`는 인스턴스 필드를 가리키므로 객체 생성 시 100이 설정됩니다.", "B": "main은 static 메서드라 `this`를 쓸 수 없고, 다른 클래스에 있으므로 `this`가 있더라도 CheckingAccount가 아닙니다. 컴파일 에러입니다.", "C": "main이 있는 클래스에는 `amount`라는 필드나 지역 변수가 없으므로 cannot find symbol 컴파일 에러입니다.", "D": "정답입니다. `this.amount`로 현재 생성 중인 객체의 필드에 100을 대입합니다.", "E": "정답입니다. public 필드이므로 다른 클래스에서 `acct.amount = 100;`으로 직접 대입할 수 있습니다.", "F": "`acct`는 다른 클래스 main의 지역 변수라 CheckingAccount 생성자의 범위 밖입니다. cannot find symbol 컴파일 에러입니다."}, "concepts": [{"title": "this와 static 문맥", "body": "`this`는 현재 객체를 가리키는 참조로, 인스턴스 메서드, 생성자, 인스턴스 초기화 블록에서만 쓸 수 있습니다. static 메서드에는 현재 객체가 없으므로 `this`나 `super`를 쓰면 컴파일 에러입니다. 인스턴스 문맥에서 필드 이름을 단독으로 쓰면 컴파일러가 `this.`를 자동으로 붙여 해석합니다. 다만 같은 이름의 지역 변수나 매개변수가 있으면 그것이 우선하므로, 그때는 `this.`를 명시해야 필드에 접근할 수 있습니다."}, {"title": "변수의 범위(scope)", "body": "지역 변수는 선언된 블록 `{}` 안에서만 보입니다. 다른 메서드나 생성자에서는 이름이 같아도 접근할 수 없습니다. 다른 클래스의 필드에 접근하려면 `참조.필드`(인스턴스 필드) 또는 `클래스명.필드`(static 필드) 형태로 써야 하고, 접근 제어자(public/protected/default/private)가 허용해야 합니다. 이 문제의 `amount`는 public이라 어느 클래스에서든 `acct.amount`로 접근할 수 있습니다."}], "trap": "B `this.amount`가 그럴듯해 보이지만 static main에는 this가 없습니다. 같은 이름 `acct`가 생성자에서도 보일 것 같은 F도 함정입니다.", "tags": ["생성자", "this 키워드", "static 문맥", "변수 범위"], "occurrences": ["certleader-A Q23 p8", "certleader-B Q51 p110", "certleader-C Q40 p149", "certleader-D Q10 p174", "surepassexam Q164 p85"], "verified": "compiled", "fixes": ["정답이 세 개(choose 3)이므로 지문 끝에 `(Choose three.)` 추가"], "no": 75}, {"id": 17, "topic": "methods", "parts": [{"type": "text", "content": "What is the name of the Java concept that uses access modifiers to protect variables and hide them within a class?"}], "options": [{"key": "A", "text": "Encapsulation", "code": null}, {"key": "B", "text": "Inheritance", "code": null}, {"key": "C", "text": "Abstraction", "code": null}, {"key": "D", "text": "Instantiation", "code": null}, {"key": "E", "text": "Polymorphism", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "접근 제어자(주로 private)로 필드를 숨기고 메서드로만 접근하게 하는 개념은 캡슐화(Encapsulation)입니다.", "walkthrough": "1. 문제는 접근 제어자로 변수를 보호하고 클래스 안에 숨기는 개념을 묻습니다.\n2. 필드를 `private`으로 선언하고 `public` getter/setter로만 접근하게 하는 설계가 캡슐화(Encapsulation, 정보 은닉)입니다.\n3. 상속은 기존 클래스를 확장하는 것, 추상화는 핵심 특징만 모델링하는 것, 인스턴스화는 `new`로 객체를 만드는 것, 다형성은 하나의 참조 타입이 여러 형태의 객체를 다루는 것입니다.\n따라서 정답은 A입니다.", "optionNotes": {"A": "정답입니다. private 필드와 public 접근 메서드로 내부 데이터를 숨기고 보호하는 것이 캡슐화입니다.", "B": "상속은 `extends`로 상위 클래스의 멤버를 물려받아 재사용하는 개념으로, 데이터를 숨기는 것과는 다릅니다.", "C": "추상화는 불필요한 세부를 감추고 핵심 동작만 정의하는 설계 개념(추상 클래스, 인터페이스 등)으로, 접근 제어자로 변수를 숨기는 것을 직접 가리키지 않습니다.", "D": "인스턴스화는 `new`로 클래스의 객체를 생성하는 행위입니다.", "E": "다형성은 상위 타입 참조로 여러 하위 객체를 다루고 오버라이딩된 메서드가 실행되는 성질입니다."}, "concepts": [{"title": "캡슐화와 JavaBean 스타일", "body": "캡슐화는 필드를 `private`으로 감추고, 필요한 경우에만 `public` 메서드(getter/setter)로 읽기/쓰기를 허용하는 설계입니다. setter에서 값의 유효성을 검사하거나, setter를 아예 두지 않아 읽기 전용으로 만들 수 있습니다. 시험에서 \"캡슐화가 잘 된 클래스\"를 고르라고 하면 인스턴스 변수가 private이고 접근 메서드가 public인지 보면 됩니다. 필드가 public이면 캡슐화가 깨진 것입니다."}, {"title": "접근 제어자 4단계", "body": "`private`(같은 클래스) < default/package-private(같은 패키지) < `protected`(같은 패키지 + 다른 패키지의 하위 클래스, 상속을 통해서만) < `public`(어디서나). 최상위 클래스에는 `public`이나 default만 쓸 수 있습니다. 오버라이딩할 때는 접근 범위를 좁힐 수 없습니다."}], "trap": "정보를 \"숨긴다\"는 표현 때문에 Abstraction을 고르게 하는 함정입니다. 접근 제어자로 데이터를 보호하는 것은 Encapsulation입니다.", "tags": ["캡슐화", "접근 제어자"], "occurrences": ["certleader-A Q30 p10", "certleader-B Q65 p112", "certleader-C Q51 p151"], "verified": "reasoned", "fixes": [], "no": 76}, {"id": 32, "topic": "methods", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Employee {\n    String name;\n    boolean contract;\n    double salary;\n    Employee() {\n        // line n1\n    }\n    public String toString(){\n        return name + \":\" + contract + \":\" + salary;\n    }\n    public static void main(String[] args) {\n        Employee e = new Employee();\n        // line n2\n        System.out.print(e);\n    }\n}"}, {"type": "text", "content": "Which two modifications, when made independently, enable the code to print Joe:true:100.0? (Choose two.)"}], "options": [{"key": "A", "text": "Replace line n2 with:", "code": "e.name = \"Joe\";\ne.contract = true;\ne.salary = 100;"}, {"key": "B", "text": "Replace line n2 with:", "code": "this.name = \"Joe\";\nthis.contract = true;\nthis.salary = 100;"}, {"key": "C", "text": "Replace line n1 with:", "code": "this.name = new String(\"Joe\");\nthis.contract = new Boolean(true);\nthis.salary = new Double(100);"}, {"key": "D", "text": "Replace line n1 with:", "code": "name = \"Joe\";\ncontract = TRUE;\nsalary = 100.0f;"}, {"key": "E", "text": "Replace line n1 with:", "code": "this(\"Joe\", true, 100);"}], "correct": "AC", "dumpAnswer": "AC", "answerNote": "", "summary": "main(static)에서는 참조 변수 e로 필드를 설정해야 하고, 생성자에서는 래퍼 객체를 대입해도 언박싱되어 정상 동작합니다.", "walkthrough": "각 보기를 직접 넣어 컴파일하고 실행했습니다.\n- A: main에서 `e.name = \"Joe\"; e.contract = true; e.salary = 100;` → int 100이 double로 확대 변환되어 100.0입니다. 출력은 `Joe:true:100.0`입니다.\n- B: main은 static 메서드라서 `this`가 없습니다. `non-static variable this cannot be referenced from a static context` 에러가 납니다.\n- C: 생성자에서 `new String(\"Joe\")`, `new Boolean(true)` → boolean으로 언박싱, `new Double(100)` → double로 언박싱 → 출력은 `Joe:true:100.0`입니다.\n- D: `TRUE`라는 변수가 없습니다(`Boolean.TRUE`라고 써야 합니다). `cannot find symbol` 에러가 납니다. `100.0f` 자체는 float → double 확대라서 문제없습니다.\n- E: `Employee(String, boolean, double)` 생성자가 정의되어 있지 않으므로 `this(\"Joe\", true, 100)`은 컴파일 에러입니다.", "optionNotes": {"A": "정답입니다. 인스턴스 참조 e로 필드에 접근하므로 static main에서도 문제없고, 100은 double 100.0으로 확대됩니다.", "B": "static 메서드인 main 안에서는 `this`를 쓸 수 없으므로 컴파일 에러입니다.", "C": "정답입니다. 생성자 안에서는 this를 쓸 수 있고, Boolean과 Double 객체는 boolean, double 필드에 대입될 때 자동 언박싱됩니다.", "D": "`TRUE`는 정의되지 않은 식별자라서 컴파일 에러입니다. Java의 boolean 리터럴은 소문자 `true`뿐입니다.", "E": "`this(...)`로 부를 3개짜리 생성자가 없어 `constructor Employee in class Employee cannot be applied to given types` 에러가 납니다."}, "concepts": [{"title": "static 컨텍스트와 this", "body": "static 메서드는 특정 객체 없이 실행되므로 `this`와 `super`를 쓸 수 없고, 인스턴스 필드나 인스턴스 메서드에 이름만으로 접근할 수도 없습니다. 인스턴스 멤버를 쓰려면 `e.name`처럼 객체 참조를 통해야 합니다. 반대로 인스턴스 메서드와 생성자는 static 멤버를 자유롭게 쓸 수 있습니다."}, {"title": "기본형 대입 변환과 언박싱", "body": "int → long → float → double 방향의 확대 변환은 자동입니다(`double d = 100;` OK, `double d = 100.0f;` OK). 래퍼 객체는 대응하는 기본형으로 언박싱된 뒤 필요하면 확대됩니다(`double d = new Integer(5);` OK). 하지만 박싱 후 확대는 안 됩니다. `Long l = 5;`는 int를 Long으로 박싱할 수 없어 에러입니다."}, {"title": "기본 생성자와 this(...) 호출", "body": "`this(...)`는 같은 클래스에 **실제로 선언된** 생성자만 호출할 수 있습니다. 생성자를 하나라도 직접 선언하면 컴파일러는 기본 생성자를 만들어 주지 않으므로, 없는 시그니처를 부르면 컴파일 에러입니다."}], "trap": "C의 `new Boolean(true)`, `new Double(100)`은 타입이 안 맞아 보이지만 언박싱으로 정상 동작합니다. B는 this를 static 메서드에서 쓴 것이고, D는 `TRUE` 대문자 함정입니다.", "tags": ["this와 static 컨텍스트", "오토언박싱", "생성자"], "occurrences": ["2passeasy Q6 p19", "exambible Q13 p29", "surepassexam Q126 p75", "certleader-C Q22 p146"], "verified": "compiled", "fixes": ["지문의 기대 출력 `Joe:true: 100.0`의 공백을 지워 실제 출력 `Joe:true:100.0`과 일치시킴"], "no": 77}, {"id": 33, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class X {\n    int i;\n    static int j;\n    public static void main(String[] args) {\n        X x1 = new X();\n        X x2 = new X();\n        x1.i = 3;\n        x1.j = 4;\n        x2.i = 5;\n        x2.j = 6;\n        System.out.println(\n            x1.i + \" \" +\n            x1.j + \" \" +\n            x2.i + \" \" +\n            x2.j);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "3 4 5 6", "code": null}, {"key": "B", "text": "3 4 3 6", "code": null}, {"key": "C", "text": "5 4 5 6", "code": null}, {"key": "D", "text": "3 6 5 6", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "static 필드 j는 모든 객체가 하나를 공유하므로 마지막에 대입된 6이 x1.j와 x2.j 모두에 나타납니다.", "walkthrough": "1. `i`는 인스턴스 필드라서 x1과 x2가 각각 따로 가집니다. `j`는 static 필드라서 클래스 X에 하나만 있습니다.\n2. `x1.i = 3` → x1의 i = 3입니다.\n3. `x1.j = 4` → X.j = 4입니다.\n4. `x2.i = 5` → x2의 i = 5입니다.\n5. `x2.j = 6` → 같은 X.j를 6으로 덮어씁니다.\n6. 출력: x1.i=3, x1.j=6, x2.i=5, x2.j=6 → `3 6 5 6`입니다.", "optionNotes": {"A": "j를 인스턴스마다 따로 있는 것으로 착각한 결과입니다. j는 static이라 하나뿐이므로 x1.j도 6입니다.", "B": "x2.i는 5로 대입되었고 i는 객체마다 따로 있으므로 3이 될 수 없습니다. x1.j도 4가 아니라 6입니다.", "C": "x1.i는 3이며 x2.i = 5가 x1의 i에 영향을 주지 않습니다. x1.j도 6입니다.", "D": "정답입니다. 인스턴스 필드 i는 3과 5로 따로 유지되고, 공유되는 static j는 마지막 값 6입니다."}, "concepts": [{"title": "static 필드와 인스턴스 필드", "body": "static 필드는 클래스당 하나만 존재하며 모든 인스턴스가 공유합니다. `x1.j`처럼 참조 변수로 접근해도 실제로는 `X.j`와 같습니다(경고는 나지만 컴파일됩니다). 참조가 null이어도 static 필드 접근은 NPE가 나지 않습니다: `X x = null; x.j = 1;`은 정상 동작합니다. 인스턴스 필드는 `new`할 때마다 새로 만들어집니다."}], "trap": "`x1.j`, `x2.j`처럼 객체 참조로 static 필드에 접근해서 객체마다 따로 있는 것처럼 보이게 만듭니다.", "tags": ["static 필드 공유", "인스턴스 필드"], "occurrences": ["2passeasy Q10 p20"], "verified": "compiled", "fixes": [], "no": 78}, {"id": 36, "topic": "methods", "parts": [{"type": "text", "content": "Which statement best describes encapsulation?"}], "options": [{"key": "A", "text": "Encapsulation ensures that classes can be designed so that only certain fields and methods of an object are accessible from other objects.", "code": null}, {"key": "B", "text": "Encapsulation ensures that classes can be designed so that their methods are inheritable.", "code": null}, {"key": "C", "text": "Encapsulation ensures that classes can be designed with some fields and methods declared as abstract.", "code": null}, {"key": "D", "text": "Encapsulation ensures that classes can be designed so that if a method has an argument MyType x, any subclass of MyType can be passed to that method.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "캡슐화는 객체의 일부 필드와 메서드만 외부에 공개하고 나머지는 숨기도록 클래스를 설계하는 것입니다.", "walkthrough": "캡슐화는 데이터(필드)를 private으로 숨기고, 외부에는 필요한 메서드(getter, setter 등)만 공개해 접근을 통제하는 설계 원칙입니다.\n- A는 '특정 필드와 메서드만 다른 객체에서 접근 가능하게 한다'로 정확한 정의입니다.\n- B는 상속에 대한 설명입니다.\n- C는 추상화(abstract)에 대한 설명입니다.\n- D는 매개변수에 자식 타입을 넘길 수 있다는 다형성에 대한 설명입니다.", "optionNotes": {"A": "정답입니다. 접근 제어자로 공개 범위를 정해 일부 멤버만 외부에서 쓸 수 있게 하는 것이 캡슐화입니다.", "B": "메서드를 상속 가능하게 설계하는 것은 상속의 특징이며 캡슐화와는 관계없습니다.", "C": "abstract 메서드를 선언하는 것은 추상 클래스와 추상화의 개념입니다. 또한 필드에는 abstract를 붙일 수 없습니다.", "D": "MyType 자리에 자식 객체를 넘길 수 있는 것은 다형성(부모 타입 참조로 자식 객체 사용)입니다."}, "concepts": [{"title": "캡슐화 구현 방법", "body": "필드를 private으로 선언하고 public getter/setter로 접근하게 하는 것이 전형적인 형태입니다. setter에서 값 검증을 하거나 setter를 아예 없애 읽기 전용으로 만들 수 있습니다. 시험에서는 '필드를 private으로, 메서드를 public으로' 바꾸는 보기가 캡슐화 개선 정답으로 자주 나옵니다."}, {"title": "접근 제어자 범위", "body": "- `private`: 같은 클래스 안에서만\n- (default, package-private): 같은 패키지 안에서만\n- `protected`: 같은 패키지 + 다른 패키지의 자식 클래스(상속을 통한 접근)\n- `public`: 어디서나\n최상위 클래스에는 public과 default만 쓸 수 있습니다."}], "trap": "보기 B, C, D가 각각 상속, 추상화, 다형성의 정의라서 OOP 개념을 정확히 구분하는지 묻습니다.", "tags": ["캡슐화", "접근 제어자"], "occurrences": ["2passeasy Q20 p22", "certleader-C Q63 p153", "certleader-D Q19 p176"], "verified": "reasoned", "fixes": [], "no": 79}, {"id": 45, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class App {\n    int count;\n    public static void displayMsg() {\n        System.out.println(\"Welcome Visit Count: \" + count++);    // line n1\n    }\n    public static void main(String[] args) {\n        App.displayMsg();\n        displayMsg();                                             // line n2\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Welcome Visit Count: 0\nWelcome Visit Count: 1"}, {"key": "B", "text": "Compilation fails at line n2.", "code": null}, {"key": "C", "text": "Compilation fails at line n1.", "code": null}, {"key": "D", "text": "", "code": "Welcome Visit Count: 0\nWelcome Visit Count: 0"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "static 메서드 `displayMsg()`에서 인스턴스 변수 `count`를 직접 참조하므로 line n1에서 컴파일 에러가 납니다.", "walkthrough": "`count`는 `static`이 없는 인스턴스 변수이므로 `App` 객체가 있어야만 존재합니다. `displayMsg()`는 `static` 메서드이므로 `this`가 없고, 어느 객체의 `count`를 쓸지 정할 수 없습니다. 그래서 javac가 line n1에서 `non-static variable count cannot be referenced from a static context` 에러를 냅니다. 실제로 컴파일하면 이 한 개의 에러만 나옵니다.\nline n2의 `displayMsg();`는 같은 클래스의 static 메서드를 static 메서드 `main`에서 클래스 이름 없이 호출한 것이므로 문제가 없습니다. `App.displayMsg();`도 마찬가지로 합법입니다. 컴파일이 되지 않으므로 출력 결과를 묻는 A, D는 의미가 없습니다.", "optionNotes": {"A": "`count`가 static 변수였다면 가능한 출력이지만, 인스턴스 변수이므로 컴파일 자체가 되지 않습니다.", "B": "line n2는 static 메서드에서 같은 클래스의 static 메서드를 부르는 것이므로 합법입니다.", "C": "정답입니다. static 메서드 안에서 인스턴스 변수 `count`를 객체 참조 없이 사용하므로 line n1에서 컴파일 에러가 납니다.", "D": "컴파일이 실패하므로 아무것도 출력되지 않습니다. `count`가 static이었다면 0, 1이 출력됩니다."}, "concepts": [{"title": "static 문맥과 인스턴스 멤버", "body": "static 메서드와 static 초기화 블록에는 `this`가 없습니다. 그래서 인스턴스 변수와 인스턴스 메서드를 이름만으로 쓸 수 없고, `new App().count`처럼 객체 참조를 통해서만 접근할 수 있습니다. 반대로 인스턴스 메서드에서는 static 멤버와 인스턴스 멤버를 모두 자유롭게 쓸 수 있습니다. 에러 위치는 호출한 줄이 아니라 인스턴스 멤버를 **참조한 줄**입니다.\n```java\nstatic void m() {\n    // count++;          // 컴파일 에러\n    new App().count++;   // OK\n}\n```"}, {"title": "static 메서드 호출 방법", "body": "static 메서드는 `클래스명.메서드()`, 같은 클래스 안에서는 `메서드()`로 호출할 수 있습니다. 참조 변수로 `obj.staticMethod()`처럼 호출해도 컴파일되며, 참조가 `null`이어도 NullPointerException이 나지 않습니다. 어떤 메서드를 호출할지는 참조 변수의 **선언 타입**으로 컴파일 시점에 정해집니다."}], "trap": "에러가 호출부(line n2)에 있는 것처럼 보이게 하지만, 실제 문제는 static 메서드 안에서 인스턴스 변수를 쓴 line n1입니다.", "tags": ["static 메서드", "인스턴스 변수 접근"], "occurrences": ["exambible Q9 p28", "certleader-C Q16 p145"], "verified": "compiled", "fixes": ["보기 A, D의 줄바꿈이 사라진 출력('Count:0Welcome ...')을 두 줄 코드 블록으로 분리하고 `Count: 0`의 공백을 코드와 맞춤"], "no": 80}, {"id": 51, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Test {\n    int a1;\n\n    public static void doProduct(int a) {\n        a = a * a;\n    }\n\n    public static void doString(String s) {\n        s.concat(\" \" + s);\n    }\n\n    public static void main(String[] args) {\n        Test item = new Test();\n        item.a1 = 11;\n        String sb = \"Hello\";\n        Integer i = 10;\n        doProduct(i);\n        doString(sb);\n        doProduct(item.a1);\n        System.out.println(i + \" \" + sb + \" \" + item.a1);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 Hello Hello 11", "code": null}, {"key": "B", "text": "10 Hello Hello 121", "code": null}, {"key": "C", "text": "100 Hello 121", "code": null}, {"key": "D", "text": "100 Hello Hello 121", "code": null}, {"key": "E", "text": "10 Hello 11", "code": null}], "correct": "E", "dumpAnswer": "E", "answerNote": "", "summary": "Java는 값을 복사해서 전달하고 String은 불변이므로 `i`, `sb`, `item.a1` 모두 바뀌지 않아 `10 Hello 11`이 출력됩니다.", "walkthrough": "1. `item.a1 = 11`, `sb = \"Hello\"`, `Integer i = 10`(오토박싱)으로 시작합니다.\n2. `doProduct(i)`: `Integer`가 `int`로 언박싱되어 값 10이 매개변수 `a`에 **복사**됩니다. 메서드 안에서 `a = 100`이 되지만 지역 변수 `a`만 바뀌고 `i`는 그대로 10입니다.\n3. `doString(sb)`: 참조값이 `s`에 복사됩니다. `s.concat(\" \" + s)`는 `\"Hello Hello\"`라는 새 String을 만들지만 반환값을 버리고, String은 불변이므로 `sb`는 여전히 `\"Hello\"`입니다.\n4. `doProduct(item.a1)`: 필드 값 11이 복사되어 전달됩니다. 메서드 안에서 121로 바꾸는 것은 복사본이므로 `item.a1`은 11 그대로입니다.\n5. 따라서 `10 Hello 11`이 출력됩니다. 실행 결과도 같습니다.", "optionNotes": {"A": "`concat` 결과를 버렸고 String은 불변이므로 `sb`가 `Hello Hello`가 되지 않습니다.", "B": "`sb`도 `item.a1`도 바뀌지 않습니다. 기본형 필드 값을 넘기면 복사본만 바뀝니다.", "C": "`doProduct`는 복사된 지역 변수만 제곱하므로 `i`와 `item.a1`은 바뀌지 않습니다.", "D": "세 값 모두 바뀌지 않습니다. 메서드 호출이 원본에 영향을 준다고 착각한 보기입니다.", "E": "정답입니다. 값 복사 전달과 String 불변성 때문에 원래 값 `10 Hello 11`이 출력됩니다."}, "concepts": [{"title": "Java는 항상 값에 의한 전달(pass-by-value)", "body": "메서드에 인자를 넘기면 그 값이 매개변수에 복사됩니다. 기본형은 값 자체가, 참조형은 참조값(주소)이 복사됩니다. 그래서 매개변수에 새 값을 대입해도 호출한 쪽 변수는 바뀌지 않습니다. 다만 참조형이라면 복사된 참조로 객체의 **내부 상태**를 바꿀 수 있습니다(`item.a1 = 5`처럼). 이 문제에서 `doProduct(item.a1)`는 객체가 아니라 `int` 값을 넘기므로 원본 필드에 영향이 없습니다.\n```java\nstatic void change(Test t) { t.a1 = 99; }  // 원본 객체 변경\nstatic void reassign(Test t) { t = new Test(); } // 호출 쪽에 영향 없음\n```"}, {"title": "String 불변성과 반환값 무시", "body": "`concat`, `replace`, `toUpperCase`, `trim`, `substring` 같은 String 메서드는 원본을 바꾸지 않고 새 String을 반환합니다. 반환값을 대입하지 않으면 아무 효과도 없습니다. `StringBuilder`의 `append`, `insert`, `reverse`는 객체 자체를 바꾸므로 반환값을 버려도 효과가 남습니다. 둘을 섞어 내는 문제가 자주 나옵니다."}, {"title": "Integer 인자와 int 매개변수", "body": "`Integer`를 `int` 매개변수에 넘기면 언박싱(`i.intValue()`)된 값이 복사됩니다. 매개변수가 `Integer`였더라도 `a = a * a`는 새 Integer 객체를 지역 변수에 대입할 뿐이므로 원본은 바뀌지 않습니다. 래퍼 클래스는 String처럼 불변입니다."}], "trap": "변수 이름이 `sb`라서 StringBuilder처럼 보이지만 실제로는 String입니다. 메서드가 값을 바꾸는 것처럼 보여도 복사본만 바뀝니다.", "tags": ["값에 의한 전달", "String 불변성", "오토박싱/언박싱"], "occurrences": ["exambible Q23 p32", "certleader-C Q42 p150", "certleader-D Q13 p175"], "verified": "compiled", "fixes": [], "no": 81}, {"id": 54, "topic": "methods", "parts": [{"type": "text", "content": "Given this class:"}, {"type": "code", "content": "public class Rectangle {\n    private double length;\n    private double height;\n    private double area;\n\n    public void setLength(double length) {\n        this.length = length;\n    }\n    public void setHeight(double height) {\n        this.height = height;\n    }\n    public void setArea() {\n        area = length*height;\n    }\n}"}, {"type": "text", "content": "Which two changes would encapsulate this class and ensure that the area field is always equal to length * height whenever the Rectangle class is used? (Choose two.)"}], "options": [{"key": "A", "text": "Call the setArea method at the end of the setHeight method.", "code": null}, {"key": "B", "text": "Call the setArea method at the beginning of the setHeight method.", "code": null}, {"key": "C", "text": "Call the setArea method at the end of the setLength method.", "code": null}, {"key": "D", "text": "Call the setArea method at the beginning of the setLength method.", "code": null}, {"key": "E", "text": "Change the setArea method to private.", "code": null}, {"key": "F", "text": "Change the area field to public.", "code": null}], "correct": "AC", "dumpAnswer": "AE", "answerNote": "덤프 정답 AE는 틀렸습니다. A와 E만 적용하면 `setHeight`만 `area`를 다시 계산하고 `setLength`는 그렇지 않으므로, 높이를 정한 뒤 길이를 바꾸면 `area`가 이전 값으로 남습니다. 직접 실행해 보면 AE 적용 클래스에서 `setLength(3)`, `setHeight(4)`, `setLength(5)` 순서로 호출했을 때 `area`가 20.0이 아니라 12.0입니다. 두 setter 모두 값을 대입한 **뒤에** `setArea()`를 호출하는 A와 C를 함께 적용해야 항상 `area == length * height`가 유지됩니다.", "summary": "두 setter가 모두 값을 바꾼 뒤 `setArea()`를 호출해야(A, C) `area`가 항상 `length * height`와 같아집니다.", "walkthrough": "`area`는 `length`와 `height`에서 계산되는 파생 필드입니다. 이 값이 항상 맞으려면 `length`나 `height`가 바뀔 때마다 **바뀐 직후에** 다시 계산해야 합니다.\n1. 처음에는 세 필드가 모두 0.0이므로 `0 == 0 * 0`이 성립합니다.\n2. A: `setHeight`의 끝에서 `setArea()`를 호출하면 새 `height`로 다시 계산합니다.\n3. C: `setLength`의 끝에서 `setArea()`를 호출하면 새 `length`로 다시 계산합니다.\n4. A와 C를 함께 적용하면 어떤 setter를 어떤 순서로 호출해도 `area`가 최신 값입니다. 이때 `setArea()`가 public이어도 호출하면 올바른 값으로 다시 계산할 뿐이므로 불변식이 깨지지 않습니다.\nB와 D처럼 메서드 **시작 부분**에서 호출하면 새 값을 대입하기 전에 계산하므로 이전 값 기준의 면적이 남습니다. E(private)는 외부에서 `setArea`를 부를 수 없게 할 뿐이고 `setLength` 쪽 문제를 해결하지 못합니다. F는 `area`를 외부에서 마음대로 바꿀 수 있게 하므로 캡슐화를 깨뜨립니다.", "optionNotes": {"A": "정답입니다. `this.height = height;` 다음에 `setArea()`를 호출하면 새 높이로 면적을 다시 계산합니다.", "B": "새 `height`를 대입하기 전에 계산하므로 이전 높이 기준의 면적이 남습니다.", "C": "정답입니다. `this.length = length;` 다음에 `setArea()`를 호출하면 새 길이로 면적을 다시 계산합니다.", "D": "새 `length`를 대입하기 전에 계산하므로 이전 길이 기준의 면적이 남습니다.", "E": "private으로 바꿔도 `setLength` 호출 뒤 `area`를 다시 계산하지 않는 문제는 그대로입니다. A와 E만으로는 불변식이 보장되지 않습니다(덤프 정답이지만 오답).", "F": "`area`를 public으로 바꾸면 외부 코드
