가 임의 값을 넣을 수 있어 캡슐화가 깨지고 불변식도 보장할 수 없습니다."}, "concepts": [{"title": "캡슐화와 클래스 불변식", "body": "캡슐화는 필드를 `private`으로 숨기고 메서드를 통해서만 상태를 바꾸게 하는 설계입니다. 이렇게 해야 \"`area`는 항상 `length * height`\" 같은 **불변식(invariant)**을 클래스 안에서 지킬 수 있습니다. 상태를 바꾸는 모든 경로(모든 setter, 생성자)가 불변식을 유지해야 하며, 한 경로라도 빠지면 깨집니다. 시험에서는 보통 \"필드는 private, 접근은 public 메서드\"가 캡슐화의 정답 형태입니다."}, {"title": "파생 값은 계산 시점이 중요", "body": "다른 필드에서 계산되는 값을 필드로 저장한다면 원본 필드가 바뀐 **뒤에** 다시 계산해야 합니다. 더 단순한 방법은 아예 필드로 저장하지 않고 getter에서 계산하는 것입니다.\n```java\npublic double getArea() { return length * height; }\n```\n이렇게 하면 불일치가 생길 수 없습니다. 이 문제처럼 '메서드 처음에 호출'과 '끝에 호출' 보기가 함께 나오면 대입 순서를 따져 보면 됩니다."}], "trap": "'private으로 바꾼다'는 보기가 캡슐화처럼 들려서 고르게 만들지만, 실제로 불변식을 지키는 것은 두 setter 모두에서 대입 뒤에 다시 계산하는 것입니다.", "tags": ["캡슐화", "setter 설계", "파생 필드 일관성"], "occurrences": ["exambible Q34 p33", "certleader-C Q61 p153", "surepassexam Q46 p59"], "verified": "compiled", "fixes": ["문제 끝에 빠진 '(Choose two.)'를 추가"], "no": 82}, {"id": 60, "topic": "methods", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Person {\n    String name;\n    int age = 25;\n\n    public Person(String name) {\n        this();                                    //line n1\n        setName(name);\n    }\n\n    public Person(String name, int age) {\n        Person(name);                              //line n2\n        setAge(age);\n    }\n\n    //setter and getter methods go here\n\n    public String show() {\n        return name + \" \" + age;\n    }\n    public static void main(String[] args) {\n        Person p1 = new Person(\"Jesse\");\n        Person p2 = new Person(\"Walter\",52);\n        System.out.println(p1.show());\n        System.out.println(p2.show());\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Jesse 25\nWalter 52"}, {"key": "B", "text": "Compilation fails only at line n1", "code": null}, {"key": "C", "text": "Compilation fails only at line n2", "code": null}, {"key": "D", "text": "Compilation fails at both line n1 and line n2", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "직접 컴파일했을 때 line n1(`no suitable constructor found for Person(no arguments)`)과 line n2(`cannot find symbol`)에서만 에러가 확인되었습니다(setter는 주석대로 있다고 보고 추가함). 덤프 정답 D와 같습니다.", "summary": "인자 없는 생성자가 없으므로 `this();`(line n1)가 실패하고, 생성자를 `Person(name);`처럼 메서드처럼 호출할 수 없으므로 line n2도 실패합니다.", "walkthrough": "1. line n1 `this();`: 같은 클래스의 인자 없는 생성자를 호출합니다. 하지만 `Person`에는 `Person(String)`과 `Person(String, int)`만 있습니다. 생성자를 하나라도 선언하면 컴파일러가 기본 생성자를 만들어 주지 않으므로 `Person()`이 없어 에러입니다.\n2. line n2 `Person(name);`: 다른 생성자를 호출하려면 `this(name);`이라고 써야 합니다. `Person(name)`은 `Person`이라는 이름의 **메서드** 호출로 해석되는데, 그런 메서드가 없으므로 `cannot find symbol` 에러입니다.\n3. 두 에러는 서로 독립적이므로 둘 다 보고됩니다. 따라서 D가 정답입니다.\n올바른 코드는 다음과 같습니다.\n```java\npublic Person(String name) { setName(name); }\npublic Person(String name, int age) {\n    this(name);   // 첫 문장이어야 함\n    setAge(age);\n}\n```", "optionNotes": {"A": "두 생성자 모두 컴파일 에러가 있어 실행되지 않습니다. 고친다면 `Jesse 25`, `Walter 52`가 출력됩니다.", "B": "line n1만 문제인 것이 아닙니다. line n2의 `Person(name);`도 생성자 호출 문법이 아니라 컴파일 에러입니다.", "C": "line n2만 문제인 것이 아닙니다. 인자 없는 생성자가 선언되지 않았으므로 line n1의 `this();`도 에러입니다.", "D": "정답입니다. 존재하지 않는 생성자를 호출하는 `this()`와, `this(...)` 대신 클래스 이름으로 생성자를 부른 `Person(name)` 모두 컴파일 에러입니다."}, "concepts": [{"title": "this()와 super()를 이용한 생성자 호출", "body": "같은 클래스의 다른 생성자는 `this(인자)`로, 부모 생성자는 `super(인자)`로 호출하며, 반드시 생성자의 **첫 문장**이어야 합니다. 그래서 둘을 한 생성자에서 함께 쓸 수 없습니다. 클래스 이름으로 `Person(name)`처럼 호출하는 문법은 없고, `new Person(name)`은 새 객체를 따로 만들 뿐 현재 객체를 초기화하지 않습니다. 생성자끼리 서로 호출해 순환이 생기면(`recursive constructor invocation`) 컴파일 에러입니다."}, {"title": "기본 생성자가 만들어지는 조건", "body": "클래스에 생성자를 **하나도** 선언하지 않았을 때만 컴파일러가 인자 없는 기본 생성자를 넣어 줍니다. 생성자를 하나라도 선언하면 기본 생성자는 생기지 않으므로 `new Person()`이나 `this()`가 에러가 됩니다. 자식 클래스 생성자는 첫 줄에 `super()`가 묵시적으로 들어가므로, 부모에 인자 없는 생성자가 없으면 자식 쪽에서 컴파일 에러가 나는 경우도 자주 출제됩니다."}], "trap": "한 줄만 틀린 것처럼 보이게 'only' 보기를 두지만, `this()`의 대상 생성자가 없다는 점과 `Person(name)`이 잘못된 문법이라는 점이 모두 에러입니다.", "tags": ["생성자 체이닝 this()", "기본 생성자", "생성자 호출 문법"], "occurrences": ["surepassexam Q3 p49"], "verified": "compiled", "fixes": ["`show()`의 선언되지 않은 변수 `number`(원래 문제에 없는 잘못 들어간 부분)를 제거해 `return name + \" \" + age;`로 수정", "보기 A의 줄바꿈이 사라진 'Jesse 25Walter 52'를 두 줄 코드 블록으로 분리"], "no": 83}, {"id": 61, "topic": "methods", "parts": [{"type": "text", "content": "You are asked to create a method that accepts an array of integers and returns the highest value from that array.\nGiven the code fragment:"}, {"type": "code", "content": "class Test {\n    public static void main (String [] args) {\n        int numbers [] = {12, 13, 42, 32, 15, 156, 23, 51, 12};\n        int max = findMax (numbers);\n    }\n    /*line n1 */ {\n        int max = 0;\n        /* code goes here*/\n        return max;\n    }\n}"}, {"type": "text", "content": "Which method signature do you use at line n1?"}], "options": [{"key": "A", "text": "public int findMax (int [] numbers)", "code": null}, {"key": "B", "text": "static int[] findMax (int max)", "code": null}, {"key": "C", "text": "static int findMax (int [] numbers)", "code": null}, {"key": "D", "text": "final int findMax (int [] )", "code": null}], "correct": "C", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. `main`은 static 메서드이므로 객체 없이 `findMax(numbers)`를 호출하려면 `findMax`도 static이어야 합니다. A(`public int findMax(int[] numbers)`)를 넣고 컴파일하면 `non-static method findMax(int[]) cannot be referenced from a static context` 에러가 납니다. C를 넣으면 에러 없이 컴파일됩니다(네 보기 모두 직접 컴파일해서 확인).", "summary": "static `main`에서 객체 없이 호출하고 int 배열을 받아 int를 반환해야 하므로 `static int findMax(int[] numbers)`(C)가 맞습니다.", "walkthrough": "line n1에 들어갈 시그니처는 세 조건을 모두 만족해야 합니다.\n1. 호출부 `findMax(numbers)`는 static `main` 안에서 객체 없이 호출하므로 메서드가 **static**이어야 합니다.\n2. 인자 `numbers`가 `int[]`이므로 매개변수 타입은 `int[]`여야 합니다.\n3. 결과를 `int max`에 대입하고 본문이 `int max`를 `return`하므로 반환 타입은 `int`여야 합니다.\n네 보기를 각각 넣어 컴파일한 결과는 다음과 같습니다.\n- A: static이 아니라 `non-static method ... static context` 에러가 납니다.\n- B: 매개변수와 반환 타입이 맞지 않고, 매개변수 `max`와 본문의 지역 변수 `int max`가 중복 선언되어 에러가 납니다.\n- C: 컴파일에 성공합니다.\n- D: 매개변수 이름이 없어 `<identifier> expected` 구문 에러가 납니다.\n`main`의 `int max`와 `findMax`의 `int max`는 서로 다른 메서드의 지역 변수이므로 충돌하지 않습니다.", "optionNotes": {"A": "시그니처 형태는 맞지만 static이 아니므로 static `main`에서 객체 없이 호출할 수 없습니다(덤프 정답이지만 컴파일 에러).", "B": "`int[]`를 `int` 매개변수에 넘길 수 없고, `int` 반환값을 `int[]`로 반환할 수 없으며, 매개변수 `max`와 지역 변수 `max`가 중복됩니다.", "C": "정답입니다. static이고 `int[]`를 받아 `int`를 반환하므로 호출부와 본문에 모두 맞습니다.", "D": "매개변수에는 타입과 이름이 모두 필요합니다. `(int [] )`는 이름이 없어 구문 에러이고, static도 아닙니다."}, "concepts": [{"title": "static 메서드에서 다른 메서드 호출하기", "body": "static 메서드 안에서는 `this`가 없으므로 같은 클래스의 인스턴스 메서드를 이름만으로 호출할 수 없습니다. 인스턴스 메서드를 쓰려면 `new Test().findMax(numbers)`처럼 객체를 만들어 호출해야 합니다. 반대로 인스턴스 메서드에서는 static 메서드를 자유롭게 호출할 수 있습니다. \"어떤 시그니처를 넣어야 하나\" 유형에서는 먼저 호출하는 쪽이 static 문맥인지 확인하세요."}, {"title": "메서드 선언의 구성 요소", "body": "메서드 선언은 `[접근 제어자] [static/final/abstract 등] 반환타입 메서드명(매개변수 목록) [throws ...] { 본문 }` 순서입니다. 반환 타입과 메서드 이름은 필수이고, 매개변수마다 타입과 이름이 모두 있어야 합니다. 배열 매개변수는 `int[] a`, `int a[]`, `int... a`(가변 인자) 형태가 가능합니다. 본문에서 매개변수와 같은 이름의 지역 변수를 다시 선언하면 컴파일 에러입니다."}], "trap": "public이 붙은 A가 가장 완전해 보이지만, static `main`에서 호출된다는 점 때문에 static이 필수입니다.", "tags": ["static 메서드", "메서드 시그니처", "static 문맥"], "occurrences": ["surepassexam Q4 p50"], "verified": "compiled", "fixes": [], "no": 84}, {"id": 62, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class SumTest {\n\n    public static void doSum(Integer x, Integer y) {\n        System.out.println(\"Integer sum is \" + (x + y));\n    }\n\n    public static void doSum(double x, double y) {\n        System.out.println(\"double sum is \" + (x + y));\n    }\n\n    public static void doSum(float x, float y) {\n        System.out.println(\"float sum is \" + (x + y));\n    }\n\n    public static void doSum(int x, int y) {\n        System.out.println(\"int sum is \" + (x + y));\n ody": "`\"...\" + 30`은 `30`, `\"...\" + 30.0`(double)과 `\"...\" + 30.0f`(float)는 `30.0`이 됩니다. double/float는 정수 값이어도 항상 소수점 한 자리 이상이 표시됩니다. 또 `\"sum \" + x + y`는 왼쪽부터 문자열 연결이 되므로 `sum 1020`이 되고, 이 문제처럼 `(x + y)`로 괄호를 쳐야 덧셈이 먼저 계산됩니다."}], "trap": "`Integer` 버전을 맨 앞에 두어 먼저 선택될 것처럼 보이게 하지만, 선언 순서와 무관하게 박싱보다 정확한 일치가 우선합니다.", "tags": ["오버로딩 해석 순서", "오토박싱", "double 출력 형식"], "occurrences": ["surepassexam Q5 p50"], "verified": "compiled", "fixes": ["보기 B의 'double sum is 30'을 실제 출력 'double sum is 30.0'으로 수정"], "no": 85}, {"id": 92, "topic": "methods", "parts": [{"type": "text", "content": "Given: Acc.java:"}, {"type": "code", "content": "package p1;\npublic class Acc {\n    int p;\n    private int q;\n    protected int r;\n    public int s;\n}"}, {"type": "text", "content": "Test.java:"}, {"type": "code", "content": "package p2;\nimport p1.Acc;\npublic class Test extends Acc {\n    public static void main(String[] args) {\n        Acc obj = new Test();\n    }\n}"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "Both p and s are accessible by obj.", "code": null}, {"key": "B", "text": "Only s is accessible by obj.", "code": null}, {"key": "C", "text": "Both r and s are accessible by obj.", "code": null}, {"key": "D", "text": "p, r, and s are accessible by obj.", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "다른 패키지의 하위 클래스라도 상위 타입(Acc) 참조로는 protected 멤버에 접근할 수 없으므로 obj로 접근 가능한 것은 public인 s뿐입니다.", "walkthrough": "`Test`는 `p2` 패키지에 있고 `p1.Acc`를 상속합니다. 변수 `obj`의 선언 타입은 `Acc`입니다.\n- `p`(default): 같은 패키지(`p1`)에서만 접근할 수 있으므로 `p2`에서는 접근할 수 없습니다.\n- `q`(private): `Acc` 클래스 내부에서만 접근할 수 있습니다.\n- `r`(protected): 다른 패키지의 하위 클래스는 **자기 타입(Test 또는 그 하위 타입) 참조를 통해서만** 상속받은 protected 멤버에 접근할 수 있습니다. `obj`는 `Acc` 타입이므로 `obj.r`은 컴파일 에러입니다(실제로 javac가 `r has protected access in Acc`를 출력합니다). 반면 `Test t = new Test(); t.r`이나 그냥 `r`(인스턴스 메서드 안에서)은 허용됩니다.\n- `s`(public): 어디서나 접근할 수 있습니다.\n따라서 `obj`로 접근 가능한 것은 `s` 하나뿐입니다.", "optionNotes": {"A": "`p`는 default(package-private) 접근이라 `p2` 패키지의 `Test`에서는 접근할 수 없으므로 틀렸습니다.", "B": "정답입니다. public인 `s`만 `Acc` 타입 참조 `obj`로 접근할 수 있습니다.", "C": "`r`은 protected지만 다른 패키지에서는 하위 클래스 자신의 타입 참조로만 접근 가능합니다. `obj`가 `Acc` 타입이므로 `obj.r`은 컴파일 에러입니다.", "D": "`p`는 패키지 밖에서 접근 불가, `r`은 `Acc` 타입 참조로 접근 불가이므로 틀렸습니다."}, "concepts": [{"title": "4가지 접근 제어자", "body": "접근 범위는 `public` > `protected` > default(제어자 없음) > `private` 순입니다.\n- `public`: 모든 곳에서 접근 가능합니다.\n- `protected`: 같은 패키지 + 다른 패키지의 하위 클래스(상속을 통해)에서 접근 가능합니다.\n- default: 같은 패키지 안에서만 접근 가능합니다.\n- `private`: 선언한 클래스 내부에서만 접근 가능합니다.\n하위 클래스라도 패키지가 다르면 default 멤버는 보이지 않는다는 점을 꼭 기억하십시오."}, {"title": "다른 패키지에서의 protected 접근 규칙", "body": "다른 패키지의 하위 클래스 `Sub`는 상속받은 protected 멤버를 `this`(암묵적 포함)나 `Sub` 타입(또는 그 하위 타입) 참조를 통해서만 사용할 수 있습니다. 상위 클래스 타입 참조를 통한 접근은 금지됩니다.\n```java\npackage p2;\npublic class Sub extends p1.Base {\n    void m() {\n        r = 1;               // OK (this.r)\n        new Sub().r = 1;     // OK\n        p1.Base b = new Sub();\n        // b.r = 1;          // 컴파일 에러\n    }\n}\n```\n참조 변수의 **선언 타입**이 기준이며, 실제 객체가 `Sub`인지는 상관없습니다. 또한 static 메서드(`main`) 안에서는 `this`가 없으므로 그냥 `r`이라고 쓸 수도 없습니다."}], "trap": "`obj`에 실제로 `Test` 객체가 들어 있으니 protected `r`도 접근 가능하다고 착각하게 만듭니다. 접근 가능 여부는 참조 변수의 선언 타입(`Acc`)으로 컴파일 시점에 판단합니다.", "tags": ["protected 접근", "접근 제어자", "패키지"], "occurrences": ["surepassexam Q88 p67"], "verified": "compiled", "fixes": [], "no": 86}, {"id": 93, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        Test ts = new Test();\n        System.out.print(isAvailable + \" \");\n        isAvailable= ts.doStuff();\n        System.out.println(isAvailable);\n    }\n    public static boolean doStuff() {\n        return !isAvailable;\n    }\n    static boolean isAvailable = false;\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "false true", "code": null}, {"key": "C", "text": "true false", "code": null}, {"key": "D", "text": "true true", "code": null}, {"key": "E", "text": "false false", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "static 필드 isAvailable의 기본값 false를 먼저 출력하고, doStuff()가 !false = true를 반환해 대입되므로 \"false true\"가 출력됩니다.", "walkthrough": "1. `isAvailable`은 static boolean 필드이므로 클래스가 로드될 때 기본값 `false`로 초기화됩니다(선언 위치가 클래스 맨 아래여도 상관없습니다).\n2. `main`은 static이므로 static 필드 `isAvailable`을 바로 사용할 수 있습니다. 첫 출력은 `false `입니다.\n3. `ts.doStuff()`는 인스턴스 참조로 static 메서드를 호출한 것입니다. 경고 없이 허용되며 `Test.doStuff()`와 같습니다.\n4. `doStuff()`는 `!isAvailable` 즉 `!false` = `true`를 반환하고, 이 값이 `isAvailable`에 대입됩니다.\n5. 두 번째 출력은 `true`입니다.\n따라서 결과는 `false true`입니다.", "optionNotes": {"A": "static 메서드에서 static 필드를 사용하고, 인스턴스 참조로 static 메서드를 호출하는 것도 합법이므로 컴파일 에러는 없습니다.", "B": "정답입니다. 초기값 `false`를 출력한 뒤 `!false`인 `true`가 대입되어 출력됩니다.", "C": "static boolean 필드의 기본값은 `true`가 아니라 `false`이므로 첫 출력이 `true`일 수 없습니다.", "D": "첫 출력은 기본값 `false`이므로 틀렸습니다.", "E": "`doStuff()`가 `!isAvailable`을 반환하므로 두 번째 값은 `true`로 바뀝니다."}, "concepts": [{"title": "static 멤버와 인스턴스 참조를 통한 호출", "body": "static 메서드는 클래스 이름으로 호출하는 것이 정석이지만 `ts.doStuff()`처럼 참조 변수로 호출해도 컴파일됩니다. 이때 컴파일러는 참조 변수의 **선언 타입**만 보고 메서드를 결정하므로, 참조가 `null`이어도 NullPointerException이 나지 않습니다.\n```java\nTest t = null;\nt.doStuff(); // NPE 없이 Test.doStuff() 실행\n```\nstatic 메서드는 오버라이딩되지 않고 숨겨질(hiding) 뿐이라는 점도 함께 기억하십시오."}, {"title": "필드 기본값과 선언 위치", "body": "필드(static/인스턴스)는 명시적으로 초기화하지 않으면 기본값을 가집니다: 숫자형 0, `boolean`은 `false`, `char`는 `'\\u0000'`, 참조형은 `null`입니다. 메서드나 다른 메서드 안에서 필드를 사용할 때는 필드가 클래스 안 어디에 선언되어 있든 상관없습니다. 단, 지역 변수는 기본값이 없어서 초기화 없이 읽으면 컴파일 에러입니다."}], "trap": "필드가 클래스 맨 아래에 선언되어 있어 '선언 전에 사용했으니 컴파일 에러'라고 생각하게 만듭니다. 메서드 본문에서의 필드 참조는 선언 순서와 무관합니다.", "tags": ["static 멤버", "static 메서드 호출", "boolean 기본값"], "occurrences": ["surepassexam Q90 p68", "certleader-B Q74 p113"], "verified": "compiled", "fixes": [], "no": 87}, {"id": 95, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class MyField {\n    int x;\n    int y;\n    public void doStuff(int x, int y) {\n        this.x = x;\n        y = this.y;\n    }\n    public void display () {\n        System.out.print(x + \" \" + y + \" : \");\n    }\n    public static void main(String[] args) {\n        MyField m1 = new MyField();\n        m1.x = 100;\n        m1.y = 200;\n        MyField m2 = new MyField();\n        m2.doStuff(m1.x, m1.y);\n        m1.display();\n        m2.display();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "100 0 : 100 200:", "code": null}, {"key": "B", "text": "100 0 : 100 0 :", "code": null}, {"key": "C", "text": "100 200 : 100 200 :", "code": null}, {"key": "D", "text": "100 200 : 100 0 :", "code": null}], "correct": "D", "dumpAnswer": "B", "answerNote": "덤프 정답 B는 틀렸습니다. `m1`은 `x=100`, `y=200`을 직접 대입받았고 `doStuff`는 `m1`을 건드리지 않으므로 `m1.display()`는 `100 200 : `을 출력합니다. `m2`는 `this.x = x`로 100을 받지만 `y = this.y;`는 매개변수 `y`에 필드값을 넣는 것이라 `m2.y`는 0으로 남습니다. 실제 실행 결과는 `100 200 : 100 0 : `이며 이는 D입니다.", "summary": "doStuff에서 this.x = x는 필드를 바꾸지만 y = this.y는 매개변수만 바꾸므로 m2.y는 0이고, m1은 그대로 100 200입니다.", "walkthrough": "1. `m1.x = 100; m1.y = 200;` 으로 `m1`의 필드는 (100, 200)입니다.\n2. `m2`는 새 객체이므로 필드가 기본값 (0, 0)입니다.\n3. `m2.doStuff(100, 200)` 호출:\n- `this.x = x;` 에서 `m2.x`가 100이 됩니다.\n- `y = this.y;` 에서 왼쪽 `y`는 **매개변수**이고 오른쪽 `this.y`는 `m2.y`(0)입니다. 매개변수 `y`가 0으로 바뀔 뿐 필드는 그대로 0입니다.\n4. `m1.display()`가 `100 200 : `을 출력합니다(`m1`은 전혀 변경되지 않았습니다).\n5. `m2.display()`가 `100 0 : `을 출력합니다.\n최종 출력은 `100 200 : 100 0 : `입니다.", "optionNotes": {"A": "`m1.y`를 0으로, `m2.y`를 200으로 뒤바꾼 결과입니다. `m1.y`는 200이고 `m2.y`는 0이므로 틀렸습니다.", "B": "`m1.y`는 `main`에서 200을 대입한 뒤 아무도 바꾸지 않으므로 `100 0`이 될 수 없습니다.", "C": "`y = this.y;`는 필드에 대입하지 않으므로 `m2.y`가 200이 될 수 없습니다.", "D": "정답입니다. `m1`은 (100, 200), `m2`는 `x`만 복사되어 (100, 0)입니다."}, "concepts": [{"title": "필드 섀도잉과 this", "body": "매개변수나 지역 변수의 이름이 필드와 같으면 메서드 안에서 그 이름은 지역 변수를 가리킵니다(섀도잉). 필드를 가리키려면 `this.이름`을 써야 합니다.\n```java\nvoid set(int x) {\n    x = x;       // 매개변수에 자기 자신 대입, 필드 변화 없음\n    this.x = x;  // 필드에 대입\n}\n```\n대입문에서 어느 쪽에 `this`가 붙어 있는지를 보면 무엇이 바뀌는지 알 수 있습니다."}, {"title": "기본형 매개변수는 복사본", "body": "`doStuff(m1.x, m1.y)`처럼 기본형 값을 넘기면 값이 복사됩니다. 메서드 안에서 매개변수를 바꿔도 원래 변수(`m1.y`)나 다른 객체의 필드에는 아무 영향이 없습니다."}], "trap": "`y = this.y;`를 `this.y = y;`로 잘못 읽게 만드는 문제입니다. 대입의 왼쪽이 무엇인지 확인하고, 호출 대상이 아닌 `m1`은 변하지 않는다는 점도 놓치지 마십시오.", "tags": ["this 키워드", "지역 변수 섀도잉", "pass-by-value"], "occurrences": ["surepassexam Q102 p69"], "verified": "compiled", "fixes": [], "no": 88}, {"id": 96, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    int x, y;\n\n    public Test(int x, int y) {\n        initialize(x, y);\n    }\n\n    public void initialize(int x, int y) {\n        this.x = x * x;\n        this.y = y * y;\n    }\n\n    public static void main(String[] args) {\n        int x = 3, y = 5;\n        Test obj = new Test(x, y);\n        System.out.println(x + \" \" + y);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails.", "code": null}, {"key": "B", "text": "3 5", "code": null}, {"key": "C", "text": "0 0", "code": null}, {"key": "D", "text": "9 25", "code": null}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "출력하는 x, y는 main의 지역 변수이므로 객체 필드가 9, 25로 바뀌어도 3 5가 출력됩니다.", "walkthrough": "1. `main`에서 지역 변수 `x = 3`, `y = 5`를 선언합니다.\n2. `new Test(x, y)`로 생성자에 3, 5가 복사되어 전달되고, 생성자는 `initialize(3, 5)`를 호출합니다.\n3. `initialize`에서 `this.x = 9`, `this.y = 25`로 **객체의 필드**가 바뀝니다.\n4. `System.out.println(x + \" \" + y);`의 `x`, `y`는 `main`의 지역 변수입니다. static 메서드인 `main`에는 `this`가 없고, 지역 변수는 전혀 바뀌지 않았으므로 `3 5`가 출력됩니다.\n`obj.x`, `obj.y`를 출력했다면 `9 25`가 나왔을 것입니다.", "optionNotes": {"A": "생성자에서 인스턴스 메서드를 호출하는 것도, 같은 이름의 지역 변수와 필드를 쓰는 것도 합법이므로 컴파일 에러가 없습니다.", "B": "정답입니다. 출력 대상은 `main`의 지역 변수 3과 5입니다.", "C": "필드 기본값 0을 출력하는 것으로 오해한 답입니다. 출력하는 것은 지역 변수이며, 필드도 이미 9와 25로 바뀌어 있습니다.", "D": "9와 25는 `obj`의 필드 값입니다. `println`은 `obj.x`가 아니라 지역 변수 `x`를 출력합니다."}, "concepts": [{"title": "변수 스코프: 지역 변수 vs 인스턴스 필드", "body": "메서드 안에서 이름이 같은 지역 변수가 있으면 그 이름은 항상 지역 변수를 뜻합니다. static 메서드에서는 인스턴스 필드를 이름만으로 쓸 수 없고 `obj.x`처럼 참조를 거쳐야 합니다. 출력문에 어떤 변수가 쓰였는지, 그 변수의 스코프가 어디인지를 먼저 확인하는 습관을 들이십시오."}, {"title": "기본형 인자 전달", "body": "기본형은 값이 복사되어 전달되므로 호출된 메서드에서 무슨 일을 해도 호출한 쪽의 변수는 그대로입니다. 이 문제에서는 메서드가 매개변수를 바꾸지도 않았지만, 바꿨더라도 `main`의 `x`, `y`는 3, 5입니다."}], "trap": "생성자에서 제곱 계산을 보여 주어 `9 25`를 고르게 유도합니다. 출력문이 객체 필드가 아니라 지역 변수를 출력한다는 점이 핵심입니다.", "tags": ["지역 변수 섀도잉", "this 키워드", "pass-by-value"], "occurrences": ["surepassexam Q106 p69", "certleader-B Q70 p112", "certleader-C Q59 p152"], "verified": "compiled", "fixes": [], "no": 89}, {"id": 99, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class App {\n    int count;\n    public static void displayMsg () {\n        count++;                                         // line n1\n        System.out.println (\"Welcome \"+\"Visit Count: \"+count); // line n2\n    }\n    public static void main (String [] args) {\n        App.displayMsg ();                              // line n3\n        App.displayMsg ();                              // line n4\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails at line n3 and line n4.", "code": null}, {"key": "B", "text": "Compilation fails at line n1 and line n2.", "code": null}, {"key": "C", "text": "", "code": "Welcome Visit Count: 1\nWelcome Visit Count: 1"}, {"key": "D", "text": "", "code": "Welcome Visit Count: 1\nWelcome Visit Count: 2"}], "correct": "B", "dumpAnswer": "B", "answerNote": "", "summary": "static 메서드 displayMsg 안에서 인스턴스 변수 count를 사용하므로 line n1과 n2에서 컴파일 에러가 납니다.", "walkthrough": "1. `count`는 `static`이 없는 인스턴스 변수이므로 `App` 객체가 있어야만 존재합니다.\n2. `displayMsg()`는 static 메서드라서 `this`가 없습니다.\n3. line n1의 `count++`와 line n2의 `+ count` 모두 `non-static variable count cannot be referenced from a static context` 에러를 냅니다(javac가 두 줄 모두 보고합니다).\n4. line n3, n4의 `App.displayMsg()`는 static 메서드를 클래스 이름으로 호출하는 것이므로 문제가 없습니다.\n`count`를 `static int count;`로 바꾸면 `Welcome Visit Count: 1`, `Welcome Visit Count: 2`가 출력될 것입니다.", "optionNotes": {"A": "static 메서드를 클래스 이름으로 호출하는 것은 정상이므로 line n3, n4에는 에러가 없습니다.", "B": "정답입니다. static 메서드에서 인스턴스 변수 `count`를 참조하는 두 줄이 모두 컴파일 에러입니다.", "C": "`count`가 static이었다 해도 두 번째 호출에서는 `2`가 출력되어야 하므로 맞지 않으며, 애초에 코드가 컴파일되지 않습니다.", "D": "`count`가 static이었다면 나올 출력이지만, 실제로는 컴파일되지 않아 아무것도 출력되지 않습니다."}, "concepts": [{"title": "static 컨텍스트의 제약", "body": "static 메서드(및 static 초기화 블록)에는 `this`가 없으므로 인스턴스 변수와 인스턴스 메서드를 이름만으로 사용할 수 없습니다. 사용하려면 객체를 만들어 참조를 통해 접근해야 합니다.\n```java\nstatic void m() {\n    // count++;          // 에러\n    App a = new App();\n    a.count++;           // OK\n}\n```\n반대로 인스턴스 메서드에서는 static 멤버를 자유롭게 쓸 수 있습니다."}, {"title": "static 변수와 인스턴스 변수의 차이", "body": "static 변수는 클래스당 하나만 존재하고 모든 객체가 공유합니다. 인스턴스 변수는 객체마다 따로 존재합니다. 방문 횟수처럼 객체와 무관하게 누적되어야 하는 값은 static으로 선언해야 합니다."}], "trap": "출력 결과 보기를 그럴듯하게 제시해 static 위반을 놓치게 만듭니다. `main`이나 static 메서드에서 이름만으로 쓰인 변수가 static인지 먼저 확인하십시오.", "tags": ["static 컨텍스트", "인스턴스 변수"], "occurrences": ["surepassexam Q114 p72", "certleader-B Q8 p102", "certleader-C Q10 p143"], "verified": "compiled", "fixes": ["똑같이 인쇄된 보기 C·D를 다른 덤프 사본(certleader-B Q8)대로 C `…Count: 1` / `…Count: 1`, D `…Count: 1` / `…Count: 2`로 복원하고 줄바꿈을 살려 코드 블록으로 표시", "line n2의 들여쓰기를 메서드 본문에 맞게 정리"], "no": 90}, {"id": 115, "topic": "methods", "parts": [{"type": "text", "content": "Given the following two classes:"}, {"type": "code", "content": "public class Customer {\n    ElectricAccount acct = new ElectricAccount();\n\n    public void useElectricity(double kWh){\n        acct.addKWh(kWh);\n    }\n}\n\npublic class ElectricAccount {\n    private double kWh;\n    private double rate = 0.07;\n    private double bill;\n\n    //line n1\n}"}, {"type": "text", "content": "How should you write methods in the ElectricAccount class at line n1 so that the member variable bill is always equal to the value of the member variable kWh multiplied by the member variable rate?\nAny amount of electricity used by a customer (represented by an instance of the Customer class) must contribute to the customer's bill (represented by the member variable bill) through the useElectricity method. An instance of the Customer class should never be able to tamper with or decrease the value of the member variable bill."}], "options": [{"key": "A", "text": "", "code": "public void addKWh(double kWh) {\n    this.kWh += kWh;\n    this.bill = this.kWh*this.rate;\n}"}, {"key": "B", "text": "", "code": "public void addKWh(double kWh) {\n    if (kWh > 0){\n        this.kWh += kWh;\n        this.bill = this.kWh * this.rate;\n    }\n}"}, {"key": "C", "text": "", "code": "private void addKWh(double kWh) {\n    if (kWh > 0) {\n        this.kWh += kWh;\n        this.bill = this.kWh*this.rate;\n    }\n}"}, {"key": "D", "text": "", "code": "public void addKWh(double kWh) {\n    if(kWh > 0) {\n        this.kWh += kWh;\n        setBill(this.kWh);\n    }\n}\npublic void setBill(double kWh) {\n    bill = kWh*rate;\n}"}], "correct": "B", "dumpAnswer": "AC", "answerNote": "덤프 정답 AC는 틀렸습니다. C는 `addKWh`가 private이라 `Customer`의 `acct.addKWh(kWh)`가 `addKWh(double) has private access` 컴파일 에러를 냅니다(javac로 확인). A는 음수 kWh를 받아들여 bill을 줄일 수 있으므로(100 사용 후 -50을 넣으면 bill이 7.0에서 3.5로 감소) 'bill을 줄일 수 없어야 한다'는 조건을 어깁니다. D는 public `setBill`이 노출되어 `Customer`가 `acct.setBill(0)`처럼 bill을 조작할 수 있습니다. 조건을 모두 만족하는 것은 B 하나뿐입니다. 덤프는 정답을 두 개(AC)로 표기했지만 실제로는 B 하나를 고르는 문항입니다.", "summary": "addKWh는 Customer가 호출할 수 있도록 public이어야 하고, 음수를 막아야 하며, bill을 직접 바꾸는 public 메서드가 없어야 하므로 B만 조건을 모두 만족합니다.", "walkthrough": "요구사항은 세 가지입니다. (1) `bill`은 항상 `kWh * rate`와 같아야 하고, (2) `Customer`의 `useElectricity`를 통해 사용량이 반영되어야 하며, (3) `Customer`가 bill을 조작하거나 줄일 수 없어야 합니다. 각 보기를 넣고 `useElectricity(100)` 후 `useElectricity(-50)`을 호출해 보았습니다.\n- A: 컴파일은 되지만 음수가 그대로 더해져 bill이 7.0에서 3.5로 줄어듭니다. (3) 위반입니다.\n- B: 양수만 반영하므로 -50이 무시되어 bill이 7.0으로 유지됩니다. 모든 조건을 만족합니다.\n- C: `addKWh`가 private이라 `Customer`에서 호출할 수 없어 컴파일 에러입니다. (2) 위반입니다.\n- D: 실행 결과는 B와 같지만 `setBill(double)`이 public이라 `Customer`가 `acct.setBill(-1000)` 등으로 bill을 임의로 바꿀 수 있습니다. (1), (3) 위반입니다.", "optionNotes": {"A": "음수 값 검사가 없어 `useElectricity(-50)`처럼 호출하면 bill이 줄어듭니다. 'bill을 줄일 수 없어야 한다'는 조건에 어긋납니다.", "B": "정답입니다. public이라 `Customer`가 호출할 수 있고, 양수만 반영하며, bill을 직접 바꾸는 통로가 없습니다.", "C": "private 메서드라 다른 클래스인 `Customer`에서 `acct.addKWh(kWh)`를 호출할 수 없어 컴파일 에러입니다.", "D": "public `setBill`이 외부에 공개되어 `Customer`가 bill을 임의의 값으로 설정할 수 있으므로 캡슐화가 깨집니다."}, "concepts": [{"title": "캡슐화(encapsulation)", "body": "캡슐화는 필드를 `private`으로 숨기고, 외부에는 필요한 동작만 public 메서드로 제공해 객체의 상태 규칙(불변식)을 객체 스스로 지키게 하는 설계 원칙입니다. 필드를 private으로 만든 것만으로는 부족하며, public 메서드가 잘못된 값을 걸러 내지 못하거나 상태를 마음대로 바꾸는 setter를 공개하면 캡슐화가 깨집니다. 시험에서는 '유효성 검사가 있는가', '불필요한 public setter가 있는가'를 확인하십시오."}, {"title": "private 메서드와 도우미 메서드", "body": "외부에서 호출할 필요가 없는 내부 계산용 메서드는 private으로 두는 것이 좋습니다. D의 `setBill`도 private이었다면 B와 마찬가지로 올바른 설계가 됩니다. 반대로 다른 클래스가 반드시 호출해야 하는 메서드를 private으로 만들면 컴파일 에러가 납니다."}], "trap": "C의 private이 '더 안전해 보이는' 점을 이용하지만, 호출 자체가 막혀 컴파일되지 않습니다. D는 동작은 맞아 보여도 public setter가 숨은 문제입니다.", "tags": ["캡슐화", "접근 제어자", "메서드 설계"], "occurrences": ["surepassexam Q159 p84"], "verified": "compiled", "fixes": ["고를 개수가 없는 단일 정답 문항이므로 choose를 2에서 1로 수정", "문제의 `kwh`를 `kWh`로, `customer class`를 `Customer class`로, `the method use Electricity method`를 `the useElectricity method`로 수정"], "no": 91}, {"id": 118, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class TestScope {\n    public static void main(String[] args) {\n        int var1 = 200;\n        System.out.print(doCalc(var1));\n        System.out.print(\" \"+var1);\n    }\n    static int doCalc(int var1){\n        var1 = var1 * 2;\n        return var1;\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "400 200", "code": null}, {"key": "B", "text": "200 200", "code": null}, {"key": "C", "text": "400 400", "code": null}, {"key": "D", "text": "Compilation fails.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "Java는 값에 의한 전달이므로 doCalc 안에서 매개변수 var1을 바꿔도 main의 var1은 200 그대로이고 출력은 `400 200`입니다.", "walkthrough": "1. main에서 지역변수 `var1 = 200`을 선언합니다.\n2. `doCalc(var1)`을 호출하면 200이라는 값이 복사되어 doCalc의 매개변수 `var1`에 들어갑니다. 이름이 같아도 두 변수는 완전히 별개입니다.\n3. doCalc 안에서 매개변수 `var1 = 200 * 2 = 400`으로 바꾸고 400을 반환합니다. main의 var1에는 영향이 없습니다.\n4. 첫 print가 `400`을 출력하고, 두 번째 print가 main의 `var1`(여전히 200)을 붙여 ` 200`을 출력합니다.\n최종 출력은 `400 200`입니다.", "optionNotes": {"A": "정답입니다. 반환값 400이 먼저 출력되고 main의 var1은 복사본만 넘겨졌으므로 200 그대로입니다.", "B": "doCalc는 `var1 * 2`를 반환하므로 첫 출력은 200이 아니라 400입니다.", "C": "매개변수는 값의 복사본이므로 doCalc 안의 대입이 main의 var1을 400으로 바꾸지 못합니다.", "D": "메서드 매개변수가 main의 지역변수와 이름이 같아도 서로 다른 스코프이므로 문제가 없습니다. 컴파일됩니다."}, "concepts": [{"title": "Java는 항상 pass-by-value", "body": "메서드를 호출할 때 인자의 '값'이 매개변수로 복사됩니다. 기본형이면 숫자 값 자체가, 참조형이면 참조값(주소)이 복사됩니다. 그래서 메서드 안에서 매개변수에 새 값을 대입해도 호출한 쪽 변수는 바뀌지 않습니다. 단, 참조형의 경우 복사된 참조로 객체의 내부 상태(필드, 배열 요소)를 바꾸면 그 변경은 호출한 쪽에서도 보입니다.\n```java\nstatic void m(int n, int[] arr) { n = 99; arr[0] = 99; arr = new int[1]; }\nint n = 1; int[] arr = {1};\nm(n, arr);\n// n == 1, arr[0] == 99\n```"}, {"title": "지역변수와 매개변수의 스코프", "body": "매개변수는 해당 메서드 블록 안에서만 유효한 지역변수입니다. 서로 다른 메서드에 같은 이름의 지역변수가 있어도 충돌하지 않습니다. 반면 같은 메서드 안에서 매개변수와 같은 이름의 지역변수를 다시 선언하면 컴파일 에러입니다(`void f(int x){ int x = 1; }`)."}], "trap": "같은 이름 var1을 써서 메서드가 main의 변수를 바꾸는 것처럼 보이게 만든 함정입니다.", "tags": ["pass-by-value", "변수 스코프", "매개변수 섀도잉"], "occurrences": ["surepassexam Q165 p87"], "verified": "compiled", "fixes": [], "no": 92}, {"id": 141, "topic": "methods", "parts": [{"type": "text", "content": "Given these two classes:"}, {"type": "code", "content": "public class Customer {\n    ElectricAccount acct = new ElectricAccount();\n\n    public void useElectricity(double kWh){\n        acct.addKWh(kWh);\n    }\n}\n\npublic class ElectricAccount {\n    private double kWh;\n    private double rate = 0.07;\n    private double bill;\n\n    //line n1\n}"}, {"type": "text", "content": "Any amount of electricity used by a customer (represented by an instance of the Customer class) must contribute to the customer's bill (represented by the member variable bill) through the useElectricity method.\nAn instance of the Customer class should never be able to tamper with or decrease the value of the member variable bill.\nHow should you write methods in the ElectricAccount class at line n1 so that the member variable bill is always equal to the value of the member variable kWh multiplied by the member variable rate?"}], "options": [{"key": "A", "text": "", "code": "public void addKWh(double kWh) {\n    this.kWh += kWh;\n    this.bill = this.kWh*this.rate;\n}"}, {"key": "B", "text": "", "code": "public void addKWh(double kWh) {\n    if (kWh > 0){\n        this.kWh += kWh;\n        this.bill = this.kWh * this.rate;\n    }\n}"}, {"key": "C", "text": "", "code": "private void addKWh(double kWh) {\n    if (kWh > 0) {\n        this.kWh += kWh;\n        this.bill = this.kWh*this.rate;\n    }\n}"}, {"key": "D", "text": "", "code": "public void addKWh(double kWh) {\n    if(kWh > 0) {\n        this.kWh += kWh;\n        setBill(this.kWh);\n    }\n}\npublic void setBill(double kWh) {\n    bill = kWh*rate;\n}"}], "correct": "B", "dumpAnswer": "A", "answerNote": "덤프 정답 A는 틀렸습니다. A는 음수 kWh를 막지 않으므로 `useElectricity(-50)` 같은 호출로 bill을 줄일 수 있어 '고객이 bill을 감소시킬 수 없어야 한다'는 조건을 어깁니다. 각 보기를 실제로 실행해 A는 100 후 -50 입력 시 bill이 3.5로 줄고, D는 public `setBill(0)`으로 bill을 0으로 만들 수 있으며, C는 Customer에서 private 메서드를 호출해 컴파일 에러가 남을 확인했습니다. 조건을 모두 만족하는 것은 B입니다.", "summary": "public addKWh로 Customer가 호출할 수 있게 하면서 `kWh > 0` 검사로 감소를 막고, bill을 바꾸는 다른 public 메서드를 두지 않는 B가 정답입니다.", "walkthrough": "요구 조건은 세 가지입니다. (1) Customer의 `useElectricity`가 `acct.addKWh(kWh)`를 호출할 수 있어야 함, (2) Customer가 bill을 조작하거나 줄일 수 없어야 함, (3) 항상 `bill == kWh * rate`.\n1. A: public이라 (1)은 만족하지만 음수 인자를 그대로 더하므로 `useElectricity(-50)`으로 kWh와 bill이 줄어듭니다. (2) 위반.\n2. B: public이고 `kWh > 0`일 때만 누적·재계산하므로 bill은 줄지 않고 항상 kWh*rate입니다. bill을 직접 바꾸는 다른 경로도 없습니다. 모든 조건 만족.\n3. C: private이라 Customer의 `acct.addKWh(kWh)`가 'has private access' 컴파일 에러입니다. (1) 위반.\n4. D: addKWh 자체는 B와 같지만 `setBill(double)`이 public이라 Customer가 `acct.setBill(0)`처럼 임의 값을 넣어 bill을 줄이고 kWh*rate 불변식도 깰 수 있습니다. (2)(3) 위반.", "optionNotes": {"A": "음수 kWh를 막지 않아 bill을 줄일 수 있으므로 '감소시킬 수 없어야 한다'는 조건을 어깁니다. 덤프 정답이지만 틀립니다.", "B": "정답입니다. 외부에서 호출 가능하고, 양수일 때만 누적하며, bill을 바꾸는 다른 public 경로가 없어 불변식이 유지됩니다.", "C": "private 메서드는 다른 클래스(Customer)에서 호출할 수 없어 `acct.addKWh(kWh)`가 컴파일 에러입니다.", "D": "public `setBill`이 노출되어 Customer가 원하는 kWh 값을 넘겨 bill을 임의로 바꿀(줄일) 수 있습니다. 캡슐화가 깨집니다."}, "concepts": [{"title": "캡슐화와 불변식", "body": "캡슐화는 필드를 private으로 숨기고, 상태 변경은 검증 로직이 있는 메서드로만 허용하는 설계입니다. 객체가 항상 지켜야 하는 조건(불변식)이 있으면, 그 조건을 깨뜨릴 수 있는 public 메서드(무검증 setter 등)를 노출하지 않아야 합니다. 시험에서는 '필드 private + 필요한 public 메서드 + 입력 검증' 조합이 정답인 경우가 많습니다."}, {"title": "접근 제어자 범위", "body": "`private`은 같은 클래스 안에서만, 기본(package-private)은 같은 패키지, `protected`는 같은 패키지 + 다른 패키지의 하위 클래스(상속 경로로), `public`은 어디서나 접근 가능합니다. 다른 클래스가 호출해야 하는 메서드를 private으로 만들면 호출부에서 컴파일 에러가 납니다."}], "trap": "A처럼 계산식만 맞으면 된다고 생각하게 만들지만, 음수 입력과 public setter 같은 '조작 경로'까지 따져야 합니다.", "tags": ["캡슐화", "접근 제어자", "불변식(invariant) 유지"], "occurrences": ["certleader-B Q13 p103"], "verified": "compiled", "fixes": ["문제 본문의 `kwh`를 필드 이름과 같은 `kWh`로 수정"], "no": 93}, {"id": 145, "topic": "methods", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Caller {\n    private void init () {\n        System.out.println(\"Initialized\");\n    }\n\n    public void start () {\n        init();\n        System.out.println(\"Started\");\n    }\n}\n\npublic class TestCall {\n    public static void main(String[] args) {\n        Caller c = new Caller();\n        c.start(); // line n1\n        c.init();  // line n2\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "Compilation fails at line n1.", "code": null}, {"key": "B", "text": "", "code": "Initialized\nStarted\nInitialized"}, {"key": "C", "text": "", "code": "Initialized\nStarted"}, {"key": "D", "text": "Compilation fails at line n2.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "덤프 사본들에는 `start()`까지 `private`으로 인쇄되어 있는데, 그대로 컴파일하면 line n1과 line n2 둘 다 \"has private access\" 에러가 나서 A와 D가 모두 맞게 됩니다. 원래 시험 문제처럼 `start()`를 `public`으로 바로잡으면 line n2에서만 에러가 나는 것을 javac로 확인했습니다.", "summary": "`private` 메서드는 선언한 클래스 안에서만 호출할 수 있으므로, 다른 클래스에서 `c.init()`를 호출한 line n2가 컴파일 에러입니다.", "walkthrough": "1. `TestCall.main`에서 `new Caller()`로 객체를 만드는 것은 문제없습니다. 생성자를 따로 선언하지 않았으므로 컴파일러가 기본 생성자를 넣어 줍니다.\n2. line n1 `c.start()`는 `public` 메서드를 호출하므로 다른 클래스에서도 접근할 수 있습니다.\n3. `start()` 안의 `init()` 호출은 같은 `Caller` 클래스 안에서 일어나므로 `private`이어도 괜찮습니다.\n4. line n2 `c.init()`는 `TestCall` 클래스에서 `Caller`의 `private` 멤버에 접근합니다. `private`은 선언한 클래스(최상위 클래스 본문) 밖에서는 보이지 않으므로 `init() has private access in Caller` 컴파일 에러가 납니다.\n컴파일 에러가 하나라도 있으면 프로그램은 실행되지 않으므로 출력 결과를 고르는 B, C는 답이 될 수 없습니다.", "optionNotes": {"A": "`start()`는 `public`이므로 다른 클래스에서 호출할 수 있어 line n1은 정상적으로 컴파일됩니다.", "B": "line n2가 컴파일되지 않으므로 아무것도 출력되지 않습니다. `c.init()`가 허용되었다면 나올 출력이지만 `private` 접근 때문에 불가능합니다.", "C": "`c.start()`만 실행됐을 때의 출력입니다. 하지만 같은 파일에 컴파일 에러(line n2)가 있으므로 실행 자체가 되지 않습니다.", "D": "정답입니다. `TestCall`에서 `Caller`의 `private` 메서드 `init()`을 호출하므로 line n2에서 컴파일 에러가 납니다."}, "concepts": [{"title": "접근 제어자 4단계", "body": "Java의 접근 범위는 넓은 순서대로 `public`(어디서나) > `protected`(같은 패키지 + 다른 패키지의 하위 클래스) > package-private, 즉 제어자 없음(같은 패키지만) > `private`(선언한 클래스 안에서만)입니다. 이 문제처럼 두 클래스가 같은 파일, 같은 패키지에 있어도 `private`은 다른 클래스에서 접근할 수 없습니다. 같은 패키지라는 이유로 열리는 범위는 default와 `protected`까지입니다. 단, 중첩 클래스(inner class)는 바깥 클래스의 `private` 멤버에 접근할 수 있고 그 반대도 가능합니다. 둘 다 같은 최상위 클래스 본문 안에 있기 때문입니다."}, {"title": "private 메서드와 캡슐화", "body": "외부에 노출할 필요가 없는 보조 로직은 `private`으로 숨기고, 외부에는 `public` 메서드만 공개하는 것이 캡슐화의 기본 설계입니다. `public` 메서드 안에서 `private` 메서드를 호출하는 것은 같은 클래스 안이므로 항상 허용됩니다.\n```java\nclass Account {\n    private void log() { }\n    public void deposit() { log(); }  // OK: 같은 클래스\n}\n// 다른 클래스에서 new Account().log();  -> 컴파일 에러\n```"}], "trap": "같은 소스 파일에 있는 클래스라서 `private` 메서드도 부를 수 있다고 착각하게 만듭니다. 또 `start()` 안에서 `init()`을 부르는 것은 정상이라는 점과 헷갈리게 합니다.", "tags": ["private 접근 제어", "접근 제어자", "컴파일 에러 위치"], "occurrences": ["certleader-B Q46 p110", "certleader-C Q37 p149", "certleader-D Q10 p173", "certleader-A Q32 p11", "2passeasy Q15 p21", "certleader-B Q80 p113"], "verified": "compiled", "fixes": ["덤프 사본 모두 `start()`가 `private`으로 인쇄되어 line n1·n2가 둘 다 실패(A·D 모두 정답)하므로, 원래 시험 문제대로 `public void start ()`로 수정", "`start()` 본문의 들여쓰기를 정리", "보기 B·C의 사라진 줄바꿈을 복원해 여러 줄 출력(code 블록)으로 표시"], "no": 94}, {"id": "X7", "topic": "methods", "tags": ["static 문맥과 this", "public 필드 접근", "메서드 호출 결과 대입"], "parts": [{"type": "text", "content": "Given the following class:"}, {"type": "code", "content": "public class CheckingAccount {\n    public int amount;\n    public CheckingAccount(int amount) {\n        this.amount = amount;\n    }\n    public int getAmount() {\n        return amount;\n    }\n    public void changeAmount(int x) {\n        amount += x;\n    }\n}"}, {"type": "text", "content": "And given the following main method, located in another class:"}, {"type": "code", "content": "public static void main(String[] args) {\n    CheckingAccount acct = new CheckingAccount((int) (Math.random() * 1000));\n    //line n1\n    System.out.println(acct.getAmount());\n}"}, {"type": "text", "content": "Which three lines, when inserted independently at line n1, cause the program to print a 0 balance? (Choose three.)"}], "options": [{"key": "A", "text": "", "code": "this.amount = 0;"}, {"key": "B", "text": "", "code": "amount = 0;"}, {"key": "C", "text": "", "code": "acct(0);"}, {"key": "D", "text": "", "code": "acct.amount = 0;"}, {"key": "E", "text": "", "code": "acct.getAmount() = 0;"}, {"key": "F", "text": "", "code": "acct.changeAmount(0);"}, {"key": "G", "text": "", "code": "acct.changeAmount(-acct.amount);"}, {"key": "H", "text": "", "code": "acct.changeAmount(-acct.getAmount());"}], "choose": 3, "correct": "DGH", "dumpAnswersAll": ["ACD", "BDF", "DGH"], "answerNote": "정답은 D, G, H입니다. 덤프 대부분(11부)이 ACD로 표기했지만 A는 static 메서드 안에서 `this`를 써서, C는 `acct`가 메서드가 아니어서 둘 다 컴파일 오류입니다. 실제로 컴파일하면 D, G, H만 0을 출력합니다. BDF로 표기한 사본(f14)은 보기에 `setAmount()`가 추가되고 순서가 바뀐 변형이며, 그 변형에서도 정답은 B(`acct.amount = 0`), C(`setAmount(0)`), G(`changeAmount(-acct.amount)`)이므로 BDF는 맞지 않습니다. DGH로 표기한 사본 하나만 맞습니다.", "verified": "compiled", "summary": "다른 클래스의 static `main`에서는 참조 변수 `acct`를 통해서만 필드와 메서드에 접근할 수 있으므로, 0으로 만드는 방법은 `acct.amount = 0` 또는 현재 값만큼 빼는 G, H입니다.", "walkthrough": "1. `acct`는 0~999 사이의 난수 금액으로 만들어집니다. n1에서 이 값을 확실히 0으로 만들어야 합니다.\n2. `main`은 다른 클래스에 있는 **static** 메서드입니다. 여기에는 `this`가 없고, `amount`라는 이름도 이 클래스에는 없습니다.\n3. A: static 문맥에서 `this`를 쓰므로 컴파일 오류입니다.\n4. B: 이 클래스에는 `amount`라는 변수가 없어서 `cannot find symbol` 오류입니다.\n5. C: `acct`는 변수이지 메서드가 아니므로 `acct(0)`은 컴파일 오류입니다.\n6. D: `amount`가 public이므로 다른 클래스에서 `acct.amount = 0`으로 직접 바꿀 수 있고 0이 출력됩니다.\n7. E: 메서드 호출 결과는 값일 뿐 변수가 아니므로 대입 연산자 왼쪽에 올 수 없습니다(`unexpected type`).\n8. F: 0을 더하므로 난수 값이 그대로 출력됩니다.\n9. G, H: 현재 금액의 음수를 더하므로 `amount + (-amount)`가 되어 항상 0이 출력됩니다.", "optionNotes": {"A": "static 메서드인 `main`에는 `this`가 없습니다. 게다가 이 클래스에는 `amount` 필드도 없어서 컴파일 오류입니다.", "B": "`main`이 있는 클래스에는 `amount`라는 변수가 없으므로 `cannot find symbol` 컴파일 오류입니다.", "C": "`acct`는 참조 변수입니다. 변수 이름 뒤에 괄호를 붙여 메서드처럼 호출할 수 없으므로 컴파일 오류입니다.", "D": "정답입니다. `amount`가 public 필드라 다른 클래스에서도 `acct.amount = 0`으로 직접 대입할 수 있습니다.", "E": "`acct.getAmount()`는 int 값을 돌려주는 식일 뿐 변수가 아니므로 대입할 수 없습니다.", "F": "컴파일은 되지만 0을 더하므로 난수 금액이 그대로 출력됩니다. 난수가 0일 때만 우연    }\n}"}, {"type": "text", "content": "And,"}, {"type": "code", "content": "public class TestA {\n    public static void main(String[] args) {\n        Alpha ref1 = new Alpha(50);\n        Alpha ref2 = new Alpha(125);\n        Alpha ref3 = new Alpha(100);\n        ref1.doPrint();\n        ref2.doPrint();\n        ref3.doPrint();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "ns = 50 s = 125\nns = 125 s = 125\nns = 100 s = 125"}, {"key": "B", "text": "", "code": "ns = 50 s = 125\nns = 125 s = 125\nns = 0 s = 125"}, {"key": "C", "text": "", "code": "ns = 50 s = 50\nns = 125 s = 125\nns = 100 s = 100"}, {"key": "D", "text": "", "code": "ns = 50 s = 50\nns = 125 s = 125\nns = 0 s = 125"}], "choose": 1, "correct": "B", "dumpAnswersAll": ["C", "B"], "answerNote": "정답은 B이고, 가장 많은 사본이 적은 C는 오답입니다. C는 `s`를 객체마다 따로 있는 값으로 착각한 결과입니다. `s`는 static이라 세 객체가 하나를 공유하므로 출력 시점에는 모두 125입니다. 한편 gratisexam f14 사본은 생성 순서를 `100, 50, 125`로 바꾼 변형인데, 보기 C에 이 원본의 정답 출력을 그대로 두고 답도 C로 적어 그 판의 코드와는 맞지 않습니다(그 변형의 실제 출력은 `ns = 100 s = 125 / ns = 0 s = 125 / ns = 125 s = 125`로 그 판의 A).", "verified": "compiled", "summary": "`s`는 모든 객체가 공유하는 static 필드라 최종값 125가 세 줄 모두에 찍히고, 조건이 false였던 `ref3`의 `ns`는 기본값 0으로 남습니다.", "walkthrough": "1. 처음에 static 필드 `s`는 0입니다.\n2. `new Alpha(50)`: `0 < 50`이 true이므로 `s = 50`, `ref1.ns = 50`이 됩니다.\n3. `new Alpha(125)`: `50 < 125`가 true이므로 `s = 125`, `ref2.ns = 125`가 됩니다.\n4. `new Alpha(100)`: `125 < 100`이 false라서 if 블록 전체를 건너뜁니다. `this.ns = ns;`도 if 안에 있으므로 `ref3.ns`는 int 기본값 0으로 남고 `s`는 125 그대로입니다.\n5. 출력은 생성이 모두 끝난 뒤에 일어나므로 세 줄 모두 현재의 `s` 값 125를 출력합니다.\n6. 결과는 `ns = 50 s = 125`, `ns = 125 s = 125`, `ns = 0 s = 125`로 B입니다.", "optionNotes": {"A": "세 번째 객체에서 if 조건(`125 < 100`)이 false이므로 `this.ns = ns`도 실행되지 않습니다. `ns`는 100이 아니라 0입니다.", "B": "정답입니다. 공유되는 `s`의 최종값 125가 세 줄 모두에 찍히고 `ref3.ns`는 기본값 0입니다.", "C": "`s`를 객체마다 따로 저장되는 값처럼 본 오답입니다. static 필드는 하나뿐이고 출력은 모든 생성이 끝난 뒤에 하므로 첫 줄도 `s = 125`입니다. 또 `ref3.ns`는 100이 아닙니다.", "D": "`ref3.ns = 0`은 맞지만 첫 줄의 `s`는 출력 시점의 값 125여야 합니다. 생성 시점의 값 50을 기억해 두는 것이 아닙니다."}, "concepts": [{"title": "static 필드와 인스턴스 필드", "body": "static 필드는 클래스당 하나만 존재하고 모든 인스턴스가 공유합니다. 어느 객체를 통해 읽든(`ref1.s`, `Alpha.s`) 같은 메모리의 현재 값을 봅니다. 반면 인스턴스 필드(`ns`)는 객체마다 따로 있습니다.\n\n- 출력 문제에서는 static 값이 '언제 바뀌었는지'보다 '출력 시점에 얼마인지'를 확인해야 합니다.\n- 여러 객체를 다 만든 뒤 출력하면 static 필드는 모든 줄에서 같은 최종값을 보여 줍니다."}, {"title": "필드의 기본값과 조건부 초기화", "body": "지역 변수와 달리 필드는 명시적으로 대입하지 않아도 기본값을 가집니다. `int`·`long` 등 정수형은 0, `double`은 0.0, `boolean`은 false, 참조형은 null입니다. 그래서 생성자에서 대입이 if 안에만 있으면 조건이 false인 객체의 필드는 기본값으로 남고, 컴파일 오류도 나지 않습니다. 이 문제처럼 대입문이 어느 블록에 들어 있는지 중괄호를 꼼꼼히 확인해야 합니다."}], "trap": "`this.ns = ns;`가 if 블록 안에 있다는 점과, `s`가 static이라 출력 시점의 최종값이 모든 줄에 찍힌다는 점 두 가지를 동시에 노립니다.", "fixes": [], "occurrences": ["gratisexam-VCE (f10) Q25", "gratisexam-VCE (f11) Q24", "gratisexam-VCE (f13) Q18", "gratisexam-VCE (f14) Q101", "gratisexam-VCE (f15) Q24", "gratisexam-VCE (f20) Q29", "gratisexam-VCE (f8) Q25", "passleader-300q (f2) Q25", "passleader-300q (f2) Q33", "passleader-300q (f2) Q9", "scanned (f3) Q31"], "added": true, "dumpAnswer": "C/B", "no": 96}, {"id": "X10", "topic": "methods", "tags": ["static 필드 공유", "인스턴스 필드", "참조로 static 접근"], "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "public class Test {\n    static int count = 0;\n    int i = 0;\n\n    public void changeCount() {\n        while (i < 5) {\n            i++;\n            count++;\n        }\n    }\n\n    public static void main(String[] args) {\n        Test check1 = new Test();\n        Test check2 = new Test();\n        check1.changeCount();\n        check2.changeCount();\n        System.out.print(check1.count + \" : \" + check2.count);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10 : 10", "code": null}, {"key": "B", "text": "5 : 5", "code": null}, {"key": "C", "text": "5 : 10", "code": null}, {"key": "D", "text": "Compilation fails.", "code": null}], "choose": 1, "correct": "A", "dumpAnswersAll": ["C", "B", "A"], "answerNote": "정답은 A(10 : 10)입니다. 덤프 표기가 A, B, C로 갈린 것은 보기 순서가 다른 변형 때문입니다. f12/f13 사본은 보기가 A. 5 : 5, B. 10 : 10 순서라서 그쪽의 B는 이 문제의 A와 같은 답입니다. 반면 이 순서(A. 10 : 10, B. 5 : 5, C. 5 : 10)의 사본 다수가 C(5 : 10)로 표기했는데, `count`가 static이라 두 참조가 같은 변수를 읽으므로 두 값이 다를 수 없어 틀렸습니다. 컴파일해 실행한 결과도 `10 : 10`입니다.", "verified": "compiled", "summary": "`count`는 static이라 모든 객체가 하나를 공유하고 `i`는 객체마다 따로 있으므로, 두 번 호출 뒤 `count`는 10이고 어느 참조로 읽어도 10입니다.", "walkthrough": "1. `count`는 static 필드라 클래스에 하나만 있고, `i`는 인스턴스 필드라 `check1`, `check2`가 각자 가집니다.\n2. `check1.changeCount()`: `check1.i`가 0→5가 될 때까지 5번 반복하므로 `count`는 0→5가 됩니다.\n3. `check2.changeCount()`: `check2.i`는 새 객체의 필드라 다시 0에서 시작합니다. 5번 반복해 `count`는 5→10이 됩니다.\n4. `check1.count`와 `check2.count`는 참조 변수로 static 필드에 접근한 것이고, 둘 다 `Test.count`와 같은 변수입니다.\n5. 따라서 `10 + \" : \" + 10`이 되어 `10 : 10`이 출력됩니다.", "optionNotes": {"A": "정답입니다. static `count`는 두 객체가 공유하므로 5 + 5 = 10이고, 두 참조 모두 같은 값 10을 읽습니다.", "B": "`count`가 인스턴스 필드였다면 5 : 5가 됩니다. static이므로 두 번째 호출에서 이어서 증가합니다.", "C": "`check1.count`와 `check2.count`는 같은 static 변수라서 출력 시점에 서로 다른 값일 수 없습니다.", "D": "참조 변수로 static 필드에 접근하는 것(`check1.count`)은 경고 대상일 뿐 합법적인 코드입니다."}, "concepts": [{"title": "static 필드와 인스턴스 필드", "body": "static 필드는 클래스가 로드될 때 한 번 만들어져 모든 객체가 공유합니다. 인스턴스 필드는 `new`로 객체를 만들 때마다 새로 생기고 객체마다 값이 따로 있습니다.\n\n- 한 객체가 static 필드를 바꾸면 다른 모든 객체에서 바뀐 값이 보입니다.\n- 객체 참조로 static 필드에 접근(`obj.count`)해도 실제로는 `ClassName.count`로 컴파일됩니다. 참조가 null이어도 NullPointerException이 나지 않습니다.\n- 출력 문제에서는 static 필드의 최종값을 먼저 계산한 뒤 모든 참조에 같은 값을 넣으면 됩니다."}], "trap": "`check1.count`, `check2.count`처럼 객체마다 다른 값을 가진 것처럼 보이게 써서 5 : 10을 고르게 만듭니다. static 필드는 어느 참조로 읽어도 같은 하나의 변수입니다.", "fixes": [], "occurrences": ["gratisexam-VCE (f10) Q29", "gratisexam-VCE (f11) Q28", "gratisexam-VCE (f12) Q69", "gratisexam-VCE (f13) Q70", "gratisexam-VCE (f15) Q28", "gratisexam-VCE (f20) Q33", "gratisexam-VCE (f8) Q29", "gratisexam-VCE (f9) Q69", "passleader-300q (f2) Q104", "passleader-300q (f2) Q13", "passleader-300q (f2) Q19", "passleader-300q (f2) Q218", "passleader-300q (f2) Q29", "passleader-300q (f2) Q37", "scanned (f3) Q35"], "added": true, "dumpAnswer": "C/B/A", "no": 97}, {"id": 4, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class A {\n    public void test () {\n        System.out.println (\"A\");\n    }\n}\nclass B extends A {\n    public void test () {\n        System.out.println (\"B\");\n    }\n}\npublic class C extends A {\n    public void test () {\n        System.out.println (\"C\");\n    }\n\n    public static void main (String [] args) {\n        A b1 = new A ();\n        A b2 = new C ();\n\n        b1 = (A) b2;            //line n1\n        A b3 = (B) b2;          //line n2\n        b1.test ();\n        b3.test ();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "A\nB"}, {"key": "B", "text": "", "code": "A\nC"}, {"key": "C", "text": "", "code": "C\nC"}, {"key": "D", "text": "A ClassCastException is thrown only at line n1.", "code": null}, {"key": "E", "text": "A ClassCastException is thrown only at line n2.", "code": null}], "correct": "E", "dumpAnswer": "B/D", "answerNote": "덤프 정답 B는 틀렸고, 덤프마다 B/D로 표기가 다른데 둘 다 틀렸습니다. 실제 정답은 E입니다. `b2`가 참조하는 실제 객체는 `C`인데, `B`와 `C`는 형제 클래스라 line n2의 `(B) b2`가 런타임에 ClassCastException을 던집니다. 그래서 `test()`는 한 번도 실행되지 않습니다. line n1의 `(A) b2`는 업캐스트라서 항상 성공합니다(javac/java 실행으로 확인: n1 통과 후 n2에서 `C cannot be cast to class B`).\n\n**덤프 사본 비교:** 이 문제는 사본마다 코드 순서가 다릅니다. certleader-A/D 사본은 n1이 `(A) b2`, n2가 `(B) b2`라서 n2에서 ClassCastException이 나므로 E가 맞습니다. exambible·certleader-B/C 사본은 `(B) b2`가 line n1에 있어서 그 사본에서는 D가 맞습니다. 어느 사본이든 B(AC)는 틀렸습니다. 형제 클래스(C→B)로 캐스팅하면 런타임에 실패한다는 점이 핵심입니다.", "summary": "형제 클래스로 다운캐스트하는 `(B) b2`는 컴파일은 되지만 런타임에 line n2에서 ClassCastException이 발생합니다.", "walkthrough": "1. `A b1 = new A();`, `A b2 = new C();` → `b2`의 선언 타입은 A이고 실제 객체는 C입니다.\n2. line n1 `b1 = (A) b2;`: C 객체를 A로 캐스트합니다. C는 A의 하위 클래스이므로 런타임 검사도 통과합니다. 이제 `b1`도 C 객체를 가리킵니다.\n3. line n2 `A b3 = (B) b2;`: 컴파일러는 `b2`의 선언 타입 A만 봅니다. A에서 B로 가는 다운캐스트는 실제 객체가 B일 수도 있으므로 컴파일을 허용합니다.\n4. 런타임에 JVM이 실제 객체 타입을 검사합니다. 실제 객체는 C이고, C는 B가 아니므로(둘 다 A를 상속한 형제) `ClassCastException`이 발생합니다.\n5. 예외가 main 밖으로 전파되어 프로그램이 종료되므로 `b1.test()`, `b3.test()`는 실행되지 않고 아무것도 출력되지 않습니다.\n실제 실행에서도 n1은 통과했고 `C.main(C.java:10)`(line n2)에서 예외가 났습니다.", "optionNotes": {"A": "출력 단계에 도달하지 못합니다. 설령 실행되더라도 `b1`은 C 객체를 가리키므로 \"A\"가 나올 수 없습니다.", "B": "line n2에서 예외가 나서 출력 문장이 실행되지 않습니다. `b1`이 n1 이후 C 객체를 가리키므로 \"A\"도 나올 수 없습니다.", "C": "line n2의 캐스트가 성공해야 나오는 결과인데, C 객체는 B로 캐스트할 수 없습니다.", "D": "line n1의 `(A) b2`는 C에서 상위 타입 A로 가는 업캐스트라서 절대 실패하지 않습니다.", "E": "정답입니다. `(B) b2`는 컴파일은 되지만 실제 객체 C가 B의 인스턴스가 아니라서 line n2에서만 ClassCastException이 납니다."}, "concepts": [{"title": "참조 캐스팅: 컴파일 타임 검사와 런타임 검사", "body": "컴파일러는 캐스트 대상 타입과 변수의 선언 타입이 상속 관계로 이어질 가능성이 있는지만 봅니다. 상위에서 하위로 가는 다운캐스트나 인터페이스로 가는 캐스트는 대부분 통과합니다. 반면 `String s; (Integer) s`처럼 관련 없는 클래스끼리는 inconvertible types 컴파일 에러입니다. 런타임에는 JVM이 실제 객체가 대상 타입의 인스턴스인지 검사하고, 아니면 `ClassCastException`을 던집니다. 그래서 형제 클래스로의 캐스트는 변수 타입이 공통 부모일 때 컴파일은 되지만 실행 시 실패합니다. 미리 확인하려면 `if (b2 instanceof B)`를 씁니다."}, {"title": "동적 바인딩", "body": "인스턴스 메서드 호출은 참조 변수의 선언 타입이 아니라 실제 객체의 타입에 따라 오버라이딩된 메서드가 선택됩니다. `A a = new C(); a.test();`는 C의 `test()`를 실행합니다. 업캐스트 `(A) obj`를 해도 객체 자체는 바뀌지 않으므로 호출 결과는 같습니다. 반면 필드와 static 메서드는 선언 타입 기준으로 결정됩니다."}], "trap": "\"컴파일이 되니 캐스트도 성공한다\"고 생각하게 만듭니다. 변수 타입이 A라서 컴파일은 되지만, 실제 객체가 C라서 B로는 런타임에 실패합니다.", "tags": ["참조 형변환", "ClassCastException", "다형성"], "occurrences": ["certleader-A Q4 p3", "certleader-D Q4 p172", "exambible Q18 p30", "surepassexam Q172 p87", "certleader-B Q28 p106", "certleader-C Q31 p147"], "verified": "compiled", "fixes": ["보기 A~C(`AB`, `AC`, `CC`)는 println 두 번의 출력이 한 줄로 붙은 것이므로 줄바꿈을 살려 코드 블록(`A`/`B`, `A`/`C`, `C`/`C`)으로 표시"], "no": 98}, {"id": 10, "topic": "inheritance", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "abstract class Toy {\n    int price;\n    // line n1\n}"}, {"type": "text", "content": "Which three code fragments are valid at line n1? (Choose three.)"}], "options": [{"key": "A", "text": "", "code": "public static void insertToy() {\n    /* code goes here */\n}"}, {"key": "B", "text": "", "code": "final Toy getToy() {\n    return new Toy();\n}"}, {"key": "C", "text": "", "code": "public void printToy();"}, {"key": "D", "text": "", "code": "public int calculatePrice() {\n    return price;\n}"}, {"key": "E", "text": "", "code": "public abstract int computeDiscount();"}], "correct": "ADE", "dumpAnswer": "CDE", "answerNote": "덤프 정답 CDE는 틀렸습니다. C `public void printToy();`는 본문이 없는데 `abstract`가 없어서 \"missing a method body, or should be declared abstract\" 컴파일 에러가 납니다. A의 static 메서드는 추상 클래스에 아무 문제 없이 들어갑니다. 각 보기를 단독으로 넣어 javac로 컴파일한 결과 A, D, E만 성공했습니다.", "summary": "추상 클래스에는 static 메서드, 구현된 메서드, abstract 메서드를 모두 둘 수 있지만, 자기 자신을 `new`할 수는 없고 abstract 없는 본문 없는 메서드도 안 됩니다.", "walkthrough": "보기를 하나씩 line n1에 넣어 컴파일한 결과입니다.\n- A `public static void insertToy() { }` → 성공. 추상 클래스도 static 메서드를 가질 수 있고, `Toy.insertToy()`로 호출할 수 있습니다.\n- B `final Toy getToy() { return new Toy(); }` → 실패: `Toy is abstract; cannot be instantiated`. final 메서드 자체는 괜찮지만 추상 클래스를 `new`할 수 없습니다.\n- C `public void printToy();` → 실패: 본문이 없는 메서드는 `abstract`로 선언해야 합니다.\n- D `public int calculatePrice() { return price; }` → 성공. 일반 구현 메서드입니다.\n- E `public abstract int computeDiscount();` → 성공. 추상 클래스 안의 추상 메서드입니다.\n따라서 정답은 A, D, E입니다.", "optionNotes": {"A": "정답입니다. 추상 클래스도 static 메서드를 가질 수 있습니다. abstract와 static을 함께 쓸 수 없을 뿐, static 메서드 자체는 문제없습니다.", "B": "`new Toy()`는 추상 클래스를 인스턴스화하므로 컴파일 에러입니다. `final` 키워드는 문제가 아닙니다.", "C": "본문 없이 세미콜론으로 끝나는 메서드는 `abstract`가 있어야 합니다(인터페이스와 달리 추상 클래스에서는 자동으로 abstract가 붙지 않습니다). 컴파일 에러입니다.", "D": "정답입니다. 추상 클래스에도 구현된 일반 메서드를 둘 수 있고, 필드 `price`에 접근하는 것도 정상입니다.", "E": "정답입니다. 추상 클래스에 본문 없는 `abstract` 메서드를 선언하는 것은 전형적인 사용법입니다."}, "concepts": [{"title": "추상 클래스의 규칙", "body": "`abstract class`는 `new`로 직접 생성할 수 없지만, 생성자, 필드, static 메서드, 구현 메서드, 추상 메서드를 모두 가질 수 있습니다. 추상 메서드가 하나라도 있으면 클래스도 abstract여야 합니다. 반대로 추상 메서드가 하나도 없어도 abstract 클래스로 선언할 수 있습니다. 추상 클래스를 상속한 구체 클래스는 모든 추상 메서드를 구현해야 하고, 하나라도 구현하지 않으면 그 클래스도 abstract로 선언해야 합니다. `new Toy() { ... }`처럼 익명 하위 클래스를 만드는 것은 가능합니다."}, {"title": "abstract와 함께 쓸 수 없는 제어자", "body": "추상 메서드는 하위 클래스가 오버라이딩해야 하므로 `final`, `private`, `static`과 함께 쓸 수 없습니다(`abstract final`, `private abstract`, `static abstract`는 모두 컴파일 에러). 추상 메서드는 본문 `{}`을 가질 수 없고 반드시 `;`로 끝납니다. 인터페이스의 본문 없는 메서드는 자동으로 `public abstract`가 되지만, 추상 클래스에서는 `abstract`를 명시해야 합니다."}], "trap": "인터페이스처럼 `public void printToy();`도 된다고 착각하게 만드는 C와, 추상 클래스에는 static이 안 될 것 같은 A가 함정입니다.", "tags": ["추상 클래스", "추상 메서드", "인스턴스화 불가"], "occurrences": ["certleader-A Q10 p5", "certleader-C Q35 p148"], "verified": "compiled", "fixes": ["정답이 세 개(choose 3)이므로 지문 끝에 `(Choose three.)` 추가"], "no": 99}, {"id": 13, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface I {\n    public void displayI();\n}\nabstract class C2 implements I {\n    public void displayC2() {\n        System.out.print(\"C2\");\n    }\n}\nclass C1 extends C2  {\n    public void displayI() {\n        System.out.print(\"C1\");\n    }\n}"}, {"type": "text", "content": "And the code fragment:"}, {"type": "code", "content": "C2 obj1 = new C1();\nI obj2 = new C1();\n\nC2 s = (C2) obj2;\nI t = obj1;\n\nt.displayI();\ns.displayC2();"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "C1C2", "code": null}, {"key": "B", "text": "C1C1", "code": null}, {"key": "C", "text": "Compilation fails.", "code": null}, {"key": "D", "text": "C2C2", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "두 참조 모두 실제 객체가 C1이라 캐스트가 성공하고, `displayI()`는 C1 구현, `displayC2()`는 C2 상속 구현이 실행되어 \"C1C2\"입니다.", "walkthrough": "1. `C2 obj1 = new C1();` → 업캐스트(C1 → C2)라 문제없습니다.\n2. `I obj2 = new C1();` → C1은 C2를 통해 I를 구현하므로 업캐스트입니다.\n3. `C2 s = (C2) obj2;` → 인터페이스 타입에서 클래스로 다운캐스트합니다. 컴파일러는 허용하고, 런타임에 실제 객체 C1이 C2의 하위 클래스이므로 성공합니다.\n4. `I t = obj1;` → C2는 I를 구현하므로 캐스트 없이 대입할 수 있습니다.\n5. `t.displayI();` → 실제 객체가 C1이므로 C1의 `displayI()` → `C1` 출력.\n6. `s.displayC2();` → C1은 `displayC2()`를 오버라이딩하지 않았으므로 C2에서 상속한 메서드 → `C2` 출력.\n결과: `C1C2`. 추상 클래스 C2가 I의 `displayI()`를 구현하지 않아도 되는 것은 C2가 abstract이기 때문이고, 구체 클래스 C1이 구현하고 있으므로 컴파일됩니다.", "optionNotes": {"A": "정답입니다. `displayI()`는 C1의 구현, `displayC2()`는 C2에서 상속한 구현이 실행됩니다.", "B": "C1은 `displayC2()`를 오버라이딩하지 않았으므로 두 번째 출력은 C2의 구현 \"C2\"입니다.", "C": "C2는 abstract라서 `displayI()`를 구현하지 않아도 되고, 인터페이스→클래스 캐스트와 하위 타입→인터페이스 대입도 모두 합법이므로 컴파일됩니다.", "D": "`t.displayI()`는 C1의 구현을 실행하므로 첫 출력은 \"C1\"입니다. C2에는 `displayI()` 구현이 없습니다."}, "concepts": [{"title": "추상 클래스가 인터페이스를 구현할 때", "body": "추상 클래스는 인터페이스의 추상 메서드를 구현하지 않고 그대로 남겨 둘 수 있습니다. 그 의무는 처음 나오는 구체(non-abstract) 하위 클래스에게 넘어가고, 구체 클래스가 하나라도 구현하지 않으면 컴파일 에러입니다. 인터페이스 메서드는 암묵적으로 public이므로, 구현할 때 접근 제어자를 `public`보다 좁게(default 등) 지정하면 컴파일 에러입니다."}, {"title": "인터페이스 타입이 관련된 캐스트", "body": "final이 아닌 클래스 타입과 인터페이스 타입 사이의 캐스트는, 실제 상속 관계가 없어도 하위 클래스가 그 인터페이스를 구현할 가능성이 있으므로 컴파일러가 허용합니다. 최종 판단은 런타임에 실제 객체 타입으로 하고, 맞지 않으면 ClassCastException이 납니다. 반대로 `final class`이면서 그 인터페이스를 구현하지 않은 타입으로의 캐스트는 컴파일 에러입니다. 하위 타입에서 상위 타입(인터페이스 포함)으로의 대입은 캐스트 없이 됩니다."}], "trap": "abstract C2가 `displayI()`를 구현하지 않았거나 인터페이스→클래스 캐스트가 있다는 이유로 \"Compilation fails\"를 고르게 하는 함정입니다.", "tags": ["인터페이스 구현", "참조 형변환", "다형성"], "occurrences": ["certleader-A Q18 p6", "certleader-B Q38 p107"], "verified": "compiled", "fixes": [], "no": 100}, {"id": 15, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "text", "content": "Base.java:"}, {"type": "code", "content": "class Base {\n    public void test(){\n        System.out.println(\"Base \");\n    }\n}"}, {"type": "text", "content": "DerivedA.java:"}, {"type": "code", "content": "class DerivedA extends Base {\n    public void test(){\n        System.out.println(\"DerivedA \");\n    }\n}"}, {"type": "text", "content": "DerivedB.java:"}, {"type": "code", "content": "class DerivedB  extends DerivedA {\n    public void test(){\n        System.out.println(\"DerivedB \");\n    }\n    public static void main(String[] args) {\n        Base b1 = new DerivedB();\n        Base b2 = new DerivedA();\n        Base b3 = new DerivedB();\n        Base b4 = b3;\n        b1 = (Base) b2;\n        b1.test();\n        b4.test();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Base\nDerivedA"}, {"key": "B", "text": "", "code": "Base\nDerivedB"}, {"key": "C", "text": "", "code": "DerivedB\nDerivedB"}, {"key": "D", "text": "", "code": "DerivedA\nDerivedB"}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "덤프 정답은 D이지만, 덤프의 보기 D는 \"DerivedBDerivedA\"로 실제 출력과 순서가 반대였습니다. 코드는 certleader·exambible 두 사본이 같고, 그대로 실행하면 `b1 = (Base) b2;`로 b1이 DerivedA 객체를, `b4 = b3`이 DerivedB 객체를 가리키므로 `DerivedA` / `DerivedB` 순서로 두 줄이 출력됩니다(javac/java 실행으로 확인). 정확히 일치하는 보기가 없어 답할 수 없는 상태였으므로, 정답 D를 실제 출력 `DerivedA`/`DerivedB`로 바로잡았습니다.", "summary": "메서드는 실제 객체 타입으로 결정되므로 `b1`(DerivedA 객체)은 \"DerivedA\", `b4`(DerivedB 객체)는 \"DerivedB\"를 출력합니다.", "walkthrough": "1. `b1` → DerivedB 객체, `b2` → DerivedA 객체, `b3` → DerivedB 객체.\n2. `Base b4 = b3;` → `b4`도 같은 DerivedB 객체를 가리킵니다.\n3. `b1 = (Base) b2;` → Base로의 업캐스트라 항상 성공합니다. 이제 `b1`은 DerivedA 객체를 가리키고, 처음 DerivedB 객체는 참조를 잃습니다.\n4. `b1.test();` → 실제 객체 DerivedA의 `test()` → `DerivedA ` 출력 후 줄바꿈.\n5. `b4.test();` → 실제 객체 DerivedB의 `test()` → `DerivedB ` 출력 후 줄바꿈.\n실제 실행 결과는 `DerivedA`, `DerivedB` 두 줄이며 보기 D와 같습니다. 업캐스트뿐이라 ClassCastException은 없고, 변수 타입 Base의 `test()`는 한 번도 실행되지 않습니다.", "optionNotes": {"A": "변수 타입이 Base여도 메서드는 실제 객체 기준으로 호출되므로 \"Base\"는 출력되지 않습니다.", "B": "A와 마찬가지로 \"Base\"가 출력될 수 없습니다. b1은 DerivedA 객체를 가리킵니다.", "C": "`b1 = (Base) b2;`로 b1이 DerivedA 객체로 바뀌었으므로 첫 출력은 DerivedB가 아닙니다.", "D": "정답입니다. b1은 DerivedA 객체, b4는 DerivedB 객체를 가리키므로 각 객체의 `test()`가 실행되어 DerivedA, DerivedB 순서로 출력됩니다.", "E": "`(Base) b2`는 업캐스트이고 나머지는 단순 대입이라 ClassCastException이 발생할 곳이 없습니다."}, "concepts": [{"title": "동적 바인딩", "body": "오버라이딩된 인스턴스 메서드는 런타임에 실제 객체의 클래스에서 찾습니다. 참조 변수 타입은 어떤 메서드를 호출할 수 있는지(컴파일 가능 여부)만 결정합니다. 업캐스트 `(Base) x`는 객체를 바꾸지 않으므로 호출 결과도 바뀌지 않습니다. 출력 추적 문제에서는 각 변수가 마지막으로 어떤 객체(new 된 클래스)를 가리키는지를 표로 정리한 뒤 그 클래스의 메서드를 찾으면 됩니다."}, {"title": "참조 대입은 객체 복사가 아님", "body": "`Base b4 = b3;`은 객체를 복사하지 않고 같은 객체를 가리키는 참조를 하나 더 만드는 것입니다. `b1 = b2;` 후에는 b1이 가리키던 기존 객체와의 연결이 끊어지고, 다른 참조가 없으면 그 객체는 GC 대상이 됩니다."}], "trap": "`(Base)` 캐스트 때문에 Base의 test()가 호출되거나 예외가 날 것처럼 보이게 합니다. 업캐스트는 실행할 메서드를 바꾸지 않습니다.", "tags": ["동적 바인딩", "참조 형변환", "다형성"], "occurrences": ["certleader-A Q26 p9", "exambible Q22 p31"], "verified": "compiled", "fixes": ["보기 A~D는 println 두 번의 출력이 한 줄로 붙은 것이므로 줄바꿈을 살려 코드 블록으로 표시", "보기 D `DerivedBDerivedA`는 실제 출력과 순서가 반대라 답할 수 없었으므로 정답 D를 실제 출력 `DerivedA`/`DerivedB`로 수정(코드는 두 덤프 사본과 동일)"], "no": 101}, {"id": 22, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "class Vehicle {\n    int x;\n    Vehicle(){\n        this(10);  // line n1\n    }\n    Vehicle(int x) {\n        this.x = x;\n    }\n}\n\nclass Car extends Vehicle {\n    int y;\n    Car() {\n        super();\n        this(20);   // line n2\n    }\n    Car(int y) {\n       this.y = y;\n    }\n    public String toString() {\n        return super.x + \":\" + this.y;\n    }\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "Vehicle y = new Car();\nSystem.out.println(y);"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "10:20", "code": null}, {"key": "B", "text": "0:20", "code": null}, {"key": "C", "text": "Compilation fails at line n1", "code": null}, {"key": "D", "text": "Compilation fails at line n2", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "", "summary": "생성자 안에서 `super()`와 `this()`는 둘 다 첫 문장이어야 하므로 함께 쓸 수 없고, line n2에서 컴파일 에러가 납니다.", "walkthrough": "1. `Vehicle()`의 `this(10);`(line n1)은 생성자의 첫 문장이므로 문제없습니다.\n2. `Car()`는 먼저 `super();`를 호출하고 그다음 줄에서 `this(20);`(line n2)를 호출합니다.\n3. 명시적 생성자 호출(`this(...)` 또는 `super(...)`)은 생성자 본문의 **첫 문장**에만 올 수 있고, 하나의 생성자에는 하나만 쓸 수 있습니다.\n4. 그래서 두 번째 문장인 `this(20);`이 규칙을 어기고 컴파일러가 line n2에서 에러를 냅니다(Java 8 javac 메시지: `call to this must be first statement in constructor`).\n5. 컴파일이 안 되므로 출력값을 묻는 A, B는 볼 필요가 없습니다.\n\n참고: line n2가 없었다면 `new Car()` → `super()` → `Vehicle()` → `this(10)` 순서로 x=10이 되고, y는 기본값 0이므로 `10:0`이 출력됩니다.", "optionNotes": {"A": "`10:20`이 나오려면 `Car()`가 `this(20)`과 `super()`를 둘 다 실행해야 하는데, 한 생성자에서 두 호출을 함께 쓸 수 없어 컴파일 자체가 안 됩니다.", "B": "`0:20`은 x가 초기화되지 않은 경우를 가정한 값입니다. 실제로는 컴파일 에러라서 실행되지 않습니다.", "C": "line n1의 `this(10);`은 `Vehicle()`의 첫 문장이고 `Vehicle(int)` 생성자도 있으므로 문제가 없습니다.", "D": "정답입니다. `super();` 다음에 오는 `this(20);`은 생성자의 첫 문장이 아니므로 line n2에서 컴파일 에러가 납니다."}, "concepts": [{"title": "명시적 생성자 호출 규칙", "body": "`this(...)`는 같은 클래스의 다른 생성자를, `super(...)`는 부모 클래스의 생성자를 부릅니다. 둘 다 생성자 본문의 첫 문장이어야 하므로 한 생성자에 둘을 같이 쓸 수 없습니다. 둘 다 쓰지 않으면 컴파일러가 첫 줄에 `super();`를 자동으로 넣습니다. 메서드 안에서 `this(...)`처럼 생성자를 호출하는 것도 컴파일 에러입니다.\n```java\nCar() { this(20); }        // OK\nCar() { super(); }         // OK\nCar() { int a = 1; super(); } // 컴파일 에러\n```"}, {"title": "생성자 체이닝과 초기화 순서", "body": "`new Car()`는 항상 부모 생성자부터 실행합니다. `this(...)`로 같은 클래스의 다른 생성자에 넘기더라도 체인의 마지막 생성자가 결국 `super(...)`를 호출합니다. 그래서 부모 필드가 먼저 초기화되고, 자식 생성자 본문은 그 뒤에 실행됩니다. 생성자끼리 `this(...)`로 서로를 부르는 순환 호출은 컴파일 에러(`recursive constructor invocation`)입니다."}], "trap": "`super();`와 `this(20);`이 둘 다 문법적으로는 평범해 보여서 출력값(10:20)을 계산하게 만듭니다. 생성자에서 두 호출이 함께 나오면 바로 컴파일 에러를 의심하세요.", "tags": ["생성자 체이닝", "this()/super() 첫 문장 규칙"], "occurrences": ["certleader-A Q43 p12", "surepassexam Q110 p70", "certleader-B Q91 p114"], "verified": "compiled", "fixes": [], "no": 102}, {"id": 30, "topic": "inheritance", "parts": [{"type": "text", "content": "Which two are benefits of polymorphism? (Choose two.)"}], "options": [{"key": "A", "text": "Faster code at runtime", "code": null}, {"key": "B", "text": "More efficient code at runtime", "code": null}, {"key": "C", "text": "More dynamic code at runtime", "code": null}, {"key": "D", "text": "More flexible and reusable code", "code": null}, {"key": "E", "text": "Code that is protected from extension by other classes", "code": null}], "correct": "CD", "dumpAnswer": "BD", "answerNote": "이 사본은 BD로 표기했고 다른 사본(배치 메타데이터)은 BC로 표기해 덤프마다 다릅니다. 실제 정답은 CD입니다. 다형성은 실행 시점에 실제 객체 타입에 따라 메서드가 결정되는 동적인 코드(C)와 유연하고 재사용 가능한 코드(D)를 가능하게 합니다. 오히려 가상 메서드 호출 때문에 실행 효율이 좋아지는 것은 아니므로 B는 다형성의 이점이 아닙니다.", "summary": "다형성의 이점은 실행 시점에 동작이 결정되는 동적인 코드와 유연하고 재사용 가능한 코드입니다.", "walkthrough": "다형성은 부모 타입 참조(`Animal a`)로 여러 자식 객체(`Dog`, `Cat`)를 다루고, `a.sound()`를 호출하면 실행 시점에 실제 객체의 메서드가 선택되는 성질입니다.\n- 어떤 메서드가 실행될지가 런타임에 결정되므로 코드가 **동적**입니다(C).\n- 부모 타입에 맞춰 짠 코드가 새 자식 클래스가 추가되어도 수정 없이 동작하므로 **유연하고 재사용**하기 좋습니다(D).\n- 속도나 실행 효율은 다형성의 목적이 아닙니다. 가상 메서드 호출은 오히려 약간의 비용이 있습니다(A, B 거짓).\n- 확장을 막는 것은 `final`의 역할이며 다형성과 반대 방향입니다(E 거짓).", "optionNotes": {"A": "다형성은 실행 속도를 높이는 기법이 아닙니다. 동적 디스패치는 오히려 정적 호출보다 약간 비용이 듭니다.", "B": "'실행 효율'도 다형성의 이점이 아닙니다. 다형성은 설계의 유연성을 위한 것이지 런타임 성능을 위한 것이 아닙니다.", "C": "정답입니다. 오버라이드된 메서드는 런타임의 실제 객체 타입으로 결정되므로(동적 바인딩) 코드가 실행 시점에 동적으로 동작합니다.", "D": "정답입니다. 부모 타입이나 인터페이스 기준으로 코드를 작성하면 새 구현을 추가해도 기존 코드를 재사용할 수 있습니다.", "E": "확장을 막는 것은 `final` 클래스와 메서드입니다. 다형성은 오히려 확장(상속과 오버라이딩)을 전제로 합니다."}, "concepts": [{"title": "다형성과 동적 바인딩", "body": "참조 변수의 타입(컴파일 타임 타입)은 어떤 메서드를 **호출할 수 있는지**를 결정하고, 실제 객체의 타입(런타임 타입)은 오버라이드된 메서드 중 **어느 것이 실행될지**를 결정합니다. 예를 들어 `Animal a = new Dog(); a.sound();`는 Dog의 sound()를 실행합니다. 단, 필드와 static 메서드는 다형적으로 동작하지 않고 참조 타입을 따릅니다."}, {"title": "OOP 이점 문제 푸는 요령", "body": "OCA의 개념 문제에서 다형성의 이점은 '유연성', '재사용성', '확장성', '런타임에 동작 결정'이 정답 키워드입니다. 캡슐화는 '데이터 보호와 접근 제어', 상속은 '코드 재사용'이 키워드입니다. 'faster', 'more efficient' 같은 성능 관련 문장은 대부분 오답입니다."}], "trap": "'More efficient code at runtime'은 그럴듯하게 들리지만 성능 이점은 다형성의 특징이 아닙니다. 덤프마다 답이 달라 외워서 풀면 틀리기 쉬운 문제입니다.", "tags": ["다형성", "동적 바인딩"], "occurrences": ["2passeasy Q4 p18", "surepassexam Q183 p89", "certleader-B Q9 p103"], "verified": "reasoned", "fixes": [], "no": 103}, {"id": 42, "topic": "inheritance", "parts": [{"type": "text", "content": "Which two class definitions fail to compile? (Choose two.)"}], "options": [{"key": "A", "text": "", "code": "abstract class A3 {\n    private static int i;\n    public void doStuff(){}\n    public A3(){}\n}"}, {"key": "B", "text": "", "code": "final class A1 {\n    public A1(){}\n}"}, {"key": "C", "text": "", "code": "private class A2 {\n    private static int i;\n    private A2(){}\n}"}, {"key": "D", "text": "", "code": "class A4 {\n    protected static final int i = 10;\n    private A4() {}\n}"}, {"key": "E", "text": "", "code": "final abstract class A5 {\n    protected static int i;\n    void doStuff(){}\n    abstract void doIt();\n}"}], "correct": "CE", "dumpAnswer": "CD", "answerNote": "덤프 정답 CD는 틀렸습니다. D의 `class A4`는 private 생성자와 `protected static final` 필드를 가졌지만 모두 합법이라 정상적으로 컴파일됩니다. 컴파일되지 않는 것은 C(최상위 클래스에 private 사용 불가)와 E(final과 abstract는 함께 쓸 수 없음)입니다. 각 클래스를 따로 컴파일해서 확인했습니다.", "summary": "최상위 클래스에는 private을 붙일 수 없고(C), final과 abstract는 함께 쓸 수 없습니다(E).", "walkthrough": "각 클래스를 별도 파일로 컴파일한 결과입니다.\n- A `abstract class A3`: abstract 클래스도 일반 메서드, 생성자, private static 필드를 가질 수 있어 컴파일됩니다.\n- B `final class A1`: 상속 불가 클래스에 public 생성자가 있는 정상 코드입니다.\n- C `private class A2`: `modifier private not allowed here` 에러가 납니다. 최상위 클래스에는 public 또는 default(생략)만 쓸 수 있습니다.\n- D `class A4`: `protected static final int i = 10;`과 `private A4() {}` 모두 합법이라 컴파일됩니다. 다른 클래스에서 `new A4()`를 할 수 없을 뿐입니다.\n- E `final abstract class A5`: `illegal combination of modifiers: abstract and final` 에러가 납니다. abstract는 상속해서 완성하라는 뜻이고 final은 상속 금지라서 모순입니다.", "optionNotes": {"A": "컴파일됩니다. abstract 클래스가 abstract 메서드 없이 구체 메서드와 생성자만 가져도 됩니다.", "B": "컴파일됩니다. final 클래스에 public 생성자가 있는 것은 아무 문제가 없습니다.", "C": "컴파일 실패입니다(정답). 최상위 클래스에는 private, protected를 쓸 수 없습니다.", "D": "컴파일됩니다. 생성자가 private이어도 선언 자체는 합법이며, 필드에 protected static final을 함께 쓰는 것도 문제없습니다.", "E": "컴파일 실패입니다(정답). abstract와 final은 서로 모순되는 수정자라 함께 쓸 수 없습니다."}, "concepts": [{"title": "최상위 클래스에 쓸 수 있는 수정자", "body": "최상위(top-level) 클래스의 접근 제어자는 `public` 또는 생략(package-private)만 가능합니다. 그 밖에 `abstract`, `final`, `strictfp`를 쓸 수 있습니다. `private`, `protected`, `static`은 중첩(내부) 클래스에만 쓸 수 있습니다. public 클래스는 파일 이름과 같아야 하며 한 파일에 하나만 둘 수 있습니다."}, {"title": "abstract와 함께 쓸 수 없는 수정자", "body": "- 클래스: `abstract final`은 불가합니다.\n- 메서드: `abstract`는 `final`, `private`, `static`과 함께 쓸 수 없습니다. 셋 다 오버라이드를 막기 때문입니다.\n- abstract 메서드가 하나라도 있으면 클래스도 abstract여야 하지만, abstract 클래스에 abstract 메서드가 없어도 됩니다.\n- abstract 클래스도 생성자를 가질 수 있으며, 자식 생성자의 super()로 호출됩니다."}], "trap": "D의 private 생성자를 보고 '객체를 만들 수 없으니 에러'라고 착각하게 만듭니다. 선언 자체는 합법이고, 외부에서 new를 못 할 뿐입니다.", "tags": ["클래스 수정자", "final과 abstract 조합", "최상위 클래스 접근 제어자"], "occurrences": ["exambible Q6 p27", "certleader-C Q10 p144"], "verified": "compiled", "fixes": [], "no": 104}, {"id": 58, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "Base.java:\n\nclass Base {\n    public void test(){\n        System.out.println(\"Base \");\n    }\n}\n\nDerivedA.java:\n\nclass DerivedA extends Base {\n    public void test(){\n        System.out.println(\"DerivedA \");\n    }\n}\n\nDerivedB.java:\n\nclass DerivedB  extends DerivedA {\n    public void test(){\n        System.out.println(\"DerivedB \");\n    }\n    public static void main(String[] args) {\n        Base b1 = new DerivedB();\n        Base b2 = new DerivedA();\n        Base b3 = new DerivedB();\n        b1 = (Base) b3;\n        Base b4 = (DerivedA) b3;\n        b1.test();\n        b4.test();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "Base\nDerivedA"}, {"key": "B", "text": "", "code": "Base\nDerivedB"}, {"key": "C", "text": "", "code": "DerivedB\nDerivedB"}, {"key": "D", "text": "", "code": "DerivedB\nDerivedA"}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "캐스팅은 참조 타입만 바꾸고 객체는 그대로이므로, `b1`과 `b4` 모두 실제 `DerivedB` 객체의 `test()`를 호출해 `DerivedB`를 두 번 출력합니다.", "walkthrough": "1. `b1 = new DerivedB()`, `b2 = new DerivedA()`, `b3 = new DerivedB()`를 만듭니다. 모두 `Base` 타입 참조이며 업캐스팅이라 문제가 없습니다.\n2. `b1 = (Base) b3;`: 이미 `Base` 타입이므로 의미 없는 캐스팅입니다. 이제 `b1`은 `b3`가 가리키는 `DerivedB` 객체를 가리킵니다.\n3. `Base b4 = (DerivedA) b3;`: 다운캐스팅이지만 `b3`의 실제 객체는 `DerivedB`이고 `DerivedB`는 `DerivedA`의 하위 클래스이므로 런타임 검사를 통과합니다. 그 결과를 다시 `Base` 타입 변수에 넣습니다.\n4. `b1.test()`: 인스턴스 메서드는 실제 객체 타입 기준으로 동적 바인딩되므로 `DerivedB.test()`가 실행되어 `DerivedB `를 출력합니다.\n5. `b4.test()`: 같은 `DerivedB` 객체이므로 다시 `DerivedB `를 출력합니다.\n`println`이므로 두 줄로 출력되며 보기 C에 해당합니다. 세 파일을 함께 컴파일해서 실행한 결과도 같습니다.", "optionNotes": {"A": "참조 변수 타입(`Base`)의 메서드가 호출된다고 착각한 보기입니다. 오버라이딩된 메서드는 실제 객체 타입으로 결정됩니다.", "B": "`b1`이 `Base` 메서드를 쓴다고 본 보기입니다. `b1`이 가리키는 객체는 `DerivedB`이므로 `DerivedB`가 출력됩니다.", "C": "정답입니다. 두 참조 모두 같은 `DerivedB` 객체를 가리키므로 `DerivedB.test()`가 두 번 실행됩니다.", "D": "`(DerivedA)` 캐스팅이 `DerivedA` 메서드를 호출하게 만든다고 착각한 보기입니다. 캐스팅은 객체를 바꾸지 않습니다.", "E": "`b3`의 실제 객체 `DerivedB`는 `DerivedA`이기도 하므로(is-a) `(DerivedA)` 캐스팅이 성공합니다. `ClassCastException`은 발생하지 않습니다."}, "concepts": [{"title": "동적 바인딩(가상 메서드 호출)", "body": "인스턴스 메서드 호출은 컴파일 시에 **참조 타입**에 그 메서드가 있는지 확인하고, 실행 시에 **실제 객체 타입**의 오버라이딩된 버전을 호출합니다. 캐스팅은 컴파일러가 보는 참조 타입만 바꿀 뿐 객체 자체를 바꾸지 않습니다. 반면 필드 접근과 static 메서드 호출은 참조 타입으로 결정됩니다(숨기기/hiding). 그래서 `((Base) obj).field`는 Base의 필드를 읽지만 `((Base) obj).test()`는 실제 객체의 메서드를 호출합니다."}, {"title": "참조 캐스팅의 컴파일/런타임 규칙", "body": "업캐스팅(하위 → 상위)은 항상 안전하고 캐스팅 연산자를 생략할 수 있습니다. 다운캐스팅(상위 → 하위)은 명시적 캐스팅이 필요하고, 실행 시 실제 객체가 그 타입의 인스턴스가 아니면 `ClassCastException`이 발생합니다. 서로 상속 관계가 전혀 없는 클래스 사이의 캐스팅은 컴파일 에러입니다(인터페이스로의 캐스팅은 final이 아닌 클래스라면 허용).\n```java\nBase b = new DerivedA();\nDerivedB d = (DerivedB) b; // 컴파일 OK, 런타임 ClassCastException\n```"}], "trap": "여러 번 캐스팅해서 참조 타입이 바뀌는 것처럼 보이게 하지만, 결국 모두 같은 `DerivedB` 객체를 가리키므로 오버라이딩된 메서드가 호출됩니다.", "tags": ["다형성", "참조 타입 캐스팅", "메서드 오버라이딩"], "occurrences": ["surepassexam Q1 p48"], "verified": "compiled", "fixes": ["보기 A~D의 줄바꿈이 사라진 출력('BaseDerivedA' 등)을 두 줄 코드 블록으로 분리", "보기 E의 'classcast Exception'을 'ClassCastException'으로 수정"], "no": 105}, {"id": 80, "topic": "inheritance", "parts": [{"type": "text", "content": "Given the following classes:"}, {"type": "code", "content": "public class Employee {\n    public int salary;\n}\n\npublic class Manager extends Employee {\n    public int budget;\n}\n\npublic class Director extends Manager {\n    public int stockOptions;\n}"}, {"type": "text", "content": "And given the following main method:"}, {"type": "code", "content": "public static void main(String[] args) {\n    Employee employee = new Employee();\n    Manager  manager  = new Manager();\n    Director director = new Director();\n    //line n1\n}"}, {"type": "text", "content": "Which two options fail to compile when placed at line n1 of the main method?"}], "options": [{"key": "A", "text": "", "code": "employee.salary = 50_000;"}, {"key": "B", "text": "", "code": "director.salary = 80_000;"}, {"key": "C", "text": "", "code": "employee.budget = 200_000;"}, {"key": "D", "text": "", "code": "manager.budget = 1_000_000;"}, {"key": "E", "text": "", "code": "manager.stockOption = 500;"}, {"key": "F", "text": "", "code": "director.stockOptions = 1_000;"}], "correct": "CE", "dumpAnswer": "CE", "answerNote": "", "summary": "하위 클래스는 상위 클래스의 필드를 물려받지만, 상위 클래스는 하위 클래스의 필드를 알지 못합니다.", "walkthrough": "세 클래스를 한 파일에서 테스트하기 위해 `public`을 빼고 같은 소스에 두는 최소한의 수정만 했습니다(결과에는 영향 없음).\n- `Employee`: `salary`\n- `Manager`: `salary`(상속) + `budget`\n- `Director`: `salary`, `budget`(상속) + `stockOptions`\n\n각 선택지:\n- A `employee.salary`: Employee에 있으므로 컴파일됩니다.\n- B `director.salary`: Director는 Employee의 `salary`를 상속하므로 컴파일됩니다.\n- C `employee.budget`: `budget`은 하위 클래스 Manager에만 있으므로 \"cannot find symbol\" 에러입니다.\n- D `manager.budget`: Manager에 선언되어 있으므로 컴파일됩니다.\n- E `manager.stockOption`: `stockOptions`는 Director에만 있고, 게다가 이름도 `stockOption`(s 없음)이라 존재하지 않는 필드이므로 컴파일 에러입니다.\n- F `director.stockOptions`: Director에 선언되어 있으므로 컴파일됩니다.\n따라서 컴파일에 실패하는 것은 C와 E입니다.", "optionNotes": {"A": "`salary`는 Employee에 선언된 public 필드이므로 정상적으로 컴파일됩니다.", "B": "Director는 Manager를 거쳐 Employee의 `salary`를 상속하므로 컴파일됩니다.", "C": "정답(컴파일 실패)입니다. `budget`은 Manager에 선언된 필드라 상위 클래스인 Employee 타입으로는 접근할 수 없습니다.", "D": "`budget`은 Manager에 선언된 필드이므로 컴파일됩니다.", "E": "정답(컴파일 실패)입니다. Manager에는 `stockOption`이라는 필드가 없습니다. `stockOptions`라 해도 Director에만 있으므로 실패합니다.", "F": "`stockOptions`는 Director에 선언된 필드이므로 컴파일됩니다. 밑줄이 들어간 숫자 리터럴 `1_000`도 Java 7부터 유효합니다."}, "concepts": [{"title": "상속 방향과 멤버 접근", "body": "하위 클래스는 상위 클래스의 (private이 아닌) 필드와 메서드를 물려받으므로 하위 타입 참조로 상위 멤버를 사용할 수 있습니다. 반대로 상위 클래스는 하위 클래스에 추가된 멤버를 알 수 없습니다. 컴파일러는 변수에 실제로 어떤 객체가 들어 있는지가 아니라 **참조 변수의 선언 타입**을 보고 접근 가능한 멤버를 결정합니다. 그래서 `Employee e = new Manager();`라도 `e.budget`은 컴파일 에러이며, `((Manager) e).budget`처럼 캐스팅해야 합니다."}, {"title": "숫자 리터럴의 밑줄(_)", "body": "Java 7부터 숫자 리터럴의 자릿수 사이에 밑줄을 넣어 가독성을 높일 수 있습니다(`1_000_000`). 밑줄은 숫자와 숫자 사이에만 올 수 있으며 리터럴의 처음이나 끝, 소수점 바로 옆, `L`/`F` 같은 접미사 바로 앞, `0x` 접두사 바로 뒤에는 올 수 없습니다. 예를 들어 `_100`, `100_`, `1_.5`, `0x_FF`는 모두 컴파일 에러입니다."}], "trap": "E는 필드가 하위 클래스에만 있다는 점과 철자(`stockOption` vs `stockOptions`)가 다르다는 점 두 가지로 실패합니다. 철자 차이를 놓치지 마세요.", "tags": ["상속과 필드 접근", "참조 타입과 멤버 접근"], "occurrences": ["surepassexam Q47 p60", "certleader-D Q1 p171"], "verified": "compiled", "fixes": [], "no": 106}, {"id": 82, "topic": "inheritance", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "interface Readable {\n    public void readBook();\n    public void setBookMark();\n}\n\nabstract class Book implements Readable {    // line n1\n    public void readBook() { }\n    // line n2\n}\n\nclass EBook extends Book {                   // line n3\n    public void readBook() { }\n    // line n4\n}"}, {"type": "text", "content": "And given the code fragment:"}, {"type": "code", "content": "Book book1 = new EBook ();\nbook1.readBook();"}, {"type": "text", "content": "Which option enables the code to compile?"}], "options": [{"key": "A", "text": "Replace the code fragment at line n3 with:", "code": "abstract class EBook extends Book {"}, {"key": "B", "text": "Replace the code fragment at line n1 with:", "code": "class Book implements Readable {"}, {"key": "C", "text": "At line n2 insert:", "code": "public abstract void setBookMark ();"}, {"key": "D", "text": "At line n4 insert:", "code": "public void setBookMark ()  { }"}], "correct": "D", "dumpAnswer": "A/D", "answerNote": "덤프마다 A/D로 표기가 다릅니다. 실제 정답은 D입니다. A처럼 `EBook`을 abstract로 만들면 `new EBook()`으로 인스턴스를 만들 수 없어 \"EBook is abstract; cannot be instantiated\" 컴파일 에러가 납니다.", "summary": "구체 클래스 `EBook`이 인터페이스의 남은 추상 메서드 `setBookMark()`를 구현해야 컴파일됩니다.", "walkthrough": "1. `Readable` 인터페이스에는 추상 메서드 `readBook()`, `setBookMark()`가 있습니다.\n2. `Book`은 `abstract`이므로 `setBookMark()`를 구현하지 않아도 됩니다(`readBook()`만 구현).\n3. `EBook`은 abstract가 아닌 구체 클래스이므로 상속받은 모든 추상 메서드를 구현해야 하는데 `setBookMark()`가 없습니다. 원래 코드는 \"EBook is not abstract and does not override abstract method setBookMark()\" 에러로 실패합니다.\n4. 각 선택지를 컴파일해 보았습니다.\n- A: EBook 선언은 통과하지만 `new EBook()`에서 \"cannot be instantiated\" 에러.\n- B: Book이 구체 클래스가 되어 이번에는 Book에서 `setBookMark()` 미구현 에러.\n- C: Book에서 추상 메서드를 다시 선언해도 EBook의 구현 의무는 그대로라 같은 에러.\n- D: EBook에 `public void setBookMark() { }`를 추가하면 컴파일·실행 모두 성공.\n따라서 정답은 D입니다.", "optionNotes": {"A": "EBook을 abstract로 바꾸면 클래스 선언 자체는 컴파일되지만, 코드 조각의 `new EBook()`이 추상 클래스 인스턴스화가 되어 컴파일 에러입니다.", "B": "Book을 구체 클래스로 바꾸면 Book이 `setBookMark()`를 구현하지 않았으므로 Book에서 컴파일 에러가 납니다.", "C": "Book에 `public abstract void setBookMark();`를 다시 선언하는 것은 합법이지만, EBook이 여전히 이를 구현하지 않으므로 EBook에서 컴파일 에러가 납니다.", "D": "정답입니다. EBook이 `setBookMark()`를 `public`으로 구현하면 모든 추상 메서드가 구현되어 컴파일되고, `book1.readBook()`도 정상 호출됩니다."}, "concepts": [{"title": "구체 클래스의 추상 메서드 구현 의무", "body": "abstract가 아닌 클래스는 상속 계층(상위 클래스와 구현한 인터페이스 전부)에서 넘어온 모든 추상 메서드를 구현해야 합니다. 중간의 추상 클래스가 일부만 구현했다면 남은 메서드는 첫 번째 구체 하위 클래스가 책임집니다. 추상 클래스는 `new`로 직접 생성할 수 없지만, 참조 타입으로는 사용할 수 있습니다(`Book b = new EBook();`)."}, {"title": "인터페이스 메서드 구현 시 접근 제어자", "body": "인터페이스의 추상 메서드는 암묵적으로 `public abstract`입니다. 이를 구현하는 메서드는 반드시 `public`이어야 하며, `void setBookMark() { }`처럼 접근 제어자를 생략하면 package-private이 되어 \"weaker access privileges\" 컴파일 에러가 납니다. 추상 클래스에서 인터페이스 메서드를 `public abstract`로 다시 선언하는 것은 허용되지만 구현 의무를 바꾸지는 않습니다."}], "trap": "A는 EBook 선언 에러를 없애 정답처럼 보이지만, 추상 클래스는 인스턴스화할 수 없다는 점 때문에 `new EBook()`에서 실패합니다.", "tags": ["추상 클래스", "인터페이스 구현", "구체 클래스의 추상 메서드 구현 의무"], "occurrences": ["surepassexam Q54 p61", "certleader-B Q21 p105"], "verified": "compiled", "fixes": ["코드 조각의 `Book1.readBook();`을 선언된 변수명에 맞춰 `book1.readBook();`으로 수정"], "no": 107}, {"id": 86, "topic": "inheritance", "parts": [{"type": "text", "content": "Given the code fragment:"}, {"type": "code", "content": "abstract class Planet {\n    protected void revolve() {          //line n1\n    }\n\n    abstract void rotate();             //line n2\n}\n\nclass Earth extends Planet {\n    void revolve() {                    //line n3\n    }\n\n    protected void rotate() {           //line n4\n    }\n}"}, {"type": "text", "content": "Which two modifications, made independently, enable the code to compile?"}], "options": [{"key": "A", "text": "Make the method at line n1 public.", "code": null}, {"key": "B", "text": "Make the method at line n2 public.", "code": null}, {"key": "C", "text": "Make the method at line n3 public.", "code": null}, {"key": "D", "text": "Make the method at line n3 protected.", "code": null}, {"key": "E", "text": "Make the method at line n4 public.", "code": null}], "correct": "CD", "dumpAnswer": "BC", "answerNote": "이 덤프는 BC로 표기했지만 틀렸습니다(다른 덤프 사본에는 CD로 되어 있습니다). 정답은 CD입니다. 원래 코드의 에러는 line n3의 `revolve()`가 `protected`를 default로 좁힌 것 하나이고, 이를 `public` 또는 `protected`로 바꾸면 해결됩니다. B처럼 line n2를 `public`으로 바꾸면 line n4의 `protected rotate()`가 접근을 좁히는 새 에러가 생기고, line n3의 에러도 그대로 남습니다.", "summary": "오버라이딩 메서드는 접근 범위를 좁힐 수 없으므로 line n3의 default `revolve()`를 `public`이나 `protected`로 넓혀야 합니다.", "walkthrough": "1. 원래 코드를 컴파일하면 line n3에서 \"revolve() in Earth cannot override revolve() in Planet; attempting to assign weaker access privileges; was protected\" 에러가 납니다.\n2. line n2의 `abstract void rotate()`는 default 접근이고 line n4의 `protected void rotate()`는 접근을 넓힌 것이므로 문제가 없습니다.\n3. 각 수정을 독립적으로 적용해 컴파일했습니다.\n- A(n1 public): 상위가 `public`이 되어 n3의 default가 더 심하게 좁히는 꼴이 되므로 여전히 에러.\n- B(n2 public): n4의 `protected`가 `public`보다 좁아 새 에러, n3 에러도 그대로.\n- C(n3 public): `protected` → `public`은 넓히는 것이므로 OK, 컴파일 성공.\n- D(n3 protected): 같은 접근 수준이므로 OK, 컴파일 성공.\n- E(n4 public): n4는 원래 문제가 없었고 n3 에러가 그대로 남음.\n따라서 정답은 C와 D입니다.", "optionNotes": {"A": "line n1을 `public`으로 바꾸면 Earth의 default `revolve()`가 `public`을 좁히는 것이 되어 여전히 컴파일 에러입니다.", "B": "line n2를 `public`으로 바꾸면 line n4의 `protected rotate()`가 접근을 좁혀 새로운 에러가 생기고, line n3 문제도 해결되지 않습니다.", "C": "정답입니다. line n3를 `public`으로 바꾸면 `protected`보다 넓은 접근이므로 오버라이딩 규칙을 만족합니다.", "D": "정답입니다. line n3를 `protected`로 바꾸면 상위 메서드와 같은 접근 수준이므로 합법입니다.", "E": "line n4는 원래부터 합법(default → protected 확장)이므로 바꿔도 line n3의 에러는 그대로 남습니다."}, "concepts": [{"title": "오버라이딩의 접근 제어자 규칙", "body": "오버라이딩 메서드는 상위 메서드보다 접근 범위를 좁힐 수 없고, 같거나 넓힐 수만 있습니다. 넓은 순서는 `public` > `protected` > default(package-private) > `private`입니다. 따라서 상위가 `protected`면 하위는 `protected` 또는 `public`, 상위가 default면 default/`protected`/`public` 모두 가능합니다. `private` 메서드는 상속되지 않으므로 하위 클래스에 같은 시그니처를 선언해도 오버라이딩이 아니라 새 메서드입니다. 인터페이스 메서드는 암묵적으로 `public`이라 구현 메서드는 반드시 `public`이어야 합니다."}, {"title": "오버라이딩 규칙 전체 정리", "body": "오버라이딩이 성립하려면 메서드 이름과 매개변수 목록이 같아야 합니다. 반환형은 같거나 하위 타입(공변 반환형)이어야 하며, 기본형은 정확히 같아야 합니다. checked 예외는 상위 메서드가 던지는 것과 같거나 그 하위 타입만, 혹은 아예 던지지 않을 수 있습니다(unchecked 예외는 제한 없음). static 메서드는 오버라이딩되지 않고 하위 클래스의 같은 static 메서드는 숨기기(hiding)가 됩니다. 인스턴스 메서드를 static으로 바꾸거나 그 반대로 하면 컴파일 에러입니다."}], "trap": "\"abstract 메서드는 public이어야 한다\"는 오해로 B를 고르게 만드는 문제입니다. 추상 메서드도 default나 protected일 수 있습니다.", "tags": ["메서드 오버라이딩 규칙", "접근 제어자 축소 금지", "추상 메서드"], "occurrences": ["surepassexam Q67 p64", "certleader-B Q43 p109"], "verified": "compiled", "fixes": [], "no": 108}, {"id": 91, "topic": "inheritance", "parts": [{"type": "text", "content": "You are asked to develop a program for a shopping application, and you are given the following information:\n- The application must contain the classes Toy, EduToy, and ConsToy. The Toy class is the superclass of the other two classes.\n- The int calculatePrice (Toy t) method calculates the price of a toy.\n- The void printToy (Toy t) method prints the details of a toy.\nWhich definition of the Toy class adds a valid layer of abstraction to the class hierarchy?"}], "options": [{"key": "A", "text": "", "code": "public abstract class Toy{\n    public abstract int calculatePrice(Toy t);\n    public void printToy(Toy t) { /* code goes here */ }\n}"}, {"key": "B", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t) ;\n    public void printToy(Toy t) ;\n}"}, {"key": "C", "text": "", "code": "public abstract class Toy {\n    public int calculatePrice(Toy t);\n    public final void printToy(Toy t){ /* code goes here */ }\n}"}, {"key": "D", "text": "", "code": "public abstract class Toy {\n    public abstract int calculatePrice(Toy t) { /* code goes here */ }\n    public abstract void printToy(Toy t) { /* code goes here */ }\n}"}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "추상 클래스는 몸체 없는 `abstract` 메서드와 몸체가 있는 일반 메서드를 함께 가질 수 있으며, 네 선택지 중 이 규칙을 지킨 것은 A뿐입니다.", "walkthrough": "각 선택지를 `Toy.java`로 컴파일했습니다.\n- A: `calculatePrice`는 `abstract`이고 몸체가 없으며, `printToy`는 몸체가 있는 일반 메서드입니다. 컴파일 성공. 하위 클래스가 `calculatePrice`를 구현하도록 강제하면서 공통 기능 `printToy`를 제공하므로 유효한 추상화 계층입니다.\n- B: 두 메서드 모두 `abstract`가 없는데 몸체도 없어 \"mi
