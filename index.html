<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<body>
<title>OCAJP 1Z0-808 해설 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky left rail (exam-objective filter + question number grid) beside a single reading column of question cards; rail collapses into a top toolbar on phones. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --ink: #17202C; --muted: #5A6577; --line: #DCE1E8;
  --accent: #1F4FD1; --accent-weak: #E5EBFB;
  --ok: #1B7A48; --ok-weak: #E2F2E9; --bad: #B3322A; --bad-weak: #F8E4E2; --warn: #8F5B00; --warn-weak: #FAEFD7;
  --code-bg: #F6F8FB; --code-ink: #1D2633; --k: #7A2FB8; --s: #1B7A48; --n: #B0510F; --c: #7B8494; --t: #1F4FD1;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --ink: #E3E7ED; --muted: #97A1B0; --line: #29303A;
  --accent: #86A2FF; --accent-weak: #1C2640;
  --ok: #55C489; --ok-weak: #14281D; --bad: #F2827A; --bad-weak: #351A1A; --warn: #E3AE45; --warn-weak: #2E2410;
  --code-bg: #0B0E12; --code-ink: #D9DFE8; --k: #C792EA; --s: #8BD49C; --n: #F5A962; --c: #6F7A8B; --t: #86A2FF;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--font-mono); }

.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; }
header.top { min-width: 0; grid-column: 1 / -1; padding-block: 36px 8px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h1 .code { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

/* rail */
aside.rail { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 18px; padding-bottom: 8px; }
.rail h2 { margin: 0 0 8px; font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.topics { display: grid; gap: 2px; }
.topic-btn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 6px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 14px; }
.topic-btn:hover { background: var(--accent-weak); }
.topic-btn[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.topic-btn .n { font-family: var(--font-mono); font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
.toggles { display: grid; gap: 6px; font-size: 14px; }
.toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.grid a { display: block; text-align: center; padding: 4px 0; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; text-decoration: none; color: var(--muted); border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.grid a.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.grid a.bad { background: var(--bad-weak); color: var(--bad); border-color: transparent; }
.grid a.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.grid a.supp { border-style: dashed; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }

/* main */
main { min-width: 0; display: grid; gap: 22px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.section-head h2 { margin: 0; font-size: 19px; }
.section-head span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
article.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: 16px; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.qno { font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); white-space: nowrap; }
.chip.supp { background: var(--warn-weak); color: var(--warn); }
.chip.multi { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.qhead .spacer { flex: 1; }
.flag-btn { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.flag-btn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); background: var(--warn-weak); }
.src { font-size: 12.5px; color: var(--muted); }
.stem { display: grid; gap: 10px; min-width: 0; }
.stem p { margin: 0; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; tab-size: 4; }
pre.code code { font-family: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--k); }
.hljs-string { color: var(--s); }
.hljs-number { color: var(--n); }
.hljs-comment { color: var(--c); font-style: italic; }
.hljs-title, .hljs-type, .hljs-class .hljs-title { color: var(--t); }
.hljs-meta { color: var(--c); }

.opts { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-weight: 600; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--bg); font-size: 13px; }
.opt .body { min-width: 0; display: grid; gap: 6px; }
.opt .body pre.code { font-size: 12.5px; padding: 8px 12px; }
.opt.sel { border-color: var(--accent); background: var(--accent-weak); }
.opt.sel .key { background: var(--accent); color: var(--surface); }
.revealed .opt, .graded .opt { cursor: default; }
.revealed .opt.right, .graded .opt.right { border-color: var(--ok); background: var(--ok-weak); }
.revealed .opt.right .key, .graded .opt.right .key { background: var(--ok); color: var(--surface); }
.revealed .opt.wrong, .graded .opt.wrong { border-color: var(--bad); background: var(--bad-weak); }
.revealed .opt.wrong .key, .graded .opt.wrong .key { background: var(--bad); color: var(--surface); }
.graded .opt.sel:not(.wrong):not(.right) { border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn.ghost { background: none; color: var(--accent); }
.verdict { font-size: 14px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

.ex { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 16px; min-width: 0; }
.ex h3 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.answer-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.answer-line .ans { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--ok); }
.answer-line .sum { font-weight: 500; }
.note { border-radius: 8px; padding: 10px 14px; background: var(--warn-weak); color: var(--ink); font-size: 14.5px; }
.note b.lbl { color: var(--warn); }
.md { min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .5em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md code:not(pre code) { font-size: .9em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre.code { margin: .6em 0; }
.optex { display: grid; gap: 8px; }
.optex .row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.optex .row .key { font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding-top: 2px; color: var(--bad); }
.optex .row.right .key { color: var(--ok); }
details.concept { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.concept summary { cursor: pointer; padding: 9px 14px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.concept summary::before { content: "+"; font-family: var(--font-mono); color: var(--accent); width: 12px; }
details.concept[open] summary::before { content: "−"; }
details.concept .md { padding: 0 14px 12px 34px; }
.trap { border-left: 3px solid var(--bad); padding: 2px 0 2px 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: none; cursor: pointer; color: var(--muted); }
.tag:hover { color: var(--accent); border-color: var(--accent); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

#index .cols { columns: 2 260px; column-gap: 28px; font-size: 14px; }
#index .entry { break-inside: avoid; padding: 3px 0; display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px dotted var(--line); }
#index .entry a { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; }

.syncbox { display: grid; gap: 8px; font-size: 13.5px; }
.syncbox h2 { margin: 0; }
.sync-status { margin: 0; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.sync-status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transform: translateY(-1px); }
.sync-status[data-s="ok"]::before { background: var(--ok); }
.sync-status[data-s="syncing"]::before { background: var(--accent); }
.sync-status[data-s="auth"]::before, .sync-status[data-s="error"]::before { background: var(--bad); }
.sync-status[data-s="offline"]::before { background: var(--warn); }
#sync-panel { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
#sync-panel .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sync-actions .btn { padding: 5px 12px; font-size: 13px; }
.rail-links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.src .mine { color: var(--ink); }
#history .hist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 28px; }
#history .hist > div { min-width: 0; }
#history h3 { margin: 0 0 6px; font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.hist-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist-table th, .hist-table td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.hist-table th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.hist-table td.num { text-align: right; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ok); vertical-align: middle; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 92px; }
.days .d { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.days .col { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
.days .col.zero { background: var(--line); }
.recent { list-style: none; margin: 0; padding: 0; font-size: 14px; display: grid; gap: 2px; }
.recent li { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
.recent .when { color: var(--muted); font-size: 12.5px; min-width: 88px; }
.recent .ok { color: var(--ok); } .recent .bad { color: var(--bad); }
.hist-empty { color: var(--muted); margin: 0; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  aside.rail { position: static; max-height: none; overflow: visible; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-btn { width: auto; border: 1px solid var(--line); background: var(--surface); }
  .rail .grid-wrap { display: none; }
  article.q { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
  <header class="top">
    <div class="eyebrow">Java SE 8 Programmer I · Exam 1Z0-808</div>
    <h1>OCAJP <span class="code">1Z0-808</span> 해설 노트</h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="rail" aria-label="문제 탐색">
    <input class="search" id="q-search" type="search" placeholder="키워드·코드 검색 (예: StringBuilder)">
    <div>
      <h2>시험 범위</h2>
      <div class="topics" id="topics"></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="opt-reveal"> 정답·해설 모두 펼치기</label>
      <label><input type="checkbox" id="opt-flag"> 북마크만 보기</label>
      <label><input type="checkbox" id="opt-wrong"> 틀린 문제만 보기</label>
      <label><input type="checkbox" id="opt-disputed"> 덤프 정답 오류만 보기</label>
    </div>
    <div class="syncbox">
      <h2>풀이 기록</h2>
      <p class="sync-status" id="sync-status" data-s="off">이 기기에만 저장하고 있습니다.</p>
      <div class="rail-links">
        <button class="linkish" id="sync-toggle" type="button">기기 간 동기화 설정</button>
        <a href="#history" class="linkish">학습 기록 보기</a>
        <a href="bookmarks.html" class="linkish">북마크 오답 노트</a>
        <a href="summary.html" class="linkish">개념 정리노트</a>
        <a href="exam.html" class="linkish">모의고사 56문제</a>
      </div>
      <div id="sync-panel" hidden>
        <p class="hint">GitHub에서 <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=OCAJP%20notes" target="_blank" rel="noopener">gist 권한만 있는 토큰</a>을 만들어 붙여 넣으세요. 기록은 내 계정의 비공개 gist에 저장되고, 토큰은 이 기기 브라우저에만 보관됩니다. 다른 기기에서도 같은 토큰을 넣으면 기록이 합쳐집니다.</p>
        <input id="sync-token" class="search" type="password" placeholder="ghp_로 시작하는 토큰" autocomplete="off" spellcheck="false">
        <div class="sync-actions">
          <button class="btn" id="sync-connect" type="button">연결</button>
          <button class="btn ghost" id="sync-now" type="button">지금 동기화</button>
          <button class="linkish" id="sync-off" type="button">연결 해제</button>
        </div>
      </div>
    </div>
    <div class="grid-wrap">
      <h2>문제 번호</h2>
      <div class="grid" id="grid"></div>
    </div>
  </aside>

  <main id="main"></main>

<script id="data" type="application/json">{"topics": [{"key": "basics", "name": "Java 기초", "en": "Java Basics"}, {"key": "datatypes", "name": "자료형", "en": "Working With Java Data Types"}, {"key": "operators", "name": "연산자와 조건문", "en": "Operators and Decision Constructs"}, {"key": "arrays", "name": "배열", "en": "Creating and Using Arrays"}, {"key": "loops", "name": "반복문", "en": "Using Loop Constructs"}, {"key": "methods", "name": "메서드와 캡슐화", "en": "Methods and Encapsulation"}, {"key": "inheritance", "name": "상속과 다형성", "en": "Working with Inheritance"}, {"key": "exceptions", "name": "예외 처리", "en": "Handling Exceptions"}, {"key": "api", "name": "Java API", "en": "Selected Classes from the Java API"}], "questions": [{"id": 6, "topic": "basics", "parts": [{"type": "text", "content": "Given the code from the Greeting.java file:"}, {"type": "code", "content": "public class Greeting {\n    public static void main(String[] args) {\n        System.out.println(\"Hello \" + args[0]);\n    }\n}"}, {"type": "text", "content": "Which set of commands prints Hello Duke in the console?"}], "options": [{"key": "A", "text": "", "code": "javac Greeting\njava Greeting Duke"}, {"key": "B", "text": "", "code": "javac Greeting.java Duke\njava Greeting"}, {"key": "C", "text": "", "code": "javac Greeting.java\njava Greeting Duke"}, {"key": "D", "text": "", "code": "javac Greeting.java\njava Greeting.class Duke"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "컴파일은 `javac Greeting.java`(확장자 포함), 실행은 `java Greeting Duke`(클래스 이름 + 인자)입니다.", "walkthrough": "1. `javac`는 소스 파일 이름을 받으므로 `.java` 확장자를 붙여야 합니다: `javac Greeting.java` → `Greeting.class`가 생성됩니다.\n2. `java`는 파일 이름이 아니라 클래스 이름(정규화된 이름)을 받으므로 `.class`를 붙이지 않습니다: `java Greeting`.\n3. 클래스 이름 뒤에 오는 토큰은 `main`의 `args` 배열에 들어갑니다. `java Greeting Duke` → `args[0]`은 `\"Duke\"`입니다.\n4. `\"Hello \" + args[0]` → `Hello Duke`가 출력됩니다.\n실제로 네 조합을 모두 실행해 C만 `Hello Duke`를 출력하는 것을 확인했습니다.", "optionNotes": {"A": "`javac Greeting`처럼 확장자를 빼면 javac가 소스 파일로 인식하지 못해 에러가 납니다(\"Class names, 'Greeting', are only accepted if annotation processing is explicitly requested\").", "B": "인자 `Duke`를 javac에 넘겼습니다. javac는 이를 소스 파일/클래스 이름으로 해석해 에러가 나고, `java Greeting`은 인자 없이 실행되어 `args[0]`에서 ArrayIndexOutOfBoundsException이 납니다.", "C": "정답입니다. 소스 파일을 확장자와 함께 컴파일하고, 클래스 이름 뒤에 인자를 줘서 실행합니다.", "D": "`java Greeting.class`는 `Greeting`이라는 패키지의 `class`라는 클래스를 찾으므로 \"Could not find or load main class Greeting.class\" 에러가 납니다."}, "concepts": [{"title": "javac와 java 명령의 인자", "body": "`javac`는 파일 시스템 경로를 받으므로 `javac Greeting.java`, `javac com/x/A.java`처럼 확장자를 포함해서 씁니다. `java`는 클래스의 정규화된 이름을 받으므로 `java com.x.A`처럼 점으로 구분하고 `.class`를 붙이지 않습니다. 클래스 이름 뒤의 모든 토큰은 공백으로 나뉘어 `String[] args`로 전달되고, 따옴표로 감싸면 공백을 포함한 하나의 인자가 됩니다. (참고로 Java 11+에는 `java Greeting.java Duke`로 소스를 바로 실행하는 기능이 있지만 Java 8 시험 범위가 아닙니다.)"}, {"title": "public 클래스와 파일 이름", "body": "public 최상위 클래스는 같은 이름의 `.java` 파일에 있어야 합니다(대소문자 포함). 한 파일에 public 최상위 클래스는 최대 하나이고, public이 아닌 클래스는 여러 개 둘 수 있습니다. 컴파일하면 클래스마다 별도의 `.class` 파일이 생깁니다."}], "trap": "javac에는 확장자를 붙이고 java에는 붙이지 않는다는 비대칭이 핵심입니다. 인자를 javac 쪽에 붙인 보기도 함정입니다.", "tags": ["javac/java 명령", "명령줄 인자"], "occurrences": ["certleader-A Q6 p3", "surepassexam Q211 p93", "certleader-B Q10 p103"], "verified": "compiled", "fixes": ["지문의 파일명 `Greeting.Java`를 `Greeting.java`로 수정"], "no": 1}, {"id": 16, "topic": "basics", "parts": [{"type": "text", "content": "Given the code snippet from a compiled Java source file:"}, {"type": "code", "content": "public class MyFile\n{\n    public static void main (String[] args)\n    {\n        String arg1 = args[1];\n        String arg2 = args[2];\n        String arg3 = args[3];\n        System.out.println(\"Arg is \" + arg3);\n    }\n}"}, {"type": "text", "content": "Which command-line arguments should you pass to the program to obtain the following output?"}, {"type": "code", "content": "Arg is 2"}], "options": [{"key": "A", "text": "", "code": "java MyFile 1 3 2 2"}, {"key": "B", "text": "", "code": "java MyFile 2 2 2"}, {"key": "C", "text": "", "code": "java MyFile 1 2 2 3 4"}, {"key": "D", "text": "", "code": "java MyFile 0 1 2 3"}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "`args[3]`(네 번째 인자)이 \"2\"이고 인자가 4개 이상이어야 하므로 `java MyFile 1 3 2 2`입니다.", "walkthrough": "1. `args` 인덱스는 0부터 시작하므로 `args[3]`은 네 번째 인자입니다.\n2. 코드가 `args[1]`, `args[2]`, `args[3]`에 접근하므로 인자가 최소 4개 있어야 예외가 나지 않습니다.\n3. 출력 `Arg is 2`가 나오려면 네 번째 인자가 `2`여야 합니다.\n4. 보기 확인(실제 실행):\n- A `1 3 2 2` → args[3] = \"2\" → `Arg is 2`\n- B `2 2 2` → 인자 3개 → `args[3]`에서 ArrayIndexOutOfBoundsException\n- C `1 2 2 3 4` → args[3] = \"3\" → `Arg is 3`\n- D `0 1 2 3` → args[3] = \"3\" → `Arg is 3`\n정답은 A입니다.", "optionNotes": {"A": "정답입니다. 네 번째 인자(`args[3]`)가 \"2\"라서 `Arg is 2`가 출력됩니다.", "B": "인자가 3개뿐이라 `args[3]`에 접근하는 순간 ArrayIndexOutOfBoundsException이 납니다.", "C": "args[3]이 \"3\"이므로 `Arg is 3`이 출력됩니다. 인자가 남는 것은 문제가 아닙니다.", "D": "args[3]이 \"3\"이므로 `Arg is 3`이 출력됩니다. 인덱스를 1부터 센 사람을 노린 보기입니다."}, "concepts": [{"title": "main의 args 배열", "body": "`java 클래스명 a b c`로 실행하면 클래스명 뒤의 토큰들이 `args[0]=\"a\"`, `args[1]=\"b\"`, `args[2]=\"c\"`로 들어갑니다. `java`나 클래스 이름 자체는 포함되지 않습니다(C 언어의 argv와 다릅니다). 인자가 없으면 `args`는 null이 아니라 길이 0인 배열이고, 존재하지 않는 인덱스에 접근하면 `ArrayIndexOutOfBoundsException`이 납니다. 모든 인자는 String이므로, 숫자로 쓰려면 `Integer.parseInt(args[0])`처럼 변환해야 합니다."}, {"title": "유효한 main 시그니처", "body": "`public static void main(String[] args)`가 기본형이고, `String args[]`, `String... args`, 매개변수 이름 변경, `final` 추가도 허용됩니다. `static`이나 `public`이 빠지거나 반환 타입이 void가 아니면, 컴파일은 되더라도 JVM이 시작점으로 인식하지 못해 실행 시 에러가 납니다."}], "trap": "인덱스를 1부터 세거나 `java MyFile`의 `MyFile`을 args[0]으로 착각하게 만드는 함정입니다.", "tags": ["명령줄 인자", "args 인덱스", "ArrayIndexOutOfBoundsException"], "occurrences": ["certleader-A Q29 p10"], "verified": "compiled", "fixes": [], "no": 2}, {"id": 23, "topic": "basics", "parts": [{"type": "text", "content": "Which three statements are true about the structure of a Java class? (Choose three.)"}], "options": [{"key": "A", "text": "A public class must have a main method.", "code": null}, {"key": "B", "text": "A class can have only one private constructors.", "code": null}, {"key": "C", "text": "A method can have the same name as a field.", "code": null}, {"key": "D", "text": "A class can have overloaded static methods.", "code": null}, {"key": "E", "text": "The methods are mandatory components of a class.", "code": null}, {"key": "F", "text": "The fields need not be initialized before use.", "code": null}], "correct": "CDF", "dumpAnswer": "ACE", "answerNote": "덤프 정답 ACE는 틀렸습니다. public 클래스에 main 메서드가 꼭 있어야 하는 것은 아니고(A 거짓), 메서드가 하나도 없는 클래스도 컴파일됩니다(E 거짓). 참인 문장은 C(메서드 이름 = 필드 이름 가능), D(static 메서드 오버로딩 가능), F(필드는 기본값으로 자동 초기화)이며, 실제 컴파일로 확인했습니다.", "summary": "메서드와 필드는 이름이 같아도 되고, static 메서드도 오버로딩할 수 있으며, 필드는 기본값이 있어서 명시적으로 초기화하지 않아도 됩니다.", "walkthrough": "각 문장을 실제 코드로 확인했습니다.\n- `int count; int count(){...}`처럼 필드와 메서드 이름이 같아도 컴파일됩니다. 둘은 이름 공간이 다르기 때문입니다(C 참).\n- `static void s(){}`와 `static void s(int a){}`를 같이 선언할 수 있습니다(D 참).\n- 필드 `int count;`를 초기화하지 않고 읽으면 기본값 0이 나옵니다(F 참). 초기화 전 사용을 막는 규칙은 **지역 변수**에만 적용됩니다.\n- `class NoMain {}`처럼 main이 없는 클래스, 메서드가 하나도 없는 클래스도 모두 컴파일됩니다(A, E 거짓).\n- private 생성자 `Main()`과 `Main(int)`를 동시에 둘 수 있습니다(B 거짓).", "optionNotes": {"A": "거짓입니다. main은 프로그램 시작점으로 쓸 클래스에만 필요하며, main이 없는 public 클래스도 정상적으로 컴파일됩니다.", "B": "거짓입니다. private 생성자도 매개변수 목록만 다르면 여러 개를 오버로딩할 수 있습니다.", "C": "참입니다. 필드와 메서드는 이름 공간이 다르므로 `int count;`와 `int count()`를 함께 선언할 수 있습니다.", "D": "참입니다. 오버로딩은 static 여부와 상관없이 매개변수 목록만 다르면 됩니다.", "E": "거짓입니다. `class A {}`처럼 멤버가 하나도 없는 클래스도 문법상 올바릅니다.", "F": "참입니다. 인스턴스 필드와 static 필드는 0, false, null 같은 기본값으로 자동 초기화되므로 명시적으로 초기화하지 않고 사용해도 됩니다."}, "concepts": [{"title": "필드 기본값과 지역 변수의 확정 할당", "body": "필드(인스턴스, static)는 객체가 생성되거나 클래스가 로드될 때 기본값을 받습니다. 정수형은 0, 실수형은 0.0, boolean은 false, char는 '\\u0000', 참조형은 null입니다. 반면 지역 변수는 기본값이 없어서 값을 대입하기 전에 읽으면 컴파일 에러(`variable x might not have been initialized`)가 납니다. 시험에서 '초기화하지 않고 사용' 문장이 나오면 필드인지 지역 변수인지 먼저 구분하세요."}, {"title": "클래스 구성 요소는 모두 선택 사항", "body": "클래스 선언에 꼭 필요한 것은 `class 이름 { }`뿐입니다. 필드, 메서드, 생성자, main은 모두 선택입니다. 생성자를 하나도 쓰지 않으면 컴파일러가 기본 생성자를 넣어 줍니다. main은 `java 클래스명`으로 실행할 클래스에만 필요합니다."}, {"title": "오버로딩 규칙", "body": "같은 이름의 메서드(또는 생성자)를 매개변수의 개수, 타입, 순서를 다르게 해서 여러 개 둘 수 있습니다. 반환 타입, 접근 제어자, static 여부만 다른 것은 오버로딩이 아니며 중복 선언 에러가 납니다. static 메서드끼리, private 생성자끼리도 오버로딩할 수 있습니다."}], "trap": "'public 클래스에는 main이 있어야 한다'는 흔한 오해를 노립니다. '필드는 초기화해야 사용 가능'은 지역 변수 규칙과 헷갈리게 만드는 문장입니다.", "tags": ["클래스 구조", "필드 기본값", "static 메서드 오버로딩"], "occurrences": ["certleader-A Q44 p12", "2passeasy Q26 p22"], "verified": "compiled", "fixes": [], "no": 3}, {"id": 24, "topic": "basics", "parts": [{"type": "text", "content": "Which three statements are true about the structure of a Java class? (Choose three.)"}], "options": [{"key": "A", "text": "A class cannot have the same name as its field.", "code": null}, {"key": "B", "text": "A public class must have a main method.", "code": null}, {"key": "C", "text": "A class can have final static methods.", "code": null}, {"key": "D", "text": "A class can have overloaded private constructors.", "code": null}, {"key": "E", "text": "Fields need to be initialized before use.", "code": null}, {"key": "F", "text": "Methods and fields are optional components of a class.", "code": null}], "correct": "CDF", "dumpAnswer": "BDE", "answerNote": "덤프 정답 BDE는 틀렸습니다. public 클래스에 main이 꼭 있어야 하는 것은 아니고(B 거짓), 필드는 기본값으로 자동 초기화되므로 사용 전에 초기화할 필요가 없습니다(E 거짓). 참인 문장은 C(final static 메서드 가능), D(private 생성자 오버로딩 가능), F(메서드와 필드는 선택 사항)이며, 실제 컴파일로 확인했습니다. 같은 문제의 변형인 Q003과 함께 보세요.", "summary": "클래스에는 final static 메서드와 오버로딩된 private 생성자를 둘 수 있고, 메서드와 필드는 모두 선택 사항입니다.", "walkthrough": "직접 컴파일해서 확인했습니다.\n- `public class Main { int Main; ... }`: 클래스 이름과 같은 이름의 필드도 컴파일됩니다(A 거짓).\n- `static final void f(){}`: final static 메서드는 문제없습니다(C 참). static 메서드는 원래 오버라이드되지 않지만 final을 붙이면 자식 클래스에서 같은 시그니처로 숨기는 것(hiding)도 막을 수 있습니다.\n- `private Main(){}`와 `private Main(int x){}`를 함께 선언할 수 있습니다(D 참).\n- 초기화하지 않은 필드 `int f;`를 출력하면 0이 나옵니다(E 거짓).\n- `class Empty {}`는 필드도 메서드도 없지만 컴파일됩니다(F 참). main이 없는 public 클래스도 마찬가지입니다(B 거짓).", "optionNotes": {"A": "거짓입니다. 클래스 이름과 필드 이름은 서로 다른 이름 공간에 있어서 `class Foo { int Foo; }`도 컴파일됩니다(관례상 권장하지는 않습니다).", "B": "거짓입니다. main은 실행 시작점이 될 클래스에만 필요하며 public 클래스라고 해서 필수는 아닙니다.", "C": "참입니다. `static final` 조합은 허용되며, 자식 클래스가 같은 static 메서드로 숨기는 것을 막습니다.", "D": "참입니다. 생성자는 접근 제어자와 상관없이 매개변수 목록만 다르면 오버로딩할 수 있습니다.", "E": "거짓입니다. 필드는 기본값(0, false, null 등)을 받으므로 초기화하지 않고 사용해도 됩니다. 사용 전 초기화가 필요한 것은 지역 변수입니다.", "F": "참입니다. `class A {}`처럼 필드와 메서드가 없어도 올바른 클래스 선언입니다."}, "concepts": [{"title": "필드 기본값과 지역 변수의 확정 할당", "body": "필드는 자동으로 기본값을 받지만 지역 변수는 그렇지 않습니다. 지역 변수를 대입 없이 읽으면 컴파일 에러가 납니다. 이 차이가 '초기화해야 한다/안 해도 된다' 문장의 참과 거짓을 가릅니다.\n```java\nclass T { int f; void m(){ int x; System.out.println(f); /* 0 */ /* System.out.println(x); 컴파일 에러 */ } }\n```"}, {"title": "static 메서드와 final", "body": "static 메서드는 오버라이드되지 않고, 자식 클래스에 같은 시그니처를 선언하면 숨김(hiding)이 됩니다. static 메서드에 final을 붙이면 이 숨김도 금지됩니다. 반면 abstract static 조합은 불가능합니다. abstract는 구현을 자식에게 맡기는데 static은 오버라이드가 안 되기 때문입니다."}, {"title": "private 생성자의 용도", "body": "private 생성자는 클래스 밖에서 `new`를 막을 때 씁니다. 싱글턴이나 유틸리티 클래스, 정적 팩토리 메서드 패턴에서 자주 보입니다. 다른 생성자와 마찬가지로 오버로딩할 수 있고, 같은 클래스 안에서는 `this(...)`나 `new`로 호출할 수 있습니다."}], "trap": "Q003과 문장 순서와 표현만 바꾼 변형입니다. 'Fields need to be initialized before use'를 참으로 고르게 유도하는데, 이 규칙은 지역 변수에만 해당합니다.", "tags": ["클래스 구조", "필드 기본값", "private 생성자 오버로딩"], "occurrences": ["certleader-A Q45 p12", "certleader-B Q97 p116", "certleader-C Q75 p154", "certleader-D Q41 p178"], "verified": "compiled", "fixes": [], "no": 4}, {"id": 37, "topic": "basics", "parts": [{"type": "text", "content": "Which three statements describe the object-oriented features of the Java language? (Choose three.)"}], "options": [{"key": "A", "text": "Objects cannot be reused.", "code": null}, {"key": "B", "text": "A subclass can inherit from a superclass.", "code": null}, {"key": "C", "text": "Objects can share behaviors with other objects.", "code": null}, {"key": "D", "text": "A package must contain a main class.", "code": null}, {"key": "E", "text": "Object is the root class of all other objects.", "code": null}, {"key": "F", "text": "A main method must be declared in every class.", "code": null}], "correct": "BCE", "dumpAnswer": "BCF", "answerNote": "덤프 정답 BCF는 틀렸습니다. F(모든 클래스에 main이 있어야 한다)는 명백히 거짓이고, E(Object는 모든 클래스의 루트)는 명백히 참입니다. 따라서 정답은 BCE입니다.", "summary": "Java 객체 지향의 특징은 상속(자식 클래스가 부모를 상속), 객체 간 동작 공유, 그리고 Object가 모든 클래스의 루트라는 점입니다.", "walkthrough": "각 문장을 Java의 OOP 규칙에 맞춰 보면 다음과 같습니다.\n- A: 객체와 클래스는 상속과 조합으로 재사용할 수 있으므로 거짓입니다.\n- B: `class Sub extends Super`처럼 자식 클래스가 부모 클래스를 상속할 수 있으므로 참입니다. 이때 부모 메서드를 반드시 오버라이드할 필요는 없고 그대로 물려받아도 됩니다.\n- C: 같은 클래스의 객체나 상속 관계의 객체는 동작(메서드)을 공유하므로 참입니다.\n- D: 패키지에 main 클래스가 있어야 한다는 규칙은 없으므로 거짓입니다.\n- E: `extends`를 쓰지 않은 클래스도 자동으로 `java.lang.Object`를 상속하므로 참입니다.\n- F: main은 실행 시작점이 될 클래스에만 필요하므로 거짓입니다.", "optionNotes": {"A": "거짓입니다. 상속과 조합으로 기존 클래스와 객체를 재사용하는 것이 OOP의 핵심 장점입니다.", "B": "참입니다. `extends`로 부모 클래스의 멤버를 물려받는 상속은 대표적인 객체 지향 특징입니다.", "C": "참입니다. 상속이나 같은 클래스의 인스턴스라는 관계를 통해 객체들은 같은 메서드(동작)를 공유합니다.", "D": "거짓입니다. 패키지에는 main이 있는 클래스가 하나도 없어도 됩니다.", "E": "참입니다. 모든 클래스는 직접 또는 간접적으로 `java.lang.Object`를 상속합니다.", "F": "거짓입니다. main은 `java` 명령으로 실행할 클래스에만 필요합니다."}, "concepts": [{"title": "java.lang.Object", "body": "`extends`를 쓰지 않은 클래스는 컴파일러가 자동으로 `extends Object`를 붙입니다. 그래서 모든 객체는 `toString()`, `equals()`, `hashCode()` 같은 Object의 메서드를 가지며, 모든 참조(배열 포함)를 Object 타입 변수에 대입할 수 있습니다. 인터페이스는 Object를 상속하지 않지만 인터페이스 타입 참조로도 Object의 public 메서드를 호출할 수 있습니다."}, {"title": "오버라이딩은 선택, abstract는 의무", "body": "자식 클래스는 부모의 메서드를 오버라이드하지 않고 그대로 물려받아 쓸 수 있습니다. 다만 abstract 클래스나 인터페이스의 abstract 메서드를 물려받은 구체(non-abstract) 클래스는 반드시 구현해야 하며, 그렇지 않으면 컴파일 에러가 납니다. 자식 클래스도 abstract로 선언하면 구현 의무를 다음 자식에게 넘길 수 있습니다."}], "trap": "'must'(반드시)가 들어간 문장은 대부분 거짓입니다. main이 모든 클래스나 패키지에 필요하다는 보기도 단골 오답입니다.", "tags": ["객체 지향 특징", "Object 루트 클래스"], "occurrences": ["2passeasy Q21 p22", "certleader-B Q88 p114", "certleader-D Q27 p177"], "verified": "reasoned", "fixes": ["보기 B 'A subclass must override the methods from a superclass.'는 문자 그대로 거짓이라 참인 보기가 C, E 둘뿐이므로, 같은 문제의 표준 문구(76번과 동일)인 'A subclass can inherit from a superclass.'로 복원"], "no": 5}, {"id": 46, "topic": "basics", "parts": [{"type": "text", "content": "Which two statements are true about Java byte code? (Choose two.)"}], "options": [{"key": "A", "text": "It can be serialized across network.", "code": null}, {"key": "B", "text": "It can run on any platform that has a Java compiler.", "code": null}, {"key": "C", "text": "It can run on any platform.", "code": null}, {"key": "D", "text": "It has \".java\" extension.", "code": null}, {"key": "E", "text": "It can run on any platform that has the Java Runtime Environment.", "code": null}], "correct": "AE", "dumpAnswer": "AE", "answerNote": "", "summary": "바이트코드(.class)는 네트워크로 전송할 수 있고, JRE(JVM)가 설치된 플랫폼이면 어디서든 실행됩니다.", "walkthrough": "javac는 `.java` 소스를 플랫폼과 무관한 바이트코드(`.class`)로 컴파일합니다. 이 바이트코드를 실제 기계에서 실행하는 것은 각 플랫폼용 JVM이며, JVM은 JRE에 들어 있습니다.\n- 그래서 \"JRE가 있는 플랫폼이면 실행된다\"(E)가 맞고, JVM이 없는 곳에서도 실행된다는 \"아무 플랫폼에서나\"(C)는 틀립니다.\n- 바이트코드는 실행할 때 컴파일러가 필요 없습니다. 컴파일러는 소스를 바이트코드로 만들 때만 씁니다(B 오답).\n- `.class` 파일은 그냥 바이트 배열이므로 네트워크로 전송하거나 직렬화해서 다른 JVM에 보낼 수 있습니다. 애플릿, RMI의 원격 클래스 로딩, 네트워크 ClassLoader가 이 방식을 씁니다(A).\n- `.java`는 소스 파일의 확장자이고 바이트코드의 확장자는 `.class`입니다(D 오답).\nA의 \"serialized\" 표현이 다소 어색하지만, 시험에서는 A와 E를 정답으로 봅니다.", "optionNotes": {"A": "정답입니다. 바이트코드는 플랫폼에 독립적인 바이트 데이터이므로 네트워크로 전송(직렬화)해 다른 JVM에서 로드할 수 있습니다.", "B": "바이트코드를 실행하는 데 필요한 것은 JVM(JRE)입니다. 컴파일러(JDK)만 있고 JRE가 없으면 실행할 수 없습니다.", "C": "JVM이 없는 플랫폼에서는 바이트코드를 실행할 수 없으므로 '어떤 플랫폼에서나'는 틀립니다.", "D": "`.java`는 소스 코드의 확장자이고, 바이트코드는 `.class` 파일에 저장됩니다.", "E": "정답입니다. 각 플랫폼용 JRE 안의 JVM이 바이트코드를 해석하거나 JIT 컴파일해서 실행합니다."}, "concepts": [{"title": "JDK, JRE, JVM의 역할", "body": "**JVM**은 바이트코드를 실행하는 가상 머신이고, **JRE**는 JVM과 표준 클래스 라이브러리를 합친 실행 환경입니다. **JDK**는 JRE에 `javac`, `jar`, `javadoc` 같은 개발 도구를 더한 것입니다. 실행만 하려면 JRE, 컴파일까지 하려면 JDK가 필요합니다. JVM 자체는 플랫폼마다 따로 구현되어 있고, 바이트코드는 플랫폼과 무관합니다."}, {"title": "Write Once, Run Anywhere", "body": "Java의 플랫폼 독립성은 \"소스 → 바이트코드\" 단계와 \"바이트코드 → 기계어\" 단계를 나눈 데서 나옵니다. 한 번 컴파일한 `.class`는 해당 플랫폼용 JVM만 있으면 다시 컴파일하지 않고 Windows, Linux, macOS에서 실행됩니다. 시험 보기에서 \"특정 플랫폼용으로 컴파일해야 한다\", \"컴파일러가 있어야 실행된다\", \"아무 플랫폼에서나 실행된다\"는 모두 함정입니다. 정답의 조건은 항상 \"JRE(JVM)가 있는 플랫폼\"입니다."}], "trap": "'Java 컴파일러가 있는 플랫폼'과 'JRE가 있는 플랫폼'을 섞어 놓아, 실행에 필요한 것이 컴파일러라고 착각하게 만듭니다.", "tags": ["바이트코드", "JVM/JRE", "플랫폼 독립성"], "occurrences": ["exambible Q10 p29", "certleader-B Q14 p104"], "verified": "reasoned", "fixes": [], "no": 6}, {"id": 50, "topic": "basics", "parts": [{"type": "text", "content": "Which statement is true about Java byte code?"}], "options": [{"key": "A", "text": "It can run on any platform.", "code": null}, {"key": "B", "text": "It can run on any platform only if it was compiled for that platform.", "code": null}, {"key": "C", "text": "It can run on any platform that has the Java Runtime Environment.", "code": null}, {"key": "D", "text": "It can run on any platform that has a Java compiler.", "code": null}, {"key": "E", "text": "It can run on any platform only if that platform has both the Java Runtime Environment and a Java compiler.", "code": null}], "correct": "C", "dumpAnswer": "D", "answerNote": "덤프 정답 D는 틀렸습니다. 바이트코드를 실행하는 데 필요한 것은 Java 컴파일러가 아니라 JRE(JVM)입니다. 덤프 해설에도 'bytecodes can then be run on any implementation of the Java VM'이라고 되어 있어 C의 근거가 됩니다. 컴파일러가 필요한 것은 소스를 바이트코드로 만드는 단계뿐입니다. 같은 주제를 다루는 46번 문제에서도 'JRE가 있는 플랫폼'(E)이 정답이고 '컴파일러가 있는 플랫폼'(B)은 오답입니다.", "summary": "바이트코드는 JRE(JVM)가 있는 플랫폼이면 어디서든 실행됩니다. 컴파일러는 실행에 필요하지 않습니다.", "walkthrough": "- javac가 만든 `.class` 바이트코드는 특정 CPU나 OS용 기계어가 아니라 JVM 명령어입니다.\n- 이 명령어를 실제로 실행하는 것은 각 플랫폼에 설치된 JVM이며, JVM은 JRE의 일부입니다.\n- 따라서 바이트코드의 실행 조건은 \"JRE가 있는가\" 하나뿐입니다(C).\n- 컴파일러는 소스 → 바이트코드 변환에만 쓰이므로 실행 조건이 아닙니다. 그래서 D와 E는 틀립니다.\n- JVM이 없으면 실행할 수 없으므로 A의 \"아무 플랫폼\"도 틀립니다.\n- 바이트코드는 플랫폼별로 따로 컴파일하지 않으므로 B도 틀립니다.\n덤프 해설의 \"You can compile your program into bytecodes on any platform that has a Java compiler\"는 **컴파일**에 관한 문장입니다. 바로 이어지는 문장이 실행 조건을 \"Java VM\"으로 말하고 있습니다.", "optionNotes": {"A": "JVM이 설치되지 않은 플랫폼에서는 바이트코드를 실행할 수 없으므로 틀립니다.", "B": "바이트코드는 플랫폼과 무관하므로 플랫폼별로 따로 컴파일할 필요가 없습니다. 플랫폼마다 달라지는 것은 JVM 구현입니다.", "C": "정답입니다. JRE 안의 JVM이 바이트코드를 해당 플랫폼에서 실행합니다.", "D": "컴파일러는 소스를 바이트코드로 만들 때만 필요합니다. 컴파일러만 있고 JRE가 없으면 실행할 수 없습니다(덤프 정답이지만 오답).", "E": "실행에는 JRE만 있으면 되고 컴파일러는 필요하지 않습니다. 'both'라는 조건이 지나칩니다."}, "concepts": [{"title": "JDK, JRE, JVM의 역할", "body": "**JVM**은 바이트코드를 실행하는 가상 머신이고, **JRE**는 JVM과 표준 클래스 라이브러리를 합친 실행 환경입니다. **JDK**는 JRE에 `javac` 같은 개발 도구를 더한 것입니다. 실행만 하려면 JRE, 컴파일까지 하려면 JDK가 필요합니다. 플랫폼마다 달라지는 것은 JVM 구현이고 바이트코드는 같습니다."}, {"title": "컴파일 단계와 실행 단계 구분", "body": "`javac Hello.java`는 컴파일 단계로, `Hello.class`를 만들며 JDK가 필요합니다. `java Hello`는 실행 단계로, JVM이 클래스를 로드하고 검증한 뒤 인터프리트하거나 JIT 컴파일해서 실행하며 JRE만 있으면 됩니다. 시험 보기에 컴파일러 조건이 섞여 있으면 실행에 관한 문장인지 컴파일에 관한 문장인지 먼저 구분하세요."}], "trap": "'Java 컴파일러가 있는 플랫폼'이라는 보기로 컴파일 조건과 실행 조건을 혼동하게 만듭니다. 덤프 정답도 이 함정에 빠져 있습니다.", "tags": ["바이트코드", "JVM/JRE", "플랫폼 독립성"], "occurrences": ["exambible Q21 p31", "surepassexam Q38 p58"], "verified": "reasoned", "fixes": [], "no": 7}, {"id": 76, "topic": "basics", "parts": [{"type": "text", "content": "Which three statements describe the object-oriented features of the Java language? (Choose three.)"}], "options": [{"key": "A", "text": "Objects cannot be reused.", "code": null}, {"key": "B", "text": "A subclass can inherit from a superclass.", "code": null}, {"key": "C", "text": "Objects can share behaviors with other objects.", "code": null}, {"key": "D", "text": "A package must contain more than one class.", "code": null}, {"key": "E", "text": "Object is the root class of all other objects.", "code": null}, {"key": "F", "text": "A main method must be declared in every class.", "code": null}], "correct": "BCE", "dumpAnswer": "BCF", "answerNote": "덤프 정답 BCF는 틀렸습니다. F \"모든 클래스에 main 메서드가 선언되어야 한다\"는 거짓입니다(main은 프로그램 시작점이 되는 클래스에만 있으면 됩니다). 반면 E \"Object는 다른 모든 객체의 루트 클래스이다\"는 참이므로 정답은 BCE입니다.", "summary": "상속(B), 행동 공유(C), 모든 클래스의 루트인 `Object`(E)가 Java의 객체 지향 특징입니다.", "walkthrough": "각 문장을 Java 언어 규칙에 비추어 판단합니다.\n- A: 객체 지향의 핵심 장점 중 하나가 재사용성(상속, 구성)이므로 거짓입니다.\n- B: `class Sub extends Super`로 하위 클래스가 상위 클래스를 상속합니다. 참입니다.\n- C: 상속이나 인터페이스 구현을 통해 여러 객체가 같은 메서드(행동)를 공유할 수 있습니다. 참입니다.\n- D: 패키지에는 클래스가 하나만 있어도 되고, 심지어 비어 있을 수도 있습니다. 거짓입니다.\n- E: `extends`를 명시하지 않은 클래스는 암묵적으로 `java.lang.Object`를 상속하므로 모든 클래스(배열 포함)의 최상위 조상은 `Object`입니다. 참입니다.\n- F: `main`은 실행 시작점이 될 클래스에만 필요합니다. 대부분의 클래스에는 main이 없습니다. 거짓입니다.\n따라서 정답은 B, C, E입니다.", "optionNotes": {"A": "객체 지향은 상속과 구성으로 코드와 객체를 재사용하는 것을 목표로 하므로 거짓입니다.", "B": "정답입니다. `extends`로 상위 클래스의 멤버를 물려받는 상속은 대표적인 객체 지향 특징입니다.", "C": "정답입니다. 상속이나 인터페이스로 여러 객체가 같은 행동(메서드)을 공유할 수 있고, 이것이 다형성의 기반입니다.", "D": "패키지에는 클래스가 하나만 있어도 됩니다. 패키지는 단지 이름 공간일 뿐입니다.", "E": "정답입니다. 모든 클래스는 직접 또는 간접적으로 `java.lang.Object`를 상속합니다.", "F": "`main` 메서드는 `java` 명령으로 실행할 클래스에만 필요하므로 거짓입니다. 덤프가 이 선택지를 정답에 넣은 것은 오류입니다."}, "concepts": [{"title": "java.lang.Object - 모든 클래스의 루트", "body": "`extends`를 쓰지 않은 클래스는 컴파일러가 자동으로 `extends Object`를 붙입니다. 따라서 모든 클래스와 배열은 `Object`의 `toString()`, `equals()`, `hashCode()`, `getClass()` 등을 물려받습니다. 어떤 객체든 `Object` 타입 변수에 대입할 수 있는 것도 이 때문입니다. Java는 클래스 단일 상속만 허용하므로 상속 계층은 `Object`를 뿌리로 하는 트리 구조가 됩니다. 인터페이스는 `Object`를 상속하지 않지만, 인터페이스 타입의 참조로도 `Object`의 public 메서드를 호출할 수 있습니다."}, {"title": "Java의 객체 지향 특징 정리", "body": "시험에서 자주 묻는 객체 지향 특징은 캡슐화(private 필드 + public 메서드), 상속(`extends`로 코드 재사용), 다형성(상위 타입 참조로 하위 객체를 다루고 오버라이딩된 메서드가 실행됨), 추상화(abstract 클래스·인터페이스)입니다. \"객체는 재사용할 수 없다\", \"패키지에는 클래스가 여러 개 있어야 한다\", \"모든 클래스에 main이 필요하다\" 같은 진술은 모두 거짓입니다. 플랫폼 독립성(바이트코드 + JVM)은 Java의 특징이지만 객체 지향 특징과는 별개라는 점도 구분하세요."}], "trap": "\"main 메서드\"는 Java 프로그램의 친숙한 요소라 참처럼 보이지만, 모든 클래스에 필요한 것은 아닙니다.", "tags": ["객체 지향 특징", "Object 클래스", "상속"], "occurrences": ["surepassexam Q32 p57"], "verified": "reasoned", "fixes": ["문제 끝에 빠진 '(Choose three.)'를 추가"], "no": 8}, {"id": 77, "topic": "basics", "parts": [{"type": "text", "content": "Given the code fragments:"}, {"type": "text", "content": "A.java:"}, {"type": "code", "content": "package p1;\npublic class A {\n}"}, {"type": "text", "content": "B.java:"}, {"type": "code", "content": "package p1.p2;\n//line n1\npublic class B {\n    public void doStuff () {\n        A b = new A ();\n    }\n}"}, {"type": "text", "content": "C.java:"}, {"type": "code", "content": "package p3;\n//line n2\npublic class C {\n    public static void main (String [] args) {\n        A o1 = new A ();\n        B o2 = new B ();\n    }\n}"}, {"type": "text", "content": "Which modification enables the code to compile?"}], "options": [{"key": "A", "text": "", "code": "Replace line n1 with:\nimport p1.*;\nReplace line n2 with:\nimport p1.p2.*;"}, {"key": "B", "text": "", "code": "Replace line n1 with:\nimport p1.A;\nReplace line n2 with:\nimport p1.*;"}, {"key": "C", "text": "", "code": "Replace line n1 with:\nimport p1.A;\nReplace line n2 with:\nimport p1.A;\nimport p1.p2.B;"}, {"key": "D", "text": "", "code": "Replace line n1 with:\nimport p1;\nReplace line n2 with:\nimport p1;\nimport p1.p2;"}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "B는 `p1.A`를, C는 `p1.A`와 `p1.p2.B`를 각각 import해야 하며, `import p1.*;`는 하위 패키지 `p1.p2`의 클래스를 가져오지 않습니다.", "walkthrough": "1. B.java는 `p1.p2` 패키지에 있고 `p1` 패키지의 `A`를 사용합니다. 이름이 비슷해도 `p1`과 `p1.p2`는 완전히 별개의 패키지이므로 `import p1.A;` 또는 `import p1.*;`가 필요합니다.\n2. C.java는 `p3` 패키지에 있고 `A`(p1)와 `B`(p1.p2)를 모두 사용하므로 두 클래스를 모두 import해야 합니다.\n3. 선택지 C는 n1에 `import p1.A;`, n2에 `import p1.A;`와 `import p1.p2.B;`를 넣으므로 세 파일 모두 컴파일됩니다(실제로 컴파일해 `C.class` 생성 확인).\n4. A와 B는 C.java에서 각각 `A` 또는 `B` 하나를 찾지 못해 \"cannot find symbol\" 에러가 납니다.\n5. D의 `import p1;`은 클래스 이름이나 `.*` 없이 패키지만 적은 것이라 문법 에러(`'.' expected`)입니다.", "optionNotes": {"A": "n1의 `import p1.*;`로 B.java는 컴파일되지만, C.java는 `import p1.p2.*;`만 있어 `p1` 패키지의 `A`를 찾지 못해 컴파일 에러입니다.", "B": "C.java의 `import p1.*;`는 `p1` 패키지의 클래스만 가져오고 하위 패키지 `p1.p2`의 `B`는 가져오지 않으므로 `B`를 찾지 못해 컴파일 에러입니다.", "C": "정답입니다. B.java는 `p1.A`를, C.java는 `p1.A`와 `p1.p2.B`를 모두 import하므로 컴파일됩니다.", "D": "`import p1;`처럼 패키지 이름만 import하는 문법은 없습니다. 단일 타입(`p1.A`) 또는 `p1.*` 형식이어야 하므로 컴파일 에러입니다."}, "concepts": [{"title": "import 문의 두 가지 형식", "body": "import에는 단일 타입 import(`import java.util.List;`)와 요청 시 타입 import(`import java.util.*;`) 두 가지가 있습니다. 와일드카드 `*`는 그 패키지에 직접 속한 타입만 가져오며 하위 패키지는 포함하지 않습니다. 즉 `import java.util.*;`로는 `java.util.function.Predicate`를 쓸 수 없습니다. `import p1;`처럼 패키지 이름만 쓰는 것, `import p1.*.*;`처럼 와일드카드를 중첩하는 것은 모두 문법 에러입니다. `java.lang` 패키지와 같은 패키지의 클래스는 import 없이 사용할 수 있습니다."}, {"title": "패키지는 계층이 아니라 별개의 이름 공간", "body": "`p1`과 `p1.p2`는 디렉터리 구조상 부모·자식처럼 보이지만 언어 차원에서는 아무 관계가 없는 독립 패키지입니다. 따라서 `p1.p2.B` 안에서 `p1.A`를 쓰려면 다른 패키지와 똑같이 import해야 하고, default(package-private) 접근 제어자로 선언된 멤버는 서로 접근할 수 없습니다. `package` 선언은 파일의 첫 문장(주석 제외)이어야 하고, `import`는 그 뒤, 클래스 선언 앞에 와야 합니다."}], "trap": "`import p1.*;`가 하위 패키지 `p1.p2`까지 가져온다고 착각하게 만드는 선택지 B가 핵심 함정입니다.", "tags": ["import 문", "패키지와 와일드카드", "하위 패키지"], "occurrences": ["surepassexam Q37 p58"], "verified": "compiled", "fixes": ["파일명 'A. java:', 'B. java:', 'C. java'를 'A.java:', 'B.java:', 'C.java:'로 수정", "C.java의 변수 이름 `01`, `02`(숫자로 시작해 식별자가 될 수 없음)를 `o1`, `o2`로 수정", "들여쓰기를 4칸으로 정리", "보기 A~D의 사라진 줄바꿈을 복원해 코드 블록으로 분리하고 `import p1. p2.*;`, `p1. A`, `p2.B ;` 등의 점 뒤 공백 제거"], "no": 9}, {"id": 100, "topic": "basics", "parts": [{"type": "text", "content": "Given the code fragment from three files:"}, {"type": "text", "content": "SalesMan.java:"}, {"type": "code", "content": "package sales;\npublic class SalesMan { }"}, {"type": "text", "content": "Product.java:"}, {"type": "code", "content": "package sales.products;\npublic class Product { }"}, {"type": "text", "content": "USMarket.java:"}, {"type": "code", "content": "1. package market;\n2. // insert code here\n3. public class USMarket {\n4.     SalesMan sm;\n5.     Product p;\n6. }"}, {"type": "text", "content": "Which code fragment, when inserted at line 2, enables the code to compile?"}], "options": [{"key": "A", "text": "", "code": "import sales.*;"}, {"key": "B", "text": "", "code": "import java.sales.products.*;"}, {"key": "C", "text": "", "code": "import sales;\nimport sales.products;"}, {"key": "D", "text": "", "code": "import sales.*;\nimport products.*;"}, {"key": "E", "text": "", "code": "import sales.*;\nimport sales.products.*;"}], "correct": "E", "dumpAnswer": "E", "answerNote": "", "summary": "와일드카드 import는 하위 패키지를 포함하지 않으므로 sales.*와 sales.products.*를 둘 다 import해야 합니다.", "walkthrough": "`USMarket`은 `sales.SalesMan`과 `sales.products.Product` 두 클래스를 사용합니다. 각 보기를 넣어 컴파일해 보았습니다.\n- A `import sales.*;`: `SalesMan`만 가져오고, 하위 패키지인 `sales.products`의 클래스는 가져오지 않으므로 `Product`에서 `cannot find symbol` 에러가 납니다.\n- B `import java.sales.products.*;`: `java.sales.products`라는 패키지가 없어 에러입니다.\n- C `import sales;`: import는 타입 이름이나 `패키지.*`만 허용하며 패키지 이름만 쓸 수 없어 문법 에러입니다.\n- D `import products.*;`: 최상위 `products` 패키지는 존재하지 않습니다. 패키지 이름은 항상 전체 이름으로 써야 합니다.\n- E: 두 패키지를 모두 import해서 컴파일에 성공합니다.", "optionNotes": {"A": "`sales.*`는 `sales` 패키지의 타입만 가져오고 하위 패키지 `sales.products`는 포함하지 않으므로 `Product`를 찾지 못합니다.", "B": "`java.sales.products`라는 패키지는 없습니다. 패키지 이름 앞에 `java.`를 임의로 붙일 수 없습니다.", "C": "`import sales;`처럼 패키지 이름만 import하는 문법은 없어서 컴파일 에러입니다.", "D": "`products`는 상대 이름일 뿐 실제 패키지는 `sales.products`이므로 `package products does not exist` 에러입니다.", "E": "정답입니다. `sales.*`로 `SalesMan`을, `sales.products.*`로 `Product`를 가져옵니다."}, "concepts": [{"title": "import 문의 형태", "body": "import에는 두 가지 형태만 있습니다(static import 제외).\n- 단일 타입 import: `import java.util.ArrayList;`\n- 요청 시 import(와일드카드): `import java.util.*;`\n와일드카드는 해당 패키지의 타입만 가져오고 하위 패키지는 가져오지 않습니다. 예를 들어 `import java.util.*;`로는 `java.util.function.Predicate`를 쓸 수 없습니다. 패키지 이름만 쓰는 `import java.util;`는 문법 에러입니다. `java.lang` 패키지는 자동으로 import됩니다."}, {"title": "패키지 선언과 소스 파일 규칙", "body": "`package` 문은 파일의 첫 문장(주석 제외)이어야 하고, 그다음에 import, 그다음에 타입 선언이 옵니다. 한 소스 파일에는 public 최상위 타입이 최대 하나이며, 파일 이름은 그 public 타입 이름과 같아야 합니다. 패키지 이름은 항상 전체 이름(fully qualified)으로 쓰며, 패키지 사이에는 상속 관계가 없습니다."}], "trap": "`sales.*`가 하위 패키지 `sales.products`까지 포함할 것이라고 착각하게 만듭니다. 패키지는 계층처럼 보이지만 서로 독립적입니다.", "tags": ["import 규칙", "패키지", "와일드카드 import"], "occurrences": ["surepassexam Q118 p72"], "verified": "compiled", "fixes": ["세 번째 파일 이름 `Market.java`를 public 클래스 이름에 맞게 `USMarket.java`로 수정(파일 이름 불일치로 모든 보기가 컴파일 실패하는 문제 해소)"], "no": 10}, {"id": 128, "topic": "basics", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "MainTest.java:\n\npublic class MainTest {\n\n    public static void main(int[] args) {\n        System.out.println(\"int main \" + args[0]);\n    }\n    public static void main(Object[] args) {\n        System.out.println(\"Object main \" + args[0]);\n    }\n    public static void main(String[] args) {\n        System.out.println(\"String main \" + args[0]);\n    }\n}"}, {"type": "text", "content": "and commands:"}, {"type": "code", "content": "javac MainTest.java\njava MainTest 1 2 3"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "int main 1", "code": null}, {"key": "B", "text": "Object main 1", "code": null}, {"key": "C", "text": "String main 1", "code": null}, {"key": "D", "text": "Compilation fails", "code": null}, {"key": "E", "text": "An exception is thrown at runtime", "code": null}], "correct": "C", "dumpAnswer": "C", "answerNote": "", "summary": "JVM은 오직 `public static void main(String[])`만 진입점으로 호출하므로 `String main 1`이 출력됩니다.", "walkthrough": "1. 세 main 메서드는 매개변수 타입(int[], Object[], String[])이 달라 합법적인 오버로딩이므로 컴파일됩니다.\n2. `java MainTest 1 2 3`을 실행하면 JVM은 정확히 `public static void main(String[] args)` 시그니처를 찾아 호출합니다. 다른 오버로드는 고려하지 않습니다.\n3. args는 {\"1\", \"2\", \"3\"}이므로 `args[0]`은 \"1\"입니다.\n4. 출력은 `String main 1`입니다.", "optionNotes": {"A": "명령행 인자는 항상 String 배열로 전달되며, JVM은 `main(int[])`를 진입점으로 인식하지 않습니다.", "B": "String[]은 Object[]에 대입 가능하지만, JVM은 오버로딩 해석을 하지 않고 정확한 `main(String[])`만 찾습니다. 그리고 그 메서드가 존재합니다.", "C": "정답입니다. 정확한 시그니처의 `main(String[])`가 호출되어 첫 인자 \"1\"을 출력합니다.", "D": "main도 일반 static 메서드이므로 매개변수 타입이 다르면 얼마든지 오버로딩할 수 있습니다.", "E": "올바른 main이 있고 인자도 3개 전달되어 `args[0]` 접근에 문제가 없으므로 예외가 발생하지 않습니다."}, "concepts": [{"title": "프로그램 진입점 main의 조건", "body": "JVM이 실행하는 main은 `public`, `static`, 반환형 `void`, 이름 `main`, 매개변수 `String[]`(또는 `String...`)이어야 합니다. 매개변수 이름은 자유이고 `final`, `synchronized` 등 수식어를 추가할 수 있으며, `String args[]`, `String... args`도 허용됩니다. 조건을 어기면(예: static 누락) 컴파일은 되지만 실행 시 'main method not found' 오류가 납니다.\n```java\npublic static void main(String... a) {}     // OK\nstatic public void main(final String[] x) {} // OK\n// public void main(String[] a) {}          // 컴파일 OK, 실행 불가\n```"}, {"title": "명령행 인자", "body": "`java 클래스명` 뒤의 값들이 공백 기준으로 나뉘어 String 배열로 전달됩니다. 클래스 이름 자체는 포함되지 않으므로 `args[0]`은 첫 번째 인자입니다. 인자가 없으면 길이 0인 배열(null 아님)이 전달됩니다."}], "trap": "Object[]가 String[]를 받을 수 있다는 점이나 오버로딩 자체를 문제 삼아 B나 D를 고르게 만듭니다.", "tags": ["main 메서드 시그니처", "메서드 오버로딩", "명령행 인자"], "occurrences": ["surepassexam Q215 p93"], "verified": "compiled", "fixes": [], "no": 11}, {"id": 131, "topic": "basics", "parts": [{"type": "text", "content": "Given the content of three files:"}, {"type": "code", "content": "A.java:\n\npublic class A {\n    public void a() {}\n    int a;\n}\n\nB.java:\n\npublic class B {\n    private int doStuff() {\n        private int x = 100;\n        return x++;\n    }\n}\n\nC.java:\n\nimport java.io.*;\npackage p1;\nclass A {\n    public void main(String fileName) throws IOException { }\n}"}, {"type": "text", "content": "Which statement is true?"}], "options": [{"key": "A", "text": "Only the A.java file compiles successfully.", "code": null}, {"key": "B", "text": "Only the B.java file compiles successfully.", "code": null}, {"key": "C", "text": "Only the C.java file compiles successfully.", "code": null}, {"key": "D", "text": "The A.java and B.java files compile successfully.", "code": null}, {"key": "E", "text": "The B.java and C.java files compile successfully.", "code": null}, {"key": "F", "text": "The A.java and C.java files compile successfully.", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "A.java만 컴파일되며, B.java는 지역변수에 `private`를 붙여서, C.java는 `import`가 `package`보다 앞에 있어서 실패합니다.", "walkthrough": "1. A.java: 메서드 `a()`와 필드 `a`는 이름이 같아도 네임스페이스가 달라 공존할 수 있습니다. public 클래스 A가 A.java에 있으므로 컴파일됩니다.\n2. B.java: 메서드 안의 지역변수에는 접근 제어자(`private`, `public`, `protected`)나 `static`을 붙일 수 없습니다(허용되는 수식어는 `final`뿐). 따라서 `private int x = 100;`에서 컴파일 에러가 납니다.\n3. C.java: package 선언은 파일에서 주석을 제외한 첫 문장이어야 합니다. `import java.io.*;` 뒤에 `package p1;`이 오므로 컴파일 에러입니다. (non-public 클래스 A를 C.java에 두는 것과 `main(String)` 메서드 자체는 문제가 아닙니다.)\n실제로 각 파일을 컴파일해 A만 성공함을 확인했습니다.", "optionNotes": {"A": "정답입니다. 같은 이름의 메서드와 필드는 합법이고 다른 오류가 없습니다.", "B": "B.java는 지역변수에 `private`를 붙여 'illegal start of expression' 에러가 납니다.", "C": "C.java는 `package` 문이 `import` 뒤에 있어 컴파일 에러입니다. package는 반드시 맨 처음이어야 합니다.", "D": "A.java는 컴파일되지만 B.java는 지역변수의 `private` 때문에 실패합니다.", "E": "B.java(지역변수 private)와 C.java(package 위치) 둘 다 실패합니다.", "F": "A.java는 성공하지만 C.java는 import가 package보다 앞에 있어 실패합니다."}, "concepts": [{"title": "소스 파일의 구성 순서", "body": "한 .java 파일은 `package` 선언(0~1개) → `import` 문(0개 이상) → 타입 선언 순서여야 합니다. 주석은 어디에나 올 수 있습니다. public 최상위 클래스는 파일당 최대 1개이고 파일 이름과 같아야 하며, public이 아닌 클래스는 파일 이름과 달라도 됩니다(C.java의 class A처럼).\n```java\npackage p1;           // 1. 반드시 처음\nimport java.io.*;     // 2.\npublic class C { }    // 3.\n```"}, {"title": "지역변수에 쓸 수 있는 수식어", "body": "지역변수와 매개변수에는 `final`만 붙일 수 있습니다. `private`, `public`, `protected`, `static`, `transient`, `volatile`은 필드에만 쓸 수 있어 지역변수에 붙이면 컴파일 에러입니다. 지역변수는 기본값이 없으므로 사용 전에 반드시 초기화해야 합니다."}, {"title": "필드·메서드 이름 공존", "body": "Java는 필드, 메서드, 타입 이름을 문맥으로 구분하므로 `int a;`와 `void a()`를 한 클래스에 동시에 둘 수 있습니다. 심지어 클래스 이름과 같은 메서드(반환형이 있으면 생성자가 아닌 일반 메서드)도 합법입니다."}], "trap": "A.java에서 필드와 메서드 이름이 같은 것을 에러로 보게 만들고, C.java의 import/package 순서처럼 눈에 덜 띄는 오류를 놓치게 만듭니다.", "tags": ["소스 파일 구조(package/import 순서)", "지역변수 접근 제어자", "필드와 메서드 이름 공존"], "occurrences": ["surepassexam Q226 p95"], "verified": "compiled", "fixes": ["보기 A·D·F의 파일명 `A.Java`를 `A.java`로 수정"], "no": 12}, {"id": 155, "topic": "basics", "parts": [{"type": "text", "content": "Which one of the following code examples uses valid Java syntax?"}], "options": [{"key": "A", "text": "", "code": "public class Boat {\n\n        public static void main (String [] args) {\n            System.out.println  (\"I float.\");\n            }\n}"}, {"key": "B", "text": "", "code": "public class Cake {\n        public static void main (String [] ) {\n            System.out.println  (\"Chocolate\");\n            }\n}"}, {"key": "C", "text": "", "code": "public class Dog {\n        public void main (String [] args) {\n            System.out.println  (\"Squirrel.\");\n            }\n}"}, {"key": "D", "text": "", "code": "public class Bank {\n        public static void main (String () args) {\n            System.out.println  (\"Earn interest.\");\n            }\n}"}], "correct": "A", "dumpAnswer": "A", "answerNote": "엄밀히 말하면 C(`public void main(String[] args)`)도 문법상으로는 컴파일되는 합법 코드입니다(javac로 확인). 다만 Java 8에서는 `static`이 없으므로 `java Dog`로 실행할 수 없어 \"Main method not found\" 오류가 납니다. 문제의 의도는 \"올바른 실행 가능한 main 메서드를 가진 코드\"이므로 A를 정답으로 봅니다. (참고: JDK 25 이후에는 인스턴스 main이 허용되어 C도 실행되지만 1Z0-808은 Java 8 기준입니다.)", "summary": "실행 진입점으로 쓸 수 있는 올바른 형태는 `public static void main(String[] args)`이고, 그 형태를 정확히 갖춘 것은 A뿐입니다.", "walkthrough": "각 보기를 실제로 컴파일해 보면 다음과 같습니다.\n- A `Boat`: `public static void main (String [] args)` → 컴파일되고 실행하면 `I float.`이 출력됩니다. 메서드 이름과 괄호 사이, `String`과 `[]` 사이의 공백은 문법적으로 아무 문제가 없습니다.\n- B `Cake`: `(String [] )`처럼 매개변수 이름이 없습니다 → `<identifier> expected` 컴파일 에러입니다.\n- C `Dog`: `static`이 빠졌습니다. 문법상 평범한 인스턴스 메서드라 컴파일은 되지만, Java 8 JVM은 `static` main만 진입점으로 인정하므로 실행하면 \"Main method not found in class Dog\" 오류가 납니다.\n- D `Bank`: `String ()`는 배열 표기가 아니며 문법 오류입니다 → `<identifier> expected` 컴파일 에러입니다.\n따라서 실행 가능한 프로그램으로서 올바른 것은 A입니다.", "optionNotes": {"A": "정답입니다. `public static void main(String[] args)`의 모든 요소를 갖췄고, 공백이 많은 것은 문법에 영향을 주지 않습니다.", "B": "매개변수는 반드시 `타입 이름` 형태여야 하는데 이름이 없어 `<identifier> expected` 컴파일 에러가 납니다.", "C": "`static`이 없어 Java 8에서는 진입점으로 인정되지 않습니다. 컴파일은 되지만 `java Dog` 실행 시 \"Main method not found\" 오류가 납니다.", "D": "배열은 `[]`로 표기해야 합니다. `String ()`는 잘못된 문법이라 컴파일 에러입니다."}, "concepts": [{"title": "Java 8에서 유효한 main 메서드", "body": "JVM이 진입점으로 인식하려면 `public`, `static`, 반환형 `void`, 이름 `main`, 매개변수 `String` 배열 하나가 필요합니다. 허용되는 변형으로는 `static public void main`(제어자 순서 무관), `String args[]`, `String... args`(가변 인자), 매개변수 이름 변경(`String[] x`), `final` 추가 등이 있습니다. `private`/`protected`, `static` 누락, 반환형 `int`는 컴파일은 되더라도 실행 시 오류가 납니다. `main`을 오버로딩해도 되지만 JVM은 `String[]` 버전만 호출합니다."}, {"title": "컴파일 에러 vs 실행 오류 구분", "body": "`public void main(String[] args)`나 `public static int main(String[] args)`는 이름이 main일 뿐 평범한 메서드라 컴파일은 성공합니다. 문제는 `java ClassName`으로 실행할 때 JVM이 진입점을 찾지 못한다는 점입니다. 반면 매개변수 이름 누락, `()`와 `[]` 혼동 같은 것은 문법 오류라 javac 단계에서 실패합니다. 시험에서 \"Compilation fails\"와 \"An exception/error at runtime\"을 구분하는 근거가 됩니다."}], "trap": "괄호 앞의 공백이나 `String []`처럼 공백이 섞인 A를 오히려 이상하게 보이게 만들고, 진짜 문제(이름 누락, `static` 누락, `()` 사용)는 눈에 덜 띄게 섞어 둡니다.", "tags": ["main 메서드 시그니처", "메서드 선언 문법", "실행 진입점"], "occurrences": ["certleader-C Q1 p140"], "verified": "compiled", "fixes": [], "no": 13}, {"id": 7, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class FieldInit {\n    char c;\n    boolean b;\n    float f;\n    void printAll() {\n        System.out.println (\"c = \" + c);\n        System.out.println (\"b = \" + b);\n        System.out.println (\"f = \" + f);\n    }\n    public static void main (String [] args) {\n        FieldInit f = new FieldInit ();\n        f.printAll ();\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "", "code": "c = \nb = false\nf = 0.0"}, {"key": at 출력 형식"], "occurrences": ["certleader-A Q7 p4", "surepassexam Q27 p56"], "verified": "compiled", "fixes": ["클래스 선언 `Fieldinit`을 main에서 쓰는 이름과 같은 `FieldInit`으로 수정", "보기의 `c=`, `c= null`, `c=0`을 코드가 실제로 출력하는 형식(`c = `, `c = null`, `c = 0`)에 맞게 공백 통일"], "no": 14}, {"id": 31, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class Test {\n    public static void main(String[] args) {\n        boolean a = new Boolean(Boolean.valueOf(args[0]));\n        boolean b = new Boolean(args[1]);\n        System.out.println(a + \" \" + b);\n    }\n}"}, {"type": "text", "content": "And given the commands:"}, {"type": "code", "content": "javac Test.java\njava Test 1 null"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "1 null", "code": null}, {"key": "B", "text": "true false", "code": null}, {"key": "C", "text": "false false", "code": null}, {"key": "D", "text": "true true", "code": null}, {"key": "E", "text": "A ClassCastException is thrown at runtime.", "code": null}], "correct": "C", "dumpAnswer": "D", "answerNote": "덤프 정답 D(true true)는 틀렸습니다. `Boolean.valueOf(\"1\")`과 `new Boolean(\"null\")`은 문자열이 대소문자 무시하고 \"true\"일 때만 true이므로 둘 다 false입니다. 실제로 `java Test 1 null`을 실행해 `false false`를 확인했습니다.\n\n**덤프 사본 비교:** 문자열로 Boolean을 만들면 대소문자 무시하고 \"true\"일 때만 true이므로, \"1\"과 \"null\"은 모두 false가 되어 `false false`입니다. 비슷한 변형(`java Test TRUE null`)이라면 `true false`가 맞고, 어느 경우든 D는 틀렸습니다.", "summary": "문자열로 Boolean을 만들면 \"true\"(대소문자 무시)일 때만 true이고, \"1\"이나 \"null\"은 false가 됩니다.", "walkthrough": "1. `java Test 1 null`이므로 `args[0] = \"1\"`, `args[1] = \"null\"`(문자열)입니다.\n2. `Boolean.valueOf(\"1\")`은 문자열이 \"true\"가 아니므로 `Boolean.FALSE`를 반환합니다.\n3. `new Boolean(Boolean.FALSE)`: Boolean 생성자는 `Boolean(boolean)`과 `Boolean(String)` 두 개입니다. Boolean 객체가 언박싱되어 `Boolean(boolean)`이 선택되고 false 객체가 만들어집니다.\n4. 이 Boolean 객체가 `boolean a`에 대입되면서 다시 언박싱되어 a = false입니다.\n5. `new Boolean(\"null\")`도 문자열이 \"true\"가 아니므로 t": "Area is 3.0", "code": null}, {"key": "C", "text": "Compilation fails at line n1", "code": null}, {"key": "D", "text": "Compilation fails at line n2.", "code": null}], "correct": "D", "dumpAnswer": "D", "answerNote": "모든 덤프 사본의 정답이 D입니다. 실제로 컴파일하면 line n2에서 `variable p/b/h might not have been initialized` 에러가 납니다. 참고로 line n2를 if 블록 안에 두면 에러 없이 `Area is 6.0`(A)이 출력됩니다.", "summary": "지역 변수 `p`, `b`, `h`는 if 문 안에서만 값을 받으므로 if 블록 밖의 line n2에서 '초기화되지 않았을 수 있음' 컴파일 에러가 납니다.", "walkthrough": "1. line n1에서 지역 변수 `p`, `b`, `h`를 선언하지만 초기화하지 않습니다. 같은 이름의 인스턴스 필드 `b`, `h`를 가리는 것(섀도잉)은 합법이므로 line n1은 문제가 없습니다.\n2. 지역 변수에는 기본값이 없으므로, 읽기 전에 반드시 값이 대입되었다는 것을 컴파일러가 증명할 수 있어야 합니다(definite assignment).\n3. `area == 0`은 상수 표현식이 아니므로 컴파일러는 if 블록이 실행되지 않는 경로도 있다고 봅니다. 실행 시점에 `area`가 실제로 0이라는 사실은 고려하지 않습니다.\n4. 따라서 line n2에서 `p`, `b`, `h`를 읽는 것은 컴파일 에러입니다. javac는 세 변수 모두에 대해 `might not have been initialized`를 보고합니다.\n참고로 line n2가 if 블록 안에 있었다면 블록 안에서는 세 변수가 모두 대입된 상태이므로 컴파일되고, 0.5 × 3 × 4 = 6.0이 출력됩니다.", "optionNotes": {"A": "line n2가 if 블록 안에 있었다면 나오는 출력입니다. 이 코드에서는 컴파일 에러가 나므로 출력되지 않습니다.", "B": "인스턴스 필드 `b = 2`, `h = 3`을 쓴다고 착각한 값(0.5×2×3)입니다. 지역 변수가 필드를 가리고, 애초에 static `main`에서는 인스턴스 필드를 이름만으로 쓸 수 없습니다.", "C": "지역 변수가 인스턴스 필드와 이름이 같아도 섀도잉으로 허용되고, 초기화하지 않은 선언도 합법이므로 line n1은 컴파일됩니다.", "D": "정답입니다. if 블록 밖에서 초기화가 보장되지 않은 지역 변수를 읽으므로 line n2에서 컴파일 에러가 납니다."}, "concepts": [{"title": "지역 변수의 명시적 초기화(definite assignment)", "body": "인스턴스 변수와 static 변수는 기본값(0, false, null)을 갖지만 **지역 변수에는 기본값이 없습니다**. 지역 변수를 읽기 전에 모든 실행 경로에서 값이 대입되어야 하며, 이를 컴파일러가 흐름 분석으로 확인합니다. if에 else가 없으면 값이 대입되지 않는 경로가 생깁니다. 조건이 `true` 같은 컴파일 타임 상수일 때만 컴파일러가 그 분기를 확정적으로 봅니다.\n```java\nint x;\nif (flag) x = 1;\nSystem.out.println(x);   // 에러\nint y;\nif (flag) y = 1; else y = 2;\nSystem.out.println(y);   // OK\n```\n선언만 하고 읽지 않으면 에러가 아닙니다."}, {"title": "섀도잉(shadowing)", "body": "메서드 안에서 필드와 같은 이름의 지역 변수를 선언하면 그 범위 안에서는 지역 변수가 우선합니다. 필드에 접근하려면 `this.b`(인스턴스 필드)나 `Triangle.area`(static 필드)처럼 한정해야 합니다. 단, 같은 메서드 안에서 이미 있는 팅이 없으면 컴파일 에러입니다.", "B": "int → float는 확장 변환이라 자동으로 허용됩니다.", "C": "float → double은 확장 변환이라 자동으로 허용됩니다.", "D": "정답입니다. double을 float에 대입하는 축소 변환이라 컴파일 에러입니다.", "E": "int → double은 확장 변환이라 자동으로 허용됩니다.", "F": "정답입니다. double을 int에 대입하는 축소 변환이라 컴파일 에러입니다."}, "concepts": [{"title": "기본형 확장 변환과 축소 변환", "body": "자동(묵시적) 변환 순서는 `byte → short → int → long → float → double`이고 `char → int`도 확장입니다. 이 방향은 캐스팅 없이 대입할 수 있습니다. long → float처럼 크기는 작아도 표현 범위가 넓으면 확장으로 칩니다. 반대 방향은 축소 변환이라 `(int) 3.9`처럼 명시적으로 캐스팅해야 하며, 소수점 이하는 버려집니다(3)."}, {"title": "리터럴과 상수 대입의 예외", "body": "정수 리터럴은 기본이 `int`, 실수 리터럴은 기본이 `double`입니다. 그래서 `float f = 1.5;`는 에러이고 `1.5f`라고 써야 합니다. 다만 `byte b = 10;`처럼 **int 컴파일 타임 상수**가 대상 타입(byte/short/char) 범위 안이면 캐스팅 없이 대입할 수 있습니다. 이 예외는 변수(`byte b = i;`)나 long/float/double 상수에는 적용되지 않습니다. 복합 대입 연산자(`b += 5`)는 묵시적 캐스팅을 포함하므로 컴파일됩니다."}], "trap": "float와 double 사이에도 축소 변환이 있다는 점을 놓치게 만듭니다. double → float(10행)도 캐스팅이 필요합니다.", "tags": ["기본형 확장/축소 변환", "lossy conversion"], "occurrences": ["surepassexam Q2 p48"], "verified": "compiled", "fixes": ["문제 끝에 빠진 '(Choose three.)'를 추가"], "no": 17}, {"id": 63, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public class App {\n\n    public static void main(String[] args) {\n        Boolean[] bool = new Boolean[2];\n\n        bool[0] = new Boolean(Boolean.parseBoolean(\"true\"));\n        bool[1] = new Boolean(null);\n\n        System.out.println(bool[0] + \" \" + bool[1]);\n    }\n}"}, {"type": "text", "content": "What is the result?"}], "options": [{"key": "A", "text": "true false", "code": null}, {"key": "B", "text": "true null", "code": null}, {"key": "C", "text": "Compilation fails", "code": null}, {"key": "D", "text": "A NullPointerException is thrown at runtime", "code": null}], "correct": "A", "dumpAnswer": "A", "answerNote": "", "summary": "`new Boolean(null)`은 `Boolean(String)` 생성자를 호출하고, 문자열이 \"true\"가 아니면(null 포함) false가 되므로 `true false`가 출력됩니다.", "walkthrough": "1. `Boolean.parseBoolean(\"true\")`는 기본형 `true`를 반환합니다. 이 값으로 `new Boolean(true)`가 되어 `bool[0]`은 true입니다.\n2. `new Boolean(null)`: `Boolean`에는 `Boolean(boolean)`과 `Boolean(String)` 생성자가 있습니다. `null`은 기본형 `boolean`이 될 수 없으므로 참조형인 `Boolean(String)`만 후보가 되고, 모호하지 않아 컴파일됩니다.\n3. `Boolean(String s)`는 `s`가 null이 아니고 대소문자 무시로 `\"true\"`와 같을 때만 true이며, 그 밖에는 false입니다. null을 넣어도 예외가 발생하지 않고 false가 됩니다.\n4. 출력: `bool[0] + \" \" + bool[1]` → `Boolean.toString()`으로 `true false`가 출력됩니다.\nJava 9부터 `Boolean` 생성자는 deprecated되었지만 Java 8 기준으로는 정상 코드입니다.", "optionNotes": {"A": "정답입니다. `bool[0]`은 true, `bool[1]`은 false이므로 `true false`가 출력됩니다.", "B": "`new Boolean(null)`은 null을 담은 객체가 아니라 false 값을 가진 Boolean 객체를 만듭니다. 생성자는 null을 반환하지 않습니다.", "C": "`null`은 `boolean`으로 변환될 수 없으므로 `Boolean(String)` 하나만 적용 가능해 모호성 없이 컴파일됩니다.", "D": "`Boolean(String)`은 내부에서 `parseBoolean`을 쓰며, null을 false로 처리하고 예외를 던지지 않습니다."}, "concepts": [{"title": "Boolean 변환 메서드의 null 처리", "body": "`Boolean.parseBoolean(s)`, `Boolean.valueOf(String s)`, `new Boolean(String s)`는 모두 `s`가 대소문자 무시로 \"true\"일 때만 true이고, null이나 \"yes\", \"1\" 같은 다른 문자열이면 false입니다. 예외를 던지지 않는다는 점이 `Integer.parseInt(null)`(NumberFormatException)과 다릅니다. 반면 `Boolean b = null; if (b) ...`처럼 null인 Boolean을 언박싱하면 NullPointerException이 발생합니다."}, {"title": "null 인자와 오버로딩 해석", "body": "`null`은 모든 참조 타입에 대입할 수 있지만 기본형에는 대입할 수 없습니다. 그래서 `m(int)`와 `m(String)`이 있으면 `m(null)`은 `m(String)`을 호출합니다. 참조형 후보가 여럿이면 가장 구체적인 타입을 고릅니다. `m(Object)`와 `m(String)`이면 String입니다. 상속 관계가 없는 두 타입(`m(String)`, `m(Integer)`)이면 `reference to m is ambiguous` 컴파일 에러가 납니다."}], "trap": "`new Boolean(null)`이 NullPointerException이나 모호성 컴파일 에러를 일으킬 것처럼 보이게 하지만, 실제로는 false가 됩니다.", "tags": ["Boolean 래퍼 클래스", "null 인자 오버로딩", "Boolean.parseBoolean"], "occurrences": ["surepassexam Q6 p51"], "verified": "compiled", "fixes": ["보기 A, B의 대문자 'True'를 실제 출력과 같은 소문자 'true'로 수정"], "no": 18}, {"id": 83, "topic": "datatypes", "parts": [{"type": "text", "content": "Given:"}, {"type": "code", "content": "public
